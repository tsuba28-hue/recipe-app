小松菜と油揚げの煮びたし|小松菜:1束,油揚げ:1枚,しめじ:1/2パック|だし:250ml,薄口しょうゆ:大さじ1,しょうゆ:小さじ1,みりん:大さじ1,砂糖:小さじ1/2,塩:少々,しょうが:少々|小松菜は根元を落として4cm長さに切り、茎と葉に分ける。油揚げは熱湯をかけて油抜きし、短冊切り。しめじはほぐす。^鍋にだし・薄口しょうゆ・しょうゆ・みりん・砂糖・塩を入れて中火で煮立て、油揚げとしめじを入れて3分煮る（油揚げとしめじからうまみが出る）。^小松菜の茎を入れて1分、葉を加えて1分煮る（茎から入れて火の通りを揃える。煮すぎると色が悪くなる）。^火を止め、すりおろししょうがを加え、そのまま10分おいて味を含ませる。^煮汁ごと器に盛る。冷やしてもおいしい。|味の決め手は「油揚げ＋しめじ」のうまみ。^しょうがを少し加えると、香りが立って上品に。
きんぴらごぼう|ごぼう:1本,にんじん:1/2本|ごま油:大さじ1,赤唐辛子:1/2本,酒:大さじ1,砂糖:大さじ1,みりん:大さじ1,しょうゆ:大さじ1.5,いりごま:小さじ2,七味唐辛子:少々|ごぼうはたわしで皮をこそげ（皮の近くに香りがあるので、むきすぎない）、5cm長さの細切りにして水に3分さらす（さらしすぎると香りも抜ける）。にんじんも同じ太さの細切り。唐辛子は種を取って小口切り。^フライパンにごま油と唐辛子を中火で熱し、水気を切ったごぼうを入れて4分、しっかり炒める（ごぼうの香ばしさを引き出す。透き通ってしんなりするまで）。^にんじんを加えて1分炒め、酒を加えて30秒。^砂糖・みりんを加えて1分炒め、しょうゆを加えて中火で2〜3分、汁気がなくなって照りが出るまで炒め煮にする（砂糖が先、しょうゆは後。甘みを入れてから香りづけ）。^いりごまをふり、七味をふる。|味の決め手は「ごぼうを4分しっかり炒める」ことと「砂糖→しょうゆの順」。^汁気を飛ばし切ると、冷めてもおいしく、お弁当にも。
れんこんのきんぴら|れんこん:250g|ごま油:大さじ1,赤唐辛子:1/2本,酒:大さじ1,砂糖:大さじ1,みりん:大さじ1,しょうゆ:大さじ1.5,酢:小さじ1,いりごま:小さじ1|れんこんは皮をむいて3mm厚の半月切りにし、酢水に5分さらしてアクを抜き、水気を拭く（白くシャキッと仕上がる）。^フライパンにごま油と唐辛子（輪切り）を中火で熱し、れんこんを4分、透き通って縁が少し色づくまで炒める。^酒・砂糖・みりんを加えて1分、しょうゆを加えて中火で2分、汁気がなくなるまで炒め絡める。^最後に酢を少し加えて30秒（酢でシャキシャキ感が際立ち、味が引き締まる）。いりごまをふる。|味の決め手は「最後に酢を少し」。シャキシャキ感と後味のキレが出る。^れんこんを少し焼き付けるように炒めると、香ばしさが加わる。
ひじきの煮物|乾燥ひじき:20g,にんじん:1/3本,油揚げ:1枚,大豆(水煮):60g,こんにゃく:1/4枚,干ししいたけ:2個|ごま油:大さじ1,だし:150ml,酒:大さじ1,砂糖:大さじ1.5,みりん:大さじ1.5,しょうゆ:大さじ2|ひじきはたっぷりの水に20分つけてもどし、ざるに上げて洗う。干ししいたけはもどして細切り（もどし汁はだしに加える）。^にんじんは細切り、油揚げは油抜きして細切り、こんにゃくは細切りにして下ゆで。大豆は水気を切る。^鍋にごま油を中火で熱し、ひじきを3分炒める（磯臭さが抜け、コクが出る）。にんじん・こんにゃく・しいたけ・油揚げ・大豆を加えて2分炒める。^だし（しいたけのもどし汁を含む）・酒・砂糖・みりんを加えて煮立て、落としぶたをして中火で8分煮る。^しょうゆを加えてさらに5〜7分、煮汁がほとんどなくなるまで煮る。^火を止めてそのまま冷ます（冷める間に味がしみる）。|味の決め手は「ひじきを先に炒める」ことと「干ししいたけのもどし汁」。^冷めるときに味がしみるので、作り置きにぴったり。
切り干し大根の煮物|切り干し大根:40g,にんじん:1/3本,油揚げ:1枚,干ししいたけ:2個|ごま油:小さじ2,だし:150ml,酒:大さじ1,砂糖:大さじ1,みりん:大さじ1,しょうゆ:大さじ1.5,薄口しょうゆ:小さじ1|切り干し大根はさっと洗い、たっぷりの水に15分つけてもどす。もみ洗いして水気を絞り、食べやすく切る。もどし汁は100ml取っておく（切り干し大根の甘みとうまみが出ている）。干ししいたけももどして細切り。^にんじんは細切り、油揚げは油抜きして細切り。^鍋にごま油を中火で熱し、切り干し大根を2分炒め、にんじん・しいたけ・油揚げを加えて1分炒める。^だし・切り干しのもどし汁・しいたけのもどし汁・酒・砂糖・みりんを加えて煮立て、落としぶたをして弱めの中火で10分煮る。^しょうゆ・薄口しょうゆを加えて5分、煮汁が少し残るくらいで火を止める。冷める間に味がしみる。|味の決め手は「切り干し大根のもどし汁」。甘みとうまみが格段に増す。^煮汁を少し残すと、しっとりした仕上がりに。
白和え|木綿豆腐:1/2丁,ほうれん草:1/2束,にんじん:1/4本,こんにゃく:1/4枚,しいたけ:2個|練りごま:大さじ1,すりごま:大さじ1,砂糖:大さじ1,白味噌:小さじ2,薄口しょうゆ:小さじ1,塩:少々,だし:100ml,薄口しょうゆ:小さじ1,砂糖:小さじ1|豆腐はペーパーで包み、重しをして30分しっかり水切りする（重さが2/3になるのが目安。水っぽくならない最大の鍵）。^にんじん・こんにゃく・しいたけは細切り。小鍋にだし・薄口しょうゆ小さじ1・砂糖小さじ1と一緒に入れ、中火で5分、汁気がなくなるまで煮て冷ます（具に下味をつけると、和え衣と一体になる）。^ほうれん草は塩ゆでして水気を絞り、3cm長さ。^和え衣：豆腐をすり鉢でなめらかにすり（裏ごしすると料亭風）、練りごま・すりごま・砂糖・白味噌・薄口しょうゆ・塩を加えてよく混ぜる（練りごまと白味噌で、コクと甘みのある上品な白和えに）。^具の汁気をよく切って和える。食べる直前に和えるのがベスト。|味の決め手は「豆腐の水切り」と「練りごま＋白味噌」。^具に下味をつけておくのが、白和えをおいしくするプロのひと手間。
なすの煮びたし|なす:4本,しょうが:1かけ,小ねぎ:適量|サラダ油:大さじ3,だし:250ml,しょうゆ:大さじ1.5,薄口しょうゆ:小さじ1,みりん:大さじ2,砂糖:小さじ1,かつお節:1パック|なすはへたを取って縦半分に切り、皮目に斜めに細かく切り込みを入れる（味がしみ、皮がやわらかくなる）。長さを半分に切る。^浸し地：鍋にだし・しょうゆ・薄口しょうゆ・みりん・砂糖を入れてひと煮立ちさせる。^フライパンにサラダ油を中火で熱し、なすを皮目から入れて3分、返して2分、全体がしんなりするまで揚げ焼きにする（油で焼くと皮が鮮やかな紫に。コクも出る）。^焼いたなすを熱いうちに浸し地に入れ、中火で2分煮る。^火を止めてすりおろしたしょうがを加え、そのまま冷ます（冷める間に味がしみる）。^器に盛り、かつお節と小ねぎをのせる。冷蔵庫で冷やしてもおいしい。|味の決め手は「なすを油で焼いてから浸す」こと。とろとろで色鮮やか、コクが出る。^冷やすと夏の定番の一品に。
冷奴|絹ごし豆腐:1丁,小ねぎ:適量,みょうが:1個,大葉:3枚,しょうが:1かけ,かつお節:1パック|しょうゆ:大さじ1,みりん:小さじ1,かつお節:2g,ごま油:少々|だししょうゆ：小鍋にみりんを入れて煮立て、しょうゆとかつお節2gを加えて弱火で30秒、こして冷ます（かつおの香りがついたしょうゆで、冷奴が料亭の味に）。^豆腐はペーパーに包んで冷蔵庫で15分おき、軽く水切りする（水っぽさが抜けて味が締まる）。^小ねぎは小口切り、みょうが・大葉はせん切り、しょうがはすりおろす。^豆腐を食べやすく切って器に盛り、薬味をたっぷりのせ、かつお節をのせる。^食べる直前にだししょうゆをかけ、ごま油を数滴たらす。|味の決め手は「自家製だししょうゆ」と「薬味たっぷり」。^ごま油を数滴たらすと、香りでぐっとおいしくなる。
枝豆|枝豆:300g|塩(塩もみ用):大さじ1,水:1000ml|枝豆は枝から外し、さやの両端をキッチンばさみで少し切り落とす（塩味が中の豆まで入る）。^ボウルに枝豆と塩大さじ1/2を入れ、こすり合わせるように1分もんで産毛を取る（産毛を取ると、口当たりがよく、塩味もなじむ）。洗わずにそのまま使う。^鍋に水1Lを沸かして残りの塩を入れ（4%の濃い塩水がポイント）、もんだ塩ごと枝豆を入れ、強火で4〜5分ゆでる。1つ食べてみて、少し歯ごたえが残るくらいで引き上げる。^ざるに上げ、水にとらずにうちわであおいで急いで冷ます（水にとると水っぽくなり、風味が抜ける）。^熱いうちに塩少々をふる。|味の決め手は「4%の濃い塩水」と「水にとらずにあおいで冷ます」こと。居酒屋の枝豆の味に。^ゆで時間は豆の大きさで変わるので、必ず味見を。
きゅうりとわかめの酢の物|きゅうり:2本,乾燥わかめ:4g,しらす:20g,しょうが:1かけ|塩:小さじ1/3,酢:大さじ3,砂糖:大さじ1.5,だし:大さじ2,薄口しょうゆ:小さじ1,塩:少々,いりごま:小さじ1|三杯酢：小鍋にだし・砂糖・塩を入れて温めて溶かし、冷めたら酢・薄口しょうゆを加える（だしで割ると、ツンとこない、まろやかな酢の物に）。^きゅうりは薄い輪切りにして塩小さじ1/3をふって5分おき、しんなりしたら水気をしっかり絞る。^わかめは水に5分つけてもどし、熱湯にさっとくぐらせて冷水にとる（色が鮮やかになり、磯臭さが抜ける）。水気を絞って食べやすく切る。^しょうがはせん切り（針しょうが）にして水にさらす。^食べる直前にきゅうり・わかめ・しらすを三杯酢で和える。器に盛り、針しょうがといりごまをのせる。|味の決め手は「だし入りの三杯酢」。まろやかで後を引く。^しらすを加えると、うまみと塩気でワンランク上の一品に。
きゅうりの浅漬け|きゅうり:3本|塩:小さじ1,砂糖:小さじ1/2,昆布:1枚,赤唐辛子:1/2本,しょうが:1かけ,和風だしの素:小さじ1/4,酢:小さじ1|きゅうりはヘタを落とし、ピーラーで縞目に皮をむく（味がしみやすい）。めん棒で叩いてひびを入れ、手で乱切りにする（断面がでこぼこで味が絡む）。^昆布はキッチンばさみで細く切る、唐辛子は輪切り、しょうがはせん切り。^ポリ袋にきゅうり・塩・砂糖（砂糖少々でうまみと丸みが出る）・昆布・唐辛子・しょうが・和風だしの素・酢を入れてよくもむ。^空気を抜いて口を閉じ、冷蔵庫で1時間〜半日漬ける。^軽く水気を切って器に盛る。|味の決め手は「昆布」と「砂糖少々」。うまみと丸みのある浅漬けに。^しょうがと唐辛子で、さっぱりピリッと。
たたききゅうり|きゅうり:2本|塩:小さじ1/4,ごま油:大さじ1,鶏がらスープの素:小さじ1/2,酢:小さじ2,しょうゆ:小さじ1,砂糖:小さじ1/2,にんにく:少々,ラー油:少々,いりごま:小さじ1|きゅうりはヘタを落とし、ポリ袋に入れてめん棒で叩いて割り、手で食べやすくちぎる（断面がでこぼこになり、味がよく絡む）。^塩をふって5分おき、出た水気を捨てる（水っぽくならず、味が入りやすい）。^ごま油・鶏がらスープの素・酢・しょうゆ・砂糖・すりおろしにんにく・ラー油を加えてもみ込み、冷蔵庫で10分なじませる。^器に盛り、いりごまをふる。|味の決め手は「叩いてちぎる」ことと「塩で水を出す」こと。中華料理店の前菜の味。^砂糖少々で味に丸みが出る。
かぼちゃの煮物|かぼちゃ:400g|だし:200ml,砂糖:大さじ1.5,みりん:大さじ1,酒:大さじ1,しょうゆ:大さじ1,薄口しょうゆ:小さじ1,塩:少々|かぼちゃは種とわたを取り、4cm角に切る。皮をところどころむき、角を面取りする（煮崩れ防止と味しみ）。^鍋に皮を下にして重ならないように並べ、だし・酒・砂糖を入れて中火にかける（だしで煮ると、水で煮るより格段に上品な味に）。^煮立ったら落としぶたをして弱めの中火で6分煮る（砂糖を先に入れて甘みを含ませる）。^みりん・しょうゆ・薄口しょうゆ・塩を加え、再び落としぶたをして5〜7分、竹串がすっと通るまで煮る。^火を止めて落としぶたをしたまま15分おき、味を含ませる（煮崩れないよう、鍋の中で動かさない。冷めるときに味がしみる）。|味の決め手は「だしで煮る」ことと「火を止めて15分おく」こと。^皮を下にして並べると、煮崩れない。
里芋の煮っころがし|里芋:8個|塩:小さじ1,だし:250ml,酒:大さじ2,砂糖:大さじ1.5,みりん:大さじ1.5,しょうゆ:大さじ1.5,ゆずの皮:少々|里芋は洗って乾かしてから皮をむく（乾いていると手がかゆくなりにくい）。大きいものは半分に切る。^塩をまぶしてもみ、ぬめりを水で洗い流す。^鍋に里芋とかぶるくらいの水を入れて中火で5分下ゆでし、ざるに上げて洗う（ぬめりを取ると味がしみやすく、煮汁が濁らない）。^鍋にだし・酒・砂糖・みりん・里芋を入れて中火で煮立て、落としぶたをして弱めの中火で10分煮る。^しょうゆを加えてさらに8分煮る。^落としぶたを取り、強めの中火で鍋をゆすって転がしながら2〜3分、煮汁を煮詰めて照りよく絡める（「煮っころがし」の名の由来）。器に盛り、ゆずの皮をのせる。|味の決め手は「下ゆでしてぬめりを取る」ことと「最後に転がして照りを出す」こと。^ゆずの皮で香りが立つ。
ふろふき大根|大根:1/2本,昆布:1枚,鶏ひき肉:60g|米のとぎ汁:適量,だし:600ml,薄口しょうゆ:小さじ1,塩:少々,味噌:大さじ2,白味噌:大さじ1,砂糖:大さじ2,みりん:大さじ2,酒:大さじ1,ゆずの皮:少々|大根は3cm厚の輪切りにして皮を厚めにむき、面取りして片面に十字の隠し包丁を入れる。^米のとぎ汁で25分、竹串がすっと通るまで下ゆでして、水で洗う（えぐみが抜け、真っ白に）。^鍋に昆布を敷き、大根・だし・薄口しょうゆ・塩を入れて、ごく弱火で20分、だしを含ませるようにコトコト煮る。^鶏味噌：小鍋に鶏ひき肉・酒を入れて中火で炒り、ポロポロにする。味噌・白味噌・砂糖・みりん・大根の煮汁大さじ3を加え、弱火で3分、つやが出るまで練る（鶏ひき肉入りの田楽味噌で、うまみたっぷり）。^器に大根を盛り、煮汁を少し張って鶏味噌をかけ、ゆずの皮をのせる。|味の決め手は「とぎ汁で下ゆで」「だしで煮含める」「鶏味噌」。^2種の味噌で、甘く奥行きのある味噌に。
菜の花の辛子和え|菜の花:1束|だし:大さじ3,薄口しょうゆ:小さじ2,みりん:小さじ1,からし:小さじ1,塩:少々,しょうゆ:小さじ1|菜の花は根元を1cm落とし、冷水に10分つけてシャキッとさせる。^塩を入れた熱湯で茎から入れて30秒、全体を沈めてさらに30秒ゆでる。^冷水にとって色止めし、水気を絞って3cm長さに切る。しょうゆ小さじ1をかけて軽く絞る（しょうゆ洗い）。^辛子だれ：だし・薄口しょうゆ・みりん・からしを混ぜる（みりんを少し入れると、からしの辛さがまろやかに）。^食べる直前に和える。|味の決め手は「しょうゆ洗い」と「だしで割った辛子だれ」。^春の苦みと辛子のツンとした香りが、大人の味。
オクラのおかか和え|オクラ:12本,かつお節:1パック|塩:少々,しょうゆ:小さじ2,みりん:小さじ1,ごま油:小さじ1/2,わさび:少々|オクラはガクの周りの硬い部分をくるりとむき、塩でこすって産毛を取る（板ずり）。^塩をつけたまま熱湯で1分半ゆで、冷水にとる。^水気を拭いて斜め半分か小口切りにする。^しょうゆ・みりん・ごま油・わさびを混ぜ、オクラとかつお節で和える（みりんで角が取れ、わさびで味が締まる）。|味の決め手は「板ずり」と「わさびじょうゆ」。^ごま油を少し入れると香りが立つ。
長いものバター醤油焼き|長いも:300g|薄力粉:小さじ2,バター:15g,しょうゆ:小さじ2,みりん:小さじ1,黒こしょう:少々,青のり:少々|長いもは皮付きのままひげ根をコンロの火であぶって取り、1.5cm厚の輪切りにする（皮付きで香ばしく、崩れにくい）。^表面に薄力粉を薄くまぶす（カリッと焼き色がつき、たれが絡む）。^フライパンにバター10gを中火で熱し、長いもを並べて3分、こんがり焼き色がつくまで触らずに焼く。^返して2〜3分焼き、残りのバター5g・しょうゆ・みりんを回し入れ、10秒絡める（しょうゆが焦げる香りが決め手）。^器に盛り、黒こしょうと青のりをふる。外はカリッと、中はホクホク。|味の決め手は「薄力粉をまぶして焼く」ことと「焦がしバターしょうゆ」。^厚めに切ると、外カリ中ホクの食感に。
にんじんしりしり|にんじん:1本,卵:2個,ツナ缶:1缶|ごま油:大さじ1,和風だしの素:小さじ1/2,しょうゆ:小さじ1,塩:少々,砂糖:小さじ1/2,かつお節:1パック|にんじんはスライサー（しりしり器）で細切りにする（断面がざらざらして味がからむ）。ツナは缶汁ごと使う（うまみの元）。^フライパンにごま油を中火で熱し、にんじんを4分、しんなりして甘みが出るまでじっくり炒める（にんじんの甘みを引き出す）。^ツナ（缶汁ごと）を加えて1分炒め、和風だしの素・しょうゆ・塩・砂糖で調える。^溶き卵を回し入れ、10秒おいてから大きく混ぜ、卵が半熟になったら火を止める（余熱でふんわり）。^かつお節を混ぜる（沖縄流。うまみがぐっと増す）。|味の決め手は「にんじんをじっくり炒めて甘みを出す」ことと「ツナの缶汁ごと」「かつお節」。^砂糖ひとつまみで、にんじんの甘みが引き立つ。
なます|大根:300g,にんじん:1/4本,ゆずの皮:少々|塩:小さじ1/2,酢:大さじ3,砂糖:大さじ2,だし:大さじ2,薄口しょうゆ:小さじ1/2,塩:少々|大根とにんじんは4cm長さのせん切り（にんじんは大根より細めに）にする。^ボウルに入れて塩小さじ1/2をふり、10分おく。しんなりしたら水気をしっかり絞る（ここをしっかりすると水っぽくならない）。^甘酢：酢・砂糖・だし・薄口しょうゆ・塩を混ぜて砂糖を溶かす（だしを加えると、まろやかで上品なおせちの味に）。^大根とにんじんを和え、ゆずの皮のせん切りを加える。冷蔵庫で1時間以上なじませる。翌日がよりおいしい。|味の決め手は「だし入りの甘酢」と「ゆずの皮」。^しっかり絞るのが、水っぽくならないコツ。
ほうれん草とベーコンのソテー|ほうれん草:1束,ベーコン:60g,コーン缶:30g|オリーブオイル:小さじ1,バター:10g,にんにく:1片,しょうゆ:小さじ1,塩:少々,黒こしょう:少々|ほうれん草は根元を洗って4cm長さに切り、茎と葉に分ける。水気をしっかり拭く（水気があると水っぽくなる）。ベーコンは1cm幅、にんにくは薄切り。^フライパンにオリーブオイル・にんにく・ベーコンを入れて弱めの中火で3分、ベーコンの脂が出てカリッとするまで炒める（ベーコンの脂が味の決め手）。^強火にしてバターを加え、ほうれん草の茎を入れて30秒、葉とコーンを加えて30秒、手早く炒める（炒めすぎると水が出て色が悪くなる）。^塩・黒こしょうをし、鍋肌からしょうゆを回し入れて香りを立て、すぐ火を止める。|味の決め手は「ベーコンの脂をしっかり出す」ことと「強火で手早く」。^しょうゆを鍋肌で焦がすと、香ばしいバターしょうゆ味に。
ジャーマンポテト|じゃがいも:3個,ベーコン:80g,玉ねぎ:1/2個,ウインナー:3本|オリーブオイル:大さじ1,バター:10g,にんにく:1片,塩:小さじ1/4,黒こしょう:少々,コンソメ:小さじ1/2,粒マスタード:小さじ2,パセリ:少々|じゃがいもは皮付きのままよく洗い、くし形に切る。耐熱容器に入れてふんわりラップをし、電子レンジ600Wで5〜6分、竹串が通るまで加熱する（下加熱で外カリ中ホクに）。^ベーコンは1cm幅、ウインナーは斜め切り、玉ねぎは1cm幅、にんにくはみじん切り。^フライパンにオリーブオイルとにんにくを入れて弱火で1分、ベーコン・ウインナーを加えて中火で2分、焼き色をつける。^じゃがいもを加え、あまり触らずに中火で5分、表面がこんがりきつね色になるまで焼き付ける（焼き付けるのが香ばしさの秘訣）。^玉ねぎとバターを加えて2分炒め、コンソメ・塩・黒こしょうで調え、火を止めて粒マスタードを混ぜる（粒マスタードの酸味で、ドイツのビアホールの味に）。パセリを散らす。|味の決め手は「じゃがいもを焼き付ける」ことと「粒マスタード」。^コンソメ少々で、うまみが全体にまとまる。
フライドポテト|じゃがいも:3個|片栗粉:大さじ1,揚げ油:適量,塩:小さじ1/3,コンソメ:小さじ1/4,青のり:少々|じゃがいもは皮付きのまま1cm角の棒状に切り、水に10分さらしてでんぷんを抜く（揚げ色がきれいになり、くっつかない）。^ペーパーで水気を徹底的に拭き取り、片栗粉をまぶす（外がカリッとなる）。^揚げ油（冷たい油）にじゃがいもを入れてから中火にかけ、10分、ときどき混ぜながらじっくり揚げる（冷たい油から揚げると、中はホクホク、外はカリッと。マクドナルド風の食感に）。^竹串がすっと通ったらいったん取り出し、3分休ませる。^油を180℃に上げ、2分ほど二度揚げして、きつね色にカリッとさせる。^油を切り、熱いうちに塩とコンソメを混ぜたもの（コンソメ塩で、うまみがある塩味に）をふる。青のりをふっても。|味の決め手は「冷たい油から揚げる」ことと「二度揚げ」。^コンソメ塩にすると、ファストフード店のような、うまみのある味に。
キャロットラペ|にんじん:2本,レーズン:15g,くるみ:15g|塩:小さじ1/3,オリーブオイル:大さじ2,白ワインビネガー:大さじ1,はちみつ:小さじ2,粒マスタード:小さじ1,レモン汁:小さじ1,黒こしょう:少々|にんじんはスライサーかピーラーで細切りにする（断面がざらざらしてドレッシングが絡む）。^塩をふって混ぜ、10分おいてしんなりさせ、水気を軽く絞る。^くるみはフライパンで2分からいりして粗く刻む（香ばしさがアクセント）。レーズンはぬるま湯で5分もどす。^ドレッシング：オリーブオイル・白ワインビネガー（または酢）・はちみつ・粒マスタード・レモン汁・黒こしょうを混ぜる（粒マスタードとはちみつで、フランスのビストロの味に）。^にんじん・レーズン・くるみをドレッシングで和え、冷蔵庫で30分以上なじませる。|味の決め手は「粒マスタード＋はちみつ」と「レーズン・くるみ」。甘み、酸味、香ばしさのバランス。^冷蔵で3日保存可能。日に日に味がなじむ。
ラタトゥイユ|なす:2本,ズッキーニ:1本,パプリカ:1個,玉ねぎ:1個,トマト:3個,セロリ:1/3本|塩:小さじ1/2,オリーブオイル:大さじ4,にんにく:2片,白ワイン:50ml,トマトペースト:大さじ1,砂糖:小さじ1,ローリエ:1枚,タイム:少々,塩:少々,黒こしょう:少々,バジル:5枚|なす・ズッキーニは1.5cm角、パプリカ・玉ねぎ・セロリは2cm角、トマトはざく切り、にんにくはつぶす。なすに塩をふって10分おき、水気を拭く。^フライパンにオリーブオイル大さじ1.5を中火で熱し、なすを4分、焼き色がつくまで焼いて取り出す。同様にズッキーニ（オイル大さじ1）を3分、パプリカを2分焼いて取り出す（野菜ごとに焼くと、それぞれの甘みと食感が生き、味が濁らない。これがプロのラタトゥイユ）。^鍋に残りのオリーブオイルとにんにくを入れて弱火で1分、玉ねぎ・セロリを加えて中火で6分、甘い香りがするまで炒める。^白ワインを加えて30秒、トマト・トマトペースト・砂糖・ローリエ・タイムを加え、つぶしながら5分煮る。^焼いた野菜を戻し、ふたをして弱火で20分、ときどき混ぜて煮込む（水は加えない。野菜の水分だけで煮ると味が濃く凝縮する）。^塩・黒こしょうで調え、バジルをちぎって加える。温かくても、冷蔵庫で一晩冷やしてもおいしい。|味の決め手は「野菜を別々に焼き色をつけてから煮る」こと。^水を加えずに煮ると、野菜のうまみが凝縮する。
アヒージョ|むきえび:12尾,マッシュルーム:8個,ブロッコリー:1/4株,ミニトマト:6個,フランスパン:適量|オリーブオイル:150ml,にんにく:4片,赤唐辛子:2本,塩:小さじ1/2,アンチョビ:2枚,ローリエ:1枚,パセリ:少々|えびは背わたを取り、塩少々（分量外）・片栗粉でもみ洗いして水気を完全に拭く（水気があると油がはねる）。マッシュルームは半分、ブロッコリーは小房、にんにくは2片をみじん切り、2片を薄切り、唐辛子は種を取る。^スキレット（小さめの耐熱鍋）にオリーブオイル・にんにく・唐辛子・アンチョビ・ローリエ・塩を入れ、弱火で5分、にんにくがふつふつして香りが立つまでじっくり加熱する（にんにくとアンチョビの香りを、油にしっかり移すのがアヒージョの味の正体）。^マッシュルーム・ブロッコリーを入れて弱めの中火で3分煮る。^えび・ミニトマトを加えて2〜3分、えびが赤く丸まったら火を止める（えびは煮すぎない）。^パセリを散らし、ぐつぐつのまま食卓へ。^オイルは焼いたバゲットに浸して最後まで。残ったオイルでパスタを作るのもおすすめ。|味の決め手は「アンチョビ」と「にんにくを弱火でじっくり」。^オイルの塩加減は少し強めに。パンにつけてちょうどいい。
鯛のカルパッチョ|鯛:150g,ベビーリーフ:30g,ミニトマト:4個,紫玉ねぎ:1/8個,ケッパー:小さじ1|塩:小さじ1/3,エクストラバージンオリーブオイル:大さじ2,レモン汁:大さじ1,白ワインビネガー:小さじ1,はちみつ:小さじ1/2,にんにく:少々,ピンクペッパー:少々,黒こしょう:少々|鯛（刺身用）は表面に薄く塩をふって冷蔵庫で15分おき、出た水分をペーパーで拭く（臭みが抜け、身が締まってうまみが増す。昆布締めにするとさらに上級の味）。^包丁を寝かせて引くように、2〜3mmの薄いそぎ切りにする。^冷やした皿に重ならないよう花びら状に並べ、ラップをして冷蔵庫で5分冷やす。^ドレッシング：オリーブオイル・レモン汁・白ワインビネガー・はちみつ・すりおろしにんにく少々・塩少々を混ぜる。^紫玉ねぎは薄切りにして水にさらし、絞る。ミニトマトは4つ割り。^食べる直前に鯛にドレッシングを回しかけ、中央にベビーリーフ・紫玉ねぎ、周りにトマト・ケッパーを散らし、ピンクペッパーと黒こしょうをふる。|味の決め手は「塩をして15分おく」下処理。刺身のうまみが引き出され、身がもっちりする。^ケッパーの酸味と塩気がアクセント。
豆苗炒め|豆苗:2パック|ごま油:大さじ1,にんにく:1片,鶏がらスープの素:小さじ1/2,オイスターソース:小さじ1,酒:大さじ1,塩:少々,白こしょう:少々|豆苗は根元を切り落とし、長さを半分に切る。水気をよく切る。にんにくは薄切り。^フライパンにごま油とにんにくを入れて弱火で1分、香りが出たら強火にする。^豆苗を入れて20秒、手早くあおる。^酒・鶏がらスープの素・オイスターソース・塩・白こしょうを加えて15秒炒め、すぐ皿に移す（炒めすぎると水が出てくたっとする。シャキシャキ感が命）。|味の決め手は「強火で30秒」。シャキシャキの食感を残す。^オイスターソースを少し加えると、中華料理店の青菜炒めの味に。
チャプチェ|春雨:80g,牛こま切れ肉:150g,ほうれん草:1/2束,にんじん:1/3本,玉ねぎ:1/2個,しいたけ:3個,パプリカ:1/2個,卵:1個|しょうゆ:大さじ1,砂糖:小さじ2,ごま油:小さじ1,にんにく:1片,ごま油:大さじ2,しょうゆ:大さじ2,砂糖:大さじ1.5,はちみつ:小さじ1,オイスターソース:小さじ1,塩:少々,いりごま:大さじ1,黒こしょう:少々|春雨（韓国春雨のタンミョンがおすすめ）は熱湯で表示時間通りゆで、ざるに上げてはさみで食べやすく切る。^牛肉に、しょうゆ大さじ1・砂糖小さじ2・ごま油小さじ1・すりおろしにんにくをもみ込む。^ほうれん草は塩ゆで30秒して水気を絞り4cm長さ。にんじん・パプリカは細切り、玉ねぎ・しいたけは薄切り。卵は錦糸卵にする。^フライパンにごま油大さじ1を中火で熱し、玉ねぎ・にんじん・しいたけ・パプリカをそれぞれ別々に30秒〜1分炒め、塩少々をしてバットに取り出す（別々に炒めるのが本場の手間。色鮮やかで味が濁らない）。続けて牛肉を2分炒める。^フライパンに残りのごま油・しょうゆ大さじ2・砂糖大さじ1.5・はちみつ・オイスターソースを入れて煮立て、春雨を加えて2分、たれを吸わせるように炒める（春雨にしっかり甘辛い味を入れる）。^火を止めて、炒めた野菜・牛肉・ほうれん草を加えて混ぜ、いりごま・黒こしょうをふる。錦糸卵をのせる。|味の決め手は「野菜を別々に炒める」ことと「春雨に甘辛いたれを吸わせる」こと。^はちみつで、ツヤと甘みのある本場の味に。
生春巻き|ライスペーパー:8枚,むきえび:8尾,豚ロース肉:80g,レタス:4枚,きゅうり:1/2本,にんじん:1/4本,春雨:30g,大葉:8枚,パクチー:適量|ナンプラー:大さじ1,砂糖:大さじ1,レモン汁:大さじ1,水:大さじ2,にんにく:少々,赤唐辛子:少々,スイートチリソース:大さじ2,練りごま:大さじ1,味噌:小さじ1,砂糖:小さじ1,水:大さじ1|ヌクチャム（ベトナムのたれ）：ナンプラー・砂糖・レモン汁・水・すりおろしにんにく・刻んだ唐辛子を混ぜる。^ごま味噌だれ：練りごま・味噌・砂糖・水・スイートチリソース少々を混ぜる（2種のたれで、本場とお店の両方の味を楽しめる）。^えびは背わたを取って1分ゆで、厚みを半分に切る。豚肉は1分ゆでて冷ます。春雨はゆでて冷ます。きゅうり・にんじんはせん切り。^大きめのバットにぬるま湯を張り、ライスペーパーを5秒くぐらせて、濡れ布巾の上に広げる（少し硬いくらいで引き上げる。置いている間にやわらかくなる）。^奥側にえびを断面を下にして3枚並べ、大葉を重ねる（表から透けて見えて美しい）。手前にレタス・豚肉・春雨・きゅうり・にんじん・パクチーをのせる。^手前から具を押さえながらひと巻きし、左右を折り込んで、空気を抜くようにきつく巻き上げる。濡れ布巾をかけて乾燥を防ぎ、食べる直前に半分に切る。2種のたれで。|味の決め手は「ヌクチャム」と「ごま味噌だれ」の2種のたれ。^大葉とパクチーのハーブの香りで、本場の味に。
チヂミ|にら:1束,シーフードミックス:150g,にんじん:1/4本,玉ねぎ:1/4個,長ねぎ:1/3本|薄力粉:70g,片栗粉:大さじ3,卵:1個,水:100ml,鶏がらスープの素:小さじ1,塩:少々,ごま油:大さじ3,しょうゆ:大さじ2,酢:大さじ1,砂糖:小さじ1,一味唐辛子:少々,いりごま:小さじ1,長ねぎ:5cm|シーフードミックスは塩水（水500mlに塩小さじ1）で解凍し、水気をしっかり拭く。にらは5cm長さ、にんじん・玉ねぎは細切り、長ねぎは斜め薄切り。^生地：ボウルに薄力粉・片栗粉・鶏がらスープの素・塩を混ぜ、冷水と溶き卵を加えて混ぜる（冷水を使うとグルテンが出にくく、カリッと仕上がる。鶏がらで生地にもうまみを）。具を加えてさっくり混ぜる（混ぜすぎない）。^たれ：しょうゆ・酢・砂糖・一味・いりごま・みじん切りの長ねぎを混ぜる。^フライパン（直径26cm）にごま油大さじ2を中火で熱し、生地を流して薄く丸く広げる（薄いほどカリカリに）。^中火で4〜5分、ヘラで押さえつけながら焼き、縁が透き通り、裏がこんがりしたら返す。^鍋肌から残りのごま油大さじ1を回し入れ、さらに4分、ヘラで強く押さえながらカリカリに焼く（多めの油で揚げ焼きにするのが本場のカリカリの秘訣）。食べやすく切り、たれを添える。|味の決め手は「冷水で生地を作る」「多めのごま油で揚げ焼き」「ヘラで押さえる」の3つ。^生地に鶏がらスープの素を入れると、生地自体にうまみが出る。
トッポッキ|トック:300g,キャベツ:2枚,長ねぎ:1/2本,さつま揚げ:3枚,卵:2個,ピザ用チーズ:30g|煮干し:10g,昆布:1枚,水:400ml,コチュジャン:大さじ2,一味唐辛子:小さじ2,砂糖:大さじ1.5,水あめ:大さじ1,しょうゆ:大さじ1,にんにく:1片,鶏がらスープの素:小さじ1/2,ごま油:小さじ1,いりごま:小さじ1|だし：水に煮干し（頭とわたを取る）と昆布を入れて中火にかけ、沸騰したら弱火で5分煮出してこす（煮干しだしが本場の屋台の味の土台）。^トックは硬い場合は水に10分つける。キャベツはざく切り、長ねぎは斜め切り、さつま揚げは三角に切る。卵は8分ゆでて殻をむく。^たれ：コチュジャン・一味（韓国唐辛子なら最高）・砂糖・水あめ（なければはちみつ。照りとまろやかな甘みが出る）・しょうゆ・すりおろしにんにくを混ぜる。^フライパンにだしとたれを入れて中火で煮立て、トックとさつま揚げを入れて5分、底から混ぜながら煮る。^キャベツ・長ねぎ・ゆで卵・鶏がらスープの素を加えて4〜5分、トックがやわらかくなり、たれがとろりと煮詰まるまで煮る。^ごま油・いりごまをふる。好みでチーズをのせ、ふたをして1分で溶かす。|味の決め手は「煮干しだし」と「水あめ（またははちみつ）」。甘辛く、照りのある屋台の味。^たれがとろりと煮詰まるまで煮るのがポイント。
お好み焼き|キャベツ:1/3個,豚バラ肉:150g,卵:2個,長いも:80g,天かす:大さじ4,紅しょうが:15g,桜えび:大さじ2,かつお節:1パック|薄力粉:100g,だし:130ml,和風だしの素:小さじ1/2,塩:少々,砂糖:小さじ1/2,サラダ油:大さじ1,お好み焼きソース:大さじ4,マヨネーズ:大さじ3,青のり:少々|生地：薄力粉にだし・和風だしの素・塩・砂糖を加えてダマなく混ぜ、冷蔵庫で30分休ませる（だしで溶くと生地自体がおいしい。休ませるとグルテンが落ち着き、ふんわり）。^キャベツは粗みじん切り（1cm角。芯は細かく）、紅しょうがは刻む。長いもはすりおろす（長いもで、ふわっととろける食感に。お店の秘密）。^焼く直前に、ボウルに1枚分ずつ生地・長いも・卵1個・キャベツ・天かす・紅しょうが・桜えびを入れ、底から空気を含ませるように大きく10回混ぜる（混ぜすぎない）。^フライパンにサラダ油を中火で熱し、生地を丸く2cm厚に広げ、豚肉を並べる。ふたをして中火で5分焼く。^ヘラ2本で返し（豚肉が下）、ふたをせずに中火で5分。上から押さえつけない（ふんわり感が消える）。豚肉がカリカリになる。^もう一度返して2分焼き、ソース・マヨネーズを塗り、かつお節・青のりをかける。|味の決め手は「だしで生地を溶く」「長いもを入れる」「天かす＋桜えび」。^焼くときは絶対に押さえつけない。ふわふわが台無しになる。
たこ焼き|ゆでだこ:150g,卵:2個,小ねぎ:適量,紅しょうが:適量,天かす:大さじ5,かつお節:1パック|薄力粉:120g,だし:500ml,和風だしの素:小さじ1,薄口しょうゆ:小さじ1,塩:少々,サラダ油:適量,お好み焼きソース:大さじ4,マヨネーズ:大さじ3,青のり:少々|生地：ボウルに卵を溶き、だし・和風だしの素・薄口しょうゆ・塩を混ぜ、薄力粉を加えてダマなく混ぜる（だし多めのシャバシャバ生地が、大阪のとろとろたこ焼きの秘密）。冷蔵庫で30分休ませる。^たこは1cm角、小ねぎは小口切り、紅しょうがは刻む。^たこ焼き器を中火でしっかり熱し、サラダ油を穴と表面にたっぷり塗る（油多めが、外カリッの決め手）。^生地を穴からあふれるくらいまで流し入れ、たこ・天かす・小ねぎ・紅しょうがを散らす。^2〜3分焼いて縁が固まったら、竹串で穴の周りの生地を区切り、はみ出た生地を中に押し込みながら90度返す。1分後にさらに90度返して丸くする。^その後は転がしながら計10分、全体がカリッときつね色になるまで焼く（最後に油を少し足すとさらにカリッと）。ソース・マヨネーズ・かつお節・青のりをかける。|味の決め手は「だしたっぷりのゆるい生地」と「油多めで焼く」こと。外カリッ、中とろっと。^天かすを入れると、コクと香ばしさが加わる。
ピザ|強力粉:200g,ベーコン:60g,ピーマン:1個,玉ねぎ:1/4個,マッシュルーム:4個,モッツァレラチーズ:100g,ピザ用チーズ:60g|ドライイースト:3g,砂糖:小さじ1,塩:小さじ2/3,ぬるま湯:130ml,オリーブオイル:大さじ1,トマト缶:1/2缶,にんにく:1片,オレガノ:小さじ1/2,砂糖:小さじ1/2,塩:小さじ1/4,バジル:5枚|生地：強力粉・ドライイースト・砂糖・塩を混ぜ、ぬるま湯（35℃）とオリーブオイルを加えてまとめ、台で8分こねる。ボウルに入れてラップし、温かいところで40分、2倍にふくらむまで発酵させる（手作り生地は、もちもち香ばしさがまったく違う）。^ピザソース：小鍋にトマト缶・すりおろしにんにく・オレガノ・砂糖・塩・オリーブオイル少々を入れ、中火で8分、とろりとするまで煮詰める（ケチャップではなく、煮詰めたトマトソースでお店の味に）。^オーブンを最高温度（250℃以上）で、天板ごと20分しっかり予熱する（高温で一気に焼くのが、カリッともちっとの秘訣）。^生地を2等分し、オーブンシートの上で直径22cmに手でのばす（縁を少し厚く残す）。ソースを塗り、ピザ用チーズ・具・ちぎったモッツァレラの順にのせる。^熱した天板にシートごとすべらせて入れ、250℃で8〜10分、縁がこんがりしてチーズがぐつぐつ焦げ目がつくまで焼く。^焼き上がりにバジルをのせ、オリーブオイルをひと回しする。|味の決め手は「手作り生地」「煮詰めたトマトソース」「天板ごと高温予熱」。^モッツァレラとピザ用チーズの2種使いで、伸びとコクを両立。
フレンチトースト|食パン:2枚,卵:2個|牛乳:150ml,生クリーム:50ml,砂糖:大さじ2,バニラエッセンス:少々,バター:20g,はちみつ:大さじ2,粉糖:少々|食パン（4枚切りの厚切り、またはバゲット）は半分に切る。^卵液：卵・牛乳・生クリーム・砂糖・バニラエッセンスをよく混ぜ、ざるでこす（生クリームを入れると、ホテルのようなとろける濃厚さに）。^バットにパンを並べて卵液を注ぎ、ラップをして冷蔵庫で一晩（最低2時間）、途中で返しながら浸す（一晩浸すと、中までプリンのようにとろとろ）。^フライパンにバター10gを弱めの中火で溶かし、パンを入れてふたをし、5分焼く。^返してバター10gを足し、ふたをして弱火で4分、両面きつね色で中までふっくらするまで焼く（弱火でじっくり。強火だと表面だけ焦げて中が生）。^器に盛り、はちみつをかけて粉糖をふる。|味の決め手は「生クリーム入りの卵液」と「一晩浸す」こと。外はカリッ、中はとろとろ。^弱火でふたをして焼くのが、中まで火を通すコツ。
ピザトースト|食パン:2枚,ベーコン:2枚,ピーマン:1個,玉ねぎ:1/8個,マッシュルーム:2個,ピザ用チーズ:70g,サラミ:6枚|ケチャップ:大さじ2,トマトペースト:小さじ1,オレガノ:少々,にんにく:少々,マヨネーズ:小さじ2,バター:5g,タバスコ:少々,粉チーズ:小さじ2|ソース：ケチャップ・トマトペースト・オレガノ・すりおろしにんにくを混ぜる（ケチャップだけより、ぐっと本格的なピザの味に）。^玉ねぎは薄切り、ピーマンは輪切り、マッシュルームは薄切り、ベーコンは1cm幅。^食パン（厚切り推奨）に薄くバターを塗り、ソースを端まで塗る（耳まで塗ると縁が乾かずおいしい）。マヨネーズを細く絞る（コクがアップ）。^玉ねぎ・ベーコン・サラミ・マッシュルーム・ピーマンをのせ、チーズをたっぷり全体に散らし、粉チーズをふる。^トースター（1000W）で5〜6分、チーズがぐつぐつしてふちがこんがりするまで焼く。^タバスコをかけて。|味の決め手は「ケチャップ＋トマトペースト＋オレガノ」のソース。喫茶店のピザトーストの味。^マヨネーズを少し絞ると、コクが出る。
ホットサンド|食パン:4枚,ハム:4枚,スライスチーズ:2枚,卵:2個,キャベツ:1枚|バター:20g,マヨネーズ:小さじ2,粒マスタード:小さじ1,塩:少々,黒こしょう:少々|卵は目玉焼き（両面焼き、黄身はやや半熟）にして塩・黒こしょうをふる。キャベツはせん切りにしてマヨネーズ少々で和える。^食パン2枚の外側になる面にバターを薄く塗る（バターでこんがり香ばしく）。内側にマヨネーズと粒マスタードを塗る。^パン・チーズ・ハム2枚・キャベツ・目玉焼き・ハム2枚・パンの順に重ねる（チーズを最初に置くと、パンにくっついて具がずれない）。^ホットサンドメーカーに挟み、中火で片面2分半ずつ、こんがりきつね色になるまで焼く。フライパンなら、弱めの中火で、重し（皿＋水を入れた鍋）をのせて片面3分ずつ。^半分に切る（断面の目玉焼きがきれい）。|味の決め手は「外側にバター」と「粒マスタード」。喫茶店のホットサンドの味に。^目玉焼きを挟むと、ボリュームと満足感が格段にアップ。
卵サンド|食パン:4枚,卵:4個|マヨネーズ:大さじ4,からし:小さじ1/2,砂糖:小さじ1/2,牛乳:小さじ2,塩:少々,白こしょう:少々,バター:15g|卵は冷蔵庫から出したてを沸騰した湯にそっと入れ、11分ゆでて固ゆでにする。冷水にとって殻をむく。^白身と黄身に分け、黄身はフォークでなめらかにつぶしてマヨネーズ・からし・砂糖・牛乳・塩・白こしょうと混ぜる（黄身でソースを作ってから白身と合わせると、濃厚でなめらか。コンビニのたまごサンドの味の秘密）。^白身は粗く刻み、黄身のソースと混ぜる（白身は粗めにして食感を残す）。^食パン（耳付き）の片面にバターを薄く塗る（パンに水分がしみるのを防ぐ）。^卵フィリングを中央がこんもり厚くなるように塗り、もう1枚で挟む。^ラップでぴったり包み、冷蔵庫で15分なじませてから、耳を落として切る（なじませると切り口がきれい）。|味の決め手は「黄身でソースを作ってから白身と合わせる」ことと「からし・砂糖少々」。^パンにバターを塗ると、時間が経ってもべちゃっとしない。
BLTサンド|食パン:4枚,ベーコン:6枚,レタス:4枚,トマト:1個,アボカド:1/2個|マヨネーズ:大さじ3,粒マスタード:小さじ1,バター:15g,黒こしょう:少々,塩:少々|食パンはトースターで2分、薄く焼き色をつける。熱いうちに片面にバター、反対の面にマヨネーズと粒マスタードを混ぜたものを塗る。^ベーコン（厚切り推奨）はフライパンで弱めの中火で5分、両面カリカリになるまで焼き、ペーパーで脂を切る（カリカリが命）。^トマトは7mm厚の輪切りにして塩・黒こしょうをふり、ペーパーで水気を取る。アボカドは薄切り。レタスは水気をしっかり拭く（水気がパンをべちゃっとさせる）。^パン・レタス・トマト・ベーコン・アボカド・レタス・パンの順に重ね、手で軽く押さえる。^ワックスペーパーかラップで包み、5分おいてから半分に切る。|味の決め手は「ベーコンをカリカリに」と「マスタードマヨ」。^アボカドを加えると、コクが出てカフェのBLTに。
ハムエッグ|卵:2個,ハム:4枚|サラダ油:小さじ1,バター:5g,塩:少々,黒こしょう:少々,しょうゆ:少々|フライパンにサラダ油とバターを中火で熱し、ハムを2枚ずつ重ならないように並べて30秒、縁が少しカリッとするまで焼く（ハムを焼くと香ばしく、うまみが増す）。^ハムの上に卵を割り入れ、弱めの中火にする。^白身の縁がチリチリしてきたら、水大さじ1（分量外）を周りに入れてふたをし、1分半蒸し焼きにする（黄身の表面がうっすら白くなれば半熟）。^塩・黒こしょうをふって器に盛る。しょうゆかソースを少々。|味の決め手は「ハムを先に焼いて香ばしく」すること。^サラダ油＋バターで、香りよく焼ける。
スクランブルエッグ|卵:4個|牛乳:大さじ2,生クリーム:大さじ2,塩:ひとつまみ,白こしょう:少々,バター:20g,チャイブ:少々|卵を溶き、牛乳・生クリーム・塩・白こしょうを加えてよく混ぜ、ざるでこす（なめらかな口当たりに）。^フライパンにバター15gを弱火で溶かす（ここで焦がさない。弱火がホテルのスクランブルエッグのコツ）。^卵液を流し入れ、10秒待ってから、ゴムベラで外側から中心へゆっくり大きく寄せる。^弱火のまま、ゆっくり混ぜながら2〜3分（ときどき火から外して温度を下げる）。7割ほど固まってとろりとしているうちに火から下ろし、残りのバター5gを加えて混ぜる（余熱で火が入るので早めに。冷たいバターで加熱を止め、つやを出す）。^すぐ器に盛り、刻んだチャイブ（または小ねぎ）を散らす。|味の決め手は「弱火でゆっくり」と「最後に冷たいバター」。ホテルの朝食のような、とろとろクリーミーなスクランブルエッグ。^生クリームを入れると、さらにリッチに。
エッグベネディクト|イングリッシュマフィン:2個,卵:2個,卵黄:2個,ベーコン:4枚,ほうれん草:1/4束|酢:大さじ1,バター:60g,レモン汁:小さじ2,塩:少々,カイエンペッパー:少々,黒こしょう:少々|オランデーズソース：バターを電子レンジで40秒溶かす（熱い状態に保つ）。ボウルに卵黄・レモン汁・水小さじ2・塩を入れ、湯せん（60℃くらいのお湯）にかけて泡立て器で混ぜ、もったりするまで1分。^溶かしバターを少しずつ垂らしながら混ぜ続け、もったりとろみがつくまで2〜3分（マヨネーズのように乳化させる。湯が熱すぎると卵が固まるので注意）。塩・カイエンペッパー（または一味少々）で調える。^ベーコンはカリッと焼く。ほうれん草はバター少々で炒めて塩をする。マフィンは横半分に割ってトースターで2分焼く。^ポーチドエッグ：鍋に湯1Lを沸かして酢を入れ、弱火（小さな泡が出る程度）にする。卵を小さな器に割り、お玉で湯をかき混ぜて渦を作り、中心にそっと落とす。^3分ゆでて網じゃくしで取り出し、ペーパーで水気を拭く（白身が黄身を包み、黄身はとろとろ）。^マフィンにほうれん草・ベーコン・ポーチドエッグをのせ、オランデーズソースをたっぷりかけ、黒こしょうをふる。|味の決め手は「オランデーズソース」。バターたっぷりでレモンの酸味が効いたソースが、ホテルの朝食の味。^ほうれん草を加えると「エッグフロレンティーン」風になり、彩りもよい。
クロックムッシュ|食パン:4枚,ハム:4枚,グリュイエールチーズ:40g,ピザ用チーズ:40g|バター:25g,薄力粉:大さじ1.5,牛乳:150ml,塩:少々,白こしょう:少々,ナツメグ:少々,粒マスタード:小さじ1,粉チーズ:大さじ2|ベシャメルソース：小鍋にバター10gを弱火で溶かし、薄力粉を加えて1分、粉っぽさがなくなるまで炒める。冷たい牛乳を少しずつ加えて泡立て器で混ぜ、弱めの中火で3分、とろりとするまで混ぜながら煮て、塩・白こしょう・ナツメグで調える。^食パン2枚の片面にベシャメル少々と粒マスタードを塗り、ハム・グリュイエールチーズ（なければピザ用チーズ）をのせて、もう1枚で挟む。^フライパンにバター15gを中火で溶かし、サンドを入れて両面2分ずつ、こんがり焼く（バターで焼いてからトースターで焼くと、外カリッと中とろっと）。^上面に残りのベシャメルを塗り、ピザ用チーズ・粉チーズを散らす。^トースター（1000W）で5〜6分、チーズがこんがり焼けるまで焼く。|味の決め手は「ベシャメルソース」と「バターで焼いてからトースター」。パリのカフェの味に。^上に目玉焼きをのせれば「クロックマダム」に。
アボカドトースト|食パン:2枚,アボカド:1個,卵:2個,ミニトマト:4個|レモン汁:小さじ2,塩:小さじ1/4,黒こしょう:少々,オリーブオイル:大さじ1,にんにく:少々,一味唐辛子:少々,酢:大さじ1|食パン（厚切りかカンパーニュ）はトースターで3分、こんがり焼き、にんにくの断面を軽くこすりつける。^アボカドは半分に割って種を取り、スプーンでくり抜いてボウルに入れる。レモン汁・塩・オリーブオイル半量を加え、フォークで粗くつぶす（少し粒感を残すとおいしい）。^ポーチドエッグ：湯1Lを沸かして酢を入れ、弱火にして渦を作り、卵を落として3分ゆで、水気を拭く。^ミニトマトは4つ割り。^トーストにアボカドを厚めに塗り、ポーチドエッグ・トマトをのせる。残りのオリーブオイルを回しかけ、黒こしょうと一味をふる。|味の決め手は「レモン汁と塩でしっかり味をつけたアボカド」と「ポーチドエッグ」。^一味をひとふりすると、味が引き締まってカフェの味に。
ホットドッグ|ホットドッグ用パン:2本,ウインナー:2本,キャベツ:2枚,玉ねぎ:1/4個|バター:10g,カレー粉:小さじ1/4,塩:少々,黒こしょう:少々,ケチャップ:大さじ2,マスタード:小さじ2,ピクルス:1本|キャベツはせん切りにして、バター5gで中火で1分炒め、カレー粉・塩・黒こしょうで味をつける（カレー風味のキャベツが、昔ながらの喫茶店のホットドッグの味）。^玉ねぎ・ピクルスはみじん切りにして混ぜる（レリッシュ風。玉ねぎは水にさらして絞る）。^ウインナー（長めのフランクフルト推奨）は斜めに切り込みを入れ、フライパンで残りのバターで中火で3分、転がしながら焼き色をつける。^パンに切り込みを入れ、内側にバター少々を塗り、トースターで1分温める。^キャベツとウインナーを挟み、レリッシュをのせて、ケチャップとマスタードをかける。|味の決め手は「カレー風味のキャベツ」と「ピクルスのレリッシュ」。^ウインナーは焼き色をしっかりつけると香ばしい。
バインミー|フランスパン:1本,鶏もも肉:150g,大根:100g,にんじん:1/3本,きゅうり:1/2本,パクチー:適量,レバーペースト:30g|酢:大さじ3,砂糖:大さじ1.5,塩:少々,ナンプラー:小さじ2,しょうゆ:小さじ1,はちみつ:小さじ1,にんにく:少々,マヨネーズ:大さじ2,バター:10g,赤唐辛子:少々|なます（ドーチュア）：大根とにんじんを4cm長さのせん切りにし、塩少々をふって5分おき、水気を絞る。酢・砂糖で和えて30分以上漬ける（甘酸っぱいなますがバインミーの魂）。^鶏肉はナンプラー・しょうゆ・はちみつ・すりおろしにんにくを絡めて20分漬ける。^フライパンを中火で熱し、鶏肉を皮目から入れて5分、パリッとするまで焼く。返してふたをし、弱めの中火で4分焼いて薄切りにする。^フランスパンを2等分して横に切り込みを入れ、トースターで2分温める（外はカリッと）。^内側にバターとマヨネーズを塗り、レバーペースト（本場の味。なければ省略可）を塗る。^鶏肉・汁気を切ったなます・薄切りのきゅうり・パクチー・刻んだ唐辛子をたっぷり挟む。|味の決め手は「甘酢なます」と「バター＋マヨ＋レバーペースト」。ベトナムの屋台の味。^パクチーはたっぷり。香りが全体をまとめる。
豚バラ大根|豚バラ肉:250g,大根:1/2本,ゆで卵:2個|ごま油:小さじ1,しょうが:1かけ,水:400ml,酒:大さじ3,砂糖:大さじ1.5,みりん:大さじ2,しょうゆ:大さじ3,オイスターソース:小さじ1|大根は2cm厚の半月切りにして面取りする。耐熱容器に入れてラップし、電子レンジ600Wで8分加熱する（下ゆでの代わり。時短で味がしみやすくなる）。^豚バラ肉は5cm長さ、しょうがは薄切り。^鍋にごま油を中火で熱し、豚肉を3分、脂が出て焼き色がつくまでしっかり炒める（豚の脂とうまみが煮汁の素）。大根を加えて2分、豚の脂を吸わせるように炒める。^水・酒・しょうがを加え、煮立ったらアクを取る。砂糖・みりんを加え、落としぶたをして弱めの中火で10分煮る。^しょうゆ・オイスターソース（隠し味のコク）・ゆで卵を加えて再び落としぶたをし、15分煮る。^落としぶたを取り、中火で3分、煮汁を回しかけながら照りが出るまで煮詰める。火を止めて冷ますと、大根が飴色に。|味の決め手は「豚バラを焼き付ける」ことと「オイスターソース少々」。^冷めるときに味がしみるので、作ってから時間をおくのがおすすめ。
高野豆腐の含め煮|高野豆腐:4個,にんじん:1/3本,干ししいたけ:4個,絹さや:8枚|昆布:1枚,水:500ml,かつお節:10g,砂糖:大さじ2.5,みりん:大さじ1,酒:大さじ1,薄口しょうゆ:大さじ1.5,塩:小さじ1/4|干ししいたけは水200mlでもどす（もどし汁は使う）。高野豆腐は60℃くらいのぬるま湯に5分つけてもどし、両手で挟んで水を替えながら白い水が出なくなるまで押し洗いする（ここが重要。洗い足りないと独特の臭いが残る）。軽く水気を絞って4等分に切る。^だし：水と昆布を30分おいて弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす。しいたけのもどし汁と合わせて600mlにする。^にんじんは花形（または輪切り）、しいたけは軸を取る。絹さやは塩ゆで。^鍋にだし・砂糖・みりん・酒を入れて中火で煮立て、高野豆腐・にんじん・しいたけを並べ入れ、落としぶたをして弱火で10分煮る（甘みを先にしっかり含ませる）。^薄口しょうゆ・塩を加えて、さらに10分、ごく弱火で煮る（ぐらぐら煮ると崩れる）。^火を止めてそのまま冷ます（冷める間に煮汁を吸い、じゅわっと煮汁があふれる含め煮に）。絹さやを添える。|味の決め手は「本格的なだし」と「高野豆腐をしっかり押し洗い」すること。^冷める間にだしを含ませる。かむとだしがじゅわっとあふれる料亭の味。
かつおのたたき|かつお:300g,玉ねぎ:1/2個,大葉:8枚,小ねぎ:適量,みょうが:2個,にんにく:3片,しょうが:1かけ|塩:小さじ1/2,サラダ油:小さじ1,ポン酢しょうゆ:大さじ4,しょうゆ:小さじ1,ゆず果汁:小さじ1|かつお（刺身用のさく、皮付きがおすすめ）は、皮目を下にして全体に塩をふる（塩たたき風の下味。うまみが増す）。^玉ねぎは薄切りにして水に5分さらす。大葉・みょうがはせん切り、小ねぎは小口切り、にんにくは薄切り（2片）とすりおろし（1片）、しょうがはせん切り。^フライパンにサラダ油を強火で熱し、煙が出るまで熱くする。かつおを皮目から入れて40秒、残りの面を各15秒ずつ焼く（表面だけ焼いて中は生。皮目を長めに焼くと香ばしい）。^すぐに氷水にとって10秒冷やし（長く浸すと水っぽくなる）、ペーパーで水気を拭く。^たれ：ポン酢・しょうゆ・ゆず果汁・すりおろしにんにくを混ぜる。^1cm厚に切って器に並べ、たれを回しかけ、手のひらで軽く叩いて味をなじませる（「たたき」の由来）。玉ねぎ・にんにくの薄切り・しょうが・大葉・みょうが・小ねぎをたっぷりのせ、冷蔵庫で10分なじませる。|味の決め手は「強火で表面を焼き付ける」ことと「薬味をたっぷり」。高知の土佐づくりの味。^にんにくの薄切りを薬味として一緒に食べるのが本場流。
ビーフステーキ|牛サーロイン:2枚,じゃがいも:2個,いんげん:8本,クレソン:適量|塩:小さじ2/3,黒こしょう:少々,牛脂:1個,にんにく:2片,バター:20g,しょうゆ:大さじ1.5,赤ワイン:大さじ3,みりん:大さじ1,玉ねぎ:1/4個,わさび:少々|牛肉（厚さ2cm）は焼く1時間前に冷蔵庫から出して室温に戻す（中心が冷たいと焼きムラになる）。筋を数か所切り、ペーパーで水気を拭く。焼く直前に塩・黒こしょうをふる（早くふると水分が出る）。^にんにくは薄切りにする。^フライパンに牛脂を入れて弱火で溶かし、にんにくを入れて3分、きつね色になったら取り出す（ガーリックチップ）。^強火にして煙が出るくらい熱し、牛肉を入れる。触らずに2分焼いて返し、1分半焼く（ミディアムレア。ミディアムなら返して2分半）。バター10gを加え、溶けたバターをスプーンで肉に5〜6回かけながら30秒（アロゼ。香りをまとわせる）。^アルミホイルに包んで、焼いた時間と同じ3〜4分休ませる（肉汁が落ち着き、切っても流れ出ない）。^ソース：同じフライパンにすりおろし玉ねぎを入れて1分炒め、赤ワイン・しょうゆ・みりん・ホイルの肉汁を加えて1分煮詰め、火を止めて残りのバターを溶かす。肉を切って盛り、ソースとガーリックチップをかけ、わさびを添える。つけ合わせのじゃがいも・いんげんはソテーする。|味の決め手は「室温に戻す」「強火で焼き色」「アロゼ」「休ませる」の4つ。^わさびじょうゆで食べると、ステーキハウスの味に。
ビーフストロガノフ|牛ロース肉:300g,玉ねぎ:1個,マッシュルーム:8個,ご飯:400g|塩:小さじ1/3,黒こしょう:少々,薄力粉:大さじ1,バター:30g,白ワイン:50ml,水:150ml,コンソメ:小さじ1,トマトペースト:大さじ1,ウスターソース:大さじ1,パプリカパウダー:小さじ1,サワークリーム:100g,生クリーム:50ml,レモン汁:小さじ1,パセリ:少々|牛肉は1cm幅の細切りにし、塩・黒こしょうをして薄力粉を薄くまぶす（とろみがつき、肉がやわらかく仕上がる）。玉ねぎは薄切り、マッシュルームは薄切り。^フライパンにバター10gを強めの中火で溶かし、牛肉を広げて1分半、焼き色をつけて取り出す（焼きすぎない。8割火が通ったら取り出す）。^残りのバターで玉ねぎを中火で8分、甘くきつね色になるまで炒め、マッシュルームを加えて3分炒める。^白ワインを加えて1分煮立て、水・コンソメ・トマトペースト・ウスターソース・パプリカパウダーを加えて5分煮る。^火を弱めてサワークリーム（本場ロシアの味の決め手。爽やかな酸味とコク）・生クリームを加えて混ぜ、牛肉を戻して2分、とろりとするまで煮る（煮立てない）。レモン汁で調える。^バターライスかご飯にかけ、パセリを散らす。|味の決め手は「サワークリーム」と「パプリカパウダー」。本場のロシアの味に。^牛肉は先に焼いて取り出し、最後に戻すと硬くならない。
ミートボールのトマト煮|合いびき肉:300g,玉ねぎ:1個,卵:1個,しめじ:1/2パック,パプリカ:1/2個|パン粉:大さじ4,牛乳:大さじ3,粉チーズ:大さじ2,塩:小さじ1/3,黒こしょう:少々,ナツメグ:少々,オリーブオイル:大さじ2,にんにく:1片,赤ワイン:50ml,トマト缶:1缶,ケチャップ:大さじ2,ウスターソース:小さじ2,コンソメ:小さじ1,砂糖:小さじ1,オレガノ:少々,バジル:5枚|玉ねぎ半量はみじん切りにして炒めて冷ます。残りは薄切り。パン粉は牛乳でふやかす。^ボウルを氷水に当て、ひき肉と塩を粘りが出るまで練り、卵・パン粉・炒め玉ねぎ・粉チーズ（チーズでうまみとコクが段違い）・黒こしょう・ナツメグを混ぜる。直径3cmに丸める。^フライパンにオリーブオイル大さじ1を中火で熱し、ミートボールを転がしながら5分、全体にしっかり焼き色をつけて取り出す（焼き色がソースのコクになる。中は生でOK）。^同じフライパンにオリーブオイル大さじ1・にんにくのみじん切り・薄切り玉ねぎを入れて3分、しめじ・パプリカを加えて2分炒める。^赤ワインを加えて1分煮立て、トマト缶・ケチャップ・ウスターソース・コンソメ・砂糖・オレガノを加えて煮立てる。ミートボールを戻し、ふたをして弱めの中火で15分煮込む。^ふたを取って3分煮詰め、バジルをちぎって加える。粉チーズをふって。|味の決め手は「肉だねに粉チーズ」と「赤ワイン」。イタリアのマンマの味に。^パスタにかけても、パンを添えても。
チキンカツ|鶏むね肉:1枚,キャベツ:3枚,卵:1個|塩:小さじ1/3,砂糖:小さじ1/2,こしょう:少々,マヨネーズ:大さじ1,薄力粉:大さじ2,牛乳:大さじ1,生パン粉:50g,揚げ油:適量,中濃ソース:大さじ2,ケチャップ:大さじ1,からし:少々|鶏むね肉は皮を取り、厚い部分を開いて厚さを1.5cmに揃える。半分に切り、フォークで両面を刺す（縮み防止と味しみ）。^塩・砂糖・こしょうをもみ込み、マヨネーズを全体に塗って15分おく（砂糖でしっとり、マヨの油でジューシー。パサつきがちなむね肉の救世主）。^薄力粉→牛乳入り卵液→生パン粉の順につけ、5分おく。^揚げ油を160℃に熱し、4分揚げて返し、2分揚げる。いったん取り出して2分休ませ、180℃で1分二度揚げしてカリッとさせる。^網に立てて2分休ませる。切ってキャベツのせん切りと盛り、中濃ソースとケチャップを混ぜたソース・からしを添える。|味の決め手は「砂糖＋マヨネーズの下味」。むね肉が驚くほどしっとりジューシーに。^低温→高温の二度揚げで、衣はサクサク。
ポークビーンズ|豚肩ロース肉:200g,大豆(水煮):150g,玉ねぎ:1/2個,にんじん:1/3本,セロリ:1/4本,ベーコン:40g|塩:少々,こしょう:少々,オリーブオイル:大さじ1,にんにく:1片,白ワイン:大さじ2,トマト缶:1缶,ケチャップ:大さじ2,ウスターソース:大さじ1,はちみつ:小さじ2,コンソメ:小さじ1,ローリエ:1枚,塩:少々|豚肉は2cm角に切って塩・こしょうする。玉ねぎ・にんじん・セロリは1cm角、ベーコンは1cm幅、にんにくはみじん切り。大豆は水気を切る。^鍋にオリーブオイル・にんにく・ベーコンを入れて中火で2分、豚肉を加えて3分、焼き色をつける。^玉ねぎ・にんじん・セロリを加えて5分、玉ねぎが透き通って甘い香りがするまで炒める。^白ワインを加えて30秒、トマト缶・ケチャップ・ウスターソース・はちみつ（甘みで子どもにも人気の味に）・コンソメ・ローリエ・大豆・水100ml（分量外）を加えて煮立てる。^ふたをして弱火で20分、ときどき混ぜながら煮込む。^ふたを取って5分、とろりとするまで煮詰め、塩で調える。|味の決め手は「ベーコン」と「はちみつ＋ウスター」。甘辛くコクのある本場アメリカの家庭の味。^大豆は国産の水煮を使うと、ほくほく甘い。
ハッシュドビーフ|牛こま切れ肉:300g,玉ねぎ:1.5個,マッシュルーム:6個,ご飯:450g|塩:少々,こしょう:少々,薄力粉:大さじ2,バター:30g,にんにく:1片,赤ワイン:150ml,トマト缶:1/2缶,トマトペースト:大さじ1,ケチャップ:大さじ3,ウスターソース:大さじ2,中濃ソース:大さじ1,しょうゆ:小さじ1,はちみつ:小さじ2,コンソメ:小さじ2,水:250ml,ローリエ:1枚,生クリーム:適量|玉ねぎは繊維に沿って1cm幅の薄切り、マッシュルームは5mm厚。牛肉に塩・こしょうをふる。^鍋にバター15gを中火で溶かし、玉ねぎ・すりおろしにんにくを入れて15分、こまめに混ぜてあめ色になるまで炒める（ここがコクの源。焦げそうなら水大さじ1でこそげる）。^別のフライパンにバター5gを強めの中火で溶かし、牛肉を広げて焼き色をつけ、鍋に加える。マッシュルームも同じフライパンで焼いて加える。^鍋にバター10gを足して薄力粉をふり入れ、弱火で2分、茶色くなるまで炒める（ブラウンルウ。デミグラスの風味の素）。^赤ワインを加えて強火で2分、半量に煮詰める。トマト缶・トマトペースト・ケチャップ・ウスターソース・中濃ソース・しょうゆ・はちみつ・コンソメ・水・ローリエを加え、弱火で20分、ときどき底から混ぜながら煮込む。^ご飯にかけ、生クリームをたらす。|味の決め手は「あめ色玉ねぎ」「ブラウンルウ」「赤ワインを煮詰める」。デミ缶なしで洋食屋の味に。^ルウを使わないので、自分好みの味に調整できる。
エビピラフ|米:2合,むきえび:200g,玉ねぎ:1/2個,マッシュルーム:4個,ミックスベジタブル:100g|白ワイン:大さじ2,バター:30g,にんにく:1片,コンソメ:小さじ2,塩:小さじ1/2,白こしょう:少々,ローリエ:1枚,パセリ:少々|米は洗ってざるに上げ、30分おく。えびは背わたを取り、片栗粉でもみ洗いして水気を拭く。玉ねぎ・にんにくはみじん切り、マッシュルームは薄切り。^フライパンにバター10gを中火で溶かし、えびを1分炒め、白ワインをふって取り出す。汁は取っておく（えびのうまみが出た汁を米に吸わせる）。^同じフライパンにバター15gを溶かし、にんにく・玉ねぎを3分炒め、マッシュルームを加えて1分。米を加えて3分、米が透き通るまで炒める（米をバターでコーティングすると、パラリと炊ける）。^炊飯器に移し、えびの汁・コンソメ・塩・白こしょうを加え、2合の目盛りより少し少なめに水を入れて混ぜる（炒めた米は水を少なめに）。ローリエ・ミックスベジタブルをのせて普通に炊く。^炊き上がったらえびと残りのバター5gをのせて10分蒸らし、底から大きく混ぜる。パセリを散らす。|味の決め手は「えびの汁を米に吸わせる」ことと「米をバターで炒める」こと。^えびは最後にのせて蒸らすと、ぷりぷりのまま。

ガーリックライス|ご飯:400g,牛こま切れ肉:80g|オリーブオイル:大さじ1.5,にんにく:4片,バター:20g,しょうゆ:大さじ1,酒:小さじ1,塩:少々,黒こしょう:小さじ1/2,パセリ:少々,小ねぎ:適量|にんにくは2片を薄切り、2片をみじん切りにする（芯は取る）。牛肉は細かく切る（ステーキの切れ端でもOK）。^フライパンにオリーブオイルと薄切りにんにくを入れ、弱火で4分、ゆっくりきつね色になるまで加熱して取り出す（ガーリックチップ。焦がすと苦い）。^にんにくの香りが移った油で、みじん切りにんにくを弱火で1分、牛肉を加えて中火で2分炒め、塩・黒こしょうをする（牛肉を入れるとステーキハウスのガーリックライスの味に）。^強めの中火にしてご飯を加え、ほぐしながら2分炒める。^バターを加え、酒・しょうゆを鍋肌から回し入れて香ばしく焦がし、手早く混ぜる（焦がしバターしょうゆの香りが決め手）。黒こしょうをたっぷりふる。^器に盛り、ガーリックチップ・パセリ・小ねぎをのせる。|味の決め手は「にんにくを薄切り＋みじん切りの二段使い」と「焦がしバターしょうゆ」。^黒こしょうはたっぷりが、ステーキハウスの味。

納豆パスタ|スパゲッティ:200g,納豆:2パック,大葉:6枚,小ねぎ:適量,卵黄:2個,のり:適量|塩(ゆで用):大さじ1,オリーブオイル:大さじ1,バター:15g,めんつゆ:大さじ2,しょうゆ:小さじ1,からし:少々,にんにく:少々|納豆は付属のたれ・からし・めんつゆ大さじ1を加えて、白っぽく粘りが出るまで50回混ぜる（よく混ぜるほどふわふわ、うまみが増す）。大葉はせん切り、小ねぎは小口切り。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間通りゆでる。^ボウルにバター・オリーブオイル・残りのめんつゆ・しょうゆ・すりおろしにんにく少々を入れておく。^湯を切ったパスタを熱いうちにボウルに入れ、手早く和える（バターが溶けて全体に絡む）。^器に盛り、納豆をのせて大葉・小ねぎ・刻みのりを散らし、中央に卵黄をのせる。^食べるときによく混ぜて（卵黄と納豆が混ざって、とろとろのソースになる）。|味の決め手は「納豆をよく混ぜる」ことと「バター＋卵黄」。^混ぜると卵黄と納豆が一体になって、濃厚なソースに。
ラザニア|ラザニア:9枚,合いびき肉:300g,玉ねぎ:1個,にんじん:1/3本,セロリ:1/3本,モッツァレラチーズ:100g,ピザ用チーズ:60g|オリーブオイル:大さじ2,にんにく:1片,赤ワイン:100ml,トマト缶:1缶,トマトペースト:大さじ1,ケチャップ:大さじ1,コンソメ:小さじ1,砂糖:小さじ1,塩:小さじ1/2,ナツメグ:少々,バター:40g,薄力粉:大さじ4,牛乳:500ml,塩:小さじ1/4,ナツメグ:少々,粉チーズ:大さじ4|ミートソース（ラグー）：玉ねぎ・にんじん・セロリ・にんにくはみじん切り。鍋にオリーブオイルを熱し、香味野菜を中火で8分、甘い香りがするまで炒める。ひき肉を加え、焼き付けるように4分炒める。赤ワインを加えて2分煮詰め、トマト缶・トマトペースト・ケチャップ・コンソメ・砂糖・塩・ナツメグを加え、弱火で25分煮込む（じっくり煮込むほど深い味に）。^ベシャメルソース：鍋にバターを弱火で溶かし、薄力粉を2分炒め、冷たい牛乳を少しずつ加えて泡立て器で混ぜ、中火で5分とろりとさせて、塩・ナツメグで調える。^ラザニアは表示通りゆでる（ゆで不要タイプはそのまま）。オーブンを200℃に予熱。^耐熱皿（約20×25cm）にミートソース→ラザニア→ベシャメル→ミートソース→ちぎったモッツァレラ→粉チーズの順に3段重ねる。^最上段はラザニアにベシャメル・ミートソース少々・ピザ用チーズ・粉チーズをのせる。^200℃で25〜30分、表面がぐつぐつしてこんがり焼き色がつくまで焼く。15分おいて落ち着かせてから切り分ける（すぐ切ると崩れる）。|味の決め手は「香味野菜のソフリットと赤ワインのラグー」と「ベシャメル」の二つのソース。^焼き上がり後15分休ませると、層がきれいに切り分けられる。
タコス|トルティーヤ:8枚,合いびき肉:250g,玉ねぎ:1/2個,レタス:4枚,トマト:2個,アボカド:1個,ピザ用チーズ:50g,パクチー:適量,ライム:1個|サラダ油:小さじ2,にんにく:1片,チリパウダー:小さじ2,クミン:小さじ1,パプリカパウダー:小さじ1,オレガノ:小さじ1/2,ケチャップ:大さじ2,ウスターソース:大さじ1,しょうゆ:小さじ1,砂糖:小さじ1,塩:小さじ1/3,黒こしょう:少々,タバスコ:少々,サワークリーム:適量|サルサ：トマト1個と玉ねぎ1/4個をみじん切りにし、パクチー・ライム汁・塩少々・タバスコと混ぜる。ワカモレ：アボカドをつぶしてライム汁・塩少々を混ぜる。^残りの玉ねぎ・にんにくはみじん切り。レタスはせん切り、残りのトマトは角切り。^フライパンにサラダ油を中火で熱し、にんにく・玉ねぎを3分、ひき肉を加えて1分触らずに焼き付けてから3分、ポロポロにする。^チリパウダー・クミン・パプリカパウダー・オレガノを加えて1分炒め、香りを立てる（4種のスパイスで本場メキシコのタコミート）。ケチャップ・ウスターソース・しょうゆ・砂糖・塩・黒こしょう・水大さじ3を加えて2分、汁気がなくなるまで炒め煮にする。^トルティーヤはフライパン（油なし）で両面20秒ずつ温める（香ばしく、やわらかく巻ける）。^トルティーヤにレタス・タコミート・チーズ・トマト・サルサ・ワカモレ・サワークリームをのせ、ライムを絞る。|味の決め手は「4種のスパイスのタコミート」と「自家製サルサ＋ワカモレ」。^ライムを絞ると一気に本場の味。
ヤムウンセン|春雨:60g,むきえび:10尾,豚ひき肉:80g,紫玉ねぎ:1/4個,セロリ:1/3本,ミニトマト:6個,パクチー:適量,ピーナッツ:20g,干しえび:大さじ1|ナンプラー:大さじ2,ライム汁:大さじ2,砂糖:大さじ1,にんにく:1片,赤唐辛子:2本,酒:大さじ1|たれ：にんにく・唐辛子をみじん切りにし、ナンプラー・ライム汁（またはレモン汁）・砂糖と混ぜる（甘・酸・塩・辛の4つの味のバランスがタイ料理の真髄）。^春雨は熱湯で表示時間通りゆでて水で洗い、水気を切って食べやすく切る。干しえびはぬるま湯でもどして刻む。^えびは背わたを取って酒を入れた湯で1分ゆでる。ひき肉は小鍋で水大さじ3・酒を加えて中火で2分、ポロポロに炒り煮する。^紫玉ねぎは薄切り、セロリは斜め薄切り、ミニトマトは半分、パクチーはざく切り、ピーナッツは砕く。^ボウルに春雨・えび・ひき肉（温かいうちに）・干しえびを入れ、たれで和えて5分なじませる（温かいうちに和えると味がよくしみる）。^野菜を加えてさっくり混ぜ、器に盛ってパクチー・ピーナッツをのせる。|味の決め手は「甘酸辛塩のたれ」と「干しえび・ピーナッツ」。^ひき肉と春雨が温かいうちに和えると、味がしみ込む。
ラープ|鶏ひき肉:250g,紫玉ねぎ:1/4個,レタス:6枚,パクチー:適量,ミント:適量,小ねぎ:3本,米:大さじ2|ナンプラー:大さじ1.5,ライム汁:大さじ2,砂糖:小さじ2,赤唐辛子:2本,一味唐辛子:小さじ1/2,水:大さじ3|炒り米（カオクア）：フライパン（油なし）で米を弱めの中火で5〜6分、きつね色になるまでからいりし、すり鉢かポリ袋に入れてめん棒で粗く砕く（香ばしい炒り米がラープの命。食感と香りが本場の味に）。^紫玉ねぎは薄切り、小ねぎは小口切り、パクチー・ミントはざく切り、唐辛子は刻む。^フライパンに鶏ひき肉と水を入れて中火にかけ、ほぐしながら3分、ポロポロに火を通す（油を使わずに炒り煮にするのがタイ式）。^火を止めて粗熱を取り、ナンプラー・ライム汁・砂糖・唐辛子・一味を加えて混ぜる。^紫玉ねぎ・小ねぎ・パクチー・ミント・炒り米を加えてさっと混ぜる（ミントの爽やかな香りが加わると一気に本場）。^レタスに包んで食べる。|味の決め手は「炒り米」と「ミント」。この2つで、タイ東北部（イサーン）の本場の味に。^ライム汁を多めにすると、さっぱりとしておつまみに最高。
豚バラと白菜のうま煮|豚バラ肉:200g,白菜:1/4個,しいたけ:3個,にんじん:1/4本,うずら卵:6個|酒:大さじ1,ごま油:大さじ1,しょうが:1かけ,にんにく:1片,水:250ml,鶏がらスープの素:小さじ2,オイスターソース:大さじ1.5,しょうゆ:小さじ2,砂糖:小さじ1,白こしょう:少々,片栗粉:大さじ1.5,ごま油:小さじ1|白菜は芯をそぎ切り、葉はざく切り。豚肉は4cm長さにして酒をもみ込む。しいたけは薄切り、にんじんは短冊、しょうが・にんにくは薄切り。^フライパンにごま油・しょうが・にんにくを入れて弱火で1分、中火にして豚肉を3分、脂が出てカリッとするまで炒める（豚の脂が白菜に絡んで、うまみの元になる）。^白菜の芯・にんじん・しいたけを加えて2分炒め、白菜の葉を加えて1分炒める。^水・鶏がらスープの素・オイスターソース・しょうゆ・砂糖・白こしょうを加え、うずら卵を入れて、ふたをして中火で5分、白菜がくたっとするまで煮る（白菜から出る甘い水分が、極上のスープに）。^水溶き片栗粉（片栗粉＋水大さじ3）を回し入れ、混ぜながら強火で30秒、しっかりとろみをつける。ごま油を回しかける。|味の決め手は「豚バラをカリッと炒める」ことと「オイスターソース」。白菜の甘みが引き立つ。^ご飯にかけて中華丼にしてもおいしい。
春雨スープ|春雨:30g,卵:1個,にんじん:1/4本,乾燥わかめ:2g,しいたけ:2個,豚ひき肉:50g,長ねぎ:1/4本|ごま油:小さじ1,しょうが:少々,水:600ml,鶏がらスープの素:小さじ2,オイスターソース:小さじ1,しょうゆ:小さじ2,酢:小さじ1,塩:少々,白こしょう:少々,いりごま:小さじ1|わかめは水でもどす。にんじんはせん切り、しいたけは薄切り、長ねぎは小口切り。^鍋にごま油を中火で熱し、ひき肉としょうがのすりおろしを1分、ポロポロになるまで炒める（ひき肉を入れると、スープにぐっとコクが出る）。^水・鶏がらスープの素を加えて煮立て、アクを取り、にんじん・しいたけを入れて2分煮る。^春雨を乾燥のまま入れて3〜4分、やわらかくなるまで煮る（春雨がスープのうまみを吸う）。^わかめを加え、オイスターソース・しょうゆ・塩・白こしょうで調える。^溶き卵を細く回し入れ、ふわっと浮いたら火を止め、酢を加える（酢を少し入れると、味が引き締まって後を引く）。長ねぎ・いりごまを散らす。|味の決め手は「ひき肉でコク」と「仕上げの酢少々」。^春雨は乾燥のまま入れて、スープを吸わせる。
かき玉汁|卵:2個,三つ葉:適量,えのき:1/4袋,しょうが:少々|昆布:1枚,水:500ml,かつお節:10g,薄口しょうゆ:小さじ2,みりん:小さじ1,塩:小さじ1/4,片栗粉:小さじ2|だし：鍋に水と昆布を入れて30分おき、弱火で沸騰直前に昆布を取り出し、かつお節を入れて火を止め、2分おいてこす（一番だしで作る、料亭のかき玉汁）。^卵はよく溶きほぐす（白身のかたまりが残らないように。ふわふわに仕上がる）。三つ葉は2cm長さ、えのきは2cm長さ。^だしを中火で温め、えのきを入れて1分、薄口しょうゆ・みりん・塩で調える。^水溶き片栗粉（片栗粉＋水小さじ4）を入れて混ぜ、薄くとろみをつける（とろみが、卵をふんわり浮かせる秘訣）。^だしが沸騰している状態で、溶き卵を菜箸に伝わせて細く回し入れる。^10秒触らず、卵がふわっと浮いたら火を止めてひと混ぜ。三つ葉とおろししょうがを加える。|味の決め手は「一番だし」と「薄いとろみ」。卵がふわふわに浮く。^しょうがを少し加えると、体が温まり、香りもいい。
お吸い物|あさり:250g,三つ葉:適量,ゆずの皮:少々,豆腐:1/4丁|水:500ml,昆布:1枚,酒:大さじ2,薄口しょうゆ:小さじ1,塩:少々|あさりは3%の塩水で1時間砂抜きし、真水に10分つけて塩抜きする。殻をこすり合わせて洗う。豆腐は1cm角。^鍋に水・昆布・あさりを入れて中火にかける（水から昆布と一緒に煮ると、うまみが倍増）。^沸騰直前に昆布を取り出し、アクを丁寧にすくう（澄んだ吸い地にするため、アクは徹底的に）。^あさりの口が開いたら弱火にし、酒・豆腐を加える。味を見て、薄口しょうゆ・塩で調える（あさりの塩分があるので、味を見てから少しずつ）。^椀にあさり・豆腐を盛り、熱い汁を注いで三つ葉とゆずの皮をのせる（ゆずの香りが吸い物の格を上げる）。|味の決め手は「昆布と一緒に水から煮る」ことと「アクを徹底的に取る」こと。^ゆずの皮のひとかけらで料亭の香り。
ユッケジャンスープ|牛こま切れ肉:150g,もやし:1/2袋,にら:1/2束,ぜんまい:50g,長ねぎ:1/2本,卵:1個,しいたけ:2個|ごま油:大さじ1,にんにく:2片,一味唐辛子:大さじ1,コチュジャン:大さじ1,しょうゆ:大さじ1,ナンプラー:小さじ1,砂糖:小さじ1,水:600ml,鶏がらスープの素:小さじ2,牛だし:小さじ1,塩:少々|牛肉は細かく切り、しょうゆ小さじ1（分量外）・すりおろしにんにく少々をもみ込む。にら・長ねぎは5cm長さ、もやしはひげ根を取る、しいたけは薄切り、ぜんまいは水気を切る。^唐辛子油：鍋にごま油・すりおろしにんにく・一味（韓国唐辛子なら最高）を入れて弱火で1分、赤い油になるまで加熱する（本場ユッケジャンの深い辛さと香りの秘訣）。^牛肉を加えて中火で2分炒め、コチュジャンを加えて30秒炒める。^水・鶏がらスープの素・牛だし（あればダシダ）を加えて煮立て、アクを取る。ぜんまい・しいたけ・もやしを加えて弱めの中火で8分煮る（具からうまみが出る）。^しょうゆ・ナンプラー・砂糖・塩で調え、長ねぎ・にらを加えて1分。^溶き卵を回し入れ、ふわっと浮いたら火を止める。|味の決め手は「唐辛子油を自分で作る」ことと「ぜんまい」。本場の焼肉店の味に。^ぜんまいの食感が、ユッケジャンらしさ。
牡蠣鍋|牡蠣:16個,白菜:1/4個,長ねぎ:1本,春菊:1/2束,木綿豆腐:1/2丁,しいたけ:4個,えのき:1袋|片栗粉:大さじ2,塩:少々,昆布:1枚,水:800ml,かつお節:10g,酒:大さじ3,味噌:大さじ3,白味噌:大さじ2,みりん:大さじ2,砂糖:小さじ1,しょうが:1かけ|牡蠣は片栗粉と塩でやさしくもみ洗いし、水で2〜3回すすいで水気を拭く。^だし：水と昆布を30分おき、弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす。^白菜はざく切り、長ねぎは斜め切り、春菊は葉を摘む、豆腐は8等分、しいたけは飾り包丁、えのきはほぐす。^味噌・白味噌・みりん・砂糖を混ぜ、しょうがのすりおろしを加える（2種の味噌＋しょうがで、牡蠣の臭みを消し、甘くまろやかな広島の味に）。^土鍋にだし・酒を入れて中火で煮立て、味噌だれを溶き入れる。白菜の芯・豆腐・しいたけ・えのき・長ねぎを入れて5分煮る。^白菜の葉を加え、牡蠣を入れて2〜3分、ぷっくりふくらんだら食べどき（煮すぎると縮んで硬くなる）。春菊は最後に。〆はご飯と卵で味噌雑炊に。|味の決め手は「2種の味噌＋しょうが」と「牡蠣は最後に入れて煮すぎない」こと。^〆の味噌雑炊は、牡蠣のエキスがたっぷりで格別。
カレー鍋|豚バラ肉:250g,白菜:1/4個,長ねぎ:1本,にんじん:1/3本,しめじ:1パック,じゃがいも:1個,ウインナー:4本|昆布:1枚,水:900ml,かつお節:15g,カレールウ:3かけ,カレー粉:小さじ1,しょうゆ:大さじ1.5,みりん:大さじ1,砂糖:小さじ1,鶏がらスープの素:小さじ1,にんにく:1片,しょうが:1かけ,ピザ用チーズ:50g|だし：水と昆布を30分おいて弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす（和風だしで割ると、そば屋のカレーのような深い味に）。^豚肉は5cm長さ、白菜はざく切り、長ねぎは斜め切り、にんじんは薄い短冊、しめじはほぐす、じゃがいもは薄切りにしてレンジで3分加熱。^土鍋にだし・鶏がらスープの素・すりおろしにんにく・しょうがを入れて中火で煮立て、豚肉とにんじんを入れて3分煮る。アクを取る。^火を止めてカレールウを溶かし、カレー粉（香りが立つ）・しょうゆ・みりん・砂糖を加える。^白菜・長ねぎ・しめじ・じゃがいも・ウインナーを加え、ふたをして弱めの中火で8分煮る（ルウが入ると焦げやすいので、沸騰後は弱めの中火に）。^〆はうどんを入れてカレーうどん、またはご飯とチーズでカレーリゾット。|味の決め手は「和風だし＋カレー粉＋ルウ」。^〆までが楽しいカレー鍋。
なすの田楽|なす:3本|サラダ油:大さじ3,味噌:大さじ2,白味噌:大さじ1,砂糖:大さじ1.5,みりん:大さじ1.5,酒:大さじ1,卵黄:1個,いりごま:小さじ1,けしの実:少々|田楽味噌：小鍋に味噌・白味噌・砂糖・みりん・酒を入れて弱火にかけ、木べらで混ぜながら3分練る。火を止めて卵黄を加えて混ぜる（卵黄を入れると、つやとコクが出る料亭の田楽味噌に）。^なすはヘタを取って縦半分に切り、切り口に格子状の切り込みを入れる（火の通りがよく、味噌がのりやすい）。皮目に竹串で数か所穴をあける。^フライパンにサラダ油を中火で熱し、なすを切り口から入れて3分焼く。返してふたをし、弱めの中火で5分、竹串がすっと通るまで蒸し焼きにする（なすがとろとろに）。^切り口に田楽味噌を塗り、トースター（またはグリル）で2〜3分、味噌がふつふつしてこんがりするまで焼く。^いりごまとけしの実をふる。|味の決め手は「卵黄入りの2種の味噌」。つやとコクが料亭の田楽に。^なすはたっぷりの油で焼くと、とろとろの食感に。
ピクルス|きゅうり:2本,パプリカ:1個,にんじん:1/2本,大根:150g,カリフラワー:1/4株,セロリ:1/2本|酢:150ml,白ワイン:50ml,水:150ml,砂糖:大さじ4,塩:小さじ2,ローリエ:2枚,黒こしょう:粒10粒,赤唐辛子:1本,にんにく:1片|きゅうりは2cm長さ、パプリカは2cm幅、にんじん・大根は1cm角の棒状、カリフラワーは小房、セロリは2cm長さに切る。^きゅうり・大根に塩少々（分量外）をふって10分おき、水気を拭く（水っぽくならず、味がしみやすい）。^にんじん・カリフラワーは熱湯で30秒ゆでる（味がしみやすく、生臭さが抜ける）。^ピクルス液：小鍋に酢・白ワイン・水・砂糖・塩・ローリエ・黒こしょう粒・唐辛子・つぶしたにんにくを入れて中火にかけ、砂糖が溶けて煮立ったら火を止める（スパイスとワインで、デリのような本格的な味に）。^煮沸した保存瓶に野菜を詰め、熱いピクルス液を注ぐ（熱いうちに注ぐと味が早くなじむ）。^粗熱が取れたら冷蔵庫で半日以上漬ける。1〜2週間保存可能。|味の決め手は「白ワインとスパイス」。お店のような香り高いピクルスに。^きゅうりと大根は塩で水分を抜いておくと、ポリポリ食感に。
たこの唐揚げ|ゆでだこ:250g,レモン:1/2個|しょうゆ:大さじ1,酒:大さじ1,みりん:小さじ1,にんにく:少々,しょうが:1かけ,ごま油:小さじ1,片栗粉:大さじ3,薄力粉:大さじ1,揚げ油:適量,青のり:少々,マヨネーズ:適量|たこはひと口大の乱切りにし、ペーパーで水気をしっかり拭く（水気が残ると油が激しくはねる）。^しょうゆ・酒・みりん・すりおろしにんにくとしょうが・ごま油を絡めて15分おく。^汁気をペーパーで軽く拭き、片栗粉と薄力粉を混ぜたものを全体にまぶす（2種の粉で、カリッとしつつ衣がはがれにくい）。^揚げ油を180℃に熱し、たこを入れて1分〜1分半揚げる（たこはゆでてあるので、衣がカリッとすればOK。長く揚げると硬くなる）。^油を切り、青のりをふる。レモンとマヨネーズを添えて。|味の決め手は「水気をしっかり拭く」ことと「高温短時間」。^青のりとレモンマヨで、居酒屋の定番の味に。
フルーツサンド|食パン:4枚,いちご:6個,キウイ:1個,黄桃缶:1/2缶,バナナ:1本,生クリーム:200ml,マスカルポーネ:50g|砂糖:大さじ2,バニラエッセンス:少々|クリーム：生クリームに砂糖・マスカルポーネ（なければクリームチーズ少々）・バニラエッセンスを加え、ボウルの底を氷水に当てて泡立てる。角がピンと立つ「9分立て」まで（マスカルポーネを入れると、濃厚でだれにくい。切ったとき断面がシャープに）。^フルーツは水気をしっかり拭き取る（水気があるとクリームがゆるむ）。いちごはへたを取る、キウイは皮をむいて縦4等分、黄桃は汁を切って厚めに切る、バナナは長さを揃える。^食パン2枚の片面にクリームを薄く塗る。^1枚にクリームを少しのせ、切ったときの断面を想像しながら、対角線上にフルーツを並べる（対角線で切るなら、対角線上に並べる）。^フルーツの隙間を埋めるようにクリームをたっぷりのせ、もう1枚で挟む。^ラップでぴったり包み、切る方向にペンで印をつけて、冷蔵庫で1時間以上冷やす。包丁を湯で温めて拭き、ラップごと耳を落として、印に沿って切る。|味の決め手は「マスカルポーネ入りの固めのクリーム」。濃厚で、断面がきれいに切れる。^冷蔵庫で1時間以上冷やすと、クリームが締まってきれいな断面に。
鶏の竜田揚げ|鶏もも肉:2枚,レタス:2枚,すだち:1個|しょうゆ:大さじ2,みりん:大さじ1,酒:大さじ1,しょうが:1かけ,にんにく:少々,ごま油:小さじ1,片栗粉:大さじ6,揚げ油:適量,塩:少々|鶏肉は余分な脂を取り、ひと口大のそぎ切りにする（厚さを揃えると揚げムラがない）。^しょうゆ・みりん・酒・すりおろししょうが（たっぷり）・にんにく・ごま油をもみ込み、冷蔵庫で30分漬ける（しょうゆとみりんの甘辛い下味が、竜田揚げの特徴）。^汁気をペーパーで軽く拭き、片栗粉をまぶす。5分おいて粉が湿ってきたら、もう一度薄く片栗粉をはたく（白く粉をふいたような、紅葉の竜田川を思わせる竜田らしい衣に）。^揚げ油を170℃に熱し、鶏肉を入れて3分揚げて取り出し、3分休ませる。^油を190℃に上げ、30秒〜1分二度揚げしてカリッとさせる。^油を切り、レタスとすだちを添える。|味の決め手は「みりん入りの甘めの下味」と「片栗粉の二度づけ」。^すだちを絞ると、さっぱりと上品な味に。
さばの竜田揚げ|さば:2切れ,大葉:4枚,大根:100g|しょうゆ:大さじ1.5,酒:大さじ1,みりん:小さじ1,しょうが:1かけ,片栗粉:大さじ4,揚げ油:適量,ポン酢しょうゆ:大さじ2|さばは小骨を抜き、2cm幅のそぎ切りにする。塩少々（分量外）をふって10分おき、出た水分を拭く（臭みが抜ける）。^しょうゆ・酒・みりん・すりおろししょうが（たっぷり。臭み消し）を絡めて15分漬ける（漬けすぎると身が硬くなる）。^汁気をペーパーで拭き、片栗粉をまぶして3分おく。^揚げ油を170℃に熱し、皮目を下にして入れ、2分半〜3分、カラッとするまで揚げる。^油を切り、大葉を敷いた器に盛る。大根おろしとポン酢を添える（おろしポン酢で、脂ののったさばをさっぱりと）。|味の決め手は「塩をして臭みを抜く」ことと「しょうがたっぷり」。^おろしポン酢でさっぱり。冷めてもおいしく、お弁当にも。
鮭の西京焼き|生鮭:2切れ,はじかみ:2本|塩:小さじ1/4,西京味噌:大さじ4,みりん:大さじ1.5,酒:大さじ1,砂糖:小さじ1|鮭は塩をふって15分おき、出た水分を拭く（臭みが抜け、味噌の入りがよくなる）。^味噌床：西京味噌（白味噌）・みりん・酒・砂糖を混ぜる（甘くまろやかな京都の味噌床）。^ラップに味噌床の半量を広げ、ガーゼ（またはキッチンペーパー）を敷いて鮭をのせ、上にもペーパーと残りの味噌床をのせて包む（直接味噌に触れないので焦げにくく、拭き取りも簡単）。冷蔵庫で2〜3日漬ける（2日以上漬けると味がしっかり入り、身がしっとり）。^鮭を取り出し、味噌をきれいに拭き取る（味噌が残ると一瞬で焦げる）。^魚焼きグリルの弱めの中火で8〜10分（両面焼き）、焦げそうならアルミホイルをかぶせる。フライパンならクッキングシートを敷き、弱めの中火でふたをして片面4分ずつ。^こんがりとした焼き色がつけば完成。はじかみ（甘酢しょうが）を添える。|味の決め手は「2〜3日しっかり漬ける」ことと「弱めの火でじっくり焼く」こと。料亭の西京焼きに。^味噌床は2回まで使える。
鶏肉のみぞれ煮|鶏もも肉:1.5枚,大根:300g,しめじ:1/2パック,小ねぎ:適量|塩:少々,片栗粉:大さじ1.5,サラダ油:小さじ2,だし:200ml,しょうゆ:大さじ2,みりん:大さじ2,酒:大さじ1,砂糖:小さじ1,しょうが:1かけ,七味唐辛子:少々|大根はすりおろし、ざるに上げて軽く水気を切る（汁は少し残す）。しょうがはすりおろす。しめじはほぐす。^鶏肉はひと口大に切り、塩をふって片栗粉をまぶす（つるんとした食感になり、煮汁にとろみがつく）。^フライパンにサラダ油を中火で熱し、鶏肉を皮目から入れて4分、こんがり焼き色をつけ、返して2分焼く（焼き色が煮汁の香ばしさに）。^余分な脂を拭き取り、だし・しょうゆ・みりん・酒・砂糖・しめじを加えて煮立て、ふたをして弱めの中火で5分煮る。^大根おろしとしょうがを加え、ひと煮立ちさせて1分で火を止める（おろしは煮すぎると辛みも風味も飛ぶ）。^器に盛り、小ねぎを散らし、七味をふる。|味の決め手は「鶏を焼き付ける」ことと「大根おろしは最後に加えて煮すぎない」こと。^片栗粉の衣が、みぞれ煮をとろりとまとめる。
厚揚げの煮物|厚揚げ:2枚,いんげん:8本,しいたけ:3個,鶏ひき肉:60g|昆布:1枚,水:350ml,かつお節:10g,酒:大さじ1,砂糖:大さじ1,みりん:大さじ1.5,しょうゆ:大さじ1.5,薄口しょうゆ:小さじ1,しょうが:少々|だし：水と昆布を30分おき、弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす。^厚揚げは熱湯を回しかけて油抜きし（味がしみやすく、油臭さが消える）、ひと口大に切る。いんげんはヘタを取って半分、しいたけは半分に切る。^鍋にひき肉と酒を入れて中火で1分炒る（鶏ひき肉を少し加えると、煮汁にうまみが出る）。^だし・砂糖・みりんを加えて煮立て、厚揚げ・しいたけを入れ、落としぶたをして弱めの中火で8分煮る。^しょうゆ・薄口しょうゆ・しょうがのすりおろしを加え、5分煮る。いんげんを加えて3分。^火を止めて15分おき、味を含ませる。|味の決め手は「鶏ひき肉でうまみを足す」ことと「だし」。^冷めるときに厚揚げが煮汁を吸い、じゅわっとおいしくなる。
いかと里芋の煮物|いか:1杯,里芋:8個,絹さや:6枚|塩:小さじ1,だし:300ml,酒:大さじ3,砂糖:大さじ1.5,みりん:大さじ2,しょうゆ:大さじ2,しょうが:1かけ|里芋は皮をむいて塩でもみ、ぬめりを洗い流す。水から入れて5分下ゆでし、水で洗う（ぬめりを取ると味がしみ、煮汁が濁らない）。^いかは胴から足とわたを抜き、軟骨を取る。胴は1cm幅の輪切り、足は2本ずつに切る。わたは取っておく（わたを少し加えると、コクが格段に深まる）。しょうがは薄切り。^鍋にだし・酒・しょうがを入れて中火で煮立て、いかを入れて1分煮て、いったん取り出す（いかは煮すぎると硬くなるので最初に取り出しておく。いかのうまみはだしに移る）。^いかのうまみが出ただしに、里芋・砂糖・みりんを入れ、落としぶたをして弱めの中火で12分煮る。^しょうゆといかのわた（少量、袋を破って中身を）を加えて、さらに8分、里芋がやわらかくなるまで煮る。^いかを戻して2分煮る。火を止めてしばらくおき、味を含ませる。塩ゆでした絹さやを添える。|味の決め手は「いかを先に取り出してだしにうまみを移す」ことと「いかのわた少々」。^わたを入れると、料亭の煮物のような深いコクに。
たけのこご飯|米:2合,ゆでたけのこ:200g,油揚げ:1枚,鶏もも肉:80g|昆布:1枚,酒:大さじ2,薄口しょうゆ:大さじ1.5,しょうゆ:小さじ1,みりん:大さじ1,塩:小さじ1/3,かつお節:5g,木の芽:適量|米は洗ってざるに上げ、30分おく。^たけのこは穂先を薄いくし形、根元を薄いいちょう切りにし、熱湯で1分ゆでて水煮の臭いを抜く。油揚げは油抜きして細切り。鶏肉は1cm角に切る。^小鍋に水200ml（分量外）・かつお節を入れて2分煮出してこし、酒・薄口しょうゆ・しょうゆ・みりん・塩を加える。たけのこ・油揚げ・鶏肉を入れて中火で3分煮て、具に下味をつける（具と煮汁に分ける）。^炊飯器に米と煮汁を入れ、2合の目盛りまで水を加えて混ぜる。昆布をのせ、具を上にのせて（混ぜないとムラなく炊ける）普通に炊く。^炊き上がったら昆布を取り出し、10分蒸らして底から大きく混ぜる。^器に盛り、木の芽をのせる（春の香り）。|味の決め手は「具を先に煮て下味をつける」ことと「かつお節で取っただし」。^鶏肉を少し加えると、うまみとコクが増す。木の芽で香り豊かに。
赤飯|もち米:2合,小豆:50g|塩:小さじ1/2,黒ごま:小さじ1,塩:小さじ1/2|小豆はさっと洗い、鍋に水600ml（分量外）と入れて強火にかける。沸騰したら5分ゆでて湯を捨てる（渋切り。えぐみを取る）。^再び水600mlを加え、中火で15〜20分、指でつぶせる手前（少し硬め）までゆでる。小豆とゆで汁に分けて冷ます。^ゆで汁をお玉ですくって、高い位置から何度も落とし、空気に触れさせる（酸化して鮮やかな赤色になる。昔ながらの知恵）。^もち米を洗い、ゆで汁に浸して一晩（最低2時間）おく（しっかり色を移す）。^炊飯器にもち米とゆで汁を入れ、おこわの目盛り（なければ2合の目盛りより少し少なめ）に合わせ、塩小さじ1/2を加えて小豆をのせて炊く。^炊き上がったら10分蒸らし、さっくり混ぜる。ごま塩（黒ごまをからいりして塩小さじ1/2と混ぜる）をふる。|味の決め手は「渋切り」と「ゆで汁を空気に触れさせる」こと。鮮やかな赤色に。^ごま塩は、黒ごまをからいりしてから塩と合わせると香りがいい。
たけのこの土佐煮|ゆでたけのこ:300g,かつお節:3パック,木の芽:適量|昆布:1枚,だし:300ml,酒:大さじ2,砂糖:大さじ1,みりん:大さじ2,薄口しょうゆ:大さじ1,しょうゆ:小さじ2|たけのこは穂先をくし形、根元を1cm厚の半月切りにする。熱湯で2分ゆでて臭みを抜く。^かつお節1パックはフライパンで弱火で1分からいりし、手でもんで粉状にする（粉がつおにすると、たけのこにまとわりつき、香りが立つ）。^鍋に昆布を敷き、だし・酒・砂糖・みりんを入れて中火で煮立て、たけのこを入れて落としぶたをし、弱めの中火で10分煮る。^薄口しょうゆ・しょうゆ・かつお節1パックを加えて、さらに8分、煮汁が少なくなるまで煮る（かつお節で煮ることで、うまみがしみ込む）。^火を止めて粉がつおをまぶす（煮る用と仕上げ用の二段使いで、うまみと香りが両方生きる）。^器に盛り、残りのかつお節と木の芽をのせる。|味の決め手は「かつお節を煮る用と仕上げ用の二段使い」。^粉がつおをまぶすと、香り高い土佐煮に。
かぶと油揚げの煮物|かぶ:4個,油揚げ:1枚,鶏ひき肉:50g|昆布:1枚,水:350ml,かつお節:10g,酒:大さじ1,みりん:大さじ1,薄口しょうゆ:大さじ1,塩:小さじ1/4,片栗粉:小さじ1,しょうが:少々|だし：水と昆布を30分おき、弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす。^かぶは茎を2cm残して葉を切り、皮をむいて4〜6等分のくし形に切る。茎の付け根の泥を竹串でよく落とす。葉は3cm長さに切る。油揚げは油抜きして短冊切り。^鍋にひき肉・酒を入れて中火で1分炒り、だし・みりん・薄口しょうゆ・塩・油揚げを加えて煮立てる。^かぶを入れ、落としぶたをして弱めの中火で6〜7分煮る（かぶはすぐやわらかくなるので煮すぎない）。^竹串がすっと通ったら葉を加えて1分。水溶き片栗粉でごく薄くとろみをつける（とろみで煮汁がかぶに絡み、冷めにくい）。^火を止め、すりおろししょうがを加える。|味の決め手は「鶏ひき肉で少しうまみを足す」ことと「薄いとろみ」。^かぶは煮すぎないこと。とろけるやわらかさの手前で止める。
なすの揚げびたし|なす:4本,みょうが:2個,小ねぎ:適量,しょうが:1かけ|揚げ油:適量,だし:250ml,しょうゆ:大さじ2,薄口しょうゆ:小さじ1,みりん:大さじ2.5,砂糖:小さじ1,酢:小さじ1,かつお節:1パック|浸し地：鍋にだし・しょうゆ・薄口しょうゆ・みりん・砂糖を入れてひと煮立ちさせ、火を止めて酢を加え、バットに移す（酢を少し入れると、味が締まって後を引く）。^なすはヘタを取って縦半分に切り、皮目に斜めに細かく切り込みを入れ、長さを半分に切る。水気をしっかり拭く。^揚げ油を170℃に熱し、なすを皮目から入れて1分半、返して1分、全体がしんなりするまで揚げる（皮が鮮やかな紫になる）。^油を切り、熱いうちに浸し地に漬ける（熱いうちに漬けると、味がジュワッとしみる）。^みょうがはせん切り、しょうがはすりおろし、小ねぎは小口切り。^15分以上おき、器に盛ってみょうが・しょうが・小ねぎ・かつお節をのせる。冷蔵庫で冷やしてもおいしい。|味の決め手は「揚げたてを熱いうちに漬ける」ことと「酢少々」。^冷やすと、夏の定番の一品に。
かぼちゃのそぼろあんかけ|かぼちゃ:400g,鶏ひき肉:150g|だし:300ml,酒:大さじ2,砂糖:大さじ1.5,みりん:大さじ2,しょうゆ:大さじ1,薄口しょうゆ:小さじ1,だし:150ml,しょうゆ:小さじ2,みりん:小さじ2,砂糖:小さじ1,片栗粉:小さじ2,しょうが:1かけ|かぼちゃは種とわたを取り、4cm角に切って皮をところどころむき、面取りする。^鍋にかぼちゃ（皮を下に）・だし300ml・酒・砂糖大さじ1.5を入れ、中火で煮立てたら落としぶたをして弱めの中火で6分煮る。みりん大さじ2・しょうゆ大さじ1・薄口しょうゆを加えて5〜7分、竹串が通るまで煮て、器に盛る。^そぼろあん：別の小鍋に鶏ひき肉・だし150ml・しょうゆ小さじ2・みりん小さじ2・砂糖小さじ1・すりおろししょうがを入れ、火にかける前に菜箸でよくほぐす（火にかける前にほぐすと、ダマにならずなめらかなそぼろに）。^中火にかけて混ぜながら3分、肉に火が通ったらアクを取る。かぼちゃの煮汁を少し加える。^水溶き片栗粉を回し入れ、混ぜながら30秒、とろみをつける。^かぼちゃにそぼろあんをかける。|味の決め手は「ひき肉を火にかける前にほぐす」ことと「しょうが」。^かぼちゃの煮汁をあんに少し加えると、味に一体感が出る。
豆腐ハンバーグ|木綿豆腐:1/2丁,鶏ひき肉:200g,玉ねぎ:1/4個,にんじん:1/4本,大根:200g,大葉:5枚,しいたけ:2個|パン粉:大さじ3,卵:1/2個,味噌:小さじ1,しょうが:1かけ,塩:少々,片栗粉:大さじ1,サラダ油:小さじ2,酒:大さじ2,だし:100ml,しょうゆ:大さじ1.5,みりん:大さじ1.5,砂糖:小さじ1,片栗粉:小さじ1,ポン酢しょうゆ:大さじ2|豆腐はペーパーで包み、重しをして30分水切りする（重さが2/3程度に。水切りが足りないと崩れる）。玉ねぎ・にんじん・しいたけはみじん切りにしてレンジで2分加熱し、冷ます。^ボウルにひき肉・塩・味噌を入れて粘りが出るまで練る（味噌でうまみとふんわり感）。豆腐をくずしながら加え、卵・パン粉・野菜・すりおろししょうが・片栗粉を混ぜる。^4等分して小判形にし、中央をくぼませる（手に油を塗って成形）。^フライパンにサラダ油を中火で熱し、3分焼いて返し、酒を加えてふたをし、弱火で7分蒸し焼きにする。^和風あん：ハンバーグを取り出したフライパンにだし・しょうゆ・みりん・砂糖を入れて煮立て、水溶き片栗粉でとろみをつける。^器に盛り、あんをかけ、大根おろし・大葉をのせ、ポン酢をかける。|味の決め手は「味噌を練り込む」ことと「とろみのある和風あん」。ふわふわでヘルシーなのに満足感。^豆腐の水切りをしっかりすると、焼いても崩れない。
鶏つみれ汁|鶏ひき肉:250g,大根:150g,にんじん:1/3本,長ねぎ:1本,ごぼう:1/3本,しいたけ:2個|長ねぎ:5cm,しょうが:1かけ,卵:1/2個,片栗粉:大さじ1,味噌:小さじ2,塩:少々,昆布:1枚,水:900ml,かつお節:10g,酒:大さじ2,薄口しょうゆ:大さじ1.5,みりん:小さじ1,塩:小さじ1/3,七味唐辛子:少々|つみれ：鶏ひき肉に長ねぎ（みじん切り）・すりおろししょうが・溶き卵・片栗粉・味噌・塩を加え、粘りが出るまで1分練る（味噌を入れると臭みが消え、ふんわり）。^だし：水と昆布を30分おき、弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす。^大根・にんじんはいちょう切り、ごぼうはささがき（水にさらす）、しいたけは薄切り、長ねぎは斜め切り。^鍋にだし・酒・大根・にんじん・ごぼう・しいたけを入れて中火で煮立て、弱めの中火で8分煮る。^つみれをスプーン2本で丸めて落とし入れ、5分煮る。浮いてきたらアクを取る（つみれから出るうまみがだしに溶け、汁が格段においしくなる）。^薄口しょうゆ・みりん・塩で調え、長ねぎを加えて1分煮る。七味を添えて。|味の決め手は「つみれに味噌としょうが」と「ごぼう」。ごぼうの香りが汁に深みを出す。^つみれを煮るとだしが出るので、つゆの味つけは控えめに。
粕汁|生鮭:2切れ,大根:150g,にんじん:1/3本,こんにゃく:1/4枚,油揚げ:1枚,長ねぎ:1/2本,里芋:2個|酒粕:80g,昆布:1枚,水:800ml,かつお節:10g,味噌:大さじ1.5,白味噌:大さじ1,薄口しょうゆ:小さじ1,七味唐辛子:少々|酒粕は小さくちぎってボウルに入れ、温めた水100ml（分量外）を加えて15分おき、やわらかくしてなめらかに溶く（板粕はしっかりふやかすのが、ダマにならないコツ）。^だし：水と昆布を30分おき、弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす。^鮭は塩少々（分量外）をふって10分おき、熱湯をかけて臭みを抜き、ひと口大に切る。大根・にんじんはいちょう切り、こんにゃくはちぎって下ゆで、油揚げは油抜きして短冊、里芋は塩もみして1cm厚、長ねぎは斜め切り。^鍋にだし・大根・にんじん・こんにゃく・油揚げ・里芋を入れて中火で煮立て、弱めの中火で10分煮る。^鮭を加えて3分煮る。溶いた酒粕を加えて弱火で5分煮る（アルコールを飛ばしてまろやかに）。^味噌・白味噌・薄口しょうゆを溶き入れ、長ねぎを加えて煮えばなで火を止める。七味を添えて。|味の決め手は「酒粕をしっかりふやかす」ことと「2種の味噌」。体の芯から温まる。^鮭のうまみと酒粕のコクが溶け合う冬の味。
冷や汁|あじの干物:2枚,きゅうり:1本,木綿豆腐:1/2丁,大葉:6枚,みょうが:2個,ご飯:400g|いりごま:大さじ4,味噌:大さじ3,麦味噌:大さじ1,だし:500ml,砂糖:小さじ1|あじの干物はグリルで焼き、皮と骨を取って身をほぐす。^いりごまをすり鉢でよくすり、ほぐしたあじを加えてさらにする。味噌・麦味噌（宮崎の冷や汁は麦味噌。なければ普通の味噌で）・砂糖を加えて混ぜる。^すり鉢の内側に味噌を薄く塗り広げ、逆さにしてコンロの火で3分、焦げ目がつくまであぶる（香ばしさが宮崎冷や汁の決め手。アルミホイルに広げてトースターで5分焼いても可）。^冷たいだしで少しずつのばし、冷蔵庫でよく冷やす（氷を浮かべても）。^きゅうりは薄い輪切りにして塩もみし、水気を絞る。豆腐は手でちぎる。大葉・みょうがはせん切り。^冷や汁にきゅうり・豆腐・大葉・みょうがを加え、温かいご飯（または冷やご飯）にかけて食べる。|味の決め手は「味噌を焼き付ける」ことと「すりごま＋焼きあじ」。香ばしく、うまみたっぷり。^温かいご飯に冷たい汁をかけるのが宮崎流。
ちくわの磯辺揚げ|ちくわ:6本,チーズ:30g|薄力粉:大さじ5,冷水:大さじ5,青のり:大さじ1,和風だしの素:小さじ1/4,マヨネーズ:小さじ1,揚げ油:適量|ちくわは縦半分に切り、長さを半分に切る（お好みで、穴にスティック状のチーズを詰めても）。^衣：薄力粉・和風だしの素・青のり（たっぷり）・マヨネーズを混ぜ、冷水を加えてさっくり混ぜる（冷水でカラッと、マヨネーズでサクッと軽く、だしで衣にもうまみ）。^揚げ油を170℃に熱し、ちくわに衣をつけて入れる。^1分半〜2分、衣がカリッと薄く色づくまで揚げる。^油を切る。お弁当にもおつまみにも。|味の決め手は「青のりたっぷり」と「衣にマヨネーズとだし」。冷めてもサクサク。^チーズを詰めると、子どもに大人気の一品に。
お雑煮|もち:4個,鶏もも肉:120g,大根:100g,にんじん:1/4本,小松菜:2株,かまぼこ:4切れ,しいたけ:2個,三つ葉:適量,ゆずの皮:少々|昆布:1枚,水:800ml,かつお節:15g,酒:大さじ1,薄口しょうゆ:大さじ1,しょうゆ:小さじ1,みりん:小さじ1,塩:小さじ1/3|だし：水と昆布を1時間おき、弱火で沸騰直前に昆布を取り出し、かつお節を入れて2分煮出してこす（お正月こそ一番だしで）。^鶏肉は小さめのひと口大に切り、熱湯をかけて霜降りにする（臭みとアクを取り、澄んだ汁に）。大根・にんじんは5mm厚の輪切り（にんじんは花形に）にして3分下ゆで。小松菜は塩ゆでして4cm長さ。しいたけは飾り包丁。^鍋にだし・酒・鶏肉・大根・にんじん・しいたけを入れて中火で煮立て、アクを取って弱めの中火で8分煮る。^薄口しょうゆ・しょうゆ・みりん・塩で調える（関東風のすまし仕立て）。^もちはトースターで5〜6分、ふくらんで焼き色がつくまで焼く（関東風。関西風は丸もちを汁で煮る）。^椀に焼いたもちを入れ、具を盛り、熱い汁を注ぐ。かまぼこ・小松菜・三つ葉・ゆずの皮をのせる。|味の決め手は「一番だし」と「鶏を霜降りにする」こと。澄んだ上品な汁に。^ゆずの皮がお正月らしい香りを添える。
卵がゆ|ご飯:200g,卵:2個,小ねぎ:適量,梅干し:1個|昆布:1枚,水:700ml,かつお節:5g,酒:小さじ1,薄口しょうゆ:小さじ1,塩:小さじ1/4,しょうが:少々|だし：水と昆布を30分おき、弱火で沸騰直前に昆布を取り出し、かつお節で2分煮出してこす（だしで炊くと、おかゆが一段とおいしい）。^ご飯はざるに入れて流水でさっと洗い、ぬめりを取る（さらりとしたおかゆになる）。^鍋にだし・酒・ご飯を入れて中火で煮立て、弱火にしてふたを少しずらし、12分煮る。混ぜすぎない（粘りが出る）。^薄口しょうゆ・塩で調える。^溶き卵を細く回し入れ、ふたをして火を止め、1分蒸らす（ふんわり半熟に）。^器に盛り、小ねぎ・おろししょうがを散らし、梅干しを添える。|味の決め手は「だしで炊く」ことと「卵はふたをして余熱で」。^体調が悪いときにも、だしのうまみでほっとする味。
肉巻きおにぎり|ご飯:400g,豚バラ肉:10枚,大葉:5枚,卵黄:1個|塩:少々,いりごま:小さじ2,薄力粉:少々,サラダ油:小さじ1,しょうゆ:大さじ2,みりん:大さじ2,砂糖:小さじ2,酒:大さじ1,にんにく:少々,コチュジャン:小さじ1/2|ご飯に塩少々といりごまを混ぜ、10等分して俵形にしっかりにぎる（崩れないよう、しっかりめに）。大葉を半分に切ってご飯に巻く（大葉の香りで、甘辛い肉巻きがさっぱり）。^豚肉を広げ、ご飯全体を覆うように斜めにずらしながら巻きつけ、薄力粉を薄くまぶす（粉でたれが絡み、肉がはがれにくい）。^たれ：しょうゆ・みりん・砂糖・酒・すりおろしにんにく・コチュジャン（隠し味のコク。宮崎の屋台の味）を混ぜる。^フライパンにサラダ油を中火で熱し、肉の巻き終わりを下にして並べる。転がしながら6分、全体に焼き色をつける。^出た脂をペーパーで拭き取り、たれを加えて中火で2分、転がしながら照りよく絡める。^器に盛る。卵黄を絡めて食べてもおいしい。|味の決め手は「大葉を巻く」ことと「隠し味のコチュジャン」。^薄力粉をまぶすと、たれがよく絡み、照りが出る。
牛肉とブロッコリーのオイスター炒め|牛こま切れ肉:250g,ブロッコリー:1株,パプリカ:1/2個,長ねぎ:1/3本|しょうゆ:小さじ1,酒:小さじ2,卵:1/2個,片栗粉:小さじ2,サラダ油:大さじ1.5,にんにく:1片,しょうが:1かけ,オイスターソース:大さじ1.5,しょうゆ:小さじ1,酒:大さじ1,砂糖:小さじ1,鶏がらスープの素:小さじ1/4,水:大さじ2,片栗粉:小さじ1/2,ごま油:小さじ1,黒こしょう:少々|牛肉にしょうゆ小さじ1・酒小さじ2・溶き卵をもみ込み、片栗粉をまぶして、サラダ油小さじ1（分量外）を絡める（卵→片栗粉→油の順で、中華料理店のようにやわらかく）。^ブロッコリーは小房に分け、茎は皮をむいて薄切り。熱湯に塩とサラダ油少々を入れ、1分ゆでてざるに上げる（油を入れると色鮮やかでつやが出る）。^合わせ調味料：オイスターソース・しょうゆ・酒・砂糖・鶏がらスープの素・水・片栗粉を混ぜる。^フライパンにサラダ油大さじ1を中火で熱し、牛肉を広げて1分半、色が変わったら取り出す。^残りのサラダ油でにんにく・しょうが・長ねぎを10秒、ブロッコリー・パプリカを加えて強火で1分炒める。^牛肉を戻し、合わせ調味料を回し入れて30秒、照りよく絡め、ごま油・黒こしょうを加える。|味の決め手は「牛肉の下味（卵→片栗粉→油）」と「ブロッコリーをゆでるときに油を入れる」こと。^強火で手早く仕上げると、つやつやの中華料理店の味。
えびと卵の炒め物|むきえび:200g,卵:4個,長ねぎ:1/3本,きくらげ:3g,トマト:1個|塩:少々,酒:小さじ1,卵白:1/2個分,片栗粉:小さじ2,サラダ油:大さじ3,しょうが:少々,鶏がらスープの素:小さじ1/2,砂糖:小さじ1/2,塩:少々,酒:大さじ1,ごま油:小さじ1|えびは背わたを取り、片栗粉と塩でもみ洗いして水気を拭く。塩・酒・卵白をもみ込み、片栗粉小さじ1をまぶす（卵白でぷりぷりに）。きくらげはもどす。トマトはくし形、長ねぎは斜め薄切り。^卵に鶏がらスープの素・砂糖・塩・片栗粉小さじ1（水小さじ2で溶く）を加えて溶く（片栗粉を少し入れると、ふわふわで冷めても固くならない）。^フライパンにサラダ油大さじ1を中火で熱し、えびを2分炒めて色が変わったら取り出す。トマトも30秒炒めて取り出す。^サラダ油大さじ2を強火でしっかり熱し、卵液を一気に流し入れる。縁がふくらんだら大きく3〜4回混ぜる。^半熟のうちにえび・トマト・きくらげ・長ねぎ・しょうがを戻す。酒をふって10秒、さっと混ぜて火を止め、ごま油を回す（卵がふわふわのうちに）。|味の決め手は「えびの卵白下処理」と「卵液に片栗粉少々」。ふわふわの卵とぷりぷりのえび。^強火で一気に。卵が半熟のうちに仕上げる。
水餃子|豚ひき肉:250g,白菜:3枚,にら:1/2束,長ねぎ:1/3本,干ししいたけ:2個,強力粉:150g,薄力粉:50g|塩:小さじ1/4,ぬるま湯:110ml,塩:小さじ1/3,しょうゆ:大さじ1,オイスターソース:小さじ2,酒:大さじ1,しょうが:1かけ,ごま油:大さじ1,水:大さじ3,黒酢:大さじ2,しょうゆ:大さじ1,ラー油:小さじ1,にんにく:少々,砂糖:小さじ1/2|手作りの皮：強力粉・薄力粉・塩小さじ1/4を混ぜ、ぬるま湯を加えてまとめ、5分こねる。ラップをして30分休ませる（手作りの皮はもちもちで、水餃子の主役。市販の厚皮でも可）。^白菜はみじん切りにして塩少々でもみ、10分おいて水気をしっかり絞る。にら・長ねぎ・しいたけ（もどす）はみじん切り。^ひき肉に塩を加えて粘りが出るまで練り、しょうゆ・オイスターソース・酒・すりおろししょうがを加え、水を3回に分けて吸わせる（肉汁たっぷりに）。野菜とごま油を混ぜる。^生地を棒状にして24等分し、めん棒で中央が厚く縁が薄い直径8cmの円にのばす。あんを包み、縁をしっかり閉じる。^たっぷりの湯を沸かし、餃子を入れて混ぜる。浮いてきてから2〜3分、皮がふっくら透き通るまでゆでる（差し水をしながら）。^たれ：黒酢・しょうゆ・ラー油・すりおろしにんにく・砂糖を混ぜる（黒酢で本場中国の味）。ゆで汁ごと器に盛り、たれで。|味の決め手は「手作りのもちもちの皮」と「黒酢のたれ」。^あんに水を吸わせると、かんだ瞬間に肉汁があふれる。
中華粥|米:100g,鶏手羽元:4本,ザーサイ:20g,小ねぎ:適量,ピータン:1個,パクチー:適量|ごま油:小さじ1,水:1200ml,酒:大さじ1,しょうが:1かけ,長ねぎ:1/2本,鶏がらスープの素:小さじ1,塩:小さじ1/2,白こしょう:少々,揚げワンタンの皮:4枚|米は洗って30分水につけ、水気を切ってごま油と塩少々（分量外）をまぶして15分おく（米が割れやすくなり、とろりとした香港風の粥に）。^手羽元は熱湯で1分下ゆでして洗う。^鍋に水・酒・手羽元・しょうがの薄切り・長ねぎの青い部分を入れて強火で煮立て、アクを取って弱火で20分煮る（手羽元から極上の鶏スープを取る）。^米を加えて強火で煮立て、弱火にしてふたを少しずらし、40分煮る。ときどき底から混ぜる。手羽元は取り出して身をほぐし、戻す。^鶏がらスープの素・塩・白こしょうで調える。^器に盛り、刻んだザーサイ・ピータン・小ねぎ・パクチー・しょうがのせん切り・揚げたワンタンの皮をのせ、ごま油をたらす。|味の決め手は「手羽元でスープを取る」ことと「米にごま油をまぶす」こと。香港の粥屋の味に。^トッピングで食感と味が変わり、最後まで飽きない。
鶏肉の黒酢炒め|鶏もも肉:1.5枚,玉ねぎ:1/2個,パプリカ:1/2個,ピーマン:1個,れんこん:80g|しょうゆ:小さじ1,酒:小さじ2,しょうが:少々,卵:1/2個,片栗粉:大さじ3,揚げ油:大さじ4,黒酢:大さじ4,砂糖:大さじ2.5,しょうゆ:大さじ1.5,はちみつ:小さじ1,水:大さじ3,片栗粉:小さじ1,ごま油:小さじ1|鶏肉は3cm角に切り、しょうゆ小さじ1・酒・しょうがのすりおろし・溶き卵をもみ込み、片栗粉をまぶす（卵の衣でふんわり、黒酢あんがよく絡む）。^玉ねぎ・パプリカ・ピーマンは乱切り、れんこんは1cm厚の半月切りにして水にさらし、水気を拭く。^黒酢あん：黒酢・砂糖・しょうゆ・はちみつ・水・片栗粉を混ぜる（はちみつで照りとまろやかさを）。^フライパンに揚げ油を中火で熱し、れんこんを3分揚げ焼きにして取り出す。鶏肉を入れて5〜6分、返しながらカリッと揚げ焼きにして取り出す。野菜も30秒素揚げする。^フライパンの油をペーパーで拭き取り、黒酢あんを入れて中火で混ぜながら煮立て、とろみと照りが出たら鶏肉・野菜を戻し、手早く絡める（黒酢は煮詰めるほど酸味が丸くなり、コクが出る）。^ごま油を回しかける。|味の決め手は「卵の衣で揚げ焼き」と「黒酢＋はちみつのあん」。^れんこんの食感が、黒酢あんとよく合う。
空芯菜炒め|空芯菜:2束|サラダ油:大さじ1.5,にんにく:2片,赤唐辛子:1本,ナンプラー:小さじ1,オイスターソース:小さじ2,砂糖:小さじ1/2,酒:大さじ1,鶏がらスープの素:小さじ1/4,水:大さじ1|空芯菜は5cm長さに切り、茎と葉に分ける（茎の太いものは縦半分に）。にんにくはつぶして粗みじん切り、唐辛子は種を取って半分に。^合わせ調味料：ナンプラー・オイスターソース・砂糖・酒・鶏がらスープの素・水を混ぜる（タイ料理のパックブンファイデーンの味。ナンプラー＋オイスターの組み合わせ）。^フライパンにサラダ油・にんにく・唐辛子を入れて弱火で1分、香りを出す。^強火にして茎を入れて30秒、葉を加えて20秒、手早くあおる。^合わせ調味料を回し入れ、15秒絡めてすぐ皿へ（シャキシャキ感が命。炒めすぎない）。|味の決め手は「ナンプラー＋オイスターソース」と「強火で手早く」。^にんにくはたっぷり。タイの屋台の香り。
中華風卵スープ|卵:2個,トマト:1個,長ねぎ:1/4本,きくらげ:2g,豆腐:1/4丁|水:600ml,鶏がらスープの素:小さじ2,オイスターソース:小さじ1,しょうゆ:小さじ1,塩:少々,白こしょう:少々,片栗粉:小さじ2,ごま油:小さじ1,酢:小さじ1|トマトはくし形、長ねぎは斜め薄切り、きくらげはもどして細切り、豆腐は1cm角。^鍋に水・鶏がらスープの素を入れて中火で煮立て、トマトを入れて3分煮る（トマトのうまみと酸味がスープに出て、深い味に）。^きくらげ・豆腐を加え、オイスターソース・しょうゆ・塩・白こしょうで調える。^水溶き片栗粉でうすくとろみをつける。^沸騰させた状態で溶き卵を細く回し入れ、10秒待ってからひと混ぜする（ふわふわのかき玉に）。^長ねぎを加え、ごま油と酢を少したらす（酢少々で味が引き締まる）。|味の決め手は「トマトを煮てうまみを出す」ことと「酢少々」。^オイスターソースで、スープに奥行きが出る。
火鍋|牛ロース肉:250g,豚バラ肉:200g,白菜:1/4個,春菊:1/2束,木綿豆腐:1/2丁,しいたけ:4個,えのき:1袋,春雨:30g|牛脂:1個,ごま油:大さじ2,豆板醤:大さじ2,甜麺醤:大さじ1,豆鼓:大さじ1,にんにく:3片,しょうが:1かけ,赤唐辛子:5本,花椒:大さじ1,八角:1個,シナモン:少々,水:1000ml,鶏がらスープの素:大さじ1.5,しょうゆ:大さじ2,酒:大さじ3,砂糖:小さじ2,練りごま:大さじ3,しょうゆ:大さじ1,黒酢:小さじ2,パクチー:適量|麻辣スープ：鍋に牛脂とごま油を弱火で溶かし、にんにく・しょうが（薄切り）・唐辛子・花椒・八角・シナモンを入れて3分、香りを油に移す（本場の火鍋はスパイスの香り油が命）。豆板醤・甜麺醤・刻んだ豆鼓を加えて2分、油が真っ赤になるまでじっくり炒める。^水・鶏がらスープの素・しょうゆ・酒・砂糖を加えて煮立て、弱火で10分煮出す。^具：白菜はざく切り、春菊は葉を摘む、豆腐は8等分、しいたけは飾り包丁、えのきはほぐす、春雨はもどす。^つけだれ：練りごま・しょうゆ・黒酢・パクチーのみじん切りを混ぜる（辛さを和らげる、まろやかなごまだれ）。^鍋に白菜の芯・しいたけ・豆腐を入れて5分煮る。^肉は1枚ずつしゃぶしゃぶの要領でくぐらせ、色が変わったらすぐ食べる。白菜の葉・春菊・えのき・春雨は最後に。ごまだれにつけて。|味の決め手は「スパイスを油で炒めた麻辣スープ」。花椒のしびれと唐辛子の辛さが本場の火鍋。^ごまだれにつけると、辛さがまろやかに。

BBQスペアリブ|スペアリブ:800g|塩:小さじ1,黒こしょう:少々,パプリカパウダー:小さじ1,ガーリックパウダー:小さじ1/2,ケチャップ:大さじ4,中濃ソース:大さじ2,ウスターソース:大さじ1,しょうゆ:大さじ2,はちみつ:大さじ3,酢:大さじ1,にんにく:2片,玉ねぎ:1/4個,スモークパウダー:少々,バター:10g|スペアリブは骨の裏の薄膜をはがす（味がしみてやわらかくなる）。塩・黒こしょう・パプリカパウダー・ガーリックパウダーをすり込み（ドライラブ。アメリカのBBQの下味）、1時間おく。^BBQソース：小鍋にケチャップ・中濃ソース・ウスターソース・しょうゆ・はちみつ・酢・すりおろしにんにく・すりおろし玉ねぎ・バターを入れて中火で煮立て、弱火で5分、とろりとするまで煮詰める（煮詰めると味が深まり、照りが出る）。^オーブンを150℃に予熱する。天板にアルミホイルを敷き、スペアリブを並べてホイルでぴったりふたをし、150℃で1時間半蒸し焼きにする（低温でじっくり。骨からほろりと外れるやわらかさに）。^ホイルを外し、BBQソースをたっぷり塗る。230℃に上げて10分焼き、もう一度ソースを塗って5〜10分、照りと焦げ目がつくまで焼く。^残りのソースを添える。|味の決め手は「ドライラブ」「低温でじっくり蒸し焼き」「煮詰めたBBQソース」。骨からほろっと外れる。^ソースは2回塗りで、照りと香ばしさを重ねる。
マカロニチーズ|マカロニ:200g,チェダーチーズ:100g,ピザ用チーズ:80g,ベーコン:60g|塩(ゆで用):大さじ1,バター:30g,薄力粉:大さじ3,牛乳:500ml,粒マスタード:小さじ1,ナツメグ:少々,塩:小さじ1/4,黒こしょう:少々,パン粉:大さじ3,粉チーズ:大さじ2,パプリカパウダー:少々|マカロニは塩を入れた湯で表示時間より2分短くゆでる（オーブンで焼くので固めに）。ベーコンは1cm幅に切ってカリッと炒める。^チーズソース：鍋にバターを弱火で溶かし、薄力粉を加えて2分炒める。^冷たい牛乳を少しずつ加えながら泡立て器で混ぜ、中火で4分、とろみがつくまで混ぜ続ける。^火を止めてチェダーチーズ（アメリカの味の決め手。濃厚な香り）とピザ用チーズの2/3を加えて溶かし、粒マスタード・ナツメグ・塩・黒こしょうで調える（マスタードで味が締まる）。^マカロニとベーコンを加えて絡め、耐熱皿に入れる。残りのチーズ・パン粉・粉チーズ・パプリカパウダーをのせる。^200℃のオーブン（またはトースター）で12〜15分、表面がこんがりカリッとするまで焼く。|味の決め手は「チェダーチーズ」と「粒マスタード」。アメリカの家庭の本場の味。^パン粉をのせて焼くと、表面カリッ、中とろ〜り。
ピロシキ|強力粉:200g,合いびき肉:200g,玉ねぎ:1個,春雨:20g,卵:2個,ディル:少々|ドライイースト:4g,砂糖:大さじ1,塩:小さじ1/2,牛乳:120ml,卵:1/2個,バター:20g,サラダ油:大さじ1,塩:小さじ1/2,黒こしょう:少々,ナツメグ:少々,コンソメ:小さじ1/2,しょうゆ:小さじ1,揚げ油:適量|生地：強力粉・ドライイースト・砂糖・塩を混ぜ、人肌に温めた牛乳・溶き卵1/2個・溶かしバターを加えて8分こねる（バターと卵でリッチでふんわりした生地に）。ラップをして温かいところで50分、2倍にふくらむまで発酵させる。^具：春雨は熱湯でもどして短く切る。卵2個は10分ゆでて刻む。玉ねぎはみじん切り。^フライパンにサラダ油を中火で熱し、玉ねぎを6分、きつね色になるまで炒める。ひき肉を加えて3分炒め、塩・黒こしょう・ナツメグ・コンソメ・しょうゆで味をつける（しっかり味をつけるのがポイント。パンに包むと薄く感じる）。春雨・ゆで卵・刻んだディル（あれば。ロシアの香り）を混ぜて冷ます。^生地を8等分して丸め、直径12cmにのばして具を包み、縁をしっかりつまんで閉じる。閉じ目を下にして20分休ませる（二次発酵）。^揚げ油を160℃に熱し、片面3分ずつ、計6分、きつね色になるまでじっくり揚げる（低温でパン生地の中まで火を通す）。|味の決め手は「バターと卵のリッチな生地」と「しっかり味つけした具」。^ディルを入れると、ロシアの本場の香りに。
シュニッツェル|豚ロース肉:4枚,レモン:1/2個,じゃがいも:2個,ケッパー:小さじ1|塩:小さじ1/3,黒こしょう:少々,薄力粉:大さじ3,卵:1個,牛乳:大さじ1,パン粉:60g,粉チーズ:大さじ2,パセリ:少々,サラダ油:大さじ4,バター:30g,酢:大さじ1,砂糖:小さじ1,粒マスタード:小さじ1,オリーブオイル:大さじ1|豚肉（薄めのとんかつ用）はラップで挟み、めん棒で叩いて厚さ4mmに薄く大きくのばす（薄く大きくのばすのがウィーン風。サクッと軽い）。塩・黒こしょうをふる。^パン粉は袋に入れて細かく砕き、粉チーズとみじん切りのパセリを混ぜる（チーズとハーブで衣にうまみと香り）。^薄力粉→牛乳入り卵液→パン粉の順につける。押さえつけない（衣がふわっと浮くのが本場流）。^フライパンにサラダ油とバター20gを入れ、中火で熱してバターが泡立ったら豚肉を入れる。フライパンを揺すって油を上にかけながら2分揚げ焼きにし（衣が波打つようにふくらむ）、返して1分半、きつね色になったら引き上げる。^つけ合わせのじゃがいもサラダ：じゃがいもをゆでて薄切りにし、酢・砂糖・粒マスタード・オリーブオイル・塩で和える（ウィーン風のポテトサラダ）。^焦がしバター：残りのバター10gを小鍋で茶色く焦がし、ケッパーを加える。シュニッツェルにかけ、レモンを添える。|味の決め手は「薄くのばす」「衣にチーズとハーブ」「油を上からかけて揚げ焼き」。^焦がしバター＋ケッパー＋レモンで、ウィーンのビストロの味に。
