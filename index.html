和風きのこパスタ|スパゲッティ:200g,しめじ:1パック,まいたけ:1パック,エリンギ:1本,ベーコン:60g,大葉:6枚,のり:適量|オリーブオイル:大さじ1.5,にんにく:1片,バター:20g,しょうゆ:大さじ1.5,酒:大さじ1,和風だしの素:小さじ1/2,黒こしょう:少々,塩(ゆで用):大さじ1|きのこは石づきを取ってほぐす（エリンギは縦に裂く）。ベーコンは1cm幅、にんにくはみじん切り、大葉はせん切り。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間より1分短くゆでる。^フライパンにオリーブオイルとベーコンを入れて中火で2分、カリッとするまで炒める。^きのこを加えて広げ、3分ほとんど触らずに焼き付ける。焼き色がついたら返して2分（きのこは焼き付けるほど香りとうまみが凝縮する。混ぜすぎると水が出てベチャッとする）。にんにくを加えて30秒。^酒・和風だしの素・ゆで汁大さじ4を加えて揺すり、バター10gを溶かす。ゆで上がったパスタを加えて30秒絡め、しょうゆを鍋肌から回し入れて香りを立てる（焦がししょうゆの香ばしさ）。^火を止めて残りのバター10gと黒こしょうを加えて混ぜる。器に盛り、大葉と刻みのりをのせる。|味の決め手は「きのこを焼き付ける」「しょうゆは鍋肌で焦がす」「仕上げのバター」。^和風だしの素を少し入れると、和風パスタにぐっと奥行きが出る。
たらこパスタ|スパゲッティ:200g,たらこ:1.5腹,大葉:6枚,のり:適量|バター:30g,牛乳:大さじ2,オリーブオイル:小さじ2,しょうゆ:小さじ1,レモン汁:小さじ1/2,塩(ゆで用):大さじ1|たらこは薄皮に切り目を入れ、スプーンで中身をこそげ出す（飾り用に少し残す）。バターは室温に戻してやわらかくする。^大きめのボウルにたらこ・バター・牛乳・オリーブオイル・しょうゆ・レモン汁を入れ、よく混ぜてソースにする（レモン汁少々で、たらこの生臭さが消えて味が締まる）。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間通りゆでる。^ゆで上がったパスタの湯を軽く切り（水分が少し残るくらい）、すぐにソースのボウルに入れて、手早く絡める（パスタの熱でバターが溶け、たらこに軽く火が入ってほどよい粒感に。加熱しないのがポイント）。ゆで汁を大さじ1〜2加えてなめらかに。^器に盛り、残りのたらこ・刻みのり・せん切りの大葉をのせる。|味の決め手は「加熱せず、ボウルで和える」こと。たらこのぷちぷち感と色が生きる。^バターはたっぷり。たらこの塩気とバターのコクのバランスが命。
ジェノベーゼ|スパゲッティ:200g,じゃがいも:1個,いんげん:8本,バジル:40g,松の実:20g|オリーブオイル:80ml,にんにく:1片,粉チーズ:40g,塩:小さじ1/3,塩(ゆで用):大さじ1|バジルソース：松の実（なければくるみ）をフライパンで弱火で3分、薄く色づくまでからいりする（香ばしさが段違い）。^フードプロセッサーににんにく・松の実・塩小さじ1/3を入れて細かくし、バジル（葉のみ・水気を完全に拭く）とオリーブオイルを加えて短く数回に分けて攪拌する（回しすぎると摩擦熱で黒くなる）。粉チーズを混ぜる。^じゃがいもは皮をむいて1cm角、いんげんは3cm長さに切る。^湯2Lに塩大さじ1を入れ、じゃがいもとスパゲッティを一緒にゆでる。ゆで上がり3分前にいんげんを加える（イタリア・リグーリアの伝統的な作り方。じゃがいものでんぷんがソースに絡む）。^ボウルにバジルソースとゆで汁大さじ3を入れて混ぜておく。^パスタ・じゃがいも・いんげんの湯を切ってボウルに入れ、手早く和える（バジルソースは加熱すると香りが飛び、色も悪くなるので、火にかけない）。|味の決め手は「松の実をからいり」と「加熱せずに和える」こと。^じゃがいもといんげんを一緒にゆでるのが本場リグーリア流。じゃがいもが崩れてソースがまろやかに。
ペスカトーレ|スパゲッティ:200g,有頭えび:4尾,あさり:200g,いか:1/2杯,ほたて:4個,ミニトマト:8個|オリーブオイル:大さじ3,にんにく:2片,赤唐辛子:1本,白ワイン:80ml,トマト缶:1/2缶,塩(ゆで用):大さじ1,アンチョビ:1枚,イタリアンパセリ:適量|あさりは砂抜きする。えびは背わたを取る（頭付きのまま）。いかは輪切り。にんにくはみじん切り、ミニトマトは半分に切る。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間より2分短くゆでる。^フライパンにオリーブオイル大さじ2を中火で熱し、えびを両面1分ずつ焼いて、えびの頭をヘラで押してみそ（うまみ）を油に絞り出す（これがペスカトーレの深いコクの秘密）。^にんにく・唐辛子・アンチョビを加えて弱火で1分、あさり・いか・ほたてを加えて白ワインを注ぎ、ふたをして2分。あさりが開いたら魚介をいったん取り出す（煮すぎると硬くなる）。^残った汁にトマト缶とミニトマトを加え、中火で4分、つぶしながら煮詰める。ゆで汁大さじ3を加える。^パスタを加えて1分、ソースを吸わせながら煮絡め、魚介を戻す。残りのオリーブオイルとパセリを加えて混ぜる。|味の決め手は「えびの頭のみそを油に絞り出す」こと。魚介のうまみがソース全体に広がる。^魚介は火を通しすぎず、いったん取り出して最後に戻す。
アラビアータ|スパゲッティ:200g,ベーコン:60g|オリーブオイル:大さじ3,にんにく:2片,赤唐辛子:3本,トマト缶:1缶,砂糖:小さじ1/2,塩(ゆで用):大さじ1,粉チーズ:大さじ2,イタリアンパセリ:適量|にんにくはみじん切り、唐辛子は種を取って刻む（種ごと入れると辛さアップ）。ベーコンは1cm幅。^フライパンにオリーブオイル・にんにく・唐辛子を入れて弱火で4分、にんにくがきつね色になるまでじっくり加熱し、辛みと香りを油に移す（アラビアータ＝怒りん坊。辛さは油で引き出す）。^ベーコンを加えて2分、カリッとするまで炒める。^トマト缶をつぶしながら加え、砂糖（酸味をまろやかに）を加えて中火で10分、とろりとするまで煮詰める（煮詰めることでトマトのうまみが凝縮する）。^湯2Lに塩大さじ1を入れ、スパゲッティ（あればペンネ）を表示時間より1分短くゆでる。^ソースにゆで汁大さじ3とパスタを加え、中火で1分絡める。器に盛り、粉チーズとパセリをかける。|味の決め手は「にんにくと唐辛子を弱火でじっくり」と「トマトを10分煮詰める」こと。^砂糖ひとつまみでトマトの酸味が丸くなり、うまみが前に出る。
フォー|ライスヌードル:150g,鶏むね肉:200g,もやし:1/2袋,パクチー:適量,紫玉ねぎ:1/4個,レモン:1/2個|水:900ml,鶏がらスープの素:大さじ1,しょうが:2かけ,玉ねぎ:1/2個,八角:1個,シナモン:少々,ナンプラー:大さじ2,砂糖:小さじ1,塩:少々,赤唐辛子:1本|スープの香り出し：しょうが（皮付き・半分に切る）と玉ねぎ（皮付き半分）をフライパン（油なし）で中火で5分、断面が黒く焦げるまで焼く（本場ベトナムの技。焦げた香ばしさがスープに深みを与える）。^鍋に水・焼いたしょうが・玉ねぎ・八角・シナモン・鶏むね肉を入れて中火にかけ、沸騰したらアクを取り、弱火で12分煮る。火を止めてふたをし、10分おいて鶏に余熱で火を通す（しっとりやわらか）。^鶏肉を取り出して薄く裂き、スープをこす。鶏がらスープの素・ナンプラー・砂糖・塩で調える。^ライスヌードルはぬるま湯に20分つけてもどし、食べる直前に熱湯で30秒〜1分ゆでる。^紫玉ねぎは薄切りにして水にさらす。もやしはさっと湯通しする。^丼に麺を入れ、鶏肉・もやし・紫玉ねぎをのせて熱いスープを注ぐ。パクチー・レモン・唐辛子を添え、レモンを絞って食べる。|味の決め手は「焦がしたしょうがと玉ねぎ」と「八角」。この香りでベトナムの屋台の味に。^ナンプラーは最後に。香りが飛ばないように。
パッタイ|ライスヌードル:150g,むきえび:10尾,厚揚げ:1/2枚,もやし:1袋,にら:1/2束,卵:2個,ピーナッツ:20g,レモン:1/2個|サラダ油:大さじ2,にんにく:1片,ナンプラー:大さじ1.5,砂糖:大さじ1.5,酢:大さじ1,ケチャップ:大さじ1,オイスターソース:小さじ2,しょうゆ:小さじ1,一味唐辛子:少々,干しえび:大さじ1|ライスヌードル（3〜5mm幅）はぬるま湯に30分つけて、芯が少し残る程度にもどす（炒めながら仕上げるので、もどしすぎない）。^たれ：ナンプラー・砂糖・酢・ケチャップ・オイスターソース・しょうゆ・水大さじ3を混ぜる（タマリンドの甘酸っぱさを酢とケチャップで再現）。^厚揚げは1cm角、にらは4cm長さ、ピーナッツは砕く。にんにく・干しえびはみじん切り。^フライパンにサラダ油を中火で熱し、にんにく・干しえびを30秒、えび・厚揚げを加えて2分炒める。片側に寄せ、空いたところに卵を割り入れて軽く混ぜ、半熟で全体と合わせる。^麺とたれを加え、強めの中火で2〜3分、麺がたれを吸ってもちっとするまで炒める（固ければ水大さじ2を足す）。^もやし・にらを加えて30秒炒め、火を止める。器に盛り、ピーナッツ・一味・レモンを添える。食べる直前にレモンを絞る。|味の決め手は「甘・酸・塩」のバランスのたれと、干しえびのうまみ。^ピーナッツの香ばしさとレモンの酸味で、本場の屋台の味に。
そうめん|そうめん:250g,大葉:5枚,小ねぎ:適量,みょうが:2個,しょうが:1かけ|しょうゆ:60ml,みりん:60ml,かつお節:10g,昆布:1枚,水:300ml,いりごま:小さじ1|つゆ：小鍋に水と昆布を入れて30分おき、弱火で沸騰直前まで温めて昆布を取り出す。かつお節を入れて2分煮出し、こす。^別の小鍋でみりんを1分煮立ててアルコールを飛ばし、しょうゆとだしを加えてひと煮立ちさせる（自家製つゆ。市販品よりだしの香りが格段に立つ）。冷蔵庫でキンキンに冷やす。^薬味：大葉・みょうがはせん切り、小ねぎは小口切り、しょうがはすりおろす。^そうめんは、たっぷりの湯（2L以上）でほぐしながら表示時間通り（1分半〜2分）ゆでる。吹きこぼれそうになったら差し水。^ざるに上げ、流水で手早くもみ洗いしてぬめりを取り、氷水で締める（ぬめりを取るのが、喉ごしと、つゆが薄まらないコツ）。^氷を浮かべた器に盛り、つゆに薬味を入れて食べる。|味の決め手は「自家製つゆ」と「しっかりもみ洗い」。^薬味は多めに。みょうが・大葉・しょうがの香りでぐっと上品に。
にゅうめん|そうめん:150g,ささみ:2本,しいたけ:2個,かまぼこ:4切れ,小ねぎ:適量,三つ葉:適量|だし:800ml,薄口しょうゆ:大さじ2,みりん:大さじ1,酒:大さじ1,塩:小さじ1/4,ゆずの皮:少々|ささみは筋を取り、そぎ切りにして酒少々（分量外）をふる。しいたけは薄切り。^鍋にだし・酒を入れて中火で煮立て、ささみ・しいたけを入れて3分煮る。アクを取り、薄口しょうゆ・みりん・塩で調える（関西風の澄んだつゆ）。^別鍋でそうめんを表示時間より30秒短くゆで、流水でもみ洗いしてぬめりを取る（そのまま入れると汁が濁り、塩辛くなる）。^そうめんをつゆに入れ、中火で30秒温める。^器に盛り、かまぼこ・小ねぎ・三つ葉・ゆずの皮をのせる。|味の決め手は「そうめんを洗ってから汁に入れる」こと。澄んだつゆのまま上品に仕上がる。^ゆずの皮のひとかけらで料亭の香りに。
焼きビーフン|ビーフン:150g,豚こま切れ肉:120g,キャベツ:2枚,にんじん:1/4本,ピーマン:1個,しいたけ:2個,干しえび:大さじ1|ごま油:大さじ1.5,にんにく:1片,水:150ml,鶏がらスープの素:小さじ2,しょうゆ:小さじ2,オイスターソース:大さじ1,酒:大さじ1,砂糖:小さじ1/2,塩:少々,白こしょう:少々|ビーフンはぬるま湯に10分つけて固めにもどし、水気を切ってはさみで食べやすく切る。干しえびは水大さじ2でもどし（もどし汁も使う）、刻む。^豚肉・キャベツ・にんじん・ピーマン・しいたけは細切り。にんにくはみじん切り。^合わせスープ：水・鶏がらスープの素・しょうゆ・オイスターソース・酒・砂糖・干しえびのもどし汁を混ぜる（干しえびのうまみが台湾風焼きビーフンの決め手）。^フライパンにごま油・にんにく・干しえびを入れて弱火で1分、豚肉を加えて中火で2分、にんじん・しいたけ・キャベツ・ピーマンの順に加えて2分炒める。^ビーフンと合わせスープを加え、菜箸で持ち上げてほぐしながら中火で4〜5分、汁気がなくなるまで炒め煮にする（ビーフンにスープを吸わせて味を入れる）。^塩・白こしょうで調える。|味の決め手は「干しえび」とオイスターソースのうまみ。^ビーフンにスープを吸わせるように炒め煮にすると、パサつかずしっとり。
肉じゃが|牛こま切れ肉:200g,じゃがいも:4個,玉ねぎ:1個,にんじん:1/2本,しらたき:1/2袋,絹さや:6枚|牛脂:1個,だし:350ml,酒:大さじ3,砂糖:大さじ2.5,みりん:大さじ2,しょうゆ:大さじ3.5|じゃがいも（男爵ならほくほく、メークインなら煮崩れにくい）は大きめのひと口大に切って面取りし、水に5分さらす。玉ねぎはくし形、にんじんは乱切り。しらたきは2分下ゆでして食べやすく切る。絹さやは筋を取って塩ゆで。^鍋に牛脂を中火で溶かし、牛肉を広げて焼き付けるように炒め、色が変わったら取り出す（肉は最後に戻すので硬くならない。牛脂で牛のうまみたっぷりに）。^同じ鍋でじゃがいも・にんじん・玉ねぎを2分炒め、油を回す。^だし・酒を加えて強火で煮立て、アクを取る。砂糖・みりんを加え、落としぶたをして中火で8分煮る（甘みを先に入れて、しっかり含ませる）。^しょうゆ大さじ2と牛肉・しらたきを加え、再び落としぶたをして8分、じゃがいもに竹串がすっと通るまで煮る。^残りのしょうゆ大さじ1.5を加え、落としぶたを取って中火で2分、鍋をゆすって煮汁を全体に絡める。火を止めて15分以上おく（冷めるときに味がしみ込む）。絹さやを添える。|味の決め手は「牛肉をいったん取り出す」ことと「しょうゆは2回に分ける」こと。^砂糖→しょうゆの順に入れる（さしすせそ）。しょうゆの一部を最後に入れると香りが立つ。
豚の生姜焼き|豚ロース肉:300g,玉ねぎ:1/2個,キャベツ:3枚,トマト:1/2個|薄力粉:小さじ2,サラダ油:大さじ1,しょうが:2かけ,しょうゆ:大さじ2.5,みりん:大さじ2,酒:大さじ2,砂糖:小さじ2,はちみつ:小さじ1,にんにく:少々,マヨネーズ:適量|しょうがは皮ごとすりおろす（皮の近くに香りが多い）。しょうゆ・みりん・酒・砂糖・はちみつ・にんにくと半量のしょうがを混ぜて、たれを作る。^豚肉（しょうが焼き用の厚め）は筋を数か所切り、両面に薄力粉を薄くまぶす（粉がたれを抱え、肉がやわらかく仕上がる）。玉ねぎは7mm幅の薄切り。キャベツはせん切りにして冷水にさらす。^フライパンにサラダ油を強めの中火で熱し、豚肉を広げて入れ、触らずに1分、焼き色をつける。返して30秒焼いて取り出す（焼きすぎない。この時点で中が少しピンクでもOK）。^同じフライパンで玉ねぎを中火で2分、しんなりして縁が色づくまで炒める（玉ねぎの甘みがたれに溶ける）。^豚肉を戻し、たれを加えて中火で1分、たれがとろりと煮詰まって照りが出るまで絡める。最後に残りのおろししょうがを加えてさっと混ぜる（しょうがを2回に分けると、香りが鮮烈に立つ）。^器にキャベツ・トマトと盛り、たれをかけ、マヨネーズを添える。|味の決め手は「しょうがを2回に分ける」こと。最後の生しょうがで、ぐっと香りが立つ。^肉は一度取り出してたれと絡めるだけにすると、硬くならずジューシー。
鶏の照り焼き|鶏もも肉:2枚,レタス:3枚,ししとう:6本|塩:小さじ1/4,サラダ油:小さじ1,しょうゆ:大さじ2.5,みりん:大さじ2.5,酒:大さじ2,砂糖:大さじ1,はちみつ:小さじ1,粉山椒:少々|鶏肉は余分な脂を取り、厚い部分に包丁を入れて厚さを均一にする。皮目をフォークで全体に刺す（皮が縮まず、パリッと焼ける）。塩をふって10分おき、出た水分を拭く。^たれ：しょうゆ・みりん・酒・砂糖・はちみつを混ぜる。^フライパンにサラダ油を入れ、鶏肉を皮目を下にして並べてから中火にかける（冷たいフライパンから焼くと、皮の脂がじっくり出てパリパリに）。^アルミホイルをかぶせた鍋（重し）で押さえながら8分、皮がきつね色にパリッとなるまで焼く。出てきた脂はペーパーでこまめに拭く。空いたところでししとうも焼く。^返して弱めの中火で4分、中まで火を通す。余分な脂を完全に拭き取る（脂が残るとたれが絡まない）。^たれを加えて中火で1〜2分、スプーンで鶏にかけながら煮詰め、大きな泡がふつふつと立ってとろりと照りが出たら完成。切り分けてたれをかけ、好みで山椒をふる。|味の決め手は「冷たいフライパンから皮目をじっくり焼く」ことと「脂を拭き取ってからたれ」。^はちみつ小さじ1で、お店のようなツヤツヤの照りが出る。
筑前煮|鶏もも肉:1枚,れんこん:150g,ごぼう:1/2本,にんじん:1/2本,こんにゃく:1/2枚,干ししいたけ:4個,里芋:3個,絹さや:6枚|ごま油:大さじ1,酒:大さじ3,だし:200ml,砂糖:大さじ1.5,みりん:大さじ2,しょうゆ:大さじ3|干ししいたけは水200mlで30分以上もどし（もどし汁も使う）、半分に切る。鶏肉はひと口大。れんこん・ごぼう・にんじんは乱切りにし、れんこん・ごぼうは水にさらす。こんにゃくは手でちぎって2分下ゆで。里芋は皮をむいて塩もみし、洗う。^鍋にごま油を中火で熱し、鶏肉を皮目から入れて2分、焼き色をつける（皮の脂と焼き目がコクになる）。^ごぼう・れんこん・にんじん・こんにゃく・しいたけ・里芋を加えて3分、全体に油が回るまで炒める（炒め煮にするのが「筑前煮」。煮物とは違うコクが出る）。^酒を加えて30秒、だし・しいたけのもどし汁を加えて煮立て、アクを取る。砂糖・みりんを加え、落としぶたをして弱めの中火で10分煮る。^しょうゆを加えて、さらに10分煮る。^落としぶたを取り、中火で3〜5分、鍋をゆすりながら煮汁を絡めて照りを出す。器に盛り、塩ゆでした絹さやを添える。|味の決め手は「干ししいたけのもどし汁」と「具をごま油で炒めてから煮る」こと。^最後に煮汁を煮詰めて照りを出すと、お正月にも出せる仕上がりに。
ぶり大根|ぶりのアラ:300g,大根:1/3本,しょうが:2かけ|米のとぎ汁:適量,水:300ml,酒:100ml,砂糖:大さじ2,みりん:大さじ2,しょうゆ:大さじ3,昆布:1枚|大根は2.5cm厚の半月切りにして皮を厚めにむき、面取りする。米のとぎ汁で20分、竹串が通るまで下ゆでして水で洗う（えぐみが抜け、味がしみやすくなる）。^ぶりのアラ（切り身でも可。アラのほうが骨からだしが出て段違いにおいしい）はひと口大に切り、塩少々（分量外）をふって15分おく。^ボウルにぶりを入れ、熱湯を回しかける。表面が白くなったらすぐ冷水にとり、血合いやうろこを指でていねいに洗い流す（霜降り。臭みを完全に取るプロの下処理）。^鍋に昆布を敷き、大根・ぶり・しょうがの薄切り・水・酒を入れて強火で煮立て、アクを取る。^砂糖・みりんを加え、落としぶたをして弱めの中火で15分煮る。しょうゆ大さじ2を加えてさらに15分。^落としぶたを取り、残りのしょうゆ大さじ1を加え、中火で5分、煮汁を回しかけながら照りが出るまで煮詰める。火を止めてしばらくおき、味を含ませる。針しょうがを添える。|味の決め手は「アラを使う」「霜降り」「大根の下ゆで」。^一晩おくと大根が飴色になり、味が中までしみる。
さばの味噌煮|さば:2切れ,長ねぎ:1本,しょうが:2かけ|水:150ml,酒:100ml,砂糖:大さじ1.5,みりん:大さじ1,味噌:大さじ2,赤味噌:大さじ1,しょうゆ:小さじ1|さばは皮目に十字の切り込みを入れる（皮が縮んで破れず、味がしみる）。^ボウルに入れて熱湯を回しかけ、表面が白くなったら冷水にとり、血合いやぬめりを洗う（霜降り）。水気を拭く。^長ねぎは4cm長さ、しょうがは薄切り（飾り用に少し針しょうがにする）。^フライパン（または浅い鍋）に水・酒・砂糖・みりん・しょうがを入れて中火で煮立て、さばを皮目を上にして並べる。長ねぎも入れる。^アルミホイルで落としぶたをして中火で5分煮る。^味噌2種を煮汁で溶き（溶き残しがないように）、さばにかけるように加える。しょうゆを加え、再び落としぶたをして弱めの中火で8分、ときどきスプーンで煮汁をかけながら煮る（味噌は煮すぎると香りが飛ぶので、後から入れる）。^落としぶたを取り、中火で2〜3分、煮汁をさばに回しかけながら、とろりと照りが出るまで煮詰める。器に盛り、煮汁をかけて針しょうがをのせる。|味の決め手は「霜降り」と「味噌は後から入れる」こと、そして「2種の味噌」。赤味噌を少し加えるとコクが深くなる。^しょうがはたっぷりが臭み消しのコツ。
鮭の塩焼き|生鮭:2切れ,大根:150g,すだち:1個|塩:小さじ2/3,酒:小さじ2,しょうゆ:少々|鮭は酒をふって5分おき、水気を拭く（臭みが取れる）。^両面に塩をふり（30cm上から全体に均一に）、20〜30分おく。出てきた水分をペーパーでしっかり拭く（余分な水分と臭みが抜け、身が締まって焼いたときにふっくら）。^皮目にも塩を少し多めにふる（化粧塩。皮がパリッとして焦げにくい）。^魚焼きグリルを中火で3分予熱し、網に酢か油を薄く塗る（身がくっつかない）。^盛り付けたとき表になる面を上にして並べ（片面焼きは表から）、中火で6〜7分、皮がパリッときつね色になるまで焼く。両面グリルなら中火で8〜9分。^大根おろし（軽く水気を切る）とすだちを添え、大根おろしにしょうゆをたらす。|味の決め手は「振り塩をして20分おき、水気を拭く」こと。これでスーパーの鮭がお店の味に。^グリルの予熱でパリッと、身はふっくら。
鮭のちゃんちゃん焼き|生鮭:3切れ,キャベツ:1/4個,玉ねぎ:1/2個,にんじん:1/3本,しめじ:1パック,ピーマン:1個,コーン缶:50g|塩:少々,こしょう:少々,味噌:大さじ3,みりん:大さじ2,砂糖:大さじ1,酒:大さじ2,しょうゆ:小さじ1,にんにく:1/2片,バター:20g,サラダ油:小さじ2|鮭は塩をふって10分おき、水気を拭いてこしょうをふる。^味噌だれ：味噌・みりん・砂糖・酒・しょうゆ・すりおろしにんにくを混ぜる（にんにくを少し入れると北海道の漁師風のパンチのある味に）。^キャベツはざく切り、玉ねぎは薄切り、にんじんは短冊、しめじはほぐす、ピーマンは細切り。^フライパン（またはホットプレート）にサラダ油を中火で熱し、鮭を皮目から3分焼いて焼き色をつけ、返す。^鮭の周りと上に野菜をのせ、味噌だれを回しかけ、ふたをして弱めの中火で8分蒸し焼きにする。^ふたを取り、バターを鮭の上にのせ、コーンを散らして2分。鮭の身を大きくほぐしながら、野菜と味噌だれを混ぜて食べる。|味の決め手は「先に鮭に焼き色をつける」ことと「最後のバター」。^野菜から出る水分で味噌だれがちょうどよくのびる。
さんまの塩焼き|さんま:2尾,大根:150g,すだち:1個|塩:小さじ1,しょうゆ:少々|さんまはさっと洗って水気を拭く。長いものは半分に切る（わたは苦みがうまいので取らない）。^両面に塩をふり（30cm上から均一に）、15分おく。出てきた水分を拭き取る（臭みが抜け、身が締まる）。^魚焼きグリルを中火で3分予熱する。^盛り付けて表になる面（頭が左）を上にして並べ、中火で7〜8分、皮がパリッとして脂がジュージューいうまで焼く（両面グリルなら8〜10分）。^大根おろし（軽く水気を切る）とすだちを添える。大根おろしにしょうゆをたらし、すだちを絞って食べる。|味の決め手は「塩をして15分おく」ことと、グリルの予熱。^すだちの酸味と大根おろしが、さんまの脂をさっぱりまとめてくれる。
鶏の唐揚げ|鶏もも肉:2枚,レタス:2枚,レモン:1/2個|しょうゆ:大さじ2,酒:大さじ1,オイスターソース:小さじ1,鶏がらスープの素:小さじ1/2,砂糖:小さじ1/2,にんにく:1片,しょうが:1かけ,ごま油:小さじ1,卵:1/2個,マヨネーズ:小さじ2,片栗粉:大さじ4,薄力粉:大さじ2,揚げ油:適量|鶏肉は余分な脂を取り、40gくらいの大きめのひと口大に切る（大きめのほうがジューシー）。^ポリ袋に鶏肉・しょうゆ・酒・オイスターソース・鶏がらスープの素・砂糖・すりおろしにんにくとしょうが・ごま油を入れてよくもみ込み、冷蔵庫で30分〜一晩漬ける（オイスターと鶏がらでうまみを重ね、お店の唐揚げに）。^溶き卵とマヨネーズを加えてもみ込む（卵で衣がふんわり、マヨの油と乳化剤で肉が驚くほどジューシーになる）。^片栗粉と薄力粉を混ぜたものを加えて全体にまぶし、5分おいて粉をなじませる（薄力粉でふんわり、片栗粉でカリッと）。^揚げ油を170℃に熱し、3分半揚げて取り出し、網の上で4分休ませる（余熱で中まで火が通る）。^油を190℃に上げ、1分二度揚げして表面をカリッとさせる。油を切り、レモンを添える。|味の決め手は「下味にオイスター・鶏がら」と「卵＋マヨで漬ける」こと、そして「二度揚げ」。^休ませる時間を取るのが、中はジューシー、外はカリカリの秘訣。
とんかつ|豚ロース肉:2枚,キャベツ:1/4個,卵:1個,レモン:1/4個|塩:小さじ1/3,黒こしょう:少々,薄力粉:大さじ3,牛乳:大さじ1,生パン粉:60g,揚げ油:適量,とんかつソース:大さじ3,からし:少々,すりごま:大さじ1|豚肉（厚さ1.5〜2cm）は焼く30分前に冷蔵庫から出して室温に戻す。脂身と赤身の境の筋を1.5cm間隔で切り、肉たたき（または瓶の底）で全体を叩いて元の形に整える（叩くことで繊維がほぐれ、やわらかくなる）。^揚げる直前に塩・黒こしょうをふる（早くふると水分が出る）。^薄力粉を全体にまぶし、余分をはたく。卵に牛乳を混ぜた卵液にくぐらせ、生パン粉（なければ乾燥パン粉に霧吹きをしたもの）を両手でふんわり押さえてつける。5分おく（生パン粉はサクサク感が段違い）。^揚げ油を160℃（低温）に熱し、豚肉を静かに入れて4分、触らずに揚げる。返して3分（低温でじっくり火を通すと、肉がしっとりやわらか）。^いったん取り出して3分休ませ、油を180℃に上げて1分、きつね色になるまで揚げる（二度揚げで衣をカリッと）。^網に立てて2分休ませ、1.5cm幅に切る。キャベツの極細せん切り（冷水に5分さらしてシャキッと）を添え、すりごまを入れたソース・からし・レモンで。|味の決め手は「低温でじっくり→高温で二度揚げ」と「生パン粉」。専門店のサクサク、しっとりに。^ソースにすりごまを入れると、とんかつ専門店の味に。
チキン南蛮|鶏もも肉:2枚,卵:3個,玉ねぎ:1/4個,レタス:3枚,ミニトマト:4個|塩:小さじ1/3,こしょう:少々,薄力粉:大さじ3,揚げ油:適量,酢:大さじ3,砂糖:大さじ2.5,しょうゆ:大さじ2,みりん:大さじ1,赤唐辛子:1本,マヨネーズ:大さじ5,レモン汁:小さじ1,砂糖:小さじ1/2,パセリ:少々|タルタル：卵2個を11分ゆでて殻をむき、粗く刻む。玉ねぎはみじん切りにして水に5分さらし、しっかり絞る。マヨネーズ・レモン汁・砂糖小さじ1/2・塩こしょう少々と混ぜ、刻んだパセリを加える（甘めのタルタルが宮崎流）。^南蛮酢：小鍋に酢・砂糖・しょうゆ・みりん・唐辛子を入れてひと煮立ちさせ、バットに移す。^鶏肉は厚さを均一に開き、半分に切る。塩・こしょうをふり、薄力粉をまぶして、残りの溶き卵1個にくぐらせる（卵の衣がふわっと、南蛮酢をたっぷり吸う。これが本場の衣）。^揚げ油を170℃に熱し、鶏肉を入れて3分、返して3分、きつね色になるまで揚げる。^揚げたてをすぐに南蛮酢に浸し、両面を返して30秒ずつ、しっかり酢を吸わせる（熱いうちに浸すとジュワッと染み込む）。^食べやすく切って、レタス・トマトと盛り、タルタルソースをたっぷりかける。|味の決め手は「卵の衣」と「揚げたてを南蛮酢に浸す」こと。宮崎の元祖の作り方。^甘酢とたっぷりのタルタル。甘めのタルタルが南蛮酢の酸味と好相性。
豚の角煮|豚バラ肉:600g,卵:4個,長ねぎ:1本,チンゲン菜:1株|しょうが:1かけ,米のとぎ汁:適量,水:600ml,酒:150ml,砂糖:大さじ3,黒砂糖:大さじ1,みりん:大さじ3,しょうゆ:大さじ5,八角:1個|豚バラ肉（塊）は5cm角に切る。フライパン（油なし）を中火で熱し、脂身を下にして全面を焼き付け、5分ほどで脂を出してきつね色にする（焼くことで余分な脂が落ち、香ばしさが加わる）。^鍋に豚肉と米のとぎ汁（なければ水）をかぶるくらい入れ、長ねぎの青い部分・しょうがの皮を入れて強火にかける。沸騰したら弱火で1時間、ふたをずらしてゆでる（とぎ汁のでんぷんが肉をやわらかくし、臭みと脂を抜く）。^ゆで汁を捨て、豚肉を流水でやさしく洗う。卵は8分ゆでて殻をむく。^鍋に豚肉・水・酒・砂糖・黒砂糖・しょうがの薄切り・八角を入れて強火で煮立て、落としぶたをして弱火で20分煮る（甘みを先に含ませると、肉がやわらかいまま）。^みりん・しょうゆ・ゆで卵を加え、落としぶたをして弱火で30分煮る。^落としぶたを取り、中火で5分、煮汁を回しかけながらとろりと照りが出るまで煮詰める。塩ゆでしたチンゲン菜と白髪ねぎを添え、からしを添えて。|味の決め手は「焼き付け→とぎ汁で下ゆで→甘み先、しょうゆ後」の三段階。箸で切れるほどとろとろに。^黒砂糖と八角で、中華料理店のような深い甘みと香りに。
肉豆腐|牛こま切れ肉:200g,木綿豆腐:1丁,長ねぎ:1本,しらたき:1/2袋,春菊:1/4束|牛脂:1個,だし:250ml,酒:大さじ3,砂糖:大さじ2,みりん:大さじ2,しょうゆ:大さじ3.5,七味唐辛子:少々|豆腐はペーパーで包んで15分水切りし、6等分に切る（味がしみやすくなる）。長ねぎは斜め1cm幅、しらたきは2分下ゆでして食べやすく切る。^鍋に牛脂を中火で溶かし、長ねぎを2分、焼き色がつくまで焼く（すき焼きのように、ねぎの焦げた甘さがコクになる）。^牛肉を加えて広げ、砂糖をふりかけて30秒焼き付ける（砂糖で肉を焼くと、すき焼き風のコクと照りが出る）。^だし・酒・みりん・しょうゆを加えて煮立て、アクを取る。豆腐・しらたきを加え、落としぶたをして弱めの中火で10分、豆腐に色がつくまで煮る。^火を止めて10分おき、味を含ませる。食べる前に温め直し、春菊を加えて30秒。七味をふる。|味の決め手は「牛脂でねぎを焼く」ことと「砂糖で肉を焼き付ける」こと。居酒屋の名物の味に。^豆腐は煮て冷ます間に味がしみ込む。
鶏つくね|鶏ひき肉:300g,長ねぎ:1/2本,大葉:6枚,卵黄:2個,れんこん:50g|卵白:1個分,片栗粉:大さじ1.5,しょうが:1かけ,味噌:小さじ1,塩:ひとつまみ,サラダ油:小さじ2,しょうゆ:大さじ2,みりん:大さじ2,砂糖:大さじ1,酒:大さじ1|長ねぎはみじん切り、しょうがはすりおろし、れんこんは粗みじん切りにする（れんこんのシャキシャキ食感がアクセント）。^ボウルにひき肉・塩・味噌を入れ、粘りが出るまで1分しっかり練る（味噌を入れると臭みが消え、ふわっと、うまみも増す）。卵白・片栗粉・長ねぎ・しょうが・れんこんを加えてさらに混ぜる。^手に水をつけて8等分し、小判形に整える。片面に大葉を貼る。^フライパンにサラダ油を中火で熱し、大葉の面を下にして並べ、3分焼く。返して水大さじ3（分量外）を加えてふたをし、弱火で5分蒸し焼きにする（中までふっくら火が通る）。^ふたを取って水分を飛ばし、しょうゆ・みりん・砂糖・酒を混ぜたたれを加え、中火で1〜2分、転がしながら照りよく絡める。^器に盛り、卵黄を添えて、つけながら食べる。|味の決め手は「味噌を練り込む」ことと「卵黄をつけて食べる」こと。焼き鳥屋のつくねの味に。^れんこんの食感で、食べごたえがぐっと増す。
手羽元のさっぱり煮|手羽元:10本,卵:3個,長ねぎ:1/2本|サラダ油:小さじ1,酢:100ml,しょうゆ:大さじ4,砂糖:大さじ2.5,はちみつ:大さじ1,水:150ml,酒:大さじ2,しょうが:1かけ,にんにく:1片|手羽元は骨に沿って1本切り込みを入れる（味がしみやすく、骨から身がほろっと外れる）。卵は8分ゆでて殻をむく。しょうがは薄切り、にんにくはつぶす。^フライパンにサラダ油を中火で熱し、手羽元を皮目から並べて転がしながら5分、全体に焼き色をつける（焼き色の香ばしさがたれの深みになる）。^鍋に手羽元・酢・しょうゆ・砂糖・はちみつ・水・酒・しょうが・にんにく・長ねぎ（ぶつ切り）を入れて強火で煮立て、アクを取る。^ゆで卵を加え、落としぶたをして弱めの中火で20分煮る（酢の効果で骨離れがよく、肉がほろほろにやわらかくなる）。^落としぶたを取り、中火で5分、煮汁を回しかけながら照りが出るまで煮詰める（酢は煮るとツンとした酸味が飛び、まろやかになる）。^火を止めてそのまま冷ますと、卵に色と味がしみる。|味の決め手は「焼き付けてから煮る」ことと「はちみつ」。照りとコクが段違い。^酢はたっぷり入れても、煮詰めるとまろやかな甘酸っぱさに変わる。
天ぷら|有頭えび:6尾,なす:1本,さつまいも:1/2本,しいたけ:4個,大葉:6枚,れんこん:80g,大根:100g|薄力粉:100g,卵:1個,冷水:160ml,揚げ油:適量,ごま油:大さじ3,塩:適量,だし:200ml,しょうゆ:大さじ3,みりん:大さじ3,しょうが:少々|天つゆ：小鍋にだし・しょうゆ・みりんを入れてひと煮立ちさせる。大根はすりおろして水気を切る。^えびは殻をむいて背わたを取り、腹に4〜5本切り込みを入れて背を押し、まっすぐにする。尾の先を切って水分をしごき出す。^なすは縦半分にして扇形に切り目を入れる。さつまいも・れんこんは7mm厚、しいたけは飾り包丁。具の水気をすべてよく拭く。^衣：冷水（氷水）に卵を溶き、ふるった薄力粉を一度に加え、菜箸で粉が少し残る程度にさっくり10回ほど混ぜる（混ぜすぎ厳禁。冷やすことでグルテンが出ず、軽い衣に。ボウルの底を氷水に当てながら使う）。^揚げ油にごま油を混ぜる（香りがよく、お店の天ぷらの味に）。野菜は165〜170℃（さつまいも3分、れんこん2分、なす1分半、しいたけ1分、大葉は片面に衣で20秒）、えびは180℃で1分半揚げる。^具に薄力粉（分量外）を薄くまぶしてから衣をつける。揚げている間に衣を菜箸で散らすと「花」が咲いてサクッと軽い。揚がったらすぐ網に立てて油を切り、天つゆ（大根おろし・しょうが）か塩で。|味の決め手は「冷水で作った衣を混ぜすぎない」ことと「揚げ油にごま油を混ぜる」こと。^一度に入れる量は鍋の表面積の半分まで。油温が下がるとベチャッとする。
かき揚げ|玉ねぎ:1/2個,にんじん:1/3本,むきえび:8尾,三つ葉:1/2束,ごぼう:1/4本|薄力粉:60g,卵:1/2個,冷水:80ml,揚げ油:適量,ごま油:大さじ2,塩:少々,だし:150ml,しょうゆ:大さじ2,みりん:大さじ2|玉ねぎは5mm幅の薄切り、にんじんは4cm長さの細切り、ごぼうは細めのささがきにして水にさらし水気を拭く。三つ葉は3cm長さ。えびは背わたを取り、大きければ半分に。^具をボウルに入れ、薄力粉大さじ1（分量外）を全体にまぶす（具に粉をまぶしておくと、少ない衣でもまとまり、ばらけない）。^冷水に卵を溶き、薄力粉を加えてさっくり混ぜ、具のボウルに加えて全体に絡める（衣は少なめ。衣が多いと重く、中が生っぽくなる）。^揚げ油にごま油を加え、170℃に熱する。具をお玉（または木べら）にのせて形を整え、油の縁からすべらせるように入れる。^1分触らずに揚げ、表面が固まったら菜箸で中央に3〜4か所穴をあける（中まで火が通り、サクッと揚がる）。返して1分半、泡が小さくなりカラッとしたら引き上げる。^網に立てて油を切る。天つゆ（だし・しょうゆ・みりんをひと煮立ち）か塩で。|味の決め手は「具に粉をまぶす」「衣は少なめ」「中央に穴をあける」の3つ。^ごま油の香りで、そば屋のかき揚げの味に。
揚げ出し豆腐|木綿豆腐:1丁,大根:150g,小ねぎ:適量,なめこ:1/2袋,しょうが:1かけ|片栗粉:大さじ3,揚げ油:適量,だし:200ml,しょうゆ:大さじ1.5,薄口しょうゆ:小さじ1,みりん:大さじ1.5,砂糖:小さじ1/2,片栗粉:小さじ1|豆腐はペーパーで包み、重しをして30分しっかり水切りする（水分が残ると油がはね、衣がはがれる）。6等分に切り、ペーパーで表面の水気をもう一度拭く。^つゆ：小鍋にだし・しょうゆ・薄口しょうゆ・みりん・砂糖を入れて中火で煮立て、なめこを加えて1分。水溶き片栗粉（片栗粉小さじ1＋水小さじ2）でごく薄くとろみをつける（とろみをつけると、豆腐に絡んで冷めにくい）。^大根はすりおろして軽く水気を切る。しょうがはすりおろし、小ねぎは小口切り。^豆腐に片栗粉を全面にたっぷりまぶし、5分おいてもう一度まぶす（二度づけで衣がもちっと厚くなり、つゆをよく吸う）。^揚げ油を180℃に熱し、豆腐を入れて2〜3分、ときどき転がしながら衣がカリッと薄く色づくまで揚げる。^器に盛り、熱いつゆをかけ、大根おろし・しょうが・小ねぎをのせる。|味の決め手は「30分の水切り」と「片栗粉の二度づけ」。外はカリッと、中はとろっと。^つゆに薄くとろみをつけると、衣がつゆを抱えて料亭の味に。
かれいの煮付け|かれい:2切れ,ごぼう:1/3本,豆腐:1/2丁,しょうが:2かけ|水:150ml,酒:150ml,みりん:大さじ3,砂糖:大さじ1.5,しょうゆ:大さじ3|かれいは表面のぬめりを包丁でこそげ、皮目に十字の切り込みを入れる。熱湯を回しかけて霜降りにし、冷水で洗って水気を拭く（臭みを取る大事な下処理）。^ごぼうは5cm長さに切って縦4つ割り、豆腐は4等分。しょうがは薄切り（飾り用に少し針しょうがに）。^浅い鍋（またはフライパン）に水・酒・みりん・砂糖・しょうがを入れて強火で煮立てる（煮汁が沸騰しているところに魚を入れるのが鉄則。表面がすぐ固まり、うまみが逃げない）。^かれいを皮目を上にして並べ、ごぼう・豆腐を周りに入れる。しょうゆを加え、落としぶたをして中火で10分、ときどき煮汁をかけながら煮る（裏返さない）。^落としぶたを取り、強めの中火で3分、スプーンで煮汁をかけ続けながら、とろりとするまで煮詰める（照りが出て、煮汁が煮こごりのように）。^器に盛り、煮汁をたっぷりかけ、針しょうがをのせる。|味の決め手は「沸騰した煮汁に魚を入れる」ことと「最後に煮汁をかけながら煮詰める」こと。^酒をたっぷり使うのが、ふっくら臭みのない煮魚の秘訣。
ぶりの照り焼き|ぶり:2切れ,ししとう:6本,大根:100g|塩:小さじ1/4,酒:大さじ1,薄力粉:大さじ1,サラダ油:小さじ2,しょうゆ:大さじ2,みりん:大さじ2,酒:大さじ2,砂糖:小さじ2,はちみつ:小さじ1|ぶりは塩をふって15分おき、出てきた水分（臭みの元）をペーパーでしっかり拭く。酒大さじ1をふってさらに5分おき、もう一度拭く（臭みが完全に取れる）。^たれ：しょうゆ・みりん・酒大さじ2・砂糖・はちみつを混ぜる。^ぶりに薄力粉を薄くまぶし、余分をはたく（粉がたれを抱え、とろりと絡む）。^フライパンにサラダ油を中火で熱し、ぶりを盛り付けで表になる面から入れて3分、こんがり焼く。空いたところでししとうも焼いて取り出す。^返して2分焼き、余分な脂をペーパーで丁寧に拭き取る（ぶりの脂は臭みの元。拭き取ると照りもきれいに出る）。^たれを加えて中火で1〜2分、スプーンでぶりにかけながら煮詰め、大きな泡が立ってとろみと照りが出たら完成。大根おろしとししとうを添える。|味の決め手は「塩→拭く→酒→拭く」の下処理と「脂を拭いてからたれ」。^はちみつ少々で、料亭のような美しい照りに。
鮭の南蛮漬け|生鮭:3切れ,玉ねぎ:1/2個,にんじん:1/3本,ピーマン:1個,パプリカ:1/4個|塩:少々,片栗粉:大さじ2,揚げ油:適量,だし:150ml,酢:大さじ5,砂糖:大さじ2.5,しょうゆ:大さじ2,みりん:大さじ1,赤唐辛子:1本,しょうが:1かけ|南蛮酢：小鍋にだし・砂糖・しょうゆ・みりん・唐辛子（輪切り）を入れて煮立て、火を止めてから酢を加える（酢は煮立てると香りが飛ぶ。火を止めてから入れるのが、まろやかでキレのある南蛮酢のコツ）。バットに移す。^玉ねぎは薄切り、にんじん・ピーマン・パプリカ・しょうがはせん切りにし、熱い南蛮酢に入れて漬けておく（野菜がしんなりして味がなじむ）。^鮭は骨を取ってひと口大のそぎ切りにし、塩をふって10分おき、水気を拭く。片栗粉をまぶす。^揚げ油を170℃に熱し、鮭を2〜3分、カラッと揚げる。^揚げたての熱々をすぐに南蛮酢に漬け、野菜をかぶせる（熱いうちに漬けるとジュワッと酢を吸う）。^20分以上おいて味をなじませる。冷蔵庫で冷やしてもおいしい。翌日がさらにおいしい。|味の決め手は「酢は火を止めてから」と「揚げたてを漬ける」こと。^だしを入れると、ツンとこない、まろやかな南蛮酢になる。
あじフライ|あじ:4尾,キャベツ:3枚,卵:1個,レモン:1/4個|塩:小さじ1/3,こしょう:少々,薄力粉:大さじ3,牛乳:大さじ1,生パン粉:50g,揚げ油:適量,タルタルソース:適量,中濃ソース:適量|あじは開いたもの（背開き）を用意する（魚売り場で「フライ用に開いて」と頼むと開いてもらえる）。小骨を骨抜きで抜く。^塩をふって10分おき、出てきた水分を拭き取り、こしょうをふる（臭みが抜け、身がふっくら揚がる）。^薄力粉→牛乳を混ぜた卵液→生パン粉の順につける。身側はパン粉をしっかり押さえる。5分おく。^揚げ油を180℃に熱し、皮目を下にして入れ、1分半揚げて返し、1分。きつね色になり、泡が小さくなったら引き上げる（あじは身が薄いので、高温で短時間。揚げすぎるとパサつく）。^網に立てて油を切る。キャベツのせん切りとレモンを添え、タルタルソースかソースで。|味の決め手は「塩をして水分を拭く」下処理と「高温短時間」。身がふっくら、衣はサクサク。^タルタルとソースを両方かける「ハーフ&ハーフ」もおすすめ。
いわしの蒲焼き|いわし:4尾,大葉:4枚,ご飯:適量|塩:少々,片栗粉:大さじ2,サラダ油:大さじ1,しょうゆ:大さじ2,みりん:大さじ2,砂糖:大さじ1,酒:大さじ1,はちみつ:小さじ1,粉山椒:少々|いわしは頭を落として腹わたを取り、手開きにする（親指を中骨に沿わせて開き、中骨を外す）。塩をふって10分おき、水気を拭く。^たれ：しょうゆ・みりん・砂糖・酒・はちみつを混ぜる（うなぎのたれのような濃厚な甘辛さ）。^いわしに片栗粉を薄くまぶし、余分をはたく（片栗粉がたれを抱え、とろりと絡む）。^フライパンにサラダ油を中火で熱し、身側から入れて2分、こんがり焼き色がつくまで焼く。返して皮目を1分半焼く。^余分な油をペーパーで拭き取り、たれを加えて中火で1分、いわしにかけながら煮詰め、照りを出す。^ご飯にのせる場合は大葉を敷いて。粉山椒をふる。|味の決め手は「片栗粉」と「はちみつ入りの濃厚たれ」。うなぎの蒲焼きのような照りに。^山椒をふると、ぐっと香りが引き締まる。
牛肉のしぐれ煮|牛こま切れ肉:300g,しょうが:3かけ|牛脂:1個,酒:大さじ4,砂糖:大さじ2.5,みりん:大さじ2,しょうゆ:大さじ3.5,はちみつ:小さじ1,山椒の実:小さじ1|しょうがはせん切りにする（たっぷりが「しぐれ煮」の特徴）。牛肉は食べやすく切る。^鍋に湯を沸かし、牛肉をさっとくぐらせて色が変わったらざるに上げる（湯通し。余分な脂とアクが取れ、上品な味に）。^鍋に牛脂を中火で溶かし、しょうがを1分炒める。^酒・砂糖・みりんを加えて煮立て、牛肉を加えてほぐしながら煮る。しょうゆ・はちみつ・山椒の実（あれば）を加える。^中火で8〜10分、ときどき混ぜながら、煮汁がほとんどなくなるまで煮詰める（照りが出て、肉にしっかり味が入る）。^ご飯のお供・お弁当に。冷蔵で5日保存可能。|味の決め手は「湯通し」と「しょうがたっぷり」。^煮汁がほぼなくなるまで煮詰めると、日持ちして、ご飯がすすむ味に。
冷しゃぶ|豚ロース肉:250g,レタス:3枚,トマト:1個,きゅうり:1本,みょうが:2個,大葉:5枚|酒:大さじ2,塩:小さじ1/2,練りごま:大さじ2,ポン酢しょうゆ:大さじ3,砂糖:小さじ1,ごま油:小さじ1,すりごま:大さじ1,ラー油:少々|ごまポン酢だれ：練りごまに砂糖を混ぜ、ポン酢を少しずつ加えてのばし、ごま油・すりごま・ラー油を混ぜる（ごまのコクとポン酢の酸味で、冷しゃぶ専門店の味に）。^鍋に1.5Lの湯を沸かし、酒・塩を入れて沸騰させたら火を止め、水200mlを加えて80℃程度に下げる（沸騰したお湯でゆでると肉が硬くなる。80℃がしっとりやわらかく仕上がる温度）。^豚肉を1枚ずつ広げて入れ、色が変わるまで30秒〜1分ゆでる。^氷水ではなく、ざるに広げて常温で冷ます（氷水にとると脂が白く固まり、肉が硬くなる）。^レタスはちぎり、トマトは薄切り、きゅうり・みょうが・大葉はせん切り。^器に野菜を敷いて豚肉を盛り、たれをかける。|味の決め手は「80℃のお湯でゆでる」ことと「氷水で冷やさない」こと。驚くほどしっとりやわらか。^ゆで湯に酒と塩を入れると、臭みが抜けて下味がつく。
豚キムチ|豚バラ肉:200g,白菜キムチ:250g,にら:1/2束,玉ねぎ:1/4個,卵黄:1個|ごま油:大さじ1,にんにく:1片,しょうゆ:小さじ2,コチュジャン:小さじ1,砂糖:小さじ1,酒:大さじ1,いりごま:小さじ1|キムチ（よく発酵した酸っぱいものがおすすめ）はざく切りにし、汁は取っておく。豚肉は4cm長さ、にらは4cm長さ、玉ねぎは薄切り、にんにくは薄切り。^豚肉に酒・しょうゆ小さじ1をもみ込む（下味で肉のうまみを引き出す）。^フライパンにごま油とにんにくを入れて弱火で1分、豚肉を加えて中火で3分、脂が出てカリッとするまでしっかり炒める。^玉ねぎを加えて1分、キムチを加えて3分、キムチの水分を飛ばすように炒める（キムチを炒めると酸味が丸くなり、うまみと甘みが出る）。^キムチの汁・コチュジャン・砂糖・残りのしょうゆを加えて30秒、にらを加えてさっと炒め合わせる。^器に盛り、いりごまをふって中央に卵黄をのせる（黄身を絡めると辛さがまろやかに）。|味の決め手は「キムチを3分しっかり炒める」ことと、砂糖ひとつまみ。酸味が丸く、うまみが立つ。^卵黄をのせると、お店のような仕上がりに。
肉野菜炒め|豚こま切れ肉:200g,キャベツ:1/4個,もやし:1袋,にんじん:1/3本,ピーマン:2個,玉ねぎ:1/4個,きくらげ:3g|酒:大さじ1,しょうゆ:小さじ1,片栗粉:小さじ2,ラード:大さじ1.5,にんにく:1片,しょうが:1かけ,鶏がらスープの素:小さじ1.5,オイスターソース:大さじ1,しょうゆ:小さじ2,酒:大さじ1,砂糖:小さじ1/2,白こしょう:少々,ごま油:小さじ1|豚肉に酒・しょうゆ小さじ1・片栗粉をもみ込む（片栗粉の膜で肉がやわらかく、味がよく絡む）。^キャベツはざく切り（芯は薄切り）、にんじんは短冊、ピーマン・玉ねぎは細切り、もやしはひげ根を取る、きくらげは水でもどす。合わせ調味料（鶏がら・オイスター・しょうゆ・酒・砂糖・白こしょう）を混ぜる。^野菜を油通しする：フライパンに湯1Lを沸かしてサラダ油小さじ1（分量外）を入れ、にんじん・キャベツの芯を30秒、残りの野菜を10秒ゆでてざるに上げ、水気をしっかり切る（町中華の技。強火の家庭用コンロでも、シャキッと色鮮やかで水っぽくならない）。^フライパンの水気を拭き、ラードを強火で熱して、にんにく・しょうがのみじん切りを10秒、豚肉を広げて1分半、焼き付けるように炒める。^野菜を加えて強火で1分、手早くあおる。合わせ調味料を鍋肌から回し入れて30秒、ごま油をひと回しして器に盛る。|味の決め手は「野菜をさっと湯通し」してから炒めること。シャキシャキで水っぽくならない、プロの技。^ラードで炒めると、町中華の香りとコクに。
ゴーヤチャンプルー|ゴーヤ:1本,木綿豆腐:1丁,豚バラ肉:150g,卵:2個,かつお節:2パック|塩:小さじ1/2,砂糖:小さじ1,ごま油:大さじ1,サラダ油:小さじ1,酒:大さじ1,しょうゆ:小さじ2,和風だしの素:小さじ1/2,塩:少々,こしょう:少々|豆腐はペーパーで包み、重しをして30分水切りし、手で大きめにちぎる（ちぎると断面がでこぼこで、味がよく絡む）。^ゴーヤは縦半分に切ってスプーンで種とわたをしっかり取り、3mm厚に切る。塩小さじ1/2・砂糖小さじ1をもみ込んで10分おき、水気を絞る（砂糖を一緒にもむと、苦みがほどよくやわらぐ）。^豚肉は4cm長さ。卵は溶いて塩少々を加える。^フライパンにサラダ油を中火で熱し、豆腐を並べて3分、両面に焼き色をつけて取り出す（豆腐を先に焼き付けると、崩れず香ばしい）。^ごま油を足して豚肉を2分、カリッとするまで炒め、ゴーヤを加えて強火で2分炒める。^豆腐を戻し、酒・しょうゆ・和風だしの素・こしょうで調える。溶き卵を回し入れ、半熟になったらざっくり混ぜる。火を止めてかつお節1パックを混ぜ、器に盛って残りのかつお節をのせる。|味の決め手は「豆腐を先に焼き付ける」ことと「かつお節を混ぜ込む」こと。^ゴーヤは塩と砂糖でもんで、苦みをほどよく残すのが沖縄流。
アスパラの肉巻き|豚バラ肉:200g,アスパラガス:8本|塩:少々,黒こしょう:少々,薄力粉:大さじ1,サラダ油:小さじ1,しょうゆ:大さじ1.5,みりん:大さじ1.5,酒:大さじ1,砂糖:小さじ1,バター:10g,にんにく:少々|アスパラは根元の硬い部分を1cm切り落とし、下1/3の皮をピーラーでむく。ラップで包んで電子レンジ600Wで1分加熱する（先に軽く火を通すと、肉が焼けるころにちょうどよい食感）。^豚肉を広げて塩・黒こしょうをふり、アスパラ1本に斜めにずらしながら巻きつける（巻き終わりをしっかり押さえる）。薄力粉を全体に薄くまぶす。^たれ：しょうゆ・みりん・酒・砂糖・すりおろしにんにくを混ぜる。^フライパンにサラダ油を中火で熱し、巻き終わりを下にして並べ、転がしながら5分、全体にこんがり焼き色をつける。^余分な脂をペーパーで拭き取り、たれとバターを加えて、転がしながら1分、照りよく絡める（バター醤油の香りで子どもにも大人気に）。^食べやすく切って盛る。|味の決め手は「アスパラを先にレンジで加熱」と「バター」。^巻き終わりを下にして焼き始めると、はがれない。
ピーマンの肉詰め|ピーマン:5個,合いびき肉:250g,玉ねぎ:1/2個,卵:1個|パン粉:大さじ4,牛乳:大さじ2,塩:小さじ1/3,黒こしょう:少々,ナツメグ:少々,薄力粉:大さじ1,サラダ油:小さじ2,酒:大さじ2,赤ワイン:大さじ2,ケチャップ:大さじ3,中濃ソース:大さじ2,しょうゆ:小さじ1,砂糖:小さじ1,バター:10g,ピザ用チーズ:30g|玉ねぎはみじん切りにして中火で4分炒めて冷ます。パン粉は牛乳でふやかす。^ピーマンは縦半分に切って種を取り、内側に茶こしで薄力粉をふる（接着剤になり、焼いてもはがれない）。^ボウルにひき肉・塩を入れて粘りが出るまで練り、卵・パン粉・玉ねぎ・黒こしょう・ナツメグを加えて混ぜる。ピーマンにこんもりと詰め、表面を平らにならす（焼くと縮むので、ぎゅっと多めに）。^フライパンにサラダ油を中火で熱し、肉の面を下にして並べて3分、焼き色をつける。返して酒を加え、ふたをして弱火で7分蒸し焼きにする。^ふたを取り、肉の面にチーズをのせ、再びふたをして1分で溶かす。取り出す。^同じフライパンに赤ワインを入れて30秒煮立て、ケチャップ・中濃ソース・しょうゆ・砂糖・バターを加えて1分煮詰めてソースにし、かける。|味の決め手は「肉の面から焼いて焼き色」と「フライパンに残った肉汁で作るソース」。^ナツメグで洋食屋の香りに。
鶏むね肉のねぎ塩焼き|鶏むね肉:1枚,長ねぎ:1本,レモン:1/4個|塩:小さじ1/4,砂糖:小さじ1/2,酒:大さじ1,片栗粉:大さじ1,ごま油:大さじ2,鶏がらスープの素:小さじ1,塩:小さじ1/4,黒こしょう:少々,にんにく:少々,レモン汁:小さじ2,いりごま:小さじ1|鶏むね肉は皮を取り、1cm厚のそぎ切りにする。塩小さじ1/4・砂糖・酒をもみ込んで15分おく（砂糖と塩の下味で、むね肉がしっとりやわらかくなる。ブライン液の効果）。^ねぎ塩だれ：長ねぎをみじん切りにし、ごま油大さじ1・鶏がらスープの素・塩・黒こしょう・すりおろしにんにく・レモン汁・いりごまを混ぜる（10分おいてねぎをなじませる）。^鶏肉に片栗粉を薄くまぶす（片栗粉の膜で肉汁を閉じ込める）。^フライパンに残りのごま油を中火で熱し、鶏肉を並べて2分、焼き色をつける。返して弱火にし、ふたをして2分蒸し焼きにする（むね肉は火を通しすぎるとパサつくので短時間で）。^火を止めてねぎ塩だれを加え、余熱で全体に絡める（ねぎは加熱しすぎず、シャキッと香りを残す）。^器に盛り、レモンを添える。|味の決め手は「塩＋砂糖の下味」と「片栗粉」。パサつきがちなむね肉が驚くほどしっとり。^たれは火を止めてから絡めると、ねぎの香りが生きる。
鶏ハム|鶏むね肉:2枚,レタス:3枚,トマト:1個|砂糖:小さじ2,塩:小さじ2,黒こしょう:少々,ローリエ:1枚,オリーブオイル:大さじ1,粒マスタード:小さじ2,はちみつ:小さじ1,レモン汁:小さじ2|鶏むね肉は皮を取り、厚い部分を開いて厚さを均一にする。フォークで全体を刺す。^砂糖→塩の順に両面にすり込み（砂糖を先にすり込むと保水力が上がり、しっとり仕上がる）、黒こしょうをふる。ラップで包み、冷蔵庫で一晩（12時間〜2日）おく。^水で表面をさっと洗い、ペーパーで水気を拭く。ラップでキャンディ状にきつく巻き、両端をねじって縛る。さらにもう一重ラップで巻き、保存袋に入れて空気を抜く。^鍋にたっぷりの湯（2L）を沸騰させてローリエを入れ、鶏肉を袋ごと入れて2分ゆでる。火を止めてふたをし、そのまま湯が完全に冷めるまで（2〜3時間）おく（余熱でじっくり火を通す。63℃前後で、しっとりやわらかなハムに）。^冷めたら冷蔵庫で冷やし、5mm厚に切る。^ソース：オリーブオイル・粒マスタード・はちみつ・レモン汁を混ぜる。レタス・トマトと盛り、ソースをかける。|味の決め手は「砂糖→塩の順にすり込む」ことと「余熱で火を通す」こと。^冷蔵で4〜5日保存可能。サラダ・サンドイッチ・冷やし中華にも。
豚の味噌漬け焼き|豚ロース肉:2枚,キャベツ:3枚|味噌:大さじ3,白味噌:大さじ1,みりん:大さじ1.5,酒:大さじ1,砂糖:大さじ1,しょうが:1/2かけ,サラダ油:小さじ1|豚肉（とんかつ用の厚切り）は筋を数か所切り、フォークで全体を刺す。^味噌床：味噌・白味噌・みりん・酒・砂糖・すりおろししょうがを混ぜる（2種の味噌で、甘くまろやかで奥行きのある西京焼き風の味に）。^ラップに味噌床の半量を広げてキッチンペーパーを敷き、豚肉をのせて上にもペーパー・残りの味噌床をのせて包む（ペーパー越しに漬けると、焦げにくく、拭き取りも簡単）。冷蔵庫で一晩〜2日漬ける。^豚肉を取り出し、味噌を完全に拭き取る（味噌が残ると一瞬で焦げる）。^フライパンにクッキングシートを敷き、サラダ油を塗って豚肉を並べ、弱めの中火で3分、焼き色がついたら返してふたをし、弱火で4分焼く（味噌漬けは焦げやすいので、弱めの火でじっくり）。^食べやすく切り、せん切りキャベツと盛る。|味の決め手は「2種の味噌で一晩漬ける」ことと「弱めの火でじっくり焼く」こと。^漬けた状態で冷凍保存もでき、作り置きに便利。
たらのホイル焼き|たら:2切れ,しめじ:1/2パック,えのき:1/2袋,玉ねぎ:1/4個,ミニトマト:4個|塩:少々,こしょう:少々,酒:大さじ2,バター:20g,しょうゆ:小さじ2,ポン酢しょうゆ:大さじ2,レモン:1/4個,小ねぎ:適量|たらは塩をふって10分おき、出た水分を拭いてこしょうをふる（臭みが抜け、身が締まる）。^玉ねぎは薄切り、しめじ・えのきはほぐす、ミニトマトは半分に切る。^アルミホイル（30cm）を2枚広げ、中央に玉ねぎを敷き（たらの下に敷くと焦げ付かず、甘みが出る）、たら・きのこ・トマトをのせる。^酒をふり、バターを10gずつのせ、しょうゆを回しかけて、ホイルの口をぴったり閉じる（蒸気を逃がさないのがふっくら仕上げるコツ）。^フライパンに並べ、水50ml（分量外）を注いでふたをし、中火で12〜15分蒸し焼きにする（トースターなら15分、魚焼きグリルなら中火で12分）。^ホイルを開き、ポン酢をかけてレモンを絞り、小ねぎを散らす。|味の決め手は「バターしょうゆ＋ポン酢」の二段構え。コクとさっぱり感が両立する。^玉ねぎを下に敷くと、甘みが出て底も焦げない。
焼き鳥|鶏もも肉:2枚,長ねぎ:1.5本,ししとう:6本|塩:小さじ1/2,黒こしょう:少々,しょうゆ:大さじ2,みりん:大さじ2,砂糖:大さじ1,酒:大さじ1,はちみつ:小さじ1,七味唐辛子:少々,粉山椒:少々|たれ：小鍋にしょうゆ・みりん・砂糖・酒・はちみつを入れて中火で煮立て、弱火で5分、とろりとするまで煮詰める（焼き鳥屋の「秘伝のたれ」は、煮詰めたとろみが命）。^鶏肉は3cm角に切り、長ねぎは3cm長さに切る。竹串（水に10分つけておくと焦げにくい）に鶏肉とねぎを交互に刺す（ねぎま）。^塩派：塩・黒こしょうを30cm上からまんべんなくふる。^魚焼きグリルを中火で3分予熱し、串を並べて中火で6分、返して4分、焼き色がつくまで焼く（グリルの直火で焼くと、炭火のような香ばしさ）。^たれ派：焼き上がりの2分前にたれを刷毛で塗り、1分焼く。もう一度塗って1分焼く（2〜3回の重ね塗りで照りと香ばしさが重なる）。^ししとうも串に刺して一緒に焼く。たれには七味か山椒、塩には黒こしょうかレモンで。|味の決め手は「たれを煮詰めてとろみをつける」ことと「重ね塗り」。^フライパンで焼く場合は、中火で両面4分ずつ、ふたをして2分蒸してからたれを絡める。
手羽先の甘辛揚げ|手羽先:10本|塩:少々,こしょう:少々,片栗粉:大さじ3,揚げ油:適量,しょうゆ:大さじ3,みりん:大さじ2,砂糖:大さじ2,酒:大さじ2,はちみつ:小さじ2,にんにく:1片,しょうが:少々,いりごま:大さじ1,黒こしょう:小さじ1,一味唐辛子:少々|手羽先は先端を切り落とし（揚げると焦げやすい）、骨に沿って1本切り込みを入れる。塩・こしょうをふり、水気を拭いて片栗粉を薄くまぶす。^たれ：小鍋にしょうゆ・みりん・砂糖・酒・はちみつ・すりおろしにんにく・しょうがを入れて中火で煮立て、弱火で3分、とろりとするまで煮詰める。^揚げ油を160℃（低温）に熱し、手羽先を入れて8分、じっくり揚げて中まで火を通す。いったん取り出して3分休ませる。^油を190℃に上げ、1〜2分二度揚げして皮をパリパリにする（低温でじっくり→高温で二度揚げ。これが名古屋の名店の食感）。^揚げたてを熱いたれにくぐらせ（またはボウルで和え）、全体に絡める。^いりごま・黒こしょう（多め）・一味をふる。|味の決め手は「二度揚げ」と「たっぷりの黒こしょう」。名古屋の手羽先の味に。^たれは揚げたての熱いうちに絡めると、皮のパリパリ感が残る。
砂肝のにんにく炒め|砂肝:250g,長ねぎ:1/3本|ごま油:大さじ1.5,にんにく:3片,塩:小さじ1/3,酒:大さじ1,鶏がらスープの素:小さじ1/2,黒こしょう:小さじ1/2,レモン汁:小さじ2,一味唐辛子:少々|砂肝は2つに切り離し、周りの銀皮（白く硬い部分）を包丁で薄くそぎ取る（ひと手間で、コリコリ感はそのままに格段に食べやすくなる）。食べやすく切り込みを入れる。^塩少々（分量外）をもみ込み、水で洗って臭みを取り、水気を拭く。^にんにくは薄切り、長ねぎはみじん切り。^フライパンにごま油とにんにくを入れて弱火で3分、にんにくがきつね色になったら取り出す（ガーリックチップ）。^強めの中火にして砂肝を入れ、3〜4分、焼き色がつくまで炒める（触りすぎずに焼き付けると香ばしい）。酒・鶏がらスープの素・塩を加えて30秒。^長ねぎ・ガーリックチップを戻し、黒こしょう・レモン汁を加えて混ぜる。一味をふる。|味の決め手は「銀皮をむく」下処理と「にんにくを先にチップにする」こと。居酒屋の名物の味に。^黒こしょうはたっぷりがおいしい。
ほたてのバター醤油焼き|ほたて:8個,アスパラガス:4本,エリンギ:1本|塩:少々,薄力粉:小さじ1,サラダ油:小さじ1,バター:20g,にんにく:少々,酒:大さじ1,しょうゆ:小さじ2,レモン汁:少々,黒こしょう:少々|ほたて（刺身用）はペーパーで水気をしっかり拭き取り（水気があると焼き色がつかない）、塩をふって薄力粉を薄くまぶす。アスパラは斜め切り、エリンギは縦に裂く。^フライパンにサラダ油を強めの中火でしっかり熱し、ほたてを並べて1分半、触らずに焼いて片面にこんがり焼き色をつける（強火で片面だけしっかり焼き、中は半生に。これがレストランの焼き方）。^返して30秒焼き、取り出す。^同じフライパンにバター10gとアスパラ・エリンギを入れて中火で2分炒め、すりおろしにんにく・酒を加える。^ほたてを戻し、しょうゆを鍋肌から回し入れ、残りのバター10gを加えて10秒絡めて火を止める（焦がしバターしょうゆの香り）。^器に盛り、レモン汁・黒こしょうをかける。|味の決め手は「水気を拭いて、強火で片面だけ焼き色」をつけること。中はレアでとろける。^バターは2回に分けて、最後のバターで香りを立てる。
茶碗蒸し|卵:3個,ささみ:1本,むきえび:4尾,しいたけ:2個,かまぼこ:4切れ,ぎんなん:4個,三つ葉:適量|だし:400ml,薄口しょうゆ:小さじ1.5,みりん:小さじ1,塩:小さじ1/3,酒:小さじ1|卵液：卵をボウルに割り、泡立てないように菜箸を底につけて左右に動かして溶く（泡立てるとすが立つ）。冷ましただし・薄口しょうゆ・みりん・塩を加えて混ぜ、ざるで2回こす（なめらかな口当たりの秘訣。卵1：だし3の割合）。^ささみはそぎ切り、えびは背わたを取り、それぞれ酒をふる。しいたけは薄切り、三つ葉は2cm長さ。^器に具（三つ葉以外）を入れ、卵液を静かに注ぐ。表面の泡をスプーンで取る（泡はすの原因）。^フライパンに器を並べ、器の1/3の高さまで熱湯を注ぐ。ふきんで包んだふたをして（水滴が落ちない）、強めの中火で2分、表面が白っぽくなったら、ごく弱火にして12〜15分蒸す（最初だけ強火で表面を固め、あとはごく弱火。90℃以下でじっくり蒸すのが、すの入らないコツ）。^竹串を刺して、透明な汁が出れば蒸し上がり。三つ葉をのせ、ふたをして30秒。|味の決め手は「だしの割合（卵1：だし3）」と「ごく弱火」。ぷるぷるで、すの入らない料亭の茶碗蒸しに。^だしは必ず冷ましてから。熱いと卵が固まってムラになる。
だし巻き卵|卵:4個,大根:100g|だし:100ml,薄口しょうゆ:小さじ1,みりん:小さじ2,砂糖:小さじ1/2,塩:ひとつまみ,片栗粉:小さじ1/2,サラダ油:大さじ1,しょうゆ:少々|卵液：卵を泡立てないように溶き、だし（冷ましたもの）・薄口しょうゆ・みりん・砂糖・塩・水溶き片栗粉（片栗粉小さじ1/2＋水小さじ1）を混ぜる（片栗粉を少し入れると、だしが多くても巻きやすく、冷めてもジュワッと）。ざるでこす。^卵焼き器を中火でしっかり熱し、ペーパーで油をなじませる。菜箸に卵液をつけて落とし、ジュッと音がする温度にする。^卵液の1/4量を流し入れ、全体に広げる。大きな泡を菜箸でつぶし、表面が半熟のうちに奥から手前へ巻く（半熟で巻くと、層がくっついてふんわり）。^巻いた卵を奥に戻し、空いたところに油を塗り、卵液の1/4量を流して、巻いた卵を持ち上げて下にも卵液を流し込む。半熟のうちに巻く。これを繰り返す。^熱いうちに巻きすで包んで形を整え、3分おく。^切り分けて、大根おろし（しょうゆをたらす）を添える。|味の決め手は「だしたっぷり」と「片栗粉少々」。ジュワッとだしがあふれる、京都の料亭風に。^火加減はずっと中火。弱いと固まらず、強いと焦げる。
卵焼き|卵:4個|砂糖:大さじ2,みりん:小さじ2,しょうゆ:小さじ1/2,塩:ひとつまみ,だし:大さじ2,マヨネーズ:小さじ1,サラダ油:小さじ2|卵を泡立てないように溶き、砂糖・みりん・しょうゆ・塩・だし・マヨネーズを加えてよく混ぜる（マヨネーズを少し入れると、ふわふわで冷めても固くならない。お弁当にぴったり）。^卵焼き器を中火で熱し、油をペーパーで薄くなじませる。^卵液の1/4量を流して全体に広げ、大きな泡をつぶす。半熟のうちに奥から手前に巻く（砂糖入りは焦げやすいので、手早く）。^奥に戻して油を塗り、残りを3回に分けて同様に巻く。^巻きすかペーパーで包んで形を整え、3分おいてから切る。|味の決め手は「マヨネーズ少々」と「だし」。甘くてふわふわ、冷めてもおいしい。^砂糖入りは焦げやすいので、火加減は中火、手早く巻くのがコツ。
麻婆豆腐|木綿豆腐:1丁,豚ひき肉:150g,長ねぎ:1/2本,にら:3本|サラダ油:大さじ1,にんにく:1片,しょうが:1かけ,豆板醤:大さじ1,甜麺醤:大さじ1,豆鼓:大さじ1/2,一味唐辛子:小さじ1/2,酒:大さじ1,しょうゆ:小さじ2,水:200ml,鶏がらスープの素:小さじ1,砂糖:小さじ1/2,片栗粉:大さじ1,ラー油:大さじ1,花椒:小さじ1|豆腐は2cm角に切り、塩少々（分量外）を入れた湯で弱火で2分ゆで、ざるに上げる（崩れにくく、中まで温まり、余分な水分が抜ける。本場の下処理）。^長ねぎ・にんにく・しょうが・豆鼓（あれば。なければ味噌小さじ1）はみじん切り。にらは1cm長さ。^フライパンにサラダ油を中火で熱し、ひき肉を4分、脂が透き通ってカリッとするまでしっかり炒める（肉をカリカリに炒めるのが、臭みのない香ばしい麻婆の秘訣）。^弱火にして豆板醤・甜麺醤・豆鼓・にんにく・しょうが・一味を加え、2分炒める（油が赤く色づくまで。辛みと香りを油に溶かす）。^酒・しょうゆ・水・鶏がらスープの素・砂糖を加えて煮立て、豆腐を入れて弱めの中火で3分煮る（豆腐に味を含ませる）。長ねぎ・にらを加える。^水溶き片栗粉（片栗粉＋水大さじ2）を3回に分けて回し入れ、フライパンを揺すりながら30秒ずつ加熱する。最後に強火で20秒煮立て、ラー油を回しかける。器に盛り、花椒（なければ粉山椒）をたっぷりふる。|味の決め手は「ひき肉をカリカリに炒める」「豆板醤を油でじっくり」「仕上げの花椒」。^片栗粉は3回に分けて、揺すりながら。豆腐を崩さず、しっかりしたとろみに。

ヤンニョムチキン|鶏もも肉:2枚|塩:小さじ1/4,こしょう:少々,にんにく:1片,しょうが:少々,牛乳:大さじ3,片栗粉:大さじ3,薄力粉:大さじ2,揚げ油:適量,コチュジャン:大さじ2,ケチャップ:大さじ3,はちみつ:大さじ2,砂糖:大さじ1,しょうゆ:小さじ2,にんにく:1片,水:大さじ2,バター:10g,いりごま:大さじ1,ピーナッツ:15g|鶏肉はひと口大に切り、塩・こしょう・すりおろしにんにく・しょうが・牛乳をもみ込んで20分おく（牛乳で臭みが抜け、やわらかくなる）。^ヤンニョムだれ：小鍋にコチュジャン・ケチャップ・はちみつ・砂糖・しょうゆ・すりおろしにんにく・水を入れ、弱めの中火で2分、ふつふつとろりとするまで煮詰める。火を止めてバターを溶かす（バターでまろやかでコクのある、韓国チキン店の味に）。^鶏肉の汁気を軽く切り、片栗粉と薄力粉を混ぜたものをまぶす。^揚げ油を170℃に熱し、4分揚げて取り出し、3分休ませる。190℃に上げて1分半二度揚げし、ガリッと硬めの衣にする（韓国チキンは二度揚げでガリガリの食感が特徴。たれを絡めてもしなっとしない）。^揚げたてをボウルに入れ、温かいヤンニョムだれを加えて手早く絡める。^器に盛り、いりごまと砕いたピーナッツをふる。|味の決め手は「二度揚げでガリガリの衣」と「バター入りのたれ」。^たれを絡めたらすぐ食べるのがベスト。
タッカルビ|鶏もも肉:2枚,キャベツ:1/4個,玉ねぎ:1/2個,さつまいも:1/2本,長ねぎ:1/2本,トック:100g,えごまの葉:5枚,ピザ用チーズ:80g|コチュジャン:大さじ3,しょうゆ:大さじ1.5,砂糖:大さじ1,はちみつ:大さじ1,酒:大さじ1,一味唐辛子:小さじ1,にんにく:2片,しょうが:1かけ,ごま油:大さじ1,カレー粉:小さじ1/2|鶏肉はひと口大に切り、コチュジャン・しょうゆ・砂糖・はちみつ・酒・一味・すりおろしにんにくとしょうが・カレー粉（隠し味。本場春川のタッカルビに入る、深みの素）をもみ込んで30分漬ける。^キャベツはざく切り、玉ねぎはくし形、さつまいもは5mm厚の半月切り（水にさらす）、長ねぎは斜め切り、えごまの葉（なければ大葉）はざく切り。^ホットプレート（またはフライパン）にごま油を中火で熱し、さつまいもを2分焼く。^キャベツ・玉ねぎ・トックを広げ、鶏肉を漬けだれごとのせる。ふたをして中火で8分蒸し焼きにする。^ふたを取り、全体を混ぜながら4〜5分、たれが野菜に絡むまで炒める。長ねぎ・えごまの葉を加える。^中央をあけてチーズを入れ、ふたをして弱火で2分溶かす。〆はご飯・刻みのり・ごま油を入れて炒めご飯（ポックンパ）に。|味の決め手は「隠し味のカレー粉」と「えごまの葉」。本場春川の味に近づく。^〆の炒めご飯までがタッカルビ。
ハンバーグ|合いびき肉:350g,玉ねぎ:1/2個,卵:1個,ブロッコリー:1/3株,にんじん:1/3本|パン粉:大さじ5,牛乳:大さじ4,塩:小さじ1/2,黒こしょう:少々,ナツメグ:少々,牛脂:1個,サラダ油:小さじ2,赤ワイン:50ml,ケチャップ:大さじ3,中濃ソース:大さじ2,しょうゆ:小さじ1,砂糖:小さじ1,バター:15g,砂糖:小さじ1,バター:5g|玉ねぎはみじん切りにしてバター少々（分量外）で中火で5分、きつね色手前まで炒め、完全に冷ます（甘みが出て、肉汁を抱えてくれる）。パン粉は牛乳でふやかす。牛脂は細かく刻む。^ボウルを氷水に当て、ひき肉・塩を入れて、手早く1〜2分、白っぽく粘りが出るまで練る（手の熱で脂が溶けると肉汁が逃げる。冷やしながら練るのがジューシーの鉄則）。^卵・パン粉・玉ねぎ・刻んだ牛脂（肉汁の量が劇的に増える）・黒こしょう・ナツメグを加えて混ぜる。2等分し、両手でキャッチボールして空気を抜き、2cm厚の楕円にして中央をくぼませる。^フライパンにサラダ油を中火で熱し、ハンバーグを入れて3分、焼き色をつける。返して水大さじ3を加えてふたをし、弱火で8分蒸し焼き。竹串を刺して透明な肉汁が出ればOK。取り出してアルミホイルをかぶせる。^つけ合わせ：にんじんはグラッセ（水・砂糖小さじ1・バター5gで汁気がなくなるまで煮る）、ブロッコリーは塩ゆで2分。^ソース：ハンバーグを焼いたフライパン（肉汁が残ったまま）に赤ワインを入れて強火で1分、半量に煮詰める。ケチャップ・中濃ソース・しょうゆ・砂糖を加えて1分煮詰め、火を止めてバターを溶かす（肉汁＋赤ワイン＋バターで、洋食屋のデミ風ソースに）。ハンバーグにかける。|味の決め手は「氷水で冷やしながら練る」「牛脂を刻んで混ぜる」「肉汁で作る赤ワインソース」。^ナツメグは臭み消しと洋食屋の香り。少量でOK。
煮込みハンバーグ|合いびき肉:350g,玉ねぎ:1個,卵:1個,しめじ:1パック,マッシュルーム:4個|パン粉:大さじ5,牛乳:大さじ4,塩:小さじ1/2,黒こしょう:少々,ナツメグ:少々,薄力粉:大さじ1,サラダ油:小さじ2,バター:15g,赤ワイン:100ml,トマト缶:1/2缶,ケチャップ:大さじ3,中濃ソース:大さじ2,ウスターソース:大さじ1,砂糖:小さじ2,水:150ml,コンソメ:小さじ1,生クリーム:大さじ2|玉ねぎ1/2個はみじん切りにして炒めて冷まし、残りは薄切り。パン粉は牛乳でふやかす。しめじはほぐし、マッシュルームは薄切り。^ボウルを氷水に当て、ひき肉・塩を粘りが出るまで練り、卵・パン粉・炒め玉ねぎ・黒こしょう・ナツメグを混ぜる。2等分して空気を抜き、楕円形に整え、表面に薄力粉を薄くまぶす（煮崩れを防ぎ、ソースにとろみがつく）。^フライパンにサラダ油を中火で熱し、ハンバーグの両面を2分ずつ焼いて焼き色をつけ、取り出す（中は生でOK）。^同じフライパンにバターを溶かし、薄切り玉ねぎ・しめじ・マッシュルームを4分炒め、赤ワインを加えて強火で2分、半量に煮詰める。^トマト缶・ケチャップ・中濃ソース・ウスターソース・砂糖・水・コンソメを加えて煮立て、ハンバーグを戻す。ふたをして弱火で15分、途中で返しながら煮込む。^ふたを取って中火で3分、とろりとするまで煮詰める。器に盛り、生クリームをたらす。|味の決め手は「赤ワインを煮詰める」ことと「ウスターソース」。デミグラス缶なしでも洋食屋の味に。^ハンバーグに薄力粉をまぶすと、煮崩れず、ソースにとろみがつく。
和風おろしハンバーグ|合いびき肉:350g,玉ねぎ:1/2個,卵:1個,大根:250g,大葉:5枚,しめじ:1/2パック|パン粉:大さじ5,牛乳:大さじ4,塩:小さじ1/2,黒こしょう:少々,ナツメグ:少々,サラダ油:小さじ2,酒:大さじ2,だし:100ml,しょうゆ:大さじ2,みりん:大さじ2,砂糖:小さじ1,片栗粉:小さじ1,ポン酢しょうゆ:大さじ2,バター:10g|玉ねぎはみじん切りにして炒めて冷ます。パン粉は牛乳でふやかす。大根はすりおろして軽く水気を切る。大葉はせん切り。^ボウルを氷水に当て、ひき肉と塩を練り、卵・パン粉・玉ねぎ・黒こしょう・ナツメグを混ぜる。2等分して空気を抜き、楕円形に整えて中央をくぼませる。^フライパンにサラダ油を中火で熱し、3分焼いて返し、酒を加えてふたをし、弱火で8分蒸し焼きにする。取り出す。^和風あん：同じフライパン（肉汁が残ったまま）にバターとしめじを入れて1分炒め、だし・しょうゆ・みりん・砂糖を加えて煮立てる。水溶き片栗粉でとろみをつけ、大根おろしの半量を加えて火を止める（肉汁を生かした和風あん。料亭のハンバーグの味に）。^ハンバーグにあんをかけ、残りの大根おろし・大葉をのせ、ポン酢をかける。|味の決め手は「肉汁で作る、とろみのある和風あん」。大根おろしとポン酢でさっぱり、でもコクがある。^大根おろしをあんに半分、上に半分と分けると、温かさと爽やかさの両方を楽しめる。
ロールキャベツ|キャベツ:8枚,合いびき肉:300g,玉ねぎ:1/2個,ベーコン:4枚,にんじん:1/3本|パン粉:大さじ4,牛乳:大さじ3,卵:1個,塩:小さじ1/3,黒こしょう:少々,ナツメグ:少々,薄力粉:少々,水:600ml,コンソメ:大さじ1,白ワイン:大さじ2,ローリエ:1枚,塩:少々,バター:10g|キャベツは芯をくり抜き、丸ごと熱湯に入れて、はがれた葉から順に1分ずつゆでて取り出す。芯の厚い部分はそぎ取る（そいだ芯はみじん切りにして肉だねに入れる）。^玉ねぎはみじん切りにして炒めて冷ます。パン粉は牛乳でふやかす。^ひき肉に塩を加えて練り、卵・パン粉・玉ねぎ・キャベツの芯・黒こしょう・ナツメグを混ぜて8等分する。^キャベツの内側に薄力粉を茶こしでふり（はがれにくくなる）、肉だねを手前にのせ、手前からひと巻きして左右を折り込み、巻き上げる。ベーコンを巻いて、つまようじでとめる（ベーコンのうまみがスープに出る）。^鍋に巻き終わりを下にしてすき間なく並べ、乱切りのにんじん・水・コンソメ・白ワイン・ローリエを入れて中火で煮立てる。^落としぶたをして弱火で30分、静かに煮込む。塩で調え、バターを加える。器に盛り、スープを注ぐ。|味の決め手は「ベーコンを巻く」ことと「キャベツの芯を肉だねに入れる」こと。スープまでおいしい。^トマト缶1缶を加えればトマト煮込みにアレンジできる。
クリームシチュー|鶏もも肉:300g,玉ねぎ:1個,にんじん:1/2本,じゃがいも:2個,ブロッコリー:1/2株,マッシュルーム:4個|塩:少々,こしょう:少々,バター:20g,薄力粉:大さじ2,白ワイン:大さじ2,水:400ml,コンソメ:小さじ1,ローリエ:1枚,牛乳:300ml,生クリーム:50ml,シチュールウ:3かけ,白みそ:小さじ1|鶏肉はひと口大に切り、塩・こしょうをふる。玉ねぎはくし形、にんじん・じゃがいもは乱切り、マッシュルームは半分、ブロッコリーは小房に分けて塩ゆで1分。^鍋にバターを中火で溶かし、鶏肉を皮目から3分焼き、玉ねぎを加えて3分、透き通るまで炒める（バターで炒めた玉ねぎの甘みがシチューの土台）。^薄力粉をふり入れて1分炒め（ルウだけよりコクととろみが増す）、白ワインを加えて30秒。にんじん・じゃがいも・マッシュルーム・水・コンソメ・ローリエを加えて煮立て、アクを取って弱火で15分煮る。^火を止めてルウを溶かし、牛乳を加えて弱火で5分、ときどき混ぜながら温める（沸騰させない）。^白みそ（隠し味。まろやかなコクと深みが出る）と生クリームを加えて混ぜ、ブロッコリーを加えて1分温める。|味の決め手は「薄力粉をプラス」「白ワイン」「隠し味の白みそ」。ルウだけのシチューよりぐっと深い味に。^牛乳を入れたら沸騰させないこと。分離してざらつく。
ビーフシチュー|牛すね肉:500g,玉ねぎ:2個,にんじん:1本,じゃがいも:2個,マッシュルーム:8個,セロリ:1/3本|塩:小さじ1/2,黒こしょう:少々,薄力粉:大さじ2,サラダ油:大さじ1,バター:20g,にんにく:1片,赤ワイン:400ml,トマト缶:1/2缶,トマトペースト:大さじ1,水:400ml,コンソメ:小さじ2,ローリエ:1枚,ビーフシチュールウ:3かけ,ウスターソース:大さじ1,はちみつ:小さじ2,インスタントコーヒー:小さじ1/4,生クリーム:適量|牛すね肉は大きめの4cm角に切り、塩・黒こしょうをふって薄力粉をまぶす。^厚手の鍋にサラダ油を強めの中火で熱し、牛肉の全面を5分ほど、しっかり濃い焼き色をつけて取り出す（この焼き色が深いコクの源）。^同じ鍋にバターを溶かし、薄切りの玉ねぎ1個・セロリ・にんにくのみじん切りを中火で12分、あめ色になるまで炒める。^牛肉を戻し、赤ワインを加えて強火で5分、アルコールを飛ばしながら半量まで煮詰める（赤ワインを煮詰めて酸味を飛ばし、うまみを凝縮させる）。トマト缶・トマトペースト・水・コンソメ・ローリエを加えて煮立て、アクを取る。^ふたを少しずらして弱火で1時間半、肉に竹串がすっと通るまで煮込む（圧力鍋なら加圧25分）。^くし形の玉ねぎ・乱切りのにんじん・じゃがいも・マッシュルームを加えて20分煮る。火を止めてルウを溶かし、ウスターソース・はちみつ・インスタントコーヒーを加えて弱火で10分。器に盛り、生クリームをたらす。|味の決め手は「肉にしっかり焼き色」「あめ色玉ねぎ」「赤ワインを半量まで煮詰める」。^隠し味のコーヒー少々で、ほろ苦い深みが出て洋食屋のデミの味に。
ポトフ|ウインナー:6本,鶏手羽元:4本,キャベツ:1/4個,玉ねぎ:1個,にんじん:1本,じゃがいも:2個,セロリ:1/2本|塩:小さじ1/2,水:1000ml,白ワイン:50ml,コンソメ:小さじ2,ローリエ:1枚,黒こしょう:粒5粒,塩:少々,粒マスタード:適量|手羽元は塩小さじ1/2をすり込んで15分おき、熱湯をかけて臭みを抜く（手羽元を加えると、骨から極上のスープが出る）。^玉ねぎは皮をむいて4等分（根元はつけたまま）、にんじんは長さを半分にして縦半分、じゃがいもは皮をむいて半分、キャベツはくし形（芯はつけたまま）、セロリは5cm長さ。^鍋に水・白ワイン・手羽元・玉ねぎ・にんじん・セロリ・ローリエ・黒こしょう粒を入れて中火にかけ、沸騰したらアクを丁寧に取り、弱火でふたをずらして20分煮る（ぐらぐら煮立てないのが、澄んだスープのコツ）。^じゃがいも・キャベツを加えて15分、ウインナーを加えて5分煮る（ウインナーは煮すぎると皮が破れてうまみが逃げる）。^コンソメを加え、塩で味を調える（素材のだしが出ているので、コンソメは控えめに）。^器に盛り、粒マスタードを添える。|味の決め手は「手羽元を入れる」ことと「弱火でぐらぐらさせない」こと。澄んだ深いスープに。^野菜は大きく切るほど、煮崩れず甘みが出る。
マカロニグラタン|マカロニ:100g,鶏もも肉:150g,むきえび:8尾,玉ねぎ:1/2個,マッシュルーム:4個,ピザ用チーズ:60g|塩:少々,こしょう:少々,白ワイン:大さじ1,バター:40g,薄力粉:大さじ4,牛乳:500ml,コンソメ:小さじ1,塩:小さじ1/4,白こしょう:少々,ナツメグ:少々,粉チーズ:大さじ2,パン粉:大さじ2|マカロニは塩を入れた湯で表示時間より1分短くゆでる。鶏肉は1.5cm角に切り、塩・こしょう。えびは背わたを取る。玉ねぎは薄切り、マッシュルームは薄切り。^フライパンにバター10gを中火で溶かし、鶏肉を3分、えびを加えて1分炒め、白ワインをふって取り出す。^ホワイトソース：鍋にバター30gを中火で溶かし、玉ねぎを5分、甘くしんなりするまで炒め（色はつけない）、マッシュルームを加えて1分。薄力粉をふり入れて弱火で2分、粉っぽさがなくなるまで炒める。^冷たい牛乳を3回に分けて加え、そのたびに泡立て器でよく混ぜてなめらかにする。中火で5分、混ぜながらとろりとさせ、コンソメ・塩・白こしょう・ナツメグで調える（玉ねぎを入れて作るホワイトソースは甘みが出て、ダマにもなりにくい）。^鶏肉・えび・マカロニを加えて混ぜ、バター（分量外）を塗った耐熱皿に入れる。^ピザ用チーズ・粉チーズ・パン粉をのせ、230℃のオーブン（またはトースター）で10〜12分、こんがり焼き色がつくまで焼く。|味の決め手は「玉ねぎ入りのホワイトソース」と「ナツメグ」。甘みとコクのある洋食屋のグラタンに。^パン粉と粉チーズで、表面がカリッと香ばしく。
ポークソテー|豚ロース肉:2枚,玉ねぎ:1/2個,ブロッコリー:1/3株,じゃがいも:1個|塩:小さじ1/3,黒こしょう:少々,薄力粉:少々,サラダ油:小さじ2,バター:15g,にんにく:1片,しょうゆ:大さじ2,みりん:大さじ1,はちみつ:大さじ1,白ワイン:大さじ2,粒マスタード:小さじ1|豚肉（厚切り1.5cm）は焼く30分前に室温に戻し、筋を切って肉たたきで軽く叩く。塩・黒こしょうをふり、薄力粉を薄くまぶす。^玉ねぎ1/4個はすりおろし、しょうゆ・みりん・はちみつ・白ワイン・すりおろしにんにく・粒マスタードと混ぜてソースにする（すりおろし玉ねぎの甘みと、マスタードの酸味でまとまる）。残りの玉ねぎは薄切り。^フライパンにサラダ油を中火で熱し、豚肉を入れて3分、触らずにこんがり焼く。返して弱めの中火で2分、ふたをして1分。取り出して3分休ませる（休ませると肉汁が落ち着く）。^同じフライパンにバターを溶かし、薄切り玉ねぎを2分炒め、ソースを加えて1分、とろりと煮詰める。豚肉を戻して絡める。^ブロッコリーは塩ゆで、じゃがいもはくし形にしてレンジで加熱し、フライパンで焼いて添える。|味の決め手は「すりおろし玉ねぎ＋はちみつ＋粒マスタード」のソース。^焼いた後3分休ませるのが、ジューシーに仕上げるコツ。
チキンソテー|鶏もも肉:2枚,じゃがいも:2個,いんげん:8本,レモン:1/2個|塩:小さじ2/3,黒こしょう:少々,オリーブオイル:大さじ1,にんにく:2片,ローズマリー:1本,バター:15g,白ワイン:大さじ2,しょうゆ:小さじ1,粒マスタード:小さじ1|鶏肉は余分な脂を取り、厚い部分に切り込みを入れて厚さを揃える。皮目をフォークで刺す。焼く30分前に塩をまんべんなくすり込み、冷蔵庫で置く（塩を早めにすると、身にしっかり味が入りジューシーに）。焼く直前に出た水分を拭き、黒こしょうをふる。^じゃがいもはくし形に切ってレンジで4分加熱。にんにくはつぶす。^冷たいフライパンにオリーブオイルを引き、鶏肉を皮目を下にして並べ、にんにく・ローズマリー（あれば）を入れてから中火にかける。^重し（水を入れた鍋）をのせ、8〜10分、皮がこんがりパリパリになるまで焼く（出た脂はこまめに拭き、その脂でじゃがいもも焼く）。^返して重しを外し、弱めの中火で4分焼いて火を通す。取り出して3分休ませる。^同じフライパンにバターと白ワインを入れて30秒煮立て、しょうゆ・粒マスタードを加えてソースにする。いんげんは塩ゆで。鶏肉を切って、じゃがいも・いんげんと盛り、ソースをかけてレモンを添える。|味の決め手は「冷たいフライパンから皮目をじっくり、重しで押さえて」焼くこと。皮はパリパリ、身はジューシー。^早めの塩で下味がしっかり入る。
チキンのトマト煮|鶏もも肉:2枚,玉ねぎ:1/2個,なす:1本,しめじ:1/2パック,パプリカ:1/2個,ブラックオリーブ:6個|塩:小さじ1/2,黒こしょう:少々,薄力粉:大さじ1,オリーブオイル:大さじ2,にんにく:2片,白ワイン:50ml,トマト缶:1缶,コンソメ:小さじ1,砂糖:小さじ1,ローリエ:1枚,バジル:5枚,粉チーズ:大さじ1|鶏肉はひと口大に切り、塩・黒こしょうをふって薄力粉をまぶす（ソースにとろみがつき、肉がやわらか）。玉ねぎは薄切り、なすは乱切り、パプリカは乱切り、しめじはほぐす、にんにくは薄切り。^フライパンにオリーブオイル大さじ1を中火で熱し、なすを3分焼いて取り出す。^オリーブオイル大さじ1を足し、鶏肉を皮目から入れて4分、こんがり焼き色をつける（焼き色がソースの深みに）。返して1分、にんにく・玉ねぎを加えて2分炒める。^白ワインを加えて強火で30秒、鍋底のこびりつきをこそげる（うまみをソースに溶かす）。トマト缶・コンソメ・砂糖・ローリエを加えて煮立てる。^しめじ・パプリカ・オリーブを加え、ふたをして弱めの中火で12分煮る。なすを戻し、ふたを取って3分、とろりと煮詰める。^塩で味を調え、バジルをちぎって加える。粉チーズをふる。|味の決め手は「鶏の焼き色」と「白ワインで鍋底をこそげる」こと。^オリーブを入れると、塩気とうまみで一気に南イタリアの味に。
ローストビーフ|牛もも肉ブロック:500g,玉ねぎ:1/2個,クレソン:適量|塩:小さじ1,黒こしょう:小さじ1/2,にんにく:1片,オリーブオイル:大さじ1,赤ワイン:80ml,しょうゆ:大さじ3,みりん:大さじ2,砂糖:小さじ1,バター:10g,わさび:適量|牛肉は焼く1時間前に冷蔵庫から出して室温に戻す（中心まで常温にしないと、中だけ生焼けになる）。塩・黒こしょう・すりおろしにんにくを全面にすり込む。^フライパンにオリーブオイルを強火で熱し、煙が出たら牛肉を入れ、各面1分ずつ、全面にしっかり焼き色をつける（計6分）。^【フライパン法】弱火にしてふたをし、2分焼いて返し、2分焼く。火を止めてアルミホイルで二重に包み、さらにふきんで包んで40分おく（余熱で中心をロゼ色に）。【オーブン法】焼き色をつけたら、120℃のオーブンで30分焼き、ホイルで包んで30分休ませる。^ソース：同じフライパンにすりおろした玉ねぎを入れて中火で2分炒め、赤ワインを加えて1分煮立て、しょうゆ・みりん・砂糖・ホイルにたまった肉汁を加えて2分、とろりとするまで煮詰める。火を止めてバターを溶かす。^牛肉が完全に落ち着いたら、繊維を断つように薄く切る（温かいまま切ると肉汁が流れ出る）。^クレソンと盛り、ソースとわさびを添える。|味の決め手は「室温に戻す」「強火で焼き色」「余熱でじっくり」の3つ。^すりおろし玉ねぎ入りのソースが、甘みとコクで肉を引き立てる。
ポークチャップ|豚ロース肉:2枚,玉ねぎ:1/2個,しめじ:1/2パック,マッシュルーム:4個|塩:小さじ1/4,黒こしょう:少々,薄力粉:少々,サラダ油:小さじ2,バター:10g,白ワイン:大さじ2,ケチャップ:大さじ4,ウスターソース:大さじ1,中濃ソース:大さじ1,しょうゆ:小さじ1,砂糖:小さじ1,はちみつ:小さじ1,水:大さじ2|豚肉（とんかつ用の厚切り）は筋を切り、叩いて形を整え、塩・黒こしょうをふり、薄力粉を薄くまぶす。^玉ねぎは薄切り、しめじはほぐし、マッシュルームは薄切り。^ソース：ケチャップ・ウスターソース・中濃ソース・しょうゆ・砂糖・はちみつ・水を混ぜる。^フライパンにサラダ油を中火で熱し、豚肉を3分、こんがり焼く。返して2分焼き、取り出す。^同じフライパンにバターを溶かし、玉ねぎ・きのこを3分、玉ねぎが色づくまで炒める。白ワインを加えて30秒、ソースを加えて1分、ふつふつ煮詰める（ケチャップを煮詰めて酸味を飛ばすのが洋食屋の味）。^豚肉を戻し、ソースを絡めながら1〜2分、火を通す。|味の決め手は「ケチャップ＋ウスター＋はちみつ」を煮詰めること。洋食屋の甘酸っぱい濃厚ソースに。^白ワインを少し入れると、ぐっと上品な味に。
エビフライ|えび:8尾,キャベツ:3枚,卵:1個,レモン:1/4個|塩:少々,こしょう:少々,片栗粉:大さじ1,薄力粉:大さじ3,牛乳:大さじ1,生パン粉:60g,揚げ油:適量,マヨネーズ:大さじ4,ゆで卵:1個,玉ねぎ:1/8個,ピクルス:1本,レモン汁:小さじ1,砂糖:小さじ1/2|えびは尾の一節を残して殻をむき、背わたを取る。尾の先を斜めに切り、包丁でしごいて水分を出す。^腹側に斜めに5本切り込みを入れ、背を上にして押さえ、プチッと音がするまで伸ばす（まっすぐ大きく揚がる）。^片栗粉・塩少々でもみ洗いし、水で流して水気をしっかり拭く（臭みと汚れが取れる）。塩・こしょうをふる。^タルタル：ゆで卵（11分ゆで）を粗く刻み、玉ねぎ（みじん切りにして水にさらし絞る）・ピクルスのみじん切り・マヨネーズ・レモン汁・砂糖を混ぜる（ピクルスの酸味でお店のタルタルに）。^えびに薄力粉→牛乳入り卵液→生パン粉の順につけ、5分おく。^揚げ油を180℃に熱し、2分〜2分半、きつね色になるまで揚げる（えびは火の通りが早いので高温短時間でぷりっと）。網に立てて油を切る。キャベツ・レモン・タルタルを添える。|味の決め手は「えびをまっすぐ伸ばす」「生パン粉」「ピクルス入りタルタル」。^高温で短時間。揚げすぎるとえびが硬くなる。
コロッケ|じゃがいも:4個,合いびき肉:150g,玉ねぎ:1/2個,卵:1個,キャベツ:3枚|バター:15g,塩:小さじ1/3,こしょう:少々,砂糖:小さじ2,しょうゆ:小さじ2,ナツメグ:少々,牛乳:大さじ2,薄力粉:大さじ3,パン粉:60g,揚げ油:適量,中濃ソース:適量|じゃがいも（男爵）は皮付きのまま水から入れ、中火で20〜25分ゆでる（皮付きでゆでると水っぽくならず、甘みが残る）。熱いうちに皮をむき、鍋に戻して弱火で1分、水分を飛ばしてつぶす。^フライパンにバターを中火で溶かし、玉ねぎのみじん切りを4分、ひき肉を加えて3分、ポロポロになるまで炒める。砂糖・しょうゆを加えて汁気がなくなるまで炒める（甘辛い肉味噌風の味つけが、肉屋のコロッケの味）。^じゃがいもに肉、塩・こしょう・ナツメグ・牛乳を混ぜる（そのまま食べておいしい濃さに）。8等分して小判形にし、冷蔵庫で30分しっかり冷やす（冷えたたねを揚げると破裂しない）。^薄力粉→溶き卵（水大さじ1を加える）→パン粉の順につける。^揚げ油を180℃に熱し、2個ずつ入れて1分触らない。返しながら計2分半〜3分、きつね色になったら引き上げる（中は火が通っているので、衣が色づけばOK）。^網に立てて油を切り、キャベツのせん切りとソースを添えて。|味の決め手は「肉を砂糖・しょうゆで甘辛く炒める」こと。肉屋さんのコロッケの味に。^たねをしっかり冷やしてから揚げると、破裂しない。
メンチカツ|合いびき肉:300g,玉ねぎ:1/2個,キャベツ:4枚,卵:2個|塩:小さじ1/2,黒こしょう:少々,ナツメグ:少々,パン粉:大さじ4,牛乳:大さじ3,牛脂:1個,薄力粉:大さじ3,生パン粉:60g,揚げ油:適量,中濃ソース:大さじ2,ケチャップ:大さじ1,からし:少々|玉ねぎはみじん切りにして生のまま使う（生の玉ねぎが、揚げると蒸されて甘い肉汁になる。メンチカツはハンバーグと逆で生がおいしい）。キャベツ1枚分を粗みじん切りにする（シャキッとした食感が加わる）。パン粉は牛乳でふやかす。牛脂は細かく刻む。^ボウルを氷水に当て、ひき肉と塩を粘りが出るまで練る。卵1個・パン粉・玉ねぎ・刻みキャベツ・牛脂・黒こしょう・ナツメグを混ぜる。^4等分して空気を抜き、2.5cm厚の丸形にする。冷蔵庫で20分冷やす。^薄力粉→溶き卵→生パン粉をつける。^揚げ油を160℃に熱し、5分揚げる。返しながらじっくり火を通し、最後に180℃に上げて1分、きつね色にカリッとさせる。^網に立てて3分休ませる（肉汁が落ち着く）。ソースとケチャップを混ぜたソースとからしを添える。残りのキャベツはせん切りにして添える。|味の決め手は「生の玉ねぎ＋刻みキャベツ」と「牛脂」。かじるとジュワッと肉汁があふれる。^低温でじっくり揚げてから高温。中まで火が通り、外はサクサク。
鮭のムニエル|生鮭:2切れ,じゃがいも:1個,ブロッコリー:1/3株,レモン:1/2個,パセリ:少々|塩:小さじ1/3,白ワイン:大さじ1,こしょう:少々,薄力粉:大さじ1,オリーブオイル:小さじ2,バター:30g,レモン汁:大さじ1,ケッパー:小さじ1|鮭は塩をふって15分おき、出た水分を拭く。白ワインをふって5分おき、もう一度拭く（臭みが完全に抜け、身がふっくら）。こしょうをふる。^薄力粉を全体に薄くまぶし、余分をはたく（粉は焼く直前に。早くまぶすとべちゃっとする）。^つけ合わせ：じゃがいもはくし形にしてレンジ加熱、ブロッコリーは塩ゆで。^フライパンにオリーブオイルとバター10gを中火で熱し、バターが泡立ったら鮭を皮目から入れる。3分、こんがり焼いたら返し、弱めの中火で2分。^バター10gを加え、泡立つバターをスプーンで鮭に何度もかけながら1分焼く（アロゼ。香ばしいバターの香りをまとわせる）。鮭を器に盛る。^焦がしバターソース：フライパンに残りのバター10gを加えて中火で30秒、薄い茶色になってナッツのような香りがしたら火を止め、レモン汁・ケッパー・刻みパセリを加えて混ぜ、鮭にかける。|味の決め手は「アロゼ」と「焦がしバターレモンソース」。フランス料理店のムニエルの味に。^粉は焼く直前に、薄く。これでカリッと香ばしく焼ける。
アクアパッツァ|鯛:2切れ,あさり:300g,ミニトマト:10個,ブラックオリーブ:8個|塩:小さじ1/2,こしょう:少々,オリーブオイル:大さじ4,にんにく:2片,赤唐辛子:1本,白ワイン:100ml,水:100ml,ケッパー:大さじ1,アンチョビ:2枚,イタリアンパセリ:適量|あさりは砂抜きして殻をこすり洗いする。鯛（またはたら・金目鯛）は塩をふって15分おき、水気を拭いてこしょうをふる。皮目に切り込みを入れる。^にんにくはつぶし、ミニトマトは半分、アンチョビは刻む。^フライパンにオリーブオイル大さじ2・にんにく・唐辛子を入れて弱火で2分、香りを出す。中火にして鯛を皮目から入れ、3分、皮がパリッとするまで焼いて返す（皮目を焼くと香ばしく、身崩れしにくい）。^あさり・ミニトマト・オリーブ・ケッパー・アンチョビを加え、白ワインと水を注いで強火で煮立て、ふたをして中火で5分蒸し煮にする。^ふたを取り、スプーンで煮汁を鯛に回しかけながら2分煮る。^残りのオリーブオイル大さじ2を回し入れ、強火で30秒、フライパンを揺すって煮汁を白く乳化させる（オイルと魚のだしが一体になり、とろりとしたスープに）。パセリを散らす。パンを添えて、スープまで。|味の決め手は「アンチョビ・オリーブ・ケッパー」の三つの塩気とうまみ、そして最後の「乳化」。^あさりの塩分があるので、味見をしてから塩を足す。
ガーリックシュリンプ|有頭えび:12尾,レモン:1/2個,パセリ:少々|オリーブオイル:大さじ3,にんにく:4片,塩:小さじ1/3,パプリカパウダー:小さじ1/2,一味唐辛子:少々,黒こしょう:少々,白ワイン:大さじ2,バター:20g,しょうゆ:小さじ1|えびは殻付きのまま、背に切り込みを入れて背わたを取る（殻付きで焼くと香ばしく、身が縮まない）。^にんにく2片はすりおろし、2片はみじん切り。えびにすりおろしにんにく・オリーブオイル大さじ1・塩・パプリカパウダー・一味・黒こしょうを絡めて30分漬ける（ハワイのノースショア風。下味のにんにくがしっかり効く）。^フライパンにオリーブオイル大さじ2とみじん切りにんにくを入れ、弱火で3分、にんにくがきつね色になるまでじっくり加熱する（にんにく油が味の主役）。^中火にしてえびを並べ、2分焼き、殻が赤く香ばしくなったら返して1分半。^白ワインを加えて30秒、アルコールを飛ばし、バター・しょうゆを加えて全体に絡める（しょうゆ少々で、ご飯に合う味に）。^器に盛り、パセリを散らしてレモンを添える。フライパンのにんにくバターはご飯にかけて。|味の決め手は「下味のにんにく」と「焦がしにんにくバター」。^殻ごと焼くことで、えびの香ばしさが段違い。
鶏むね肉のピカタ|鶏むね肉:1枚,卵:2個,ミニトマト:6個,ベビーリーフ:適量|塩:小さじ1/4,砂糖:小さじ1/2,こしょう:少々,薄力粉:大さじ1,粉チーズ:大さじ3,パセリ:少々,オリーブオイル:大さじ1,バター:10g,ケチャップ:大さじ2,中濃ソース:小さじ1|鶏むね肉は皮を取り、1cm厚のそぎ切りにして、ラップをかぶせて軽く叩き、厚さを均一にする。塩・砂糖をもみ込んで15分おく（砂糖でしっとり）。こしょうをふり、薄力粉を薄くまぶす。^卵を溶き、粉チーズとみじん切りのパセリを混ぜる（チーズたっぷりで、衣にうまみとコク）。^フライパンにオリーブオイルとバターを弱めの中火で熱し、鶏肉を卵液にくぐらせて並べる。^1分半焼いて卵が固まったら、残った卵液をもう一度上からかけて返す（二度づけで衣がふんわり厚く）。^弱めの中火で2分、ふたをして1分焼いて火を通す（むね肉は焼きすぎるとパサつくので弱めの火で）。^ケチャップと中濃ソースを混ぜたソースを添え、ミニトマト・ベビーリーフと盛る。|味の決め手は「卵液に粉チーズたっぷり」と「卵の二度づけ」。^弱めの火でじっくり焼くと、むね肉がしっとり。
キッシュ|冷凍パイシート:2枚,ベーコン:80g,ほうれん草:1/2束,玉ねぎ:1/2個,しめじ:1/2パック,卵:3個,グリュイエールチーズ:40g,ピザ用チーズ:40g|バター:10g,牛乳:100ml,生クリーム:150ml,塩:小さじ1/4,黒こしょう:少々,ナツメグ:少々|パイシートを2枚つなげて直径18cmの型に敷き、フォークで底に穴をあけて冷蔵庫で15分休ませる。^オーブンを200℃に予熱する。生地にオーブンシートを敷いて重石をのせ、15分空焼きし、重石を取って5分焼く。溶き卵少々を底に薄く塗って1分焼く（卵の膜で、底が湿らずサクッと）。^ベーコンは1cm幅、玉ねぎは薄切り、しめじはほぐす。ほうれん草は塩ゆでして水気を絞り、3cm長さ。^フライパンにバターとベーコンを入れて中火で2分、玉ねぎを加えて5分、甘くしんなりするまで炒め、しめじを加えて2分、塩・黒こしょう少々で調える（玉ねぎをじっくり炒めて甘みを出すのがおいしいキッシュの秘訣）。^卵液：卵・牛乳・生クリーム・塩・黒こしょう・ナツメグを混ぜてこす（卵1：乳製品2の割合で、なめらかで濃厚に）。^生地に具・ほうれん草・2種のチーズを広げ、卵液を流す。170℃に下げて30分、ゆすって中央が揺れなくなるまで焼く。型のまま10分おいて切る。|味の決め手は「玉ねぎをじっくり炒める」ことと「生クリームたっぷりの卵液」。^底に溶き卵を塗ってから焼くと、パイがサクサクのまま。
チリコンカン|合いびき肉:250g,キドニービーンズ:200g,玉ねぎ:1個,セロリ:1/3本,ピーマン:1個|オリーブオイル:大さじ1,にんにく:2片,チリパウダー:大さじ1,クミン:小さじ1,オレガノ:小さじ1/2,トマト缶:1缶,トマトペースト:大さじ1,ケチャップ:大さじ1,ウスターソース:大さじ1,コンソメ:小さじ1,砂糖:小さじ1,チョコレート:5g,塩:小さじ1/2,黒こしょう:少々|玉ねぎ・セロリ・ピーマン・にんにくはみじん切り。豆（キドニーまたは大豆水煮）は水気を切る。^鍋にオリーブオイルとにんにくを入れて弱火で1分、玉ねぎ・セロリを加えて中火で6分、きつね色手前まで炒める。^ひき肉を加え、1分触らずに焼き付けてから3分、ポロポロにする。チリパウダー・クミン・オレガノを加えて1分炒め、香りを立てる（スパイスを油で炒めると香りが立つ）。^トマト缶・トマトペースト・ケチャップ・ウスターソース・コンソメ・砂糖・豆・水100ml（分量外）を加えて煮立て、弱火で20分、ときどき混ぜて煮込む。^ピーマン・チョコレートを加えて5分（隠し味のチョコで、テキサスの本場のような深いコクに）。塩・黒こしょうで調える。^ご飯・トルティーヤチップス・パンと。サワークリームやチーズをのせても。|味の決め手は「チリパウダー＋クミン」と「隠し味のチョコ」。^一晩おくとさらに味がなじむ。
フライドチキン|手羽元:10本|牛乳:150ml,塩:小さじ1,砂糖:小さじ1,にんにく:1片,しょうが:少々,薄力粉:大さじ6,片栗粉:大さじ2,コンソメ:小さじ2,パプリカパウダー:小さじ1,ガーリックパウダー:小さじ1/2,黒こしょう:小さじ1/2,ナツメグ:少々,セージ:少々,揚げ油:適量|手羽元は骨に沿って1本切り込みを入れる。^牛乳・塩・砂糖・すりおろしにんにく・しょうがを混ぜ、手羽元を漬けて冷蔵庫で2時間〜一晩おく（バターミルク漬けの代わり。塩と砂糖で肉がジューシーに、牛乳でやわらかく臭みなし）。^衣：ポリ袋に薄力粉・片栗粉・コンソメ・パプリカパウダー・ガーリックパウダー・黒こしょう・ナツメグ・セージ（あれば）を入れて混ぜる（スパイスたっぷりの衣が、ケンタッキー風の味の秘密）。^手羽元の汁気を軽く切って袋に入れ、ふって粉をまぶす。5分おいて粉が湿ってきたら、もう一度漬け汁にさっとくぐらせて再び粉をまぶす（二度づけでザクザクの衣に）。^揚げ油を160℃に熱し、7〜8分、じっくり揚げて中まで火を通す。取り出して3分休ませる。^180℃に上げて1分半二度揚げし、衣をカリッと濃いきつね色にする。|味の決め手は「牛乳＋塩＋砂糖の漬け込み」と「スパイスたっぷりの衣」。^衣を二度づけにすると、ザクザクのフライドチキンに。
牡蠣フライ|牡蠣:14個,キャベツ:3枚,卵:1個,レモン:1/2個|片栗粉:大さじ2,塩:少々,薄力粉:大さじ3,牛乳:大さじ1,生パン粉:50g,揚げ油:適量,マヨネーズ:大さじ4,ゆで卵:1個,玉ねぎ:1/8個,ピクルス:1本,レモン汁:小さじ1,中濃ソース:適量|牡蠣は片栗粉・塩をまぶしてやさしくもみ、黒い汚れが出たら水で2〜3回すすぐ。ペーパーで1粒ずつ水気をしっかり拭く（水気が残ると油がはね、衣がはがれる）。^タルタル：ゆで卵を刻み、玉ねぎ・ピクルスのみじん切り・マヨネーズ・レモン汁と混ぜる。^牡蠣に薄力粉→牛乳入り卵液→生パン粉の順につける。卵液とパン粉をもう一度つけて二度づけにする（牡蠣は身が縮むので、衣を厚めに）。^揚げ油を180℃に熱し、1分半〜2分、きつね色になったらすぐ引き上げる（揚げすぎると縮んで硬くなる。中がジューシーなうちに）。^網に立てて油を切る。キャベツ・レモン・タルタルソースと中濃ソースを添えて。|味の決め手は「しっかり水気を拭く」ことと「衣の二度づけ」。サクサク衣の中から、ジュワッと牡蠣のエキスが。^揚げ時間は短く。牡蠣は生でも食べられるので、衣が色づけばOK。
オムレツ|卵:6個|牛乳:大さじ2,生クリーム:大さじ2,塩:小さじ1/4,白こしょう:少々,バター:30g,ケチャップ:適量|1人分ずつ作る（卵3個）。卵をボウルに割り、牛乳大さじ1・生クリーム大さじ1・塩・白こしょうを加え、白身のこしがなくなるまで菜箸で切るように40回混ぜる。ざるでこすとさらになめらか（白身の塊がなくなると、均一なふわとろに）。^直径20cmのフライパン（テフロン）にバター15gを中火で熱し、バターが溶けて泡が小さくなったら（焦がさない）卵液を一気に流す。^すぐに菜箸（またはゴムベラ）で大きく素早くかき混ぜながら、フライパンを前後に揺する。10〜15秒、細かいスクランブル状の半熟になったら混ぜるのをやめる。^弱火にし、フライパンの柄を持ち上げて奥に傾け、手前から奥に向かって卵を折りたたむ。^柄をトントンと叩いて卵を奥の縁に寄せ、木の葉形に整える。全体で1分以内（表面がとろとろの半熟が理想）。^皿を添えて返すように盛り、ペーパーで形を整える。ケチャップを添える。|味の決め手は「バターたっぷり」と「1分以内で仕上げる」こと。中がとろとろのホテルのオムレツに。^生クリームを入れると、冷めてもやわらかくリッチ。
スパニッシュオムレツ|卵:5個,じゃがいも:2個,玉ねぎ:1個,ベーコン:3枚,パプリカ:1/2個|オリーブオイル:大さじ5,塩:小さじ1/2,黒こしょう:少々,牛乳:大さじ2,粉チーズ:大さじ2|じゃがいもは5mm厚のいちょう切り、玉ねぎは薄切り、ベーコンは1cm幅、パプリカは1cm角。^直径20cmのフライパンにオリーブオイル大さじ4を入れ、じゃがいも・玉ねぎを入れて弱めの中火で10〜12分、たっぷりの油で煮るように、じゃがいもがやわらかく、玉ねぎが甘くとろりとするまで加熱する（スペインのトルティージャの本場の作り方。油で煮ると驚くほど甘くなる）。ベーコン・パプリカを加えて2分。ざるにあげて油を切る（油は取っておく）。^ボウルに卵・牛乳・粉チーズ・塩・黒こしょうを混ぜ、熱いうちの具を加えて混ぜ、5分おく（卵が具になじみ、しっとりまとまる）。^フライパンに取っておいた油大さじ1を中火で熱し、卵液を流して大きく3〜4回混ぜる。弱火にしてふたをし、6〜8分焼く。^表面がほぼ固まったら、皿をかぶせてひっくり返し、すべらせてフライパンに戻す。弱火で3分焼く。^粗熱を取ってから放射状に切る。温かくても冷めても。|味の決め手は「たっぷりのオリーブオイルで具を煮るように加熱」すること。甘く、とろりとした本場の味。^卵液に熱い具を入れて5分おくと、しっとり一体感が出る。
すき焼き|牛ロース肉:400g,焼き豆腐:1丁,長ねぎ:2本,春菊:1束,しいたけ:6個,しらたき:1袋,えのき:1袋,卵:4個|牛脂:1個,しょうゆ:100ml,みりん:100ml,酒:100ml,砂糖:大さじ3,ざらめ:大さじ1|割り下：小鍋にみりんと酒を入れて中火で1分煮立て、アルコールを飛ばす。しょうゆ・砂糖を加えて溶かす（煮切ってから合わせると、角が取れたまろやかな割り下に）。^長ねぎは斜め1.5cm幅、焼き豆腐は8等分、しいたけは飾り包丁、春菊は葉を摘む、しらたきは3分下ゆでして食べやすく切る、えのきはほぐす。牛肉は焼く20分前に冷蔵庫から出す。^すき焼き鍋を中火で熱し、牛脂を溶かして全体になじませる。長ねぎを並べて両面2分ずつ、焼き色をつける（焦げ目の甘い香りが味の土台に）。^【最初の一枚は関西風で】牛肉を2〜3枚広げて焼き、ざらめをふりかけ、しょうゆを少したらして、焼き色がついたらすぐ溶き卵につけて食べる（肉のおいしさが一番わかる食べ方）。^割り下を注ぎ、豆腐・しいたけ・しらたき・えのきを入れて中火で5分煮る（しらたきは肉を硬くするので、肉から離して置く）。^肉は1枚ずつ広げて入れ、色が7割変わったらすぐ卵につけて食べる。春菊はさっと20秒。煮詰まったら水か酒を少し足す。〆はうどんを入れて卵でとじて。|味の決め手は「割り下を煮切る」ことと「最初の一枚は焼いて食べる」こと。^ざらめは溶けにくい分、焦げた香りがよく、関西の老舗の甘い香りに。
しゃぶしゃぶ|豚ロース肉:400g,白菜:1/8個,水菜:1束,えのき:1袋,絹ごし豆腐:1/2丁,長ねぎ:1本,にんじん:1/4本|昆布:2枚,水:1500ml,酒:50ml,練りごま:大さじ4,すりごま:大さじ2,しょうゆ:大さじ2,砂糖:大さじ1.5,酢:大さじ1,みそ:小さじ1,だし:大さじ4,ラー油:少々,ポン酢しょうゆ:大さじ5,もみじおろし:適量|土鍋に水と昆布を入れて1時間おく（昆布だしでしゃぶしゃぶするのが専門店の味）。^ごまだれ：練りごまに砂糖・みそを混ぜ、しょうゆ・酢を加え、だしを少しずつ加えてのばす。すりごま・ラー油を混ぜる（みそを少し入れると、まろやかで濃厚な専門店のごまだれに）。^白菜はざく切り、水菜は5cm長さ、えのきはほぐす、豆腐は8等分、長ねぎは斜め薄切り、にんじんはピーラーで薄くリボン状にする。^土鍋を中火にかけ、沸騰直前に昆布を取り出して酒を加える。白菜の芯・豆腐・えのきを入れて5分煮る。^火を弱め、湯が静かにふつふつする程度（80〜90℃）を保つ。豚肉を1枚ずつ箸で広げ、湯の中で数回泳がせ、色が完全に変わったらすぐ引き上げる（沸騰した湯だと肉が硬く縮む）。^ごまだれかポン酢（もみじおろし・ねぎを入れて）で。野菜もさっとくぐらせて。〆は残りのだしで雑炊かラーメンを。|味の決め手は「昆布だし」と「沸騰させない80℃の湯」。肉がふわっとやわらかい。^ごまだれにみそを少し入れるのが、専門店の味の秘密。
寄せ鍋|鶏もも肉:250g,たら:2切れ,有頭えび:6尾,ほたて:6個,白菜:1/4個,長ねぎ:1本,しいたけ:4個,えのき:1袋,木綿豆腐:1/2丁,春菊:1/2束|昆布:1枚,水:1000ml,かつお節:15g,酒:大さじ3,薄口しょうゆ:大さじ3,みりん:大さじ3,塩:小さじ1/2|だし：鍋に水と昆布を入れて30分おき、弱火で沸騰直前に昆布を取り出す。かつお節を入れて2分煮出し、こす（本格的なだしで作ると、鍋の味がまるで違う）。^酒・薄口しょうゆ・みりん・塩を加えて鍋つゆにする（色の薄い上品なつゆが、具の味を生かす）。^鶏肉はひと口大、たらは塩をふって10分おき、熱湯をかけて冷水で洗う（霜降り。臭みが取れ、つゆが濁らない）。えびは背わたを取る。^白菜はざく切り、長ねぎは斜め切り、しいたけは飾り包丁、えのきはほぐす、豆腐は8等分、春菊は葉を摘む。^土鍋に鍋つゆを入れて中火で煮立て、鶏肉・白菜の芯を入れて5分煮る（鶏からだしが出る）。アクを取る。^たら・えび・ほたて・しいたけ・えのき・長ねぎ・豆腐・白菜の葉を加え、ふたをして中火で6分煮る。春菊は食べる直前に。〆は雑炊（ご飯を入れて3分、溶き卵でとじて）。|味の決め手は「自分でとっただし」と「たらの霜降り」。^具材からうまみが出るので、つゆは薄めでOK。〆の雑炊は格別。
水炊き|骨付き鶏もも肉:2本,鶏手羽元:6本,白菜:1/4個,長ねぎ:1本,しめじ:1パック,木綿豆腐:1/2丁,春菊:1/2束,小ねぎ:適量|水:1500ml,酒:100ml,しょうが:1かけ,塩:適量,ポン酢しょうゆ:大さじ6,ゆず果汁:大さじ1,もみじおろし:適量|骨付き鶏・手羽元はぶつ切りにし（店で頼む）、熱湯で2分下ゆでして水で洗う（臭みと汚れを取り、白く濁った澄んだスープに）。^鍋に水・酒・しょうがの薄切り・鶏肉を入れて強火にかけ、沸騰したらアクを丁寧にすくう。中火のまま40分、ぐらぐらと煮立てて鶏の骨からエキスを出す（強火で煮ると白濁した濃厚スープになる。これが博多の水炊き）。水が減ったら足す。^【博多流の最初の一杯】スープだけを湯のみに取り、塩ひとつまみと小ねぎを入れて飲む（鶏のうまみがストレートにわかる）。^ポン酢にゆず果汁を加える。白菜はざく切り、長ねぎは斜め切り、しめじはほぐす、豆腐は8等分。^鍋に白菜の芯・しめじ・豆腐・長ねぎを入れて5分煮て、白菜の葉・春菊を加えて2分。^鶏肉と野菜をポン酢（もみじおろし・小ねぎ）につけて食べる。〆は雑炊（ご飯・溶き卵・塩少々）かちゃんぽん麺で。|味の決め手は「骨付き鶏を40分強火で煮て白濁スープ」にすること。^まずスープを塩で飲む。これが博多水炊きの楽しみ方。
もつ鍋|牛もつ:400g,キャベツ:1/2個,にら:2束,ごぼう:1/3本,木綿豆腐:1/2丁|水:900ml,鶏がらスープの素:大さじ1,和風だしの素:小さじ2,しょうゆ:大さじ4,みりん:大さじ3,酒:大さじ3,砂糖:小さじ2,にんにく:4片,赤唐辛子:2本,ごま:大さじ2,ちゃんぽん麺:1玉|もつは熱湯でさっと1分下ゆでしてざるに上げ、水で洗う（ゆですぎると脂のうまみが抜けるので短時間。臭みと余分な脂を落とす）。^ごぼうはささがきにして水にさらす。キャベツはざく切り、にらは5cm長さ、豆腐は6等分、にんにくは薄切り、唐辛子は種を取って小口切り。^スープ：水・鶏がらスープの素・和風だしの素・しょうゆ・みりん・酒・砂糖を混ぜる（鶏がら＋和風だしのダブルスープで、博多のお店の深い味に）。^鍋にスープを入れて中火で煮立て、ごぼう・豆腐を入れる。キャベツを山盛りにのせ、もつをのせ、にらを放射状に並べる。中央ににんにくと唐辛子を置き、ごまをふる。^ふたをして中火で10分、キャベツのかさが減って、もつの脂が溶け出すまで煮る（ごぼうともつの相性が抜群）。^〆はちゃんぽん麺を入れて3分。|味の決め手は「鶏がら＋和風だし」と「ごぼう」。もつの脂がスープに溶けて、甘みとコクが増す。^にんにくはたっぷりがおいしい。
キムチ鍋|豚バラ肉:250g,白菜キムチ:300g,木綿豆腐:1丁,にら:1束,長ねぎ:1本,えのき:1袋,白菜:1/8個,あさり:150g|ごま油:大さじ1.5,にんにく:2片,コチュジャン:大さじ1.5,一味唐辛子:小さじ1,水:700ml,鶏がらスープの素:大さじ1,煮干し:10g,味噌:大さじ1,しょうゆ:大さじ1,砂糖:小さじ2,酒:大さじ2,ピザ用チーズ:適量|煮干しは頭とわたを取り、水に30分つけてから弱火で5分煮出してこす（煮干しだしが本場韓国のキムチチゲのうまみ）。^キムチ（よく発酵した酸っぱいもの）はざく切り。豚肉は5cm長さ。豆腐は8等分、にら・長ねぎは5cm長さ、えのきはほぐす、白菜はざく切り。あさりは砂抜き。^土鍋にごま油を中火で熱し、すりおろしにんにく・豚肉を2分炒め、キムチを加えて3分、汁気がなくなるまでしっかり炒める（キムチを炒めると酸味が丸くなり、うまみと甘みが出る。これがキムチ鍋の最大のコツ）。^コチュジャン・一味を加えて30秒炒め、煮干しだし・鶏がらスープの素・酒を加えて煮立て、味噌・しょうゆ・砂糖を溶き入れる。^白菜・豆腐・えのき・長ねぎ・あさりを入れて中火で6分煮る。にらは最後に。^〆はラーメンか、ご飯とチーズを入れてリゾット風に。|味の決め手は「キムチを3分しっかり炒める」ことと「煮干しだし」。^砂糖少々で、キムチの酸味と辛さがまろやかにまとまる。
豆乳鍋|鶏もも肉:250g,白菜:1/4個,しめじ:1パック,水菜:1/2束,木綿豆腐:1/2丁,にんじん:1/3本,長ねぎ:1本|昆布:1枚,水:400ml,かつお節:10g,無調整豆乳:500ml,白味噌:大さじ2,味噌:大さじ1,薄口しょうゆ:大さじ1,みりん:大さじ1,酒:大さじ2,すりごま:大さじ2,塩:少々|だし：水と昆布を30分おき、弱火で沸騰直前に昆布を取り出し、かつお節を入れて2分煮出してこす。^鶏肉はひと口大、白菜はざく切り、しめじはほぐす、水菜は5cm長さ、豆腐は8等分、にんじんは薄い短冊、長ねぎは斜め切り。^土鍋にだし・酒を入れて中火で煮立て、鶏肉・白菜の芯・にんじんを入れて5分煮る。アクを取る。^しめじ・豆腐・長ねぎ・白菜の葉を加えて3分煮る。^火を弱め、白味噌・味噌・薄口しょうゆ・みりんを溶き入れ、豆乳とすりごまを加える（白味噌の甘みと、ごまのコクで、豆乳がぐっとまろやかに）。ここからは弱火で温めるだけ（沸騰させると豆乳が分離してもろもろになる）。^ふつふつと小さな泡が出たら水菜を入れて完成。塩で調える。〆はご飯とチーズでリゾット、またはラーメン。|味の決め手は「白味噌＋すりごま」と「沸騰させない」こと。まろやかでコクのある豆乳鍋に。^無調整豆乳を使うと、大豆のコクが濃い。
おでん|大根:1/2本,卵:6個,ちくわ:4本,ごぼう天:4本,さつま揚げ:4枚,こんにゃく:1枚,厚揚げ:1枚,はんぺん:1枚,牛すじ:200g,昆布:2枚|米のとぎ汁:適量,水:2000ml,かつお節:20g,酒:100ml,薄口しょうゆ:大さじ4,しょうゆ:大さじ1,みりん:大さじ4,砂糖:小さじ1,塩:小さじ1,からし:適量|大根は3cm厚の輪切りにして皮を厚めにむき、面取りして十字の隠し包丁を入れる。米のとぎ汁で30分、竹串がすっと通るまで下ゆでする（えぐみが抜け、味がしみやすくなる）。^牛すじは熱湯で10分ゆでて水で洗い、もう一度新しい水で30分ゆでて串に刺す（牛すじのだしがおでんに深いコクを与える）。^卵は10分ゆでて殻をむく。こんにゃくは三角に切って隠し包丁を入れて3分下ゆで。練り物・厚揚げは熱湯をかけて油抜き。昆布は水でもどして結ぶ。^だし：水に昆布を入れて30分おき、弱火で沸騰直前に昆布を取り出す（結んで具にする）。かつお節を入れて3分煮出してこす。酒・薄口しょうゆ・しょうゆ・みりん・砂糖・塩を加える。^土鍋にだし・大根・牛すじ・卵・こんにゃく・厚揚げ・結び昆布を入れ、ごく弱火（表面がゆらゆら揺れる程度）で1時間煮る（ぐらぐら煮るとだしが濁り、練り物がふくらむ）。^練り物を加えて15分、はんぺんは最後に5分。火を止めて1時間以上おく（冷める間に味がしみる）。食べる前に温め直し、からしを添えて。|味の決め手は「牛すじ」と「昆布＋かつおのだし」、そして「沸騰させずに煮て、一度冷ます」こと。^翌日のおでんが一番おいしい。
ちゃんこ鍋|鶏ひき肉:250g,鶏もも肉:200g,キャベツ:1/4個,長ねぎ:1本,にんじん:1/3本,油揚げ:1枚,しいたけ:4個,ごぼう:1/3本,木綿豆腐:1/2丁|長ねぎ:5cm,しょうが:1かけ,卵:1/2個,片栗粉:大さじ1,味噌:小さじ1,塩:少々,水:1200ml,鶏がらスープの素:大さじ1,和風だしの素:小さじ2,しょうゆ:大さじ3,酒:大さじ3,みりん:大さじ2,塩:小さじ1/2,にんにく:1片,ごま油:小さじ1|つくね：鶏ひき肉に、みじん切りの長ねぎ・すりおろししょうが・溶き卵・片栗粉・味噌・塩を加えて粘りが出るまで1分練る（味噌でふんわりうまみのあるつくねに）。^鶏もも肉はひと口大に切り、フライパン（油なし）で皮目を2分焼いて焼き色をつける（香ばしさがスープの深みに）。^キャベツはざく切り、長ねぎは斜め切り、にんじんは輪切り、油揚げは油抜きして短冊、しいたけは飾り包丁、ごぼうはささがき、豆腐は8等分。^鍋に水・鶏がらスープの素・和風だしの素・しょうゆ・酒・みりん・塩・すりおろしにんにく・ごま油を入れて中火で煮立て、鶏もも肉・ごぼう・にんじんを入れて8分煮る。^つくねをスプーン2本で丸めて落とし入れ、浮いてくるまで5分煮る。アクを取る。^キャベツ・長ねぎ・しいたけ・油揚げ・豆腐を加え、ふたをして5分。〆はうどんかラーメン。|味の決め手は「鶏がら＋和風だし」の二段構えと「焼き付けた鶏もも」。相撲部屋のような、うまみたっぷりのスープに。^つくねに味噌を入れると、ふわふわで臭みゼロ。
トマト鍋|鶏もも肉:250g,ウインナー:6本,キャベツ:1/4個,玉ねぎ:1個,ブロッコリー:1/2株,しめじ:1パック,ミニトマト:8個|オリーブオイル:大さじ2,にんにく:2片,白ワイン:50ml,トマト缶:2缶,水:400ml,コンソメ:大さじ1,砂糖:小さじ2,しょうゆ:小さじ1,ローリエ:1枚,塩:少々,ピザ用チーズ:80g,バジル:5枚|鶏肉はひと口大に切って塩少々（分量外）、玉ねぎはくし形、キャベツはざく切り、ブロッコリーは小房、しめじはほぐす。にんにくはみじん切り。^土鍋にオリーブオイルとにんにくを入れて弱火で1分、中火にして鶏肉を皮目から4分焼き付ける（焼き目がスープのコク）。玉ねぎを加えて2分炒める。^白ワインを加えて30秒、トマト缶を加えて中火で5分、つぶしながら煮詰める（トマトを煮詰めて酸味を飛ばすと、うまみが凝縮する）。^水・コンソメ・砂糖・しょうゆ（隠し味でうまみに深み）・ローリエを加えて煮立てる。^キャベツ・しめじ・ウインナーを入れて8分、ブロッコリー・ミニトマトを加えて3分煮る。^チーズとバジルをのせて溶かす。〆はご飯とチーズでリゾット、またはゆでたパスタ。|味の決め手は「トマト缶を先に煮詰める」ことと「隠し味のしょうゆ」。^〆のリゾットまで楽しめる。
湯豆腐|絹ごし豆腐:2丁,長ねぎ:1/2本,春菊:1/4束,しいたけ:2個|昆布:2枚,水:1000ml,しょうゆ:大さじ3,みりん:大さじ1,かつお節:5g,ゆず果汁:大さじ1,小ねぎ:適量,しょうが:1かけ,七味唐辛子:少々|土鍋に水と昆布を入れて1時間以上おく（昆布だしの香りが、湯豆腐のすべて）。^つけだれ：小鍋にみりんを入れて煮立て、しょうゆ・かつお節を加えて弱火で1分煮出してこす。ゆず果汁を加える（自家製のかつおしょうゆが料亭の味。ポン酢でも）。^豆腐は大きめの6等分、長ねぎは斜め薄切り、しいたけは飾り包丁、春菊は葉を摘む。薬味の小ねぎ・おろししょうがを用意する。^土鍋を弱めの中火にかけ、ふつふつしてきたら豆腐・しいたけを入れる。^ごく弱火を保ち（沸騰させない）、豆腐がゆらりと浮き上がってきたら食べどき（3〜5分。煮立てると、すが立って硬くなる）。^器にすくい、つけだれと薬味・七味で。長ねぎと春菊はさっと温めて。|味の決め手は「昆布を1時間以上つける」ことと「豆腐を煮立てない」こと。^つけだれを自家製にすると、シンプルな湯豆腐がぐっと上品に。
石狩鍋|生鮭:3切れ,鮭のアラ:200g,白菜:1/8個,じゃがいも:2個,にんじん:1/3本,長ねぎ:1本,しいたけ:4個,木綿豆腐:1/2丁,キャベツ:2枚|昆布:1枚,水:1000ml,酒:大さじ3,味噌:大さじ4,白味噌:大さじ1,みりん:大さじ1,砂糖:小さじ1,バター:20g,粉山椒:少々|鮭とアラはひと口大に切り、塩少々（分量外）をふって10分おき、熱湯をかけて冷水で洗う（霜降り。臭みとうろこを取る）。^鍋に水と昆布を入れて30分おき、鮭のアラ・酒を入れて中火にかけ、沸騰したらアクを取り、弱火で10分煮出す（アラから濃厚な鮭のだしが出る。これが石狩鍋の決め手）。^じゃがいもは厚めの半月切り、にんじんは輪切り、白菜・キャベツはざく切り、長ねぎは斜め切り、しいたけは飾り包丁、豆腐は8等分。^鍋にじゃがいも・にんじんを入れて10分、竹串が通るまで煮る。^味噌・白味噌・みりん・砂糖を溶き入れ、鮭の切り身・白菜・キャベツ・しいたけ・豆腐・長ねぎを加えて中火で6分（味噌は2種類で、まろやかで奥行きのある味に）。^火を止める直前にバターをのせ、山椒をふる（北海道流。バターと山椒が鮭の脂と味噌に合う）。|味の決め手は「鮭のアラでだしを取る」ことと「バター＋山椒」。^キャベツを入れると、甘みが出て北海道らしい味に。
豚汁|豚バラ肉:150g,大根:150g,にんじん:1/2本,ごぼう:1/2本,こんにゃく:1/2枚,里芋:2個,長ねぎ:1/2本,油揚げ:1/2枚|ごま油:大さじ1,酒:大さじ2,だし:900ml,味噌:大さじ3,白味噌:大さじ1,みりん:小さじ1,しょうが:1かけ,七味唐辛子:少々|大根・にんじんは5mm厚のいちょう切り、ごぼうはささがきにして水にさらす。こんにゃくはちぎって2分下ゆで、里芋は皮をむいて塩もみしてぬめりを洗い、1cm厚に。油揚げは油抜きして短冊、長ねぎは小口切り。豚肉は3cm長さ。^鍋にごま油を中火で熱し、豚肉を3分、脂が出てカリッとするまでしっかり炒める（豚の脂とうまみが豚汁のコクのもと）。^ごぼう・大根・にんじん・こんにゃく・里芋を加えて3分、野菜に豚の脂が回るまで炒める。酒を加えて30秒。^だしを加えて強火で煮立て、アクを丁寧に取る。油揚げを加え、弱めの中火でふたをして15分、根菜がやわらかくなるまで煮る。^火を弱め、味噌の半量（味噌大さじ2）を溶き入れて5分煮る（先に入れた味噌で具に味をしみ込ませる）。^最後に残りの味噌と白味噌・みりん・すりおろししょうがを溶き入れ、長ねぎを加えて煮立つ直前で火を止める（後入れの味噌で香りを立てる）。七味を添えて。|味の決め手は「豚肉をカリッと炒める」「味噌を2回に分ける」「しょうが」。^白味噌を少し加えると、まろやかで甘みのある深い味に。
豆腐とわかめの味噌汁|絹ごし豆腐:1/2丁,乾燥わかめ:3g,長ねぎ:1/4本,油揚げ:1/4枚|昆布:1枚,水:500ml,かつお節:10g,味噌:大さじ1.5,白味噌:小さじ1|だし：鍋に水と昆布を入れて30分おき、弱火で沸騰直前に昆布を取り出す。かつお節を入れて火を止め、2分おいてこす（顆粒だしではなく、昆布とかつおでとるだけで味噌汁が劇的に変わる）。^わかめは水に5分つけてもどし、水気を絞る。豆腐は1.5cm角、長ねぎは小口切り、油揚げは油抜きして細切り。^だしを中火で温め、油揚げ・豆腐を入れて2分、豆腐の中まで温める。^火を弱め、味噌をお玉の中で溶きのばしてから入れる（2種の味噌を合わせると、奥行きのある味に）。^わかめ・長ねぎを加え、表面がふつふつと揺れる「煮えばな」で火を止める（沸騰させると味噌の香りが飛ぶ）。|味の決め手は「昆布とかつおでだしをとる」こと。たった10分で、旅館の朝の味噌汁に。^味噌は煮立てないこと。香りが命。
なめこ汁|なめこ:1袋,絹ごし豆腐:1/2丁,小ねぎ:適量,三つ葉:適量|昆布:1枚,水:500ml,かつお節:10g,赤味噌:大さじ1,味噌:大さじ1/2,七味唐辛子:少々|だし：鍋に水と昆布を入れて30分おき、弱火で沸騰直前に昆布を取り出し、かつお節を入れて火を止め、2分おいてこす。^なめこはざるに入れてさっと水洗いする（ぬめりは少し残すのがおいしさ）。豆腐は1cm角に切る。^だしを中火で温め、豆腐・なめこを入れて2分煮る。^火を弱め、赤味噌と味噌を溶き入れる（なめこ汁には赤味噌がよく合う。コクと香りが引き立つ）。^煮えばなで火を止め、器に盛る。小ねぎ・三つ葉を散らし、七味を少々。|味の決め手は「赤味噌」。なめこのとろみと赤味噌の香りは、料亭の定番の組み合わせ。^七味を少しふると香りが立つ。
けんちん汁|木綿豆腐:1/2丁,大根:150g,にんじん:1/3本,ごぼう:1/3本,里芋:3個,干ししいたけ:3個,こんにゃく:1/3枚,長ねぎ:1/3本|ごま油:大さじ1.5,昆布:1枚,水:800ml,酒:大さじ1,薄口しょうゆ:大さじ1.5,しょうゆ:小さじ1,みりん:大さじ1,塩:小さじ1/3|精進だし：水に昆布と干ししいたけを入れて1時間以上（できれば一晩）おく（動物性のだしを使わない精進料理。しいたけと昆布のうまみ）。しいたけを取り出して薄切りにし、昆布は取り出す。^豆腐はペーパーで包んで15分水切り。大根・にんじんはいちょう切り、ごぼうはささがき（水にさらす）、里芋は塩もみして1cm厚、こんにゃくはちぎって下ゆで、長ねぎは小口切り。^鍋にごま油を中火で熱し、ごぼう・大根・にんじん・里芋・こんにゃく・しいたけを3分炒める。^豆腐を手で崩しながら加え、2分炒めて水分を飛ばす（豆腐を炒めて香ばしくするのが「けんちん」の由来。コクが出る）。^精進だし・酒を加えて煮立て、アクを取り、弱めの中火でふたをして15分、里芋がやわらかくなるまで煮る。^薄口しょうゆ・しょうゆ・みりん・塩で調え、長ねぎを加えて1分。|味の決め手は「昆布＋干ししいたけの精進だし」と「豆腐をごま油で炒める」こと。^具をしっかり炒めると、肉なしでも満足感のある深い味に。
あさりの味噌汁|あさり:300g,小ねぎ:適量,三つ葉:適量|水:500ml,昆布:1枚,酒:大さじ1,味噌:大さじ1.5,白味噌:小さじ1|あさりは3%の塩水（水500mlに塩大さじ1）に浸して暗いところで1時間砂抜きし、真水に10分つけて塩抜きする（塩抜きしないとしょっぱくなる）。殻をこすり合わせて洗う。^鍋に水・昆布・あさりを入れて中火にかける（水から入れると、あさりのうまみがじっくり出る。昆布で、あさりのうまみがさらに引き立つ）。^沸騰直前に昆布を取り出し、アクを丁寧にすくう。酒を加える。^あさりの口が開いたら弱火にし（開いてから長く煮ると身が硬くなる）、味噌・白味噌を溶き入れる（あさりの塩気があるので、味噌は控えめに）。^煮えばなで火を止め、器に盛り、小ねぎ・三つ葉を散らす。|味の決め手は「水から煮る」「昆布を一緒に」「開いたらすぐ弱火」。^だしはいらない。あさりと昆布だけで、極上のだしになる。
ミネストローネ|ベーコン:80g,玉ねぎ:1/2個,にんじん:1/2本,セロリ:1/2本,じゃがいも:1個,キャベツ:2枚,ズッキーニ:1/2本,ミックスビーンズ:50g,マカロニ:20g|オリーブオイル:大さじ2,にんにく:1片,白ワイン:大さじ2,トマト缶:1/2缶,トマトペースト:大さじ1,水:600ml,コンソメ:小さじ2,ローリエ:1枚,砂糖:小さじ1/2,塩:少々,黒こしょう:少々,粉チーズ:大さじ2,パセリ:少々|野菜はすべて1cm角に切りそろえる（大きさを揃えると火の通りが均一で、スプーンで食べやすい）。ベーコンも1cm角。にんにくはみじん切り。^鍋にオリーブオイル・にんにく・ベーコンを入れて弱めの中火で3分、ベーコンの脂が出てカリッとするまで炒める。^玉ねぎ・にんじん・セロリを加え、中火で8分、甘い香りがして少し色づくまでじっくり炒める（ソフリット。スープの甘みとコクの土台。ここを急がないこと）。^じゃがいも・キャベツ・ズッキーニを加えて2分炒め、白ワインを加えて30秒。トマト缶・トマトペーストを加えて3分、酸味を飛ばすように炒め煮にする。^水・コンソメ・ローリエ・砂糖・ミックスビーンズを加えて煮立て、アクを取って弱火で20分煮る。マカロニを加えて表示時間通り煮る。^塩・黒こしょうで調える。器に盛り、粉チーズ・パセリ・オリーブオイルをかける。|味の決め手は「香味野菜を8分じっくり炒める」ことと「トマトペースト」。^粉チーズとオリーブオイルを最後にかけると、ぐっとイタリアの味に。
コーンスープ|コーンクリーム缶:1缶,ホールコーン缶:50g,玉ねぎ:1/2個|バター:20g,薄力粉:大さじ1,牛乳:300ml,生クリーム:50ml,コンソメ:小さじ1,砂糖:小さじ1/2,塩:少々,白こしょう:少々,パセリ:少々|玉ねぎは薄切りにする。^鍋にバターを弱めの中火で溶かし、玉ねぎを6分、色づけずに透き通ってとろりとするまでじっくり炒める（玉ねぎの甘みがコーンの甘みを引き立てる）。^薄力粉をふり入れて1分炒め（とろみとコクがつく）、コーンクリーム缶・コンソメを加えて混ぜる。^牛乳を少しずつ加えてのばし、弱火で5分温める。ミキサー（ハンドブレンダー）にかけてなめらかにし、ざるでこす（こすと、お店のようなシルキーな口当たりに）。^鍋に戻して生クリーム・砂糖・塩・白こしょうで調え、弱火で温める（沸騰させない）。ホールコーンを加える。^器に盛り、パセリやクルトンを散らす。冷やしてもおいしい。|味の決め手は「玉ねぎをじっくり炒める」ことと「ミキサー＋こす」こと。^生クリームを少し入れると、ホテルのような濃厚なコーンポタージュに。
クラムチャウダー|あさり:400g,ベーコン:60g,玉ねぎ:1/2個,じゃがいも:2個,にんじん:1/3本,セロリ:1/4本|白ワイン:50ml,バター:25g,薄力粉:大さじ3,水:200ml,牛乳:400ml,生クリーム:50ml,コンソメ:小さじ1,ローリエ:1枚,塩:少々,白こしょう:少々,パセリ:少々,クラッカー:適量|あさりは砂抜きする。鍋にあさりと白ワインを入れてふたをし、中火で3分蒸す。口が開いたら身を殻から外し、蒸し汁はペーパーでこして取っておく（このあさりのエキスがチャウダーの主役）。^ベーコン・玉ねぎ・じゃがいも・にんじん・セロリは1cm角に切る。^鍋にバターとベーコンを入れて中火で2分、玉ねぎ・にんじん・セロリを加えて4分、しんなりするまで炒める。じゃがいもを加えて1分。^弱火にして薄力粉をふり入れ、2分炒めて粉っぽさをなくす。水とあさりの蒸し汁を少しずつ加えて混ぜ、コンソメ・ローリエを加えてふたをし、10分煮る。^牛乳を加えて弱火で5分、とろりとするまで温め（沸騰させない）、生クリームとあさりの身を加えて1分。塩・白こしょうで調える（あさりの塩気があるので塩は最後に）。^器に盛り、パセリと砕いたクラッカーを散らす（ボストンの定番の食べ方）。|味の決め手は「あさりの蒸し汁」。身とエキスを分けて、身は最後に戻すとふっくら。^クラッカーを砕いてのせると、本場の味と食感に。
オニオングラタンスープ|玉ねぎ:3個,フランスパン:4切れ,グリュイエールチーズ:30g,ピザ用チーズ:40g|バター:30g,砂糖:小さじ1/2,白ワイン:50ml,水:600ml,コンソメ:小さじ2,ローリエ:1枚,しょうゆ:小さじ1/2,塩:少々,黒こしょう:少々,にんにく:1片|玉ねぎは繊維に沿ってごく薄切りにする。^鍋にバターを中火で溶かし、玉ねぎと砂糖（砂糖を加えると早く色づく）を入れて5分炒める。しんなりしたら弱めの中火にして30〜40分、ときどき鍋底をこそげながら濃い茶色（あめ色）になるまで炒める（焦げつきそうになったら水大さじ1を加えてこそげる。この繰り返しで深いコクが生まれる。ここが最重要）。^白ワインを加えて強火で1分煮詰め、水・コンソメ・ローリエを加えて煮立て、弱火で15分煮る。しょうゆ（隠し味）・塩・黒こしょうで調える。^フランスパンは2cm厚に切り、トースターでカリッと焼いて、にんにくの断面をこすりつける。^耐熱の器にスープを注ぎ、パンを浮かべて2種のチーズをたっぷりのせる。^230℃のオーブン（またはトースター）で8〜10分、チーズがぐつぐつしてこんがり焦げ目がつくまで焼く。器が熱いので注意。|味の決め手は「玉ねぎを40分かけてあめ色に」すること。時間をかけるほど、甘く深い味に。^しょうゆを数滴入れると、うまみが増す。
かぼちゃのポタージュ|かぼちゃ:300g,玉ねぎ:1/2個|バター:20g,水:250ml,コンソメ:小さじ1,牛乳:250ml,生クリーム:50ml,砂糖:小さじ1/2,塩:少々,白こしょう:少々,シナモン:少々|かぼちゃは種とわたを取って皮をむき（皮を残すと色がくすむ）、薄切りにする（薄く切ると早く煮えて、甘みが出やすい）。玉ねぎは薄切り。^鍋にバターを弱めの中火で溶かし、玉ねぎを5分、色づけずにしんなりするまで炒める。かぼちゃを加えて2分、バターを全体に絡める（炒めることで甘みとコクが増す）。^水・コンソメを加えてふたをし、弱めの中火で12分、かぼちゃが崩れるほどやわらかくなるまで煮る。^粗熱を取ってミキサーで1分、なめらかになるまで攪拌する。ざるでこすと、さらにシルキーに。^鍋に戻し、牛乳と生クリームを少しずつ加えながら弱火で温め、砂糖・塩・白こしょうで調える（沸騰させない）。^器に盛り、生クリームを少したらし、シナモンをほんの少しふる（シナモンでかぼちゃの甘みが引き立つ）。|味の決め手は「かぼちゃをバターで炒める」ことと「こす」こと。^シナモンをひとふり。ホテルの味に変わる。
じゃがいものポタージュ|じゃがいも:3個,玉ねぎ:1/2個,長ねぎ:1/2本|バター:20g,水:300ml,コンソメ:小さじ1,ローリエ:1枚,牛乳:250ml,生クリーム:80ml,塩:小さじ1/4,白こしょう:少々,パセリ:少々|じゃがいも（男爵）は皮をむいて薄切りにし、水に5分さらす。玉ねぎ・長ねぎ（白い部分）は薄切り。^鍋にバターを弱めの中火で溶かし、玉ねぎと長ねぎを6分、色づけずにしんなり甘くなるまで炒める（長ねぎを入れると、フランスのヴィシソワーズの上品な甘みに）。じゃがいもを加えて1分炒める。^水・コンソメ・ローリエを加え、ふたをして弱めの中火で15分、じゃがいもが崩れるまで煮る。ローリエを取り出す。^粗熱を取ってミキサーで1分攪拌する（じゃがいもは攪拌しすぎると粘るので1分まで）。ざるでこす。^鍋に戻し、牛乳・生クリームを加えて弱火で温め、塩・白こしょうで調える。^器に盛り、パセリを散らす。冷やせばヴィシソワーズに（冷やすと味が薄く感じるので、塩を少し強めに）。|味の決め手は「長ねぎを加える」ことと「生クリーム」。上品なビストロの味に。^冷製にするなら塩を少し強めに。
中華コーンスープ|コーンクリーム缶:1缶,卵:2個,長ねぎ:1/4本,かに風味かまぼこ:4本|水:400ml,鶏がらスープの素:小さじ2,酒:大さじ1,しょうゆ:小さじ1/2,塩:少々,白こしょう:少々,片栗粉:小さじ2,ごま油:小さじ1|長ねぎはみじん切り、かにかまはほぐす。^鍋に水・鶏がらスープの素・酒を入れて中火で煮立て、コーンクリーム缶・かにかまを加えて混ぜ、2分煮る。しょうゆ・塩・白こしょうで調える。^水溶き片栗粉（片栗粉＋水小さじ4）を回し入れ、混ぜながら30秒、とろみをつける（とろみが先だと卵がふわっと浮く）。^再び沸騰させ、溶き卵を菜箸に伝わせながら細く回し入れる。10秒触らず、卵がふわっと浮いたら大きくひと混ぜして火を止める（卵を入れてすぐ混ぜると、細かく濁る）。^長ねぎを加え、ごま油をたらす。|味の決め手は「とろみをつけてから、卵を細く回し入れる」こと。ふわふわのかき玉に。^ごま油ひとたらしで、中華料理店の香りに。
酸辣湯|絹ごし豆腐:1/2丁,干ししいたけ:3個,たけのこ(水煮):60g,豚こま切れ肉:60g,卵:2個,にら:3本,きくらげ:3g|酒:小さじ1,片栗粉:小さじ1,水:500ml,鶏がらスープの素:小さじ2,しょうゆ:大さじ1.5,オイスターソース:小さじ1,砂糖:小さじ1/2,片栗粉:大さじ1.5,黒酢:大さじ2,酢:大さじ1,白こしょう:小さじ1/2,ラー油:小さじ2,ごま油:小さじ1|干ししいたけは水でもどして細切り（もどし汁は水の一部に使う）。きくらげももどして細切り。豚肉は細切りにして酒・片栗粉をもみ込む。たけのこ・豆腐は細切り。にらは2cm長さ。^鍋に水（もどし汁を含む）・鶏がらスープの素を入れて中火で煮立て、豚肉をほぐしながら入れる。アクを取り、しいたけ・きくらげ・たけのこを加えて3分煮る。^豆腐を加え、しょうゆ・オイスターソース・砂糖で調える。^水溶き片栗粉（片栗粉＋水大さじ3）を回し入れ、混ぜながら30秒、しっかりとろみをつける。^溶き卵を細く回し入れ、10秒待ってから大きく混ぜる。にらを加える。^火を止めてから黒酢・酢・白こしょうを加える（酢は加熱すると香りが飛ぶので、必ず火を止めてから。白こしょうはたっぷりが本場の「辣（辛さ）」）。器に盛り、ラー油とごま油をかける。|味の決め手は「黒酢＋米酢は火を止めてから」と「白こしょうたっぷり」。^酸辣湯の辛さは唐辛子ではなく、こしょう。ラー油は香りづけ。
わかめスープ|乾燥わかめ:5g,牛こま切れ肉:60g,長ねぎ:1/4本|ごま油:大さじ1,にんにく:1/2片,水:500ml,鶏がらスープの素:小さじ2,ナンプラー:小さじ1/2,しょうゆ:小さじ1,塩:少々,いりごま:小さじ1|わかめは水に5分つけてもどし、水気を絞ってざく切り。牛肉は細かく切る。長ねぎは斜め薄切り、にんにくはすりおろす。^鍋にごま油を中火で熱し、牛肉とにんにくを1分、色が変わるまで炒める。わかめを加えて2分、しっかり炒める（わかめをごま油で炒めるのが韓国のミヨックの作り方。うまみと香りがまったく違う）。^水・鶏がらスープの素を加えて煮立て、アクを取り、弱めの中火で5分煮る（牛肉からだしが出る）。^ナンプラー（魚醤。韓国のカナリエキスの代わり。深いうまみ）・しょうゆ・塩で調え、長ねぎを加えて1分。^器に盛り、いりごまをひねりながら加える。|味の決め手は「わかめと牛肉をごま油で炒める」ことと「ナンプラー少々」。韓国の誕生日のスープの味。^わかめは炒めてから煮ると、とろりとうまみが出る。
ワンタンスープ|豚ひき肉:150g,むきえび:4尾,ワンタンの皮:20枚,チンゲン菜:1株,長ねぎ:1/3本,ザーサイ:15g|しょうが:1かけ,しょうゆ:小さじ2,オイスターソース:小さじ1,酒:小さじ1,ごま油:小さじ2,塩:少々,白こしょう:少々,水:700ml,鶏がらスープの素:大さじ1,しょうゆ:小さじ2,酒:大さじ1,塩:少々,ごま油:小さじ1,のり:少々|あん：えびは粗く刻む。ひき肉・えび・すりおろししょうが・しょうゆ・オイスターソース・酒・ごま油・塩・白こしょうを粘りが出るまで練る（えびを加えるとぷりぷりの食感とうまみが加わる）。^ワンタンの皮にあんを小さじ1弱のせ、縁に水をつけて三角に折り、両端を重ねてとめる（あんは少なめが、つるんとした皮を楽しむコツ）。^チンゲン菜は4等分、長ねぎは小口切り、ザーサイは細切り。^鍋に水・鶏がらスープの素・酒を入れて中火で煮立て、しょうゆ・塩で調える。チンゲン菜の軸を1分煮る。^ワンタンを1つずつ入れ、浮いてきてから1分半煮る。チンゲン菜の葉を加えて30秒。^器に盛り、長ねぎ・ザーサイ・ちぎったのりをのせ、ごま油をたらす。|味の決め手は「えび入りのあん」と「ザーサイ」。^のりを加えると、磯の香りでスープの味がぐっと深まる。
