<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C5A43">
<meta name="description" content="料理名・食材・体の目標から探せるレシピアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="万能レシピ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0} body{font:14px/1.5 system-ui,sans-serif}
img{max-width:100%} [hidden]{display:none!important}
</style>
<title>万能レシピ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: header → sticky search bar → home shelves / results grid; phone gets an app-style bottom tab bar */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --sunk:#E8ECE3; --ink:#1B211D; --muted:#525D55; --line:#D3DACD;
  --accent:#2C5A43; --accent-ink:#FFFFFF; --accent-soft:#DAE7DD; --yolk:#DE9F25; --yolk-soft:#F6E7C4; --warn:#B0432C; --warn-soft:#F5DDD6;
  --t-wa:#D6E3D5; --t-yo:#F1DCCE; --t-chu:#EFD5BE; --t-kan:#EECFCD; --t-eth:#DDE6C6;
  --plate:#FDFDFB; --rim:#E1E5DC; --dishink:#24302A;
  --shadow:0 1px 2px rgba(30,40,32,.06),0 6px 18px rgba(30,40,32,.08);
  --f-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:14px; --nav-h:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A1F1B; --sunk:#232924; --ink:#E8EDE7; --muted:#A3AEA5; --line:#2E3530;
  --accent:#88C9A4; --accent-ink:#0E1912; --accent-soft:#213328; --yolk:#E8B54A; --yolk-soft:#3A3120; --warn:#EC927A; --warn-soft:#3B2620;
  --t-wa:#24332A; --t-yo:#382B24; --t-chu:#392D21; --t-kan:#382526; --t-eth:#2D3322;
  --plate:#2A302B; --rim:#3A423C; --dishink:#ECF0EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A1F1B; --sunk:#232924; --ink:#E8EDE7; --muted:#A3AEA5; --line:#2E3530;
  --accent:#88C9A4; --accent-ink:#0E1912; --accent-soft:#213328; --yolk:#E8B54A; --yolk-soft:#3A3120; --warn:#EC927A; --warn-soft:#3B2620;
  --t-wa:#24332A; --t-yo:#382B24; --t-chu:#392D21; --t-kan:#382526; --t-eth:#2D3322;
  --plate:#2A302B; --rim:#3A423C; --dishink:#ECF0EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:clip;max-width:100vw;-webkit-tap-highlight-color:transparent}
button,a,select,input,label{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));min-width:0}
.linkish{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:inherit;text-decoration:underline}

/* header + nav */
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font-family:var(--f-display);font-size:1.2rem;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,var(--yolk) 0 34%,var(--plate) 36% 100%);box-shadow:inset 0 0 0 2px var(--rim);display:inline-block}
.nav{margin-left:auto;display:flex;gap:4px}
.nav button{border:0;background:none;padding:7px 13px;border-radius:999px;color:var(--muted);font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:6px;position:relative}
.nav button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .badge{min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:.68rem;line-height:18px;text-align:center;padding:0 5px;font-variant-numeric:tabular-nums}
.nav .badge:empty{display:none}
@media (max-width:719px){
  :root{--nav-h:64px}
  .nav{position:fixed;left:0;right:0;width:100%;bottom:0;z-index:40;margin:0;gap:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px;border-radius:12px}
  .nav button svg{width:23px;height:23px}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .nav .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
}

/* hero + search */
.hero{padding-block:8px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.3;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:.95rem}
.hero p b{font-variant-numeric:tabular-nums;color:var(--ink)}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.searchbar.stuck{border-bottom-color:var(--line)}
.searchbar .wrap{padding-block:10px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.search{min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:5px 5px 5px 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;width:21px;height:21px;stroke:var(--muted)}
.search input{flex:1;min-width:0;width:100%;border:0;background:none;padding:10px 4px;font-size:1.02rem;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:var(--sunk);color:var(--muted);width:30px;height:30px;border-radius:50%;padding:0;font-size:1rem;line-height:1;flex:none}
.search .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 18px;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sel{padding:0 4px 0 10px;display:flex;align-items:center}
.chip select{border:0;background:none;font-weight:700;padding:6px 4px;font-size:.88rem}
.ideas{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.ideas:empty{display:none}
.idea{border:1px dashed var(--muted);background:none;border-radius:999px;padding:5px 13px;font-size:.88rem;color:var(--ink)}
.idea:hover{background:var(--surface)}

/* sections */
section.block{padding-block:20px 8px}
.bh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
.bh h2{font-size:1.2rem;margin:0;font-weight:700;text-wrap:balance}
.bh .note{color:var(--muted);font-size:.85rem}
.bh .more{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:700;font-size:.9rem;white-space:nowrap;padding:4px 0}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(172px,206px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;scrollbar-width:thin}
.shelf>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
@media (max-width:400px){ .grid{grid-template-columns:1fr 1fr;gap:10px} }

/* featured */
.feat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.feat .plate{aspect-ratio:auto;min-height:260px}
.feat .body{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:.8rem;letter-spacing:.1em;color:var(--accent);font-weight:700}
.feat h3{margin:0;font-size:1.4rem;line-height:1.4;text-wrap:balance}
.why{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.why li{display:flex;gap:9px;font-size:.93rem;color:var(--ink)}
.why li::before{content:"";flex:none;width:8px;height:8px;margin-top:.62em;border-radius:50%;background:var(--yolk)}
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px 22px;font-variant-numeric:tabular-nums}
.facts div{display:grid}
.facts span{color:var(--muted);font-size:.78rem}
.facts b{font-size:1.15rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:700;font-size:.93rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:.85rem;border-radius:10px}
@media (max-width:640px){ .feat{grid-template-columns:1fr} .feat .plate{min-height:200px} .feat .body{padding:18px} .facts{grid-template-columns:repeat(2,auto)} }

/* menu set */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 16px 16px;box-shadow:var(--shadow)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.mrow .role{font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.mrow .nm{font-weight:700;line-height:1.45;min-width:0}
.mrow .kc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.mtotal{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.88rem;font-variant-numeric:tabular-nums}
.mtotal b{font-size:1.05rem}
.mtotal .btn{margin-left:auto}

/* card */
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;transition:transform .15s ease,box-shadow .15s ease;min-width:0;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{margin:0;font-size:1rem;line-height:1.45;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:2px 10px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:700}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:.75rem;line-height:1.5;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--ink);font-weight:500;white-space:nowrap}
.tag.season{background:var(--yolk-soft)}
.tag.good{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.classic{background:var(--ink);color:var(--bg)}

/* plate visual */
.plate{position:relative;aspect-ratio:4/3;display:grid;place-items:center;container-type:inline-size;max-width:100%}
.pl-wa{background:var(--t-wa)} .pl-yo{background:var(--t-yo)} .pl-chu{background:var(--t-chu)} .pl-kan{background:var(--t-kan)} .pl-eth{background:var(--t-eth)}
.dish{position:relative;width:60%;max-width:210px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;gap:2px;
  background:radial-gradient(circle,var(--plate) 0 60%,var(--rim) 61% 64%,var(--plate) 65% 100%);box-shadow:0 8px 18px rgba(20,30,22,.15);color:var(--dishink)}
.dish::before,.dish::after{content:"";position:absolute;border-radius:50%;background:var(--g);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dish::before{width:17%;height:17%;right:9%;bottom:12%}
.dish::after{width:11%;height:11%;right:25%;bottom:5%}
.dish b{font-family:var(--f-display);font-weight:400;line-height:1;font-size:clamp(1.6rem,21cqw,4.6rem)}
.dish b.w2{font-size:clamp(1.2rem,14cqw,3.2rem)}
.dish i{font-style:normal;font-size:clamp(.66rem,5.6cqw,1.05rem);font-weight:700;color:var(--muted);letter-spacing:.04em}
.mtag{position:absolute;left:10px;top:10px;font-size:.75rem;font-weight:700;background:var(--surface);color:var(--ink);padding:2px 9px;border-radius:999px}
.fav{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;padding:0}
.fav svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}
.fav[aria-pressed="true"] svg{fill:var(--warn);stroke:var(--warn)}

/* results */
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.rhead h2{margin:0;font-size:1.2rem;min-width:0;overflow-wrap:anywhere}
.rhead .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.rhead select{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:.9rem}
.parsed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.parsed .pc{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 9px;font-weight:700}
.parsed .pc.neg{background:var(--warn-soft);color:var(--warn)}
.parsed > span:not(.pc){flex-basis:auto}
.loadmore{display:flex;margin:22px auto 0;min-width:220px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:1.08rem}
.empty p{margin:0 auto 14px;max-width:40ch}

.season{display:flex;gap:8px;flex-wrap:wrap}
.sea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 13px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.sea i{width:12px;height:12px;border-radius:50%;background:var(--g,var(--yolk));box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);display:inline-block}

/* settings + shopping */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-size:1.02rem}
.panel p{margin:0;color:var(--muted);font-size:.88rem;max-width:65ch}
.panel .group{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:500}
.tog[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700;text-decoration:line-through}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.howto div{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem}
.howto b{display:block;margin-bottom:4px}
.stack{display:grid;gap:14px}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.shop li:last-child{border-bottom:0}
.shop label{display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer}
.shop input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.shop .q{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.shop li.done span.n{text-decoration:line-through;color:var(--muted)}
.shophead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shophead h3{flex:1;min-width:0}
.shophead h3 button{border:0;background:none;padding:0;font-weight:700;text-align:left;color:var(--ink);font-size:inherit}
.rm{border:0;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px}

footer{padding-block:36px 28px;color:var(--muted);font-size:.82rem;line-height:1.75}
footer p{max-width:65ch;margin:0}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.52);z-index:60;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){ .scrim{align-items:center;padding:24px} }
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;max-height:94dvh;overflow-y:auto;border-radius:20px 20px 0 0;position:relative;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){ .sheet{border-radius:20px} }
.sheet .plate{aspect-ratio:auto;height:200px}
.sheet .x{position:absolute;left:12px;top:12px;height:38px;border-radius:999px;border:0;background:var(--surface);font-size:.9rem;font-weight:700;padding:0 14px 0 10px;z-index:2;display:flex;align-items:center;gap:4px}
.sheet .mtag{display:none}
.sbody{padding:18px 20px 28px;display:grid;gap:24px}
.sbody h2{margin:0;font-size:1.45rem;line-height:1.4;text-wrap:balance}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px}
.kv b{color:var(--ink);font-size:1.05rem}
.sbody h3{margin:0 0 10px;font-size:1.08rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbody h3 .aside{margin-left:auto;display:flex;gap:6px;align-items:center}
.nut{display:grid;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.nr{display:grid;grid-template-columns:5.6em 1fr 7.4em;gap:10px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.nr .bar{height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}
.nr .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.nr .bar i.over{background:var(--warn)}
.nr span:last-child{text-align:right;color:var(--muted)}
.nr span:last-child b{color:var(--ink)}
.nut small{color:var(--muted);font-size:.8rem}
.serv{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:500}
.serv button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);padding:0;font-size:1.05rem}
.serv output{min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.ing{list-style:none;margin:0 0 12px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.97rem}
.ing li:last-child{border-bottom:0}
.ing li span:last-child{color:var(--ink);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ing.chk li:not(.h){cursor:pointer;position:relative;padding-left:40px}

しらす丼|大葉は重ねて丸め、極細のせん切りにして冷水に1分さらし、水気をしっかり絞る（香りが立ち、色が変わりにくい）。小ねぎは小口切りにする。^温かいご飯を丼に盛り、大葉を散らす。^しらすをふんわりとたっぷりのせ、小ねぎを散らす。^しょうゆとごま油を混ぜて回しかける。好みで卵黄を落としても。
三色そぼろ丼|鶏そぼろ：鍋に火をつける前に、ひき肉・しょうゆ・砂糖大さじ1.5・酒・おろししょうがを入れて、菜箸4本でよく混ぜる（冷たいうちに混ぜるのがパラパラにする秘訣）。^中火にかけ、菜箸4本で絶えずかき混ぜながら4〜5分、汁気がほぼなくなり、ポロポロになるまで炒りつける。^炒り卵：小鍋に卵・砂糖小さじ1・塩を入れてよく混ぜてから弱めの中火にかけ、菜箸4本で絶えず混ぜる。底が固まり始めたら火から外して混ぜ、戻してを繰り返し、2分ほどで細かいそぼろ状にする。^いんげんは塩少々を入れた熱湯で2分ゆで、冷水にとって水気をふき、斜め薄切りにする。^丼にご飯を盛り、鶏そぼろ・炒り卵・いんげんを3等分にのせる。
ビビンバ|牛肉は細切りにし、しょうゆ・砂糖・おろしにんにく半量をもみ込んで10分おく。^ナムル：鍋にたっぷりの湯を沸かし、塩少々を入れる。もやしを2分ゆでてざるに上げる。続けてせん切りのにんじんを1分、ほうれん草を40秒ゆで、冷水にとって水気を固く絞り4cm長さに切る。^ゆでた野菜は熱いうちにそれぞれボウルに入れ、ごま油（各小さじ1）・塩（各少々）・残りのにんにく・ごまで和える（熱いうちだと味がよくしみる）。^フライパンに残りのごま油を中火で熱し、牛肉を広げて2分、汁気がなくなるまで炒める。^同じフライパンで目玉焼きを作る。卵を割り入れ、中火で1分半、白身のふちがカリッとし、黄身は半熟のうちに火を止める。^丼にご飯を盛り、ナムルと牛肉を放射状にのせ、中央に目玉焼きをのせる。コチュジャンを添え、全体をよく混ぜて食べる。
ガパオライス|にんにくはみじん切り、唐辛子は種を除いて輪切り、パプリカと玉ねぎは1cm角に切る。ナンプラー・オイスターソース・砂糖を混ぜておく。^目玉焼きを先に作る。フライパンにサラダ油大さじ1/2を中火で熱し、卵を割り入れて2分。白身のふちがチリチリとカリッとし、黄身が半熟になったら取り出す（タイ風は多めの油で揚げ焼きにする）。^同じフライパンに残りの油・にんにく・唐辛子を入れて弱火で1分、香りを出す。^強火にしてひき肉を広げ入れ、1分触らずに焼きつけてからほぐし、2分炒めてポロポロにする。^玉ねぎとパプリカを加えて1分炒め、合わせ調味料を加えて汁気がなくなるまで1分炒める。^火を止めてバジルの葉をちぎって加え、さっと混ぜる（余熱で香りが立つ）。ご飯に盛り、目玉焼きをのせる。
ロコモコ|玉ねぎはみじん切りにし、半量を耐熱皿に入れてラップをし、レンジ600Wで1分加熱して冷ます。パン粉は牛乳でしとらせる。^冷たいボウルにひき肉と塩を入れ、手早く1分、白っぽく粘りが出るまで練る。卵1個・パン粉・加熱した玉ねぎを加えてさらに練り、2等分して厚さ2cmの小判形にし、手のひらで空気を抜いて中央を少しくぼませる。^フライパンにサラダ油を中火で熱し、ハンバーグを入れて2分、焼き色がつくまで焼く。返して水大さじ2を入れ、ふたをして弱火で6〜7分蒸し焼きにする。竹串を刺して透明な肉汁が出れば焼き上がり。取り出す。^残った肉汁にケチャップ・ソース・水大さじ3・残りの玉ねぎを加え、中火で1〜2分、とろりとするまで煮詰めてソースにする。^フライパンをふいて目玉焼きを2つ作る（中火で2分、黄身は半熟）。^ご飯にちぎったレタス、ハンバーグ、目玉焼きの順にのせ、ソースをかけてミニトマトを添える。
オムライス|鶏肉は1cm角、玉ねぎはみじん切りにする。^チキンライス：フライパンにバター10gを中火で溶かし、鶏肉を2分炒め、玉ねぎを加えて2分、透き通るまで炒める。^ケチャップ大さじ3を加え、30秒〜1分、ふつふつと煮立てて水分と酸味を飛ばす（ご飯がべたつかず、甘みが出る）。温かいご飯を加え、ヘラで切るように2分炒め合わせ、塩・こしょうで調える。2等分して取り出す。^卵2個と牛乳大さじ1を混ぜる。直径20cmのフライパンを中火でよく熱してバター5gを溶かし、泡が小さくなったら卵液を一気に流す。^菜箸で大きく10回ほどかき混ぜ、半熟（約30秒）になったら火を弱め、中央にチキンライス半量を細長くのせる。^フライパンの柄を持ち上げて傾け、奥の卵をヘラで手前に折りかぶせ、皿をフライパンの縁に当ててひっくり返すように移す。キッチンペーパーをかぶせて手で形を整え、ケチャップをかける。もう1つも同様に作る。
チャーハン|焼き豚は7mm角、長ねぎはみじん切りにする。卵は溶きほぐす。ご飯は温かいもの（冷やご飯はレンジで温める）を用意する。^フライパン（できれば鉄）を強火で1分半、しっかり熱してから油を入れ、全体になじませる。^溶き卵を流し入れ、ふくらんで縁が固まり始めたら（約10秒）すぐにご飯をのせる。^ヘラでご飯を卵に押しつけるようにほぐし、切るように混ぜながら強火で2分炒める。米粒がばらけて、パラパラと音が軽くなってくるのが目安。^焼き豚と鶏がらスープの素・塩・こしょうを加えて1分炒め、長ねぎを加えてさらに30秒炒める。^最後にしょうゆを鍋肌（フライパンの縁）から回し入れ、焦がして香りを立たせ、全体を10秒あおって火を止める。
キムチチャーハン|キムチは粗く刻み、汁は捨てずに取っておく。豚肉は2cm幅に切る。^フライパンにごま油を中火で熱し、豚肉を2分、脂が出てカリッとするまで炒める。^キムチを加えて2分、汁気がなくなり、少し焦げ目がつくまでしっかり炒める（酸味がまろやかになり、うまみが増す）。^温かいご飯とキムチの汁を加え、ヘラで切るように強火で2分炒める。^しょうゆを鍋肌から回し入れて香りを立たせ、塩で味を調える。^器に盛る。同じフライパンで目玉焼き（中火2分、黄身半熟）を作ってのせ、小ねぎを散らす。
ドリア|鶏肉は1.5cm角、玉ねぎ・マッシュルームは薄切りにする。^温かいご飯にケチャップを混ぜ、バター（分量外5g）を塗った耐熱皿に平らに敷く。^ホワイトソース：フライパンにバターを中火で溶かし、鶏肉を2分炒めて色を変え、玉ねぎを加えて2分、マッシュルームを加えて1分炒める。^弱火にして薄力粉をふり入れ、粉っぽさがなくなるまで1分炒める。^火を止めて冷たい牛乳を1/3ずつ加え、そのつどよく混ぜる。再び中火にかけ、ヘラで底をこするように絶えず混ぜながら3〜4分、ふつふつとして、とろりとするまで煮る。コンソメ・塩・こしょうで調える。^ご飯の上にソースをかけ、チーズを全体に散らす。オーブントースター（1000W）で8〜10分、または220℃に予熱したオーブンで10分、こんがり焼き色がつくまで焼く。
カレー|玉ねぎは半分をくし形切り、半分を薄切りにする。にんじんは小さめの乱切り、じゃがいもは一口大に切って水に5分さらす。肉は一口大に切る。^厚手の鍋にサラダ油を中火で熱し、肉を入れて2分、表面に焼き色をつけて取り出す（うまみを閉じ込める）。^同じ鍋で薄切りの玉ねぎを中火で8〜10分、ときどき混ぜながらきつね色になるまで炒める（コクと甘みの土台になる）。くし形の玉ねぎ・にんじん・じゃがいもを加えて2分炒める。^肉を戻し、水600mlを加えて強火にし、煮立ったらアクを丁寧にすくう。ふたをして弱めの中火で15分、じゃがいもに竹串がすっと通るまで煮る。^いったん火を止め、30秒おいて煮立ちが収まってからルウを割り入れ、完全に溶かす（沸騰中に入れるとダマになる）。^再び弱火にかけ、焦げないように底から混ぜながら5〜10分、とろみがつくまで煮込む。ご飯に盛る。
キーマカレー|玉ねぎ・にんじん・ピーマン・にんにく・しょうがはすべてみじん切り、トマトは1cm角に切る。^フライパンにサラダ油・にんにく・しょうがを入れて弱火で1分、香りを出す。玉ねぎを加えて中火で5〜6分、薄く色づくまで炒める。^ひき肉を加えて強めの中火にし、1分触らず焼きつけてからほぐし、2分、ポロポロになって脂が透明になるまで炒める。^にんじん・ピーマン・カレー粉を加えて1分炒め、スパイスの香りを立たせる。^トマト・水・ケチャップ・ソース・コンソメを加え、ときどき混ぜながら弱めの中火で8〜10分、汁気がほとんどなくなるまで煮詰める。塩で味を調える。^ご飯に盛る。好みで目玉焼きをのせても。
ハヤシライス|玉ねぎは繊維に沿って5mm幅の薄切り、マッシュルームは5mm厚さに切る。^厚手の鍋にバターを中火で溶かし、玉ねぎを8〜10分、ときどき混ぜながらあめ色手前の濃いきつね色になるまで炒める（ここが味の深さを決める）。^牛肉を加えてほぐしながら2分、色が変わるまで炒め、マッシュルームを加えて1分炒める。^水600mlを加えて強火で煮立て、アクをすくう。ふたをして弱めの中火で10分煮る。^火を止めて30秒おき、ルウを割り入れて完全に溶かす。^再び弱火で混ぜながら5分、とろみがつくまで煮る。ご飯にかける。
タコライス|玉ねぎはみじん切り、レタスは5mm幅のせん切りにして冷水に3分さらし、水気をよく切る。トマトは1cm角に切る。^フライパンにサラダ油を中火で熱し、玉ねぎを2分、透き通るまで炒める。^ひき肉を加えて強めの中火で1分焼きつけてからほぐし、2分炒める。出てきた余分な脂はペーパーでふき取る。^カレー粉を加えて30秒炒め、ケチャップ・ソースを加えて1〜2分、汁気がなくなるまで炒め、塩・こしょうで調える。^ご飯を盛り、温かいうちにチーズをのせる（余熱で溶ける）。その上に肉、レタス、トマトの順にのせる。
五目炊き込みご飯|米は研いで、たっぷりの水に30分浸水させ、ざるに上げて10分水気を切る。^鶏肉は1cm角に切り、しょうゆ小さじ1（分量から）をもみ込む。ごぼうはささがきにして水に3分さらす。にんじんは2cm長さの細切り、しいたけは薄切り、油揚げは熱湯をかけて油抜きし、縦半分に切って細切りにする。^炊飯器の内釜に米・しょうゆ・みりん・酒・だしの素を入れ、2合の目盛りまで水を注いで、底から一度だけ混ぜる（調味料を入れてから水を量るのが、水っぽくならないコツ）。^具材を米の上に平らにのせ、混ぜずに普通モードで炊く（混ぜると炊きむらが出る）。^炊き上がったらすぐにふたを開け、しゃもじで底から返すようにさっくり混ぜ、10分蒸らす。
栗ご飯|栗は熱湯に10分ひたして鬼皮をやわらかくし、底のざらざらした部分に包丁を入れて、上に向かって鬼皮をむく。渋皮も包丁でむき、水に10分さらす。大きいものは半分に切る。^米は研いで30分浸水させ、ざるに上げる。^内釜に米・酒・塩を入れ、2合の目盛りまで水を注いで混ぜる。^栗を米の上にのせ、普通モードで炊く。^炊き上がったら10分蒸らし、栗をつぶさないように底からさっくり混ぜる。器に盛り、黒ごまをふる。
きのこご飯|米は研いで30分浸水させ、ざるに上げる。^しめじ・まいたけは石づきを取って食べやすくほぐす。油揚げは油抜きして細切りにする。^フライパンを中火で熱し、油をひかずにきのこを入れて2分、軽く焼き色をつける（水分が飛び、香りが強くなる）。^内釜に米と調味料を入れ、2合の目盛りまで水を注いで混ぜ、きのこと油揚げをのせて普通に炊く。^炊き上がったら底からさっくり混ぜ、10分蒸らす。
さつまいもご飯|米は研いで30分浸水させ、ざるに上げる。^さつまいもはよく洗い、皮つきのまま1.5cm角に切り、水に10分さらしてアクを抜く（色が鮮やかに仕上がる）。^内釜に米・酒・塩を入れ、2合の目盛りまで水を注いで混ぜる。^さつまいもの水気を切って米の上にのせ、普通に炊く。^炊き上がったら10分蒸らし、さつまいもを崩さないようさっくり混ぜて、黒ごまをふる。
鯛めし|鯛は塩少々をふって10分おき、出てきた水分をペーパーでふく（臭み抜き）。^魚焼きグリルを中火で予熱し、鯛を皮目から5〜6分、焼き色がつくまで焼く（中まで火を通さなくてよい）。^米は研いで30分浸水させ、ざるに上げる。しょうがはせん切りにする。^内釜に米・しょうゆ・酒・塩を入れて2合の目盛りまで水を注ぎ、混ぜる。しょうがを散らし、鯛をのせて普通に炊く。^炊き上がったら鯛を取り出して骨と皮を丁寧に除き、身をほぐして戻し、さっくり混ぜて10分蒸らす。
おにぎり|鮭は魚焼きグリルで中火6〜7分焼き、皮と骨を除いて粗くほぐす。梅干しは種を取る。^ご飯は炊きたてを少し冷まし、手で持てる温度にする。^茶碗にラップを敷き、ご飯100gを入れて中央をくぼませ、具を入れて上からご飯を少しかぶせる。^手を水でぬらし、塩をひとつまみ手のひらにのばす。ご飯を取り、片手で山形、もう片方の手で側面を押さえて、回しながら3〜4回、力を入れすぎずにふんわり三角ににぎる。^食べる直前にのりを巻く（パリッとした食感が残る）。
焼きおにぎり|ご飯を4等分し、手に水をつけて、かためにしっかりにぎる（焼くときに崩れないよう、普通のおにぎりより強めに）。^しょうゆとみりんを混ぜてたれを作る。^フライパンにごま油を薄くひいて中火で熱し、おにぎりを並べる。触らずに片面2分ずつ焼き、全面の表面を固める。^表面にたれを刷毛で塗り、各面30秒ずつ焼いて香ばしい焦げ目をつける。^もう一度たれを塗って同様に焼く。2回塗りで、香りの強い焼きおにぎりになる。
いなり寿司|油揚げは上からめん棒を転がしてから半分に切り、切り口から指を入れて袋状に開く（破れにくくなる）。熱湯で2分ゆでて油抜きし、水にとって軽く絞る。^鍋に水150ml・しょうゆ・砂糖大さじ3・みりんを入れて中火で煮立て、油揚げを並べる。落としぶたをして弱めの中火で15分、煮汁が1/4ほどになるまで煮る。^火を止めてそのまま冷まし、味を含ませる（できればひと晩おくとさらにおいしい）。^酢・砂糖大さじ1・塩を混ぜてすし酢を作り、炊きたてのご飯に回しかけ、切るように混ぜて人肌まで冷ます。ごまを混ぜ、10等分して軽くにぎる。^油揚げの汁気を軽く絞り、酢飯を詰めて口を折りたたみ、形を整える。
ちらし寿司|にんじんは2cm長さの細切り、しいたけは薄切りにする。鍋に水100ml・しょうゆ・砂糖大さじ1・みりんと共に入れ、中火で8分、汁気がほぼなくなるまで煮る。^えびは背わたを取り、塩少々を入れた熱湯で1分半ゆでて殻をむく。いんげんは2分ゆでて斜め切りにする。^錦糸卵：卵に砂糖・塩各少々を混ぜてこす。フライパンに薄く油をひいて弱めの中火で熱し、卵液を薄く流して1分、表面が乾いたら裏返して10秒焼く。3〜4枚焼き、重ねて細切りにする。^酢・砂糖・塩を混ぜたすし酢を炊きたてのご飯に回しかけ、切るように混ぜながら、うちわで冷ます。煮た具を汁気を切って混ぜる。^器に盛り、錦糸卵を全体に散らし、えび・いんげん・刻みのりを彩りよく飾る。
手巻き寿司|すし酢（酢・砂糖・塩）を炊きたてのご飯に回しかけ、切るように混ぜて、うちわで人肌まで冷ます。^卵焼きを作る。卵に砂糖少々を混ぜ、卵焼き器で3回に分けて巻き、1cm角の棒状に切る。^まぐろ・サーモンは1cm角の棒状に、きゅうりは縦8等分の棒状に切る。かにかまはそのまま。^のりは半分に切り（約10×19cm）、さっとあぶってパリッとさせる。^具を大皿に並べ、各自でのりの左半分に酢飯を大さじ2ほど広げ、具をのせて円すい形に巻く。しょうゆをつけて食べる。
雑炊|鶏肉は1cm角、しいたけは薄切りにする。^ご飯はざるに入れて水でさっと洗い、ぬめりを落とす（さらっとした仕上がりになる）。^鍋にだしを入れて中火で煮立て、鶏肉としいたけを入れて3分煮る。アクをすくう。^しょうゆ・塩で味を調え、ご飯を加えて弱めの中火で3分、米がふっくらするまで煮る。^溶き卵を細く回し入れ、5秒待ってから火を止め、ふたをして1分蒸らす（卵がふんわり半熟に固まる）。小ねぎを散らす。
鮭茶漬け|鮭は魚焼きグリルで中火6〜7分、皮がパリッとするまで焼き、皮と骨を除いて大きめにほぐす。^小鍋に湯400ml・だしの素・しょうゆ・塩を入れて中火で煮立て、熱々のだしを作る。^茶碗にご飯を盛り、鮭・刻みのり・三つ葉をのせる。^熱いだしを縁から静かに注ぎ、わさびを添える。
きのこリゾット|鍋に水600mlとコンソメを入れて温め、スープを作り、弱火で保温しておく（冷たいスープを加えると米が煮えムラになる）。^玉ねぎはみじん切り、しめじはほぐし、マッシュルームは薄切りにする。^フライパンにオリーブオイルを中火で熱し、玉ねぎを2分炒める。米を洗わずに加え、2分、米が透き通ってくるまで炒める（洗わないことで、でんぷんがとろみになる）。^温かいスープをお玉1杯加え、混ぜながら煮る。汁気がなくなったら次の1杯を加える。これを繰り返し、途中できのこを加えて、合計16〜18分煮る。^米の中心に少し芯が残る程度（アルデンテ）になったら火を止め、バターと粉チーズを加えて手早く混ぜ、塩・こしょうで調える。お皿に盛ったときに、ゆっくり広がるくらいのゆるさが目安。
パエリア|鶏肉は一口大に切って塩少々をふる。玉ねぎ・にんにくはみじん切り、パプリカは1cm幅に、トマトは1cm角に切る。水400mlにコンソメ・カレー粉・塩を溶かす。^直径26cmのフライパンにオリーブオイルを中火で熱し、鶏肉を皮目から3分焼いて焼き色をつけ、取り出す。シーフードも1分炒めて取り出す。^同じフライパンでにんにく・玉ねぎを2分炒め、トマトを加えて2分、くずれるまで炒める。米を洗わずに加え、2分炒めて油をなじませる。^スープを注いで全体を平らにならし、鶏肉・シーフード・パプリカを並べる。煮立ったらここからは混ぜない。^ふた（なければアルミホイル）をして弱火で15分炊く。^ふたを取って強火にし、30秒〜1分、パチパチと音がしたら火を止める（底においしいおこげができる）。ふたをして10分蒸らし、レモンを添える。
ナシゴレン|鶏肉は1cm角に、玉ねぎ・にんにくはみじん切りにする。えびは背わたを取る。ケチャップ・オイスターソース・ナンプラー・豆板醤を合わせる。^目玉焼きを作る。多めの油を中火で熱し、卵を割り入れて2分、白身のふちがカリッとするまで揚げ焼きにして取り出す。^同じフライパンを強火で熱し、にんにく・玉ねぎを1分炒め、鶏肉とえびを加えて2分、火が通るまで炒める。^温かいご飯を加え、ヘラでほぐしながら2分炒める。^合わせ調味料を鍋肌から回し入れ、さらに1分、全体が色づいてパラッとするまで炒める。^器に盛り、目玉焼きをのせ、輪切りのきゅうりとトマトを添える。
カオマンガイ|米は研いでざるに上げる（浸水はしない。鶏の脂と水分で炊くので、少しかために炊ける）。鶏肉は余分な脂を取り、厚い部分に切り込みを入れて均一の厚さにする。^内釜に米・鶏がらスープの素・酒・塩を入れ、2合の目盛りまで水を注いで混ぜる。^鶏肉を皮目を上にしてのせ、しょうがの薄切りを散らし、普通モードで炊く。^たれ：しょうゆ・酢・砂糖・ナンプラー・おろしにんにく、あればみじん切りのしょうが少々を混ぜる。^炊き上がったら鶏肉を取り出して5分休ませ、1.5cm幅に切る（休ませると肉汁が落ち着く）。ご飯をさっくり混ぜる。^皿にご飯を盛り、鶏肉をのせ、斜め切りのきゅうりとパクチーを添えて、たれをかける。
ルーロー飯|卵は沸騰した湯で8分ゆでて冷水にとり、殻をむく。^豚肉は1cm幅の細切り、しいたけは1cm角、にんにく・しょうがはみじん切りにする。^鍋を中火で熱し、油をひかずに豚肉を入れて5分、脂がたっぷり出てカリッとするまで炒める。出た脂はお玉1杯分だけ残してペーパーで取り除く。^にんにく・しょうが・しいたけを加えて1分炒め、水200ml・しょうゆ・砂糖・酒・オイスターソースとゆで卵を加える。^煮立ったらふたをして弱火で30分煮る。ふたを取って中火にし、5分、煮汁がとろりとするまで煮詰める（卵は途中で転がして色をつける）。^チンゲン菜は塩を入れた熱湯で1分ゆでる。ご飯に肉を煮汁ごとかけ、半分に切った卵とチンゲン菜を添える。
キンパ|温かいご飯にごま油大さじ1/2・塩少々・ごまを混ぜて冷ます。^ほうれん草は40秒ゆでて冷水にとり、固く絞ってごま油・塩各少々で和える。にんじんはせん切りにし、ごま油少々で1分炒めて塩をふる。^卵は溶いて塩少々を混ぜ、卵焼き器で厚焼きにし、1cm幅の棒状に切る。^巻きすにのりを置き（ざらざらした面を上）、奥を3cm残してご飯を薄く均一に広げる。^手前に具をまとめて並べ、親指で巻きすを持ち上げて、具を押さえながら一気に巻く。巻き終わりを下にして5分なじませる。^表面にごま油を薄く塗り、包丁をぬらしながら1.5cm幅に切る（一切りごとに包丁をふくと断面がきれい）。
グリーンカレー|鶏肉は一口大、なすは乱切り、パプリカは1cm幅に切る。たけのこは薄切りにする。^鍋にサラダ油とグリーンカレーペーストを入れて弱めの中火で1〜2分、焦がさないように炒め、香りを立たせる（ここで香りを出すのが本場の味の決め手）。^ココナッツミルク100mlを加えて1分煮て、油が分離して表面に浮いてきたら、鶏肉を加えて2分炒め煮にする。^残りのココナッツミルクとなす・たけのこを加え、弱めの中火で8分煮る（強火で沸騰させるとココナッツミルクが分離する）。^パプリカを加えて2分煮て、ナンプラー・砂糖で味を調える。^火を止めてバジルの葉をちぎって加え、ご飯に添える。
バターチキンカレー|鶏肉は一口大に切り、ヨーグルト・カレー粉大さじ1/2・塩少々をもみ込み、冷蔵庫で30分以上（できればひと晩）漬ける。^玉ねぎ・にんにく・しょうがはみじん切りにする。^鍋にバター半量を中火で溶かし、玉ねぎを5分、きつね色になるまで炒め、にんにく・しょうがを加えて1分炒める。残りのカレー粉を加えて30秒炒める。^トマト缶を加えて、木べらでつぶしながら5分、水分が飛んでぽってりするまで煮詰める。^鶏肉を漬けだれごと加え、ふたをして弱めの中火で10分煮る。^生クリーム・砂糖・塩・残りのバターを加え、弱火で2分、沸騰させないように温めて仕上げる。ご飯かナンを添える。
ちらしずし風サーモン丼|サーモン・アボカドは1.5cm角に切る。アボカドは切ったらすぐ調味料と合わせる（変色防止）。^みりんはレンジで20秒加熱してアルコールを飛ばし、しょうゆ・ごま油・わさびと混ぜる。^サーモンとアボカドを加えてさっと和え、冷蔵庫で5分なじませる。^温かいご飯（好みで酢飯にしても）を丼に盛り、大葉を敷く。^具をのせ、ごまをふる。
きつねうどん|油揚げはめん棒を転がしてから半分に切り、熱湯で2分ゆでて油抜きし、水けを軽く絞る。^小鍋に水100ml・しょうゆ・砂糖・みりん大さじ1を入れて中火で煮立て、油揚げを入れる。落としぶたをして弱火で10分、煮汁がほとんどなくなるまで煮含める。そのまま冷ますとさらに味がしみる。^別の鍋にだし700mlを温め、薄口しょうゆ・みりん大さじ1・塩で味を調える。^うどんはたっぷりの熱湯で1分温め、湯を切って丼に入れる。^熱いつゆを注ぎ、甘く煮た油揚げと小口切りの小ねぎをのせる。
肉うどん|長ねぎは斜め切りにする。牛肉は5cm幅に切る。^鍋にだし・しょうゆ・みりん・砂糖を入れて中火で煮立て、牛肉を1枚ずつ広げて入れる。^菜箸でほぐしながら2分煮て、アクをすくう。^長ねぎを加えて1分煮る。^うどんはたっぷりの熱湯で1分温めて湯を切り、丼に入れる。肉とつゆをたっぷりかける。好みで七味をふる。
焼きうどん|ゆでうどんは袋の端を少し切り、袋のままレンジ600Wで1分加熱する（ほぐれやすく、炒めても切れにくい）。^キャベツは4cm角、にんじんは短冊切り、玉ねぎは薄切り、豚肉は4cm幅に切る。しょうゆ・みりん・だしの素を合わせる。^フライパンにサラダ油を強めの中火で熱し、豚肉を2分炒め、にんじん・玉ねぎを加えて1分、キャベツを加えて1分炒める。^うどんを加え、菜箸でほぐしながら1分炒める。^合わせ調味料を鍋肌から回し入れ、全体にからむまで1分炒める。少し焼き目がつくと香ばしい。器に盛り、かつお節をたっぷりのせる。
カレーうどん|玉ねぎは薄切り、長ねぎは斜め切り、豚肉は4cm幅に切る。^鍋にだしを入れて中火で煮立て、豚肉と玉ねぎを入れて5分煮る。アクをすくう。^しょうゆ・みりんを加え、火を止めてカレールウを割り入れて完全に溶かす。^再び中火にかけ、片栗粉を水大さじ1で溶いて回し入れ、混ぜながら1分、とろみがつくまで煮る。長ねぎを加えて1分煮る。^うどんを熱湯で1分温めて湯を切り、丼に入れて熱々のカレーつゆをかける。
鍋焼きうどん|鶏肉は一口大、長ねぎは斜め切りにする。えびは背わたを取る。しいたけは軸を取り、かさに飾り切りを入れる。^土鍋（1人用2つ）にだし・しょうゆ・みりん・塩を半量ずつ入れて中火で煮立て、鶏肉を入れて3分煮る。^うどんを加えてほぐし、しいたけ・えびを周りに並べて2分煮る。^長ねぎをのせ、中央にくぼみを作って卵を割り入れる。^ふたをして弱めの中火で2分、白身が白くなり黄身が半熟になったら火を止める。土鍋のまま熱々で出す。
ざるそば|大きな鍋にたっぷりの湯（1人前につき1L以上）を沸かす。^そばをパラパラと広げながら入れ、菜箸で軽くほぐす。再び沸騰したら火を少し弱め、ふきこぼれない程度の火加減で表示時間（通常4〜5分）ゆでる。^ざるに上げ、すぐに流水の下で両手でもむようにしてぬめりをしっかり洗い流す（ぬめりが残るとのどごしが悪くなる）。^最後に氷水に入れて10秒締め、ざるに上げて水気をよく切る。^めんつゆを水で割ってつけつゆを作る（3倍濃縮なら1:2〜3）。^そばを盛り、刻みのりをのせ、小口切りの小ねぎ・わさびを薬味に添える。
天ぷらそば|えびは殻と背わたを取り、腹側に斜めに切り込みを入れて伸ばす。尾の先を切り、水分をしごき出す。^めんつゆを水で薄めて（3倍濃縮なら1:6〜7）温めておく。長ねぎは斜め切りにする。^衣：冷水70mlに薄力粉40gを入れ、菜箸で粉が少し残る程度にさっくり混ぜる。^揚げ油を180℃に熱する。えびに衣をつけ、1分半揚げる。衣の泡が小さくなり、カラッとしたら油を切る。^そばはたっぷりの湯で表示時間ゆで、流水でぬめりを洗ってから熱湯にくぐらせて温め、丼に入れる。^熱いつゆを注ぎ、天ぷらと長ねぎをのせる（天ぷらは食べる直前にのせると衣がサクサク）。
冷やし中華|たれ：しょうゆ・酢・砂糖大さじ2・ごま油・水大さじ3を混ぜ、冷蔵庫で冷やしておく。^錦糸卵：卵に砂糖小さじ1・塩少々を混ぜてこす。フライパンに薄く油をひいて弱めの中火で熱し、卵液の1/3を薄く流す。1分ほどで表面が乾いたら返して10秒焼き、取り出す。3枚焼き、冷めたら重ねて細切りにする。^ハム・きゅうりは細切り、トマトは薄いくし形に切る。^麺はたっぷりの熱湯で表示時間ゆで、ざるに上げて流水でもみ洗いし、氷水で締める。水気をしっかり切る（水っぽいとたれが薄まる）。^器に麺を盛り、具を放射状に彩りよくのせ、冷たいたれをかける。好みでからしを添える。
醤油ラーメン|卵は冷蔵庫から出してすぐ沸騰した湯に入れ、6分半ゆでて氷水にとり、殻をむいて半分に切る（とろとろの半熟卵）。長ねぎは小口切りにする。^鍋に水700mlを入れて沸かし、鶏がらスープの素・しょうゆ・酒を加えて弱火で保温する。最後にごま油・こしょうを加える。^どんぶりに熱湯を入れて温めておく（スープが冷めない）。^別の大鍋でたっぷりの湯を沸かし、麺をほぐしながら入れて表示時間ゆでる。最後の30秒でもやしも加える。^どんぶりの湯を捨ててスープを注ぎ、麺の湯をしっかり切って入れ、箸で麺を整える。^焼き豚・卵・もやし・長ねぎ・のりをのせる。
味噌ラーメン|にんにく・しょうがはすりおろす。キャベツはざく切りにする。^鍋にごま油を中火で熱し、にんにく・しょうが・ひき肉を入れて2分、ポロポロになるまで炒める。^強火にしてもやしとキャベツを加え、1分半、野菜がしんなりしつつシャキッと感が残るまで炒める（強火で炒めると香ばしさがスープに移る）。^水700mlと鶏がらスープの素を加えて煮立て、火を弱めて味噌・しょうゆを溶き入れる。味噌を入れたら沸騰させない。^麺をたっぷりの湯で表示時間ゆでて湯を切り、温めたどんぶりに入れる。^スープと具を注ぎ、コーン・バターをのせる。
担々麺|肉みそ：フライパンにごま油を中火で熱し、ひき肉を2分、ポロポロになって脂が透明になるまで炒める。甜麺醤・豆板醤を加えて1分炒め、香りを立たせる。^チンゲン菜は縦に4〜6等分し、塩少々を入れた熱湯で1分ゆでる。^どんぶりに練りごま・しょうゆ・酢を入れ、よく混ぜておく（ここで混ぜておくとスープが分離しない）。^鍋に水500mlと鶏がらスープの素を入れて煮立て、豆乳を加えて弱火で温める（豆乳は沸騰させると分離するので、ふつふつする手前で火を止める）。^どんぶりにスープを少しずつ注いで、ごまだれとよく混ぜる。^麺をゆでて湯を切り、どんぶりに入れる。肉みそとチンゲン菜をのせ、ラー油を回しかける。
焼きそば|麺は袋のままレンジ600Wで1分温めておく。キャベツは3cm角、にんじんは短冊切り、豚肉は3cm幅に切る。^フライパンにサラダ油大さじ1/2を中火で熱し、麺を広げて入れ、1分半触らずに焼いて片面に焼き色をつけ、返して1分焼いて取り出す（香ばしさとほぐれやすさが出る）。^残りの油を足して豚肉を2分炒め、にんじん・キャベツの芯を1分、キャベツの葉ともやしを加えて強火で1分炒める。^麺を戻して水大さじ2をふり、ほぐしながら1分炒める。^ソースの半量を麺に、残りを鍋肌に回しかけて焦がし、全体にからむまで30秒炒める。^器に盛り、青のりをふって紅しょうがを添える。
あんかけ焼きそば|麺はレンジで1分温めてほぐす。白菜はそぎ切り、にんじんは短冊切り、しいたけは薄切りにする。えびは背わたを取る。^フライパンにサラダ油大さじ1を中火で熱し、麺を平らに広げ、ヘラで押さえながら3分焼いてこんがりさせる。返してさらに2分焼き、器に盛る（両面カリカリにすると、あんをかけても食感が残る）。^同じフライパンに残りの油を強火で熱し、豚肉とえびを2分炒め、にんじん・白菜の芯・しいたけ、白菜の葉の順に加えて2分炒める。^水・鶏がらスープの素・オイスターソース・しょうゆを加えて煮立て、中火で2分煮る。^片栗粉を水大さじ3で溶き、混ぜながら回し入れる。再び煮立って透明になったら30秒煮て、ごま油をたらす。^麺の上にあんをたっぷりかける。
ちゃんぽん|豚肉は3cm幅、キャベツはざく切り、にんじんは短冊切りにする。^鍋にごま油を強火で熱し、豚肉を1分炒め、シーフードを加えて1分炒める。^にんじん・キャベツ・もやし・コーンを加え、強火で2分、野菜がしんなりする手前まで炒める（強火で炒めると香ばしさが出てスープがおいしくなる）。^水と鶏がらスープの素を加えて煮立て、中火で3分煮る。^牛乳を加え、沸騰させないように温めて、塩・こしょうで調える。^麺を表示時間ゆでて湯を切り、どんぶりに入れる。スープと具をたっぷり注ぐ。

豚の生姜焼き|しょうがはすりおろし、半量をしょうゆ・みりん・酒・砂糖と混ぜてたれを作る。残りは仕上げ用。^豚肉は脂身と赤身の境の筋を3〜4か所切る（反り返り防止）。焼く直前に片栗粉（分量外・小さじ2）を薄くまぶす（たれがよくからみ、肉がかたくならない）。玉ねぎは5mm幅の薄切り、キャベツはせん切りにして冷水に3分さらし、水気をよく切る。^フライパンにサラダ油を中火で熱し、豚肉を重ならないように広げ、1分半触らずに焼いて焼き色をつける。返して玉ねぎを加え、1分焼く（2回に分けて焼くと温度が下がらない）。^たれを回し入れ、中火のまま肉を返しながら1分、泡が大きくなりとろみがつくまで煮からめる。^火を止めて、残りのしょうがを加えて混ぜる（香りが立つ）。キャベツと盛り合わせ、たれをかける。

ぶり大根|大根は2.5cm厚さの半月切りにし、皮を厚めにむいて面取りする。米のとぎ汁（なければ米大さじ1を加えた水）で竹串がすっと通るまで15〜20分下ゆでし、水で洗う（えぐみが抜け、味がしみやすい）。^ぶりは3等分に切り、塩少々（分量外）をふって10分おく。ざるに並べて熱湯を回しかけ、表面が白くなったらすぐ冷水にとり、血合いやうろこを指で除く（霜降り。臭みを取る一番大事な工程）。^しょうがは半分を薄切り、半分をせん切り（針しょうが）にする。^鍋に水・酒・砂糖・薄切りしょうがを入れて煮立て、ぶりと大根を入れる。アクをすくい、落としぶたをして中火で10分煮る。^みりんとしょうゆの半量を加えて10分、残りのしょうゆを加えてさらに5分煮る。^落としぶたを取り、煮汁をスプーンで回しかけながら中火で3分、照りが出るまで煮詰める。針しょうがをのせる。
さばの味噌煮|さばは皮目に十字の切り込みを入れる（皮が破れず、味がしみる）。ざるにのせて熱湯を回しかけ、すぐ冷水にとって血や汚れを洗い、水気をふく。^しょうがは薄切り、長ねぎは4cm長さに切る。^フライパン（さばが重ならない大きさ）に水・酒・砂糖・みりん・しょうがを入れて中火で煮立てる。^さばを皮目を上にして並べ入れる（冷たい煮汁から煮ると臭みが出るので、必ず煮立ててから）。アクをすくい、落としぶたをして中火で5分煮る。^味噌を煮汁少々で溶いて半量を加え、長ねぎも入れて落としぶたをして5分煮る。^残りの味噌を加え、落としぶたを取って、煮汁をスプーンで回しかけながら中火で3分、とろりとするまで煮詰める（味噌を2回に分けると香りが残る）。
鮭の塩焼き|鮭（甘塩でない生鮭）の両面に塩を均一にふり、15分おく。^表面に出てきた水分をペーパーでしっかりふき取る（この水分が臭みの元）。^魚焼きグリルを中火で2分予熱し、網に薄く油を塗る（くっつき防止）。^片面焼きグリルなら盛りつけたとき表になる面（皮目）から中火で5分、返して3〜4分焼く。両面焼きなら中火で7〜8分。皮がパリッとして、身の中心が白くなれば焼き上がり。^大根をすりおろし、ざるに入れて軽く水気を切って添える。
鮭のちゃんちゃん焼き|鮭は塩少々（分量外）をふって10分おき、水気をふく。^味噌・みりん・砂糖・酒を混ぜて味噌だれを作る。^キャベツはざく切り、玉ねぎは1cm幅のくし形、にんじんは短冊切り、しめじはほぐす。^フライパン（またはホットプレート）にバター半量を中火で溶かし、鮭を皮目から2分焼き、返して1分焼く。^鮭の周りに野菜を広げ入れ、味噌だれを全体に回しかける。ふたをして弱めの中火で8〜10分蒸し焼きにし、野菜がしんなりして鮭に火が通るまで加熱する。^残りのバターをのせ、鮭を大きくほぐして野菜と混ぜながら食べる。
さんまの塩焼き|さんまは流水で洗って水気をふき、長ければ半分に切る（内臓は取らずに焼くのが本来の味わい）。^両面に高い位置から塩をまんべんなくふり、15分おく。出てきた水分をふき取る。^魚焼きグリルを中火で2分予熱し、網に油を薄く塗る。^片面焼きなら盛りつけ面（頭を左にしたとき上になる面）から中火で6分、返して4〜5分。両面焼きなら8〜10分。皮に焼き色がつき、パチパチと脂が落ちる音がしたら焼き上がり。^大根おろしを添え、しょうゆをたらす。すだちがあれば絞る。
鶏の唐揚げ|鶏肉は余分な脂を取り、1切れ35〜40gの大きめの一口大に切る（小さすぎるとパサつく）。^ボウルにしょうゆ・酒・おろしにんにく・おろししょうがを入れ、鶏肉を加えて1分もみ込む。冷蔵庫で30分（最低15分）漬ける。^揚げる10分前に冷蔵庫から出す。汁気を軽く切り、片栗粉と薄力粉を混ぜた粉をまぶして、手で握るようにしっかり押さえてつける。^揚げ油を170℃に熱し、鶏肉を皮を広げて入れる。3分触らずに揚げ、表面が固まったら返して1分。いったん網に取り出して4分休ませる（余熱で中まで火を通す）。^油を190℃に上げ、もう一度入れて1分、表面がカリッときつね色になるまで二度揚げする。^網の上で1分油を切り、レタスとくし形のレモンを添える。
とんかつ|豚肉は焼く20分前に冷蔵庫から出して室温に戻す（中心まで均一に火が通る）。脂身と赤身の境の筋に1.5cm間隔で切り込みを入れ、肉たたきで軽くたたいて元の形に整える。^両面に塩・こしょうをふり、薄力粉を全体に薄くまぶして余分をはたく。溶き卵にくぐらせ、パン粉を両手で押さえるようにしっかりつける。5分おいて衣をなじませる。^キャベツは極細のせん切りにし、冷水に5分さらしてシャキッとさせ、水気をよく切る。^揚げ油を170℃に熱し、とんかつを静かに入れる。3分触らずに揚げ、返して2〜3分。泡が細かくなり、音が「パチパチ」と高くなり、全体がきつね色になったら取り出す。^網に立てかけて3分休ませる（余熱で中心まで火が通り、肉汁が落ち着く）。^1.5cm幅に切ってキャベツと盛り、ソースを添える。
チキン南蛮|タルタル：卵1個を沸騰した湯で11分ゆでて冷水にとり、殻をむいて粗く刻む。玉ねぎはみじん切りにして水に5分さらし、水気を固く絞る。卵・玉ねぎ・マヨネーズを混ぜる。^甘酢：小鍋に酢・砂糖・しょうゆを入れて中火で煮立て、砂糖が溶けたら火を止める。^鶏肉は厚い部分を開いて厚みを均一にし、大きめのそぎ切りにして塩・こしょうをふる。薄力粉を薄くまぶし、残りの卵を溶いてたっぷりからめる（卵衣でふんわり仕上がる）。^揚げ油を170℃に熱し、鶏肉を入れて3分、返して2分、衣が黄金色になるまで揚げる。^油を切ったら熱いうちに甘酢にくぐらせ、全体に吸わせる。^レタスを敷いた皿に盛り、タルタルソースをたっぷりかける。
豚の角煮|卵は8分ゆでて殻をむく。豚肉は5cm角に切る。長ねぎの青い部分としょうがの皮は下ゆで用、しょうがの実は薄切りにする。^フライパンを中火で熱し、油をひかずに豚肉を脂身から入れ、全面に焼き色がつくまで6〜8分焼く（余分な脂が抜け、型崩れも防げる）。^鍋に豚肉・ねぎの青い部分・しょうがの皮を入れ、かぶるくらいの水を注いで強火にかける。煮立ったら弱火にし、ふたをずらして1時間ゆでる（水が減ったら足す）。竹串がすっと通るやわらかさが目安。^ゆで汁を捨て、豚肉をさっと洗う（冷ましてから固まった脂を取るとさらにさっぱり）。^鍋に水500ml・酒・砂糖・みりん・しょうがの薄切りを入れて煮立て、豚肉を入れて落としぶたをして弱めの中火で15分煮る。しょうゆとゆで卵を加え、さらに30分煮る（砂糖を先に入れると肉がやわらかくなる）。^落としぶたを取り、中火で煮汁をかけながら5分、とろりとするまで煮詰める。
肉豆腐|豆腐はキッチンペーパーで包み、10分ほど重しをして水切りし、8等分に切る。長ねぎは1cm幅の斜め切り、しらたきは3分下ゆでして食べやすく切る。牛肉は5cm幅に切る。^鍋にだし・酒・砂糖・みりん・しょうゆを入れて中火で煮立て、牛肉を広げて入れる。^菜箸でほぐしながら1分半煮て、アクをすくう。肉に火が通ったら一度取り出す（煮すぎるとかたくなる）。^残った煮汁に豆腐・しらたき・長ねぎを入れ、落としぶたをして弱めの中火で10分煮る。^牛肉を戻し入れて2分温め、火を止めて5分おいて味を含ませる。
鶏つくね|長ねぎはみじん切り、しょうがはすりおろす。しょうゆ・みりん・砂糖を合わせてたれを作る。^ボウルにひき肉・塩を入れ、粘りが出て白っぽくなるまで1分よく練る。長ねぎ・しょうが・片栗粉を加えてさらに練る。^手に油を薄くつけて6等分し、1.5cm厚さの小判形にまとめ、片面に大葉を貼りつける。^フライパンにサラダ油を中火で熱し、大葉を下にして並べ、2分焼く。返して水大さじ2を入れ、ふたをして弱火で5分蒸し焼きにする。^ふたを取り、余分な水分と脂をふき取ってたれを加え、中火で1〜2分、転がしながら照りが出るまで煮からめる。好みで卵黄を添える。
手羽元のさっぱり煮|卵は8分ゆでて殻をむく。しょうがは薄切り、にんにくはつぶす。^フライパンを中火で熱し、手羽元を並べて油をひかずに3〜4分、転がしながら全面に焼き色をつける（香ばしさが煮汁に移る）。^鍋に手羽元・水・酢・しょうゆ・砂糖・しょうが・にんにくを入れて強火で煮立て、アクをすくう。^ゆで卵を加え、落としぶたをして弱めの中火で20分煮る（酢の力で骨離れがよくなり、身がやわらかくなる）。途中で卵を転がす。^落としぶたを取って中火で5分、煮汁を回しかけながらとろりとするまで煮詰める。
天ぷら|えびは殻と背わたを取り、腹側に斜めに5本切り込みを入れて指で押し、筋を切ってまっすぐにする。尾の先を切って水分をしごき出す。なすは縦半分に切って皮に格子の切り込みを、さつまいもは7mm厚さの輪切りにして水に5分さらす。しいたけは軸を取る。すべてペーパーで水気をしっかりふく。^天つゆ：めんつゆを水大さじ6で割り、小鍋で温める。^衣：ボウルに卵と冷水を合わせ、溶きほぐしてから薄力粉を一度に加える。菜箸で10回ほど、粉が少し残るくらいにさっくり混ぜる（混ぜすぎ・温度上昇はべたつきの原因。氷を1つ入れるとよい）。^揚げ油を170℃に熱する。火の通りにくいさつまいもから：衣をつけて入れ、3分、竹串が通るまで揚げる。なす2分、しいたけ1分半、大葉は片面だけ衣をつけて30秒。^えびは油を180℃に上げ、尾を持って衣をつけ、1分〜1分半揚げる。^揚げかすはこまめにすくう。網に立てて油を切り、天つゆと大根おろしを添える。
かき揚げ|玉ねぎは5mm幅の薄切り、にんじんは4cm長さの細切り、三つ葉は3cm長さに切る。えびは背わたを取り、1cm幅に切る。^ボウルに具をすべて入れ、薄力粉大さじ1をまぶして全体に薄くからめる（具どうしがまとまりやすくなる）。^冷水90mlに残りの薄力粉を入れてさっくり混ぜ、具のボウルに加えて、全体に衣が薄くからむ程度に混ぜる。^揚げ油を170℃に熱する。お玉に1/4量をのせ、油の表面すれすれからすべらせるように入れる。^菜箸で真ん中に穴を1か所あけ（火の通りがよくなる）、1分半そのまま揚げる。返してさらに1分半、カリッとするまで揚げる。^網に立てて油を切り、塩を添える。
揚げ出し豆腐|豆腐はキッチンペーパーで包み、上に皿をのせて20分水切りし、4等分に切る。表面の水気を再度ふく（水分が残ると油がはねる）。^だし・しょうゆ・みりんを小鍋で煮立て、つゆを作って保温する。大根はすりおろして水気を軽く切る。しょうがはすりおろす。^揚げる直前に豆腐に片栗粉を全面たっぷりまぶし、余分をはたく。^揚げ油を180℃に熱し、豆腐を入れて触らずに2分、返して1分。表面がカリッと薄く色づいたら取り出す。^器に盛り、熱いつゆを周りから注ぐ。大根おろし・しょうが・小口切りの小ねぎをのせる。
かれいの煮付け|かれいは表面のぬめりを包丁でこそげ、皮目に十字の切り込みを入れる。ざるにのせて熱湯を回しかけ、冷水にとって汚れを洗い流し、水気をふく。^ごぼうは5cm長さに切り、縦半分に切って水にさらす。しょうがは薄切りにする。^フライパンに水・酒・砂糖・みりん・しょうがを入れて中火で煮立てる（必ず煮立ててから魚を入れる）。^かれいを皮目を上にして入れ、ごぼうを空いたところに入れる。落としぶたをして中火で5分。^しょうゆを加え、落としぶたをしてさらに5分煮る。^落としぶたを取り、煮汁をスプーンで回しかけながら3分煮て照りを出す。煮汁ごと盛る。
ぶりの照り焼き|ぶりの両面に塩をふって15分おき、出てきた水分をしっかりふく（臭みが抜ける）。^しょうゆ・みりん・酒・砂糖を合わせる。^ぶりに薄力粉を薄くまぶして余分をはたく。^フライパンにサラダ油を中火で熱し、盛りつけで表になる面から入れて3分、焼き色がつくまで焼く。返して弱めの中火で2分焼く。^出てきた脂をペーパーでふき取り、合わせ調味料を加える。中火でスプーンでたれを回しかけながら1〜2分、とろりと照りが出るまで煮詰める。
鮭の南蛮漬け|南蛮酢：小鍋にだし・酢・砂糖・しょうゆ・種を取った唐辛子を入れて中火でひと煮立ちさせ、バットに移す。^玉ねぎは薄切り、にんじん・ピーマンはせん切りにし、南蛮酢に漬けておく。^鮭は骨を除いて一口大のそぎ切りにし、塩少々（分量外）をふって10分おき、水気をふく。^片栗粉を薄くまぶし、170℃の油で3分、カリッと揚げる。^揚げたての熱いうちに南蛮酢に漬け、野菜をのせる（熱いうちに漬けると味をよく吸う）。^ときどき返しながら15分以上なじませる。冷蔵庫で冷やしてもおいしい。
あじフライ|あじは背開きにしたものを使い、腹骨をそぎ取り、小骨を骨抜きで抜く。両面に塩・こしょうをふり、10分おいて水気をふく。^薄力粉を薄くまぶし、溶き卵にくぐらせ、パン粉を押さえるようにしっかりつける。^キャベツはせん切りにして冷水にさらし、水気を切る。^揚げ油を170℃に熱し、身を下にして入れて2分、返して1分半〜2分、全体がきつね色になるまで揚げる。^網に立てて油を切る。キャベツと盛り、ソースを添える（タルタルソースもおすすめ）。
いわしの蒲焼き|いわしは頭と内臓を取り、手開きにして中骨と腹骨を除く。水で洗い、水気をしっかりふく。^しょうゆ・みりん・砂糖・酒を合わせる。^いわしの両面に片栗粉を薄くまぶし、余分をはたく。^フライパンにサラダ油を中火で熱し、身側から入れて2分、焼き色がついたら返して皮側を1分半焼く。^余分な脂をふき取り、たれを加えて中火で1分、たれをからめながら照りが出るまで煮詰める。^大葉を敷いた器に盛る。ご飯にのせて丼にしても。
牛肉のしぐれ煮|しょうがは細いせん切りにする。牛肉は大きければ3cm幅に切る。^鍋にしょうゆ・みりん・砂糖・酒・しょうがを入れて中火で煮立てる。^牛肉を加えて菜箸でほぐし、アクをすくう。^中火で混ぜながら8〜10分、煮汁がほとんどなくなり、つやが出るまで煮詰める。最後は焦げやすいので弱火にする。^冷蔵で4〜5日保存できる。ご飯のお供やお弁当に。
冷しゃぶ|鍋にたっぷりの湯を沸かして酒を入れ、火を弱めて表面がゆらゆらする程度（約80℃）にする（ぐらぐら沸騰した湯だと肉がかたくなる）。^豚肉を1枚ずつ広げて入れ、色が変わったら（20〜30秒）すぐにざるに上げる。^氷水にはとらず、ざるに広げたまま自然に冷ます（氷水にとると脂が白く固まり、食感が悪くなる）。^レタスはちぎり、きゅうりはせん切り、トマトは薄いくし形に切る。^器に野菜を敷いて豚肉をのせ、ポン酢をかけてごまをふる。ごまだれもよく合う。
豚キムチ|豚肉は4cm幅に切る。にらは4cm長さに切る。キムチは大きければざく切りにする。^フライパンにごま油を中火で熱し、豚肉を広げて2分、脂が出てカリッとするまで炒める。^キムチを加えて強めの中火で2分、汁気を飛ばしながらしっかり炒める（酸味が和らいでうまみが増す）。^砂糖・しょうゆを加えて30秒炒める（砂糖がキムチの酸味をまろやかにする）。^にらを加えて20秒、さっと炒めて火を止める。
肉野菜炒め|キャベツは4cm角に切り、芯は薄切りにする。にんじんは短冊切り、ピーマンは細切りにする。もやしは洗って水気をよく切る（水気は水っぽさの原因）。^豚肉に塩・こしょう少々と片栗粉小さじ1（分量外）をもみ込む（肉がやわらかく、味がからみやすい）。^調味料（鶏がらスープの素・しょうゆ・オイスターソース）を合わせておく。^フライパンにサラダ油を強火で1分しっかり熱し、豚肉を広げて1分焼きつけてから炒め、色が変わったら取り出す。^同じフライパンを強火のまま、にんじん→キャベツの芯→キャベツの葉とピーマン→もやしの順に加え、合計2分以内で手早く炒める（ここで長く炒めると水が出る）。^肉を戻し、合わせ調味料を回し入れて30秒、全体にからめる。塩・こしょうで調える。
ゴーヤチャンプルー|ゴーヤは縦半分に切ってスプーンで種とわたを除き、3mm厚さに切る。塩小さじ1/2をまぶして10分おき、水気を絞る（苦みがやわらぐ）。^豆腐はキッチンペーパーで包み、レンジ600Wで2分加熱して水切りする。豚肉は4cm幅に切る。卵は溶く。^フライパンにサラダ油を中火で熱し、豆腐を手で大きくちぎって入れ、3分焼いて両面に焼き色をつけて取り出す。^同じフライパンで豚肉を2分炒め、ゴーヤを加えて強めの中火で2分炒める（ゴーヤは歯ごたえが残る程度に）。^豆腐を戻し、だしの素・しょうゆを加えて混ぜる。溶き卵を回し入れ、10秒待ってから大きく混ぜ、半熟で火を止める。^器に盛り、かつお節をのせる。
アスパラの肉巻き|アスパラは根元1cmを切り落とし、下1/3の皮をピーラーでむく。塩を入れた熱湯で30秒ゆでてざるに上げる（芯まで火が通りやすくなる）。^しょうゆ・みりん・砂糖を合わせる。^豚肉を少し重なるように斜めに巻きつけ、塩・こしょうをして薄力粉を薄くまぶす（粉がのりの役目をして、はがれない）。^フライパンにサラダ油を中火で熱し、巻き終わりを下にして並べる。1分焼いて留まったら、転がしながら3〜4分、全面に焼き色をつける。^余分な脂をふき取り、たれを加えて中火で1分、転がしながら照りよくからめる。半分に切って盛る。
ピーマンの肉詰め|ピーマンは縦半分に切って種とわたを取り、内側に薄力粉を茶こしで薄くふる（肉がはがれにくくなる）。^玉ねぎはみじん切りにする。パン粉は牛乳少々（分量外）でしとらせる。^ボウルにひき肉・塩・こしょうを入れて粘りが出るまで練り、玉ねぎ・卵・パン粉を加えてさらに練る。^ピーマンに肉だねをすき間なく詰め、表面を平らにならす（焼くと縮むので少し盛り上げる）。^フライパンにサラダ油を中火で熱し、肉の面を下にして並べ、3分焼いて焼き色をつける。返して水大さじ3を入れ、ふたをして弱火で6分蒸し焼きにする。^ふたを取って水分を飛ばし、ケチャップ・ソースを加えて30秒からめる。
鶏むね肉のねぎ塩焼き|鶏むね肉は皮を取り、1cm厚さのそぎ切りにする。酒をもみ込んで10分おき、片栗粉をまぶす（むね肉がしっとりやわらかくなる）。^ねぎ塩だれ：長ねぎをみじん切りにし、ごま油大さじ1/2・鶏がらスープの素・塩・レモン汁と混ぜる。^フライパンに残りのごま油を中火で熱し、鶏肉を重ならないように並べる。^1分半焼いて焼き色がついたら返し、弱めの中火で1分半〜2分焼いて火を通す（むね肉は焼きすぎるとパサつくので短時間で）。^火を止めて、ねぎ塩だれを加えて全体にからめる。
鶏ハム|鶏むね肉は皮を取り、厚い部分を開いて厚さを均一にする。フォークで両面を10か所ずつ刺す。^砂糖をまず全体にすり込み、次に塩をすり込む（砂糖が先だと保水されてしっとりする）。ポリ袋に入れて空気を抜き、冷蔵庫でひと晩（最低2時間）おく。^表面をさっと洗い、水気をふく。ラップを広げて鶏肉を手前から巻き、キャンディのように両端をきつくねじる。さらにもう1枚ラップで包む。^鍋にたっぷりの湯を沸かし、鶏肉を入れて再沸騰したら弱火で2分ゆでる。^火を止め、ふたをしてそのまま湯が冷めるまで（約1時間半）おく（余熱でゆっくり火を通すと、しっとりピンク色に仕上がる）。^冷めたら薄切りにし、レタスと盛る。冷蔵で3〜4日保存できる。
豚の味噌漬け焼き|味噌・みりん・砂糖を混ぜて味噌床を作る。^豚肉は筋切りする。ラップを広げて味噌床の半量を塗り、豚肉をのせて残りを上に塗り、包む。冷蔵庫で半日〜ひと晩漬ける。^焼く前に味噌をゴムべらでぬぐう（味噌が残ると焦げる）。^フライパンにサラダ油を弱めの中火で熱し、豚肉を入れて2分半焼く。返してふたをし、弱火で2分焼く（味噌漬けは焦げやすいので、強火は厳禁）。^食べやすく切り、せん切りキャベツと盛る。
たらのホイル焼き|たらは塩少々をふって10分おき、水気をふいてこしょうをふる。^玉ねぎは薄切り、しめじはほぐす。^アルミホイルを30cm角に2枚切り、中央に玉ねぎを敷いてたらをのせ、しめじ・バター半量ずつをのせて酒をふる。^ホイルの上下を合わせて2回折り、両端もねじってしっかり閉じる（蒸気を逃がさないのが大事）。^フライパンに並べて水50mlを注ぎ、ふたをして中火で12分蒸し焼きにする（トースターなら15分）。^ホイルを開き、ポン酢をかけて食べる。
焼き鳥|鶏肉は3cm角に切り、長ねぎは3cm長さに切る。竹串は水に10分つけておく（焦げ防止）。^鶏肉→ねぎ→鶏肉→ねぎの順に、肉の皮が外を向くように刺す。^たれ：しょうゆ・みりん・砂糖・酒を小鍋で中火で煮立て、弱火で2分、とろりとするまで煮詰める。^魚焼きグリルを中火で予熱し、串を並べる。塩焼きは焼く直前に塩をふり、片面5分、返して3〜4分焼く。^たれ焼きは片面4分焼いてから、たれを刷毛で塗って1分。返して同様にし、たれを2〜3回塗り重ねる（焦げやすいので、最後に塗る）。^好みで七味や山椒をふる。
手羽先の甘辛揚げ|手羽先は水気をふき、関節に包丁を入れて先端を切り落とす（揚げムラ防止）。骨に沿って1本切り込みを入れる。^たれ：しょうゆ・みりん・砂糖・酒を小鍋で煮立て、弱火で2分煮詰める。^手羽先に片栗粉を薄くまぶす。^揚げ油を160℃に熱し、手羽先を入れて7分、低温でじっくり揚げる。^いったん取り出し、油を180℃に上げて2分、カリッと二度揚げする（皮がパリパリになる）。^揚げたてをたれに入れてからめ、ごまとこしょうをたっぷりふる（こしょうは多めが名古屋風）。
砂肝のにんにく炒め|砂肝は中央の筋で2つに分け、両側の白い銀皮を包丁でそぎ取る（ここを取るとやわらかく食べやすい）。厚さ5mmに切る。^にんにくは薄切りにする。^フライパンにごま油・にんにくを入れて弱火で1分、香りが出るまで加熱する。^強火にして砂肝を入れ、2〜3分炒める（炒めすぎるとかたくなる）。^塩・黒こしょうで調え、火を止めてレモン汁をかける。
ほたてのバター醤油焼き|ほたては水気をペーパーでしっかりふく（水分が残ると焼き色がつかない）。アスパラは根元の皮をむいて4cm長さに切る。^フライパンにバター半量を中火で溶かし、泡が小さくなったらほたてを並べる。^触らずに1分焼き、きつね色の焼き色がついたら返して30秒焼く（中はレアで止めるのがおいしい）。^アスパラを加えて1分炒める。^酒をふり、残りのバターとしょうゆを鍋肌から入れて10秒、全体にからめて火を止める。
茶碗蒸し|卵は泡立てないように溶きほぐし、冷ましただし・薄口しょうゆ・みりん・塩を加えて混ぜ、ざるでこす（なめらかに仕上がる）。^ささみは筋を取ってそぎ切り、えびは背わたを取る。しいたけは薄切りにする。^器に具を入れ、卵液を静かに注ぐ。表面の泡はスプーンで取る（泡が「す」の原因になる）。^蒸気の立った蒸し器に入れ、強火で2分（表面が白くなるまで）。^弱火にしてふたを少しずらし、12〜15分蒸す（強火で蒸し続けると「す」が入る）。竹串を刺して透明な汁が出れば蒸し上がり。^三つ葉をのせ、ふたをして30秒蒸らす。フライパンに器の半分まで湯を張り、ふたをして弱火で15分でも作れる。
だし巻き卵|卵は泡立てないように白身を切るように溶き、冷めただし・薄口しょうゆ・みりん・塩を加えて混ぜる。^卵焼き器を中火でしっかり熱し、油を含ませたペーパーで全体に塗る。卵液を少し落としてジュッと音がすれば適温。^卵液の1/4を流し、全体に広げる。ぷくっとふくらんだ泡は箸でつぶす。表面が半熟のうちに奥から手前に巻く。^空いた奥に油を塗り、巻いた卵を奥へすべらせる。手前にも油を塗り、卵液の1/4を流し、巻いた卵の下にも流し込んで、同様に巻く。これを繰り返す。^熱いうちに巻きすで巻いて5分おき、形を整える。^1.5cm幅に切り、大根おろしにしょうゆをたらして添える。
卵焼き|卵に砂糖・しょうゆ・塩を加え、白身を切るように溶きほぐす。^卵焼き器を中火で熱し、油を塗る。砂糖入りの卵は焦げやすいので、ここからは弱めの中火にする。^卵液の1/3を流して広げ、表面が半熟になったら奥から手前に巻く。^奥に寄せて油を塗り、残りの半量を流して巻いた卵の下にも流し込み、同様に巻く。最後も同様にする。^取り出して巻きすかラップで包み、3分おいて形を整えてから切る。
麻婆豆腐|豆腐は2cm角に切る。鍋に湯を沸かして塩小さじ1（分量外）を入れ、豆腐を入れて弱火で2分ゆで、ざるに上げる（崩れにくく、水っぽくならない）。^長ねぎ・にんにく・しょうがはみじん切りにする。水と鶏がらスープの素・しょうゆを合わせる。片栗粉は水大さじ2で溶く。^フライパンにごま油を中火で熱し、ひき肉を2〜3分、パラパラになって脂が透き通るまでしっかり炒める（ここで焼きつけるとうまみが出る）。^弱火にして豆板醤・甜麺醤・にんにく・しょうがを加え、1分炒めて油が赤くなり香りが立つまで炒める。^合わせたスープを加えて煮立て、豆腐を入れて中火で3分煮る。豆腐はヘラの背で押すように動かして崩さない。^長ねぎを加え、いったん火を止めて水溶き片栗粉を3回に分けて回し入れ、そのつど揺すって混ぜる。再び中火で1分、ぐつぐつ煮立ててとろみを安定させる。好みで花椒やラー油を。
麻婆なす|なすは縦4つに切ってから長さを半分にする。長ねぎ・にんにく・しょうがはみじん切りにする。^フライパンにサラダ油大さじ1.5を中火で熱し、なすの皮目を下にして並べ、2分焼く。返して2分、全体がしんなりするまで焼いて取り出す（油を吸わせて焼くと、とろとろに仕上がる）。^残りの油を足してひき肉を2分炒め、弱火にして豆板醤・甜麺醤・にんにく・しょうがを加えて1分炒める。^水・鶏がらスープの素・しょうゆを加えて煮立て、なすを戻して中火で2分煮る。^長ねぎを加え、水溶き片栗粉を回し入れて1分、とろみがつくまで煮る。
麻婆春雨|長ねぎはみじん切りにする。^フライパンにごま油を中火で熱し、ひき肉を2分炒めてパラパラにする。^豆板醤を加えて30秒炒め、香りを出す。^水・しょうゆ・砂糖・オイスターソース・鶏がらスープの素を加えて煮立てる。^乾燥のままの春雨を加え（もどさずにスープを吸わせると味がよく入る）、中火でときどき混ぜながら5〜6分、汁気がほぼなくなるまで煮る。^長ねぎを加えて混ぜる。
回鍋肉|キャベツは4cm角に切り、芯は薄切りにする。ピーマンは乱切り、長ねぎは斜め切り、にんにくは薄切りにする。豚肉は5cm幅に切る。甜麺醤・豆板醤・しょうゆ・酒・砂糖を合わせる。^フライパンにサラダ油大さじ1/2を強火で熱し、キャベツとピーマンを1分炒めて取り出す（先に炒めて取り出すと水っぽくならない）。^残りの油で豚肉を中火で2分、脂が出てカリッとするまで炒める。^弱火にしてにんにくと合わせ調味料を加え、30秒炒めて香りを出す（甜麺醤を炒めると香ばしくなる）。^強火にして野菜と長ねぎを戻し入れ、30秒〜1分で手早く全体をからめる。
青椒肉絲|牛肉は細切りにし、しょうゆ小さじ1・酒・片栗粉をもみ込む。ピーマンは縦に細切り（繊維に沿って切るとシャキッとする）、たけのこも細切りにする。^オイスターソース・しょうゆ小さじ2・砂糖を合わせる。^フライパンにサラダ油大さじ1/2を強火で熱し、牛肉を広げて30秒焼きつけてからほぐし、1分炒めて取り出す。^残りの油を足し、ピーマンとたけのこを強火で1分炒める。^牛肉を戻し、合わせ調味料を加えて30秒、手早く炒め合わせる。
酢豚|豚肉は2.5cm角に切り、しょうゆ小さじ2・酒を10分もみ込む。玉ねぎはくし形、ピーマンとにんじんは乱切りにする。にんじんはレンジ600Wで2分加熱しておく。^甘酢：ケチャップ・酢・砂糖・しょうゆ・水大さじ4・片栗粉小さじ1を混ぜておく。^豚肉の汁気を軽く切り、片栗粉大さじ3をしっかりまぶす。^揚げ油を170℃に熱し、豚肉を3分揚げて取り出す。油を180℃に上げ、1分二度揚げしてカリッとさせる。続けて野菜を30秒素揚げする。^フライパンの油をふき、甘酢をよく混ぜてから入れて中火で煮立てる。とろみがついたら火を止める。^豚肉と野菜を入れ、手早く全体にからめる（火を止めてからからめると衣のサクサクが残る）。
エビチリ|えびは背わたを取り、片栗粉と塩少々（分量外）でもんで水で洗い、水気をふく。片栗粉大さじ1をまぶす。^長ねぎ・にんにく・しょうがはみじん切りにする。ケチャップ・鶏がらスープの素・水・砂糖を合わせる。^フライパンにサラダ油を中火で熱し、えびを並べて1分、返して30秒焼き、8割火が通ったら取り出す（煮るときに火が通るので焼きすぎない）。^同じフライパンに、にんにく・しょうが・豆板醤を入れて弱火で1分炒め、香りと辛みを油に移す。^合わせ調味料を加えて中火で煮立て、えびを戻して1分煮る。^長ねぎを加え、とろみがついてえびにからんだら火を止める。溶き卵を加えるとまろやかになる。
エビマヨ|えびは背わたを取り、片栗粉と塩少々（分量外）でもみ洗いして水気をふく。塩・こしょうをふり、片栗粉大さじ2をまぶす。^ソース：マヨネーズ・ケチャップ・砂糖・牛乳を大きめのボウルで混ぜておく。^揚げ油を170℃に熱し、えびを入れて1分半、衣が固まりカリッとするまで揚げる。^油をよく切り、熱いうちにソースのボウルに入れて手早く和える（熱いうちに和えるとソースがなじむ）。^レタスを敷いた皿に盛る。
油淋鶏|鶏肉は厚い部分を開いて厚みを均一にし、しょうゆ小さじ2・酒をもみ込んで10分おく。^ねぎだれ：長ねぎとしょうがをみじん切りにし、しょうゆ大さじ2・酢・砂糖・ごま油と混ぜる。^鶏肉の汁気を軽くふき、片栗粉をしっかりまぶす。^揚げ油を170℃に熱し、鶏肉を皮目から入れて4分、返して2分揚げる。^油を180℃に上げて1分、二度揚げしてカリッとさせる。^網で1分油を切り、2cm幅に切る。レタスを敷いた皿に盛り、ねぎだれを上からたっぷりかける。
棒棒鶏|鶏むね肉は耐熱皿にのせて酒をふり、ふんわりとラップをしてレンジ600Wで2分、返して1分半加熱する。そのままラップをしたまま冷めるまでおく（余熱で火を通すとしっとりする）。^冷めたら手で細くさく。蒸し汁は捨てずに取っておく。^ごまだれ：練りごまにしょうゆを少しずつ加えて混ぜ、酢・砂糖・ごま油・蒸し汁大さじ1・ラー油を混ぜる。^きゅうりはせん切り、トマトは薄切りにする。^器にトマト・きゅうり・鶏肉の順に盛り、ごまだれをかける。
よだれ鶏|鶏むね肉は室温に30分おく。鍋にたっぷりの湯を沸かし、酒と鶏肉を入れて再沸騰したら弱火で1分、火を止めてふたをし、30分おく（余熱でしっとり）。^たれ：しょうゆ・黒酢・砂糖・ラー油・すりおろしたにんにくとしょうが・ごまを混ぜる。^鶏肉を取り出し、7mm厚さのそぎ切りにする。^器に並べてたれをかけ、小口切りの小ねぎとパクチーをのせる。花椒をふると本場の味に。
八宝菜|白菜は芯と葉に分けてそぎ切り、にんじんは短冊切り、しいたけは薄切り、チンゲン菜は4cm長さに切る。えびは背わたを取る。いかは1cm幅の輪切りにする。^豚肉・えび・いかに塩少々と片栗粉小さじ1（分量外）をまぶす。^水・鶏がらスープの素・オイスターソース・しょうゆ・塩を合わせる。片栗粉大さじ1は水大さじ2で溶く。^フライパンにサラダ油を強火で熱し、豚肉・えび・いかを1分半炒めて取り出す。^同じフライパンで、にんじん・白菜の芯・チンゲン菜の茎を1分、しいたけ・白菜とチンゲン菜の葉を加えて1分炒める。^肉と魚介を戻し、合わせ調味料を加えて煮立て、1分煮る。水溶き片栗粉を回し入れてとろみをつけ、ごま油をたらす。
餃子|キャベツはみじん切りにし、塩少々をふって10分おき、ふきんで包んで水気を固く絞る（ここが肉汁を逃がさないコツ）。にらは5mm幅に切る。^ボウルにひき肉・しょうゆ・酒・すりおろしたしょうがとにんにく・ごま油を入れ、粘りが出て白っぽくなるまで2分練る。水大さじ2を少しずつ加えて吸わせる（ジューシーになる）。キャベツとにらを加えて混ぜる。^皮の中央にあんを小さじ2のせ、縁に水をつけて、ひだを5〜6個寄せながら包む。^フライパンにサラダ油を入れて中火で熱し、餃子を並べて1分、底に軽く焼き色をつける。^熱湯100mlを回し入れ、すぐにふたをして中火で5分蒸し焼きにする。^ふたを取って水分を飛ばし、ごま油少々を回しかけて1〜2分、パチパチと音がして底がカリッときつね色になるまで焼く。皿をかぶせてひっくり返し、酢じょうゆ・ラー油を添える。
焼売|玉ねぎとしいたけはみじん切りにし、片栗粉をまぶしておく（玉ねぎの水分を閉じ込めて、ジューシーに仕上がる）。^ボウルにひき肉・塩を入れて粘りが出るまで練り、しょうゆ・オイスターソース・ごま油・砂糖・すりおろししょうがを加えてさらに練る。玉ねぎとしいたけを加えて混ぜる。^親指と人さし指で輪を作り、皮をのせてあんを大さじ1押し込む。上を平らにならし、底を軽く押さえて形を整える。^蒸し器にクッキングシートを敷き、間隔をあけて並べる。^蒸気がしっかり上がった状態で入れ、強火で12分蒸す。^からしじょうゆを添える。フライパンに湯を1cm張り、ふたをして中火で10分でも作れる。
春巻き|豚肉・にんじん・しいたけ・たけのこは細切りにする。春雨は熱湯で3分もどし、5cm長さに切る。^フライパンにごま油を中火で熱し、豚肉を1分、野菜を加えて2分炒める。^水・オイスターソース・しょうゆ・砂糖を加えて煮立て、春雨を加えて1分煮る。水溶き片栗粉でとろみをつけ、バットに広げて完全に冷ます（熱いと皮が破れる）。^皮をひし形に置き、手前に具をのせて一巻きし、左右を折り込んでから巻く。巻き終わりに水溶き小麦粉を塗って留める。^揚げ油を170℃に熱し、巻き終わりを下にして入れる。ときどき転がしながら4〜5分、きつね色になるまで揚げる（中の具は火が通っているので、皮がパリッとすればOK）。^網に立てて油を切る。からしじょうゆを添えて。
かに玉|甘酢あん：小鍋に水・鶏がらスープの素・しょうゆ・砂糖・酢を入れて煮立て、水溶き片栗粉でとろみをつけ、30秒煮る。^かにかまはほぐし、長ねぎ・しいたけは薄切りにする。サラダ油大さじ1/2でしいたけと長ねぎを1分炒め、冷ます。^卵を溶き、かにかま・炒めた具・塩を混ぜる。^フライパンに残りのサラダ油を強めの中火で1分しっかり熱し、卵液を一気に流す。^ふちがふくらんできたら、大きく外から内へ5〜6回混ぜ、半熟になったら丸く整える。皿をかぶせて返し、もう片面を20秒焼く。^器に盛り、甘酢あんをかける。
ニラ玉|にらは4cm長さに切る。卵に鶏がらスープの素を混ぜる。^フライパンにごま油半量を強火で熱し、卵液を流して大きく混ぜ、半熟（約20秒）で取り出す。^残りのごま油でにらを強火で20秒、さっと炒める（炒めすぎると水が出る）。^卵を戻し、しょうゆを鍋肌から入れ、塩・こしょうで調えて手早く混ぜる。
トマトと卵の炒め物|トマトはくし形に8等分する。卵は塩少々を加えて溶く。^フライパンにサラダ油大さじ1を強めの中火で熱し、卵液を流して大きく5〜6回混ぜ、ふんわり半熟で取り出す。^残りの油でトマトを中火で1分、皮が少しめくれて汁が出てくるまで炒める。^鶏がらスープの素・砂糖を加え（砂糖がトマトの酸味をまろやかにする）、卵を戻す。^大きく2〜3回混ぜ、卵がトマトの汁を吸ったら火を止める。
レバニラ炒め|レバーは脂と筋を除いて一口大に切り、水を2〜3回替えながら10分さらして血抜きする。水気をしっかりふく。^しょうゆ小さじ2・酒・おろししょうがをもみ込んで10分おき、汁気を切って片栗粉をまぶす。^にらは4cm長さに切る。オイスターソース・しょうゆ小さじ2・砂糖を合わせる。^フライパンにサラダ油大さじ1/2を中火で熱し、レバーを並べて1分半、返して1分半焼き、取り出す（火を通しすぎないのがやわらかさのコツ）。^残りの油を強火で熱し、もやしを1分炒め、レバーを戻して合わせ調味料を加える。^にらを加えて20秒炒め合わせ、火を止める。
鶏肉とカシューナッツ炒め|鶏肉は2cm角に切り、酒少々と片栗粉をまぶす。ピーマン・玉ねぎも2cm角に切る。オイスターソース・しょうゆ・酒・砂糖を合わせる。^フライパンを弱火で熱し、カシューナッツを3分、薄く色づくまで乾煎りして取り出す（香ばしさが格段に上がる）。^サラダ油を中火で熱し、鶏肉を3分、焼き色がつくまで焼いて火を通す。^玉ねぎ・ピーマンを加えて強火で1分炒める。^カシューナッツを戻し、合わせ調味料を加えて30秒、全体にからめる。
プルコギ|しょうゆ・砂糖・酒・ごま油・すりおろしたにんにく・ごまを混ぜ、たれを作る。あればすりおろしたりんご（または梨）大さじ1を加えると肉がやわらかくなる。^牛肉をたれに加えてよくもみ込み、20分以上漬ける。^玉ねぎは薄切り、にんじん・ピーマンは細切りにする。^フライパンを中火で熱し、牛肉をたれごと入れて2分炒める。^野菜を加えて強火で2〜3分、汁気がほとんどなくなるまで炒める。
サムギョプサル|豚バラ肉は厚切り（1cm）のものを用意し、食べやすい長さに切る。^たれ2種：味噌・コチュジャン・砂糖・すりおろしにんにくを混ぜた「サムジャン」と、ごま油・塩を混ぜた「塩だれ」を作る。^ホットプレート（またはフライパン）を中火で熱し、油をひかずに豚肉を並べる。^片面4〜5分、触らずにじっくり焼いて脂を出し、カリッとさせる。返してさらに3分。出てきた脂はペーパーで取る。^キッチンばさみで一口大に切る。^レタスに肉・キムチ・たれをのせて包んで食べる。キムチも一緒に焼くとおいしい。
ヤンニョムチキン|鶏肉は一口大に切り、塩・こしょうをふる。^たれ：コチュジャン・ケチャップ・はちみつ・しょうゆ・すりおろしにんにくを混ぜる。^鶏肉に片栗粉をしっかりまぶす。^揚げ油を170℃に熱し、鶏肉を4分揚げて取り出し、2分休ませる。180℃で1分、二度揚げしてカリッとさせる。^フライパンにたれを入れて中火で煮立て、とろりとしたら火を止める。^鶏肉を入れて手早く全体にからめ、ごまをふる。
タッカルビ|鶏肉は一口大に切る。コチュジャン・しょうゆ・砂糖・酒・すりおろしにんにくを混ぜ、鶏肉にもみ込んで15分おく。^キャベツはざく切り、玉ねぎはくし形、さつまいもは5mm厚さの半月切りにする。^フライパン（またはホットプレート）にごま油を中火で熱し、さつまいもを敷き、キャベツと玉ねぎ、鶏肉をたれごとのせる。^ふたをして弱めの中火で10分蒸し焼きにする。^ふたを取って全体を混ぜ、中火で3分、さつまいもと鶏肉に火が通るまで炒める。^真ん中をあけてチーズを入れ、ふたをして1〜2分、チーズが溶けたら具をからめて食べる。
ハンバーグ|玉ねぎはみじん切りにし、サラダ油少々で中火4分、薄く色づくまで炒めて完全に冷ます（甘みが出る。熱いまま混ぜると肉の脂が溶けてパサつく）。パン粉は牛乳でしとらせる。^ボウルとひき肉は冷やしておく。ひき肉と塩を入れ、指先でつかむように1分、白っぽく粘りが出るまで練る。卵・パン粉・玉ねぎ・こしょうを加えてさらに練る。^2等分して、両手でキャッチボールするように10回打ちつけて空気を抜き、1.5cm厚さの小判形にする。中央を指で少しくぼませる（焼くと中央がふくらむため）。^フライパンにサラダ油を中火で熱し、ハンバーグを入れて2分半、焼き色がつくまで焼く。返して水大さじ3を入れ、すぐにふたをして弱火で8分蒸し焼きにする。^竹串を中心に刺し、透明な肉汁が出れば焼き上がり（赤い汁なら2分追加）。取り出す。^同じフライパンの肉汁にケチャップ・ソース・水大さじ2を加え、中火で1分煮詰めてソースにする。ゆでたブロッコリーとにんじんを添える。
煮込みハンバーグ|玉ねぎはみじん切りにして炒め、冷ます。パン粉は牛乳でしとらせる。ひき肉と塩を粘りが出るまで練り、卵・パン粉・玉ねぎを加えて練る。^2等分して空気を抜き、1.5cm厚さの小判形にする。^フライパンにサラダ油を中火で熱し、ハンバーグを入れて2分、返して1分、両面に焼き色をつける（中は生でよい）。余分な脂をふく。^トマト缶・水・ケチャップ・ソース・コンソメ・ほぐしたしめじを加え、煮立ったらふたをして弱火で12〜15分煮込む。途中で1回返す。^ふたを取って中火で2分、ソースをとろりと煮詰める。
和風おろしハンバーグ|玉ねぎはみじん切りにして炒めて冷ます。パン粉は牛乳でしとらせる。ひき肉と塩を粘りが出るまで練り、卵・パン粉・玉ねぎを加えて練る。^2等分して空気を抜き、小判形にして中央をくぼませる。^大根はすりおろして、ざるで軽く水気を切る。大葉はせん切りにする。^フライパンにサラダ油を中火で熱し、ハンバーグを2分半焼く。返して水大さじ3を入れ、ふたをして弱火で8分蒸し焼きにする。^竹串で透明な肉汁を確認して器に盛る。^大根おろしと大葉をのせ、ポン酢をかける。
ロールキャベツ|キャベツは芯をくり抜き、丸ごと熱湯に入れて、はがれた葉から順に1分ずつゆでて取り出す。冷めたら芯の厚い部分をそぎ取る（そいだ芯はみじん切りにしてたねに混ぜる）。^玉ねぎはみじん切りにする。パン粉は牛乳でしとらせる。ひき肉に塩・こしょうを加えて粘りが出るまで練り、玉ねぎ・パン粉・キャベツの芯を加えて混ぜ、8等分する。^キャベツの葉の手前にたねをのせ、手前から一巻きし、左右を折り込んでくるくる巻く。^鍋に巻き終わりを下にして、すき間なく詰めて並べる（すき間があると煮崩れる）。ベーコンをのせる。^水とコンソメを加えて中火で煮立て、落としぶたをして弱火で25〜30分煮る。^塩・こしょうで調える。好みでトマト缶を加えるとトマト煮に。
クリームシチュー|鶏肉は一口大に切り、塩・こしょう少々（分量外）をふる。玉ねぎはくし形、にんじんは乱切り、じゃがいもは一口大に切る。ブロッコリーは小房に分け、塩ゆで2分してざるに上げる。^鍋にサラダ油を中火で熱し、鶏肉を皮目から3分焼いて色を変える。^玉ねぎを加えて3分、透き通るまで炒め、にんじん・じゃがいもを加えて2分炒める。^水を加えて煮立て、アクを取り、ふたをして弱めの中火で15分、じゃがいもがやわらかくなるまで煮る。^火を止めてルウを溶かし、牛乳を加える。^再び弱火にかけ、焦げないよう底から混ぜながら5分、とろみがつくまで煮る（牛乳を入れたら沸騰させない）。ブロッコリーを加えて温める。
ビーフシチュー|牛肉は4cm角に切り、塩・こしょうをふる。玉ねぎはくし形、にんじん・じゃがいもは大きめの乱切り、マッシュルームは半分に切る。^厚手の鍋にサラダ油を強めの中火で熱し、牛肉を全面に焼き色がつくまで5分焼く（うまみを閉じ込め、香ばしさがソースの土台になる）。^赤ワインを加えて強火で2分、鍋底の焼き付きをこそげながらアルコールを飛ばす。^水500mlを加えて煮立て、アクを取る。ふたをして弱火で60分、竹串がすっと通るまで煮込む（水が減ったら足す）。^玉ねぎ・にんじんを加えて15分、じゃがいも・マッシュルームを加えてさらに10分煮る。^火を止めてルウを溶かし、弱火で5分、とろみがつくまで煮込む。
ポトフ|玉ねぎは4等分のくし形、にんじんは長さを半分にして縦半分、じゃがいもは半分、キャベツは芯をつけたまま4等分のくし形に切る（芯をつけるとバラバラにならない）。ウインナーは斜めに切り込みを入れる。^鍋に水・コンソメ・にんじん・じゃがいも・玉ねぎを入れて中火にかけ、煮立ったらアクを取る。^弱火にしてふたをし、15分煮る（ぐらぐら煮ると煮崩れて濁る）。^キャベツを加えてさらに10分煮る。^ウインナーを加えて5分煮て、塩・こしょうで調える。^器に盛り、粒マスタードを添える。
マカロニグラタン|マカロニは1%の塩を入れた湯で表示時間どおりゆでる。鶏肉は1.5cm角、玉ねぎ・マッシュルームは薄切りにする。^フライパンにバター10gを中火で溶かし、鶏肉を2分、玉ねぎを加えて2分、マッシュルームを加えて1分炒め、取り出す。^同じフライパンに残りのバターを弱火で溶かし、薄力粉を加えて2分、焦がさずに炒める（粉臭さを抜く）。^火を止めて冷たい牛乳の1/4を加え、なめらかになるまで混ぜる。残りも3回に分けて加え、そのつど混ぜる（ダマ防止）。^中火にかけて、ヘラで底から絶えず混ぜながら4〜5分、ふつふつしてとろみがつくまで煮る。コンソメ・塩・こしょうで調え、具とマカロニを加えて混ぜる。^バターを塗った耐熱皿に入れてチーズとパン粉をのせ、220℃に予熱したオーブンで10〜12分（トースターなら10分）、こんがり焼き色がつくまで焼く。
ポークソテー|豚肉は焼く20分前に室温に戻し、筋切りして塩・こしょうをふる。薄力粉を薄くまぶす。^玉ねぎは5mm幅の薄切りにする。ブロッコリーは小房に分けて塩ゆで2分。^しょうゆ・みりん・はちみつを合わせる。^フライパンにサラダ油を中火で熱し、豚肉を盛りつけ面から入れて2分半、焼き色をつける。返して弱火で2分焼き、空いたところで玉ねぎを焼く。^余分な脂をふき、合わせ調味料を加えて中火で1分、肉を返しながら照りよくからめる。^ブロッコリーと盛り合わせ、たれをかける。
チキンソテー|鶏肉は厚い部分を開いて厚みを均一にし、筋を切る。焼く20分前に塩・こしょうをふり、出てきた水分をふく。^じゃがいもは1cm厚さに切り、レンジ600Wで3分加熱する。いんげんは筋を取る。^フライパンにオリーブオイルを入れて鶏肉を皮目を下にして置き、中火にかける。^フライ返しで押さえつけながら8分、皮がこんがりパリッとするまで焼く（重しに水を入れた鍋をのせると均一に焼ける）。脂が出たらふき取り、空いたところでじゃがいもといんげんを焼く。^返して弱火で3〜4分焼く。^2分休ませてから切り分け、野菜とレモンを添える。
チキンのトマト煮|鶏肉は一口大に切り、塩・こしょうをふる。玉ねぎは薄切り、なすは乱切り、にんにくはみじん切り、しめじはほぐす。^フライパンにオリーブオイルを中火で熱し、鶏肉を皮目から4分、こんがり焼き色をつけて返し、1分焼いて取り出す。^同じフライパンでにんにく・玉ねぎを2分、なす・しめじを加えて2分炒める。^トマト缶・コンソメ・砂糖を加えて煮立て、鶏肉を戻す。^ふたをして弱めの中火で15分煮込む。^ふたを取って中火で3分、ソースを煮詰め、塩・こしょうで調える。

寄せ鍋|鶏肉はひと口大、たらは塩をふって10分おき、水気を拭いて3等分。えびは背わたを取る。^白菜はざく切り、長ねぎは斜め切り、しいたけは飾り包丁、豆腐は8等分にする。^たらは熱湯をさっとかけて霜降りにし、冷水で洗う（臭みとぬめりを取る、プロの下処理）。^土鍋にだし・しょうゆ・みりん・酒・塩を入れて中火で煮立てる。^鶏肉と白菜の芯を入れて5分煮る。アクを取る。^たら・えび・しいたけ・長ねぎ・豆腐・白菜の葉を加え、ふたをして中火で5〜6分、たらに火が通るまで煮る（えびは煮すぎると硬くなるので後から入れてもよい）。^〆は雑炊がおすすめ：残った汁にご飯を入れて3分煮て、溶き卵を回し入れ、ふたをして火を止め1分蒸らす。
水炊き|鶏もも肉はひと口大に切り、熱湯にさっとくぐらせて霜降りにし、冷水で洗う（スープが濁らない）。^鍋に水・酒・鶏肉を入れて強火にかけ、沸騰したらアクを丁寧にすくう。弱めの中火にして20分、ふたをせずに煮てスープを取る（鶏のうまみが白く溶け出す）。^まずスープだけを器に取り、塩ひとつまみを入れて味わうのが博多流。^白菜の芯・しめじ・長ねぎ・豆腐を入れて中火で5分、白菜の葉を加えて2分煮る。^取り皿にポン酢を入れ、小ねぎ・あればもみじおろしを添えて食べる。^〆はスープにご飯を入れて雑炊、またはちゃんぽん麺を。
もつ鍋|もつは熱湯で2分下ゆでしてざるに上げ、水で洗って余分な脂と臭みを落とす（下ゆでしすぎると脂のうまみが抜けるので2分まで）。^キャベツはざく切り、にらは5cm長さ、にんにくは薄切り、赤唐辛子は種を取って小口切り。^鍋に水・鶏がらスープの素・しょうゆ・みりん・酒を入れて中火で煮立てる。^キャベツを山盛りにのせ、もつをのせ、にらを放射状に並べ、中央ににんにくと唐辛子を置く。^ふたをして中火で8〜10分、キャベツがしんなりしてかさが減るまで煮る（もつは煮すぎると脂が抜けて縮むので沸騰後はやや弱め）。^〆はちゃんぽん麺を入れて3分。煮詰まったスープが絡んで絶品。
キムチ鍋|豚肉は5cm長さ、豆腐は8等分、にらは5cm長さ、長ねぎは斜め切り、えのきは石づきを取ってほぐす。^鍋にごま油を中火で熱し、豚肉を2分炒めて色を変える。キムチを加えて2分、汁気を飛ばすようにしっかり炒める（キムチを炒めると酸味が丸くなり、うまみが出る）。^水・鶏がらスープの素を加えて煮立て、味噌・しょうゆ・コチュジャンを溶き入れる。^豆腐・長ねぎ・えのきを入れて中火で5分煮る。^にらを入れて30秒で火を止める。^〆はラーメンを入れて3分、またはご飯とチーズを入れてリゾット風に。
豆乳鍋|鶏肉はひと口大、白菜はざく切り、しめじはほぐす、水菜は5cm長さ、豆腐は8等分に切る。^鍋に水・和風だしの素を入れて中火で煮立て、鶏肉と白菜の芯を入れて5分煮る。アクを取る。^しめじ・豆腐・白菜の葉を加えて3分煮る。^火を弱め、味噌を溶き入れてから豆乳としょうゆを加える。ここからは弱火で温めるだけ（沸騰させると豆乳が分離してもろもろになる）。^フツフツと小さな泡が出てきたら水菜を入れ、30秒で完成。^〆はご飯とチーズでリゾット、またはラーメン。
おでん|大根は3cm厚の輪切りにして皮を厚めにむき、面取りして片面に十字の隠し包丁を入れる。米のとぎ汁（または米大さじ1を入れた水）で20分、竹串がすっと通るまで下ゆでする（えぐみが抜け、味がしみやすい）。^卵は沸騰した湯で10分ゆでて殻をむく。こんにゃくは三角に切って隠し包丁を入れ、2分下ゆで。^ちくわ・さつま揚げ・厚揚げは熱湯をかけて油抜きする（だしが濁らず、味がしみる）。^土鍋にだし・薄口しょうゆ・みりん・塩を入れて中火で温め、大根・卵・こんにゃく・厚揚げを入れる。^沸騰させずに、ごく弱火（表面がゆらゆら揺れる程度）で30分煮る（ぐらぐら煮ると練り物がふくらみ、だしが濁る）。^ちくわ・さつま揚げを加えて10分、はんぺんは最後に3分（煮すぎると溶ける）。^火を止めて30分以上おくと冷める過程で味がしみる。食べる前に温め直し、からしを添える。
ちゃんこ鍋|つくね：鶏ひき肉にすりおろししょうが・片栗粉・塩少々（分量外）・長ねぎのみじん切り少々を混ぜ、粘りが出るまで1分練る。^鶏もも肉はひと口大、キャベツはざく切り、長ねぎは斜め切り、にんじんは薄い輪切り、油揚げは熱湯をかけて短冊切り、しいたけは飾り包丁。^鍋に水・鶏がらスープの素・しょうゆ・酒・みりん・塩を入れて中火で煮立て、鶏もも肉とにんじんを入れて5分煮る。^つくねをスプーン2本で丸めて落とし入れ、浮いてくるまで4〜5分煮る。アクを取る。^キャベツ・長ねぎ・しいたけ・油揚げを加え、ふたをして5分煮る。^〆はうどんかご飯で。
トマト鍋|鶏肉はひと口大に切って塩・こしょう（分量外）、ウインナーは斜め半分、キャベツはざく切り、玉ねぎはくし形、ブロッコリーは小房、しめじはほぐす。にんにくはみじん切り。^鍋にオリーブオイルとにんにくを入れ弱火で1分、香りが出たら中火で鶏肉を皮目から焼き、2分焼き色をつける（焼き目がスープのコクになる）。^玉ねぎを加えて2分炒め、トマト缶をつぶしながら加え、3分煮て酸味を飛ばす。^水・コンソメを加えて煮立て、キャベツ・ウインナー・しめじを入れて中火で8分煮る。^ブロッコリーを加えて3分煮る。^〆はご飯とピザ用チーズでリゾット、またはゆでたパスタで。
湯豆腐|土鍋に水と昆布10cm（あれば）を入れて30分おく。^豆腐は大きめの8等分、長ねぎは斜め薄切り、春菊は葉を摘む。^薬味：小ねぎ・かつお節・しょうがのすりおろし。ポン酢を用意する。^土鍋を弱めの中火にかけ、豆腐を入れる。湯がふつふつしてきたら弱火にし、豆腐がゆらりと浮き上がってきたらすくいどき（3〜5分。煮立てると豆腐にすが立って硬くなる）。^長ねぎと春菊はさっと20秒ほど温めて。^ポン酢と薬味で食べる。
石狩鍋|鮭は3等分に切り、塩をふって10分おく。熱湯にさっとくぐらせて冷水で洗う（臭みとうろこを取る）。^じゃがいもは4等分して水にさらす、にんじんは輪切り、白菜はざく切り、長ねぎは斜め切り、しいたけは飾り包丁、豆腐は8等分。^鍋にだし・酒・みりんを入れ、じゃがいもとにんじんを入れて中火で10分、竹串が通るまで煮る。^味噌を溶き入れ、鮭・白菜・しいたけ・豆腐・長ねぎを入れて中火で6〜7分煮る（味噌を入れた後は煮立てすぎない）。^火を止める直前にバターをのせる（北海道流。コクが一段上がる）。山椒をふっても。
豚汁|大根・にんじんは5mm厚のいちょう切り、ごぼうはささがきにして水に3分さらす。こんにゃくはちぎって2分下ゆで。長ねぎは小口切り。豚肉は3cm長さ。^鍋にごま油を中火で熱し、豚肉を1分炒め、色が変わったら大根・にんじん・ごぼう・こんにゃくを加えて2分炒める（野菜に油をまとわせると甘みとコクが増す）。^だしを加えて強火で煮立て、アクを丁寧にすくう。弱めの中火にしてふたをし、10〜12分、大根がやわらかくなるまで煮る。^火を弱め、味噌の2/3を溶き入れて5分煮る（具に味をしみ込ませる）。^最後に残りの味噌を溶き入れて香りを立て、長ねぎを加えて沸騰直前で火を止める。七味を添えて。
豆腐とわかめの味噌汁|わかめは水に5分つけてもどし、水気を絞る。豆腐は1.5cm角、長ねぎは小口切り。^鍋にだしを入れて中火で温め、豆腐を入れて2分、豆腐の中まで温める。^火を弱め、味噌をお玉の中で溶きのばしてから入れる。^わかめと長ねぎを加え、表面がふつふつと揺れる「煮えばな」で火を止める（沸騰させると味噌の香りが飛ぶ）。
なめこ汁|なめこはざるに入れてさっと水洗いし、余分なぬめりを落とす（ぬめりは少し残すのがおいしさ）。豆腐は1cm角に切る。^鍋にだしを入れて中火で温め、豆腐となめこを入れて2分煮る。^火を弱めて味噌を溶き入れ、煮えばなで火を止める。^器に盛り、小口切りの小ねぎを散らす。好みで七味を。
けんちん汁|豆腐はペーパーに包んで15分水切りする。大根・にんじんはいちょう切り、ごぼうはささがきにして水にさらす、里芋は皮をむいて1cm厚に切り、塩もみしてぬめりを洗う。しいたけは薄切り。^鍋にごま油を中火で熱し、ごぼう・大根・にんじん・里芋・しいたけを3分炒める。^豆腐を手で崩しながら加え、1分炒める（豆腐を炒めるのがけんちんの由来。香ばしさがだしになる）。^だしを加えて煮立て、アクを取り、弱めの中火でふたをして12分、里芋がやわらかくなるまで煮る。^しょうゆ・みりん・塩で調え、2分煮る。好みで小ねぎを。
あさりの味噌汁|あさりは3%の塩水に浸して暗いところで1時間砂抜きし、さらに真水に10分つけて塩抜きする。殻をこすり合わせて洗う。^鍋に水とあさりを入れて中火にかける（水から入れると、うまみがじっくり出る）。^沸騰直前にアクを取り、殻が開いたら弱火にする（開いてから長く煮ると身が硬くなる）。^味噌を溶き入れ、煮えばなで火を止める。^器に盛り、小ねぎを散らす。
ミネストローネ|ベーコン・玉ねぎ・にんじん・セロリ・じゃがいも・キャベツはすべて1cm角に切りそろえる（火の通りが均一になり、スプーンで食べやすい）。にんにくはみじん切り。^鍋にオリーブオイルとにんにくを入れ弱火で1分、香りが出たらベーコンを入れて1分炒める。^玉ねぎ・にんじん・セロリを加え、中火で5分、玉ねぎが透き通って甘い香りがするまでじっくり炒める（ソフリット。スープの土台になる）。^じゃがいもとキャベツを加えて1分炒め、トマト缶を加えて2分煮る。^水・コンソメを加えて煮立て、アクを取って弱めの中火で15分煮る。^塩・こしょうで調える。器に盛ってオリーブオイルをひと回し、粉チーズを。
コーンスープ|玉ねぎは薄切りにする。^鍋にバターを弱めの中火で溶かし、玉ねぎを4分、焦がさないように透き通ってしんなりするまで炒める（甘みを引き出す）。^コーンクリーム缶・コンソメを加えて混ぜ、1分温める。^牛乳を少しずつ加えて混ぜ、弱火で5分、ふつふつするまで温める（牛乳は沸騰させると膜が張り分離するので弱火で）。^よりなめらかにしたい場合はミキサーにかけてこす。塩・こしょうで調え、パセリやクルトンを散らす。冷やしてもおいしい。
クラムチャウダー|あさりは砂抜きして洗う。鍋にあさりと白ワインを入れ、ふたをして中火で3分蒸す。口が開いたら身を殻から外し、蒸し汁はこして取っておく（うまみの素なので捨てない）。^ベーコンは1cm幅、玉ねぎ・じゃがいも・にんじんは1cm角に切る。^鍋にバターを中火で溶かし、ベーコンを1分、玉ねぎ・にんじんを加えて3分炒め、じゃがいもを加えて1分炒める。^弱火にして薄力粉をふり入れ、1分炒めて粉っぽさをなくす。^水とあさりの蒸し汁を少しずつ加えて混ぜ、コンソメを加え、ふたをして10分煮る。^牛乳を加えて弱火で5分、とろみがつくまで温め（沸騰させない）、あさりの身を戻して1分。塩・こしょうで調える。
オニオングラタンスープ|玉ねぎは繊維に沿ってごく薄切りにする。^鍋にバターを中火で溶かし、玉ねぎを入れて5分炒める。しんなりしたら弱めの中火にし、20〜25分、ときどき鍋底をこそげながら飴色になるまで炒める（焦げつきそうになったら水大さじ1を加えてこそげる。この繰り返しで深いコクが生まれる）。^水とコンソメを加えて煮立て、弱火で10分煮る。塩・こしょうで調える。^フランスパンはトースターで2分、カリッとするまで焼く。^耐熱の器にスープを注ぎ、パンを浮かべてチーズをたっぷりのせる。^230℃のオーブン（またはトースター）で6〜8分、チーズがぐつぐつ溶けて焼き色がつくまで焼く。器が熱いので注意。
かぼちゃのポタージュ|かぼちゃは種とわたを取って皮をむき、2cm角に切る（皮を残すと色がくすむ）。玉ねぎは薄切り。^鍋にバターを中火で溶かし、玉ねぎを3分、しんなりするまで炒める。かぼちゃを加えて1分炒める。^水とコンソメを加え、ふたをして弱めの中火で10〜12分、かぼちゃが崩れるほどやわらかくなるまで煮る。^粗熱を取ってミキサー（またはブレンダー）で1分、なめらかになるまで攪拌する。^鍋に戻して牛乳を少しずつ加えながら弱火で温め、沸騰直前で止める。塩で調える。^器に盛り、生クリームやパセリを飾る。冷やしてもおいしい。
じゃがいものポタージュ|じゃがいもは薄切りにして水に5分さらす（でんぷんを落としてなめらかに）。玉ねぎは薄切り。^鍋にバターを弱めの中火で溶かし、玉ねぎを4分、色づけずにしんなりするまで炒める。じゃがいもを加えて1分炒める。^水とコンソメを加え、ふたをして弱めの中火で12分、じゃがいもが崩れるまで煮る。^粗熱を取ってミキサーで1分攪拌する（じゃがいもは攪拌しすぎると粘るので1分まで）。^鍋に戻し、牛乳と生クリームを加えて弱火で温め、塩で調える。冷やせばヴィシソワーズに。
中華コーンスープ|鍋に水・鶏がらスープの素を入れて中火で煮立て、コーンクリーム缶を加えて混ぜ、2分煮る。^塩で調える。片栗粉を同量の水で溶き、火を弱めて回し入れ、30秒混ぜてとろみをつける（とろみが先だと卵がふんわり浮く）。^再び沸騰させ、溶き卵を細く回し入れる。10秒触らず、卵がふわっと浮いたら大きくひと混ぜして火を止める。^器に盛り、小口切りの小ねぎを散らす。
酸辣湯|しいたけ・たけのこは細切り、豆腐は1cm角の棒状に切る。^鍋に水・鶏がらスープの素を入れて中火で煮立て、しいたけ・たけのこを入れて3分煮る。^豆腐を加え、しょうゆ・こしょうで調えて1分煮る。^水溶き片栗粉（片栗粉大さじ1＋水大さじ2）を回し入れ、混ぜながら30秒しっかりとろみをつける。^溶き卵を細く回し入れ、10秒待ってから大きく混ぜる。^火を止めてから酢を加える（酢は加熱すると香りが飛ぶので最後に）。器に盛り、ラー油と黒こしょうをたっぷり。
わかめスープ|わかめは水に5分つけてもどし、水気を絞る。長ねぎは斜め薄切り。^鍋にごま油を中火で熱し、わかめを1分炒める（炒めるとうまみと香りが増す韓国風）。^水と鶏がらスープの素を加えて煮立て、長ねぎを加えて2分煮る。^しょうゆで調え、いりごまを指でひねりながら加える。
ワンタンスープ|あん：ひき肉・みじん切りの長ねぎ・すりおろししょうが・しょうゆ・ごま油・塩少々を粘りが出るまで1分練る。^ワンタンの皮の中央にあんを小さじ1弱のせ、縁に水をつけて三角に折り、両端を合わせて留める（あんは少なめが皮のつるんとした食感を楽しむコツ）。^チンゲン菜は根元を4等分して長さを半分に切る。^鍋に水と鶏がらスープの素を入れて中火で煮立て、チンゲン菜の軸を入れて1分煮る。^ワンタンを1つずつ入れ、浮いてきてから1分半煮る（計3分ほど）。チンゲン菜の葉を加えて30秒。^塩で調え、器に盛ってごま油を数滴。
トムヤムクン|えびは背わたを取る。マッシュルームは半分、ミニトマトは半分、しょうがは薄切り（あればレモングラス・こぶみかんの葉・ガランガルを）。^鍋に水・鶏がらスープの素・しょうがを入れて中火で煮立て、3分煮て香りを出す。^豆板醤（あればナムプリックパオ）とマッシュルームを加えて2分煮る。^えびとミニトマトを加え、えびの色が変わるまで1分半煮る（えびは煮すぎない）。^ナンプラー・砂糖で調え、火を止めてからレモン汁を加える（酸味の香りを生かすため火を止めてから）。^器に盛り、パクチーをのせる。
参鶏湯|もち米はさっと洗い、30分水につける。にんにくは皮をむき、しょうがは薄切り、長ねぎの青い部分はぶつ切り、白い部分は小口切りにする。^手羽元は熱湯で1分下ゆでして水で洗う（スープが澄む）。^鍋に水・酒・手羽元・にんにく・しょうが・ねぎの青い部分・水気を切ったもち米を入れて強火にかける。沸騰したらアクを取る。^弱火にしてふたを少しずらし、40分煮る。ときどき底から混ぜてもち米が焦げつかないようにする（もち米がとろりと溶けてスープにとろみがつく）。^ねぎの青い部分を取り出し、塩で調える。^器に盛り、小口切りの長ねぎを散らす。各自で塩とこしょうを加えながら食べる。
スンドゥブチゲ|あさりは砂抜きして洗う。豚肉は3cm長さ、にらは3cm長さ、にんにくはみじん切り。^土鍋（または小鍋）にごま油とにんにくを入れ弱火で1分、中火にして豚肉を1分炒め、キムチを加えて2分炒める。コチュジャンを加えて30秒炒める（唐辛子の辛みと香りを油に移す）。^水・鶏がらスープの素・しょうゆ・あさりを加え、中火で煮立てる。^豆腐をスプーンで大きくすくって加え、3分煮る。あさりの口が開いたら味を見る。^卵を割り落とし、にらをのせて火を止める（余熱で卵を半熟に）。ぐつぐつのまま食卓へ。
ポテトサラダ|じゃがいもは皮をむいて4等分し、水から入れて中火で15分、竹串がすっと通るまでゆでる。^湯を捨て、鍋を弱火にかけて1分ゆすり、水分を飛ばして粉ふきにする（水っぽさを防ぐ一番大事な工程）。^熱いうちにフォークで粗くつぶし、酢・塩・こしょうをふって混ぜ、下味をつける（熱いうちが味を吸う）。そのまま冷ます。^きゅうりは薄い輪切りにして塩少々でもみ、5分おいて水気をしっかり絞る。玉ねぎは薄切りにして水に5分さらし、水気を絞る。にんじんはいちょう切りにして3分ゆでる。ハムは短冊切り。^じゃがいもが人肌まで冷めたら（熱いとマヨネーズが分離する）、具とマヨネーズを加えてさっくり混ぜる。^冷蔵庫で30分冷やすと味がなじむ。
マカロニサラダ|マカロニは塩を入れた湯で表示時間より1分長くゆでる（冷めると硬くなるので、やわらかめに）。ざるに上げて水気を切る。^熱いうちに酢・塩少々をからめ、下味をつけて冷ます。^きゅうりは薄い輪切りにして塩もみし、5分おいて水気を絞る。にんじんはいちょう切りにして3分ゆでる。ハムは短冊切り。^マカロニが冷めたら具とマヨネーズを加えて混ぜ、塩・こしょうで調える。^冷蔵庫で20分冷やすと味がなじむ。
コールスロー|キャベツは芯を除いて3mm幅のせん切り、にんじんはせん切りにする。^ボウルに入れて塩小さじ1/3（分量外）をふって混ぜ、10分おく。^しんなりしたら手でぎゅっと水気を絞る（水気を残すと味がぼやけ、時間とともに水っぽくなる）。^マヨネーズ・酢・砂糖・塩を混ぜてドレッシングを作り、キャベツ・にんじん・汁気を切ったコーンを和える。^冷蔵庫で15分以上おいて味をなじませる。
シーザーサラダ|卵は沸騰した湯に入れて6分半ゆで、冷水にとって殻をむく（とろりとした半熟に）。^フランスパンは1.5cm角に切り、トースターで3〜4分カリッとするまで焼いてクルトンにする。ベーコンは1cm幅に切り、フライパンで弱めの中火で3分、カリカリになるまで焼く。^レタスは手でちぎって冷水に5分つけてパリッとさせ、水気をしっかり切る（水気が残るとドレッシングが薄まる）。^ドレッシング：マヨネーズ・牛乳・粉チーズ・レモン汁・すりおろしにんにく少々・黒こしょうを混ぜる。^器にレタスを盛り、ベーコン・クルトンを散らし、ドレッシングをかけ、半熟卵を割ってのせる。粉チーズと黒こしょうを追加で。
カプレーゼ|トマトとモッツァレラは冷蔵庫でよく冷やしておく。^トマトはヘタを取って7mm厚の輪切りにし、ペーパーにのせて余分な水分を取る。モッツァレラも同じ厚さに切り、ペーパーで水気を拭く。^器にトマトとモッツァレラを交互に重ねて並べ、間にバジルの葉を挟む。^食べる直前に塩をふり、オリーブオイルを回しかけ、黒こしょうをひく（早く塩をふるとトマトから水が出る）。
アボカドサラダ|玉ねぎはみじん切りにして水に5分さらし、ペーパーで水気を絞る（辛みを抜く）。^トマトは1.5cm角に切り、ペーパーで水気を取る。^アボカドは縦にぐるりと包丁を入れてねじって割り、種を取って皮をむき、1.5cm角に切ってすぐレモン汁をからめる（変色防止）。^ボウルにすべてを入れ、オリーブオイル・塩・こしょうで和える。アボカドがつぶれないよう、ゴムベラでさっくりと。
大根サラダ|大根は皮をむいて5cm長さのせん切りにし、冷水に5分さらしてパリッとさせる。^水菜は5cm長さに切る。^大根と水菜をざるに上げ、水気をしっかり切る（サラダスピナーがあればなお良い）。^器に盛ってかつお節をのせ、ポン酢とごま油を混ぜたドレッシングを食べる直前にかける。
春雨サラダ|春雨は熱湯で表示時間通り（3〜4分）ゆで、ざるに上げて水で洗い、水気を切って食べやすく切る。^きゅうりはせん切りにして塩少々でもみ、5分おいて水気を絞る。にんじんはせん切りにして30秒ゆでる。ハムは細切り。^酢・しょうゆ・砂糖・ごま油を混ぜて、砂糖が溶けるまでよく混ぜる。^春雨が温かいうちにたれを半量からめる（春雨に味がよくしみる）。^冷めたら具と残りのたれを加えて和え、いりごまをふる。冷蔵庫で15分冷やす。
もやしのナムル|もやしはひげ根を取る（ひと手間でシャキッとした口当たりに）。^沸騰した湯にもやしを入れ、1分ゆでてざるに上げる（ゆですぎると水っぽくなる）。^水にとらずに広げて冷まし、手で軽く絞って水気を切る。^熱いうちにごま油・鶏がらスープの素・塩・すりおろしにんにくを混ぜて和え、いりごまをふる。
ほうれん草のおひたし|ほうれん草は根元に十字の切り込みを入れ、水を張ったボウルで根元の泥をよく洗う。^たっぷりの沸騰した湯に塩少々を入れ、根元から入れて20秒、葉まで沈めてさらに30秒ゆでる。^すぐ冷水にとって色止めし（えぐみも抜ける）、根元をそろえて水気をしっかり絞る。^4cm長さに切り、もう一度軽く絞る。^だしとしょうゆを合わせ、半量をほうれん草にかけて絞る（しょうゆ洗い。水っぽさが抜ける）。器に盛り、残りのだしじょうゆをかけてかつお節をのせる。
ほうれん草のごま和え|ほうれん草は根元をよく洗い、塩少々を入れた熱湯で根元20秒、全体で計50秒ゆでる。^冷水にとってしっかり絞り、4cm長さに切ってもう一度絞る。^すりごま・砂糖・しょうゆを混ぜて和え衣を作る（いりごまをすり鉢ですると香りが格段に良い）。^食べる直前にほうれん草を和える（早く和えると水が出る）。
いんげんのごま和え|いんげんはヘタを切り、塩少々を入れた熱湯で2分、鮮やかな緑色になるまでゆでる。^ざるに上げて広げて冷ます（水にとると水っぽくなる）。3〜4cm長さに切る。^すりごま・しょうゆ・砂糖を混ぜ、いんげんを和える。
小松菜と油揚げの煮びたし|小松菜は根元を落として4cm長さに切り、茎と葉に分ける。油揚げは熱湯をかけて油抜きし、短冊切りにする。^鍋にだし・しょうゆ・みりんを入れて中火で煮立て、油揚げを入れて2分煮る。^小松菜の茎を入れて1分、葉を加えて1分煮る（茎から入れて火の通りを揃える）。^火を止め、そのまま10分おいて味を含ませる。煮汁ごと器に盛る。
きんぴらごぼう|ごぼうはたわしで皮をこそげ、5cm長さのせん切り（またはささがき）にして水に3分さらしてアクを抜く（さらしすぎると香りも抜ける）。にんじんも同じ大きさのせん切り。赤唐辛子は種を取って小口切り。^フライパンにごま油と赤唐辛子を中火で熱し、水気を切ったごぼうを入れて3分炒める。^にんじんを加えて1分炒め、しんなりしたら砂糖・みりん・しょうゆを順に加える。^中火で2〜3分、汁気がなくなって照りが出るまで炒め煮にする（汁気を飛ばし切ると味がぼやけない）。^いりごまをふる。
れんこんのきんぴら|れんこんは皮をむいて3mm厚の半月切りにし、酢水に5分さらしてアクを抜き、水気を切る（白くシャキッと仕上がる）。^フライパンにごま油と赤唐辛子の小口切りを中火で熱し、れんこんを3分、透き通るまで炒める。^砂糖・みりん・しょうゆを加え、中火で2分、汁気がなくなるまで炒め絡める。^好みでいりごまを。
ひじきの煮物|ひじきはたっぷりの水に20分つけてもどし（2.5倍ほどに増える）、ざるに上げて洗い、水気を切る。^にんじんは細切り、油揚げは熱湯をかけて油抜きし細切り。大豆は水気を切る。^鍋にサラダ油を中火で熱し、ひじきを2分炒める（磯臭さが抜け、コクが出る）。にんじん・油揚げ・大豆を加えて1分炒める。^だし・砂糖・みりんを加えて煮立て、落としぶたをして中火で8分煮る。^しょうゆを加えてさらに5分、煮汁がほとんどなくなるまで煮る（しょうゆは後入れで香りを残す）。^火を止めてそのまま冷ますと味がしみる。
切り干し大根の煮物|切り干し大根はさっと洗ってほこりを落とし、たっぷりの水に15分つけてもどす。もみ洗いして水気を絞り、食べやすく切る。もどし汁は100ml取っておく（甘みとうまみが出ている）。^にんじんは細切り、油揚げは油抜きして細切り。^鍋にごま油を中火で熱し、切り干し大根を2分炒め、にんじん・油揚げを加えて1分炒める。^だし・もどし汁・砂糖・みりんを加えて煮立て、落としぶたをして弱めの中火で10分煮る。^しょうゆを加え、5分煮て煮汁が少し残るくらいで火を止める。冷める間に味がしみる。
白和え|豆腐はペーパーで包み、重しをのせて30分水切りする（重さが2/3になるのが目安。ここが水っぽくならない鍵）。^ほうれん草は塩ゆでして水気を絞り3cm長さ。にんじんは3cm長さの細切り、こんにゃくも細切りにする。^小鍋にだし100ml（分量外）・薄口しょうゆ小さじ1/2・砂糖小さじ1（各分量外）とにんじん・こんにゃくを入れ、中火で5分、汁気がなくなるまで煮て冷ます（下味をつけると和え衣とよくなじむ）。^ボウルに豆腐を入れてゴムベラでなめらかにつぶし（裏ごしすると料亭風）、すりごま・砂糖・薄口しょうゆ・塩を混ぜる。^具の汁気をよく切って和える。食べる直前に和えるのがベスト。
なすの煮びたし|なすはヘタを切り落として縦半分に切り、皮目に斜めに細かい切り込みを入れる（味がしみ、皮がやわらかくなる）。3等分に切る。^フライパンにサラダ油を中火で熱し、なすを皮目から入れて2分焼き、返して2分焼く。全体がしんなりするまで。^鍋にだし・しょうゆ・みりんを入れて煮立て、焼いたなすを入れて中火で3分煮る。^火を止めてすりおろしたしょうがを加え、そのまま冷ます（冷める間に味がしみる）。冷蔵庫で冷やしてもおいしい。
冷奴|豆腐はペーパーに包んで冷蔵庫で10分おき、軽く水切りする（水っぽさが抜けて味が締まる）。^小ねぎは小口切り、しょうがはすりおろす。^豆腐を食べやすく切って器に盛り、小ねぎ・しょうが・かつお節をのせる。^食べる直前にしょうゆをかける。
枝豆|枝豆は枝から外し、さやの両端をキッチンばさみで少し切り落とす（塩味が中にしみる）。^ボウルに枝豆と塩小さじ1/2を入れ、こすり合わせるように1分もんで産毛を取る。洗わずにそのまま使う。^たっぷりの湯（1L）を沸かして塩小さじ1/2を入れ、もんだ塩ごと枝豆を入れて強火で4〜5分ゆでる。1つ食べてみて、少し歯ごたえが残るくらいで引き上げる。^ざるに上げ、水にとらずにうちわであおいで冷ます（水っぽくならず、色鮮やか）。熱いうちに塩少々をふる。
きゅうりとわかめの酢の物|きゅうりは薄い輪切りにして塩をふって5分おき、しんなりしたら水気をしっかり絞る。^わかめは水に5分つけてもどし、熱湯にさっとくぐらせて冷水にとる（色が鮮やかになり、磯臭さが抜ける）。水気を絞って食べやすく切る。^酢・砂糖・しょうゆを混ぜ、砂糖が溶けるまで混ぜる（あればだし大さじ1を足すとまろやか）。^食べる直前にきゅうりとわかめを和える。あればしらすやしょうがのせん切りを。
きゅうりの浅漬け|きゅうりはヘタを落とし、ピーラーで縞目に皮をむく（味がしみやすい）。めん棒で軽く叩いてひびを入れ、手で乱切りにする。^ポリ袋にきゅうり・塩・和風だしの素を入れてよくもむ。あれば昆布2cm・赤唐辛子少々を加える。^空気を抜いて口を閉じ、冷蔵庫で30分〜1時間漬ける。^軽く水気を切って器に盛る。
たたききゅうり|きゅうりはヘタを落とし、ポリ袋に入れてめん棒で叩いて割り、手で食べやすくちぎる（断面がでこぼこになり、味がよく絡む）。^塩少々（分量外）をふって5分おき、出た水気を捨てる。^ごま油・鶏がらスープの素・酢・すりおろしにんにくを加えてもみ込み、冷蔵庫で10分なじませる。^器に盛り、いりごまをふる。好みでラー油を。
かぼちゃの煮物|かぼちゃは種とわたを取り、4cm角に切る。皮をところどころむき、角を面取りする（煮崩れ防止と味しみのため）。^鍋に皮を下にして重ならないように並べ、水・砂糖を入れて中火にかける。^煮立ったら落としぶたをして弱めの中火で5分煮る（砂糖を先に入れてやわらかくしながら甘みを含ませる）。^みりん・しょうゆを加え、再び落としぶたをして5〜7分、竹串がすっと通るまで煮る。^火を止めて落としぶたをしたまま10分おき、味を含ませる（煮崩れないよう、鍋の中で動かさない）。
里芋の煮っころがし|里芋は洗って乾かしてから皮をむく（乾いていると手がかゆくなりにくい）。大きいものは半分に切る。^塩小さじ1（分量外）をまぶしてもみ、ぬめりを水で洗い流す。^鍋に里芋とかぶるくらいの水を入れて中火で5分下ゆでし、ざるに上げて洗う（ぬめりを取ると味がしみやすい）。^鍋にだし・砂糖・みりん・里芋を入れて中火で煮立て、落としぶたをして弱めの中火で10分煮る。^しょうゆを加えてさらに8分煮る。^落としぶたを取り、強めの中火で鍋をゆすって転がしながら2分、煮汁を煮詰めて照りよく絡める。
ふろふき大根|大根は3cm厚の輪切りにして皮を厚めにむき、面取りして片面に十字の隠し包丁を入れる。^鍋に大根とかぶるくらいの米のとぎ汁を入れ、中火で20分、竹串がすっと通るまで下ゆでする。水で洗う。^鍋にだしと大根を入れ、ごく弱火で20分、だしを含ませるようにコトコト煮る（あれば昆布を敷くと風味が良い）。^田楽味噌：小鍋に味噌・砂糖・みりん・大根の煮汁大さじ2を入れ、弱火で3分、ぽってりとつやが出るまで練る。^器に大根を盛り、煮汁を少し張って田楽味噌をかける。ゆずの皮をのせると香りが立つ。
菜の花の辛子和え|菜の花は根元を1cm落とし、冷水に10分つけてシャキッとさせる。^塩少々を入れた熱湯で茎から入れて30秒、全体を沈めてさらに30秒ゆでる。^冷水にとって色止めし、水気を絞って3cm長さに切る。^だしとしょうゆ少々を合わせて菜の花にかけて軽く絞る（下味）。^だし・しょうゆ・からしを混ぜて和え衣にし、和える。
オクラのおかか和え|オクラはガクの周りの硬い部分をくるりとむき、塩でこすって産毛を取る（板ずり）。^塩をつけたまま熱湯で1分半ゆで、冷水にとる。^水気を拭いて斜め半分か小口切りにする。^しょうゆとかつお節で和える。
長いものバター醤油焼き|長いもは皮付きのままひげ根をコンロの火であぶって取り、1.5cm厚の輪切りにする（皮付きで香ばしく、崩れにくい）。^フライパンにバターの半量を中火で熱し、長いもを並べて3分、こんがり焼き色がつくまで触らずに焼く。^返して2〜3分、両面焼き色がついたら残りのバターとしょうゆを回し入れ、10秒絡める（しょうゆが焦げる香りが決め手）。^器に盛り、好みで黒こしょうや青のりを。

アボカドトースト|食パンはトースターで3分、こんがり焼く。^アボカドは半分に割って種を取り、スプーンでくり抜いてボウルに入れる。レモン汁・塩を加え、フォークで粗くつぶす（少し粒感を残すとおいしい）。^焼きたてのトーストに厚めに塗り、オリーブオイルを回しかけて黒こしょうをひく。好みで目玉焼きや生ハムをのせて。
ホットドッグ|キャベツはせん切りにして、バター半量と塩・こしょう少々で中火で1分炒める（カレー粉少々を加えるのも定番）。^ウインナーは斜めに切り込みを入れ、フライパンで残りのバターで中火で2分、転がしながら焼く。^パンに切り込みを入れ、トースターで1分温める。^キャベツとウインナーを挟み、ケチャップとマスタードをかける。
バインミー|なます：大根とにんじんを4cm長さのせん切りにし、塩少々をふって5分おき、水気を絞る。酢・砂糖を混ぜて和え、15分以上漬ける。^鶏肉はナンプラー・しょうゆ・砂糖少々を絡めて10分おく。^フライパンを中火で熱し、鶏肉を皮目から入れて5分、パリッとするまで焼く。返して弱めの中火で4分焼き、薄切りにする。^フランスパンを2等分して横に切り込みを入れ、トースターで2分温める（外はカリッと）。^内側にマヨネーズを塗り、鶏肉・汁気を切ったなます・薄切りのきゅうり・パクチーをたっぷり挟む。
ホットケーキ|ボウルに卵と牛乳を混ぜ、ホットケーキミックスを加えて泡立て器でぐるぐる15回ほど、粉っぽさが少し残るくらいでやめる（混ぜすぎるとふくらまない）。^フライパンを中火で1分熱し、濡れ布巾にのせて10秒冷ます（ジュッと音がすれば温度が均一になった合図）。^弱火にかけ、高い位置からお玉1杯分の生地を一気に流す（丸く厚く広がる）。^弱火で3分、表面にプツプツと穴が開いてきたら返す。^ふたをして弱火で2分焼く。竹串を刺して何もつかなければ完成。^バターをのせ、はちみつをかける。
プリン|カラメル：小鍋に砂糖30gと水大さじ1を入れ中火にかける。混ぜずに鍋をゆすりながら3〜4分、濃い茶色になったら火を止め、水大さじ1を加える（はねるので注意）。熱いうちに型に等分に流す。^牛乳と砂糖40gを鍋に入れ、弱火で混ぜながら砂糖を溶かす。60℃くらい（湯気が出る程度、沸騰させない）で火を止める。^卵をボウルに割りほぐし、泡立てないように箸で白身を切るように混ぜる。温めた牛乳を少しずつ加えて混ぜる。^ざるで2回こし、表面の泡をスプーンで取る（すが立たず、なめらかになる）。型に注ぐ。^フライパンに型を並べ、型の1/3の高さまで湯を注ぐ。ふきんで包んだふたをして、ごく弱火で12〜15分蒸す（火が強いとすが立つ）。^ゆすって全体がふるふる揺れたら火を止め、5分そのままおく。粗熱を取って冷蔵庫で2時間以上冷やす。
大学いも|さつまいもは皮付きのまま乱切りにし、水に10分さらしてアクを抜き、水気をしっかり拭く。^フライパンにさつまいもを入れ、揚げ油を1cm深さほど注ぐ。冷たい油から弱めの中火にかける（低温からじっくり加熱すると甘みが増し、中までほっくり）。^ときどき返しながら10〜12分、竹串がすっと通り、表面がカリッと薄く色づくまで揚げ焼きにする。^油をあけて（またはさつまいもを取り出して）、フライパンをきれいにする。砂糖・みりん・しょうゆを入れて中火にかけ、ふつふつと泡が大きくなるまで1〜2分煮詰める。^さつまいもを戻してたれを絡め、黒ごまをふる。^クッキングシートの上に広げて冷ます（くっつかず、表面のたれがパリッと固まる）。
スイートポテト|さつまいもは皮をむいて1cm厚の輪切りにし、水に10分さらす。^耐熱容器に入れてふんわりラップし、電子レンジ600Wで6〜7分、竹串がすっと通るまで加熱する。^熱いうちに裏ごし（またはマッシャーでなめらかに）し、砂糖・バター・生クリーム・卵黄の半量を加えて混ぜる。^鍋に移して弱火で2〜3分、練りながら水分を飛ばし、成形しやすい固さにする。^6等分して舟形に成形し、アルミカップにのせる。表面に残りの卵黄を水少々で溶いて塗る。^200℃のオーブン（またはトースター）で10〜15分、表面にこんがり焼き色がつくまで焼く。
かぼちゃプリン|カラメル：小鍋に砂糖30gと水大さじ1を中火にかけ、鍋をゆすりながら3〜4分、濃い茶色で火を止め水大さじ1を加える。型に流す。^かぼちゃは種・わた・皮を取り、耐熱容器でラップして600Wで5分加熱する。熱いうちに裏ごしする（なめらかさの決め手）。^かぼちゃに砂糖50gを混ぜ、溶き卵を少しずつ加えて混ぜる。温めた牛乳と生クリームを加えてのばし、ざるでこす。^型に注いでアルミホイルでふたをする。^天板に並べて熱湯を1cm深さ注ぎ、160℃のオーブンで35〜40分蒸し焼きにする（ゆすって中央が揺れなければ焼き上がり）。^粗熱を取って冷蔵庫で3時間以上冷やす。型の縁にナイフを入れ、皿をかぶせて返す。
焼きりんご|りんごは洗って芯をくり抜く（底は1cm残して貫通させない。バターが流れない）。皮に竹串で数か所穴をあける（皮が破裂しない）。^穴にバター・砂糖・シナモンを詰める。^耐熱皿にのせてアルミホイルでふんわり包み、180℃のオーブンで25〜30分焼く。竹串がすっと通り、皮にしわが寄ってきたら焼き上がり。^皿に残った汁をかけ、温かいうちにバニラアイスを添えて。
パンナコッタ|ゼラチンは水大さじ2にふり入れて5分おき、ふやかす（水にゼラチンをふる順番。逆だとダマになる）。^鍋に牛乳・生クリーム・砂糖を入れて中火にかけ、混ぜながら温める。縁がふつふつしてきたら（沸騰させない）火を止める。^ふやかしたゼラチンを加えて混ぜ、完全に溶かす（ゼラチンは沸騰させると固まる力が弱まる）。^ボウルの底を氷水に当て、ゴムベラで混ぜながらとろみがつくまで冷やす（バニラビーンズの粒が沈まず均一になる）。^器に注いで冷蔵庫で3時間以上冷やし固める。いちごソースやカラメルをかけて。
白玉ぜんざい|白玉粉に水を少しずつ加えながら、耳たぶくらいのやわらかさになるまでこねる（水は一度に入れず、様子を見て調整する）。^12等分して丸め、中央を指で軽くくぼませる（火の通りが均一になる）。^たっぷりの沸騰した湯に入れ、浮き上がってからさらに1分半ゆでる。冷水にとって冷やす。^鍋にあんこと水100ml（分量外）を入れ、弱めの中火で3分、混ぜながら温める。塩ひとつまみを加えると甘みが引き立つ。^器にぜんざいを注ぎ、白玉をのせる。
みたらし団子|白玉粉に豆腐を少しずつ加え、耳たぶくらいのやわらかさになるまでこねる（豆腐を使うと冷めても固くならない）。^直径2cmに丸め、たっぷりの沸騰した湯に入れる。浮いてきてからさらに2分ゆで、冷水にとる。^水気を切って竹串に3〜4個ずつ刺す。フライパンかグリルで2分、軽く焼き色をつけると香ばしい。^みたらしあん：小鍋に水・しょうゆ・砂糖・みりん・片栗粉を入れてよく混ぜ、中火にかける。^混ぜ続け、透明になってとろみがついたら30秒加熱して火を止める（すぐかたまるので混ぜ続ける）。^団子にたっぷりかける。
ベイクドチーズケーキ|クリームチーズと卵は室温に1時間戻す（冷たいとダマになる）。オーブンを170℃に予熱する。型にオーブンシートを敷く。^ビスケットをポリ袋に入れてめん棒で細かく砕き、溶かしバターを混ぜる。型の底にスプーンで押し固め、冷蔵庫で10分冷やす。^ボウルにクリームチーズを入れ、ゴムベラでなめらかに練る。砂糖を加えて混ぜる。^溶き卵を3回に分けて加え、その都度よく混ぜる。生クリーム・レモン汁を加え、薄力粉をふるい入れて混ぜる。^ざるでこして型に流し、型を台に2〜3回落として空気を抜く。^170℃のオーブンで40〜45分、表面にしっかり焼き色がつき、ゆすって中央が少し揺れるくらいまで焼く。^オーブンの中で30分おいてから取り出し（急に冷やすと割れる）、粗熱を取って冷蔵庫で一晩冷やす（翌日のほうが味が落ち着く）。
クッキー|バターは室温に1時間戻し、指で押してへこむくらいにする。卵も室温に。^ボウルにバターを入れてゴムベラで練り、砂糖を加えて泡立て器で2分、白っぽくふんわりするまで混ぜる。^溶き卵を2回に分けて加え、その都度よく混ぜる（分離しないように）。^薄力粉をふるい入れ、ゴムベラで切るように混ぜる。粉っぽさがなくなったらやめる（練るとかたくなる）。^ラップで包み、厚さ1.5cmにのばして冷蔵庫で30分休ませる。オーブンを170℃に予熱。^5mm厚にのばして型で抜き、オーブンシートを敷いた天板に並べる。^170℃で12〜15分、縁がうっすらきつね色になるまで焼く。天板の上で5分冷ましてから網に移す（焼きたてはやわらかく、冷めるとサクッとなる）。
蒸しパン|ボウルに卵・牛乳・砂糖・サラダ油を入れて混ぜる。^ホットケーキミックスを加え、粉っぽさがなくなるまで混ぜる（混ぜすぎない）。^紙カップを敷いた型に7分目まで流す（あればレーズンやさつまいもを入れても）。^蒸気の上がった蒸し器に並べ、ふきんで包んだふたをして強火で12〜15分蒸す（ふきんで水滴が落ちるのを防ぐ）。^竹串を刺して何もつかなければ完成。フライパンで蒸す場合は湯を1cm張って同じ時間。
安倍川もち|きな粉・砂糖・塩をよく混ぜる（塩ひとつまみで甘みが締まる）。^鍋に湯を沸かし、火を止めてもちを入れ、1〜2分つけてやわらかくする（焼いてから湯にくぐらせても香ばしい）。^もちがとろりとやわらかくなったら湯を切り、すぐにきな粉の上で転がしてまぶす。
豚バラ大根|大根は2cm厚の半月切りにし、面取りする。耐熱容器に入れてラップし、電子レンジ600Wで6分加熱する（下ゆでの代わり。時短で味がしみやすくなる）。^豚肉は5cm長さ、しょうがは薄切り。^鍋にごま油を中火で熱し、豚肉を2分、脂が出て焼き色がつくまで炒める。大根を加えて2分、豚の脂を吸わせるように炒める。^水・酒・しょうがを加え、煮立ったらアクを取る。砂糖・みりんを加え、落としぶたをして弱めの中火で10分煮る。^しょうゆを加えて再び落としぶたをし、10分煮る。^落としぶたを取り、中火で3分、煮汁を回しかけながら照りが出るまで煮詰める。火を止めてしばらくおくとさらに味がしみる。
高野豆腐の含め煮|高野豆腐は60℃くらいのぬるま湯に5分つけてもどし、両手で挟んで水を替えながら白い水が出なくなるまで押し洗いする。軽く水気を絞って4等分に切る。^にんじんは5mm厚の輪切り（花形にしても）、しいたけは軸を取る。いんげんは塩ゆで1分。^鍋にだし・砂糖・みりん・薄口しょうゆ・塩を入れて中火で煮立てる。^高野豆腐・にんじん・しいたけを並べ入れ、落としぶたをして弱火で15分、煮汁を含ませるように煮る（ぐらぐら煮ると崩れる）。^火を止めてそのまま冷ます（冷める間に煮汁を吸い、じゅわっとした食感に）。器に盛り、いんげんを添える。
かつおのたたき|かつお（刺身用のさく）は皮目を下にして全体に塩をふる。玉ねぎは薄切りにして水に5分さらす。大葉はせん切り、小ねぎは小口切り、にんにくは薄切り、しょうがはせん切りにする。^フライパンにサラダ油を強火で熱し、煙が出るくらいまで熱くする。かつおを皮目から入れて30秒、残りの面を各15秒ずつ焼く（表面だけを焼いて中は生）。^すぐに氷水にとって10秒冷やし、ペーパーで水気を拭く（余熱で火が入るのを止める）。^1cm厚に切って器に並べ、ポン酢を回しかけ、手のひらで軽く叩いて味をなじませる（「たたき」の由来）。^玉ねぎ・にんにく・しょうが・大葉・小ねぎをたっぷりのせ、冷蔵庫で10分なじませる。
ビーフステーキ|牛肉は焼く30分前に冷蔵庫から出して室温に戻す（中心が冷たいと焼きムラになる）。筋を数か所切り、焼く直前に塩・こしょうをふる（早くふると水分が出る）。^つけ合わせ：じゃがいもはくし形に切ってレンジで4分、いんげんは塩ゆで2分。にんにくは薄切り。^フライパンにサラダ油とにんにくを入れ弱火で2分、きつね色になったら取り出す（ガーリックチップ）。^強めの中火にして煙が少し出るくらい熱し、牛肉を入れる。厚さ2cmなら、触らずに2分焼いて返し、1分半（ミディアムレア）。ミディアムなら2分半。^バターを加え、溶けたバターをスプーンで肉にかけながら30秒。^アルミホイルに包んで、焼いた時間と同じくらい（3〜4分）休ませる（肉汁が落ち着き、切ったとき流れ出ない）。^フライパンにしょうゆと肉汁を入れて10秒煮立ててソースにする。肉を切って盛り、ソースとガーリックチップをかける。
ビーフストロガノフ|牛肉は塩・こしょうをして薄力粉を薄くまぶす（とろみがつき、肉がやわらかく仕上がる）。玉ねぎは薄切り、マッシュルームは薄切り。^フライパンにバター半量を中火で溶かし、牛肉を2分、焼き色をつけて取り出す（焼きすぎない）。^残りのバターで玉ねぎを中火で5分、しんなりして薄く色づくまで炒め、マッシュルームを加えて2分炒める。^水・コンソメ・ケチャップ・中濃ソースを加えて煮立て、弱めの中火で5分煮る。^牛肉を戻し、生クリームを加えて弱火で2分、とろりとするまで煮る（生クリームを入れたら煮立てない）。塩・こしょうで調える。^バターライスかご飯にかける。パセリを散らして。
ミートボールのトマト煮|玉ねぎはみじん切りにして半量をレンジで1分半加熱して冷ます。パン粉は牛乳大さじ2（分量外）でふやかす。^ボウルにひき肉・塩少々を入れて粘りが出るまで練り、加熱した玉ねぎ・パン粉・卵・こしょうを加えて混ぜる。直径3cmに丸める（手に油を塗るとくっつかない）。^フライパンにオリーブオイルを中火で熱し、ミートボールを転がしながら4分、全体に焼き色をつける（中は生でOK。焼き色がソースのコクになる）。^残りの玉ねぎとしめじを加えて2分炒め、トマト缶・ケチャップ・コンソメ・砂糖・水50ml（分量外）を加える。^煮立ったらふたをして弱めの中火で12分、ときどき転がしながら煮込む。^ふたを取って3分煮詰め、塩・こしょうで調える。パセリや粉チーズを。
チキンカツ|鶏むね肉は厚い部分に包丁を入れて開き、厚さを1.5cmに揃える。半分に切り、フォークで両面を数か所刺す（縮み防止と味しみ）。^塩・こしょうをふって10分おく。^薄力粉→溶き卵→パン粉の順につけ、5分おいて衣をなじませる。^揚げ油を170℃に熱し、鶏肉を入れて3分揚げ、返して2〜3分揚げる。泡が小さくなり、きつね色になったら引き上げる。^網に立てて3分休ませる（余熱で中心まで火が通り、しっとり）。切ってキャベツとソースを添える。
ポークビーンズ|豚肉はひと口大に切って塩・こしょうする。玉ねぎ・にんじんは1cm角に切る。大豆は水気を切る。^鍋にオリーブオイルを中火で熱し、豚肉を2分炒めて色を変える。玉ねぎ・にんじんを加えて4分、玉ねぎが透き通るまで炒める。^トマト缶・ケチャップ・コンソメ・砂糖・水100ml（分量外）・大豆を加えて煮立てる。^ふたをして弱火で15分、ときどき混ぜながら煮込む。^ふたを取って3分、とろりとするまで煮詰め、塩・こしょうで調える。
ハッシュドビーフ|玉ねぎは繊維に沿って1cm幅の薄切り、しめじはほぐす。牛肉に塩・こしょう（分量外）をふる。^鍋にバター半量を中火で溶かし、玉ねぎを入れて10分、こまめに混ぜてあめ色手前（濃いきつね色）まで炒める（ここがコクの源）。^残りのバターと牛肉を加えて2分炒め、肉の色が変わったらしめじを加えて1分炒める。^薄力粉をふり入れて1分炒め、粉っぽさをなくす。^赤ワインを加えて強火で30秒、アルコールを飛ばす。トマト缶・水・コンソメ・ケチャップ・中濃ソースを加えて混ぜる。^煮立ったら弱火にしてふたを少しずらし、15分、ときどき底から混ぜて煮込む（焦げやすいので注意）。^ご飯にかける。生クリームを少したらすとお店風。
エビピラフ|米は洗ってざるに上げ、30分おいて水気を切る。えびは背わたを取り、片栗粉でもみ洗いして水気を拭く。玉ねぎはみじん切り。^フライパンにバターを中火で溶かし、えびを1分炒めて色が変わったら取り出す（最後に戻すことで身がぷりぷりのまま）。^同じフライパンで玉ねぎを2分炒め、米を加えて2〜3分、米が透き通るまで炒める（米をバターでコーティングするとパラリと炊ける）。^炊飯器に移し、コンソメと塩を加え、2合の目盛りまで水を入れて混ぜる。ミックスベジタブルをのせて普通に炊く。^炊き上がったらえびをのせて10分蒸らし、こしょうをして底から大きく混ぜる。
チキンライス|鶏肉は1.5cm角に切って塩・こしょうする。玉ねぎはみじん切り、ピーマンは1cm角。^フライパンにバター半量を中火で溶かし、鶏肉を3分炒めて火を通す。玉ねぎを加えて2分、ピーマンを加えて1分炒める。^ケチャップを加えて中火で1分、ふつふつ煮詰めるように炒める（ケチャップの酸味が飛んで甘みとコクが出る、洋食屋の技）。^ご飯とコンソメを加え、ほぐしながら2分炒め合わせる。^残りのバターを加えて香りをつけ、塩・こしょうで調える。
ガーリックライス|にんにくは薄切りにし、芯を取る。ベーコンは1cm幅。^フライパンにオリーブオイルとにんにくを入れ、弱火で3〜4分、ゆっくりきつね色になるまで加熱して取り出す（ガーリックチップ。焦がすと苦い）。^にんにくの香りが移った油でベーコンを中火で2分、カリッとするまで炒める。^ご飯を加えて強めの中火で2分、ほぐしながら炒める。バターを加え、鍋肌からしょうゆを回し入れて香ばしさをつける。^塩・こしょうで調え、ガーリックチップの半量を混ぜる。器に盛って残りのチップをのせる。
ジャンバラヤ|米は洗ってざるに上げ30分おく。鶏肉は1.5cm角、ウインナーは1cm幅、玉ねぎ・ピーマン・にんにくはみじん切り。^フライパンにオリーブオイルとにんにくを入れ弱火で1分、中火にして鶏肉を3分炒める。^玉ねぎ・ウインナーを加えて2分炒め、カレー粉を加えて30秒炒めて香りを出す。^米を加えて2分炒め、ケチャップを加えて1分炒める。^炊飯器に移し、コンソメ・塩を加えて2合の目盛りまで水を入れ、普通に炊く。^炊き上がったらピーマンを加えて10分蒸らし、さっくり混ぜる（ピーマンは蒸らしで火を通すと色が鮮やか）。
カツカレー|カレー：玉ねぎは薄切り、にんじんはいちょう切り。鍋にサラダ油を中火で熱し、玉ねぎを8分、きつね色になるまで炒め、にんじんを加えて2分炒める。^水を加えて煮立て、アクを取って弱火で10分煮る。火を止めてルウを溶かし、弱火で5分とろみがつくまで煮る。^とんかつ：豚肉は筋切りし、塩・こしょうをふる。薄力粉→溶き卵→パン粉をつけ、5分おく。^揚げ油を170℃に熱し、豚肉を入れて3分、返して2〜3分揚げる。泡が小さくなったら引き上げ、網に立てて3分休ませる。^ご飯を盛ってカレーをかけ、切ったとんかつをのせる（カツにはカレーをかけすぎないと衣のサクサクが残る）。
卵かけご飯|炊きたての熱々ご飯を茶碗に盛り、中央にくぼみを作る。^卵は白身と黄身に分け、白身をご飯に入れて箸で30秒、ふわふわに泡立つまで混ぜる（白身を先に混ぜると泡立ってふわふわ、雲のような食感に）。^くぼみに黄身をのせ、しょうゆをたらす。^かつお節・小ねぎをのせ、黄身を崩しながら食べる。
焼き鳥丼|鶏肉は余分な脂を取り、3cm角に切る。長ねぎは3cm長さに切る。^たれ：しょうゆ・みりん・砂糖・酒を混ぜる。^フライパンにサラダ油を中火で熱し、鶏肉を皮目から入れる。触らずに4〜5分、皮がパリッときつね色になるまで焼く（出た脂はペーパーで拭き取る）。^返して長ねぎを加え、3分焼いてねぎに焼き目をつける。^たれを加えて中火で1〜2分、とろみがついて照りが出るまで絡める。^丼にご飯を盛り、刻みのりを散らして焼き鳥とねぎをのせ、残ったたれをかける。七味や山椒を。
鉄火丼|すし酢：酢・砂糖・塩を混ぜて砂糖を溶かす。炊きたてのご飯にすし酢を回しかけ、しゃもじで切るように混ぜ、うちわであおいで人肌に冷ます（つやが出てべたつかない）。^まぐろは7mm厚のそぎ切りにする。^しょうゆとわさびを混ぜてまぐろを5分漬ける（ヅケにすると身がねっとりして味がなじむ）。^丼に酢飯を盛り、刻みのり・せん切りの大葉を散らし、まぐろを花びら状に並べる。わさびを添えて。
豚キムチ丼|豚肉は4cm長さ、にらは4cm長さに切る。^フライパンにごま油を中火で熱し、豚肉を2分炒めて焼き色をつける。^キムチを加えて2分、汁気を飛ばすようにしっかり炒める（キムチの酸味が丸くなり、うまみが増す）。^にらを加えて30秒炒め、しょうゆを鍋肌から回し入れる。^丼にご飯を盛って豚キムチをのせ、目玉焼き（または卵黄）をのせる。
ぶっかけうどん|大根はすりおろして軽く水気を切る。しょうがはすりおろす。小ねぎは小口切り。^めんつゆを表示通りの濃さ（ぶっかけ用、2〜3倍濃縮なら水で割る）に薄め、冷蔵庫で冷やしておく。^うどんは熱湯で表示時間通り（ゆでうどんなら約1分、冷凍なら約1分半）ゆで、流水でもみ洗いしてぬめりを取る。氷水にとって締め、水気をしっかり切る（コシが出る）。^器にうどんを盛り、大根おろし・小ねぎ・かつお節・しょうがをのせ、つゆをかける。
釜玉うどん|器に卵を割りほぐし、しょうゆ・めんつゆを加えて混ぜておく。器は湯を入れて温めておくとなお良い。^うどんを熱湯で表示時間通り（冷凍うどんなら約1分半）ゆでる。^湯を切ったら水で洗わず、熱々のまますぐ卵の器に入れる（熱で卵が半熟になり、とろりと麺に絡む）。^すばやく混ぜて卵を絡め、小ねぎをのせる。好みでバターと黒こしょうで「釜玉バター」に。
月見うどん|鍋にだし・薄口しょうゆ・みりん・塩を入れて中火で温め、つゆを作る。長ねぎは斜め薄切り。^うどんを熱湯で表示時間通りゆで、湯を切る。^つゆが煮立ったらうどんを入れて1分温め、器に移す。^つゆの残りを弱火にし、卵を割り落として1分半、白身が白くなるまで煮る。卵をうどんの中央にのせ、つゆをかける（直接器で卵を割る場合は熱いつゆをかけてふたをして1分）。^長ねぎをのせ、七味をふる。
とろろそば|長いもは皮をむいて酢水にさっとくぐらせる（変色とかゆみ防止）。すりおろし、めんつゆ大さじ1を混ぜてなめらかにする。^めんつゆを表示通りに薄めて冷やす。^そばはたっぷりの湯で表示時間通り（乾麺で4〜5分）ゆで、流水でもみ洗いしてぬめりを取り、氷水で締める（香りとコシが立つ）。水気をよく切る。^器にそばを盛ってつゆをかけ、とろろをのせる。刻みのり・小ねぎ・わさびを添えて。
塩焼きそば|麺は袋のまま電子レンジ600Wで1分温めてほぐしやすくする。豚肉は4cm長さ、キャベツはざく切り、長ねぎは斜め切り。^フライパンにごま油の半量を中火で熱し、麺を広げて触らずに2分焼き、焼き色がついたら返して1分焼いて取り出す（香ばしさが味になる）。^残りのごま油で豚肉を2分炒め、キャベツ・もやし・長ねぎを加えて強火で1分炒める。^麺を戻し、酒をふってほぐし、鶏がらスープの素・塩・こしょうで調える。^火を止めてレモン汁をかける。黒こしょうをたっぷりふって。
皿うどん|麺をほぐし、フライパンにサラダ油大さじ2を中火で熱して麺を丸く広げる。ヘラで押さえながら3〜4分、両面カリッときつね色になるまで揚げ焼きにして皿に盛る。^豚肉・シーフードは食べやすく、キャベツはざく切り、にんじんは短冊切り。^フライパンに残りのサラダ油を中火で熱し、豚肉を2分炒め、にんじん・キャベツ・シーフード・もやしの順に加えて強火で2分炒める。^水・鶏がらスープの素・オイスターソース・しょうゆを加えて煮立てる。^水溶き片栗粉（片栗粉＋水大さじ3）を回し入れ、混ぜながら30秒、しっかりとろみをつける。ごま油をたらす。^熱々のあんを麺にかける。酢とからしを添えて（長崎の定番）。
油そば|丼にしょうゆ・ごま油・オイスターソース・酢・砂糖・ラー油を入れて混ぜておく（器を湯で温めておく）。^焼き豚は細切り、小ねぎは小口切り。卵は沸騰した湯で6分半ゆでて冷水にとり、殻をむく（半熟）。^中華麺をたっぷりの湯で表示時間通りゆで、しっかり湯を切る（水っぽいとたれが薄まる）。^丼に麺を入れてたれをよく絡め、焼き豚・小ねぎ・刻みのり・半熟卵をのせる。^よく混ぜて食べる。途中で酢とラー油を追加するのがお店流。
ツナと大葉の和風パスタ|大葉はせん切りにして水にさらし、水気を絞る。にんにくはみじん切り。ツナは缶汁を軽く切る。^大きな鍋に湯2Lを沸かして塩大さじ1を入れ、スパゲッティを表示時間より1分短くゆでる。^フライパンにオリーブオイルとにんにくを入れ弱火で2分、香りが出たらツナを加えて1分炒める。^ゆで汁お玉1杯・しょうゆ・バターを加えて揺すり、乳化させる。^ゆで上がったパスタを加えて中火で30秒絡める。^器に盛り、大葉と刻みのりをたっぷりのせる。
納豆パスタ|納豆は付属のたれとめんつゆ大さじ1を加えて、白っぽく粘りが出るまで50回混ぜる。大葉はせん切り、小ねぎは小口切り。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間通り（1.6mmで約7分）ゆでる。^ボウルにバター・オリーブオイル・残りのめんつゆを入れておく。^湯を切ったパスタを熱いうちにボウルに入れ、手早く和える（バターが溶けて全体に絡む）。^器に盛り、納豆をのせて大葉・小ねぎを散らす。食べるときによく混ぜて。
ラザニア|ミートソース：玉ねぎはみじん切り。鍋にオリーブオイルを中火で熱し、玉ねぎを4分炒め、ひき肉を加えて3分、焼き付けるように炒める。トマト缶・ケチャップ・コンソメを加え、弱火で15分煮詰める。^ホワイトソース：鍋にバターを弱火で溶かし、薄力粉を1分炒める。冷たい牛乳を少しずつ加えて泡立て器で混ぜ、中火で3分、とろりとするまで煮て塩・こしょう。^ラザニアは表示通りにゆでる（ゆで不要タイプはそのまま）。オーブンを200℃に予熱する。^耐熱皿にミートソース→ラザニア→ホワイトソース→ミートソースの順に3段重ね、最上段にホワイトソースとチーズをのせる。^200℃のオーブンで20分、表面がぐつぐつして焼き色がつくまで焼く。^10分おいて落ち着かせてから切り分ける（すぐ切ると崩れる）。
タコス|玉ねぎはみじん切り、レタスはせん切り、トマトは1cm角に切る。^フライパンにサラダ油を中火で熱し、玉ねぎを2分炒め、ひき肉を加えて3分、ポロポロになるまで炒める。^カレー粉を加えて30秒炒め、ケチャップ・中濃ソース・塩・こしょうを加えて2分、汁気がなくなるまで炒める（タコミート）。^トルティーヤはフライパンで両面20秒ずつ温める（香ばしく、やわらかく巻ける）。^トルティーヤにレタス・タコミート・トマト・チーズをのせる。サルサやライムを添えて。
ヤムウンセン|春雨は熱湯で表示時間通りゆでて水で洗い、水気を切って食べやすく切る。^えびは背わたを取って1分ゆで、ひき肉は小鍋で水大さじ2を加えて中火で2分、ポロポロに炒り煮する。^セロリは斜め薄切り、ミニトマトは半分、パクチーはざく切り、赤唐辛子は小口切り。^ナンプラー・レモン汁・砂糖・唐辛子を混ぜてドレッシングにする。^ボウルに春雨・えび・ひき肉（温かいうち）・セロリ・トマトを入れ、ドレッシングで和えて5分なじませる。^器に盛り、パクチーをたっぷりのせる。
ラープ|玉ねぎ（あれば紫玉ねぎ）は薄切りにする。パクチーはざく切り、赤唐辛子は小口切り。^フライパンに鶏ひき肉と水大さじ3を入れて中火にかけ、ほぐしながら3分、ポロポロに火を通す（油を使わずに炒り煮にするのがタイ式）。^火を止めて粗熱を取り、ナンプラー・レモン汁・砂糖・唐辛子を加えて混ぜる。^玉ねぎとパクチーを加えてさっと混ぜる（あれば炒った米を砕いて加えると本格的）。^レタスに包んで食べる。
豚バラと白菜のうま煮|白菜は芯をそぎ切り、葉はざく切り。豚肉は4cm長さ、しいたけは薄切り、しょうがはせん切り。^フライパンにごま油を中火で熱し、しょうがと豚肉を2分、脂が出るまで炒める。^白菜の芯としいたけを加えて2分炒め、葉を加えて1分炒める。^水・鶏がらスープの素・オイスターソース・しょうゆを加え、ふたをして中火で5分、白菜がくたっとするまで煮る（白菜から出る水分がうまみのスープに）。^水溶き片栗粉（片栗粉＋水大さじ2）を回し入れ、混ぜながら30秒とろみをつける。
春雨スープ|わかめは水でもどす。にんじんはせん切り。^鍋に水・鶏がらスープの素を入れて中火で煮立て、にんじんを入れて2分煮る。^春雨を乾燥のまま入れて3〜4分、やわらかくなるまで煮る（春雨がスープを吸って味がしみる）。^わかめを加え、しょうゆ・塩で調える。^溶き卵を細く回し入れ、ふわっと浮いたら火を止める。ごま油をたらす。
かき玉汁|卵はよく溶きほぐす（白身のかたまりが残らないように）。三つ葉は2cm長さに切る。^鍋にだしを入れて中火で煮立て、薄口しょうゆ・塩で調える。^水溶き片栗粉（片栗粉＋水小さじ2）を入れて混ぜ、ごく薄くとろみをつける（卵がふんわり浮く秘訣）。^だしが沸騰している状態で、溶き卵を菜箸に伝わせて細く回し入れる。^10秒触らず、卵がふわっと浮いたら火を止めてひと混ぜ。三つ葉を加える。
お吸い物|あさりは砂抜きして殻をこすり合わせて洗う。^鍋に水・あさり・酒を入れて中火にかける。4〜5分、沸騰直前でアクを取る。^あさりの口が開いたら弱火にし、薄口しょうゆ・塩で調える（あさりの塩分があるので、味を見てから少しずつ）。^椀に盛り、三つ葉を添える。木の芽やゆずの皮をのせると料亭風。
ユッケジャンスープ|牛肉は細かく切る。にらは4cm長さ、にんにくはみじん切り。^鍋にごま油とにんにくを入れ弱火で1分、中火にして牛肉を2分炒める。コチュジャンを加えて30秒炒めて香りを出す。^水・鶏がらスープの素・しょうゆを加えて煮立て、アクを取り、弱めの中火で5分煮る（肉のうまみをスープに出す）。^もやしを加えて2分煮る。^溶き卵を回し入れ、にらを加えて30秒で火を止める。好みで粉唐辛子やラー油を。
牡蠣鍋|牡蠣は片栗粉と塩でもみ洗いし、2〜3回水を替えてすすぎ、水気を拭く。^白菜はざく切り、長ねぎは斜め切り、春菊は葉を摘む、豆腐は8等分。^土鍋にだし・酒・みりんを入れて煮立て、味噌の半量を溶き入れる。鍋の内側に残りの味噌を土手のように塗る（土手鍋。少しずつ溶かして味を調整できる）。^白菜の芯・豆腐・長ねぎを入れて中火で5分煮る。^牡蠣を入れて2〜3分、ぷっくりふくらんだら食べどき（煮すぎると縮む）。春菊は最後に30秒。^〆はご飯と卵で味噌雑炊に。
カレー鍋|豚肉は5cm長さ、白菜はざく切り、長ねぎは斜め切り、にんじんは薄い短冊切り、しめじはほぐす。^土鍋にだしを入れて中火で煮立て、豚肉とにんじんを入れて3分煮る。アクを取る。^火を止めてカレールウを溶かし、しょうゆ・みりんを加える（和風だしで割るとそば屋のカレーのような味に）。^白菜・長ねぎ・しめじを加え、ふたをして中火で6〜7分煮る（ルウが入ると焦げやすいので沸騰後は弱めの中火に）。^〆はうどんを入れてカレーうどん、またはご飯とチーズでリゾット。
