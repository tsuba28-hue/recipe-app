お雑煮|鶏肉は小さめのひと口大に切り、熱湯をかけて霜降りにする。大根・にんじんは5mm厚のいちょう切り（またはにんじんは花形）にし、2分下ゆでする。^もちはトースターで5〜6分、ふくらんで焼き色がつくまで焼く（関西風なら丸もちを汁で煮る）。^鍋にだしを入れて中火で煮立て、鶏肉・大根・にんじんを入れて弱めの中火で8分煮る。アクを取る。^薄口しょうゆ・みりん・塩で調える。^椀に焼いたもちを入れ、熱い汁と具を注ぐ。三つ葉とゆずの皮をのせる。
卵がゆ|ご飯はざるに入れてさっと水洗いし、ぬめりを取る（さらりとしたおかゆになる）。^鍋に水・ご飯を入れて中火で煮立て、弱火にしてふたを少しずらし、10〜12分煮る。混ぜすぎない（粘りが出る）。^和風だしの素・塩で調える。^溶き卵を回し入れ、ふたをして火を止め、1分蒸らす（ふんわり半熟に）。^器に盛り、小ねぎを散らす。
肉巻きおにぎり|ご飯を8等分し、俵形にぎゅっとにぎる（しっかりにぎらないと焼く間に崩れる）。^豚肉を1枚ずつ、ご飯全体を覆うように斜めにずらしながら巻きつける。^しょうゆ・みりん・砂糖を混ぜてたれを作る。^フライパンにサラダ油を中火で熱し、肉の巻き終わりを下にして並べる。転がしながら5〜6分、全体に焼き色がつくまで焼く。^出た脂をペーパーで拭き取り、たれを加えて中火で1〜2分、転がしながら照りよく絡める。いりごまをふる。
牛肉とブロッコリーのオイスター炒め|牛肉にしょうゆ・酒をもみ込み、片栗粉をまぶす（肉がやわらかく、たれがよく絡む）。^ブロッコリーは小房に分け、茎は皮をむいて薄切り。熱湯で1分ゆでてざるに上げる（下ゆでで色鮮やかに、炒め時間も短く）。^オイスターソース・砂糖・水大さじ1（分量外）を混ぜる。にんにくは薄切り。^フライパンにサラダ油とにんにくを中火で熱し、香りが出たら牛肉を広げて2分、焼き付けるように炒める。^ブロッコリーを加えて強火で1分炒め、合わせ調味料を回し入れて30秒、全体に絡める。
えびと卵の炒め物|えびは背わたを取り、塩と片栗粉をもみ込んで水で洗い、水気を拭く。改めて塩少々・片栗粉小さじ1をまぶす（ぷりぷりになる）。^卵に鶏がらスープの素・塩少々を加えて溶く。長ねぎは斜め薄切り。^フライパンにサラダ油大さじ1を中火で熱し、えびを2分炒めて色が変わったら取り出す。^残りのサラダ油を強火で熱し、卵液を流し入れて大きく混ぜる。半熟になったらえびと長ねぎを戻す。^酒をふって10秒、さっと混ぜて火を止める（卵がふわふわのうちに）。
水餃子|白菜はみじん切りにして塩少々をふり、10分おいて水気をしっかり絞る。にらはみじん切り、しょうがはすりおろす。^ひき肉に塩・しょうゆを加えて粘りが出るまで練り、水大さじ2（分量外）を少しずつ加えて吸わせる（ジューシーになる）。白菜・にら・しょうが・ごま油を加えて混ぜる。^皮の中央にあんをのせ、縁に水をつけて半分に折り、しっかり閉じる（ひだを取らなくてもよい。水餃子は破れにくさが大事）。^たっぷりの湯を沸かし、餃子を入れて混ぜる。再び沸騰したら差し水（コップ1杯）をする。^もう一度沸騰したら1分半〜2分、浮いてきてふっくらするまでゆでる（差し水で皮のコシが出る）。^ゆで汁ごと器に盛り、酢・しょうゆ・ラー油のたれで。
中華粥|米は洗って30分水につけ、水気を切ってごま油少々（分量外）をまぶす（米が割れやすくなり、とろりと仕上がる）。^鍋に水・鶏がらスープの素・しょうがの薄切りを入れて強火で沸騰させ、米を入れて混ぜる。^再び沸騰したら弱火にしてふたを少しずらし、30分煮る。ときどき底から混ぜる。^鶏むね肉は薄くそぎ切りにし、15分のところで加えて一緒に煮る。^塩で調え、器に盛る。小口切りの小ねぎ・ごま油・しょうがのせん切りをのせる。ザーサイや揚げパンを添えると本格的。
鶏肉の黒酢炒め|鶏肉は3cm角に切り、塩少々（分量外）をふって片栗粉をまぶす。玉ねぎは2cm角、パプリカは乱切り。^黒酢・砂糖・しょうゆ・水を混ぜて合わせ調味料を作る。^フライパンにサラダ油を中火で熱し、鶏肉を皮目から入れて3分、返して3分、カリッと焼いて火を通す（揚げ焼き）。^余分な油を拭き取り、玉ねぎとパプリカを加えて2分炒める。^合わせ調味料を加えて中火で1〜2分、とろりと煮詰めて照りよく絡める（黒酢は煮詰めると酸味が丸くなり、コクが出る）。
空芯菜炒め|空芯菜は5cm長さに切り、茎と葉に分ける。にんにくは薄切り、赤唐辛子は種を取る。^フライパンにサラダ油・にんにく・唐辛子を入れ、弱火で1分、香りを出す。^強火にして茎を入れて30秒、葉を加えて20秒、手早く炒める。^鶏がらスープの素・オイスターソース・水大さじ1（分量外）を加え、15秒絡めてすぐ皿へ（シャキシャキ感が命）。
中華風卵スープ|トマトはくし形に切る。長ねぎは斜め薄切り。^鍋に水・鶏がらスープの素を入れて中火で煮立て、トマトを入れて2分煮る（トマトのうまみと酸味がスープに出る）。^しょうゆ・塩で調え、水溶き片栗粉でうすくとろみをつける。^沸騰させた状態で溶き卵を細く回し入れ、10秒待ってからひと混ぜする。^長ねぎを加え、ごま油をたらす。
火鍋|白菜はざく切り、春菊は葉を摘む、豆腐は8等分、しいたけは飾り包丁。にんにく・しょうがは薄切り。^鍋にごま油を弱火で熱し、にんにく・しょうが・赤唐辛子・豆板醤を入れて3分、じっくり炒めて香りと辛みを油に移す（麻辣の土台）。花椒があれば加える。^水・鶏がらスープの素・しょうゆ・酒を加えて中火で煮立てる。^白菜の芯・しいたけ・豆腐を入れて5分煮る。^肉は1枚ずつしゃぶしゃぶの要領でくぐらせ、色が変わったらすぐ食べる。白菜の葉・春菊は最後に。^ごまだれを用意しておくと辛さが和らぐ。
清蒸魚|たらは塩少々をふって10分おき、水気を拭く。長ねぎの白い部分は5cm長さの極細せん切り（白髪ねぎ）にして水にさらす。しょうがはせん切り。^耐熱皿にねぎの青い部分を敷き、たらをのせて酒をふり、しょうがの半量をのせる。^蒸気の上がった蒸し器（またはフライパンに湯1cm）に入れ、ふたをして強火で8〜10分蒸す。身の中心が白くなれば蒸し上がり。^ねぎの青い部分を取り除き、皿にたまった汁は捨てる（生臭みが出ている）。しょうゆ・砂糖・湯大さじ1を混ぜてかける。^白髪ねぎと残りのしょうがをのせる。^小鍋でごま油を煙が出る直前まで熱し、ねぎの上からジュッとかける（香りが一気に立つ、広東料理の仕上げ）。
杏仁豆腐|ゼラチンを水大さじ2にふり入れ、5分ふやかす。^鍋に牛乳と砂糖を入れて中火で温め、砂糖を溶かす。縁がふつふつしてきたら火を止める（沸騰させない）。^ふやかしたゼラチンを加えて溶かし、生クリームを加える（あれば杏仁霜やアーモンドエッセンスを数滴）。^ボウルの底を氷水に当てて混ぜながら、少しとろみがつくまで冷やす。^器に注ぎ、冷蔵庫で3時間以上冷やし固める。^シロップ（水100ml・砂糖大さじ2を煮溶かして冷ましたもの）とクコの実やフルーツを添える。
ビビン麺|たれ：コチュジャン・酢・砂糖・しょうゆ・ごま油を混ぜる（キムチの汁があれば大さじ1加えると本格的）。^卵は8分ゆでて半分に切る。きゅうりはせん切り、キムチは細かく刻む。^そうめんは熱湯で表示時間通りゆで、流水でもみ洗いし、氷水で締める（コシを出す）。^水気をしっかり切ってたれの2/3で和える。^器に盛り、きゅうり・キムチ・ゆで卵をのせ、残りのたれをかけていりごまをふる。よく混ぜて食べる。
冷麺|スープ：鍋に水を沸かし、牛肉を入れて弱めの中火で15分ゆで、肉を取り出す（ゆで汁をスープに使う）。鶏がらスープの素・しょうゆ・砂糖・塩を加えて溶かし、冷めたら酢を加えて冷蔵庫（または冷凍庫で30分）でキンキンに冷やす。^ゆでた牛肉は薄切り、卵は8分ゆでて半分、きゅうりはせん切り。^冷麺はたっぷりの熱湯で表示時間通りゆで、流水でよくもみ洗いしてでんぷんを落とし、氷水で締める（強いコシが出る）。^器に麺を盛り、冷たいスープを注ぐ。牛肉・きゅうり・キムチ・卵をのせる。^酢とからしを好みで加えて。梨やりんごの薄切りをのせると本場の味。
ポッサム|豚肉は塊のまま、冷蔵庫から出して20分おく。^大鍋に水・にんにく・しょうが・長ねぎ（青い部分も）・味噌を入れて強火にかけ、沸騰したら豚肉を入れる（味噌が臭みを消し、うまみを加える）。^再び沸騰したらアクを取り、弱めの中火にしてふたを少しずらし、45分ゆでる。竹串を刺して透明な汁が出ればOK。^ゆで汁に入れたまま10分おく（しっとりする）。取り出して5mm厚に切る。^レタスに豚肉・キムチをのせ、コチュジャンにごま油を混ぜた味噌を少しつけて包んで食べる。
タッカンマリ|鶏肉は熱湯で2分下ゆでして水で洗う（スープがクリアになる）。^大鍋に水・鶏肉・にんにく（丸ごと）・長ねぎの青い部分を入れて強火にかけ、沸騰したらアクを取り、弱めの中火でふたをずらして30分煮る。^じゃがいもは皮をむいて1cm厚に切り、鍋に加えて10分煮る。塩で調える。^長ねぎの白い部分を斜め切りにして加え、トックも入れて3分煮る。^たれ：しょうゆ・酢・コチュジャン・からしを混ぜる（あればにらを刻んで加える）。^鶏肉を食卓でキッチンばさみで切り分け、たれにつけて食べる。〆はスープにうどん（カルグクス）を。
キムチチゲ|豚肉は4cm長さ、豆腐は1.5cm厚、長ねぎは斜め切り。^鍋にごま油を中火で熱し、豚肉を2分炒め、キムチを加えて3分、しっかり炒める（よく発酵した酸っぱいキムチほどおいしいチゲになる）。^水・鶏がらスープの素・コチュジャン・しょうゆを加えて煮立て、中火で5分煮る。^豆腐と長ねぎを加えて3分煮る。^味を見て、キムチの汁や塩で調える。
ブデチゲ|ウインナーは斜め切り、ベーコンは4cm幅、長ねぎは斜め切り、にんにくはすりおろす。^コチュジャン・しょうゆ・にんにくを混ぜてたれを作る。^浅鍋にキムチ・ウインナー・ベーコン・長ねぎを並べ、中央にたれをのせる。^水と鶏がらスープの素を注ぎ、中火で煮立てて5分煮る。^インスタントラーメンの麺（スープの素は使わないか半量）を入れて2分、ほぐしながら煮る。^チーズをのせてふたをし、30秒で溶かす。麺がのびないうちに。
トムカーガイ|鶏肉はひと口大、マッシュルームは半分、しょうがは薄切り（あればガランガル・レモングラス・こぶみかんの葉）。^鍋に水・鶏がらスープの素・しょうがを入れて中火で煮立て、3分煮て香りを出す。^鶏肉を入れて5分煮る。アクを取る。^ココナッツミルクとマッシュルームを加え、弱火で3分（沸騰させるとココナッツミルクが分離する）。^ナンプラー・砂糖で調え、火を止めてレモン汁を加える。^器に盛り、パクチーをのせる。
マッサマンカレー|鶏肉は大きめのひと口大、じゃがいもは4等分して水にさらす、玉ねぎはくし形。カシューナッツはフライパンで2分から煎りする。^鍋にサラダ油を中火で熱し、鶏肉を皮目から3分焼いて焼き色をつける。玉ねぎを加えて2分炒める。^カレー粉を加えて弱火で1分炒め、香りを出す（あればシナモン・カルダモン・八角を少々）。^ココナッツミルク・水・じゃがいも・カシューナッツを加え、煮立ったら弱火でふたをし、20分煮る（ときどき混ぜて焦げつき防止）。^ナンプラー・砂糖・しょうゆで調え、甘じょっぱく仕上げる。^ご飯と一緒に。
レッドカレー|鶏肉はそぎ切り、なすは乱切り、たけのこは薄切り、パプリカは細切り。^鍋にサラダ油とココナッツミルクの上澄み（固まった部分）大さじ3を中火で熱し、レッドカレーペーストを入れて2分、油が分離して香りが立つまで炒める（ペーストを炒めるのが本格的な味の秘訣）。^鶏肉を加えて2分炒め、残りのココナッツミルクを加える。^なす・たけのこを入れて弱めの中火で8分煮る。^パプリカ・ナンプラー・砂糖を加えて2分煮る。^火を止めてバジルを手でちぎって加える。ご飯にかけて。
ガイヤーン|鶏肉は厚い部分に切り込みを入れて厚さを揃え、フォークで皮目を刺す。^ナンプラー・オイスターソース・砂糖・すりおろしにんにくを混ぜて鶏肉にもみ込み、冷蔵庫で1時間以上（できれば一晩）漬ける。^焼く20分前に冷蔵庫から出す。オーブンを200℃に予熱し、天板にオーブンシートを敷いて皮目を上にして並べる。^200℃で20〜25分、皮がパリッと香ばしく焼けるまで焼く（フライパンなら皮目から中火で6分、返してふたをし弱火で6分）。^5分休ませてから切り分ける。スイートチリソースとパクチーを添えて。
ソムタム|大根とにんじんはスライサーでせん切りにする（あれば青パパイヤで）。いんげんは3cm長さ、ミニトマトは半分に。^ポリ袋（またはすり鉢）ににんにく・赤唐辛子を入れ、めん棒で叩きつぶす。^いんげんを加えて軽く叩く。^ナンプラー・レモン汁・砂糖を加えて混ぜ、大根・にんじん・トマトを入れて、めん棒で軽く叩きながら混ぜる（叩くことで野菜に味がしみ込む）。^5分なじませ、器に盛る。あれば砕いたピーナッツを散らす。
バインセオ|生地：薄力粉・ココナッツミルク・水・カレー粉（ターメリックの代わり）・塩少々を混ぜ、30分休ませる。^えびは背わたを取って縦半分。フライパンでひき肉とえびを中火で2分炒め、塩少々をして取り出す。^フライパン（直径26cm）にサラダ油の半量を強めの中火で熱し、生地の半量を流して、フライパンを回して薄く広げる（薄いほどパリッと焼ける）。^片側にえび・ひき肉・もやしをのせ、ふたをして中火で2分、もやしをしんなりさせる。^ふたを取って2〜3分、縁がパリパリに焼けるまで焼き、半分に折りたたんで皿に移す。^ナンプラー・レモン汁・砂糖・水大さじ2を混ぜたたれを添え、レタスで包んで食べる。
ミーゴレン|麺はレンジで1分温めてほぐす。鶏肉は小さめのひと口大、えびは背わたを取る。キャベツはざく切り、にんにくはみじん切り。^ケチャップ・オイスターソース・しょうゆ・豆板醤を混ぜる（甘辛い味の土台）。^フライパンにサラダ油とにんにくを中火で熱し、鶏肉を3分、えびを加えて1分炒める。^キャベツ・もやしを加えて強火で1分炒め、麺と合わせ調味料を加えて2分、麺に味が絡むまで炒める。^別のフライパンで目玉焼きを作り、ミーゴレンにのせる（半熟の黄身を絡めて食べるのがインドネシア流）。
サテ|鶏肉はひと口大に切り、ナンプラー・カレー粉・砂糖をもみ込んで20分漬ける。^竹串（水に10分つけておくと焦げにくい）に3〜4切れずつ刺す。^ピーナッツソース：練りごま（あればピーナッツバター）・しょうゆ・ココナッツミルク・砂糖少々を混ぜる。^魚焼きグリルの中火で8〜10分、返しながら焼き色がつくまで焼く（フライパンなら中火で両面3〜4分ずつ、ふたをして弱火で2分）。^ソースときゅうりを添える。
ダールカレー|レンズ豆はさっと洗う（浸水不要）。玉ねぎはみじん切り、トマトはざく切り、にんにく・しょうがはみじん切り。^鍋にレンズ豆と水を入れて中火で煮立て、アクを取って弱火で15分、豆が崩れるまで煮る。^フライパンにサラダ油を中火で熱し、にんにく・しょうがを1分、玉ねぎを加えて5分、きつね色になるまで炒める。^カレー粉を加えて弱火で1分炒め、トマトを加えて3分、つぶしながら炒める。^豆の鍋に加え、塩を加えて弱火で5分煮る。とろりとしたら完成。^仕上げにテンパリング（小鍋で油とクミンシードを熱してジュッとかける）をするとさらに本格的。ご飯かナンと。
ほうれん草カレー|ほうれん草は塩ゆで1分して冷水にとり、水気を絞って水50mlとミキサーでなめらかなペーストにする。^鶏肉はひと口大。玉ねぎはみじん切り、にんにく・しょうがはすりおろす。^鍋にサラダ油を中火で熱し、玉ねぎを8分、あめ色手前まで炒める。にんにく・しょうがを加えて1分炒める。^カレー粉を加えて弱火で1分炒め、鶏肉を加えて中火で3分炒める。^水を加えて煮立て、ふたをして弱火で10分煮る。^ほうれん草ペーストと生クリームを加えて弱火で3分（長く煮ると緑色がくすむ）。塩で調える。
ナン|ボウルに強力粉・ドライイースト・砂糖・塩を入れて混ぜ、ヨーグルトと人肌（35℃）に温めた牛乳・サラダ油を加えてまとめる。^台に出して手のひらで押し伸ばすように7〜8分こねる。表面がなめらかになればOK。^ボウルに入れてラップをし、温かいところ（30〜35℃）で40分、2倍にふくらむまで発酵させる。^ガス抜きして4等分し、丸めて濡れ布巾をかけて10分休ませる。^手で引っ張って涙形（長さ20cm）にのばす。^フライパンを強めの中火で熱し、ナンを入れてふたをし、2分焼く。ふくらんで焼き色がついたら返し、1分半焼く。熱いうちにバターを塗る。
サモサ|じゃがいもは皮をむいてレンジで5分加熱し、粗くつぶす。玉ねぎはみじん切り。^フライパンにサラダ油を中火で熱し、玉ねぎを2分、ひき肉を加えて3分炒め、カレー粉・塩を加えて1分炒める。じゃがいもと混ぜて冷ます。^春巻きの皮を縦半分に切り、手前に具をのせて三角に折りながら包む。端を水溶き小麦粉でとめる。^揚げ油を170℃に熱し、3分、返しながらきつね色になるまで揚げる（具は火が通っているので皮がパリッとすればOK）。^油を切り、ケチャップやチャツネを添える。
ビリヤニ|鶏肉はひと口大に切り、ヨーグルト・カレー粉大さじ1・すりおろしにんにく・しょうが・塩小さじ1/2を混ぜてもみ込み、1時間以上漬ける。^米は洗ってざるに上げる（あればバスマティ米で）。玉ねぎは薄切り。^フライパンにサラダ油を中火で熱し、玉ねぎを10分、濃いきつね色になるまで炒める（揚げ玉ねぎのように）。半量を飾り用に取り出す。^残りの玉ねぎに鶏肉を漬け汁ごと加え、中火で5分炒める。^炊飯器に米・水・塩小さじ1/2・残りのカレー粉を入れて混ぜ、鶏肉を上にのせて普通に炊く。^炊き上がったら10分蒸らし、さっくり混ぜる。飾り用の玉ねぎとパクチー・ミントをのせる。
フムス|ひよこ豆は水気を切り、飾り用に少し取り分ける。^フードプロセッサーにひよこ豆・練りごま・にんにく・レモン汁・塩・水を入れ、2〜3分、なめらかになるまで攪拌する。途中ゴムベラで側面を落とす。^固ければ水を少しずつ足して、とろりとした柔らかさに調整する（冷水を使うとふんわり軽い仕上がりに）。^器に広げ、スプーンの背で中央にくぼみを作り、オリーブオイルを注ぐ。取り分けた豆とパプリカパウダーを散らす。ピタパンや野菜と。
シャクシュカ|玉ねぎ・パプリカは薄切り、にんにくはみじん切り。^フライパン（直径20cm）にオリーブオイルを中火で熱し、にんにくを30秒、玉ねぎとパプリカを加えて5分、しんなりするまで炒める。^カレー粉（あればクミン・パプリカパウダー）を加えて30秒炒め、トマト缶・砂糖・塩を加える。弱めの中火で8分、とろりとするまで煮詰める。^ソースにスプーンで4つのくぼみを作り、卵を1つずつ割り入れる。^ふたをして弱火で5〜6分、白身が固まり黄身は半熟になるまで加熱する。^パセリを散らし、フライパンのまま食卓へ。パンですくって食べる。
チキンケバブ|鶏肉はひと口大に切り、ヨーグルト・カレー粉・すりおろしにんにく・塩をもみ込んで30分以上漬ける（ヨーグルトの酸で肉がやわらかくなる）。^キャベツはせん切り、トマトは薄切り。マヨネーズとケチャップを混ぜてソースにする（ヨーグルトやにんにくを加えても）。^フライパンを中火で熱し（油なし）、鶏肉の漬けだれを軽くぬぐって皮目から入れる。4分焼いて返し、ふたをして弱めの中火で4分焼く。^ふたを取って中火で1分、焦げ目をつける。^トルティーヤを温め、キャベツ・トマト・鶏肉をのせてソースをかけ、巻いて食べる。
ブリトー|フライパンにサラダ油を中火で熱し、ひき肉を3分炒め、カレー粉・ケチャップ・塩を加えて1分炒める。^ご飯を加えて1分混ぜ炒める。^レタスはせん切り。トルティーヤをフライパンで両面20秒ずつ温める。^トルティーヤの中央にご飯と肉・レタス・チーズをのせ、下と左右を折り込んで手前からしっかり巻く。^巻き終わりを下にしてフライパンで中火で1分ずつ転がしながら焼き、閉じる。^アルミホイルで包んで半分に切る。
ケサディーヤ|鶏むね肉は薄く削ぎ切りにして塩・こしょうし、サラダ油を熱したフライパンで中火で両面2分ずつ焼いて細かく切る。ピーマンは細切り。^トルティーヤの半面にチーズの半量・鶏肉・ピーマンをのせ、残りのチーズをのせて半分に折る（チーズで挟むと接着剤になる）。^フライパンを中火で熱し（油なし）、ケサディーヤを入れて2分、ヘラで押さえながら焼く。^返して2分、チーズが溶けて両面がパリッときつね色になるまで焼く。^3等分に切り、サルサやワカモレを添える。
ワカモレ|玉ねぎはみじん切りにして水に5分さらし、水気を絞る。トマトは種を取って5mm角に切る。にんにくはすりおろす。^アボカドは半分に切って種を取り、スプーンですくってボウルに入れ、すぐにレモン汁をかける（変色防止）。^フォークで粗くつぶす（なめらかにしすぎず、角切りが少し残るくらいがおいしい）。^玉ねぎ・トマト・にんにく・塩を加えて混ぜる。あればパクチー・ハラペーニョを。^表面にラップを密着させて冷蔵庫へ（空気に触れると黒くなる）。トルティーヤチップスと。
ハンバーガー|ひき肉に塩・こしょうを加え、軽く混ぜる（練りすぎない。肉々しい食感のアメリカンパティになる）。2等分し、バンズより一回り大きく、1.5cm厚の円形にする。中央をくぼませる。^玉ねぎは輪切り、トマトは輪切り、レタスはちぎって水気を拭く。^フライパンにサラダ油を強めの中火で熱し、パティを入れて触らずに3分、こんがり焼き色をつける。返して3分焼き、チーズをのせてふたをし、30秒で溶かす。^バンズは横半分に切り、断面をフライパンで30秒焼く（香ばしく、肉汁がしみてもべちゃっとしない）。^下のバンズにマヨネーズ、レタス・トマト・パティ・玉ねぎを重ね、ケチャップとマスタードをかけて上のバンズをのせる。
クラブハウスサンド|鶏むね肉は塩・こしょうをふり、耐熱容器で酒少々（分量外）をかけてラップし、レンジ600Wで3分加熱、そのまま5分おいて余熱で火を通す。薄切りにする。^ベーコンは両面カリカリに焼く。卵は目玉焼き（両面焼き）にする。トマトは輪切り、レタスはちぎる。^食パン3枚をトーストし、内側になる面にバターとマヨネーズを塗る。^パン・レタス・鶏肉・トマト・パン・ベーコン・卵・レタス・パンの順に3段重ねにする。^上から軽く押さえ、四隅にピックを刺して対角線に4等分に切る。
BBQスペアリブ|スペアリブは骨の裏の薄膜をはがし（味がしみてやわらかくなる）、フォークで数か所刺す。^ケチャップ・中濃ソース・しょうゆ・はちみつ・すりおろしにんにくを混ぜ、スペアリブを漬けて冷蔵庫で2時間〜一晩おく。^焼く30分前に冷蔵庫から出す。オーブンを160℃に予熱する。^天板にアルミホイルを敷き、スペアリブを並べてホイルでふたをし、160℃で40分蒸し焼きにする（低温でじっくり、骨からほろりと外れるやわらかさに）。^ホイルを外して漬けだれを塗り、220℃に上げて10〜15分、照りと焦げ目がつくまで焼く。途中でもう一度たれを塗る。
マカロニチーズ|マカロニは塩を入れた湯で表示時間より1分短くゆでる。^チーズソース：鍋にバターを弱火で溶かし、薄力粉を加えて1分炒める。^冷たい牛乳を少しずつ加えながら泡立て器で混ぜ、中火で3分、とろみがつくまで混ぜ続ける。^火を止めてチーズの2/3を加えて溶かし、塩・こしょうで調える（チェダーチーズを使うとアメリカの味）。^マカロニを加えて絡め、耐熱皿に入れて残りのチーズをのせる。^トースターで5分、表面がこんがりするまで焼く（そのまま鍋で食べてもOK）。
ピロシキ|生地：強力粉・ドライイースト・砂糖・塩ひとつまみを混ぜ、人肌に温めた牛乳を加えて7分こねる。ラップをして温かいところで40分、2倍にふくらむまで発酵させる。^春雨は熱湯でもどして短く切る。玉ねぎはみじん切り。卵は固ゆでにして刻む。^フライパンにサラダ油を中火で熱し、玉ねぎを2分、ひき肉を加えて3分炒める。春雨・ゆで卵・塩・こしょうを混ぜて冷ます。^生地を6等分して丸め、直径12cmにのばして具を包み、縁をしっかりつまんで閉じる。閉じ目を下にして15分休ませる（二次発酵）。^揚げ油を160℃に熱し、片面3分ずつ、計6分、きつね色になるまでじっくり揚げる（低温でパン生地の中まで火を通す）。
シュニッツェル|豚肉はラップで挟み、めん棒で叩いて厚さ5mmに薄くのばす（薄く大きくのばすのがウィーン風）。^塩・こしょうをふり、薄力粉→溶き卵→パン粉（細かく砕いて粉チーズを混ぜる）の順につける。押さえつけない（衣がふわっと浮くのが本場流）。^フライパンにサラダ油を深さ5mm入れ、中火で170℃に熱する。^豚肉を入れ、フライパンをゆすって油を上にかけながら2分揚げ焼きにする。返して1分半、きつね色になったら引き上げる。^油を切り、レモンを添える。
ポキ丼|まぐろは2cm角に切る。玉ねぎは薄切りにして水に5分さらし、水気を絞る。^しょうゆ・ごま油・砂糖・いりごまを混ぜてたれを作り、まぐろと玉ねぎを和えて冷蔵庫で10分漬ける。^アボカドは2cm角に切ってレモン汁少々（分量外）をからめる。^丼にご飯を盛り、まぐろとアボカドをのせる。刻みのりやわさびマヨを添えても。
シェパーズパイ|じゃがいもは皮をむいて4等分し、水から15分ゆでる。湯を捨てて弱火で水分を飛ばし、熱いうちにつぶしてバター・温めた牛乳・塩・こしょうを混ぜる（なめらかなマッシュポテトに）。^玉ねぎ・にんじんはみじん切り。フライパンにサラダ油を中火で熱し、玉ねぎ・にんじんを4分、ひき肉を加えて3分炒める。^ケチャップ・中濃ソース・コンソメ・水50ml（分量外）を加え、5分煮詰めて塩・こしょうする。^オーブンを200℃に予熱する。耐熱皿に肉を敷き、マッシュポテトを全体にのせて平らにし、フォークで筋をつける（焦げ目がきれいにつく）。^チーズを散らし、200℃のオーブンで15〜20分、表面がこんがりするまで焼く。
フィッシュアンドチップス|じゃがいもは皮付きのまま1cm角の棒状に切って水に10分さらし、水気を拭く。^たらは塩をふって10分おき、水気を拭いて2〜3等分に切り、薄力粉（分量外）を薄くまぶす。^衣：薄力粉と冷たい水（あれば炭酸水かビール）を混ぜる。少しダマが残る程度で（混ぜすぎると重い衣になる）。^揚げ油を160℃に熱し、じゃがいもを5分揚げて取り出す。^油を180℃に上げ、たらを衣にくぐらせて入れ、3〜4分、衣がカリッときつね色になるまで揚げる。続けてじゃがいもを2分二度揚げ。^塩をふり、レモンとマヨネーズ（タルタルやモルトビネガーも）を添える。
牛肉の赤ワイン煮込み|牛すね肉は大きめの4cm角に切り、塩・こしょうをして薄力粉をまぶす。玉ねぎは薄切り、にんじんは大きめの乱切り。^厚手の鍋にオリーブオイル大さじ1を強めの中火で熱し、牛肉の全面を4〜5分、しっかり焼き色をつけて取り出す（焼き色がソースの深いコクになる）。^残りのオリーブオイルで玉ねぎを8分、きつね色になるまで炒め、にんじんを加えて2分炒める。^牛肉を戻し、赤ワインを加えて強火で3分、アルコールを飛ばす。鍋底のこびりつきを木べらでこそげる。^トマト缶・コンソメ・砂糖を加え、水をひたひたに足す。煮立ったらアクを取り、ごく弱火でふたを少しずらして1時間半煮込む（竹串がすっと通るまで）。^マッシュルームを加えて10分煮て、ふたを取って5分煮詰め、塩・こしょうで調える。
ボルシチ|ビーツは皮をむいてせん切り（缶詰なら汁ごと使う）。キャベツはせん切り、玉ねぎは薄切り、にんじんはせん切り、じゃがいもは1cm角。^鍋にサラダ油を中火で熱し、牛肉を2分炒め、玉ねぎ・にんじんを加えて3分炒める。^ビーツを加え、酢を加えて3分炒める（酢を加えると鮮やかな赤色が保たれる）。^水・トマト缶・コンソメを加えて煮立て、アクを取り弱火で20分煮る。^じゃがいもとキャベツを加えて10分煮る。塩で調える。^器に盛り、ヨーグルト（またはサワークリーム）とディルをのせる。
ブイヤベース|あさりは砂抜きする。たらは塩をふって10分おき、水気を拭いて3等分。えびは背わたを取る。玉ねぎ・セロリは薄切り、トマトはざく切り、にんにくはみじん切り。^鍋にオリーブオイルとにんにくを入れ弱火で1分、玉ねぎ・セロリを加えて中火で4分炒める。^トマトとカレー粉（サフランの代わりに色と香りづけ。あればサフランをひとつまみ）を加えて2分炒める。^白ワインを加えて1分、水・コンソメを加えて煮立て、弱火で10分煮る。^たら・あさり・えびを入れ、ふたをして中火で5分、あさりの口が開くまで煮る。^塩・こしょうで調える。トーストしたバゲットにガーリックマヨ（ルイユ風）を添えて。
ガスパチョ|トマトはへたを取ってざく切り、きゅうり・パプリカ・玉ねぎもざく切り。食パンは耳を取ってちぎり、水少々でふやかす。^ミキサーに野菜・パン・にんにく・酢・塩を入れ、なめらかになるまで1〜2分攪拌する（パンがとろみと口当たりのまろやかさを出す）。^オリーブオイルを少しずつ加えてさらに30秒攪拌し、乳化させる。^ざるでこして（より本格的に）、冷蔵庫で1時間以上キンキンに冷やす。^器に盛り、きゅうりやパプリカの角切り、オリーブオイルを飾る。
チーズフォンデュ|具の準備：フランスパンはひと口大、ブロッコリーは小房に分けて2分ゆでる。じゃがいもは皮付きのまま1.5cm角に切ってレンジで4分。ウインナーは焼く。^チーズに片栗粉をまぶしておく（分離せず、なめらかに溶ける）。^土鍋（またはフォンデュ鍋）の内側に、半分に切ったにんにくの断面をこすりつけて香りをつける。^白ワインを入れて中火で温め、ふつふつしてきたら弱火にし、チーズを3回に分けて加え、木べらで「の」の字に混ぜながら溶かす。^なめらかになったら、ごく弱火で保温しながら食卓へ。^具を串に刺してチーズを絡めて食べる（固くなったら白ワインか牛乳を少し足す）。
シュクメルリ|鶏肉は骨に沿って切り込みを入れ、塩・こしょうをふって10分おく。じゃがいもはくし形に切ってレンジで3分加熱。にんにくはみじん切り。^フライパンにオリーブオイルを中火で熱し、鶏肉を皮目から入れて触らずに7〜8分、皮がパリッときつね色になるまで焼く。^返してじゃがいもを加え、ふたをして弱めの中火で8分蒸し焼きにし、中まで火を通す。^余分な脂を拭き取り、にんにくを加えて1分、香りが立つまで炒める（にんにくがジョージア料理の主役。たっぷりと）。^牛乳・生クリーム・コンソメを加えて弱めの中火で5分、とろみがつくまで煮詰める。塩で調える。^スキレットのまま食卓へ。パンでソースをすくって。

ガトーショコラ|オーブンを170℃に予熱し、型（直径15cm）にオーブンシートを敷く。卵は卵黄と卵白に分ける。^チョコレートを刻み、バターと一緒にボウルに入れて湯せん（50〜60℃）で溶かす。温めた生クリームを加えて混ぜる。^卵黄に砂糖の半量を加えて白っぽくなるまで混ぜ、チョコ液に加える。薄力粉とココアをふるい入れて混ぜる。^卵白に残りの砂糖を3回に分けて加え、角がおじぎするくらいのメレンゲにする。^メレンゲの1/3をチョコ生地に加えてしっかり混ぜ、残りを2回に分けて泡を消さないようさっくり混ぜる。^型に流して170℃で35〜40分焼く。竹串を刺して少ししっとりした生地がつく程度で焼き上がり。^型のまま冷ます（中央がしぼむのがガトーショコラらしさ）。冷蔵庫で一晩冷やすと濃厚な味に。粉糖をふる。
アップルパイ|りんごは皮をむいて8等分のくし形にし、5mm厚のいちょう切りにする。^鍋にりんご・砂糖・バター・レモン汁を入れて中火で煮る。りんごから水分が出たら弱めの中火で10〜15分、汁気がほとんどなくなり透き通るまで煮詰める（水分が残るとパイ生地が湿る）。シナモンを加えて冷ます。^冷凍パイシートを室温に5分おき、1枚を型（または天板）に敷き、縁を残してりんごをのせる。^もう1枚を1cm幅に切って格子状にのせ（または全体に被せて切り込みを入れる）、縁に溶き卵を塗ってフォークで押さえて閉じる。^表面に溶き卵を塗り、冷蔵庫で15分冷やす（バターが冷えて層がきれいにふくらむ）。オーブンを200℃に予熱。^200℃で25〜30分、全体が濃いきつね色になるまで焼く。
スコーン|バターは1cm角に切って冷蔵庫でよく冷やす。牛乳も冷やしておく。オーブンを190℃に予熱。^ボウルに薄力粉・ベーキングパウダー・砂糖・塩を入れて混ぜ、バターを加えて指先ですり合わせ、サラサラのそぼろ状にする（手の熱でバターが溶けないよう手早く）。^牛乳を加え、カードで切るように混ぜてひとまとめにする（こねない。こねると「狼の口」の割れ目ができない）。^2cm厚にのばして半分に切って重ね、再度のばすを2回繰り返す（層ができ、横に割れやすくなる）。2.5cm厚にして型で抜く。^天板に並べ、表面に牛乳を塗り、190℃で15〜18分、こんがりきつね色になるまで焼く。^温かいうちに、クロテッドクリームやジャムを添えて。
コーヒーゼリー|ゼラチンを水大さじ2にふり入れて5分ふやかす。^熱湯（80℃以上）にインスタントコーヒーと砂糖を溶かす。^ふやかしたゼラチンを加えて完全に溶かす（熱湯でも沸騰させないこと）。^粗熱を取って器（またはバット）に注ぎ、冷蔵庫で3時間以上冷やし固める。^バットで固めた場合はフォークで崩して器に盛る。生クリーム（またはコーヒーフレッシュ）をかける。
焼き芋|さつまいもはよく洗い、濡れたままキッチンペーパーで包み、さらにアルミホイルで包む（蒸し焼きになってしっとり）。^オーブンを予熱せずに天板にのせ、160℃で60〜70分焼く（予熱なしで低温からゆっくり温度を上げると、甘みを出す酵素がよく働く。65〜75℃の時間を長くするのがねっとり甘い焼き芋のコツ）。^竹串がすっと通り、皮から蜜がにじんでいれば焼き上がり。^そのまま10分おいて蒸らす。好みで塩やバターを。
レアチーズケーキ|クリームチーズを室温に戻す。ゼラチンは水大さじ3にふり入れて5分ふやかす。^ビスケットを細かく砕き、溶かしバターを混ぜて型（直径15cm）の底に押し固め、冷蔵庫で15分冷やす。^ボウルにクリームチーズを入れてなめらかに練り、砂糖・ヨーグルト・レモン汁の順に加えてその都度混ぜる。^ゼラチンをレンジ600Wで20秒加熱して溶かし（沸騰させない）、チーズ生地を少し加えて混ぜてから本体に戻す（温度差でダマになるのを防ぐ）。^生クリームを7分立て（とろりとリボン状に落ちる程度）にして加え、さっくり混ぜる。^型に流し、台に2〜3回落として空気を抜く。冷蔵庫で4時間以上冷やし固める。型の側面を温かい布巾で温めると外しやすい。
スフレチーズケーキ|クリームチーズ・バターを室温に戻す。卵は卵黄と卵白に分け、卵白は冷蔵庫で冷やす。型（直径15cm）にオーブンシートを敷く（底が抜ける型はアルミホイルで外側を包む）。オーブンを150℃に予熱。^クリームチーズ・バターを湯せんにかけながらなめらかに練る。牛乳を少しずつ加え、卵黄・レモン汁を加え、薄力粉をふるい入れて混ぜる。ざるでこす。^冷えた卵白に砂糖を3回に分けて加え、角の先がおじぎする「8分立て」のメレンゲにする（立てすぎると焼いたときに割れる）。^メレンゲをチーズ生地に3回に分けて加え、泡を消さないようさっくり混ぜる。型に流し、台に軽く落として大きな泡を抜く。^天板に型をのせ、熱湯を2cm深さ注ぐ（湯せん焼き）。150℃で50〜60分焼く。^焼き上がったらオーブンの扉を少し開けて中で30分おく（急な温度変化でしぼむのを防ぐ）。冷めたら冷蔵庫で冷やす。
いちごのショートケーキ|スポンジ：卵と砂糖をボウルに入れ、湯せん（60℃）で人肌に温めながら泡立てる。ハンドミキサー高速で5分、生地で「の」の字が書けて消えないくらいまで泡立て、低速で1分きめを整える。オーブンを170℃に予熱。^薄力粉を2回ふるって加え、ゴムベラで底からすくうように40回混ぜる。温めたバターと牛乳に生地を少し混ぜてから戻し、さっくり混ぜる。^型（直径15cm）に流し、170℃で30〜35分焼く。中央を指で押して弾力があれば焼き上がり。型ごと10cmの高さから落として蒸気を抜き（焼き縮み防止）、逆さにして冷ます。^生クリームに砂糖を加えて氷水に当てながら7分立てにする。いちごは飾り用を残して半分は縦にスライス。^スポンジを横に2枚にスライスし、1枚目にクリームを塗っていちごを並べ、クリームで覆ってもう1枚をのせる。^全体にクリームを薄く塗り（下塗り）冷蔵庫で10分冷やしてから、仕上げ塗りをする。いちごを飾り、冷蔵庫で1時間冷やしてなじませる。
ロールケーキ|天板（25cm角）にオーブンシートを敷く。オーブンを190℃に予熱。^卵と砂糖を湯せんで温めながらハンドミキサーで5分、白くもったりとリボン状に落ちるまで泡立てる。^薄力粉をふるい入れてさっくり混ぜ、温めた牛乳を加えて混ぜる。^天板に流して表面を平らにし、190℃で10〜12分焼く。表面に焼き色がつき、指で押して弾力があればOK。^天板から出し、乾燥しないよう上にもオーブンシートをかぶせて冷ます。^生クリームに砂糖を加えて8分立てにする。焼き面を上にしてクリームを塗る（巻き終わりは薄く）。手前に2cm間隔で浅く切り込みを入れ、シートを持ち上げて手前から芯を作るように巻く。^シートで包み、巻き終わりを下にして冷蔵庫で1時間以上冷やす（形が落ち着く）。
シフォンケーキ|卵は卵黄と卵白に分け、卵白は冷蔵庫で冷やす。オーブンを170℃に予熱。型（直径17cm）には何も塗らない（生地が型に張り付いて高くふくらむ）。^卵黄に砂糖の1/3を加えて白っぽくなるまで混ぜ、サラダ油を少しずつ加えて乳化させ、水を加えて混ぜる。薄力粉をふるい入れ、ダマがなくなるまで混ぜる。^冷えた卵白に残りの砂糖を3回に分けて加え、角がピンと立つ、つやのあるしっかりしたメレンゲにする。^メレンゲの1/3を卵黄生地に加えてしっかり混ぜ、残りを2回に分けて加えてさっくり混ぜる。^型に流し、竹串をぐるぐる回して大きな気泡を抜く。170℃で35〜40分、割れ目にも焼き色がつくまで焼く。^焼き上がったらすぐに型を逆さにして瓶などに刺し、完全に冷めるまで3時間おく（逆さにしないとしぼむ）。パレットナイフで型から外す。
マドレーヌ|バターを溶かして50℃くらいに保つ。型にバター（分量外）を塗り薄力粉をはたいて冷蔵庫へ。^ボウルに卵・砂糖・はちみつを入れ、泡立て器で白っぽくなるまですり混ぜる（泡立てすぎない）。^薄力粉とベーキングパウダーをふるい入れて混ぜ、レモン汁と溶かしバターを加えて、つやが出るまで混ぜる。^ラップをして冷蔵庫で1時間以上（できれば一晩）休ませる（休ませると、マドレーヌ特有の「おへそ」がぷっくり出る）。^オーブンを190℃に予熱。型の8分目まで生地を入れ、190℃で10〜12分、縁がこんがりきつね色になるまで焼く。^すぐに型から外して網の上で冷ます。
フィナンシェ|焦がしバター：小鍋にバターを中火で溶かし、ゆすりながら3〜4分、泡が細かくなり、ヘーゼルナッツのような香りの茶色になったら鍋底を水につけて止める（焦がしバターの香りがフィナンシェの命）。茶こしでこす。^卵白のみ使用（卵2個分）。ボウルに卵白・砂糖・はちみつを入れ、泡立てないように混ぜる。^薄力粉（あればアーモンドプードル30gを加える）をふるい入れ、混ぜる。^焦がしバターを温かいうちに3回に分けて加え、つやが出るまで混ぜる。冷蔵庫で30分休ませる。^オーブンを200℃に予熱。バターを塗った型に8分目まで入れ、200℃で12〜14分、縁がカリッと濃いきつね色になるまで焼く。^型から外して冷ます。翌日のほうがしっとりなじむ。
ブラウニー|オーブンを170℃に予熱し、型（18cm角）にオーブンシートを敷く。くるみは150℃で8分ローストして粗く刻む。^チョコレートとバターを湯せんで溶かす。砂糖を加えて混ぜ、溶き卵を少しずつ加えて混ぜる。^薄力粉とココアをふるい入れ、ゴムベラでつやが出るまで混ぜる。くるみの2/3を加える。^型に流して残りのくるみを散らし、170℃で20〜25分焼く（竹串に少ししっとりした生地がつくくらいで止めると、ねっとり濃厚に）。^型のまま冷まし、冷蔵庫で1時間冷やしてから切り分ける（冷やすと切り口がきれい）。
チョコチップクッキー|バターは室温に戻す。チョコレートは粗く刻む。オーブンを180℃に予熱。^バターをクリーム状にし、砂糖を加えて白っぽくなるまで混ぜる。溶き卵を2回に分けて加え混ぜる。^薄力粉・ベーキングパウダー・塩をふるい入れ、さっくり混ぜる。チョコを加えて混ぜる。^スプーンで直径4cmに丸めて、間隔を5cm空けて天板に並べ、手のひらで1cm厚に押さえる。^180℃で12〜14分、縁がきつね色で中央がまだ少しやわらかいくらいで取り出す（冷めると固まり、中しっとり外サクに）。^天板の上で5分おいてから網に移す。
生チョコ|バットにオーブンシートを敷く。チョコレートは細かく刻む（細かいほど均一に溶ける）。^小鍋に生クリームを入れて中火で温め、縁がふつふつしてきたら火を止める（沸騰させない）。^チョコに生クリームを注ぎ、1分おいてから、中心から小さく円を描くようにゴムベラで混ぜる。徐々に広げてつやのあるなめらかな状態に（乳化）。^室温のバターを加えて混ぜる。^バットに流して平らにし、冷蔵庫で3時間以上冷やし固める。^温めた包丁で2cm角に切り（1回ごとに包丁を拭いて温める）、ココアをまぶす。
チョコレートムース|チョコレートを刻んで湯せんで溶かし、40℃くらいに冷ます。^卵は卵黄と卵白に分ける。溶かしたチョコに卵黄を1個ずつ加えて混ぜる。^生クリームを6分立て（とろりと流れる程度）にしてチョコに加え、混ぜる。^卵白に砂糖を加えて角が立つまで泡立て、メレンゲを2回に分けて加え、泡を消さないようさっくり混ぜる。^器に注ぎ、冷蔵庫で3時間以上冷やす（ふんわり軽い食感のムースに）。生クリームやココアを飾る。
クリームブリュレ|オーブンを150℃に予熱する。卵黄3個分を使う（卵白は別の料理に）。^鍋に生クリームと牛乳を入れて中火で温め、縁がふつふつしたら火を止める。^卵黄と砂糖40gをすり混ぜ、温めたクリームを少しずつ加えて混ぜる（泡立てない）。ざるでこし、表面の泡を取る。^耐熱容器（ココット）に注ぎ、天板に並べて熱湯を容器の半分の高さまで注ぐ。150℃で25〜30分、ゆすって表面がふるふる揺れる程度に焼く。^粗熱を取って冷蔵庫で3時間以上冷やす。^食べる直前に表面に砂糖をまんべんなくふり、バーナーで焦がしてカラメル層にする（なければスプーンをコンロで熱々に熱して押し当てる）。パリッと割って食べる。
フルーツゼリー|ゼラチンを水大さじ3にふり入れて5分ふやかす。^みかん缶・黄桃缶は汁を切り、黄桃はひと口大に切る。^オレンジジュース100mlと砂糖を鍋で温め（沸騰させない）、ゼラチンを加えて溶かす。^残りのオレンジジュースを加えて混ぜ、ボウルの底を氷水に当てて少しとろみがつくまで冷やす（とろみをつけてから果物を入れると、果物が沈まず均等に散る）。^器にフルーツを入れ、ゼリー液を注ぐ。冷蔵庫で3時間以上冷やし固める。
ミルクレープ|クレープ生地：薄力粉と砂糖に溶き卵を加えて混ぜ、牛乳を少しずつ加えてのばし、溶かしバターを加える。ざるでこして冷蔵庫で30分休ませる。^フライパン（直径20cm）を中火で熱し、バター少々を薄く塗り、生地を薄く流して40秒、縁が浮いてきたら返して10秒。12〜15枚焼く。^焼いたクレープは重ねずに広げて完全に冷ます（温かいとクリームが溶ける）。^生クリームに砂糖を加えて8分立てにする。^クレープを1枚置き、クリームを薄く塗ってクレープを重ねる、を繰り返す（バナナやいちごを途中に挟んでも）。^ラップで包み、冷蔵庫で2時間以上冷やしてなじませる。温めた包丁で切る。
シュークリーム|カスタード：卵黄2個に砂糖40gをすり混ぜ、薄力粉大さじ3をふるい入れる。温めた牛乳を少しずつ加えて混ぜ、鍋に戻して中火で混ぜ続け、ぷくぷく沸いて、とろみが一度ゆるんでつやが出るまで2〜3分加熱する。バットに移してラップを密着させ、冷蔵庫で冷やす。^シュー生地：オーブンを200℃に予熱。鍋に水・バター・塩・砂糖少々を入れて中火で沸騰させ、火を止めて薄力粉を一気に加えて混ぜる。^再び中火にかけて1分、鍋底に薄い膜ができるまで練る。ボウルに移し、溶き卵（卵3個）を少しずつ加えて混ぜる。ヘラですくって三角形にゆっくり落ちる固さで止める（卵は全部入れないこともある）。^天板に直径4cmに絞り、表面を水で濡らしたフォークで軽く押さえ、霧吹きをする。^200℃で20分焼き、180℃に下げて10分焼く（途中で絶対に扉を開けない。しぼむ）。^冷めたらシューの横に切れ目を入れ、ほぐしたカスタードを詰める。粉糖をふる。
フルーツタルト|タルト生地：室温のバター70gに砂糖50gを混ぜ、溶き卵1/2個を加え、薄力粉150gを加えてさっくりまとめる。ラップで包んで冷蔵庫で1時間休ませる。^3mm厚にのばして型（直径18cm）に敷き、フォークで穴をあけて冷蔵庫で15分。オーブンを180℃に予熱。^重石をして180℃で15分、重石を外して10分、全体がきつね色になるまで焼いて冷ます。^カスタード：卵黄2個と砂糖50gをすり混ぜ、薄力粉大さじ2を加え、温めた牛乳を加えて鍋に戻す。中火で混ぜながら2〜3分、つやととろみが出るまで炊く。冷やす。^冷めたタルトにカスタードを詰めて平らにする。^いちご・キウイ・黄桃を彩りよく並べる。あればアプリコットジャムを水で溶いて煮つめ、果物に塗ってつやを出す（乾燥防止）。冷蔵庫で冷やす。
バナナブレッド|バター・卵を室温に戻す。オーブンを180℃に予熱し、パウンド型にオーブンシートを敷く。くるみは粗く刻む。^バナナはフォークでつぶす（黒い斑点が出た熟したもののほうが甘く香りが強い）。^バターをクリーム状にし、砂糖を加えて白っぽくなるまで混ぜる。溶き卵を少しずつ加えて混ぜ、つぶしたバナナを加えて混ぜる。^薄力粉とベーキングパウダーをふるい入れ、さっくり混ぜる。くるみを加える。^型に流し、表面に輪切りバナナをのせ、180℃で40〜45分焼く。竹串に生地がつかなければ焼き上がり。^冷めたらラップで包んで一晩おくとしっとりする。
キャロットケーキ|オーブンを180℃に予熱し、型にオーブンシートを敷く。にんじんは細かくすりおろす。くるみは粗く刻む。^ボウルに卵と砂糖を入れて混ぜ、サラダ油を少しずつ加えて乳化させる。にんじんを加えて混ぜる。^薄力粉・ベーキングパウダー・シナモンをふるい入れ、さっくり混ぜる。くるみ・レーズンを加える。^型に流し、180℃で35〜40分焼く。竹串に生地がつかなければOK。完全に冷ます。^フロスティング：室温のクリームチーズに砂糖大さじ2を混ぜてなめらかにし（レモン汁少々を加えても）、ケーキの上に塗る。冷蔵庫で冷やしてなじませる。
抹茶プリン|ゼラチンを水大さじ2にふり入れて5分ふやかす。^抹茶と砂糖をよく混ぜておく（砂糖と先に混ぜると抹茶がダマにならない）。^牛乳を少しずつ加えながら混ぜてなめらかにし、鍋で中火で温める。縁がふつふつしてきたら火を止める。^ゼラチンを加えて溶かし、生クリームを加える。ざるでこす。^ボウルの底を氷水に当てて少しとろみがつくまで冷やし（抹茶が沈まず均一に）、器に注ぐ。^冷蔵庫で3時間以上冷やし固める。あんこや生クリームを添えて。
バニラアイスクリーム|卵は卵黄と卵白に分ける。^卵黄に砂糖の半量を加えて白っぽくなるまですり混ぜる。^鍋に牛乳を温め（沸騰させない）、卵黄に少しずつ加えて混ぜる。鍋に戻し、弱火でゴムベラで混ぜながら2〜3分、とろみがつくまで加熱する（80℃程度。ヘラについた液を指でなぞって跡が残ればOK）。こして冷ます。バニラエッセンスを加える。^卵白に残りの砂糖を加えて角が立つまで泡立てる。生クリームは8分立てにする。^冷めたアングレーズソース・生クリーム・メレンゲを合わせ、さっくり混ぜる。^容器に入れて冷凍庫で3時間。1時間ごとに取り出してフォークでよく混ぜる（空気を含ませて、なめらかに）。
フローズンヨーグルト|ヨーグルトはキッチンペーパーを敷いたざるに入れ、冷蔵庫で1時間水切りする（氷の粒ができにくく、なめらかで濃厚に）。^いちごはへたを取ってフォークでつぶし、砂糖の半量と混ぜる。^水切りヨーグルトに残りの砂糖・はちみつを混ぜ、いちごを加えてマーブル状にざっくり混ぜる。^容器に入れて冷凍庫で3〜4時間。1時間ごとにフォークで全体を混ぜる。^固くなりすぎたら、食べる10分前に冷蔵庫に移す。
かき氷|いちごシロップ：いちごはへたを取って半分に切り、小鍋に砂糖・水と入れて10分おく（いちごから水分が出る）。^中火にかけて煮立ったら弱火にし、アクを取りながら5分、いちごがやわらかくなるまで煮る。レモン汁を加え、フォークで粗くつぶして冷やす（手作りシロップは果肉感が格別）。^氷はかき氷器で削る（器も冷凍庫で冷やしておくと溶けにくい）。^削った氷を半分盛ってシロップをかけ、さらに氷を盛ってシロップをたっぷりかける。練乳をかけても。
フルーツポンチ|みかん缶・黄桃缶は汁ごと用意し、黄桃はひと口大に切る。キウイは皮をむいて半月切り、バナナは輪切り。^ボウルにフルーツと缶詰のシロップ（半量程度）を入れて混ぜ、冷蔵庫で30分冷やす。^食べる直前によく冷えたサイダーを注ぐ（炭酸が抜けないように、注ぐのは最後）。^器に盛る。白玉を入れてもおいしい。
マンゴープリン|ゼラチンを水大さじ2にふり入れて5分ふやかす。^マンゴーは皮と種を除き、飾り用に少し角切りにする。残りはミキサーでピューレにする（缶詰や冷凍マンゴーでも可）。^鍋に牛乳と砂糖を入れて温め、縁がふつふつしたら火を止め、ゼラチンを加えて溶かす。^マンゴーピューレと生クリームを加えて混ぜ、ボウルの底を氷水に当ててとろみがつくまで冷やす。^器に注いで冷蔵庫で3時間以上冷やし固める。角切りマンゴーをのせ、練乳かエバミルクをかける（香港スタイル）。
牛乳寒天|みかん缶は汁を切る（シロップは使っても）。^鍋に水と粉寒天を入れて混ぜ、中火にかける。沸騰したら弱火にして、混ぜながら2分しっかり煮溶かす（寒天は沸騰させて煮溶かさないと固まらない）。^砂糖を加えて溶かし、牛乳を加えて混ぜる。人肌程度に温める（牛乳は沸騰させない）。^粗熱を取り、水で濡らしたバットにみかんを散らして寒天液を注ぐ。^常温でも固まるが、冷蔵庫で1時間冷やすとおいしい。ひし形に切る。
水ようかん|鍋に水と粉寒天を入れて混ぜ、中火にかける。沸騰したら弱火にして2分、混ぜながら完全に煮溶かす。^砂糖・塩を加えて溶かし、あんこを少しずつ加えて溶き混ぜる。弱火で2分、混ぜながら煮る。^火から下ろし、ボウルの底を水に当てて混ぜながら40℃くらい（少しとろみがつくまで）冷ます（熱いまま流すと、あんが沈んで二層になる）。^水で濡らした型に流し、冷蔵庫で2時間以上冷やし固める。
芋ようかん|さつまいもは皮を厚めにむいて1cm厚に切り、水に10分さらす。^鍋にかぶるくらいの水と入れて中火で15分、竹串がすっと通るまでゆでる。熱いうちに裏ごしする（なめらかさの決め手）。^鍋に水と粉寒天を入れて中火で煮立て、弱火で2分煮溶かす。砂糖・塩を加えて溶かす。^裏ごしした芋を加え、弱火で2〜3分、木べらで練りながら混ぜる。^ラップを敷いた型に入れ、表面を平らにならす。粗熱を取って冷蔵庫で2時間以上冷やす。
桜餅|桜の葉は水に10分つけて塩抜きし、水気を拭く。あんこは8等分して俵形に丸める。^ボウルに白玉粉を入れ、水を少しずつ加えて粒をつぶしながら溶き、薄力粉・砂糖を加えて混ぜる。食紅をごく少量の水で溶いて加え、淡いピンクにする。^フライパン（テフロン加工）を弱火で温め、油をごく薄く塗ってペーパーで拭き取る。生地を大さじ1強流し、スプーンの背で8×12cmの楕円にのばす。^弱火で1分、表面が乾いてきたら返して10秒焼く（焼き色をつけない）。乾かないよう布巾をかけて冷ます。^生地であんこを巻き、桜の葉で包む（葉の裏を外側にし、香りが移るよう15分おく）。
いちご大福|いちごはへたを取って洗い、水気をしっかり拭く。あんこを8等分し、いちごの先端を少し出して包む。^耐熱ボウルに白玉粉・砂糖を入れ、水を少しずつ加えてなめらかに溶く。^ふんわりラップをして電子レンジ600Wで1分、取り出して濡らしたゴムベラでよく混ぜる。さらに1分加熱して混ぜ、30秒加熱して混ぜる（半透明でつやのある餅になるまで）。^片栗粉を広げたバットに餅を出し、上からも片栗粉をふって8等分にする。^熱いうちに手早く餅をのばし、あんこ包みのいちごを包んで閉じ目をしっかりつまむ（いちごの先を上にして包むと、切った断面がきれい）。^余分な片栗粉をはらう。作った当日に食べる。
栗きんとん|さつまいもは皮を厚めにむいて（黄色く仕上げるため）1.5cm厚の輪切りにし、水に30分さらす。あればくちなしの実を割ってガーゼに包む。^鍋にさつまいもとかぶるくらいの水（くちなしも）を入れ、中火で15分、竹串がすっと通るまでゆでる。^湯を捨てて熱いうちに裏ごしする。^鍋に裏ごしした芋・砂糖・みりん・水（または栗の甘露煮のシロップ）を入れ、弱めの中火で練る。^木べらで底をこすりながら10分、ぽってりと照りが出て、すくって落とすとゆっくり落ちる固さまで練る（冷めると固くなるので、少しやわらかめで止める）。^栗を加えてさっと混ぜる。冷ましてから器に盛る。
あんみつ|寒天：鍋に水と粉寒天を入れて混ぜ、中火で煮立てて弱火で2分煮溶かす。水で濡らしたバットに流し、冷蔵庫で1時間固め、1.5cm角に切る。^白玉：白玉粉に水大さじ3〜4（分量外）を少しずつ加えて耳たぶの固さにこね、丸めて中央をへこませる。熱湯に入れて浮いてから1分半ゆで、冷水にとる。^キウイは皮をむいていちょう切り。みかん缶は汁を切る。^器に寒天を盛り、白玉・あんこ・フルーツをのせ、黒みつをかける。アイスをのせればクリームあんみつ。
芋けんぴ|さつまいもは皮付きのまま5mm角・7cm長さの棒状に切り、水に10分さらしてでんぷんを抜く。ペーパーで水気を徹底的に拭く。^フライパンにさつまいもを入れ、揚げ油をかぶるくらい注ぐ。冷たい油から中火にかける。^ときどき混ぜながら10〜12分、泡が小さくなりカリッとするまで揚げる（低温から揚げると水分が抜けてカリカリに）。油を切る。^別のフライパンに砂糖と水を入れて中火にかけ、混ぜずに2〜3分、大きな泡が細かくなりとろりとしてきたら火を止める（色づく前に）。^芋を入れて手早く絡め、混ぜ続けると砂糖が白く結晶化してシャリッとした衣になる。^クッキングシートに広げて冷ます。
いちごパフェ|生クリームに砂糖を加えて8分立てにし、絞り袋に入れる。^いちごは飾り用に3個残し、残りは縦半分に切る。ビスケットは粗く砕く。^グラスの底に砕いたビスケットを入れ、ヨーグルト・いちご・生クリームの順に層にする（ヨーグルトの酸味が甘さを引き締める）。^もう一度ビスケット・いちごを重ね、上にバニラアイスをのせる。^生クリームを絞り、飾りのいちごをのせる。グラスは事前に冷やしておくと溶けにくい。
ポップコーン|深めの鍋（ふた付き）にサラダ油とポップコーン豆を入れ、豆全体に油を絡める。^ふたをして中火にかける。ポンポンとはじけ始めたら、鍋をゆすりながら加熱する（焦げつき防止）。^はじける音が2〜3秒に1回程度になったら火を止める（最後まで待つと焦げる）。^すぐにボウルに移し、溶かしバターと塩をかけて混ぜる。キャラメルやカレー粉、のり塩でアレンジも。
ラスク|フランスパンは7mm厚に切る（前日のパンのほうが水分が抜けてカリッとなる）。オーブンを150℃に予熱。^天板に並べ、150℃で10分焼いて表面を乾燥させる。^バターをレンジで溶かし、砂糖を混ぜる。パンの片面に塗る。^150℃で10〜15分、表面がカリッときつね色になるまで焼く。^天板の上で完全に冷ます（冷めるとカリカリになる）。
りんごのコンポート|りんごは皮をむいて8等分のくし形に切り、芯を取る（皮は取っておく）。^鍋に水・砂糖・りんごの皮を入れて中火で煮立て、砂糖を溶かす（皮を入れると、きれいなピンク色に染まる）。^りんごを並べ入れ、レモン汁を加え、落としぶたをして弱めの中火で10〜15分、半透明になるまで煮る。^火を止めて皮を取り出し、煮汁に浸したまま冷ます（冷める間に味と色がしみる）。^冷蔵庫で冷やして、ヨーグルトやアイスと。1週間保存可能。
チュロス|鍋に水・バター・砂糖大さじ1・塩を入れて中火で沸騰させ、火を止めて薄力粉を一気に加えて混ぜる。^再び弱火にかけて1分、ひとまとまりになるまで練る。ボウルに移し、溶き卵を2回に分けて加えて混ぜる。^星形口金をつけた絞り袋に生地を入れる（星形にしないと揚げたときに破裂しやすい）。^揚げ油を170℃に熱し、生地を12cm長さに絞り出してはさみで切り落とす。^3〜4分、返しながらきつね色になるまで揚げる。^油を切り、熱いうちに砂糖大さじ3とシナモンを混ぜたものをまぶす。
メレンゲクッキー|卵白（2個分）は冷蔵庫で冷やしておく。ボウルは水気と油分のないものを使う（少しの油でも泡立たない）。オーブンを100℃に予熱。^卵白にレモン汁を加え、ハンドミキサーで泡立てる。白く泡立ってきたら砂糖を3回に分けて加え、角がピンと立つつやのある固いメレンゲにする（5〜6分）。^星形口金で天板に直径2cmに絞り出す。^100℃のオーブンで60〜80分、低温でじっくり乾燥焼きにする（焼き色をつけないのがきれいな白い仕上がりの秘訣）。^オーブンの中でそのまま冷まし、カリッと乾燥させる。湿気やすいので乾燥剤と一緒に密閉保存。
ごま団子|あんこを12等分して丸め、冷蔵庫で冷やしておく（冷やすと包みやすい）。^白玉粉に砂糖を混ぜ、水を少しずつ加えて耳たぶの固さにこねる。12等分にする。^生地を平たくのばしてあんこを包み、閉じ目をしっかり閉じて丸める（隙間があると揚げたときに破裂する）。^表面を水で軽く濡らし、いりごまの中で転がしてまぶし、手で押さえてしっかりつける。^揚げ油を150℃に熱し、団子を入れて転がしながら5〜6分揚げる。ふくらんで浮いてきたら、160℃に上げて1分、きつね色にする（低温からじっくりがふくらむ秘訣）。^油を切る。熱いので注意。
タピオカミルクティー|タピオカ（乾燥）はたっぷりの熱湯に入れ、中火で表示時間（約30分）ゆでる。ときどき混ぜてくっつきを防ぐ。^火を止めてふたをし、15分蒸らす（芯まで透明にもちもちに）。ざるに上げて水で洗う。^小鍋に砂糖と水を入れて中火で2分、とろりと煮詰めた黒糖風シロップ（黒糖があれば黒糖で）を作り、タピオカを漬ける。^紅茶：熱湯150ml（分量外）にティーバッグ2個を入れ、5分しっかり抽出して濃いめに淹れて冷ます。^グラスにタピオカとシロップを入れ、氷・紅茶・冷たい牛乳を注ぐ。太いストローで。
じゃがバター|じゃがいもはよく洗い、皮付きのまま十字に深めの切り込みを入れる。^ラップで包み、電子レンジ600Wで1個につき3分（2個で5〜6分）、竹串がすっと通るまで加熱する（蒸し器なら強火で25分。ほっくり度は蒸し器が上）。^切り込みを開き、熱いうちにバターをのせて塩をふる。^しょうゆを数滴たらす。塩辛やコーンをのせても。
長いもの梅和え|長いもは皮をむき、ポリ袋に入れてめん棒で叩いて粗く砕く（包丁で切るより断面がでこぼこで味が絡む）。^梅干しは種を除いて包丁で叩いてペースト状にし、めんつゆと混ぜる。^長いもと梅だれを和える。^器に盛り、せん切りの大葉をのせる。
アボカドのわさび醤油和え|アボカドは種と皮を除いて2cm角に切る。^しょうゆ・わさび・ごま油を混ぜる（わさびをしょうゆでよく溶いてから）。^アボカドを和え、ちぎったのりを加えてさっと混ぜる（のりはしんなりしすぎないよう直前に）。
トマトの塩昆布和え|トマトはへたを取ってひと口大の乱切りにする。^ボウルにトマト・塩昆布・ごま油を入れて和え、5分おく（塩昆布のうまみがトマトの水分で溶け出して味がなじむ）。^いりごまをふって器に盛る。冷やすとさらにおいしい。
冷やしトマト|トマトは冷蔵庫でよく冷やす（氷水に10分つけると一気に冷える）。^へたを取り、くし形に切る（皮の湯むきをすると口当たりがなめらかに）。^器に盛り、食べる直前に塩をふる（早くふると水が出る）。好みでマヨネーズを添える。
塩キャベツ|キャベツはひと口大にちぎり（包丁より断面がでこぼこで味がなじむ）、冷水に5分つけてパリッとさせ、水気をしっかり切る。^ごま油・鶏がらスープの素・塩・すりおろしにんにくを混ぜてたれを作る。^ポリ袋にキャベツとたれを入れて軽くもみ、5分なじませる。^器に盛り、いりごまをふる。居酒屋の定番。
ピーマンの焼きびたし|ピーマンは縦半分に切り、種とへたを取る（丸ごと焼いて種ごと食べても）。^フライパンにサラダ油を中火で熱し、ピーマンを皮目から入れて2分、焼き色がつくまで押さえながら焼く。返して1分焼く。^めんつゆを水大さじ3（分量外）で割ってバットに入れ、焼きたてのピーマンを漬ける（熱いうちに漬けると味がしみる）。^10分以上おき、かつお節をかける。冷やしてもおいしい。
しいたけのバター醤油焼き|しいたけは石づきを取り、軸は手で裂く。かさの裏に十字の切り込みを入れる（洗わずにペーパーで汚れを拭く。洗うと水っぽくなる）。^フライパンにバターを中火で溶かし、しいたけをかさの裏を上にして並べ、2分焼く。^返して1分半、かさにこんがり焼き色がつくまで焼く。^しょうゆを回し入れて10秒絡める。かさの裏にたまった汁ごと器へ。
焼きなす|なすはへたの周りにぐるりと浅く切り込みを入れ、がくを取る。縦に1本浅く切り込みを入れる（皮がむきやすい）。^魚焼きグリル（または焼き網）で強火で10〜12分、途中で転がしながら、皮が真っ黒に焦げて全体がやわらかくなるまで焼く（皮はしっかり焦がしたほうが香ばしく、むきやすい）。^熱いうちに冷水にさっとつけ（または手を水で冷やしながら）、へたの方から皮をむく。^へたを落として縦に裂き、器に盛る。^おろししょうがとかつお節をのせ、しょうゆをかける。冷やしても。
ししとうのおかか炒め|ししとうは竹串で1か所穴をあける（加熱中の破裂を防ぐ）。^フライパンにごま油を中火で熱し、ししとうを2分、ところどころ焼き色がつくまで炒める。^しょうゆ・みりんを加えて30秒絡める。^火を止めてかつお節を加えて混ぜる。
厚揚げのねぎ味噌焼き|厚揚げは熱湯をかけて油抜きし、4等分に切る。長ねぎはみじん切り。^味噌・みりん・砂糖・長ねぎを混ぜてねぎ味噌を作る。^厚揚げの上面にねぎ味噌を塗る。^トースター（1000W）で6〜8分、味噌にこんがり焼き色がつくまで焼く（グリルなら中火で5分）。七味をふっても。
油揚げのピザ|油揚げはペーパーで挟んで押さえ、余分な油を取る。ピーマンは薄い輪切り。^油揚げにケチャップを塗り、ピーマンをのせ、チーズを散らす。^トースターで4〜5分、チーズが溶けて油揚げの縁がカリッとするまで焼く。^4等分に切る。低糖質のおつまみに。
ちくわきゅうり|きゅうりはちくわの長さに合わせて切り、ちくわの穴に合う太さの棒状に切る。^ちくわの穴にきゅうりを差し込む（きゅうりの角を少し削ると入れやすい）。^斜め半分に切り、マヨネーズ（七味やわさびを混ぜても）を添える。
卵黄の醤油漬け|卵は冷凍庫で一晩凍らせてから解凍すると、黄身がねっとり濃厚になる（そのままでも可）。^しょうゆとみりんを混ぜる（みりんはレンジで30秒加熱してアルコールを飛ばすとまろやか）。^卵黄だけを取り出し、小さめの容器に並べてたれを静かに注ぐ。^ラップをして冷蔵庫で半日〜1日漬ける（半日でとろり、1日でねっとり）。^ご飯にのせたり、おつまみに。卵白はスープなどに。
煮卵|卵は冷蔵庫から出したてを、沸騰した湯にお玉でそっと入れる。^中火で6分半ゆでる（とろとろの半熟。7分でしっかり半熟）。最初の1分は菜箸で転がすと黄身が中央に寄る。^すぐ氷水にとって5分冷やし、水の中で殻をむく（急冷すると殻がむきやすく、余熱で火が入らない）。^しょうゆ・みりん・水を小鍋で一度沸かして冷ます。^ポリ袋に卵とたれを入れ、空気を抜いて口を閉じ、冷蔵庫で一晩漬ける（ポリ袋なら少ないたれで全体が浸かる）。
温泉卵|卵は冷蔵庫から出して室温に30分おく。^鍋に1Lの湯を沸騰させて火を止め、水200mlを加える（約80℃になる）。^卵をそっと入れてふたをし、そのまま12〜13分おく（白身はとろり、黄身はねっとりの温泉卵に）。^取り出して冷水に1分つける。^器に割り入れ、めんつゆを水で割ったたれをかける。
鶏皮ポン酢|鶏皮は余分な脂を取り除き、5mm幅の細切りにする。^たっぷりの湯を沸騰させ、鶏皮を入れて中火で5分ゆでる（脂と臭みが抜ける）。^ざるに上げて冷水にとり、よく洗って水気をしっかり切る。^ポン酢と赤唐辛子の小口切りで和え、冷蔵庫で15分冷やす。^器に盛り、小ねぎをたっぷりのせる。（フライパンでカリカリに焼いてからポン酢をかけるのもおいしい）
牛すじ煮込み|牛すじはたっぷりの水から強火で沸騰させ、10分ゆでてざるに上げ、流水で汚れと脂をしっかり洗う。これをもう一度繰り返す（臭みの元をしっかり取る）。^ひと口大に切り、鍋に水・酒・しょうがの薄切りと入れて強火にかける。沸騰したらアクを取り、弱火でふたをずらして1時間煮る（圧力鍋なら加圧20分）。^大根は1.5cm厚のいちょう切りにして下ゆで10分、こんにゃくはちぎって下ゆで2分。^牛すじの鍋に大根・こんにゃく・砂糖・みりんを加えて弱めの中火で15分、しょうゆと味噌を加えて15分煮込む。^火を止めて一度冷ますと味がしみる。食べる前に温め、小口切りの長ねぎをたっぷりと。七味を添えて。
もつ煮込み|もつは熱湯で5分下ゆでしてざるに上げ、流水でよく洗う（臭みが抜ける）。^大根・にんじんはいちょう切り、こんにゃくはちぎって下ゆで、しょうがは薄切り。^鍋に水・酒・もつ・しょうがを入れて強火で沸騰させ、アクを取って弱火で20分煮る。^大根・にんじん・こんにゃく・砂糖・みりんを加えて15分煮る。^味噌を溶き入れ、弱火でさらに15分、ときどき混ぜながら煮込む（味噌を2回に分けて入れ、最後に香りづけ分を残しても）。^器に盛り、小口切りの長ねぎをのせて七味をふる。
たこわさ|たこは薄くそぎ切りにして、さらに細切りにする（市販のわさび漬けがあればそれで和えても）。^わさび・しょうゆ・みりんを混ぜる（本わさびだと格段においしい）。^たこと和え、冷蔵庫で15分なじませる。^器に盛る。のりや大葉を添えても。
まぐろのユッケ|まぐろ（刺身用）は1cm角に切る。^しょうゆ・コチュジャン・ごま油・砂糖・すりおろしにんにくを混ぜる。^まぐろをたれで和え、冷蔵庫で5分なじませる。^器に盛り、中央をくぼませて卵黄をのせる。小口切りの小ねぎといりごまをふる。黄身を崩しながら食べる。
サーモンのマリネ|サーモン（刺身用）は5mm厚のそぎ切りにし、塩少々をふって5分おき、水気を拭く。^玉ねぎは薄切りにして水に5分さらし、水気を絞る。レモンは薄いいちょう切り。^オリーブオイル・酢・砂糖・塩・こしょうを混ぜてマリネ液にする。^バットにサーモン・玉ねぎ・レモンを並べ、マリネ液をかけてラップをし、冷蔵庫で30分以上漬ける。あればディルやケッパーを。
あさりの酒蒸し|あさりは3%の塩水で1時間砂抜きし、殻同士をこすり合わせて洗う。^フライパンにあさりと酒を入れ、ふたをして中火にかける。^2〜3分、殻が開いたらすぐ火を止める（開いたらすぐ止めると身がふっくら）。^バターとしょうゆ少々を加えて全体を混ぜる。^汁ごと器に盛り、小ねぎを散らす。汁が絶品なので残さずに。
クリームチーズのおかか醤油|クリームチーズは1.5cm角に切る（冷えているほうが切りやすい。包丁を温めるとさらにきれい）。^器に盛り、かつお節をのせる。^食べる直前にしょうゆをたらす。わさびやのりを添えても。
じゃがいもの明太マヨ焼き|じゃがいもは皮付きのまま洗い、ラップで包んでレンジ600Wで5〜6分、竹串がすっと通るまで加熱する。^ひと口大に切って耐熱皿に並べる。^たらこは薄皮を除いてほぐし、マヨネーズと混ぜる。^じゃがいもに明太マヨをのせ、チーズを散らす。^トースターで5〜7分、こんがり焼き色がつくまで焼く。刻みのりや小ねぎを。
かぼちゃサラダ|かぼちゃは種とわたを取り、皮をところどころむいて3cm角に切る。耐熱容器でふんわりラップし、レンジ600Wで5分、やわらかくなるまで加熱する。^熱いうちにフォークで粗くつぶす（皮も少し混ぜると彩りが良い）。^玉ねぎは薄切りにして水にさらし、水気を絞る。レーズンはぬるま湯につけてやわらかくする。^かぼちゃが冷めたら、玉ねぎ・レーズン・マヨネーズを加えて混ぜ、塩・こしょうで調える。ナッツやクリームチーズを加えても。
ごぼうサラダ|ごぼうはたわしで洗い、5cm長さのせん切りにして水に3分さらす。にんじんもせん切り。^熱湯にごぼうを入れて2分、にんじんを加えて30秒ゆでる（シャキシャキ感が残る程度に）。^ざるに上げて水気をしっかり切り、熱いうちにしょうゆ・酢・砂糖をからめて下味をつける。^冷めたらマヨネーズとすりごまで和える。冷蔵庫で冷やすと味がなじむ。
春菊のサラダ|春菊は葉を摘み、冷水に5分つけてパリッとさせ、水気をよく切る（茎は硬いので炒め物などに）。^フライパンにごま油を中火で熱し、じゃこを2分、カリカリになるまで炒める。^火を止めてしょうゆ・酢を加え、ジュッと混ぜてドレッシングにする。^春菊に熱々のじゃこドレッシングをかけ、すぐに混ぜて食べる。
水菜とじゃこのサラダ|水菜は5cm長さに切り、冷水に5分つけてパリッとさせ、水気をよく切る。^じゃこはフライパンで中火で2分からいりしてカリッとさせる（またはごま油少々で炒める）。^器に水菜を盛り、じゃことちぎったのりをのせる。^ポン酢とごま油を混ぜ、食べる直前にかける。
ほうれん草のナムル|ほうれん草は根元を洗い、塩ゆでで根元から20秒、全体で計50秒ゆでる。冷水にとって色止めする。^水気をしっかり絞り、4cm長さに切ってもう一度絞る（水気が残ると味がぼやける）。^ごま油・塩・鶏がらスープの素・すりおろしにんにくを加え、手でもみ込むように和える（韓国流。手で和えると味がよくなじむ）。^いりごまを指でひねりながら加える。
ブロッコリーのおかかマヨ|ブロッコリーは小房に分け、茎は皮をむいて薄切りにする。^沸騰した湯に塩少々を入れ、ブロッコリーを2分ゆでる（少し歯ごたえを残す）。ざるに上げて水にとらずに冷ます（水っぽくならない）。^マヨネーズ・しょうゆ・かつお節を混ぜて和える。
にんじんのたらこ炒め|にんじんは4cm長さのせん切り。たらこは薄皮を除いてほぐし、酒と混ぜる（ほぐしやすくなり、全体にまんべんなく絡む）。^フライパンにサラダ油を中火で熱し、にんじんを3分、しんなりするまで炒める。^たらこを加えて1分、たらこの色が白っぽく変わるまで炒める。^しょうゆ少々で調える。
きのこのマリネ|しめじはほぐし、エリンギは縦に裂いて長さを半分に、マッシュルームは半分に切る。にんにくはみじん切り。^酢・砂糖・塩・こしょうを混ぜてマリネ液を作る。^フライパンにオリーブオイルとにんにくを入れ弱火で1分、中火にしてきのこを入れ、3〜4分、焼き色がつくまであまり触らずに焼く（焼き付けると香ばしく、うまみが凝縮する）。^熱いうちにマリネ液に漬ける。^冷蔵庫で30分以上なじませる。3〜4日保存可能。
白菜の浅漬け|白菜は芯をそぎ切り、葉はざく切りにする。赤唐辛子は種を取って小口切り（あれば昆布2cm・ゆずの皮も）。^ポリ袋に白菜と塩を入れてもみ、白菜がしんなりするまで1分。^唐辛子を加えて空気を抜いて口を閉じ、重しをのせて冷蔵庫で1時間以上漬ける。^水気を絞って器に盛る。しょうゆをたらしても。
大根の甘酢漬け|大根は皮をむいて5mm厚のいちょう切り（または拍子木切り）にする。^塩をまぶして10分おき、しんなりしたら水気をしっかり絞る。^酢と砂糖を混ぜて砂糖を溶かし、赤唐辛子の小口切りを加える。^保存容器に大根と甘酢を入れ、冷蔵庫で1時間以上漬ける。1週間ほど保存できる。
納豆キムチ|納豆はよく混ぜて粘りを出し、付属のたれを加える。^キムチは粗く刻む。^納豆とキムチ・ごま油を混ぜ、器に盛って小ねぎを散らす。ご飯やのりで巻いても。
チーズ春巻き|春巻きの皮の手前に大葉を敷き、スライスチーズを2つ折りにしてのせる。^手前からひと巻きし、左右を折り込んで巻き、巻き終わりに水溶き小麦粉を塗って留める（しっかり閉じないとチーズが流れ出る）。^揚げ油を170℃に熱し、2分、返しながらきつね色になるまで揚げる（チーズは溶ければOKなので短時間で）。^油を切り、斜め半分に切る。
餃子の皮ピザ|ウインナーは薄い輪切りにする。^天板にアルミホイルを敷き、餃子の皮を並べる。^ケチャップを薄く塗り、ウインナーとチーズをのせる。^トースターで3〜4分、チーズが溶けて皮の縁がパリッと色づくまで焼く（焦げやすいので様子を見ながら）。
ささみの梅しそ巻き|ささみは筋を取り、縦に切り込みを入れて観音開きにし、ラップをかぶせてめん棒で薄くのばす。^梅干しは種を除いて叩き、ペーストにする。^ささみに梅肉を塗り、大葉を2枚のせて手前からくるくる巻き、つまようじで留める。^フライパンにサラダ油を中火で熱し、ささみの巻き終わりを下にして入れ、転がしながら2分焼く。^酒をふってふたをし、弱火で4〜5分蒸し焼きにする（ふっくらしっとり）。^つまようじを抜き、斜め半分に切る。
枝豆のペペロンチーノ|枝豆はさやの両端を少し切り、塩少々（分量外）でもんで産毛を取り、熱湯で3分ゆでる（固めに）。水気を切る。^にんにくは薄切り、赤唐辛子は種を取って小口切り。^フライパンにオリーブオイル・にんにく・唐辛子を入れ、弱火で2分、にんにくが薄く色づくまで香りを出す。^枝豆を加えて中火で2分、さやに焼き色がつくまで炒める。^塩をふって絡める。

味噌カツ|味噌だれ：小鍋に赤味噌（八丁味噌）・砂糖・みりん・だしを入れ、弱めの中火で3〜4分、木べらで混ぜながら、つやが出てとろりとするまで煮詰める（焦げやすいので弱めの火で）。^豚肉は焼く20分前に冷蔵庫から出し、筋切りしてめん棒で軽く叩き、形を整える。塩・こしょうをふる。^薄力粉→溶き卵→パン粉の順につけ、パン粉を軽く押さえて5分おく。^揚げ油を170℃に熱し、豚肉を入れて3分触らずに揚げ、返して2〜3分。泡が小さくなり、きつね色になったら引き上げる。^網に立てて3分休ませ（余熱で中まで火が通る）、2cm幅に切る。^せん切りキャベツを敷いた皿に盛り、熱い味噌だれをたっぷりかけていりごまをふる。
味噌カツ丼|味噌だれ：小鍋に赤味噌・砂糖・みりん・だしを入れ、弱めの中火で3〜4分、混ぜながらとろりとするまで煮詰める。^豚肉は筋切りして叩き、塩・こしょう。薄力粉→溶き卵→パン粉をつけて5分おく。^揚げ油を170℃に熱し、3分揚げて返し、2〜3分揚げる。網に立てて3分休ませ、2cm幅に切る。^丼にご飯を盛り、せん切りキャベツを敷く（キャベツがたれと揚げ油の重さを受け止めてくれる）。^とんかつをのせ、味噌だれをたっぷりかける。好みでからしを。
味噌煮込みうどん|鶏肉はひと口大、長ねぎは斜め切り、しいたけは飾り包丁、油揚げは熱湯をかけて三角に切る。^ゆでうどんはさっと湯通しして表面のぬめりを落とす（本場は生麺を下ゆでせずに煮込む。乾麺なら固めにゆでる）。^土鍋にだしを入れて中火で煮立て、赤味噌（八丁味噌）・砂糖・みりんを溶き入れる。^鶏肉・しいたけ・油揚げを入れて5分煮る。^うどんと長ねぎを加え、中火で3〜4分、うどんに味噌がしみ込むまで煮込む。^卵を割り落とし、ふたをして1〜2分、白身が白くなったら火を止める。土鍋のふたを取り皿代わりにして食べるのが名古屋流。
ひつまぶし|たれ：小鍋にしょうゆ・みりん・砂糖・酒を入れて中火で2分、とろりと煮詰める（蒲焼きに付属のたれがあれば足す）。^うなぎは酒をふってアルミホイルにのせ、トースターで3〜4分温める（表面をカリッとさせるのが名古屋風の香ばしさ）。たれを塗ってさらに1分焼き、1.5cm幅に切る。^だしを温め、薄口しょうゆ少々（分量外）で味を調える（お茶漬け用）。小ねぎは小口切り、のりは刻む、三つ葉は2cm長さ。^おひつ（または丼）にご飯を盛り、たれを少しかけてうなぎを敷き詰め、残りのたれをかける。^食べ方：まず1杯目はそのまま、2杯目は薬味（ねぎ・のり・わさび）をのせて、3杯目は薬味をのせて熱いだしをかけてお茶漬けに。4杯目は好きな食べ方で。
台湾ラーメン|にんにくはみじん切り、赤唐辛子は種ごと小口切り、にらは3cm長さ。^フライパンにごま油・にんにく・唐辛子を入れて弱火で1分、香りが出たら中火にしてひき肉を3分、カリッとするまで炒める。豆板醤・しょうゆ大さじ1を加えて1分炒め、台湾ミンチにする（辛さは唐辛子の量で調整）。^鍋に水・鶏がらスープの素・しょうゆ大さじ1.5・塩を入れて煮立て、スープを作る。^もやしはさっとゆでる。中華麺は表示時間通りゆでる。^温めた丼にスープを注ぎ、麺を入れる。もやし・台湾ミンチ・にらをのせる（にらはスープの熱でしんなりさせる）。
あんかけスパゲッティ|あんかけソース：鍋に水・ケチャップ・中濃ソース・コンソメ・砂糖・黒こしょうを入れて中火で煮立てる。水溶き片栗粉（片栗粉＋水大さじ3）を加え、混ぜながら1分、しっかりとろみをつける（黒こしょうはたっぷり効かせるのが名古屋流）。^スパゲッティ（できれば2.2mmの太麺）を表示時間通りゆでる。^ウインナーは斜め切り、玉ねぎは薄切り、ピーマンは細切り。^フライパンにサラダ油を中火で熱し、ゆでたスパゲッティを入れて2分、焼き付けるように炒める（麺を炒めるのが名古屋あんかけの特徴）。バターを加えて絡め、皿に盛る。^同じフライパンでウインナー・玉ねぎ・ピーマンを2分炒め、スパゲッティにのせる。^熱々のあんをたっぷりかける。
天むす|えびは尾を残して殻をむき、背わたを取る。腹に切り込みを入れてまっすぐにし、塩少々をふる。^衣：薄力粉と冷水を混ぜる（少しダマが残る程度。冷水でカラッと揚がる）。^揚げ油を180℃に熱し、えびに薄力粉（分量外）を薄くまぶしてから衣をつけ、1分半、カラッと揚げる。^揚げたてのえびにめんつゆをさっとくぐらせる（下味をつけると冷めてもおいしい）。^ご飯を8等分し、軽く塩をした手でえびを包み、尾が出るように三角ににぎる。^のりを帯状に巻く。
どて煮|牛すじはたっぷりの水から10分下ゆでしてざるに上げ、流水で洗う。これを2回繰り返し、ひと口大に切る。^こんにゃくはひと口大にちぎり、2分下ゆで。しょうがは薄切り。^鍋に水・酒・しょうが・牛すじを入れて強火で沸騰させ、アクを取って弱火で40分、やわらかくなるまで煮る。^こんにゃく・赤味噌（八丁味噌）・砂糖・みりんを加え、弱火でときどき混ぜながら30〜40分、煮汁がとろりと煮詰まるまで煮込む（焦げやすいので底から混ぜる）。^器に盛り、小口切りの小ねぎをたっぷり。七味をふる。
小倉トースト|食パン（厚切りがおすすめ）をトースターで3分、表面がこんがりきつね色になるまで焼く。^熱いうちにバターをたっぷり塗る（バターが溶けて染み込むのがおいしさの秘訣）。^あんこを厚めにのせる。^半分に切る。ホイップクリームをのせると「小倉トーストのクリーム添え」に（名古屋の喫茶店の定番）。
鉄板ナポリタン|スパゲッティを塩を入れた湯で表示時間より2分長くゆで、ざるに上げてサラダ油少々をまぶす（やわらかめのもちっとした麺が喫茶店ナポリタンの特徴。可能なら冷蔵庫で数時間寝かせる）。^ウインナーは斜め切り、玉ねぎは薄切り、ピーマンは輪切り。^フライパンにサラダ油を中火で熱し、ウインナー・玉ねぎを2分炒め、ケチャップを加えて1分、煮詰めるように炒める（酸味が飛び、甘みが出る）。^スパゲッティ・ピーマン・中濃ソースを加えて2分、焼き付けるように炒め、バターを加える。^鉄板（なければ耐熱皿をトースターで熱しておく）を強火で熱し、溶き卵を流して薄く広げる。^卵が半熟のうちにナポリタンをのせ、ジュージューいううちに食卓へ。粉チーズとタバスコを添えて。
きしめん|油揚げは油抜きして、だし100ml（分量外）・しょうゆ小さじ1・砂糖小さじ1（各分量外）で5分煮て甘辛く味をつける。^小松菜は塩ゆでして4cm長さに切る。^鍋にだし・薄口しょうゆ・しょうゆ・みりんを入れて中火で温め、つゆを作る（たまり醤油を使うと名古屋らしい濃い色に）。^きしめんは表示時間通りゆでる（平打ち麺は湯にくっつきやすいので、入れたらすぐ菜箸でほぐす）。^温めた丼に麺を入れて熱いつゆを注ぎ、油揚げ・かまぼこ・小松菜をのせる。^かつお節をたっぷりのせる（花かつおがゆらゆら踊るのが名古屋きしめんの象徴）。
ジンギスカン|たれ：りんご・玉ねぎ・にんにく・しょうがをすりおろし、しょうゆ・砂糖・みりんと混ぜる（果物の酵素で肉がやわらかくなる）。^ラム肉の半量をたれに15分漬ける（漬け込み式）。残りはそのまま焼いて、たれをつけて食べる（後付け式）と2つの味が楽しめる。^玉ねぎは1cm厚の輪切り、ピーマンは乱切り、キャベツはざく切り。^ジンギスカン鍋（なければホットプレートかフライパン）を強めの中火で熱し、サラダ油（あれば羊脂）をなじませる。^中央に肉、周りに野菜を置く（中央の肉の脂が流れて周りの野菜を焼く構造）。^肉は両面30秒〜1分ずつ、色が変わったらすぐ食べる（ラムは焼きすぎるとかたくなる）。もやしは最後に肉汁を吸わせて。
スープカレー|鶏肉は骨に沿って切り込みを入れ、塩・こしょうをふる。玉ねぎは1/2個をすりおろし、1/2個はみじん切り。にんにく・しょうがはすりおろす。^鍋にサラダ油を中火で熱し、鶏肉を皮目から入れて5分、皮がパリッとするまで焼いて取り出す。^同じ鍋でみじん切りの玉ねぎを中火で10分、濃いあめ色になるまで炒める（スープカレーのコクの源）。にんにく・しょうが・すりおろし玉ねぎを加えて3分炒める。^カレー粉を加えて弱火で1分、トマト缶を加えて3分炒める。水・鶏がらスープの素を加え、鶏肉を戻して弱めの中火で30分煮込む。^野菜：じゃがいも・にんじんはレンジで4分加熱し、なす・かぼちゃ・ピーマン・じゃがいも・にんじんを素揚げ（170℃で2〜3分）か、フライパンで多めの油で焼く。卵は7分ゆでる。^しょうゆ・塩で調える。器にスープと鶏肉を盛り、野菜を彩りよくのせる。ご飯は別皿で、スプーンですくってスープに浸して食べる。
ザンギ|鶏肉は大きめのひと口大（40gほど）に切る。^しょうゆ・酒・オイスターソース・すりおろしにんにく・しょうがをもみ込み、冷蔵庫で30分以上漬ける（下味をしっかりつけるのが唐揚げとの違い）。^溶き卵を加えてよくもみ込む（衣がふんわりし、肉がジューシーになる）。^片栗粉と薄力粉を混ぜたものを加え、全体にまぶす。^揚げ油を170℃に熱し、4分揚げて取り出し、3分休ませる。^油を190℃に上げ、1分二度揚げしてカリッとさせる。レモンを添える（地元では塩こしょうやウスターソースをつけることも）。
きりたんぽ鍋|ごぼうはささがきにして水にさらす。まいたけはほぐす、長ねぎは斜め切り、春菊は5cm長さ。きりたんぽは斜め半分に切る。^鶏肉はひと口大に切る（あれば比内地鶏）。^鍋にだし・しょうゆ・みりん・酒・塩を入れて中火で煮立て、鶏肉とごぼうを入れて10分煮る（ごぼうと鶏の出汁が、きりたんぽ鍋の味の土台）。アクを取る。^まいたけ・長ねぎを加えて3分煮る。^きりたんぽを入れて3〜4分（煮すぎると溶けるので、表面がやわらかくなったら食べどき）。^春菊を入れて30秒で完成。
いも煮|里芋は皮をむいて大きければ半分に切り、塩でもんでぬめりを洗い流す。^こんにゃくはちぎって2分下ゆで。長ねぎは斜め切り、まいたけはほぐす。^鍋に水と里芋・こんにゃくを入れて中火にかけ、沸騰したら弱めの中火で15分、里芋に竹串がすっと通るまで煮る。^砂糖・酒・しょうゆの半量・みりんを加えて5分煮る。^牛肉を1枚ずつほぐしながら入れ（固まらないように）、アクを丁寧にすくって3分煮る（牛肉は最後に入れてやわらかく）。^残りのしょうゆ・まいたけ・長ねぎを加え、2分煮て完成。山形の秋の芋煮会の味。
せんべい汁|鶏肉はひと口大、ごぼうはささがき、にんじんは短冊切り、しいたけは薄切り、長ねぎは斜め切り。^鍋にだしと鶏肉・ごぼう・にんじん・しいたけを入れて中火で煮立て、アクを取って弱めの中火で10分煮る。^しょうゆ・みりん・酒・塩で調える。^南部せんべい（鍋用のかやき煎餅）を4つ割りにして入れ、2〜3分煮る（煮すぎるととろけ、少なめだとアルデンテのような食感。好みで）。^長ねぎを加えてひと煮立ちさせる。
牛タン焼き|牛タン（厚切り）は格子状に浅く切り込みを入れる（かたい部分が噛み切りやすくなる）。^塩・黒こしょうをふって10分おく。^ねぎ塩だれ：長ねぎをみじん切りにし、ごま油・鶏がらスープの素・塩少々・レモン汁少々を混ぜる。^フライパン（または焼き網）を強火でしっかり熱し、サラダ油を薄く塗って牛タンを並べる。^片面40秒〜1分、焼き色がついたら返して30秒（厚切りなら片面1分半ずつ）。焼きすぎるとかたくなる。^器に盛り、ねぎ塩だれとレモンを添える。麦飯とテールスープを合わせれば仙台定食。
ずんだ餅|枝豆は塩少々（分量外）でもんで、熱湯で5分、やわらかめにゆでる。^さやから出し、薄皮も1粒ずつ取る（薄皮を取るとなめらかで鮮やかな緑色に）。^すり鉢（またはフードプロセッサー）ですりつぶし、砂糖・塩を加えてすり混ぜる。水を少しずつ加えて、とろりとした「ずんだ」の固さにする（粒を少し残すのが仙台流）。^もちは焼くか、熱湯に1〜2分つけてやわらかくする。^もちにずんだをたっぷりからめる。
はらこ飯|米は洗ってざるに上げ、30分おく。^鍋に水・しょうゆ・みりん・酒・砂糖を入れて中火で煮立て、鮭を入れて弱めの中火で5分煮る。鮭を取り出し、皮と骨を除いて大きめにほぐす。^火を止めた煮汁に（60℃くらいまで冷ましてから）いくら（筋子をほぐしたもの）をさっとくぐらせ、すぐに取り出す（くぐらせすぎるといくらが白くかたくなる）。^炊飯器に米と煮汁を入れ、2合の目盛りまで水を足して普通に炊く（鮭の煮汁でご飯に味がしみる）。^炊き上がったら鮭の半量を混ぜ込み、10分蒸らす。^器に盛り、残りの鮭といくらをたっぷりのせる。
じゃじゃ麺|肉味噌：しょうが・にんにく・長ねぎはみじん切り。フライパンにごま油を中火で熱し、しょうが・にんにくを30秒、ひき肉を加えて3分炒める。味噌・甜麺醤・砂糖・水を加え、弱火で5分、ぽってりするまで練り煮にする。^きゅうりはせん切り、長ねぎ（白い部分）はみじん切り。^うどん（盛岡では平打ちの太麺）を熱湯で温め、湯を切る（温かいまま使う）。^器に麺を盛り、肉味噌・きゅうり・長ねぎをのせる。^酢・ラー油・おろしにんにくを好みで加え、よく混ぜて食べる。^最後に皿に生卵を割って溶き、ゆで汁を注ぎ、肉味噌と塩を足して「ちーたんたん（鶏蛋湯）」スープにする（盛岡の締めの定番）。
もんじゃ焼き|キャベツは粗みじん切り（5mm角）。たらこはほぐし、もちは1cm角に切る。^ボウルに薄力粉・和風だしの素を入れ、水を少しずつ加えてダマなく混ぜ、中濃ソースを加えて生地を作る（シャバシャバの水のような生地でOK）。^鉄板（またはホットプレート）を中火で熱してサラダ油を塗り、キャベツ・天かすを炒める。2分ほどしんなりしてきたら、ヘラで刻みながら中央をあけてドーナツ状の土手を作る。^土手の中に生地の半量を流し入れ、ふつふつしてとろみがついてきたら残りの生地とたらこ・もちを入れる。^1〜2分煮立ててとろりとしたら、土手を崩して全体を混ぜ、薄く広げる。チーズをのせる。^青のりをふり、小さなヘラ（はがし）で鉄板に押し付け、焦げ目がついたところからすくって食べる。
深川めし|あさりは砂抜きして洗う。長ねぎは斜め切り、しょうがはせん切り。^鍋にあさりと酒を入れてふたをし、中火で3分、口が開いたらすぐ火を止める。身を殻から外し、蒸し汁は取っておく（身は煮すぎるとかたくなるので先に取り出す）。^鍋にだしとあさりの蒸し汁・しょうがを入れて中火で煮立て、長ねぎを加えて2分煮る。^味噌を溶き入れ、あさりの身を戻して30秒温める（煮立てない）。^丼にご飯を盛り、あさりと汁をたっぷりかける。三つ葉をのせる（深川の漁師町のぶっかけ飯）。
なめろう|あじ（刺身用）は三枚におろして皮をむき、小骨を抜く（刺身用のものを買うと楽）。^長ねぎ・しょうが・大葉はみじん切りにする。^まな板の上であじを粗く刻み、薬味と味噌をのせて、包丁で叩きながら混ぜる。^粘りが出て、皿を舐めたくなるほどねっとりするまで1〜2分叩き続ける（叩き加減で食感が変わる。粗めも細かめもお好みで）。^器に盛り、大葉を添える。^残ったら丸めて大葉で挟み、フライパンで焼くと「さんが焼き」になる。
サンマーメン|豚肉は細切り、もやしはひげ根を取る、にんじんは細切り、キャベツはざく切り。^鍋に水・鶏がらスープの素・しょうゆ・塩・こしょうを入れて中火で温め、スープを作る。^フライパンにごま油を強火で熱し、豚肉を2分炒め、にんじん・キャベツ・もやしを加えて1分、強火で手早く炒める（野菜のシャキシャキ感を残す）。^スープお玉2杯を加えて煮立て、水溶き片栗粉を加えて混ぜ、とろみをつける。^中華麺を表示時間通りゆで、温めた丼に入れて残りのスープを注ぐ。^熱々のあんをたっぷりかける（とろみで最後まで冷めにくい、横浜のご当地麺）。
ほうとう|かぼちゃは種とわたを取り、皮付きのまま3cm角に切る。にんじんはいちょう切り、白菜はざく切り、しいたけは薄切り、長ねぎは斜め切り。豚肉は4cm長さ。^土鍋にだしを入れて中火で煮立て、豚肉・にんじん・かぼちゃ・しいたけを入れて8分煮る。アクを取る。^ほうとう麺を下ゆでせずにそのまま入れ、白菜を加える（麺の打ち粉がとろみになるのがほうとうの特徴）。^味噌の半量を溶き入れ、中火で10分、ときどき混ぜて麺がくっつかないように煮込む。^かぼちゃが煮崩れてとろりとしたら、残りの味噌としょうゆで調える。長ねぎを加えて1分。^熱々を土鍋ごと。七味をふって。
五平餅|ご飯は炊きたてを、すりこぎで半分ほどつぶす（半殺し。粒が残る程度）。^4等分して手を水で濡らし、割り箸（または平たい木の串）に小判形に平たくにぎりつける。^タレ：くるみはフライパンで2分からいりして細かく砕き（すり鉢ですると香りが良い）、味噌・砂糖・みりん・しょうゆと混ぜる。^フライパン（またはグリル）を中火で熱し、ご飯の両面を3分ずつ、こんがり焼き色がつくまで焼く。^片面にたれを塗り、トースターかグリルで2〜3分、たれがふつふつして香ばしく焦げ目がつくまで焼く。
おやき|生地：ボウルに薄力粉・ベーキングパウダー・砂糖・塩を混ぜ、ぬるま湯を少しずつ加えて5分こねる。ラップをして30分休ませる。^なすは1cm角に切り、ごま油で中火で3分炒め、味噌・砂糖・みりんを加えて汁気がなくなるまで2分炒める。冷ます。^生地を6等分し、直径10cmの円にのばして具を包み、閉じ目をしっかりつまんで平たく整える。^フライパンにサラダ油を中火で熱し、閉じ目を下にして並べ、2分ずつ両面に焼き色をつける。^水50ml（分量外）を入れてふたをし、弱めの中火で8分蒸し焼きにする（中まで火が通り、ふっくらもちっと仕上がる）。^ふたを取って水分を飛ばし、両面を1分ずつ焼いて香ばしくする。
山賊焼き|鶏もも肉は丸ごと1枚のまま使う（大きく揚げるのが松本流）。厚い部分に包丁を入れて厚さを均一にし、フォークで皮を刺す。^しょうゆ・酒・すりおろしにんにく・しょうがをもみ込み、冷蔵庫で1時間以上（できれば一晩）漬ける（にんにくをしっかり効かせるのが山賊焼き）。^汁気を軽く切り、片栗粉を全体にたっぷりまぶす。^揚げ油を160℃に熱し、鶏肉を皮目から入れて5〜6分、返しながらじっくり揚げる。いったん取り出し、3分休ませる。^油を180℃に上げ、2分二度揚げしてカリッと仕上げる。^食べやすく切り、せん切りキャベツを添える。
鶏ちゃん|鶏肉はひと口大に切る。^味噌・しょうゆ・砂糖・酒・すりおろしにんにく・しょうがを混ぜ、鶏肉にもみ込んで30分漬ける。^キャベツはざく切り、玉ねぎは1cm幅のくし形、にんじんは短冊切り。^フライパン（または鉄板）にサラダ油を中火で熱し、鶏肉をたれごと入れて4分、焼き色がつくまで炒め焼きにする。^野菜を加えてふたをし、弱めの中火で4分蒸し焼きにする。^ふたを取り、中火で2分、全体を混ぜて味噌だれを絡める。最後は焦げたたれも香ばしい。〆にうどんを入れて焼きうどんにするのも岐阜流。
伊勢うどん|たれ：小鍋にしょうゆ（あればたまり醤油）・みりん・砂糖・和風だしの素・水を入れ、中火で2分、少しとろりとするまで煮詰める（黒く濃いのにまろやかな甘じょっぱいたれが伊勢うどんの特徴）。^伊勢うどんの麺（極太・やわらか）は熱湯で表示時間通り、たっぷりの湯でじっくりゆでる（コシのない、ふわふわもちもちの食感が本場）。普通のうどんならやわらかめにゆでる。^湯を切って器に盛り、たれを大さじ2ずつかける。^小口切りの小ねぎをのせ、よく絡めて食べる。七味をふっても。
タレカツ丼|たれ：小鍋にしょうゆ・みりん・砂糖・水を入れ、中火で2分煮立てて砂糖を溶かす（さらっとした甘辛いたれ）。^豚ヒレ肉は1cm厚に切り、めん棒で軽く叩いて5mm厚に薄くのばす（薄いカツが新潟流）。塩・こしょうをふる。^薄力粉→溶き卵→細かいパン粉をつける。^揚げ油を170℃に熱し、1分半〜2分、きつね色になるまで揚げる（薄いのですぐ火が通る）。^揚げたてのカツをたれにくぐらせる（ジュッとたれが染み込むのが命）。^丼にご飯を盛ってたれを少しかけ、カツを3〜4枚のせる。卵はとじない。
富山ブラック|長ねぎは斜め切り、メンマは市販のもの、焼き豚は厚切りにする。^鍋に水・鶏がらスープの素を入れて煮立て、しょうゆ・オイスターソースを加える（黒く濃いしょうゆスープが特徴。しょうゆの量で濃さを調整）。^フライパンにごま油を中火で熱し、長ねぎの半量を2分炒めて焦げ目をつける（ねぎ油の香ばしさをプラス）。^中華麺（太麺）を表示時間通りゆでる。^温めた丼にスープを注いで麺を入れ、焼き豚・メンマ・炒めた長ねぎ・生の長ねぎをのせる。^黒こしょうをたっぷり、表面が黒くなるくらいふる（ご飯のおかずとして食べるのが本場流）。
治部煮|鶏肉はそぎ切りにし、片栗粉をしっかりまぶす（とろみが煮汁に移り、肉がつるんとやわらかくなる。治部煮の最大の特徴）。^しいたけは飾り包丁、ほうれん草は塩ゆでして4cm長さ、焼き麩は水でもどして水気を絞る。^鍋にだし・しょうゆ・みりん・砂糖・酒を入れて中火で煮立て、しいたけと焼き麩を入れて3分煮る。^鶏肉を1枚ずつ入れ、弱めの中火で4〜5分、とろみがつくまで煮る（強火にすると片栗粉がはがれる）。^器に盛り、ほうれん草を添え、煮汁をたっぷりかけてわさびを添える。
ソースカツ丼|ソース：小鍋に中濃ソース・ケチャップ・砂糖・みりん・だしを入れて中火で1分煮立てる（甘めのソースが福井・会津流）。^豚肉は1cm厚に切り、筋切りして叩いて薄くのばす。塩・こしょうをする。^薄力粉→溶き卵→細かいパン粉をつける（細かいパン粉でソースがしみやすい薄い衣に）。^揚げ油を170℃に熱し、2分半〜3分揚げる。^揚げたてのカツを熱いソースにくぐらせる。^丼にご飯を盛り（好みでせん切りキャベツを敷く）、カツをのせる。
串カツ|豚肉はひと口大、えびは背わたを取る、玉ねぎはくし形でばらけないよう串に刺す、れんこんは1cm厚の輪切りにして酢水にさらす。^それぞれ竹串に刺し、塩・こしょうをする。^衣：薄力粉・溶き卵・水を混ぜてなめらかなバッター液を作る（とろりとした液。1回で衣がつけられ、薄く軽く揚がる）。^パン粉は細かく砕く（大阪の串カツは細かいパン粉でサクッと薄い衣）。串をバッター液にくぐらせ、パン粉をつける。^揚げ油を180℃に熱し、豚肉・えびは2分、玉ねぎ・れんこんは2分半揚げる。^ソースは中濃ソースを水で少しのばして器に入れる。キャベツを添えて（「ソースの二度づけ禁止」。追加はキャベツですくって）。
肉吸い|牛肉は食べやすく切る。豆腐は4等分に切る。^鍋にだし・薄口しょうゆ・みりん・砂糖・塩を入れて中火で煮立てる（関西風の淡い色のうどんつゆ）。^牛肉を入れて、ほぐしながら2分煮る。アクを丁寧に取る（澄んだつゆに仕上げる）。^豆腐を入れて2分温める。^卵を割り入れ、ふたをして弱火で2分、半熟に煮る。^器に盛り、小ねぎをたっぷりのせる。「肉うどんのうどん抜き」として生まれた大阪の味。小玉ご飯と一緒に。
ねぎ焼き|小ねぎは小口切りにする（たっぷりが命。生地とねぎが同じくらいの量）。^薄力粉・水・和風だしの素を混ぜて生地を作る（ゆるめに）。^フライパンにサラダ油を中火で熱し、生地を薄く丸く広げる。上にねぎをこんもりのせ、豚肉を広げてのせる。^ねぎの上から生地を少量回しかけてつなぎにする。中火で4分焼く。^ヘラで返してふたをし、弱めの中火で4分、ねぎがしんなりするまで焼く。^もう一度返して、溶き卵を上から塗るように広げて1分焼く。^しょうゆを塗り、レモンを絞って食べる（ソースではなくしょうゆとレモンが大阪・十三流）。
明石焼き|つけだし：だし500ml・薄口しょうゆ・みりん・塩を鍋で温める。^生地：薄力粉と片栗粉を混ぜ、溶き卵を加えて混ぜ、だし300mlを少しずつ加えてのばす（卵の量が多く、とろとろの生地になる）。^たこは1cm角に切る。^たこ焼き器を中火で熱し、サラダ油をたっぷり塗る。生地を流し入れ、たこを入れる。^2分焼いて縁が固まったら、竹串で丸めるように返す。弱めの中火で3〜4分、表面が薄く色づく程度に焼く（焼き色はつけすぎない。ふわふわ、とろとろが明石焼き）。^板に並べ、温かいつけだしに浸して食べる。三つ葉をだしに入れて。
そばめし|焼きそば麺は1cm長さに細かく刻む（ご飯と一体化させるのがそばめしの肝）。キャベツは粗みじん、豚肉は小さく切る。^フライパンにサラダ油を中火で熱し、豚肉を2分、キャベツを加えて1分炒める。^焼きそば麺を加えて1分、ご飯を加えて2分、ヘラで刻むように混ぜ炒める。^お好み焼きソースを加え、強火で1分、焦がすように炒め合わせる（ソースが焦げた香ばしさが神戸の味）。^器に盛り、青のりと紅しょうがをのせる。
さば寿司|すし酢：酢・砂糖・塩を混ぜて砂糖を溶かす。^炊きたてご飯にすし酢を回しかけ、切るように混ぜてうちわで冷ます。しょうがはせん切りにして混ぜ込む。^しめさばは皮の薄皮を頭側からはがし、身の厚い部分をそぎ取って厚さを均一にする（そいだ身は薄い部分に置いて形を整える）。^巻きすにラップを広げ、さばを皮目を下にして置く。酢飯を棒状にしてさばの上にのせる。^ラップごと巻きすで巻いてぎゅっと押さえ、形を整える。そのまま冷蔵庫で1時間以上なじませる。^ラップごと濡らした包丁で2cm幅に切る（1回ごとに包丁を拭く）。
にしんそば|長ねぎは斜め薄切り。にしんの甘露煮は温める（市販品を使う。汁ごと湯せんすると身が崩れない）。^鍋にだし・薄口しょうゆ・みりん・塩を入れて中火で温め、つゆを作る。^そばはたっぷりの湯で表示時間通り（乾麺で4〜5分）ゆで、流水でもみ洗いしてぬめりを取り、熱湯にさっとくぐらせて温める。^温めた丼にそばを入れて熱いつゆを注ぐ。^にしんの甘露煮をのせ、長ねぎを添える（にしんの甘辛い味がつゆに溶け出していくのが京都の味）。
広島風お好み焼き|生地：薄力粉・和風だしの素に水を少しずつ加えてダマなく混ぜる（薄いクレープのような生地）。^キャベツはせん切り（細いほうがふんわり蒸される）。^ホットプレート（またはフライパン）を中火で熱し、サラダ油を薄く塗る。生地をお玉1杯、直径20cmの薄い円に広げる。^生地の上に、キャベツ（山盛り）・もやし・天かす・豚肉の順にのせ、生地少量を上から回しかけてつなぎにする。^5分焼いたらヘラ2本で一気に返し、上から軽く押さえず4〜5分蒸し焼きにする（キャベツの水分で蒸されて甘くなる）。^横の空いたところで焼きそば麺をほぐしながら2分炒め、ソース少々で味付け。お好み焼きを麺の上に移す。^横で卵を割って黄身を崩して丸く広げ、その上にお好み焼きをのせて1分。返してソースを塗り、青のりをかける。
牡蠣の土手鍋|牡蠣は片栗粉と塩でやさしくもみ洗いし、水で2〜3回すすいで水気を拭く。^白菜はざく切り、長ねぎは斜め切り、春菊は葉を摘む、豆腐は8等分、しいたけは飾り包丁。^白味噌・味噌・砂糖・みりんを練り混ぜ、土鍋の内側の縁にぐるりと土手のように塗りつける（広島の伝統。少しずつ溶かして濃さを調整できる）。^土鍋の中央にだしを注ぎ、白菜の芯・豆腐・しいたけ・長ねぎを入れて中火にかける。^煮立ったら土手の味噌を少しずつ崩して溶かしながら5分煮る。^牡蠣を入れて2〜3分、ぷっくりとふくらんだら食べる（煮すぎると縮んでかたくなる）。春菊は最後に。
かけうどん|鍋にだし・薄口しょうゆ・みりん・塩を入れて中火で温める（あればいりこだしを使うと讃岐の味。だしは昆布といりこを水に一晩浸けて、弱火で10分煮出す）。^うどん（あれば讃岐うどんの冷凍麺）は熱湯で表示時間通りゆでる。^ざるに上げて湯を切り、温めた丼に入れる。^熱いつゆをたっぷり注ぐ。^小口切りの小ねぎ・天かす・おろししょうがをのせる（讃岐の店のトッピング台のように自由に）。
デミカツ丼|デミソース：小鍋にバターを中火で溶かし、薄力粉大さじ1を加えて2分、茶色くなるまで炒める（ブラウンルウ）。^水を少しずつ加えて混ぜ、ケチャップ・中濃ソース・コンソメを加え、弱火で5分、とろりとするまで煮込む。^豚肉は筋切りして叩き、塩・こしょう。薄力粉→溶き卵→パン粉をつけて5分おく。^揚げ油を170℃に熱し、3分揚げて返し、2〜3分揚げる。網に立てて3分休ませ、切る。^丼にご飯を盛り、カツをのせて熱いデミソースをたっぷりかける。ゆでたグリーンピースを散らすのが岡山流。
瓦そば|そば（茶そばがおすすめ）は表示時間通りゆで、水で洗って水気を切る。^牛肉は小さく切り、しょうゆ・砂糖・みりんで2分炒り煮にして甘辛く味付けする。卵は錦糸卵にする。のりは刻み、レモンは薄切り。^めんつゆを温める（温かいつゆで食べるのが山口・川棚流）。^フライパン（本来は熱した瓦）にサラダ油を中火で熱し、そばを広げて3分、触らずに底をパリパリに焼く（下はカリッと、上はもちっとの食感の違いが楽しい）。^そばを皿に移し（またはフライパンのまま）、錦糸卵・牛肉・のり・レモン・もみじおろしをのせる。^温かいめんつゆにつけて食べる。
とり天|鶏肉は余分な脂を取り、ひと口大のそぎ切りにする。^しょうゆ・酒・すりおろしにんにく・しょうがをもみ込み、15分漬ける。^衣：溶き卵と冷水を合わせて60mlにし、薄力粉を加えてさっくり混ぜる（混ぜすぎない。天ぷら衣）。^揚げ油を170℃に熱し、鶏肉を衣にくぐらせて入れ、3〜4分、衣がカリッと薄く色づくまで揚げる。^油を切る。^ポン酢にからしを溶いたたれにつけて食べる（からし酢じょうゆが大分流）。
鶏飯|スープ：鍋に水・ささみ・酒を入れて中火で煮立て、弱火で5分ゆでてささみを取り出す（鶏の出汁を取る）。スープに鶏がらスープの素・薄口しょうゆ・塩を加えて調える。^ささみは冷めたら細かく裂く。^しいたけ（干ししいたけがおすすめ）は薄切りにし、しょうゆ・砂糖・水大さじ3（分量外）で5分甘辛く煮て細切り。^卵は薄焼き卵にして錦糸卵に。小ねぎは小口切り、のりは刻む。^ご飯を茶碗に盛り、ささみ・錦糸卵・しいたけ・小ねぎ・のりを彩りよくのせる（あればパパイヤ漬け・たんかんの皮も）。^熱々のスープをたっぷりかけて食べる。奄美大島の郷土料理。
高菜チャーハン|高菜漬けは粗く刻み、水気を軽く絞る。豚肉は小さく切る。^卵を溶き、温かいご飯に混ぜて卵かけご飯にする（パラパラに仕上がる）。^フライパンにごま油を強めの中火で熱し、豚肉を2分炒める。^高菜を加えて1分炒め、香りを立たせる（高菜を炒めると辛みとうまみが立つ）。^卵ご飯を加え、ヘラで切るように混ぜながら3分、パラパラになるまで炒める。^鍋肌からしょうゆを回し入れ、塩・こしょうで調える。好みで紅しょうがや白ごまを。
ごまさば|さば（必ず刺身用の新鮮なものを。アニサキスに注意し、目視で確認する）は皮をむいて7mm厚のそぎ切りにする。^ごまだれ：すりごま・しょうゆ・みりん（煮切ったもの）・わさびを混ぜる（すり鉢でごまをすると格段に香りが良い）。^さばをごまだれで和え、冷蔵庫で10分おく。^器に大葉を敷いてさばを盛り、小ねぎを散らす。^ご飯にのせて、熱いだしをかけてお茶漬けにするのも博多流。
太平燕|春雨は熱湯で表示時間通りもどし、水気を切る（あれば緑豆春雨）。^卵は8分ゆでて殻をむき、フライパンで少量の油で転がしながら2分焼く（揚げ卵にするのが熊本流）。半分に切る。^豚肉は食べやすく、えびは背わたを取る。白菜はざく切り、にんじんは短冊切り、しいたけは薄切り。^鍋にごま油を中火で熱し、豚肉を2分、えび・野菜を加えて2分炒める。^水・鶏がらスープの素を加えて煮立て、アクを取って5分煮る。しょうゆ・塩・こしょうで調える。^春雨を加えて2分煮て、器に盛り、揚げ卵をのせる。
トルコライス|ピラフ：玉ねぎ1/4個はみじん切り。フライパンにバター半量を中火で溶かし、玉ねぎを2分、カレー粉を加えて30秒炒め、ご飯を加えて2分炒める。塩・こしょうで調える。^ナポリタン：スパゲッティを表示時間通りゆでる。残りの玉ねぎとピーマンを細切りにし、残りのバターで2分炒め、ケチャップ大さじ3を加えて1分煮詰め、スパゲッティを加えて絡める。^とんかつ：豚肉は筋切りして塩・こしょう。薄力粉→溶き卵→パン粉をつけ、170℃の油で3分揚げて返して2〜3分。3分休ませて切る。^ソース：ケチャップ大さじ1・中濃ソースを混ぜて温める（デミグラスでも）。^皿にピラフ・ナポリタン・とんかつをワンプレートに盛り、とんかつにソースをかける（大人のお子様ランチ、長崎の名物）。
シシリアンライス|牛肉は食べやすく切る。玉ねぎは薄切り。^しょうゆ・砂糖・みりんを混ぜる。^フライパンにサラダ油を中火で熱し、玉ねぎを2分、牛肉を加えて2分炒め、たれを加えて1分、汁気が少なくなるまで炒め絡める。^レタスはせん切り、トマトは薄い半月切り、きゅうりは斜め薄切り。^皿に温かいご飯を盛り、甘辛い牛肉をのせる。^上にレタス・トマト・きゅうりをたっぷりのせ、マヨネーズを細く網目状にかける（温かいご飯と冷たい野菜の組み合わせが佐賀名物の楽しさ）。
沖縄そば|三枚肉（豚バラ）は塊のまま、たっぷりの水から強火でゆで、沸騰したら弱火で30分ゆでる。肉を取り出し、ゆで汁はスープ用に取っておく。^小鍋に三枚肉・水200ml（ゆで汁から）・しょうゆ・砂糖・酒を入れ、弱めの中火で30分、落としぶたをして煮詰める（甘辛い煮汁がしみ込んだ三枚肉に）。1cm厚に切る。^スープ：豚のゆで汁1000mlにかつお節を入れ、弱火で5分煮出してこす（豚骨とかつおの合わせだしが沖縄そばの味）。塩・薄口しょうゆで調える。^沖縄そば麺を熱湯で30秒〜1分温め、湯を切る。^丼に麺を入れて熱いスープを注ぎ、三枚肉・かまぼこ・小ねぎ・紅しょうがをのせる。^コーレーグース（島唐辛子の泡盛漬け）を数滴たらして。
ラフテー|豚バラ肉は塊のまま、たっぷりの水から強火でゆで、沸騰したら弱火で1時間ゆでる（余分な脂が抜け、皮までとろとろに）。^ゆで汁に入れたまま冷まし、5cm角に切る（表面の脂は取り除く）。ゆで汁は取っておく。^かつおだし：水600mlにかつお節を入れて弱火で5分煮出してこす。^鍋にかつおだし・酒（あれば泡盛）・砂糖・しょうがの薄切りと豚肉を入れて中火で煮立て、落としぶたをして弱火で30分煮る。^しょうゆを加え、さらに弱火で30〜40分、煮汁がとろりと照りが出るまで煮込む（しょうゆを後から入れると肉がかたくならない）。^火を止めて冷ますと味がしみる。からしを添えて。
サーターアンダギー|ボウルに卵と砂糖を入れ、泡立て器で白っぽくもったりするまで2分混ぜる。サラダ油を加えて混ぜる。^薄力粉とベーキングパウダーをふるい入れ、ゴムベラでさっくり、粉っぽさがなくなるまで混ぜる（練るとかたくなる）。^冷蔵庫で30分休ませる（生地が締まって丸めやすくなる）。^手にサラダ油を塗り、直径4cmに丸める。^揚げ油を150〜160℃（低温）に熱し、生地を入れる。7〜8分、ときどき転がしながらじっくり揚げる。^ぱっくり割れて花が咲いたように開き（チューリップ）、濃いきつね色になれば揚げ上がり（低温でじっくり揚げると割れ目ができる）。
ポーク卵おにぎり|ランチョンミートは7mm厚に切る（ご飯の大きさに合わせて）。^フライパンにサラダ油を中火で熱し、ランチョンミートを両面1分ずつ、こんがり焼き色がつくまで焼く。^卵は溶いて、同じフライパンでランチョンミートの大きさの四角い薄焼き卵を作る（両面30秒ずつ）。^のりを広げ、中央にご飯の半量をランチョンミートの大きさに四角く広げ、卵・ランチョンミートの順にのせ、さらにご飯を薄くのせる。^のりで包み、ラップで包んで5分なじませてから半分に切る（沖縄のソウルフード「ポーたま」）。
焼肉のたれ|りんご・玉ねぎ・にんにく・しょうがはすりおろす（果物と玉ねぎの酵素で肉をやわらかくし、甘みとコクを出す）。^小鍋にしょうゆ・砂糖・みりん・酒を入れて中火にかけ、煮立ったら弱火で2分、アルコールを飛ばす。^すりおろしたものを加えて再び煮立て、弱火で3分煮る（加熱すると日持ちがよく、味がまろやかに）。^火を止めてごま油といりごまを加える。^冷ましてから清潔な瓶に入れる。冷蔵で1週間保存可能。一晩おくと味がなじんでおいしくなる。
照り焼きのたれ|小鍋にしょうゆ・みりん・砂糖・酒を入れて混ぜる（1:1:0.5:1の黄金比。覚えやすい）。^中火にかけて煮立ったら、弱めの中火で2〜3分、アルコールを飛ばす。^とろみを強くしたいときは、さらに1〜2分煮詰める（冷めると少しとろみが増す）。^使い方：鶏肉やぶりを焼いて余分な脂を拭き取り、たれを加えて中火で1〜2分、煮詰めながら絡める。冷蔵で2週間保存可能。
生姜焼きのたれ|しょうがと玉ねぎはすりおろす（玉ねぎの酵素で肉がやわらかく、甘みも出る）。^しょうゆ・みりん・酒・砂糖を混ぜ、すりおろしを加えてよく混ぜる。^使い方：豚肉を焼く前にたれの半量に5分漬け（漬けすぎると肉がかたくなる）、焼いた後に残りのたれを加えて30秒絡める。^冷蔵で3日ほど保存可能。
手作りポン酢|昆布はかたく絞った布巾で表面を拭く（白い粉はうまみ成分なので洗わない）。^小鍋にみりんを入れて中火で1分煮立て、アルコールを飛ばして冷ます（煮切りみりん）。^清潔な瓶にしょうゆ・ゆず果汁・レモン汁・煮切りみりん・酢・昆布・かつお節を入れる。^冷蔵庫で一晩〜3日おき、うまみを引き出す（時間をおくほどまろやかに）。^ペーパーを敷いたざるでこし、昆布とかつお節を取り除く。冷蔵で1か月保存可能。
自家製めんつゆ|昆布はかたく絞った布巾で表面を拭く。^小鍋にみりんを入れて中火で1分煮立て、アルコールを飛ばす。^しょうゆ・水・砂糖・昆布を加えて弱火にし、煮立つ直前で昆布を取り出す（昆布は煮立てるとぬめりと雑味が出る）。^かつお節を一度に加え、弱火で2分煮て火を止める。そのまま10分おく（かつおの香りをじっくり移す）。^ペーパーを敷いたざるでこし、かつお節を軽く絞る（強く絞るとえぐみが出る）。^冷まして瓶に保存。冷蔵で2週間。3倍濃縮なので、つけつゆは3倍、かけつゆは6〜8倍に薄めて使う。
天つゆ|大根はすりおろし、ざるに上げて軽く水気を切る。^小鍋にだし・しょうゆ・みりんを入れて混ぜる（だし4：しょうゆ1：みりん1の割合が基本）。^中火にかけ、煮立ったら弱火で1分煮て火を止める。^温かいうちに器に注ぎ、大根おろし（あればおろししょうがも）を添える。天ぷらは温かいつゆにくぐらせて食べる。
ごまだれ|ボウルに練りごまを入れ、砂糖・しょうゆを加えてよく混ぜる。^酢を加えて混ぜる（酢を入れると一瞬かたくなるが、混ぜ続けるとなめらかになる）。^だしを少しずつ加えながら、なめらかでとろりとした濃度にのばす（一度に入れると分離するので少しずつ）。^すりごまを加えて混ぜる。しゃぶしゃぶ・棒棒鶏・冷やし中華・サラダに。冷蔵で5日保存可能。
甘酢あん|小鍋に水・酢・砂糖・ケチャップ・しょうゆ・片栗粉を入れ、火にかける前によく混ぜて片栗粉を溶かす（先に混ぜておくとダマにならない）。^中火にかけ、絶えず混ぜる。^煮立ってとろみがつき、透明感が出たら、さらに30秒加熱して火を止める（30秒加熱すると、片栗粉のとろみが安定して時間が経ってもゆるくならない）。^酢豚・肉団子・天津飯・揚げ魚にかけて。
南蛮酢|赤唐辛子は種を取って小口切りにする。^小鍋にだし・酢・砂糖・しょうゆを入れて中火にかける。^煮立ったら火を止め、砂糖が溶けたことを確認する（煮立てすぎると酢の香りが飛ぶので、ひと煮立ちでOK）。唐辛子を加える。^バットに入れ、揚げたての魚や鶏肉、野菜を熱いうちに漬ける（熱いうちに漬けると味がしっかりしみる）。玉ねぎやにんじんの薄切りを加えて。
すき焼きの割り下|小鍋にみりんと酒を入れて中火で1分煮立て、アルコールを飛ばす。^しょうゆ・砂糖・水を加え、砂糖が溶けるまで混ぜながらひと煮立ちさせて火を止める。^冷まして保存容器へ（冷蔵で1か月保存可能）。^使い方：関東風は割り下で肉と野菜を煮る。煮詰まったら水か割り下を足す。関西風は先に牛脂で肉を焼き、砂糖・しょうゆを直接ふって焼き付けてから割り下で調整する。
田楽味噌|小鍋に味噌・砂糖・みりん・酒を入れ、火にかける前によく混ぜる。^弱火にかけ、木べらで絶えず混ぜながら3〜4分練る（焦げやすいので弱火を守る）。^つやが出て、ぽってりと木べらで鍋底をなぞると跡が残るくらいになったら火を止める（冷めると少しかたくなるのでその手前で）。^なす・豆腐・こんにゃく・ふろふき大根に。冷蔵で2週間保存可能。白味噌で作ると上品な甘さ、赤味噌で作るとコクのある味に。
酢味噌|白味噌と砂糖をよく混ぜ、なめらかにする。^酢を少しずつ加えて溶きのばす（一度に入れると分離する）。^からしを加えて混ぜる（からし酢味噌）。^わけぎ・ほたるいか・たこ・こんにゃく・まぐろのぬたに。和える場合は具の水気をしっかり拭いてから、食べる直前に和える。
三杯酢|小鍋にだしと砂糖を入れて温め、砂糖を溶かす（だしを加えると酢の角が取れてまろやかに）。^火を止めて冷まし、酢・しょうゆ・塩を加えて混ぜる（酢は加熱すると香りが飛ぶので、冷めてから加える）。^きゅうりとわかめの酢の物・もずく・たこの酢の物に。具は塩もみなどで水気をしっかり切ってから和える。
すし酢|昆布は乾いた布巾で拭き、2cm角に切る。^小鍋に酢・砂糖・塩・昆布を入れ、弱火で混ぜながら砂糖と塩を溶かす。沸騰させない（酢の香りが飛ぶ）。^砂糖と塩が完全に溶けたら火を止め、そのまま冷ます（昆布のうまみが移る）。^使い方：炊きたてのご飯2合に、すし酢全量（約大さじ6）を回しかけ、しゃもじで切るように混ぜて、うちわで1分あおいで冷ます（つやが出て、べたつかない）。^昆布を取り出して保存容器へ。冷蔵で1か月。
和風ドレッシング|玉ねぎはすりおろす（玉ねぎの甘みとうまみが加わる）。^ボウルにしょうゆ・酢・砂糖・玉ねぎを入れ、砂糖が溶けるまでよく混ぜる。^サラダ油とごま油を少しずつ加えながら泡立て器で混ぜ、乳化させる（または瓶に入れてよく振る）。^冷蔵庫で30分以上なじませる。使う前によく振る。冷蔵で5日。
中華ドレッシング|しょうゆ・酢・砂糖を混ぜ、砂糖を完全に溶かす。^ごま油を少しずつ加えながら混ぜる。^いりごまを指でひねりながら加える（香りが立つ）。^春雨サラダ・中華くらげ・棒棒鶏・冷奴に。ラー油やすりおろしにんにく、しょうがを加えてアレンジも。
フレンチドレッシング|ボウルに酢・粒マスタード・砂糖・塩・こしょうを入れ、塩と砂糖が溶けるまで混ぜる（塩は油に溶けないので、先に酢で溶かす）。^オリーブオイルを細く少しずつ垂らしながら、泡立て器で絶えず混ぜて乳化させる（白っぽくとろりとすれば成功）。^分離したら使う直前に再び混ぜる。^葉物サラダに。食べる直前にかけてさっくり混ぜる（早くかけると葉がしんなりする）。冷蔵で1週間。
ごまドレッシング|すりごまはフライパンで弱火で30秒からいりする（香りが格段に立つ）。^ボウルにマヨネーズ・しょうゆ・砂糖・酢を入れて混ぜる。^すりごまを加えて混ぜる。^かたければ水か牛乳少々でのばす。^冷しゃぶ・大根サラダ・蒸し野菜・豆腐サラダに。冷蔵で5日。
シーザードレッシング|にんにくはすりおろす（ほんの少しでOK）。^マヨネーズ・牛乳・粉チーズ・レモン汁・にんにくを混ぜる。^黒こしょうをたっぷりひく。^あればアンチョビ1枚を細かく刻んで加えると本格的な味に。ロメインレタス・クルトン・ベーコンのシーザーサラダに。
タルタルソース|卵は沸騰した湯に入れて11分ゆで、冷水にとって殻をむく（しっかり固ゆで）。^玉ねぎはみじん切りにして水に5分さらし、ペーパーでしっかり水気を絞る（水気が残るとソースが水っぽくなり、辛みも残る）。^ゆで卵はフォークで粗くつぶす（白身は少し粒を残す）。^卵・玉ねぎ・マヨネーズ・レモン汁・砂糖・塩・こしょうを混ぜる。^あればピクルスやパセリのみじん切りを加える。エビフライ・カキフライ・チキン南蛮・白身魚フライに。冷蔵で2日。
オーロラソース|マヨネーズとケチャップを混ぜる（3:2の割合が基本）。^レモン汁を数滴加えて混ぜる。^好みでブランデー数滴や、タバスコ・おろしにんにくを加えてアレンジ。^えびフライ・ゆで野菜・から揚げ・サンドイッチに。
ハンバーグソース|ハンバーグを焼いた後のフライパンに残った肉汁と脂を使う（肉汁がソースのうまみの素。脂が多すぎればペーパーで少し拭く）。^赤ワインを加えて中火で30秒煮立て、アルコールを飛ばしながら木べらで鍋底のこびりつきをこそげる。^ケチャップ・中濃ソース・砂糖を加えて混ぜ、中火で1分、とろりと煮詰める。^火を止めてバターを加え、溶かして混ぜる（バターでつやとコクが出る）。ハンバーグにかけて。

かつ丼|豚ロース肉:2枚,玉ねぎ:1/2個,卵:4個,ご飯:400g,三つ葉:適量|塩:小さじ1/4,こしょう:少々,薄力粉:大さじ2,パン粉:50g,揚げ油:適量,だし:160ml,しょうゆ:大さじ2,みりん:大さじ2,砂糖:大さじ1|豚肉は焼く20分前に冷蔵庫から出す。脂身と赤身の境の筋を4〜5か所切り、肉たたきで軽く叩いて形を戻す。塩・こしょうをふる。^薄力粉→溶き卵（卵1個分）→パン粉の順につけ、パン粉をしっかり押さえて5分おく（衣が落ち着き、煮てもはがれない）。^揚げ油を170℃に熱し、3分触らずに揚げ、返して2〜3分。網に立てて3分休ませ、2cm幅に切る。^1人分ずつ作る。フライパンにだし・しょうゆ・みりん・砂糖の半量を入れて中火で煮立て、薄切りの玉ねぎの半量を入れて3分、しんなりするまで煮る（甘めのつゆがかつ丼の王道）。^とんかつを並べ、溶き卵（卵1.5個分）の2/3量を回し入れてふたをし、30秒。残りの卵を回し入れ、三つ葉をのせて火を止め、ふたをして30秒蒸らす。^丼にご飯を盛り、すべらせるようにのせる。|味の決め手は、甘めのつゆ（だし：しょうゆ：みりん：砂糖＝8：1：1：0.5）と、衣の上の部分はつゆにつけずにサクッと残すこと。^卵を入れる前にカツをつゆで10秒だけ煮ると、衣がつゆを吸ってご飯との一体感が出る。
天丼|むきえび:8尾,なす:1本,かぼちゃ:100g,まいたけ:1/2パック,大葉:4枚,ご飯:400g|薄力粉:60g,卵:1/2個,冷水:90ml,揚げ油:適量,しょうゆ:大さじ3,みりん:大さじ3,砂糖:大さじ1.5,だし:大さじ4|丼たれ：小鍋にしょうゆ・みりん・砂糖・だしを入れて中火で煮立て、弱火で3分、少しとろみがつくまで煮詰める（濃く甘いたれが天丼の命）。^えびは背わたを取り、腹に切り込みを入れてまっすぐにし、水気をしっかり拭く。なすは縦4つ割り、かぼちゃは7mm厚、まいたけは大きめにほぐす。^衣：冷水に卵を溶き、薄力粉をふるい入れて、菜箸で粉が少し残る程度にざっくり混ぜる（混ぜすぎると粘りが出て、もったり重い衣になる。冷水を使うのがカラッと揚げるコツ）。^揚げ油を170℃に熱し、かぼちゃ（3分）、なす（1分半）、まいたけ（1分）、大葉（片面だけ衣をつけて20秒）、えび（1分半）の順に揚げる。具に薄力粉（分量外）を薄くまぶしてから衣をつけるとはがれない。^揚げたての天ぷらを、温かいたれにさっとくぐらせる。^丼にご飯を盛り、たれを少しかけてから天ぷらを盛り、残りのたれを回しかける。|味の決め手は「揚げたてをたれにくぐらせる」こと。衣がたれを吸い、ジュワッと甘辛い味に。^ご飯にもたれを先にかけておくと、最後のひと口までおいしい。
中華丼|豚バラ肉:120g,むきえび:6尾,いか:1/2杯,白菜:3枚,にんじん:1/3本,しいたけ:2個,うずら卵:4個,ご飯:400g|酒:大さじ1,片栗粉:小さじ1,ごま油:大さじ1,しょうが:1かけ,にんにく:1片,水:250ml,鶏がらスープの素:小さじ2,オイスターソース:大さじ1.5,しょうゆ:小さじ2,砂糖:小さじ1,こしょう:少々,片栗粉:大さじ1.5,ごま油:小さじ1|豚肉は4cm長さ、えびは背わたを取る。いかは胴を1cm幅の輪切りにする。えび・いかに酒と片栗粉小さじ1をもみ込む（ぷりっとして、あんがよく絡む）。^白菜は芯を斜めそぎ切り、葉はざく切り。にんじんは短冊切り、しいたけは薄切り、しょうが・にんにくは薄切り。^えびといかを熱湯で30秒ゆでて取り出す（湯通し。お店のやり方。炒めても縮まない）。^フライパンにごま油・しょうが・にんにくを入れて弱火で1分、香りが立ったら強火にして豚肉を2分、カリッとするまで炒める。^白菜の芯・にんじん・しいたけを加えて2分、白菜の葉を加えて1分炒める。^水・鶏がらスープの素・オイスターソース・しょうゆ・砂糖・こしょうを加えて煮立て、えび・いか・うずら卵を戻して1分煮る。^火を弱めて水溶き片栗粉（片栗粉＋水大さじ3）を回し入れ、混ぜながら30秒、強火でもう一度煮立ててとろみを安定させる。仕上げにごま油を回しかける。ご飯にたっぷりかける。|味の決め手は「豚バラの脂」と「オイスターソース」。脂がうまみのベースになり、オイスターで深みが出る。^最後のごま油で香りが一段上がる。
豚丼|豚ロース肉:300g,長ねぎ:1/2本,ご飯:400g,小ねぎ:適量|サラダ油:小さじ1,しょうゆ:大さじ3,みりん:大さじ2,砂糖:大さじ2,酒:大さじ2,はちみつ:小さじ1,にんにく:1/2片,黒こしょう:少々,粉山椒:少々|豚肉（しょうが焼き用か、とんかつ用を半分の厚さに切る）は筋を切る。長ねぎは4cm長さに切る。^たれ：小鍋にしょうゆ・みりん・砂糖・酒・はちみつ・すりおろしにんにくを入れて中火で煮立て、弱火で3分、とろりとするまで煮詰める（北海道・帯広の豚丼のたれは甘辛く濃厚。はちみつで照りと奥行きが出る）。^フライパンにサラダ油を中火で熱し、長ねぎを転がしながら3分焼き、焼き色をつけて取り出す。^同じフライパンを強めの中火にし、豚肉を広げて入れ、触らずに1分半、焼き色をつける。返して1分焼く（焼き目の香ばしさが帯広流。炭火の代わり）。^余分な脂をペーパーで拭き取り、たれの2/3を加えて30秒、全体に絡める。^丼にご飯を盛り、たれを少しかけて豚肉を重ねてのせ、残りのたれ・焼きねぎ・小ねぎをのせる。黒こしょうと山椒をふる。|味の決め手は「たれを先に煮詰めておく」こと。肉は焼いてから絡めるだけなので硬くならない。^ご飯に先にたれをかけるのが帯広流。
海鮮丼|まぐろ:100g,サーモン:100g,ほたて:4個,いくら:40g,いか:50g,大葉:4枚,ご飯:400g,のり:1/2枚|酢:大さじ3,砂糖:大さじ1.5,塩:小さじ1/2,昆布:1枚,しょうゆ:大さじ1.5,みりん:大さじ1,わさび:少々|すし酢：小鍋に酢・砂糖・塩・昆布（3cm角）を入れて弱火で温め、砂糖を溶かして冷ます（昆布のうまみが移る）。^炊きたてのご飯にすし酢を回しかけ、しゃもじで切るように混ぜて、うちわで1分あおいで人肌まで冷ます（つやが出てべたつかない）。^漬けだれ：みりんを電子レンジで20秒加熱してアルコールを飛ばし、しょうゆと合わせる。まぐろとサーモンは1cm厚に切り、たれに5分漬ける（軽い漬けにするとねっとりうまみが増す）。^ほたては厚みを半分に、いかは細切りにする。^丼に酢飯を盛り、刻みのり・大葉を敷いて、刺身を彩りよくのせる。中央にいくら、わさびを添え、残りの漬けだれを回しかける。|味の決め手は「酢飯」と「軽い漬け」。白飯ではなく酢飯にするだけで、お店の味に。^刺身は食べる直前まで冷蔵庫で冷やしておくと、生臭さが出ない。
まぐろの漬け丼|まぐろ:250g,大葉:4枚,卵黄:2個,のり:1枚,ご飯:400g,小ねぎ:適量|しょうゆ:大さじ2.5,みりん:大さじ1,酒:大さじ1,ごま油:小さじ1,いりごま:小さじ2,わさび:小さじ1|漬けだれ：小鍋にみりんと酒を入れて中火で30秒煮立ててアルコールを飛ばし、しょうゆを加えて冷ます（煮切ることで角が取れ、まろやかなたれになる）。^まぐろ（赤身のさく）はボウルに入れて熱湯を回しかけ、表面が白くなったらすぐ氷水にとる（霜降り。表面のくさみが取れ、たれが入りやすくなる）。水気を拭き、7mm厚に切る。^たれにわさびを溶き、まぐろを漬けて冷蔵庫で10〜15分おく（長すぎると身が締まりすぎる）。^ご飯にごま油少々を混ぜる（香りがよくなる）。丼に盛り、刻みのり・大葉を敷く。^まぐろを並べ、中央に卵黄をのせ、残りのたれ・いりごま・小ねぎをかける。|味の決め手は「霜降り」と「煮切ったたれ」。プロがやるひと手間で、スーパーのまぐろが格段においしくなる。^卵黄を崩して絡めると、ねっとり濃厚な味わいに。
しらす丼|しらす:80g,大葉:5枚,小ねぎ:適量,卵黄:2個,ご飯:400g,のり:1/2枚|しょうゆ:小さじ2,ごま油:小さじ2,いりごま:小さじ1,しょうが:1かけ|しょうがはすりおろし、大葉はせん切り、小ねぎは小口切り、のりは刻む。^しらすにごま油・いりごまをからめておく（ごま油のコクでしらすのうまみが引き立つ）。^丼に温かいご飯を盛り、刻みのりを敷く。^しらすをこんもりとのせ、中央に卵黄を落とす。大葉と小ねぎを散らし、おろししょうがを添える。^しょうゆを回しかけ、混ぜながら食べる。|味の決め手は「ごま油」と「しょうが」。しらすの塩気と磯の香りが引き立つ。^釜揚げしらすを使うと、ふわふわで格別。
三色そぼろ丼|鶏ひき肉:200g,卵:3個,いんげん:8本,ご飯:400g,紅しょうが:適量|しょうゆ:大さじ1.5,砂糖:大さじ1.5,酒:大さじ2,みりん:大さじ1,しょうが:1かけ,砂糖:大さじ1,塩:ひとつまみ,だし:大さじ1|鶏そぼろ：鍋にひき肉・しょうゆ・砂糖大さじ1.5・酒・みりん・すりおろししょうがを入れ、火をつける前に菜箸4本でよく混ぜてほぐす（加熱前に混ぜると、細かくしっとりしたそぼろになる）。^中火にかけ、菜箸4本で絶えず混ぜながら4〜5分、汁気がほぼなくなるまで炒り煮にする。^卵そぼろ：卵に砂糖大さじ1・塩・だしを混ぜ、小鍋に入れて弱めの中火にかける。菜箸4本で絶えず混ぜ、固まり始めたら火から外して混ぜ、また火にかける、を繰り返して2〜3分、細かいそぼろにする（だしを入れるとふんわり上品）。^いんげんは塩ゆで2分して斜め細切りにする。^丼にご飯を盛り、鶏そぼろ・卵そぼろ・いんげんを三色に盛り分け、紅しょうがを添える。|味の決め手は、鶏そぼろを「火をつける前に混ぜる」こと。パサつかない、しっとり細かいそぼろになる。^卵そぼろにだしを少し入れると、冷めてもふんわり。
ビビンバ|牛こま切れ肉:150g,ほうれん草:1/2束,もやし:1袋,にんじん:1/3本,ぜんまい:50g,卵:2個,ご飯:400g,白菜キムチ:60g|しょうゆ:大さじ1,砂糖:小さじ2,にんにく:1片,ごま油:大さじ2,塩:小さじ1/4,鶏がらスープの素:小さじ1,いりごま:大さじ1,コチュジャン:大さじ2,はちみつ:小さじ1,酢:小さじ1|牛肉はしょうゆ・砂糖・すりおろしにんにく半量・ごま油小さじ1をもみ込んで10分おき、フライパンで中火で3分、汁気がなくなるまで炒める（プルコギ風の下味で肉に深みが出る）。^ナムル3種：もやしは2分、ほうれん草は30秒、にんじん（せん切り）は1分、それぞれ塩ゆでし、水気をしっかり絞る。それぞれにごま油小さじ1・塩少々・鶏がらスープの素少々・おろしにんにく少々・いりごまを和える（1種ずつ別に和えるのが本場の手間。味が混ざらない）。^ぜんまい（水煮）はごま油小さじ1としょうゆ少々で2分炒める。^コチュジャンだれ：コチュジャン・はちみつ・酢・ごま油小さじ1・いりごまを混ぜる。^卵は目玉焼き（半熟）にする。^器にご飯を盛り、具を放射状に並べ、中央に目玉焼き。コチュジャンだれをかけ、よく混ぜて食べる。|味の決め手は「ナムルを1種ずつ別々に和える」ことと、甘めのコチュジャンだれ。^石焼きにするなら、鍋（またはスキレット）にごま油を塗ってご飯と具を入れ、中火で5分焼いておこげを作る。
ガパオライス|鶏もも肉:250g,パプリカ:1/2個,玉ねぎ:1/4個,バジル:15枚,卵:2個,ご飯:400g|サラダ油:大さじ1,にんにく:2片,赤唐辛子:2本,ナンプラー:大さじ1,オイスターソース:大さじ1,しょうゆ:小さじ1,砂糖:小さじ2,酒:大さじ1,揚げ油:大さじ3|鶏もも肉は包丁で粗く叩いて5mm角のミンチにする（ひき肉より食感と肉汁がずっと豊かになる。本場流）。^にんにく・赤唐辛子はみじん切り。パプリカ・玉ねぎは1cm角。ナンプラー・オイスターソース・しょうゆ・砂糖・酒を混ぜる。^目玉焼き：フライパンに揚げ油を中火で熱し、卵を割り入れて、スプーンで油をかけながら1分半、白身の縁がカリカリにきつね色になるまで揚げ焼きにする（タイ式カイダーオ。黄身は半熟）。^フライパンの油を大さじ1残し、にんにく・唐辛子を弱火で1分、香りを立てる。^強火にして鶏肉を入れ、ほぐしながら2分、色が変わるまで炒める。玉ねぎ・パプリカを加えて1分炒める。^合わせ調味料を加えて1分炒め絡め、火を止めてバジルを手でちぎって加え、さっと混ぜる（バジルは加熱しすぎると香りが飛ぶ）。ご飯に添え、目玉焼きをのせる。|味の決め手は「鶏ももを包丁で叩く」ことと「カリカリ目玉焼き」。^ナンプラー＋オイスター＋砂糖の甘じょっぱいバランスに、唐辛子の辛さとバジルの香りで本場の味に。

タコライス|合いびき肉:250g,玉ねぎ:1/2個,レタス:3枚,トマト:1個,ピザ用チーズ:50g,ご飯:400g|サラダ油:小さじ1,にんにく:1片,チリパウダー:小さじ2,クミン:小さじ1/2,ケチャップ:大さじ3,ウスターソース:大さじ1,しょうゆ:小さじ1,砂糖:小さじ1,塩:小さじ1/4,黒こしょう:少々,レモン汁:小さじ1,タバスコ:少々|玉ねぎ・にんにくはみじん切り。レタスはせん切り、トマトは1cm角に切ってレモン汁・塩少々（分量外）で和えてサルサにする。^フライパンにサラダ油とにんにくを入れて弱火で1分、玉ねぎを加えて中火で4分、きつね色手前まで炒める。^ひき肉を加え、1分触らずに焼き付けてから3分、ポロポロになるまで炒める（焼き色が香ばしさになる）。^チリパウダー・クミンを加えて30秒炒め、香りを立てる（カレー粉より本場のタコスの味に近づく）。^ケチャップ・ウスターソース・しょうゆ・砂糖・塩・黒こしょうを加え、2分、汁気がなくなるまで炒め煮にする。^器にご飯を盛り、レタス・タコミート・チーズ・トマトサルサの順にのせる。タバスコを添えて。|味の決め手は「チリパウダー＋クミン」。この2つで一気に本場の味。^チーズは温かいタコミートの上にのせると、少し溶けてまとまりがよくなる。
五目炊き込みご飯|米:2合,鶏もも肉:150g,にんじん:1/3本,ごぼう:1/3本,干ししいたけ:3個,油揚げ:1枚,こんにゃく:1/4枚|酒:大さじ2,しょうゆ:大さじ2,薄口しょうゆ:小さじ1,みりん:大さじ1.5,塩:小さじ1/4,昆布:1枚,ごま油:小さじ1|米は洗ってざるに上げ、30分おく。干ししいたけは水200mlに30分つけてもどし（もどし汁は使う）、薄切りにする。^鶏肉は1cm角に切り、しょうゆ大さじ1・酒大さじ1をもみ込んで10分おく（鶏に下味をつけると、ご飯全体にうまみが広がる）。^にんじんは細切り、ごぼうはささがきにして水にさらす。油揚げは油抜きして細切り、こんにゃくは細切りにして1分下ゆで。^フライパンにごま油を中火で熱し、鶏肉（漬け汁ごと）・ごぼう・にんじん・しいたけ・こんにゃく・油揚げを2分炒める（具を炒めるとコクが出て、炊き上がりの香りが段違い）。^炊飯器に米・残りの酒・しょうゆ・薄口しょうゆ・みりん・塩・しいたけのもどし汁を入れ、2合の目盛りまで水を足して混ぜる。昆布をのせ、具を広げてのせる（混ぜない）。^普通に炊き、炊き上がったら昆布を取り出して10分蒸らし、底から大きく混ぜる。おこげができたら最高。|味の決め手は「干ししいたけのもどし汁」と「具を先にごま油で炒める」こと。^調味料を入れてから水加減するのが、べちゃっとさせないコツ。
栗ご飯|米:1.5合,もち米:0.5合,栗:20個|酒:大さじ2,塩:小さじ1,昆布:1枚,みりん:小さじ1,黒ごま:少々|栗は熱湯に30分ひたして皮をやわらかくし、底の平らな部分に包丁を入れて鬼皮をむき、渋皮を薄くむく。水に10分さらしてアクを抜く。大きければ半分に切る。^米ともち米を合わせて洗い、ざるに上げて30分おく（もち米を少し混ぜると、もっちりと栗の甘みに合う食感に）。^炊飯器に米・酒・塩・みりんを入れ、2合の目盛りまで水を入れて混ぜ、昆布と栗をのせて普通に炊く。^炊き上がったら昆布を取り出し、10分蒸らしてさっくり混ぜる（栗を崩さないように）。^器に盛り、黒ごまをふる。|味の決め手は「もち米を少し混ぜる」ことと「昆布」。塩加減は少し強めが栗の甘みを引き立てる。^皮むきが大変なら、市販のむき栗（生）でもOK。
きのこご飯|米:2合,しめじ:1パック,まいたけ:1パック,しいたけ:3個,油揚げ:1枚|バター:10g,しょうゆ:大さじ2,薄口しょうゆ:小さじ1,みりん:大さじ1.5,酒:大さじ2,昆布:1枚,和風だしの素:小さじ1/2|米は洗ってざるに上げ、30分おく。きのこは石づきを取ってほぐし、しいたけは薄切り。油揚げは油抜きして細切り。^フライパンにバターを中火で溶かし、きのこを入れて3分、あまり触らずに焼き付けるように炒める（きのこに焼き色をつけると、香りとうまみが凝縮して炊き込みご飯の味が濃くなる）。^しょうゆ・薄口しょうゆ・みりん・酒を加えて30秒煮立て、きのこと汁に分ける。^炊飯器に米・きのこの煮汁・和風だしの素を入れ、2合の目盛りまで水を足して混ぜる。昆布をのせ、きのこと油揚げをのせて普通に炊く。^炊き上がったら昆布を取り出し、10分蒸らして底から大きく混ぜる。|味の決め手は「きのこをバターで焼き付けてから炊く」こと。生のまま炊くのとはうまみがまったく違う。^きのこは3種類以上使うと、うまみの相乗効果で味に深みが出る。
さつまいもご飯|米:2合,さつまいも:1本|酒:大さじ2,塩:小さじ1,みりん:大さじ1,昆布:1枚,バター:10g,黒ごま:少々|さつまいもは皮付きのまま1.5cm角に切り、水に10分さらしてアクを抜く。^米は洗ってざるに上げ、30分おく。^炊飯器に米・酒・塩・みりんを入れ、2合の目盛りまで水を入れて混ぜる。昆布とさつまいもをのせて普通に炊く。^炊き上がったら昆布を取り出し、バターを加えて10分蒸らす。^さつまいもを崩さないようにさっくり混ぜ、器に盛って黒ごまをふる。|味の決め手は、ほんの少しのバター。さつまいもの甘みが引き立ち、香りがぐっと豊かに。^塩をしっかり効かせるのが、さつまいもの甘みを引き出すコツ。
鯛めし|米:2合,鯛:2切れ,三つ葉:適量|塩:小さじ1/2,酒:大さじ3,薄口しょうゆ:大さじ1.5,みりん:大さじ1,昆布:1枚,しょうが:1かけ|鯛は塩をふって15分おき、出てきた水分を拭く（臭みが抜け、身が締まる）。^魚焼きグリル（中火）で両面に焼き色がつくまで6〜7分焼く（焼いてから炊くことで、香ばしさがご飯全体に広がる）。^米は洗ってざるに上げ、30分おく。しょうがはせん切り。^炊飯器に米・酒・薄口しょうゆ・みりんを入れ、2合の目盛りまで水を入れて混ぜる。昆布・しょうがをのせ、焼いた鯛をのせて普通に炊く。^炊き上がったら昆布を取り出し、鯛の皮と骨を丁寧に取り除いて身をほぐす。10分蒸らして全体を混ぜる。^器に盛り、三つ葉を散らす。|味の決め手は「鯛を焼いてから炊く」こと。香ばしさとうまみが段違い。^骨からだしが出るので、あれば頭やアラも一緒に炊くとさらに深い味に。
おにぎり|ご飯:450g,生鮭:1切れ,梅干し:2個,のり:3枚,かつお節:1パック|塩:小さじ1/2,しょうゆ:小さじ1,酒:小さじ1|鮭は塩少々をふって10分おき、魚焼きグリルで7〜8分焼いて皮と骨を取り、大きめにほぐす。^梅干しは種を取って粗く叩く。かつお節はしょうゆと混ぜておかかにする。^ご飯は炊きたてを、ボウルに移して1分おき、湯気を飛ばす（熱すぎるとにぎりにくく、ご飯がつぶれる）。^手を水で濡らし、塩を指先につけて手のひら全体になじませる。ご飯を茶碗1杯弱（約75g）手にとり、中央に具をのせて包む。^力を入れすぎず、手のひらで三角を作るように3〜4回転がしながら軽くにぎる（外はしっかり、中はふんわり。米粒がつぶれないくらいの力で）。^食べる直前にのりを巻く（パリパリ派）。|味の決め手は「手塩」。ご飯に塩を混ぜるのではなく、手につけてにぎると、表面にだけ塩気がつき、甘みが引き立つ。^にぎる力は「ふんわり」。口に入れてほろっとほどけるのが理想。
焼きおにぎり|ご飯:400g|しょうゆ:大さじ1.5,みりん:小さじ1,和風だしの素:小さじ1/4,ごま油:小さじ1,バター:5g|ご飯に和風だしの素をよく混ぜ、4等分にして、しっかりめに三角ににぎる（崩れないよう、普通のおにぎりより強めに）。^しょうゆとみりんを混ぜてたれを作る。^フライパンにごま油を弱めの中火で熱し、おにぎりを並べて、片面3分ずつ、何も塗らずに両面をカリッと焼き固める（先に焼き固めるのが、崩れないコツ）。^たれを刷毛で塗り、返して30秒焼く。もう一度塗って返し、30秒。これを2〜3回繰り返す（重ね塗りで香ばしい層ができる）。^最後にバターをのせて溶かし、側面にもたれを塗って焼く。|味の決め手は「先に焼き固めてから、たれを重ね塗り」すること。焦げたしょうゆの香ばしさが何倍にもなる。^ご飯にだしの素を混ぜておくと、中までうまみがある。
いなり寿司|油揚げ:6枚,ご飯:450g,いりごま:大さじ1,しょうが:1かけ|だし:200ml,しょうゆ:大さじ2.5,砂糖:大さじ4,みりん:大さじ2,酒:大さじ1,酢:大さじ3,砂糖:大さじ1.5,塩:小さじ1/2|油揚げは菜箸を転がして（はがれやすくなる）、半分に切って袋状に開く。たっぷりの湯で3分ゆでて油抜きし、水にとって軽く絞る（しっかり油抜きすると、煮汁がよくしみる）。^鍋にだし・砂糖・酒を入れて煮立て、油揚げを並べて落としぶたをし、弱めの中火で5分煮る。しょうゆ・みりんを加えて、さらに10〜12分、煮汁がほぼなくなるまで煮る（砂糖を先に入れると甘みがしっかり入る）。そのまま冷ます。^すし酢：酢・砂糖・塩を混ぜて砂糖を溶かす。炊きたてのご飯にかけて切るように混ぜ、うちわであおいで冷ます。いりごまと、みじん切りのしょうがを混ぜる。^酢飯を12等分にして軽くにぎる。^油揚げの汁気を軽く絞り（絞りすぎない。ジュワッと汁が出るのがおいしい）、酢飯を詰めて口を折り込む。|味の決め手は「甘辛くしっかり煮た揚げ」。煮汁がほぼなくなるまで煮詰めるのがポイント。^酢飯にしょうがのみじん切りを混ぜると、甘い揚げとの相性が抜群に。
ちらし寿司|ご飯:450g,むきえび:10尾,卵:2個,にんじん:1/3本,干ししいたけ:4個,れんこん:80g,いんげん:5本,いくら:30g,のり:1枚|酢:大さじ4,砂糖:大さじ2.5,塩:小さじ2/3,昆布:1枚,しょうゆ:大さじ1.5,砂糖:大さじ1.5,みりん:大さじ1,酢:大さじ2,砂糖:大さじ1,酒:大さじ1,砂糖:小さじ1,塩:少々|すし酢：小鍋に酢大さじ4・砂糖大さじ2.5・塩・昆布を入れて弱火で温め、砂糖を溶かして冷ます。^干ししいたけは水150mlでもどして薄切りにし、にんじん（細切り）と一緒に、もどし汁・しょうゆ・砂糖大さじ1.5・みりんで中火で8分、汁気がなくなるまで煮る（甘辛い具がちらし寿司の味の柱）。^れんこんは薄いいちょう切りにして1分ゆで、酢大さじ2・砂糖大さじ1に漬ける（酢れんこん）。えびは酒をふって1分ゆでる。^錦糸卵：卵に砂糖小さじ1・塩を混ぜ、薄焼き卵にして細切り。いんげんは塩ゆでして斜め切り。^炊きたてのご飯にすし酢を回しかけ、切るように混ぜてあおいで冷まし、しいたけとにんじんの煮物（汁気を切る）・酢れんこん（汁気を切る）を混ぜ込む。^器に盛り、刻みのり・錦糸卵・えび・いんげん・いくらを彩りよく散らす。|味の決め手は「甘辛く煮たしいたけ・にんじん」と「酢れんこん」を酢飯に混ぜ込むこと。^具を混ぜ込むと、どこを食べても味がある。
手巻き寿司|ご飯:500g,まぐろ:120g,サーモン:120g,いか:60g,きゅうり:1本,卵:3個,かに風味かまぼこ:4本,アボカド:1個,大葉:10枚,のり:8枚|酢:大さじ4,砂糖:大さじ2.5,塩:小さじ2/3,昆布:1枚,砂糖:大さじ1,だし:大さじ2,塩:少々,しょうゆ:適量,わさび:適量,マヨネーズ:適量|すし酢：酢・砂糖・塩・昆布を小鍋で温めて砂糖を溶かし冷ます。炊きたてのご飯に回しかけ、切るように混ぜてうちわであおいで人肌に冷ます。^厚焼き卵：卵に砂糖大さじ1・だし・塩を混ぜ、卵焼き器で中火で3回に分けて巻き、1cm角の棒状に切る（甘めの卵が子どもにも人気）。^まぐろ・サーモンは1cm角の棒状、いかは細切り、きゅうりは縦8つ割り、アボカドは縦に8等分してレモン汁少々（分量外）をかける。^のりは半分に切り、フライパンで両面5秒ずつあぶってパリッとさせる（香りが立つ）。^大皿に具を並べ、酢飯は飯台かボウルに。各自でのりに酢飯大さじ2を広げ、大葉と具をのせて円錐形に巻く。^しょうゆ・わさび・マヨネーズを添える。サーモン＋アボカド＋マヨ、まぐろ＋大葉＋わさびは鉄板の組み合わせ。|味の決め手は「酢飯をきちんと作る」こと。昆布入りのすし酢でお店の味に。^のりは直前にあぶると香りがまったく違う。
雑炊|ご飯:250g,鶏もも肉:100g,しいたけ:2個,にんじん:1/4本,卵:2個,小ねぎ:適量,三つ葉:適量|だし:700ml,酒:大さじ1,薄口しょうゆ:小さじ2,みりん:小さじ1,塩:小さじ1/3,しょうが:少々|ご飯はざるに入れて流水でさっと洗い、ぬめりを取る（さらりと上品な雑炊になる。洗わないとべたっとする）。^鶏肉は1cm角、しいたけは薄切り、にんじんは細切り。^鍋にだし・酒・鶏肉・にんじん・しいたけを入れて中火にかけ、煮立ったらアクを取って弱めの中火で5分煮る（鶏のうまみがだしに移る）。^薄口しょうゆ・みりん・塩で調え、ご飯を加えて弱めの中火で3分煮る（混ぜすぎない。粘りが出る）。^溶き卵を細く回し入れ、ふたをして火を止め、1分蒸らす（ふんわり半熟に）。^器に盛り、小ねぎ・三つ葉・おろししょうがをのせる。|味の決め手は「ご飯を洗う」ことと「具を先に煮てだしを濃くする」こと。^卵は混ぜずに、ふたをして余熱で火を通すとふわふわに。
鮭茶漬け|ご飯:300g,生鮭:1切れ,のり:1/2枚,三つ葉:適量,あられ:大さじ1|塩:小さじ1/4,だし:400ml,薄口しょうゆ:小さじ1,塩:少々,わさび:少々,いりごま:少々|鮭は塩小さじ1/4をふって15分おき、出た水分を拭く（甘塩鮭なら不要）。魚焼きグリルの中火で7〜8分、皮がパリッとするまで焼き、皮と骨を取って大きめにほぐす。^だしを温め、薄口しょうゆ・塩で、少し濃いめに調える（お茶ではなくだしを使うのが料亭風。ご飯に注ぐと薄まるので濃いめに）。^茶碗にご飯を盛り、鮭・刻みのり・三つ葉・あられ・いりごまをのせ、わさびを添える。^熱いだしをたっぷり注ぐ。|味の決め手は「お茶ではなく熱いだし」で食べること。鮭の脂とだしのうまみが合わさって格別。^鮭の皮をカリカリに焼いて刻んでのせるのもおすすめ。
きのこリゾット|米:160g,しめじ:1/2パック,マッシュルーム:6個,まいたけ:1/2パック,玉ねぎ:1/4個|オリーブオイル:大さじ1,バター:20g,白ワイン:50ml,水:700ml,コンソメ:小さじ2,粉チーズ:大さじ4,塩:少々,黒こしょう:少々|米は洗わずに使う（表面のでんぷんがとろみになる）。玉ねぎはみじん切り、きのこはほぐす（マッシュルームは薄切り）。水とコンソメを小鍋で温めておく（熱いブイヨンを加えるのが芯を残さない秘訣）。^フライパンにバター10gを中火で溶かし、きのこを入れて3分、あまり触らずに焼き色がつくまで炒め、塩少々をして取り出す（きのこを焼き付けると香りが凝縮する）。^同じフライパンにオリーブオイルを入れ、玉ねぎを弱めの中火で3分、色づけずに透き通るまで炒める。米を加えて2分、米が半透明になるまで炒める。^白ワインを加えて強火で30秒、アルコールを飛ばす。熱いブイヨンをお玉2杯加え、弱めの中火で混ぜながら煮る。汁気が少なくなったら2杯ずつ足す、を繰り返して16〜18分。^途中できのこを戻し、米に少し芯が残るアルデンテで火を止める。^残りのバター10gと粉チーズを加え、手早く力強く混ぜてとろりと乳化させる（マンテカトゥーラ）。塩・黒こしょうで調え、器に盛って粉チーズとオリーブオイルをかける。|味の決め手は「きのこを先に焼き付ける」ことと、最後の「バター＋チーズで乳化」。^ブイヨンは必ず熱いものを少しずつ。冷たいと米の芯が残る。
パエリア|米:2合,有頭えび:4尾,あさり:200g,いか:1杯,鶏もも肉:200g,パプリカ:1/2個,玉ねぎ:1/2個,トマト:1個,レモン:1/2個|オリーブオイル:大さじ3,にんにく:2片,塩:小さじ1,白ワイン:50ml,水:450ml,コンソメ:小さじ2,サフラン:ひとつまみ,パプリカパウダー:小さじ1,パセリ:少々|サフランを水大さじ3（分量外）に10分つけて色を出す（なければカレー粉小さじ1/3で代用）。米は洗わずに使う。あさりは砂抜き、いかは輪切り、鶏肉はひと口大にして塩少々。玉ねぎ・にんにくはみじん切り、トマトはすりおろす、パプリカは細切り。^パエリアパン（または直径26cmのフライパン）にオリーブオイル大さじ2を中火で熱し、えびを両面1分ずつ焼いて取り出す（えびの殻の香りが油に移り、これが全体の味の土台になる）。いかも30秒炒めて取り出す。^同じパンで鶏肉を皮目から3分焼き、玉ねぎ・にんにくを加えて3分炒める。すりおろしたトマトとパプリカパウダーを加えて3分、水分を飛ばしてペースト状にする（ソフリット）。^米を加えて2分炒め、白ワインを加えて30秒。水・コンソメ・サフラン液・塩を加えて煮立て、全体を平らにならす（ここから先は混ぜない）。^あさり・パプリカをのせ、中火で5分、弱火にして10分。最後にえび・いかをのせてアルミホイルでふたをし、5分加熱する。^強火にして30秒〜1分、パチパチ音がしたら火を止める（底にソカラット＝おこげを作る）。ホイルをかぶせて5分蒸らし、レモンとパセリを添える。|味の決め手は「えびを焼いた油」と「トマトのソフリット」、そして底の「おこげ」。^米を入れてからは絶対に混ぜない。混ぜると粘りが出てリゾットになる。
ナシゴレン|ご飯:400g,鶏もも肉:120g,むきえび:8尾,玉ねぎ:1/4個,卵:2個,きゅうり:1/2本,トマト:1/2個|サラダ油:大さじ2,にんにく:2片,赤唐辛子:1本,ケチャップ:大さじ1,オイスターソース:大さじ1,ナンプラー:小さじ2,スイートチリソース:大さじ1,しょうゆ:小さじ1,豆板醤:小さじ1/2,砂糖:小さじ1,揚げ油:大さじ3|にんにく・玉ねぎはみじん切り、唐辛子は小口切り。鶏肉は1cm角、えびは背わたを取る。^合わせ調味料：ケチャップ・オイスターソース・ナンプラー・スイートチリソース・しょうゆ・豆板醤・砂糖を混ぜる（甘いしょうゆ「ケチャップマニス」の味を再現）。^目玉焼き：フライパンに揚げ油を中火で熱し、卵を割り入れて、油をかけながら1分半、縁がカリカリになるまで揚げ焼きにする。^フライパンの油をサラダ油大さじ1に替え、にんにく・唐辛子・玉ねぎを中火で2分、香りが立つまで炒める。鶏肉を加えて3分、えびを加えて1分炒める。^強火にしてご飯を加え、ほぐしながら2分炒める。合わせ調味料を鍋肌から加えて1分、全体に絡めながら少し焦がすように炒める。^器に盛り、目玉焼きをのせ、きゅうり・トマトを添える。|味の決め手は「甘辛い合わせ調味料」を鍋肌で焦がすこと。^揚げ焼きの目玉焼きの黄身を崩しながら食べるのが本場流。
カオマンガイ|米:2合,鶏もも肉:2枚,きゅうり:1本,パクチー:適量,トマト:1個|塩:小さじ1,砂糖:小さじ1,酒:大さじ2,しょうが:1かけ,にんにく:1片,鶏がらスープの素:小さじ1,長ねぎ:1本,味噌:大さじ1,しょうゆ:大さじ1,オイスターソース:小さじ2,酢:大さじ1,砂糖:小さじ2,ナンプラー:小さじ1,しょうが:1かけ,にんにく:1片,赤唐辛子:1本|鶏肉は余分な脂を取り（脂は取っておく）、塩・砂糖をすり込んで30分おく（砂糖を一緒にすり込むと、炊いてもしっとりやわらかい）。^米は洗ってざるに上げる。取っておいた鶏の脂を刻み、フライパンで弱火で3分炒めて脂を出し、にんにく1片（みじん切り）を加えて1分。米を加えて2分炒める（鶏の脂で米を炒めるのが本場の味。米一粒一粒に鶏のうまみがまとう）。^炊飯器に米・酒・鶏がらスープの素・薄切りしょうがを入れ、2合の目盛りまで水を入れる。長ねぎの青い部分をのせ、鶏肉を皮目を上にしてのせて普通に炊く。^たれ：味噌・しょうゆ・オイスターソース・酢・砂糖・ナンプラー・すりおろしたしょうがとにんにく・唐辛子のみじん切りを混ぜる（タイの「タオチオ」だれ風）。^炊き上がったら鶏肉を取り出し、5分おいてから切る。ご飯を混ぜる。^器にご飯と鶏肉を盛り、きゅうり・トマト・パクチーを添え、たれをかける。|味の決め手は「鶏の脂で米を炒める」ことと、味噌ベースの甘辛いたれ。^鶏に砂糖と塩をすり込んでおくと、驚くほどしっとり仕上がる。
ルーロー飯|豚バラ肉:350g,卵:3個,干ししいたけ:4個,エシャロット:3個,チンゲン菜:1株,ご飯:450g,高菜漬け:30g|サラダ油:大さじ1,にんにく:2片,しょうが:1かけ,酒:大さじ3,しょうゆ:大さじ3,砂糖:大さじ2,氷砂糖:大さじ1,オイスターソース:大さじ1,八角:1個,五香粉:少々,水:300ml|豚バラは塊のまま冷凍庫で30分冷やしてから、1cm角の棒状に切る（少し凍らせると切りやすい）。干ししいたけは水300mlでもどし（もどし汁も使う）、1cm角。エシャロット（なければ玉ねぎ1/4個）は薄切り。卵は8分ゆでて殻をむく。^フライパンにサラダ油とエシャロットを入れて弱めの中火で5分、きつね色になるまで揚げ焼きにする（揚げエシャロット＝油葱酥。ルーロー飯の香りの正体）。^同じフライパンで豚バラを中火で5分、脂が出てカリッとするまで炒め、にんにく・しょうがのみじん切りを加えて1分。^鍋に移し、しいたけ・揚げエシャロット・酒・しょうゆ・砂糖・氷砂糖（なければ砂糖大さじ1）・オイスターソース・八角・五香粉・しいたけのもどし汁・水を入れて煮立て、ゆで卵を加える。^弱火でふたをずらして40分、ときどき混ぜながら煮汁にとろみがつくまで煮込む。^チンゲン菜は塩ゆでする。ご飯に煮汁ごと肉をかけ、半分に切った煮卵・チンゲン菜・高菜を添える。|味の決め手は「揚げエシャロット」と「八角」。この2つで台湾の屋台の香りになる。^煮汁がとろりとするまで、じっくり煮込むこと。豚バラの脂とゼラチンが溶け出してご飯に絡む。
キンパ|ご飯:450g,のり:3枚,牛こま切れ肉:120g,ほうれん草:1/2束,にんじん:1/3本,卵:2個,たくあん:60g,かに風味かまぼこ:4本|ごま油:大さじ2,塩:小さじ2/3,いりごま:大さじ1,しょうゆ:大さじ1,砂糖:小さじ2,にんにく:少々,塩:少々|ご飯に塩小さじ1/2・ごま油大さじ1・いりごまを混ぜる（酢ではなく、ごま油と塩で味つけするのがキンパの特徴）。^牛肉はしょうゆ・砂糖・にんにくをもみ込み、フライパンで中火で3分、汁気がなくなるまで炒める。^ほうれん草は塩ゆで30秒して水気を絞り、ごま油・塩少々で和える。にんじんはせん切りにしてごま油で1分炒め、塩少々。卵は厚焼きにして1cm角の棒状。たくあんも棒状に切る。^巻きすにのりを置き、奥2cmを残してご飯を薄く均一に広げる。^手前に具を並べ、具を押さえながら一気に巻き、巻きすで締める。^表面にごま油を刷毛で薄く塗り、いりごまをふる（ごま油の香りとつやがキンパらしさ）。1cm幅に切る（包丁を濡らしながら）。|味の決め手は「ご飯をごま油と塩で味付け」することと、仕上げに表面に塗るごま油。^たくあんの甘じょっぱさとシャキシャキ感が、キンパに欠かせないアクセント。
グリーンカレー|鶏もも肉:250g,なす:2本,パプリカ:1/2個,たけのこ(水煮):60g,しめじ:1/2パック,バジル:10枚,ご飯:400g|サラダ油:大さじ1,グリーンカレーペースト:大さじ2,ココナッツミルク:400ml,水:100ml,鶏がらスープの素:小さじ1,ナンプラー:大さじ1,砂糖:大さじ1,レモン汁:小さじ1,赤唐辛子:1本|鶏肉はそぎ切り、なすは乱切り、パプリカは細切り、たけのこは薄切り、しめじはほぐす。^ココナッツミルクの缶を振らずに開け、上部の固まったクリーム部分（大さじ4ほど）をすくう。^鍋にサラダ油とココナッツクリームを入れ、中火で2分、ふつふつと油が分離してくるまで煮詰める。グリーンカレーペーストを加えて2分、香りが立つまでよく炒める（ペーストを炒めるのが本場の味の秘訣。辛さと香りが油に溶け出す）。^鶏肉を加えて2分炒め、残りのココナッツミルク・水・鶏がらスープの素を加えて煮立てる。^なす・たけのこ・しめじを加えて弱めの中火で8分煮る。ナンプラー・砂糖で味を調える（甘み・塩味・辛みのバランスが大事）。^パプリカを加えて1分。火を止めてバジルを手でちぎって加え、レモン汁を加える。ご飯に添えて。|味の決め手は「ココナッツクリームでペーストを炒める」こと。辛さと香りがまったく違う。^砂糖をきちんと入れるのが重要。甘みがあると辛さが引き立ち、まろやかになる。
バターチキンカレー|鶏もも肉:2枚,玉ねぎ:1個,ご飯:400g|ヨーグルト:100g,カレー粉:大さじ2,ガラムマサラ:小さじ1,塩:小さじ1,にんにく:2片,しょうが:1かけ,バター:30g,トマト缶:1缶,はちみつ:大さじ1,生クリーム:100ml,ケチャップ:大さじ1,カシューナッツ:20g|鶏肉はひと口大に切り、ヨーグルト・カレー粉大さじ1・塩小さじ1/2・すりおろしにんにくとしょうがの半量をもみ込み、冷蔵庫で1時間以上（できれば一晩）漬ける（ヨーグルトで肉がふわっとやわらかくなる）。^フライパンを中火で熱し、鶏肉を漬けだれを軽く落として並べ、両面3分ずつ、焦げ目がつくまで焼いて取り出す（タンドール窯の代わりに、焼き目で香ばしさを出す）。^鍋にバター20gを中火で溶かし、みじん切りの玉ねぎを10分、きつね色になるまで炒める。残りのにんにく・しょうがを加えて1分、カレー粉大さじ1を加えて30秒炒める。^トマト缶を加えてつぶし、中火で10分、半量近くまで煮詰める。カシューナッツ（またはアーモンド）と一緒にミキサーにかけてなめらかにする（ナッツのコクで本場の濃厚さに）。^鍋に戻し、残りの漬けだれ・鶏肉・はちみつ・ケチャップ・塩小さじ1/2を加え、弱火で10分煮る。^生クリームと残りのバター10gを加えて混ぜ、ガラムマサラをふって火を止める。ご飯（あればナン）に添えて。|味の決め手は「ヨーグルト漬け」「トマトを煮詰める」「バターと生クリームたっぷり」。^ミキサーにかけると、レストランのような、なめらかで濃厚なソースになる。

きつねうどん|ゆでうどん:2玉,油揚げ:2枚,小ねぎ:適量,かまぼこ:4切れ|だし:200ml,しょうゆ:大さじ1.5,砂糖:大さじ2,みりん:大さじ1,だし:700ml,薄口しょうゆ:大さじ2,みりん:大さじ1.5,塩:小さじ1/4,七味唐辛子:少々|甘辛揚げ：油揚げは熱湯で2分ゆでて油抜きし、水気を軽く絞って三角に切る。鍋にだし200ml・砂糖・みりん大さじ1・しょうゆを入れて煮立て、油揚げを入れて落としぶたをし、弱めの中火で10〜12分、煮汁がほぼなくなるまで煮る（しっかり甘く、じゅわっと汁がしみる揚げが、きつねうどんの主役）。^つゆ：鍋にだし700ml・薄口しょうゆ・みりん大さじ1.5・塩を入れて中火で温める（関西風の色の薄い、だしの香るつゆ）。^うどんは熱湯で1分ゆでて湯を切り、温めた丼に入れる。^熱いつゆを注ぎ、甘辛揚げ・かまぼこ・小ねぎをのせ、七味をふる。|味の決め手は「揚げを甘辛くしっかり煮含める」ことと、だしの香る関西風のつゆ。^揚げは前日に煮ておくと、さらに味がしみる。
