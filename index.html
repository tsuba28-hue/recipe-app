<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C5A43">
<meta name="description" content="食べたいもの・体の目標・食材から探せるレシピアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レシピ帖">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0} body{font:14px/1.5 system-ui,sans-serif}
img{max-width:100%} [hidden]{display:none!important}
</style>
<title>きょうのレシピ帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: header → sticky search bar → home shelves / results grid; phone gets an app-style bottom tab bar */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --sunk:#E8ECE3; --ink:#1B211D; --muted:#525D55; --line:#D3DACD;
  --accent:#2C5A43; --accent-ink:#FFFFFF; --accent-soft:#DAE7DD; --yolk:#DE9F25; --yolk-soft:#F6E7C4; --warn:#B0432C; --warn-soft:#F5DDD6;
  --t-wa:#D6E3D5; --t-yo:#F1DCCE; --t-chu:#EFD5BE; --t-kan:#EECFCD; --t-eth:#DDE6C6;
  --plate:#FDFDFB; --rim:#E1E5DC; --dishink:#24302A;
  --shadow:0 1px 2px rgba(30,40,32,.06),0 6px 18px rgba(30,40,32,.08);
  --f-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:14px; --nav-h:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A1F1B; --sunk:#232924; --ink:#E8EDE7; --muted:#A3AEA5; --line:#2E3530;
  --accent:#88C9A4; --accent-ink:#0E1912; --accent-soft:#213328; --yolk:#E8B54A; --yolk-soft:#3A3120; --warn:#EC927A; --warn-soft:#3B2620;
  --t-wa:#24332A; --t-yo:#382B24; --t-chu:#392D21; --t-kan:#382526; --t-eth:#2D3322;
  --plate:#2A302B; --rim:#3A423C; --dishink:#ECF0EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A1F1B; --sunk:#232924; --ink:#E8EDE7; --muted:#A3AEA5; --line:#2E3530;
  --accent:#88C9A4; --accent-ink:#0E1912; --accent-soft:#213328; --yolk:#E8B54A; --yolk-soft:#3A3120; --warn:#EC927A; --warn-soft:#3B2620;
  --t-wa:#24332A; --t-yo:#382B24; --t-chu:#392D21; --t-kan:#382526; --t-eth:#2D3322;
  --plate:#2A302B; --rim:#3A423C; --dishink:#ECF0EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.linkish{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:inherit;text-decoration:underline}

/* header + nav */
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font-family:var(--f-display);font-size:1.2rem;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,var(--yolk) 0 34%,var(--plate) 36% 100%);box-shadow:inset 0 0 0 2px var(--rim);display:inline-block}
.nav{margin-left:auto;display:flex;gap:4px}
.nav button{border:0;background:none;padding:7px 13px;border-radius:999px;color:var(--muted);font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:6px;position:relative}
.nav button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .badge{min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:.68rem;line-height:18px;text-align:center;padding:0 5px;font-variant-numeric:tabular-nums}
.nav .badge:empty{display:none}
@media (max-width:719px){
  :root{--nav-h:64px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;gap:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px;border-radius:12px}
  .nav button svg{width:23px;height:23px}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .nav .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
}

/* hero + search */
.hero{padding-block:8px 14px;display:grid;gap:6px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.3;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:.95rem}
.hero p b{font-variant-numeric:tabular-nums;color:var(--ink)}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.searchbar.stuck{border-bottom-color:var(--line)}
.searchbar .wrap{padding-block:10px 8px;display:grid;gap:8px}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:5px 5px 5px 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;width:21px;height:21px;stroke:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:10px 4px;font-size:1.02rem;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:var(--sunk);color:var(--muted);width:30px;height:30px;border-radius:50%;padding:0;font-size:1rem;line-height:1;flex:none}
.search .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 18px;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sel{padding:0 4px 0 10px;display:flex;align-items:center}
.chip select{border:0;background:none;font-weight:700;padding:6px 4px;font-size:.88rem}
.ideas{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.ideas:empty{display:none}
.idea{border:1px dashed var(--muted);background:none;border-radius:999px;padding:5px 13px;font-size:.88rem;color:var(--ink)}
.idea:hover{background:var(--surface)}

/* sections */
section.block{padding-block:20px 8px}
.bh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
.bh h2{font-size:1.2rem;margin:0;font-weight:700;text-wrap:balance}
.bh .note{color:var(--muted);font-size:.85rem}
.bh .more{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:700;font-size:.9rem;white-space:nowrap;padding:4px 0}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(172px,206px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;scrollbar-width:thin}
.shelf>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
@media (max-width:400px){ .grid{grid-template-columns:1fr 1fr;gap:10px} }

/* featured */
.feat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.feat .plate{aspect-ratio:auto;min-height:260px}
.feat .body{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:.8rem;letter-spacing:.1em;color:var(--accent);font-weight:700}
.feat h3{margin:0;font-size:1.4rem;line-height:1.4;text-wrap:balance}
.why{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.why li{display:flex;gap:9px;font-size:.93rem;color:var(--ink)}
.why li::before{content:"";flex:none;width:8px;height:8px;margin-top:.62em;border-radius:50%;background:var(--yolk)}
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px 22px;font-variant-numeric:tabular-nums}
.facts div{display:grid}
.facts span{color:var(--muted);font-size:.78rem}
.facts b{font-size:1.15rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:700;font-size:.93rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:.85rem;border-radius:10px}
@media (max-width:640px){ .feat{grid-template-columns:1fr} .feat .plate{min-height:200px} .feat .body{padding:18px} .facts{grid-template-columns:repeat(2,auto)} }

/* menu set */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 16px 16px;box-shadow:var(--shadow)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.mrow .role{font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.mrow .nm{font-weight:700;line-height:1.45;min-width:0}
.mrow .kc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.mtotal{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.88rem;font-variant-numeric:tabular-nums}
.mtotal b{font-size:1.05rem}
.mtotal .btn{margin-left:auto}

/* card */
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;transition:transform .15s ease,box-shadow .15s ease;min-width:0;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{margin:0;font-size:1rem;line-height:1.45;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:2px 10px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:700}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:.75rem;line-height:1.5;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--ink);font-weight:500;white-space:nowrap}
.tag.season{background:var(--yolk-soft)}
.tag.good{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.classic{background:var(--ink);color:var(--bg)}

/* plate visual */
.plate{position:relative;aspect-ratio:4/3;display:grid;place-items:center;container-type:inline-size;max-width:100%}
.pl-wa{background:var(--t-wa)} .pl-yo{background:var(--t-yo)} .pl-chu{background:var(--t-chu)} .pl-kan{background:var(--t-kan)} .pl-eth{background:var(--t-eth)}
.dish{position:relative;width:60%;max-width:210px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;gap:2px;
  background:radial-gradient(circle,var(--plate) 0 60%,var(--rim) 61% 64%,var(--plate) 65% 100%);box-shadow:0 8px 18px rgba(20,30,22,.15);color:var(--dishink)}
.dish::before,.dish::after{content:"";position:absolute;border-radius:50%;background:var(--g);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dish::before{width:17%;height:17%;right:9%;bottom:12%}
.dish::after{width:11%;height:11%;right:25%;bottom:5%}
.dish b{font-family:var(--f-display);font-weight:400;line-height:1;font-size:clamp(1.6rem,21cqw,4.6rem)}
.dish b.w2{font-size:clamp(1.2rem,14cqw,3.2rem)}
.dish i{font-style:normal;font-size:clamp(.66rem,5.6cqw,1.05rem);font-weight:700;color:var(--muted);letter-spacing:.04em}
.mtag{position:absolute;left:10px;top:10px;font-size:.75rem;font-weight:700;background:var(--surface);color:var(--ink);padding:2px 9px;border-radius:999px}
.fav{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;padding:0}
.fav svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}
.fav[aria-pressed="true"] svg{fill:var(--warn);stroke:var(--warn)}

/* results */
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.rhead h2{margin:0;font-size:1.2rem;min-width:0;overflow-wrap:anywhere}
.rhead .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.rhead select{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:.9rem}
.parsed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.parsed .pc{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 9px;font-weight:700}
.parsed .pc.neg{background:var(--warn-soft);color:var(--warn)}
.parsed > span:not(.pc){flex-basis:auto}
.loadmore{display:flex;margin:22px auto 0;min-width:220px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:1.08rem}
.empty p{margin:0 auto 14px;max-width:40ch}

.season{display:flex;gap:8px;flex-wrap:wrap}
.sea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 13px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.sea i{width:12px;height:12px;border-radius:50%;background:var(--g,var(--yolk));box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);display:inline-block}

/* settings + shopping */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-size:1.02rem}
.panel p{margin:0;color:var(--muted);font-size:.88rem;max-width:65ch}
.panel .group{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:500}
.tog[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700;text-decoration:line-through}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.howto div{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem}
.howto b{display:block;margin-bottom:4px}
.stack{display:grid;gap:14px}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.shop li:last-child{border-bottom:0}
.shop label{display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer}
.shop input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.shop .q{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.shop li.done span.n{text-decoration:line-through;color:var(--muted)}
.shophead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shophead h3{flex:1;min-width:0}
.shophead h3 button{border:0;background:none;padding:0;font-weight:700;text-align:left;color:var(--ink);font-size:inherit}
.rm{border:0;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px}

footer{padding-block:36px 28px;color:var(--muted);font-size:.82rem;line-height:1.75}
footer p{max-width:65ch;margin:0}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.52);z-index:60;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){ .scrim{align-items:center;padding:24px} }
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;max-height:94dvh;overflow-y:auto;border-radius:20px 20px 0 0;position:relative;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){ .sheet{border-radius:20px} }
.sheet .plate{aspect-ratio:auto;height:200px}
.sheet .x{position:absolute;left:12px;top:12px;height:38px;border-radius:999px;border:0;background:var(--surface);font-size:.9rem;font-weight:700;padding:0 14px 0 10px;z-index:2;display:flex;align-items:center;gap:4px}
.sheet .mtag{display:none}
.sbody{padding:18px 20px 28px;display:grid;gap:24px}
.sbody h2{margin:0;font-size:1.45rem;line-height:1.4;text-wrap:balance}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px}
.kv b{color:var(--ink);font-size:1.05rem}
.sbody h3{margin:0 0 10px;font-size:1.08rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbody h3 .aside{margin-left:auto;display:flex;gap:6px;align-items:center}
.nut{display:grid;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.nr{display:grid;grid-template-columns:5.6em 1fr 7.4em;gap:10px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.nr .bar{height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}
.nr .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.nr .bar i.over{background:var(--warn)}
.nr span:last-child{text-align:right;color:var(--muted)}
.nr span:last-child b{color:var(--ink)}
.nut small{color:var(--muted);font-size:.8rem}
.serv{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:500}
.serv button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);padding:0;font-size:1.05rem}
.serv output{min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.ing{list-style:none;margin:0 0 12px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.97rem}
.ing li:last-child{border-bottom:0}
.ing li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ing li.h{background:var(--sunk);font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted);padding-block:5px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:6px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;font-size:1.02rem;line-height:1.8;padding:10px;border-radius:12px;cursor:pointer}
.steps li:hover{background:var(--surface)}
.steps li::before{content:counter(s);font-family:var(--f-display);width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.95rem}
.steps li.done{color:var(--muted)}
.steps li.done span{text-decoration:line-through}
.steps li.done::before{content:"✓";background:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:700}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wake[aria-pressed="true"]{background:var(--yolk-soft);border-color:var(--yolk)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:700;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.copybox{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:.9rem;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

const R1=x=>Math.round(x*10)/10;
function make(id,m,p,v,f){

  const kcal=p.k*pg/100+v.k*vg/100+oil*9+f.k+(cb?cb.k:0);
  const P=p.p*pg/100+v.p*vg/100+(cb?cb.p:0);
  const F=p.f*pg/100+v.f*vg/100+oil+f.fat+(cb?cb.f:0);
  const C=p.c*pg/100+v.c*vg/100+f.c+(cb?cb.c:0);
  const fib=p.fib*pg/100+v.fib*vg/100+(cb?cb.fib:0);
  const salt=f.s+(soupy?0.6:0)+(cb?cb.s:0)+p.salt;
  let t=m.t+(v.hard&&/ni|soup|nabe|mushi|itame|yaki|udon/.test(m.id)?5:0);
  if(m.id==='age'&&p.cat==='soy') t-=5;
  let pat=(m.ov&&m.ov[f.id])||m.nm;
  if(p.n==='卵'&&EGG[m.id]&&EGG[m.id][f.id]) pat=EGG[m.id][f.id];
  const name=pat.replace('{p}',p.nm).replace('{v}',v.nm).replace('{w}',f.w);
  let h=50;
  h+=Math.max(-10,Math.min(18,(P-10)*1.1));
  h+=Math.max(-8,Math.min(16,(fib-2)*4));
  h-=Math.max(0,Math.min(20,(salt-2)*10));
  const fr=F*9/kcal; h-=Math.max(0,Math.min(18,(fr-0.3)*60));
  if(kcal>750) h-=(kcal-750)/20; if(kcal<180) h-=8;
  h=Math.round(Math.max(0,Math.min(100,h)));
  let tg=0;
  if(kcal<=400) tg|=T.diet;
  if(P>=25) tg|=T.protein;
  if(C<=15) tg|=T.lowcarb;
  if(t<=15) tg|=T.quick;
  if(fib>=4) tg|=T.veg;
  if(salt<=1.5) tg|=T.salt;
  if(inSeason(v.sea)||inSeason(p.sea)) tg|=T.season;
  if(m.warm||soupy) tg|=T.warm;
  if(f.fresh||m.fresh) tg|=T.fresh;
  if(kcal>=650||(f.rich&&kcal>=480)||p.n==='豚バラ肉') tg|=T.rich;
  if(f.spicy) tg|=T.spicy;
  if(/itame|yaki|age/.test(m.id)) tg|=T.bento;

}

    for(const v of VG){ if(m.noV.has(v.n)) continue;
      for(const fid of m.fls){ const f=FL[fid];
        if(dropped(p,v,f)) continue;
        if(p.n==='卵'&&m.id==='ni'&&!EGG.ni[fid]) continue;
        ALL.push(make(id++,m,p,v,f)); } } }

function seasoningText(f){return f.ing.map(x=>x[0].replace(/\(.+?\)/,'')).join('・');}

    return [cuts,`鍋に水200mlと${S}を入れて中火で煮立てる。`,`${p.n}を入れ、アクを取りながら3分ほど煮る。`,`${v.n}を加え、落としぶたをして弱めの中火で${v.hard?'12〜15':'5〜6'}分煮る。`,`煮汁を全体にからめて火を止め、少しおいて味をなじませる。`];
  case 'mushi': return [cuts,`フライパンに${v.n}を広げ、${p.n}をのせて酒大さじ2をふる。`,`ふたをして中火にかけ、蒸気が出たら弱火で${v.hard?10:7}分蒸す（耐熱皿にのせ、ふんわりラップをして600Wで${v.hard?7:5}分加熱してもよい）。`,`${S}を合わせ、${f.id==='butter'?'熱いうちにのせて溶かしながら':'食べる直前に'}かける。`];
  case 'yaki': return [`${cutP}。塩少々をふる。`,`${cutV}。`,`フライパンにサラダ油を中火で熱し、${p.n}を${p.cook}。空いたところで${v.n}も焼く。`,`${p.n}を返して中まで火を通し、${S}を加えて全体にからめる。`];
  case 'age': return [`${cutP}。${S}の半量を${p.cat==='soy'?'からめ':'もみ込み'}、10分おく。`,`${cutV}。水気をよくふく。`,`${p.n}の汁気を軽くふき、片栗粉を全体にまぶす。`,`フライパンに油を1cmほど入れて170℃に熱し、${v.n}を素揚げにしてから、${p.n}を4〜5分揚げ焼きにする。`,f.id==='ponzu'?`熱いうちにポン酢しょうゆにひたし、5分ほどおいて味をしみ込ませる。`:`油を切り、残りの調味料と和えて器に盛る。`];

  case 'salad': {
    const pb={'卵':'卵は沸騰した湯で9分ゆでて殻をむき、食べやすく切る。','ツナ缶(水煮)':'ツナ缶は缶汁を軽く切る。','大豆(水煮)':'大豆(水煮)は水気を切る。','木綿豆腐':'木綿豆腐は水切りをして一口大に切る。','厚揚げ':'厚揚げはオーブントースターでこんがり焼き、一口大に切る。'}[p.n]
      ||(p.fish?`${p.n}は魚焼きグリルかフライパンで焼き、皮と骨を除いて身を大きめにほぐす。`:`${cutP}。沸騰した湯でゆでて火を通し、ざるに上げて冷ます。`);
    return [pb,v.raw?`${cutV}。冷水にさらしてシャキッとさせ、水気をよく切る。`:`${cutV}。さっとゆでるかレンジで加熱し、冷まして水気を切る。`,`ボウルに${S}とオリーブオイルを混ぜてドレッシングを作る。`,`${p.n}と${v.n}を加えて和え、器に盛る。`];}
  case 'don': return [cuts,`フライパンにサラダ油を中火で熱し、${p.n}を${p.cook}。`,`${v.n}を加えて火が通るまで炒め、${S}を加えて煮からめる。`,`器にご飯を盛り、具をたれごとのせる。`];

/* ===================== 分量 ===================== */
function nice(g,ug,u){
  if(!ug) return `${Math.round(g/5)*5}g`;
  const q=g/ug;
  if(ug<=60) return `${Math.max(1,Math.round(q))}${u}`;
  if(q>=1) return `${Math.round(q*2)/2}${u}`;
  const fr=[[1/8,'1/8'],[1/6,'1/6'],[1/4,'1/4'],[1/3,'1/3'],[1/2,'1/2'],[2/3,'2/3'],[3/4,'3/4']];
  let best=fr[0]; for(const x of fr) if(Math.abs(x[0]-q)<Math.abs(best[0]-q)) best=x;
  return `${best[1]}${u}`;
}

function recScore(r,seed){
  let s=r.h;

  let s=qs.normalize('NFKC').trim();
  const R={ing:new Map(),exIng:new Set(),tags:0,exTags:0,m:null,exM:new Set(),fl:null,exFl:new Set(),cu:new Set(),exCu:new Set(),sea:null,maxK:null,maxT:null,sort:null,health:false,meal:false,chips:[],free:[],ignored:[]};
  s=s.replace(/(\d+)\s*(kcal|キロカロリー|カロリー|cal)/gi,(_,n)=>{R.maxK=+n;R.chips.push([`${n}kcal以下`]);return ' ';});
  s=s.replace(/(\d+)\s*分/g,(_,n)=>{R.maxT=+n;R.chips.push([`${n}分以内`]);return ' ';});
  for(const e of KW){
    let i;
    while((i=s.indexOf(e.a))!==-1){
      const nm=s.slice(i+e.a.length).match(NEG);
      apply(R,e,!!nm);
      s=s.slice(0,i)+' '+s.slice(i+e.a.length+(nm?nm[0].length:0));
    }
  }
  const toks=s.replace(STOP,' ').split(/\s+/).filter(x=>x.length>=2);
  for(const tk of toks){ const lt=tk.toLowerCase(); if(ALL.some(r=>r.text.includes(lt))){R.free.push(lt);R.chips.push([`「${tk}」`]);} else R.ignored.push(tk); }
  return R;
}
function apply(R,e,neg){
  const ch=(l)=>{ if(!R.chips.some(c=>c[0]===l)) R.chips.push([l,neg]); };
  switch(e.t){
    case 'ing': if(neg){e.s.forEach(n=>R.exIng.add(n)); if(e.fl) R.exFl.add(e.fl);} else R.ing.set(e.label,e); ch(e.label+(neg?' 抜き':'')); break;
    case 'tag': if(neg) R.exTags|=T[e.tag]; else {R.tags|=T[e.tag]; if(e.sort&&!R.sort) R.sort=e.sort;} ch(TL[e.tag]+(neg?' 以外':'')); break;
    case 'health': R.health=true; if(!R.sort) R.sort='health'; ch('ヘルシー'); break;
    case 'sea': R.sea=e.sea; ch(`${e.sea}が旬`); break;
    case 'meal': R.meal=true; ch('朝ごはん向き'); break;
    case 'm': if(neg) e.ids.forEach(x=>R.exM.add(x)); else { R.m=R.m||new Set(); e.ids.forEach(x=>R.m.add(x)); if(e.fl){R.fl=R.fl||new Set();R.fl.add(e.fl);} } ch(e.label+(neg?' 以外':'')); break;
    case 'fl': if(neg) e.ids.forEach(x=>R.exFl.add(x)); else { R.fl=R.fl||new Set(); e.ids.forEach(x=>R.fl.add(x)); } ch(e.label+(neg?' 以外':'')); break;
    case 'cu': if(neg) R.exCu.add(e.cu); else R.cu.add(e.cu); ch(e.cu+(neg?' 以外':'')); break;
  }
}
function runFilter(R,uiTags,uiCu){
  const mask=R.tags|uiTags, ex=R.exTags, groups=[...R.ing.values()];
  const cuSet=new Set(R.cu); if(uiCu) cuSet.add(uiCu);
  return POOL.filter(r=>{
    if((r.tg&mask)!==mask||(r.tg&ex)) return false;
    if(R.exIng.has(r.p.n)||R.exIng.has(r.v.n)) return false;
    for(const g of groups) if(!(g.s.has(r.p.n)||g.s.has(r.v.n)||(g.fl&&r.f.id===g.fl))) return false;
    if(R.m&&!R.m.has(r.m.id)) return false;
    if(R.exM.has(r.m.id)||R.exFl.has(r.f.id)||R.exCu.has(r.cu)) return false;
    if(R.fl&&!R.fl.has(r.f.id)) return false;
    if(cuSet.size&&!cuSet.has(r.cu)) return false;
    if(R.sea&&!(r.v.sea===R.sea||r.p.sea===R.sea)) return false;
    if(R.maxK&&r.kcal>R.maxK) return false;
    if(R.maxT&&r.t>R.maxT) return false;
    if(R.health&&r.h<60) return false;
    if(R.meal&&(r.t>20||r.kcal>600||/age|nabe|takikomi|gratin/.test(r.m.id))) return false;
    for(const f of R.free) if(!r.text.includes(f)) return false;
    return true;
  });
}
const SORTS={
  auto:{label:'おすすめ順'},
  health:{label:'ヘルシー順',fn:(a,b)=>b.h-a.h||RS[b.id]-RS[a.id]},
  kcal:{label:'カロリーが低い順',fn:(a,b)=>a.kcal-b.kcal},
  protein:{label:'たんぱく質が多い順',fn:(a,b)=>b.P-a.P},
  time:{label:'調理時間が短い順',fn:(a,b)=>a.t-b.t||RS[b.id]-RS[a.id]},
};
function spreadPairs(list){
  const seen=new Set(),first=[],rest=[];
  for(const r of list){const k=r.p.n+'|'+r.v.n+'|'+r.m.id; (seen.has(k)?rest:first).push(r); seen.add(k);}
  return first.concat(rest);
}

  $('#scrim').innerHTML=''; renderDetail(); const sc=$('#scrim'); sc.hidden=false; document.body.style.overflow='hidden';
  sc.querySelector('.sheet').scrollTop=0; sc.querySelector('.x').focus({preventScroll:true});
  if(!already){ try{ history.pushState({sheet:1},''); pushed=true; }catch(e){ pushed=false; } }
}
function closeDetail(fromPop){
  if(!cur) return;
  $('#scrim').hidden=true; $('#scrim').innerHTML=''; document.body.style.overflow=''; cur=null;
  releaseWake();
  if(pushed&&!fromPop){ pushed=false; try{ history.back(); }catch(e){} } else pushed=false;
  if(S.view==='home') renderHome();
}
window.addEventListener('popstate',()=>{ if(cur){ pushed=false; closeDetail(true); } });
async function toggleWake(btn){
  if(wake){ releaseWake(); btn.setAttribute('aria-pressed','false'); toast('画面の自動消灯を元に戻しました'); return; }
  try{ wake=await navigator.wakeLock.request('screen'); btn.setAttribute('aria-pressed','true'); toast('調理中は画面が消えません'); wake.addEventListener('release',()=>{wake=null; const b=$('#wakeBtn'); if(b) b.setAttribute('aria-pressed','false');}); }
  catch(e){ toast('この端末では画面をつけたままにできません'); }
}
function releaseWake(){ if(wake){ try{wake.release();}catch(e){} wake=null; } }
function nrow(label,v,unit,tgt,inv){
  const pct=Math.min(100,v/tgt*100), over=inv&&v>tgt;
  return `<div class="nr"><span>${label}</span><div class="bar"><i class="${over?'over':''}" style="width:${pct}%"></i></div><span><b>${v}</b>${unit} / ${tgt}${unit}</span></div>`;
}
function renderDetail(){
  const r=cur, ing=ingredients(r,serv), st=steps(r);
  const sim=diverse(POOL.filter(x=>x.id!==r.id&&(x.p.n===r.p.n||x.v.n===r.v.n)&&x.m.id!==r.m.id).sort(byRS),4);
  const why=reasons(r);
  const inShop=shop.some(g=>g.rid===r.id);
  const done=[...document.querySelectorAll('.steps li')].map(li=>li.classList.contains('done'));
  $('#scrim').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.name)}">
    <button class="x" type="button" aria-label="閉じる"><span aria-hidden="true">‹</span> 戻る</button>
    ${plate(r)}
    <div class="sbody">
      <div><h2>${esc(r.name)}</h2>
        <div class="kv"><span><b>${r.t}</b>分</span><span><b>${r.kcal}</b>kcal（1人分）</span><span>${r.cu}・${r.m.l}</span></div>
        <div class="tags" style="margin-top:10px">${tagHtml(r,6)}</div>
        ${why.length?`<ul class="why" style="margin-top:12px">${why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}</div>
      <div><h3>材料 <span class="aside serv"><button type="button" id="sm" aria-label="1人分減らす">−</button><output id="sv">${serv}人分</output><button type="button" id="sp" aria-label="1人分増やす">＋</button></span></h3>
        <ul class="ing">${ing.main.concat(ing.base).map(([n,q])=>`<li><span>${esc(n)}</span><span>${esc(q)}</span></li>`).join('')}
          <li class="h">${esc(r.f.w)}の調味料</li>${ing.sea.map(([n,q])=>`<li><span>${esc(n)}</span><span>${esc(q)}</span></li>`).join('')}</ul>
        <button class="btn${inShop?'':' primary'}" type="button" id="addShop">${inShop?`買い物リストを${serv}人分で更新`:'買い物リストに追加'}</button></div>
      <div><h3>作り方 <span class="aside"><button class="btn small wake" type="button" id="wakeBtn" aria-pressed="${!!wake}">画面をつけたままにする</button></span></h3>
        <ol class="steps">${st.map((s,i)=>`<li class="${done[i]?'done':''}"><span>${esc(s)}</span></li>`).join('')}</ol>
        <p class="hint">終わった手順をタップするとチェックが付きます。</p></div>
      <div><h3>栄養（1人分）</h3>
        <div class="nut">
          ${nrow('エネルギー',r.kcal,'kcal',TARGET.kcal)}
          ${nrow('たんぱく質',r.P,'g',TARGET.P)}
          ${nrow('脂質',r.F,'g',TARGET.F,1)}
          ${nrow('炭水化物',r.C,'g',TARGET.C)}
          ${nrow('食物繊維',r.fib,'g',TARGET.fib)}
          ${nrow('塩分',r.salt,'g',TARGET.salt,1)}
          <small>右の数字は成人の1食あたりの目安です。ヘルシースコア ${r.h}/100</small>
        </div></div>
      ${sim.length?`<div><h3>同じ食材でほかの料理</h3><div class="sim">${sim.map(card).join('')}</div></div>`:''}
    </div></div>`;
}
function addToShop(r){
  const ing=ingredients(r,serv);
  const skip=/^(水|サラダ油|揚げ油|塩|塩\(ゆで用\)|酒)$/;
  const items=ing.main.concat(ing.base,ing.sea).filter(([n])=>!skip.test(n)).map(([n,qq])=>[n,qq,false]);
  shop=shop.filter(g=>g.rid!==r.id); shop.push({rid:r.id,name:r.name,serv,items}); store.set('rcp-shop',shop); badges();
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('コピーしました'); }
  catch(e){ const a=$('#copyArea'); if(a){ a.innerHTML=`<p class="hint">自動でコピーできなかったので、下の文字を長押ししてコピーしてください。</p><textarea class="copybox" id="copyBox" readonly></textarea>`; const t=$('#copyBox'); t.value=txt; t.focus(); t.select(); } }
}

/* イベント */
let tmr, composing=false;
const q=$('#q');
q.addEventListener('compositionstart',()=>composing=true);
q.addEventListener('compositionend',()=>{composing=false; schedule();});
q.addEventListener('input',()=>{ $('#clear').hidden=!q.value; if(!composing) schedule(); });
function schedule(){ clearTimeout(tmr); tmr=setTimeout(()=>{S.q=q.value;S.showAll=false;doSearch();},300); }
$('#form').addEventListener('submit',e=>{e.preventDefault();clearTimeout(tmr);S.q=q.value;S.showAll=false;q.blur();doSearch();});
$('#clear').addEventListener('click',()=>{S.q='';q.value='';$('#clear').hidden=true;doSearch();q.focus();});
function goHome(){S.q='';S.tags=0;S.cu='';S.sort='auto';S.showAll=false;q.value='';$('#clear').hidden=true;renderChips();renderHome();window.scrollTo(0,0);}
$('#logo').addEventListener('click',goHome);
try{ new IntersectionObserver(([e])=>$('#searchbar').classList.toggle('stuck',!e.isIntersecting)).observe($('.top')); }catch(e){}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cu'){S.cu=t.value;doSearch();}
  if(t.id==='sort'){S.sort=t.value;doSearch();}
  if(t.dataset&&t.dataset.shop){ const [gi,ii]=t.dataset.shop.split(':').map(Number); shop[gi].items[ii][2]=t.checked; store.set('rcp-shop',shop); t.closest('li').classList.toggle('done',t.checked); badges(); const c=$('#shopCount'); if(c) c.textContent=`残り${shopLeft()}品`; }
});
document.addEventListener('click',e=>{
  const T0=e.target;
  const fav=T0.closest('[data-fav]');
  if(fav){ e.stopPropagation(); const id=+fav.dataset.fav;
    const on=!favs.has(id); on?favs.add(id):favs.delete(id); store.set('rcp-favs',[...favs]); badges();
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.setAttribute('aria-pressed',on));
    toast(on?'お気に入りに追加しました':'お気に入りから外しました'); buildPref();
    if(S.view==='fav'&&!cur) renderFavs(); return; }
  if(T0.closest('.x')||T0.id==='scrim'){ closeDetail(); return; }
  const stp=T0.closest('.steps li'); if(stp){ stp.classList.toggle('done'); return; }
  const tab=T0.closest('[data-tab]');
  if(tab){ closeDetail(); const t=tab.dataset.tab; if(t==='home') goHome(); else if(t==='fav') renderFavs(); else if(t==='shop') renderShop(); else renderSettings(); window.scrollTo(0,0); return; }
  const tg=T0.closest('[data-tag]');
  if(tg){ S.tags^=T[tg.dataset.tag]; tg.setAttribute('aria-pressed',!!(S.tags&T[tg.dataset.tag])); doSearch(); return; }
  const qb=T0.closest('[data-q]');
  if(qb){ S.q=qb.dataset.q; q.value=S.q; $('#clear').hidden=!S.q; S.showAll=false; closeDetail(); doSearch(); window.scrollTo(0,0); return; }
  if(T0.closest('[data-all]')){ S.q='';q.value='';S.showAll=true; doSearch(); window.scrollTo(0,0); return; }
  const al=T0.closest('[data-allergy]');
  if(al){ const k=al.dataset.allergy; settings.allergy=settings.allergy.includes(k)?settings.allergy.filter(x=>x!==k):[...settings.allergy,k]; store.set('rcp-settings',settings); rebuildPool(); renderSettings(); return; }
  const ng=T0.closest('[data-ng]');
  if(ng){ const k=ng.dataset.ng; settings.ng=settings.ng.includes(k)?settings.ng.filter(x=>x!==k):[...settings.ng,k]; store.set('rcp-settings',settings); rebuildPool(); renderSettings(); return; }
  const rs=T0.closest('[data-rmshop]');
  if(rs){ shop.splice(+rs.dataset.rmshop,1); store.set('rcp-shop',shop); badges(); renderShop(); return; }
  const c=T0.closest('[data-id]');
  if(c){ if(S.view==='shop') renderShop(); openDetail(+c.dataset.id); return; }
  const bid=T0.closest('button')?.id;
  switch(bid){
    case 'spin': S.spin++; computeScores(DAYSEED+S.spin*101); renderHome(); document.getElementById('h-feat')?.scrollIntoView({block:'start'}); break;
    case 'menuSpin': S.menuSpin++; renderHome(); break;
    case 'more': S.page++; renderResults(); break;
    case 'reset': goHome(); break;
    case 'sm': if(serv>1){serv--; renderDetail();} break;
    case 'sp': if(serv<6){serv++; renderDetail();} break;
    case 'addShop': addToShop(cur); renderDetail(); toast(`${serv}人分の材料を買い物リストに入れました`); break;
    case 'wakeBtn': toggleWake(T0.closest('button')); break;
    case 'shopCopy': copyText(shopText()); break;
    case 'shopClear': shop=[]; store.set('rcp-shop',shop); badges(); renderShop(); toast('買い物リストを空にしました'); break;
    case 'resetSet': settings={ng:[],allergy:[]}; store.set('rcp-settings',settings); rebuildPool(); renderSettings(); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&cur) closeDetail();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-id]')){ e.preventDefault(); openDetail(+e.target.dataset.id); }
});
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&cur&&!wake&&$('#wakeBtn')?.getAttribute('aria-pressed')==='true'){ try{wake=await navigator.wakeLock.request('screen');}catch(e){} } });

/* 起動 */
rebuildPool();
$('#total').textContent=fmt(ALL.length);
computeScores(); renderChips(); badges(); renderHome();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
