牛肉の赤ワイン煮込み|牛すね肉:600g,玉ねぎ:1個,にんじん:1本,セロリ:1/2本,マッシュルーム:10個,ベーコン:80g,小玉ねぎ:8個|塩:小さじ1,黒こしょう:少々,薄力粉:大さじ3,オリーブオイル:大さじ2,バター:20g,にんにく:2片,赤ワイン:750ml,トマトペースト:大さじ2,水:200ml,コンソメ:小さじ2,ローリエ:2枚,タイム:少々,砂糖:小さじ1,はちみつ:小さじ2,チョコレート:5g|【前日】牛すね肉は大きめの5cm角に切り、乱切りの玉ねぎ・にんじん・セロリ・つぶしたにんにく・ローリエと一緒に赤ワインに浸し、冷蔵庫で一晩マリネする（ワインに漬けることで肉がやわらかく、ワインの風味が奥まで入る。ブフ・ブルギニョンの本場の作り方）。^肉と野菜をざるにあげ、マリネ液は取っておく。肉の水気を拭き、塩・黒こしょうをして薄力粉をまぶす。^厚手の鍋にオリーブオイルを強めの中火で熱し、肉の全面に5分、しっかり濃い焼き色をつけて取り出す。同じ鍋でマリネした野菜を5分、焼き色がつくまで炒める。^マリネ液を加えて強火で5分、アルコールを飛ばしながら煮詰める。肉を戻し、トマトペースト・水・コンソメ・タイム・砂糖を加えて煮立て、アクを取る。ふたをずらして弱火で2時間、肉がほろほろになるまで煮込む（圧力鍋なら加圧30分）。^別のフライパンでバターを溶かし、ベーコン・マッシュルーム・小玉ねぎを5分、焼き色がつくまで炒め、鍋に加えて15分煮る。^ふたを取って煮詰め、はちみつ・チョコレート（隠し味のコク）を加え、塩で調える。|味の決め手は「赤ワインで一晩マリネ」と「肉にしっかり焼き色」。フランスのビストロの本格ブフ・ブルギニョン。^煮込んで一晩おくと、さらに深い味に。
ボルシチ|牛すね肉:300g,ビーツ:2個,キャベツ:1/4個,玉ねぎ:1個,にんじん:1/2本,じゃがいも:2個,にんにく:2片,ディル:少々|塩:少々,水:1200ml,ローリエ:2枚,黒こしょう:粒5粒,サラダ油:大さじ2,バター:10g,トマトペースト:大さじ2,酢:大さじ2,砂糖:小さじ2,コンソメ:小さじ2,塩:小さじ1,サワークリーム:大さじ4|スープ：鍋に水・牛すね肉（塊）・ローリエ・黒こしょう粒を入れて強火で煮立て、アクを取って弱火で1時間煮る（牛すねから取るスープが、本場ウクライナのボルシチの土台）。肉を取り出してひと口大に切る。^ビーツは皮をむいてせん切り、玉ねぎはみじん切り、にんじんはせん切り、キャベツはせん切り、じゃがいもは1.5cm角、にんにくはみじん切り。^フライパンにサラダ油とバターを中火で熱し、玉ねぎ・にんじんを5分炒め、ビーツを加えて5分炒める。トマトペースト・酢・砂糖を加えて3分炒める（酢を加えて炒めると、ビーツの鮮やかな赤色が保たれる）。^スープにじゃがいもを入れて10分煮て、キャベツ・炒めた野菜・牛肉・コンソメを加えて15分煮る。^にんにく・塩を加えて火を止め、ふたをして10分おく（にんにくは最後に。香りが立つ）。^器に盛り、サワークリームとディルをたっぷりのせる。|味の決め手は「牛すねのスープ」と「ビーツを酢と炒めて色止め」。^サワークリームとディルで、本場の味に。一晩おくとさらにおいしい。
ブイヤベース|鯛:2切れ,有頭えび:6尾,あさり:300g,ムール貝:6個,いか:1杯,玉ねぎ:1個,セロリ:1/2本,トマト:2個,じゃがいも:1個|オリーブオイル:大さじ4,にんにく:3片,フェンネル:少々,白ワイン:150ml,水:800ml,サフラン:ひとつまみ,トマトペースト:大さじ1,ローリエ:1枚,タイム:少々,オレンジの皮:少々,塩:小さじ1,黒こしょう:少々,マヨネーズ:大さじ3,にんにく:1片,パプリカパウダー:小さじ1/2,バゲット:適量|魚介の下ごしらえ：あさり・ムール貝は砂抜き・洗う。鯛は塩をふって10分おき、ひと口大に切る。えびは頭を外す（頭と殻は取っておく）。いかは輪切り。サフランは水大さじ3に浸して色を出す。^魚介だし：鍋にオリーブオイル大さじ2を中火で熱し、えびの頭と殻を3分、ヘラで押しつぶしながら炒めて香りとみそを出す（えびの頭が本場のブイヤベースの深いコクの秘密）。白ワインを加えて2分、水を加えて10分煮出してこす。^別の鍋にオリーブオイル大さじ2・にんにくのみじん切り・薄切りの玉ねぎ・セロリを入れて中火で6分炒め、ざく切りトマト・トマトペーストを加えて3分。^魚介だし・サフラン液・ローリエ・タイム・オレンジの皮・薄切りのじゃがいもを加えて10分煮る。^鯛・えび・いか・あさり・ムール貝を加え、ふたをして中火で5分、貝が開くまで煮る。塩・黒こしょうで調える。^ルイユ：マヨネーズにすりおろしにんにく・パプリカパウダー・サフラン液少々を混ぜる。焼いたバゲットにルイユを塗り、スープに浸して食べる。|味の決め手は「えびの頭と殻でだしをとる」ことと「サフラン」。マルセイユの本場の味。^ルイユを塗ったバゲットをスープに浸すのが本場流。
ガスパチョ|完熟トマト:4個,きゅうり:1/2本,パプリカ:1/2個,玉ねぎ:1/8個,食パン:1枚|エクストラバージンオリーブオイル:大さじ4,シェリービネガー:大さじ1.5,にんにく:1/2片,塩:小さじ2/3,砂糖:小さじ1/2,クミン:少々,氷水:100ml|トマト（完熟のもの）はへたを取ってざく切り、きゅうり・パプリカ・玉ねぎもざく切り。食パンは耳を取ってちぎり、水少々でふやかす。^ボウルにトマト・きゅうり・パプリカ・玉ねぎ・にんにく・塩・砂糖を入れて混ぜ、30分おく（塩で野菜の水分とうまみを引き出す。本場スペインの作り方）。^ミキサーに野菜（出た汁ごと）・パン・シェリービネガー（なければ赤ワインビネガーか米酢）・クミン・氷水を入れ、なめらかになるまで2分攪拌する（パンがとろみと口当たりのまろやかさを出す）。^オリーブオイルを細く垂らしながらさらに1分攪拌し、乳化させる（オレンジがかったクリーミーな色になれば成功）。^ざるでこして（よりなめらかに）、冷蔵庫で2時間以上キンキンに冷やす。^器に盛り、きゅうり・パプリカ・クルトンの角切りを飾り、オリーブオイルをたらす。|味の決め手は「塩で野菜をなじませてから攪拌」と「オリーブオイルで乳化」。^冷やすと味がぼやけるので、塩はしっかりめに。
チーズフォンデュ|グリュイエールチーズ:150g,エメンタールチーズ:100g,ピザ用チーズ:100g,フランスパン:1本,ブロッコリー:1/2株,じゃがいも:2個,ウインナー:8本,ミニトマト:8個,マッシュルーム:6個|白ワイン:200ml,レモン汁:小さじ1,片栗粉:大さじ1,キルシュ:大さじ1,にんにく:1片,ナツメグ:少々,黒こしょう:少々|具：フランスパンはひと口大に切ってトースターで軽く焼く（表面が乾いてチーズがよく絡む）。ブロッコリーは小房に分けて塩ゆで2分、じゃがいもは皮付きのまま1.5cm角に切ってレンジで5分、ウインナー・マッシュルームはフライパンで焼く。^チーズは細かく刻み（またはピザ用を使う）、片栗粉をまぶしておく（分離せず、なめらかに溶ける）。^土鍋（またはフォンデュ鍋）の内側に、半分に切ったにんにくの断面をこすりつけて香りをつける。^白ワインとレモン汁を入れて中火で温め、ふつふつしてきたら弱火にし、チーズを3回に分けて加え、木べらで「8の字」を描くように混ぜながら溶かす（スイス流。レモン汁の酸でなめらかに）。^なめらかになったら、キルシュ（さくらんぼの蒸留酒。なければ省略）・ナツメグ・黒こしょうを加える。ごく弱火で保温しながら食卓へ。^具を串に刺して、チーズを絡めて食べる。固くなったら白ワインを少し足す。|味の決め手は「2〜3種のチーズ」と「白ワイン＋レモン汁」。スイスの本場の味。^チーズに片栗粉をまぶし、8の字に混ぜると分離しない。
シュクメルリ|骨付き鶏もも肉:2本,じゃがいも:2個,ブロッコリー:1/3株|塩:小さじ1/2,黒こしょう:少々,オリーブオイル:大さじ1,バター:20g,にんにく:6片,白ワイン:50ml,牛乳:250ml,生クリーム:100ml,コンソメ:小さじ1,塩:少々,パセリ:少々|鶏肉は骨に沿って切り込みを入れ、塩・黒こしょうをすり込んで15分おく。じゃがいもはくし形に切ってレンジで4分加熱。ブロッコリーは小房に。にんにくは4片をみじん切り、2片をすりおろす（にんにくたっぷりがジョージア料理の命）。^スキレット（またはフライパン）にオリーブオイルを入れ、鶏肉を皮目を下にして並べてから中火にかける。重しをして8分、皮がパリッときつね色になるまで焼く（出た脂でじゃがいもも一緒に焼く）。^返して弱めの中火で5分、ふたをして中まで火を通す。^余分な脂を拭き、バターとみじん切りのにんにくを加えて2分、香りが立つまで炒める（にんにくを焦がさないように）。^白ワインを加えて1分、牛乳・生クリーム・コンソメ・すりおろしにんにくを加え、ブロッコリーを入れて弱めの中火で6分、とろみがつくまで煮詰める。塩で調える。^パセリを散らし、スキレットのまま食卓へ。パンでソースをすくって。|味の決め手は「にんにく6片」と「皮をパリッと焼いてから煮る」こと。ジョージアの本場の味。^ソースはパンで残さず食べて。
ポテトグラタン|じゃがいも:4個,玉ねぎ:1/2個,ベーコン:60g,グリュイエールチーズ:40g,ピザ用チーズ:40g|バター:20g,にんにく:1片,牛乳:250ml,生クリーム:150ml,コンソメ:小さじ1,塩:小さじ1/3,白こしょう:少々,ナツメグ:少々|じゃがいも（メークイン）は皮をむいて2〜3mm厚の薄切りにする（水にはさらさない。でんぷんが自然なとろみになる。フランスのグラタン・ドフィノワの作り方）。玉ねぎは薄切り、ベーコンは1cm幅。^鍋に牛乳・生クリーム・コンソメ・塩・白こしょう・ナツメグ・じゃがいも・玉ねぎを入れて中火にかけ、煮立ったら弱火で10分、ときどき底から混ぜながら、じゃがいもがやわらかく、とろみがつくまで煮る（下煮すると、しっとりとろとろに）。^オーブンを200℃に予熱する。耐熱皿の内側ににんにくの断面をこすりつけ、バターを塗る（にんにくの香りがほのかに移る）。^じゃがいもを煮汁ごと入れ、ベーコンを散らし、2種のチーズをのせる。^200℃で20分、表面がこんがりきつね色になるまで焼く。^10分おいて落ち着かせてから取り分ける。|味の決め手は「じゃがいもを水にさらさない」ことと「牛乳と生クリームで下煮」。^器ににんにくをこすりつけると、上品な香りに。
ローストチキン|骨付き鶏もも肉:2本,じゃがいも:2個,玉ねぎ:1個,にんじん:1/2本,レモン:1/2個|塩:小さじ1,砂糖:小さじ1/2,黒こしょう:少々,にんにく:3片,ローズマリー:2本,オリーブオイル:大さじ2,バター:15g,はちみつ:大さじ1,しょうゆ:大さじ1,白ワイン:大さじ2,粒マスタード:小さじ1|鶏肉は骨に沿って切り込みを入れ、フォークで皮を数か所刺す。塩・砂糖・黒こしょう・すりおろしにんにく1片をすり込み、冷蔵庫で2時間〜一晩おく（下味を早めにすると、身にしっかり味が入りジューシー）。焼く30分前に室温に戻す。^じゃがいも・にんじんは大きめの乱切り、玉ねぎはくし形、残りのにんにくは皮付きのままつぶす。オーブンを220℃に予熱する。^天板に野菜とにんにく・ローズマリーを広げ、オリーブオイル大さじ1と塩少々をまぶす。その上に鶏肉を皮を上にしてのせ、皮に溶かしバターとオリーブオイルを塗る（野菜が肉汁を吸っておいしくなる）。^220℃で30分焼く。はちみつ・しょうゆを混ぜたものを皮に塗り、さらに10分、照りが出るまで焼く。^一番厚い部分に竹串を刺し、透明な肉汁が出れば焼き上がり。5分休ませる。^ソース：天板の肉汁に白ワイン・粒マスタードを加えて混ぜる。レモンを添えて。|味の決め手は「塩と砂糖で早めに下味」と「仕上げのはちみつじょうゆ」。皮はパリッと照り照り、身はジューシー。^野菜を下に敷くと、肉汁を吸って最高のつけ合わせに。
チキンのクリーム煮|鶏もも肉:2枚,玉ねぎ:1/2個,しめじ:1パック,マッシュルーム:6個,ブロッコリー:1/2株|塩:小さじ1/2,黒こしょう:少々,薄力粉:大さじ1.5,オリーブオイル:小さじ2,バター:20g,にんにく:1片,白ワイン:80ml,牛乳:150ml,生クリーム:150ml,コンソメ:小さじ1,粒マスタード:小さじ1,レモン汁:小さじ1,パセリ:少々|鶏肉はひと口大に切り、塩・黒こしょうをして薄力粉をまぶす（ソースに自然なとろみがつき、肉がやわらか）。玉ねぎは薄切り、しめじはほぐし、マッシュルームは薄切り。ブロッコリーは小房に分けて塩ゆで1分。^フライパンにオリーブオイルとバター10gを中火で熱し、鶏肉を皮目から4分、こんがり焼いて返し、2分焼いて取り出す（焼き色がソースのコクになる）。^同じフライパンに残りのバター・にんにくのみじん切り・玉ねぎを入れて4分、きのこを加えて3分、焼き色がつくまで炒める。^白ワインを加えて強火で1分、鍋底のこびりつきをこそげながら半量まで煮詰める（うまみをソースに溶かす）。^牛乳・コンソメを加えて鶏肉を戻し、弱めの中火で5分煮る。生クリーム・粒マスタードを加えて3分、とろりとするまで煮る（生クリームを入れたら沸騰させない）。^ブロッコリーを加えて温め、レモン汁・塩・黒こしょうで調える。パセリを散らす。|味の決め手は「白ワインで鍋底をこそげる」ことと「粒マスタード＋レモン汁」。重くならず、フランスのビストロの味。^レモン汁少々で、クリームの味がぐっと引き締まる。
サーモンのクリームパスタ|スパゲッティ:200g,サーモン:200g,玉ねぎ:1/4個,ほうれん草:1/3束,しめじ:1/2パック|塩:少々,塩(ゆで用):大さじ1,オリーブオイル:大さじ1,バター:15g,にんにく:1片,白ワイン:50ml,生クリーム:200ml,粉チーズ:大さじ3,レモン汁:小さじ1,ディル:少々,黒こしょう:少々|サーモンはひと口大に切り、塩少々をふって10分おき、水気を拭く。玉ねぎは薄切り、ほうれん草は4cm長さ、しめじはほぐす、にんにくはみじん切り。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間より1分短くゆでる。^フライパンにオリーブオイルを中火で熱し、サーモンを両面1分ずつ焼いて取り出す（最後に戻して、身をふっくら保つ）。^同じフライパンにバター・にんにく・玉ねぎを入れて2分、しめじを加えて2分炒め、白ワインを加えて1分煮詰める。^生クリームを加えて弱めの中火で2分、少しとろりと煮詰める。ほうれん草を加えて30秒。^ゆで上がったパスタ・粉チーズ・ゆで汁大さじ2を加えて弱火で30秒絡め、サーモンを戻す。レモン汁（クリームの重さを軽くする）・黒こしょうで調え、ディルを散らす。|味の決め手は「サーモンを先に焼いて取り出す」ことと「白ワイン＋レモン汁＋ディル」。^ディルとサーモンは北欧の定番の組み合わせ。香りでお店の味に。
明太子クリームパスタ|スパゲッティ:200g,辛子明太子:1.5腹,大葉:6枚,しめじ:1/2パック|塩(ゆで用):大さじ1,バター:20g,生クリーム:150ml,牛乳:50ml,粉チーズ:大さじ2,しょうゆ:小さじ1,レモン汁:小さじ1/2,のり:適量|明太子は薄皮に切り込みを入れ、スプーンで中身をこそげ出す（飾り用に1/4残す）。^大きめのボウルに明太子・やわらかくしたバター・しょうゆ・レモン汁を入れて混ぜておく。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間通りゆでる。^フライパンにしめじを入れて中火で2分炒め、生クリーム・牛乳・粉チーズを加えて弱火で2分温め、少しとろみがついたら火を止める（沸騰させない）。^ゆで上がったパスタと温かいクリームを明太子のボウルに入れ、手早く和える（明太子に火を入れすぎないと、ぷちぷち食感とピンク色が残る）。^器に盛り、残りの明太子・刻みのり・せん切りの大葉をのせる。|味の決め手は「明太子は加熱しない」ことと「粉チーズ＋しょうゆ」のうまみ。^レモン汁少々で、明太子の生臭さが消えて味が締まる。
トマトリゾット|米:160g,玉ねぎ:1/2個,ベーコン:60g,モッツァレラチーズ:50g,バジル:5枚|オリーブオイル:大さじ1,バター:20g,にんにく:1片,白ワイン:50ml,トマト缶:1/2缶,トマトペースト:大さじ1,水:500ml,コンソメ:小さじ2,砂糖:小さじ1/2,粉チーズ:大さじ4,塩:少々,黒こしょう:少々|米は洗わずに使う（でんぷんがとろみになる）。玉ねぎ・にんにくはみじん切り、ベーコンは1cm角。^ブイヨン：小鍋に水・コンソメ・トマト缶・トマトペースト・砂糖を入れて温めておく（熱いブイヨンを少しずつ加えるのが、芯を残さない秘訣）。^フライパンにオリーブオイル・バター10g・にんにく・ベーコンを入れて中火で2分、玉ねぎを加えて3分、透き通るまで炒める。^米を加えて2分、米が半透明になるまで炒め、白ワインを加えて30秒煮立てる。^熱いブイヨンをお玉2杯加え、弱めの中火で混ぜながら煮る。汁気が少なくなったら2杯ずつ足す、を繰り返して17〜18分、米に少し芯が残るアルデンテに仕上げる。^火を止めて、残りのバター10g・粉チーズを加えて手早く力強く混ぜる（マンテカトゥーラ。とろりと乳化させる）。ちぎったモッツァレラとバジルをのせ、黒こしょうをふる。|味の決め手は「熱いブイヨンを少しずつ」と「最後のバター＋チーズで乳化」。イタリアの本場のリゾットに。^モッツァレラをのせると、とろけてさらに濃厚に。
ブルスケッタ|バゲット:1/2本,完熟トマト:2個,バジル:8枚,モッツァレラチーズ:50g|エクストラバージンオリーブオイル:大さじ3,にんにく:2片,塩:小さじ1/3,黒こしょう:少々,バルサミコ酢:小さじ1|トマトは種を取って1cm角に切り、ペーパーで水気を取る（水っぽくなるとパンがべちゃっとする）。^ボウルにトマト・刻んだにんにく少々・手でちぎったバジル・オリーブオイル大さじ2・塩・黒こしょう・バルサミコ酢を入れて混ぜ、冷蔵庫で15分なじませる（トマトの甘みとうまみが引き出される）。^バゲットは1.5cm厚の斜め切りにし、トースターで3分、カリッときつね色に焼く。^焼きたてのパンの表面に、半分に切ったにんにくの断面をこすりつける（にんにくがパンのざらざらに削られ、ほのかな香りが移る。本場イタリアの作り方）。^残りのオリーブオイルをパンに塗り、トマトを汁気を切ってのせる。モッツァレラ（角切り）をのせても。^食べる直前にのせるのがポイント。|味の決め手は「にんにくをパンにこすりつける」ことと「トマトをマリネしてなじませる」こと。^良いオリーブオイルを使うと格段においしい。
コブサラダ|鶏むね肉:150g,アボカド:1個,トマト:1個,卵:2個,ベーコン:80g,ロメインレタス:1/2株,ブルーチーズ:30g,コーン缶:50g|塩:小さじ1/4,砂糖:小さじ1/2,酒:大さじ1,マヨネーズ:大さじ3,ヨーグルト:大さじ1,レモン汁:小さじ2,ウスターソース:小さじ1/2,ディジョンマスタード:小さじ1,にんにく:少々,はちみつ:小さじ1/2,塩:少々,黒こしょう:少々|鶏むね肉は塩・砂糖をすり込み、酒をふってラップし、レンジ600Wで2分半、返して1分加熱し、10分おく。1.5cm角に切る。^卵は11分ゆでて1.5cm角。ベーコンは1cm角に切ってカリカリに焼く。アボカド・トマトは1.5cm角、ロメインレタス（またはレタス）は1.5cm幅（全部の具を同じ大きさに揃えるのがコブサラダの基本）。^ドレッシング：マヨネーズ・ヨーグルト・レモン汁・ウスターソース・マスタード・すりおろしにんにく・はちみつ・塩・黒こしょうを混ぜる。ブルーチーズを崩して加える（ブルーチーズ入りがアメリカの本場のコブサラダ。なければ省略可）。^器にレタスを敷き、具を縞模様に並べる。^ドレッシングを添え、食べる直前に全体をよく混ぜる。|味の決め手は「具を同じ大きさに揃える」ことと「ブルーチーズ入りのドレッシング」。^混ぜて食べると、いろいろな味が一度に楽しめる。
ニース風サラダ|ツナ缶:1缶,じゃがいも:2個,いんげん:8本,卵:2個,トマト:1個,レタス:4枚,ブラックオリーブ:8個,アンチョビ:4枚,紫玉ねぎ:1/4個|エクストラバージンオリーブオイル:大さじ3,白ワインビネガー:大さじ1,ディジョンマスタード:小さじ1,にんにく:少々,塩:小さじ1/4,黒こしょう:少々,はちみつ:小さじ1/2|じゃがいもは皮付きのまま水から15分ゆで、皮をむいて1cm厚に切る。いんげんは塩ゆで2分。卵は8分ゆで（黄身がしっとり）て4つ割り。^ドレッシング：白ワインビネガー・マスタード・すりおろしにんにく・塩・黒こしょう・はちみつを混ぜ、オリーブオイルを少しずつ加えて乳化させる（マスタードを入れると分離せず、フランスの本場の味）。^じゃがいもが温かいうちにドレッシングの1/3をからめる（温かいうちに味がしみる）。^トマトはくし形、レタスはちぎる、紫玉ねぎは薄切りにして水にさらす。ツナは缶汁を切る。^器にレタスを敷き、じゃがいも・いんげん・トマト・卵・ツナ・オリーブ・アンチョビ・紫玉ねぎを彩りよく並べる。^残りのドレッシングをかける。|味の決め手は「アンチョビとオリーブ」の塩気とうまみ、そして「マスタード入りのドレッシング」。南フランスの本場の味。^じゃがいもは温かいうちにドレッシングを絡める。
カニクリームコロッケ|かに缶:1缶,かに風味かまぼこ:4本,玉ねぎ:1/2個,マッシュルーム:3個,卵:1個,キャベツ:3枚|バター:50g,薄力粉:60g,牛乳:400ml,生クリーム:50ml,白ワイン:大さじ1,コンソメ:小さじ1,塩:小さじ1/4,白こしょう:少々,ナツメグ:少々,薄力粉:適量,パン粉:60g,揚げ油:適量,ケチャップ:大さじ2,中濃ソース:大さじ1|玉ねぎ・マッシュルームはみじん切り、かにかまはほぐす。かに缶は汁ごと使う（かにのうまみたっぷりの汁も入れる）。^鍋にバターを弱めの中火で溶かし、玉ねぎを4分、透き通るまで炒め、マッシュルームを加えて1分。薄力粉60gを加えて2分、焦がさないように炒める。^冷たい牛乳・かに缶の汁を少しずつ加えて混ぜ、中火で6分、ヘラで底をなぞって跡が残るくらいの固さまで練る。白ワイン・生クリーム・かに・かにかま・コンソメ・塩・白こしょう・ナツメグを加える。^バットに広げてラップを密着させ、冷蔵庫で4時間以上（できれば一晩）しっかり冷やし固める（ここが成形と破裂防止の最大のポイント）。^手に油を塗り、8等分して俵形にし、薄力粉→溶き卵→パン粉、もう一度溶き卵→パン粉と二度づけする（衣を厚くして中身が漏れないように）。^揚げ油を180℃に熱し、2分半、きつね色になったらすぐ引き上げる（長く揚げると破裂する）。キャベツと、ケチャップと中濃ソースを混ぜたソースを添えて。|味の決め手は「かに缶を汁ごと使う」ことと「一晩冷やし固める」こと。中がとろ〜りの洋食屋の味。^衣の二度づけで、揚げても破裂しない。
オニオンリング|玉ねぎ:1個|塩:少々,薄力粉:60g,片栗粉:大さじ1,ベーキングパウダー:小さじ1/2,パプリカパウダー:小さじ1/2,ガーリックパウダー:少々,塩:小さじ1/4,ビール:80ml,卵:1/2個,パン粉:40g,揚げ油:適量,ケチャップ:大さじ2,マヨネーズ:大さじ2,チリパウダー:少々|玉ねぎは1.5cm厚の輪切りにしてばらし、薄皮を取る。冷水に10分さらしてシャキッとさせ（辛みも抜ける）、水気を完全に拭く。^薄力粉（分量外）を薄くまぶす（衣がはがれにくい）。^衣：薄力粉・片栗粉・ベーキングパウダー・パプリカパウダー・ガーリックパウダー・塩を混ぜ、冷たいビール（なければ炭酸水）と卵を加えてさっくり混ぜる（スパイスとビールで、アメリカのダイナーのオニオンリングに）。^パン粉は袋に入れて細かく砕く（細かいとカリッと軽く仕上がる）。^玉ねぎを衣にくぐらせ、パン粉をまぶす。^揚げ油を170℃に熱し、1分半〜2分、きつね色になるまで揚げる。油を切り、熱いうちに塩をふる。ケチャップ・マヨネーズ・チリパウダーを混ぜたディップを添えて。|味の決め手は「スパイス入りのビール衣」と「細かいパン粉」。サクサク、甘い玉ねぎ。^玉ねぎを冷水にさらすと、シャキッと甘く仕上がる。
塩ラーメン|中華麺:2玉,焼き豚:4枚,メンマ:40g,長ねぎ:1/3本,もやし:1/2袋,煮卵:2個,三つ葉:適量|昆布:1枚,水:800ml,煮干し:10g,鶏がらスープの素:大さじ1,酒:大さじ1,塩:小さじ1,薄口しょうゆ:小さじ1,みりん:小さじ1,オイスターソース:小さじ1/2,ラード:大さじ2,にんにく:1片,しょうが:1かけ,白こしょう:少々,ゆずの皮:少々|スープ：鍋に水・昆布・煮干し（頭とわたを取る）を入れて30分おき、弱火で10分煮出してこす（昆布＋煮干しの魚介だしを足すと、透き通った奥深い塩ラーメンのスープに）。鶏がらスープの素・酒を加えて温める。^塩だれ：塩・薄口しょうゆ・みりん・オイスターソース（隠し味のうまみ）を混ぜる。^香味油：小鍋にラード・つぶしたにんにく・しょうがの薄切り・長ねぎの青い部分を入れ、弱火で5分、ねぎがきつね色になるまで加熱してこす（ねぎ油の香りが塩ラーメンの命）。^もやしはさっとゆでる。^温めた丼に塩だれと香味油を半量ずつ入れ、熱いスープを注いで混ぜる。^中華麺（細めのストレート麺）を表示時間通りゆでて湯をしっかり切り、丼に入れて整える。焼き豚・メンマ・もやし・半分に切った煮卵・白髪ねぎ・三つ葉・ゆずの皮をのせ、白こしょうをふる。|味の決め手は「昆布＋煮干しの魚介だし」と「ねぎ油」。透き通った、奥深い塩スープ。^ゆずの皮で、上品な香りがぐっと立つ。
とんこつラーメン|中華麺(細):2玉,焼き豚:4枚,きくらげ:3g,小ねぎ:適量,紅しょうが:適量,煮卵:2個,のり:2枚|水:400ml,豆乳:300ml,鶏がらスープの素:大さじ1,とんこつスープの素:大さじ1,練りごま:大さじ1,しょうゆ:大さじ1,塩:小さじ1/2,オイスターソース:小さじ1,にんにく:2片,ラード:大さじ2,白ごま:小さじ2,辛子高菜:適量|マー油（黒い香味油）：小鍋にラード（またはサラダ油＋ごま油）とみじん切りのにんにく1片を入れ、弱火で5〜6分、にんにくが黒く焦げるまで加熱する（焦がしにんにく油。熊本・博多のとんこつラーメンの香ばしさの正体）。^たれ：しょうゆ・塩・オイスターソース・練りごま・すりおろしにんにく1片を混ぜる。^スープ：鍋に水・鶏がらスープの素・とんこつスープの素（あれば。なければ鶏がらを増やす）を入れて煮立て、豆乳を加えて沸騰直前まで温める（豆乳と練りごまで、とんこつのような白濁でクリーミーなスープに。沸騰させると分離する）。^きくらげはもどして細切り。^温めた丼にたれを入れ、熱いスープを注いで混ぜる。細麺を表示時間より短め（30秒〜1分）にゆで、硬めに仕上げる（博多流の「バリカタ」）。^焼き豚・きくらげ・小ねぎ・煮卵・のり・紅しょうがをのせ、マー油を回しかけ、白ごまをふる。辛子高菜を添えて。|味の決め手は「豆乳＋練りごまのクリーミースープ」と「焦がしにんにく油（マー油）」。^麺は硬めにゆでるのが博多流。替え玉にも。
つけ麺|中華麺(太):2玉,豚バラ肉:120g,長ねぎ:1/2本,メンマ:40g,煮卵:2個,のり:2枚|水:350ml,鶏がらスープの素:小さじ2,和風だしの素:小さじ1,かつお節:15g,煮干し:5g,しょうゆ:大さじ4,みりん:大さじ2,砂糖:大さじ1,オイスターソース:小さじ1,酢:大さじ1,ラード:大さじ1,魚粉:大さじ1,ゆずの皮:少々,ラー油:少々|つけ汁：小鍋に水・煮干し（頭とわたを取る）を入れて中火で5分煮出し、かつお節を加えて2分煮出してこす（魚介たっぷりのだしが、人気つけ麺店の味の決め手）。^鶏がらスープの素・和風だしの素・しょうゆ・みりん・砂糖・オイスターソースを加えて煮立てる。豚バラ肉（3cm長さ）・長ねぎ（斜め切り）を入れて3分煮る（豚の脂がつけ汁にコクを加える）。^火を止めて、酢・ラード・魚粉（濃厚魚介豚骨の風味。なければかつお節を粉にして）を加える（酢でさっぱり、ラードと魚粉で濃厚に）。^中華麺（太麺）を表示時間通りゆで、冷水でしっかり洗って締める（ぬめりを取ってコシを出す）。^麺を器に盛り、メンマ・煮卵・のりを添える。^熱々のつけ汁に麺をつけて食べる。ゆずの皮・ラー油で味変。最後につけ汁にお湯を足してスープ割りに。|味の決め手は「煮干し＋かつお節の魚介だし」と「魚粉」「酢」。濃厚魚介つけ麺の味。^麺は冷水でしっかり締めると、つけ汁がよく絡む。
汁なし担々麺|中華麺:2玉,豚ひき肉:150g,チンゲン菜:1株,小ねぎ:適量,ナッツ:20g|ごま油:大さじ1,甜麺醤:大さじ1,しょうゆ:小さじ1,酒:小さじ1,練りごま:大さじ3,しょうゆ:大さじ2,黒酢:小さじ2,砂糖:小さじ2,鶏がらスープの素:小さじ1/2,ラー油:大さじ2,花椒:小さじ1,にんにく:少々,芽菜:20g|肉味噌：フライパンにごま油を中火で熱し、ひき肉を5分、脂が透き通ってカリッと香ばしくなるまでしっかり炒める（カリカリの肉味噌が汁なし担々麺の主役）。甜麺醤・しょうゆ小さじ1・酒を加えて1分炒め絡める。^花椒（ホールなら、フライパンで弱火で1分からいりして、すり鉢で粉にする。香りが段違い）を用意する。^たれ：丼に練りごま・しょうゆ大さじ2・黒酢・砂糖・鶏がらスープの素（少量のお湯で溶く）・ラー油・すりおろしにんにくを混ぜる（2人分に分ける）。^チンゲン菜は縦4等分にして、麺をゆでる湯で1分ゆでる。ナッツ（カシューナッツなど）は砕く。^中華麺を表示時間通りゆで、湯を切って丼に入れる。^肉味噌・チンゲン菜・芽菜（ザーサイでも）・小ねぎ・ナッツをのせ、花椒をたっぷりふる。底からよく混ぜて食べる。|味の決め手は「カリカリの肉味噌」と「挽きたての花椒」。広島・四川の本場の痺れる味。^底からしっかり混ぜて、たれを麺全体に絡めて。
ざるうどん|ゆでうどん:2玉,のり:1/2枚,小ねぎ:適量,天かす:大さじ2|しょうゆ:60ml,みりん:60ml,砂糖:小さじ1,昆布:1枚,かつお節:10g,煮干し:5g,水:300ml,しょうが:1かけ,いりごま:小さじ1|つけつゆ：小鍋にみりんを入れて煮立て、水・昆布・煮干し（頭とわたを取る）を加えて弱火で5分。かつお節・しょうゆ・砂糖を加えて2分煮出してこし、冷やす（いりこ＋かつおで讃岐のうどん屋の味）。^しょうがはすりおろし、小ねぎは小口切り、のりはせん切り。^うどん（冷凍讃岐うどん推奨）は熱湯で表示時間通りゆでる。^流水でもみ洗いしてぬめりを取り、氷水に30秒つけてキュッと締める（ここでコシが決まる）。^水気をしっかり切ってざるに盛り、のりをのせる。^つゆに薬味（小ねぎ・しょうが・天かす・いりごま）を入れてつけて食べる。|味の決め手は「いりこ＋かつおのつけつゆ」と「氷水で締める」こと。^つけつゆは濃いめが、うどんによく合う。
冷やしうどん|ゆでうどん:2玉,ささみ:2本,きゅうり:1/2本,トマト:1個,卵:2個,オクラ:4本,みょうが:1個|酒:大さじ1,塩:少々,砂糖:小さじ1/2,しょうゆ:大さじ3,みりん:大さじ3,砂糖:小さじ1,かつお節:10g,水:300ml,しょうが:少々,いりごま:小さじ1|冷やしつゆ：小鍋にみりんを入れて煮立て、水・しょうゆ・砂糖・かつお節を加えて2分煮出してこし、冷蔵庫でキンキンに冷やす。^ささみは筋を取り、塩・砂糖をすり込んで酒をふり、ラップしてレンジ600Wで1分半加熱。そのまま5分おいて余熱で火を通し、手で裂く（パサつかない）。^卵は6分半ゆでて半熟卵にする。オクラは塩ゆでして小口切り、きゅうりはせん切り、トマトはくし形、みょうがはせん切り。^うどんを熱湯でゆでて流水でもみ洗いし、氷水で締めて水気を切る。^器に盛り、具を彩りよくのせ、冷たいつゆをかける。^おろししょうがといりごまを添える。|味の決め手は「自家製の冷やしつゆ」と「しっとりささみ」。^オクラとみょうがで、夏らしい爽やかさ。
オートミール粥|オートミール:60g,卵:1個,小ねぎ:適量,しらす:20g,梅干し:1個|水:350ml,和風だしの素:小さじ1,鶏がらスープの素:小さじ1/2,しょうゆ:小さじ1,ごま油:小さじ1/2,しょうが:少々,いりごま:少々|鍋に水・和風だしの素・鶏がらスープの素・オートミールを入れて中火にかける（和風と中華のダブルだしで、オートミールのクセが消えておいしい雑炊に）。^煮立ったら弱火にして3分、混ぜながらとろりとするまで煮る（レンジなら600Wで2分、混ぜてさらに1分）。^しょうゆで調える。^溶き卵を回し入れ、ふたをして火を止め、1分蒸らす（ふんわり）。^器に盛り、しらす・小ねぎ・おろししょうが・いりごまをのせ、ごま油をたらす。梅干しを添えて。|味の決め手は「和風＋鶏がらのダブルだし」と「ごま油＋しょうが」。オートミールとは思えない、おいしい雑炊。^しらすと梅干しで、満足感と塩気のアクセント。
納豆ご飯|ご飯:300g,納豆:2パック,小ねぎ:適量,卵黄:2個,のり:適量,大葉:2枚|からし:少々,しょうゆ:小さじ1,みりん:小さじ1/2,かつお節:1g,ごま油:少々,いりごま:少々|だししょうゆ：しょうゆにみりんとかつお節を混ぜて5分おく（簡単だししょうゆで、納豆のうまみが引き立つ）。^納豆はたれを入れる前に、箸で50回ほど白っぽく糸が立つまで混ぜる（先に混ぜると粘りとうまみが増し、ふわふわに）。^だししょうゆ（またはつけだれ）とからしを加え、さらに30回混ぜる。^小ねぎ・刻んだ大葉を加えて混ぜる。^炊きたての熱いご飯にのせ、中央に卵黄を落とし、刻みのり・いりごまをのせ、ごま油を数滴たらす。|味の決め手は「たれを入れる前に50回混ぜる」ことと「卵黄＋ごま油」。^ねぎと大葉をたっぷりで、香りよく。
じゃがバター|じゃがいも:2個,塩辛:20g,コーン缶:30g|塩:小さじ1/2,バター:30g,しょうゆ:少々,黒こしょう:少々|じゃがいも（男爵・大きめ）はよく洗い、皮付きのままの状態で使う。^【蒸し器で（一番おいしい）】蒸気の上がった蒸し器で強火で30〜35分、竹串がすっと通るまで蒸す（蒸すと、ほくほくで甘みが段違い。北海道の屋台の味）。【レンジで】ぬらしたペーパーとラップで包み、600Wで5〜6分、返して2分。^熱いうちに十字に深く切り込みを入れ、両端を押して割り開く。^塩をふり、バターをたっぷりのせる（バターは惜しまずに）。^しょうゆを数滴たらし、黒こしょうをふる。^塩辛やコーンをのせると北海道流（塩辛＋じゃがバターは、ぜひ試してほしい組み合わせ）。|味の決め手は「蒸してほくほく」と「バターたっぷり」。^塩辛をのせると、北海道の居酒屋の名物の味に。
長いもの梅和え|長いも:250g,大葉:5枚,かつお節:1パック|梅干し:2個,めんつゆ:小さじ2,みりん:小さじ1,ごま油:小さじ1/2,いりごま:少々,のり:少々|長いもは皮をむき、ポリ袋に入れてめん棒で叩いて粗く砕く（包丁で切るより断面がでこぼこで、味が絡む。シャキシャキ感も残る）。^梅干しは種を除いて包丁で叩いてペースト状にし、めんつゆ・みりん（梅の酸味がまろやかに）・ごま油を混ぜる。^長いもと梅だれを和え、かつお節の半量を混ぜる。^器に盛り、せん切りの大葉・残りのかつお節・刻みのり・いりごまをのせる。|味の決め手は「叩いて砕く」ことと「みりんで梅をまろやかに」。^かつお節を混ぜると、うまみがぐっと増す。
アボカドのわさび醤油和え|アボカド:1個,まぐろ:80g,のり:1/2枚,小ねぎ:適量|しょうゆ:小さじ2,みりん:小さじ1/2,わさび:小さじ1/2,ごま油:小さじ1,いりごま:小さじ1,レモン汁:少々|アボカドは種と皮を除いて2cm角に切り、レモン汁をからめる（変色防止）。まぐろ（あれば）も2cm角。^たれ：わさびをしょうゆでよく溶き、みりん・ごま油を混ぜる（みりんで角が取れ、ごま油でコクが出る）。^アボカド・まぐろをたれで和え、5分なじませる。^器に盛り、ちぎったのり・小ねぎ・いりごまを散らす（のりはしんなりしすぎないよう直前に）。|味の決め手は「わさびじょうゆ＋ごま油」。アボカドがまぐろのトロのような味わいに。^まぐろを加えると、居酒屋の人気メニューに。
トマトの塩昆布和え|トマト:2個,大葉:3枚|塩昆布:大さじ1.5,ごま油:大さじ1,酢:小さじ1,砂糖:ひとつまみ,にんにく:少々,いりごま:小さじ1|トマトはへたを取ってひと口大の乱切りにする（冷やしておくと格別）。^ボウルにトマト・塩昆布・ごま油・酢・砂糖・すりおろしにんにく少々を入れて和え、冷蔵庫で10分おく（塩昆布のうまみがトマトの水分で溶け出し、トマトの甘みが引き立つ）。^器に盛り、せん切りの大葉といりごまをのせる。|味の決め手は「塩昆布のうまみ」と「酢＋にんにく少々」。止まらなくなる居酒屋の一品。^冷蔵庫で10分なじませると、味が一体になる。
冷やしトマト|トマト:2個,大葉:3枚,玉ねぎ:1/8個|塩:少々,オリーブオイル:大さじ1,しょうゆ:小さじ1,酢:小さじ1,砂糖:ひとつまみ,マヨネーズ:適量|トマトは冷蔵庫でよく冷やす（氷水に10分つけると一気に冷える）。^へたを取って、皮を湯むきする（お尻に十字の切れ目を入れて熱湯に10秒、冷水にとってむく。口当たりがなめらかに）。くし形に切る。^玉ねぎドレッシング：玉ねぎをすりおろし、オリーブオイル・しょうゆ・酢・砂糖と混ぜる（玉ねぎドレッシングで、ひと手間上の冷やしトマトに）。^器にトマトを盛り、塩をふり（食べる直前に）、ドレッシングをかけて、せん切りの大葉をのせる。マヨネーズを添えても。|味の決め手は「湯むき」と「玉ねぎドレッシング」。^塩は食べる直前に。早くふると水が出る。
塩キャベツ|キャベツ:1/4個|ごま油:大さじ1.5,鶏がらスープの素:小さじ1,塩:少々,にんにく:1/2片,レモン汁:小さじ1,黒こしょう:少々,いりごま:小さじ1,のり:1/2枚|キャベツはひと口大にちぎり（包丁より断面がでこぼこで味がなじむ）、冷水に5分つけてパリッとさせ、水気をしっかり切る。^たれ：ごま油・鶏がらスープの素（少量のお湯で溶く）・塩・すりおろしにんにく・レモン汁・黒こしょうを混ぜる（レモン汁でさっぱり、後を引く）。^ポリ袋にキャベツとたれを入れて軽くもみ、5分なじませる。^器に盛り、いりごま・ちぎったのりをのせる。|味の決め手は「鶏がら＋にんにく＋レモン汁」。焼肉店の無限キャベツの味。^冷水でパリッとさせると、食感が格段によくなる。
ピーマンの焼きびたし|ピーマン:6個,かつお節:1パック|ごま油:大さじ1,だし:100ml,しょうゆ:大さじ1,みりん:大さじ1,砂糖:小さじ1/2,しょうが:少々|ピーマンは手でぎゅっと押しつぶして割る（種とへたもそのまま食べられる。断面がでこぼこで味がしみる）。^浸し地：だし・しょうゆ・みりん・砂糖をひと煮立ちさせ、すりおろししょうがを加えてバットに入れる。^フライパンにごま油を中火で熱し、ピーマンを入れて押さえながら3分、焼き色がつくまで焼く。返して2分焼く（焼き目の香ばしさが、ピーマンの苦みを甘みに変える）。^焼きたてのピーマンを浸し地に漬ける（熱いうちに漬けると味がしみる）。^15分以上おき、かつお節をかける。冷やしてもおいしい。|味の決め手は「丸ごとつぶして焼く」ことと「焼き目」。ピーマン嫌いでも食べられる甘さ。^作り置きにして、冷蔵庫で冷やすとさらにおいしい。
しいたけのバター醤油焼き|しいたけ:8個|塩:少々,バター:15g,しょうゆ:小さじ2,酒:小さじ1,にんにく:少々,黒こしょう:少々,小ねぎ:適量|しいたけは石づきを取り、軸は手で裂く。かさの裏に十字の切り込みを入れる（洗わずにペーパーで汚れを拭く。洗うと水っぽくなる）。^フライパンにバター10gを中火で熱し、しいたけをかさの裏を上にして並べ、2分焼く。^返して2分、かさにこんがり焼き色がつくまで焼く（しいたけから水分が出てきたら焼き上がりの合図）。^かさを上にして戻し、かさの裏のくぼみに、残りのバター・しょうゆ・酒・すりおろしにんにく少々を少しずつのせ、30秒焼く（くぼみにたまったうまみのスープが絶品）。^器に盛り、黒こしょう・小ねぎをふる。|味の決め手は「かさのくぼみにバターじょうゆ」。中にたまるうまみスープがごちそう。^しいたけは洗わない。香りが抜ける。
焼きなす|なす:4本,しょうが:1かけ,みょうが:1個,かつお節:1パック|だし:大さじ3,しょうゆ:大さじ1,みりん:小さじ1|なすはへたの周りにぐるりと浅く切り込みを入れ、がくを取る。縦に1本浅く切り込みを入れる（皮がむきやすい）。^魚焼きグリル（または焼き網、直火）で強火で12〜15分、途中で転がしながら、皮が真っ黒に焦げて全体がやわらかくなるまで焼く（皮はしっかり焦がしたほうが、焦げの香りが身に移り、むきやすい）。^熱いうちに冷水にさっとつけ（または手を水で冷やしながら）、へたの方から皮をむく（水に長くつけると水っぽくなるので手早く）。^へたを落として縦に裂き、器に盛る。^だししょうゆ：だし・しょうゆ・みりんをひと煮立ちさせて冷ます（だしで割ると、なすの甘みが引き立つ）。^おろししょうが・せん切りのみょうが・かつお節をのせ、だししょうゆをかける。冷やしても。|味の決め手は「皮を真っ黒に焦がす」ことと「だししょうゆ」。とろとろの焼きなす。^冷やすと夏の料亭の一品に。
ししとうのおかか炒め|ししとう:25本,かつお節:2パック,ちりめんじゃこ:15g|ごま油:大さじ1,しょうゆ:小さじ2,みりん:小さじ2,酒:小さじ1,砂糖:ひとつまみ,いりごま:小さじ1|ししとうは竹串で1か所穴をあける（加熱中の破裂を防ぐ）。^フライパンにごま油を中火で熱し、じゃこを1分、カリッとするまで炒める（じゃこのうまみと塩気で、ぐっとおいしく）。^ししとうを加えて3分、ところどころ焼き色がつくまで炒める（焼き目の香ばしさが大事）。^しょうゆ・みりん・酒・砂糖を加えて30秒、照りよく絡める。^火を止めてかつお節・いりごまを加えて混ぜる。|味の決め手は「じゃこ」と「焼き目」。^かつお節は火を止めてから加えると香りがいい。
厚揚げのねぎ味噌焼き|厚揚げ:2枚,長ねぎ:1/2本,大葉:2枚|味噌:大さじ1.5,白味噌:小さじ2,みりん:大さじ1,砂糖:小さじ2,酒:小さじ1,ごま油:小さじ1,七味唐辛子:少々|厚揚げは熱湯をかけて油抜きし、ペーパーで水気を拭いて4等分に切る。^長ねぎはみじん切りにし、ごま油で中火で1分炒めて甘みを出す（炒めると辛みが抜け、甘く香ばしいねぎ味噌に）。^味噌・白味噌・みりん・砂糖・酒・炒めた長ねぎ・刻んだ大葉を混ぜてねぎ味噌を作る。^フライパン（油なし）で厚揚げの全面を中火で各1分、こんがり焼き色をつける（表面をカリッとさせる）。^上面にねぎ味噌を塗り、トースター（1000W）で5〜6分、味噌にこんがり焼き色がつくまで焼く。^七味をふる。|味の決め手は「ねぎを炒めて甘みを出す」ことと「2種の味噌」。^厚揚げの表面を先に焼くと、カリッと香ばしい。
油揚げのピザ|油揚げ:2枚,ピーマン:1個,玉ねぎ:1/8個,ベーコン:1枚,ピザ用チーズ:50g|ケチャップ:大さじ1.5,マヨネーズ:小さじ2,オレガノ:少々,黒こしょう:少々,タバスコ:少々|油揚げはペーパーで挟んで押さえ、余分な油を取る（カリッと焼ける）。^ピーマンは薄い輪切り、玉ねぎは薄切り、ベーコンは細切り。^油揚げにケチャップを塗り、マヨネーズを細く絞り、オレガノをふる（オレガノで本格的なピザの香り）。^玉ねぎ・ベーコン・ピーマンをのせ、チーズをたっぷり散らす。^トースター（1000W）で5〜6分、チーズが溶けて油揚げの縁がカリッと色づくまで焼く。^4等分に切り、黒こしょう・タバスコを。|味の決め手は「油揚げの油を取ってカリッと焼く」ことと「オレガノ」。低糖質でも本格的なピザの味。^マヨネーズを少し絞ると、コクが出る。
ちくわきゅうり|ちくわ:5本,きゅうり:1本|マヨネーズ:大さじ2,七味唐辛子:少々,わさび:少々,しょうゆ:少々,かつお節:少々|きゅうりはちくわの長さに合わせて切り、ちくわの穴に合う太さの棒状に切る（4つ割りにして角を少し削ると入れやすい）。^ちくわの穴にきゅうりを差し込む。^斜め半分に切る（断面がきれい）。^ディップ2種：マヨネーズ＋七味、マヨネーズ＋わさび＋しょうゆ少々＋かつお節を作って添える（2種のディップで居酒屋の一品に）。|味の決め手は「2種のディップ」。^きゅうりは冷やしておくと、シャキッとおいしい。
卵黄の醤油漬け|卵:4個|しょうゆ:大さじ3,みりん:大さじ2,酒:大さじ1,昆布:1枚,かつお節:2g,ごま油:少々|卵は冷凍庫で一晩凍らせてから、冷蔵庫で半日かけて解凍する（冷凍すると黄身がねっとり濃厚なペースト状になる。そのままでも可）。^漬けだれ：小鍋にみりん・酒を入れて煮立て、しょうゆ・昆布・かつお節を加えてひと煮立ちさせ、こして冷ます（煮切りと昆布・かつおで、だしの効いた上品なたれに）。^卵黄だけを取り出し、小さめの容器に並べて、たれを静かに注ぐ（卵黄が完全に浸かる量）。^ラップをして冷蔵庫で半日〜1日漬ける（半日でとろり、1日でねっとり、2日で固め）。^ご飯にのせ、ごま油を数滴。おつまみにも。卵白はスープなどに。|味の決め手は「冷凍卵黄」と「だしの効いた漬けだれ」。ねっとり濃厚なごちそう卵黄。^漬け時間で食感が変わる。好みを見つけて。
煮卵|卵:6個|しょうゆ:100ml,みりん:80ml,酒:50ml,砂糖:大さじ1,水:100ml,昆布:1枚,かつお節:3g,しょうが:少々,オイスターソース:小さじ1|漬けだれ：小鍋にみりん・酒を入れて煮立て、しょうゆ・砂糖・水・昆布・かつお節・しょうがの薄切り・オイスターソースを加えてひと煮立ちさせ、こして冷ます（ラーメン屋の味玉のたれ。オイスターで深みが出る）。^卵は冷蔵庫から出したてを、沸騰した湯にお玉でそっと入れる。^中火で6分半ゆでる（とろとろの半熟。7分でしっかり半熟）。最初の1分は菜箸で転がすと黄身が中央に寄る。^すぐ氷水にとって5分冷やし、水の中で殻をむく（急冷すると殻がむきやすく、余熱で火が入らない）。^ポリ袋に卵とたれを入れ、空気を抜いて口を閉じ、冷蔵庫で一晩〜2日漬ける（ポリ袋なら少ないたれで全体が浸かる）。|味の決め手は「6分半ゆで」と「だし＋オイスターの漬けだれ」。ラーメン屋の味玉に。^漬けだれは2〜3回使い回せる。
温泉卵|卵:2個|だし:大さじ3,しょうゆ:小さじ2,みりん:小さじ2,小ねぎ:少々|卵は冷蔵庫から出して室温に30分おく。^鍋に1Lの湯を沸騰させて火を止め、水200mlを加える（約80℃になる）。^卵をそっと入れてふたをし、そのまま13分おく（白身はとろり、黄身はねっとりの温泉卵に）。^取り出して冷水に1分つける。^だしじょうゆ：だし・しょうゆ・みりんをひと煮立ちさせて冷ます（自家製のだしじょうゆで、旅館の温泉卵の味に）。^器に割り入れ、だしじょうゆをかけ、小ねぎを散らす。|味の決め手は「80℃で13分」と「自家製のだしじょうゆ」。^丼やうどん、カルボナーラにのせても。
鶏皮ポン酢|鶏皮:200g,小ねぎ:適量,大根:100g|塩:少々,酒:大さじ1,ポン酢しょうゆ:大さじ3,ゆず果汁:小さじ1,ごま油:小さじ1/2,一味唐辛子:少々|鶏皮は余分な脂を取り除き、5mm幅の細切りにする。^【カリカリ派】フライパン（油なし）に鶏皮を入れて中火にかけ、脂を出しながら8〜10分、カリカリになるまで炒める。出た脂は捨てる。ペーパーで油を切る。【ぷるぷる派】熱湯に酒を入れて鶏皮を5分ゆで、冷水にとって洗う。^大根はすりおろして水気を切る。^ポン酢にゆず果汁・ごま油を混ぜる。^鶏皮と大根おろしをポン酢で和え、器に盛る。^小ねぎをたっぷりのせ、一味をふる。|味の決め手は「カリカリかぷるぷるか、食感を選ぶ」ことと「ゆず果汁入りのポン酢」。^大根おろしを加えると、さっぱり。
牛すじ煮込み|牛すじ:500g,大根:1/3本,こんにゃく:1/2枚,長ねぎ:1本|しょうが:2かけ,水:1200ml,酒:150ml,砂糖:大さじ3,みりん:大さじ3,しょうゆ:大さじ3,味噌:大さじ2,赤味噌:大さじ1,七味唐辛子:少々|牛すじはたっぷりの水から強火で沸騰させ、10分ゆでてざるに上げ、流水で汚れと脂をしっかり洗う。これをもう一度繰り返す（2回ゆでこぼすのが、臭みのない上品な牛すじの秘訣）。^ひと口大に切り、鍋に水・酒・しょうがの薄切りと入れて強火にかける。沸騰したらアクを取り、弱火でふたをずらして1時間半煮る（圧力鍋なら加圧25分）。^大根は1.5cm厚のいちょう切りにして下ゆで10分、こんにゃくはちぎって下ゆで2分。^牛すじの鍋に大根・こんにゃく・砂糖・みりんを加えて弱めの中火で15分、しょうゆ・味噌・赤味噌を加えて20分煮込む（2種の味噌で、居酒屋の深いコクに）。^火を止めて一度冷ますと味がしみる。^食べる前に温め、小口切りの長ねぎをたっぷりのせ、七味を添えて。|味の決め手は「2回ゆでこぼす」ことと「2種の味噌」。^一晩おくと、牛すじのゼラチンでとろりとした煮汁に。
もつ煮込み|豚もつ:400g,大根:1/3本,にんじん:1/2本,ごぼう:1/2本,こんにゃく:1/2枚,長ねぎ:1本,木綿豆腐:1/2丁|しょうが:2かけ,にんにく:1片,水:1000ml,酒:100ml,味噌:大さじ3,赤味噌:大さじ1,砂糖:大さじ1.5,みりん:大さじ2,しょうゆ:小さじ2,ごま油:小さじ1,七味唐辛子:少々|もつはたっぷりの水から強火で沸騰させ、10分ゆでてざるに上げ、流水でもみ洗いする。これを2回繰り返す（臭みを完全に抜く）。^大根・にんじんはいちょう切り、ごぼうはささがき（水にさらす）、こんにゃくはちぎって下ゆで、豆腐は6等分、しょうがは薄切り。^鍋にごま油を中火で熱し、もつ・しょうが・にんにくを3分炒める（炒めると香ばしさが加わる）。^水・酒を加えて強火で煮立て、アクを取り、弱火で40分煮る。^大根・にんじん・ごぼう・こんにゃく・砂糖・みりんを加えて15分。味噌の2/3・赤味噌・しょうゆを加えて15分、豆腐を加えて5分煮込む。^仕上げに残りの味噌を溶き入れる（後入れの味噌で香りを立てる）。器に盛り、小口切りの長ねぎ・七味をたっぷり。|味の決め手は「2回ゆでこぼす」「ごぼう」「味噌を2回に分ける」。^群馬・永井食堂の名物のような、ご飯がすすむ味に。
たこわさ|ゆでだこ:150g,茎わさび:15g,大葉:3枚|わさび:小さじ1,しょうゆ:小さじ2,みりん:小さじ1,酒:小さじ1,だし:小さじ2,塩:ひとつまみ,砂糖:ひとつまみ|たこは薄くそぎ切りにして、さらに細切りにする。^茎わさび（あれば。シャキシャキ感とツンとした辛みが本格的）は細かく刻む。^漬けだれ：みりん・酒をレンジで20秒加熱してアルコールを飛ばし、しょうゆ・だし・塩・砂糖・わさびを溶く（だしを加えると、まろやかで居酒屋の味に）。^たこ・茎わさびを漬けだれで和え、冷蔵庫で30分なじませる（時間をおくと、たこにわさびの辛みとうまみがしみる）。^器に大葉を敷いて盛る。|味の決め手は「茎わさび」と「だし入りの漬けだれ」。^本わさびをすりおろすと、香りが格段に違う。
まぐろのユッケ|まぐろ:200g,卵黄:2個,小ねぎ:適量,きゅうり:1/2本,のり:適量|しょうゆ:大さじ1,コチュジャン:小さじ2,ごま油:小さじ2,砂糖:小さじ1,はちみつ:小さじ1/2,にんにく:少々,しょうが:少々,りんご:1/16個,いりごま:小さじ2|まぐろ（赤身の刺身用）は1cm角、または細切りにする。^たれ：しょうゆ・コチュジャン・ごま油・砂糖・はちみつ・すりおろしにんにく・しょうが・すりおろしりんご（本場韓国のユッケの甘みとフルーティーさ）・いりごまを混ぜる。^まぐろをたれで和え、冷蔵庫で5分なじませる。^きゅうりはせん切りにする。^器にきゅうりを敷いてまぐろを盛り、中央をくぼませて卵黄をのせる。小ねぎ・いりごま・刻みのりを散らす。^黄身を崩しながら食べる。|味の決め手は「すりおろしりんご入りのたれ」と「卵黄」。焼肉店のユッケの味。^ご飯にのせてユッケ丼にしても絶品。
サーモンのマリネ|サーモン:200g,紫玉ねぎ:1/2個,レモン:1/2個,ケッパー:大さじ1,ディル:少々,セロリ:1/4本|塩:小さじ1/2,砂糖:小さじ1/2,エクストラバージンオリーブオイル:大さじ3,白ワインビネガー:大さじ1.5,レモン汁:大さじ1,はちみつ:小さじ1,粒マスタード:小さじ1/2,塩:少々,黒こしょう:少々,ピンクペッパー:少々|サーモン（刺身用のさく）は塩・砂糖をすり込み、ラップで包んで冷蔵庫で30分おく（簡易グラブラックス。余分な水分が抜け、身がねっとりとしてうまみが凝縮する）。水気を拭き、5mm厚のそぎ切りにする。^紫玉ねぎは薄切りにして水に5分さらし、水気を絞る。セロリは薄切り。レモンは薄いいちょう切り。^マリネ液：オリーブオイル・白ワインビネガー・レモン汁・はちみつ・粒マスタード・塩・黒こしょうを混ぜる。^バットにサーモン・紫玉ねぎ・セロリ・レモン・ケッパーを並べ、マリネ液をかけてラップをし、冷蔵庫で30分以上漬ける。^器に盛り、ディルとピンクペッパーを散らす。|味の決め手は「塩と砂糖で下ごしらえ」と「ケッパー＋ディル」。北欧のレストランの味。^30分の下ごしらえで、刺身のサーモンがねっとりとしたごちそうに。
あさりの酒蒸し|あさり:400g,小ねぎ:適量,三つ葉:適量|ごま油:小さじ1,にんにく:1片,しょうが:少々,赤唐辛子:1/2本,酒:80ml,バター:15g,しょうゆ:小さじ1,黒こしょう:少々|あさりは3%の塩水で1時間砂抜きし、殻同士をこすり合わせて洗う。^フライパンにごま油・にんにくの薄切り・しょうがのせん切り・唐辛子を入れて弱火で1分、香りを出す（にんにくとしょうがで、居酒屋のやみつきの味に）。^あさりと酒を入れ、ふたをして中火にかける。^2〜3分、殻が開いたらすぐ火を止める（開いたらすぐ止めると身がふっくら）。^バター・しょうゆを加えて全体を混ぜる。^汁ごと器に盛り、小ねぎ・三つ葉を散らし、黒こしょうをふる。汁が絶品なので、パンやご飯、パスタに絡めても。|味の決め手は「にんにく＋しょうがの香り」と「バターしょうゆ」。^あさりの汁は捨てずに。うまみの塊。
クリームチーズのおかか醤油|クリームチーズ:150g,かつお節:2パック,のり:1/2枚,大葉:3枚|しょうゆ:小さじ2,みりん:小さじ1/2,わさび:少々,ごま油:少々,いりごま:少々|クリームチーズは冷えたまま1.5cm角に切る（包丁を温めるときれいに切れる）。^たれ：しょうゆ・みりん・わさび・ごま油を混ぜる（わさびでツンと、ごま油でコクを）。^クリームチーズにかつお節の半量をまぶし、たれをかけて5分なじませる。^器に大葉を敷いて盛り、残りのかつお節・ちぎったのり・いりごまをのせる。|味の決め手は「わさびじょうゆ」と「かつお節たっぷり」。チーズとしょうゆの意外な相性。^一晩漬けると、チーズにしょうゆがしみて、濃厚な味に。
じゃがいもの明太マヨ焼き|じゃがいも:3個,辛子明太子:1腹,ピザ用チーズ:40g,小ねぎ:適量|塩:少々,マヨネーズ:大さじ3,牛乳:小さじ1,バター:10g,しょうゆ:少々,のり:少々|じゃがいもは皮付きのまま洗い、ラップで包んでレンジ600Wで6〜7分、竹串がすっと通るまで加熱する。ひと口大に切る。^フライパンにバターを中火で溶かし、じゃがいもを3分、表面がカリッと焼き色がつくまで焼き、塩をふる（先に焼くと外カリッで香ばしい）。^明太マヨ：明太子は薄皮を除いてほぐし、マヨネーズ・牛乳・しょうゆ少々と混ぜる。^耐熱皿にじゃがいもを並べ、明太マヨをのせ、チーズを散らす。^トースターで5〜7分、こんがり焼き色がつくまで焼く。^刻みのりと小ねぎを散らす。|味の決め手は「じゃがいもを先にバターで焼く」こと。外カリッ、中ホク。^明太マヨにしょうゆを少し入れると、味が締まる。
かぼちゃサラダ|かぼちゃ:300g,玉ねぎ:1/8個,レーズン:20g,クリームチーズ:40g,くるみ:15g|塩:少々,マヨネーズ:大さじ2,はちみつ:小さじ1,レモン汁:小さじ1,シナモン:少々,黒こしょう:少々|かぼちゃは種とわたを取り、皮をところどころむいて3cm角に切る。耐熱容器でふんわりラップし、レンジ600Wで5〜6分、やわらかくなるまで加熱する。^熱いうちにフォークで粗くつぶし、塩少々をふる（熱いうちの下味）。^玉ねぎは薄切りにして水にさらし、水気を絞る。レーズンはぬるま湯につけてやわらかくする。くるみはからいりして刻む。クリームチーズは1cm角。^かぼちゃが冷めたら、マヨネーズ・はちみつ・レモン汁・シナモン（かぼちゃの甘みを引き立てる）を加えて混ぜる。^玉ねぎ・レーズン・くるみ・クリームチーズを加えてさっくり混ぜ、黒こしょうで調える。|味の決め手は「クリームチーズとくるみ」と「シナモン少々」。デリのようなかぼちゃサラダに。^レモン汁で、甘さが引き締まる。
ごぼうサラダ|ごぼう:1本,にんじん:1/3本,きゅうり:1/2本|酢:小さじ1,しょうゆ:小さじ2,砂糖:小さじ2,マヨネーズ:大さじ3,すりごま:大さじ3,練りごま:小さじ1,からし:少々,いりごま:小さじ1|ごぼうはたわしで洗い、5cm長さのせん切りにして水に3分さらす。にんじんもせん切り。きゅうりはせん切り。^熱湯に酢少々（分量外）を入れ、ごぼうを2分半、にんじんを加えて30秒ゆでる（酢でごぼうが白く、シャキッと）。^ざるに上げて水気をしっかり切り、熱いうちに酢・しょうゆ・砂糖をからめて下味をつける（熱いうちの下味が、マヨネーズだけでは出ない深い味に）。^冷めたら、マヨネーズ・すりごま・練りごま（ごまの風味が濃厚に。デリの味）・からしを混ぜたものとさっくり和える。^きゅうりを加えて混ぜ、いりごまをふる。冷蔵庫で冷やすと味がなじむ。|味の決め手は「熱いうちに下味」と「すりごま＋練りごま」。お惣菜屋さんのごぼうサラダの味。^からし少々で味が締まる。
春菊のサラダ|春菊:1束,ちりめんじゃこ:20g,くるみ:15g,のり:1/2枚|ごま油:大さじ1.5,にんにく:少々,しょうゆ:小さじ2,酢:小さじ2,砂糖:小さじ1/2,いりごま:小さじ1|春菊は葉を摘み、冷水に10分つけてシャキッとさせ、水気をよく切る（茎は硬いので炒め物などに）。くるみはからいりして刻む。^フライパンにごま油・すりおろしにんにく少々を入れて中火で熱し、じゃこを2分、カリカリになるまで炒める。^火を止めてしょうゆ・酢・砂糖を加え、ジュッと混ぜてドレッシングにする（熱々のじゃこドレッシングが、春菊のほろ苦さと抜群に合う）。^器に春菊を盛り、くるみ・ちぎったのりをのせる。^食べる直前に熱々のじゃこドレッシングをかけ、いりごまをふってすぐに混ぜて食べる。|味の決め手は「熱々のじゃこドレッシング」と「くるみ」。春菊のほろ苦さが、ごちそうサラダに。^生の春菊は、葉の部分だけ使うとやわらかい。
水菜とじゃこのサラダ|水菜:1束,ちりめんじゃこ:25g,のり:1/2枚,大根:100g,油揚げ:1枚|ごま油:大さじ1,ポン酢しょうゆ:大さじ2,しょうゆ:小さじ1,砂糖:小さじ1/2,わさび:少々,いりごま:小さじ1|水菜は5cm長さに切り、冷水に5分つけてパリッとさせ、水気をよく切る。大根はせん切りにして冷水にさらす。^油揚げはフライパン（油なし）で両面2分ずつ、カリカリに焼いて細切りにする（カリカリ油揚げが香ばしいアクセント）。^フライパンにごま油を中火で熱し、じゃこを2分、カリカリになるまで炒める。^ドレッシング：ポン酢・しょうゆ・砂糖・わさびを混ぜる（わさびで、和風サラダがぐっと締まる）。^器に水菜・大根を盛り、カリカリ油揚げ・ちぎったのりをのせ、熱々のじゃこをごま油ごとかける。^ドレッシングをかけ、いりごまをふる。|味の決め手は「カリカリのじゃこと油揚げ」と「わさびポン酢」。^熱々のじゃこを油ごとかけると、香ばしさが立つ。
ほうれん草のナムル|ほうれん草:1束|ごま油:大さじ1,塩:小さじ1/4,鶏がらスープの素:小さじ1/2,しょうゆ:小さじ1/2,砂糖:ひとつまみ,にんにく:少々,いりごま:小さじ2,のり:1/2枚|ほうれん草は根元を洗い、塩ゆでで根元から20秒、全体で計40秒ゆでる。冷水にとって色止めする。^水気をしっかり絞り、4cm長さに切ってもう一度絞る（水気が残ると味がぼやける）。^ごま油・塩・鶏がらスープの素・しょうゆ・砂糖・すりおろしにんにくを加え、手でもみ込むように和える（韓国流。手で和えると味がよくなじむ）。^いりごまを指でひねりながら加え、ちぎった韓国のりを混ぜる（のりで、うまみと香ばしさがアップ）。|味の決め手は「手でもみ込む」ことと「のり」。焼肉店のナムルの味。^砂糖ひとつまみで、味に丸みが出る。
ブロッコリーのおかかマヨ|ブロッコリー:1株,かつお節:2パック|マヨネーズ:大さじ2,しょうゆ:小さじ1,みりん:小さじ1/2,わさび:少々,ごま油:少々,いりごま:少々|ブロッコリーは小房に分け、茎は皮をむいて薄切りにする（茎も甘くておいしい）。^沸騰した湯に塩少々（湯の1%）を入れ、ブロッコリーを1分半ゆでる（少し歯ごたえを残す）。^ざるに上げて水にとらずに広げて冷ます（水にとると水っぽくなり、味がぼやける）。^マヨネーズ・しょうゆ・みりん・わさび（隠し味のツンとした香り）・ごま油・かつお節1パックを混ぜ、ブロッコリーを和える。^器に盛り、残りのかつお節といりごまをのせる。|味の決め手は「水にとらずに冷ます」ことと「わさび少々」。^かつお節は、和えるときと上にかけるときの二段使いで。
にんじんのたらこ炒め|にんじん:1本,たらこ:1腹,しらたき:1/2袋|ごま油:小さじ2,酒:大さじ1,みりん:小さじ1,しょうゆ:少々,バター:5g,小ねぎ:適量|にんじんは4cm長さのせん切り。しらたき（あれば。ボリュームが出る）は2分下ゆでして食べやすく切る。^たらこは薄皮を除いてほぐし、酒・みりんと混ぜる（ほぐしやすくなり、全体にまんべんなく絡む）。^フライパンにごま油を中火で熱し、しらたきを2分、水分を飛ばすように炒める。にんじんを加えて3分、しんなりして甘みが出るまで炒める。^たらこを加えて1分、たらこの色が白っぽく変わってパラパラになるまで炒める。^しょうゆ・バターを加えて香りをつける。小ねぎを散らす。|味の決め手は「にんじんをじっくり炒めて甘みを出す」ことと「仕上げのバター」。^しらたきを加えると、低カロリーでボリュームアップ。
きのこのマリネ|しめじ:1パック,エリンギ:2本,マッシュルーム:8個,まいたけ:1パック|オリーブオイル:大さじ3,にんにく:2片,赤唐辛子:1本,白ワイン:大さじ2,白ワインビネガー:大さじ2,レモン汁:大さじ1,はちみつ:小さじ1,粒マスタード:小さじ1,しょうゆ:小さじ1,塩:小さじ1/3,黒こしょう:少々,パセリ:少々|しめじ・まいたけはほぐし、エリンギは縦に裂いて長さを半分に、マッシュルームは半分に切る。にんにくはつぶし、唐辛子は種を取る。^マリネ液：白ワインビネガー（または酢）・レモン汁・はちみつ・粒マスタード・しょうゆ（隠し味のうまみ）・塩・黒こしょうを混ぜる。^フライパンにオリーブオイル大さじ1・にんにく・唐辛子を入れて弱火で2分、中火にしてきのこを広げ、3分あまり触らずに焼き付ける。返して2分（焼き付けると香ばしく、うまみが凝縮する）。^白ワインを加えて30秒、アルコールを飛ばす。^熱いうちにマリネ液と残りのオリーブオイルに漬ける（熱いうちに漬けると、味がしみる）。^冷蔵庫で1時間以上なじませる。パセリを散らす。4〜5日保存可能。|味の決め手は「きのこを焼き付ける」ことと「4種のきのこ」のうまみの相乗効果。^しょうゆ少々で、うまみがぐっと深まる。
白菜の浅漬け|白菜:1/4個,にんじん:1/4本|塩(塩もみ用):小さじ2,砂糖:小さじ1,昆布:1枚,赤唐辛子:1本,ゆずの皮:少々,和風だしの素:小さじ1/4,酢:小さじ1|白菜は芯をそぎ切り、葉はざく切りにする。にんじんはせん切り。昆布はキッチンばさみで細く切る、唐辛子は輪切り、ゆずの皮はせん切り。^ポリ袋に白菜・にんじんと塩・砂糖（砂糖少々でうまみと丸みが出る）を入れてもみ、白菜がしんなりするまで2分。^昆布・唐辛子・ゆずの皮・和風だしの素・酢を加え、空気を抜いて口を閉じる。^重し（水を入れたペットボトルなど）をのせて冷蔵庫で2時間以上漬ける（重しで水が上がり、早く漬かる）。^水気を絞って器に盛る。しょうゆをたらしても。|味の決め手は「昆布＋ゆず」と「砂糖少々」。料亭の香の物のような浅漬けに。^重しをすると、パリッとした食感に仕上がる。
大根の甘酢漬け|大根:400g,ゆずの皮:少々|塩:小さじ1,酢:大さじ5,砂糖:大さじ3.5,昆布:1枚,赤唐辛子:1本,薄口しょうゆ:小さじ1/2|大根は皮をむいて5mm厚のいちょう切り（または拍子木切り）にする。^塩をまぶして15分おき、しんなりしたら水気をしっかり絞る（絞るほど味がしみる）。^甘酢：酢・砂糖・薄口しょうゆ（隠し味のうまみ）を混ぜて砂糖を溶かす。^保存容器に大根・細切りの昆布・唐辛子の輪切り・ゆずの皮のせん切りと甘酢を入れ、冷蔵庫で半日以上漬ける（昆布のうまみと、ゆずの香りで上品に）。^1〜2週間保存できる。|味の決め手は「昆布」と「ゆずの皮」。料亭のような上品な甘酢漬けに。^大根をしっかり絞ると、ポリポリの食感に。
納豆キムチ|納豆:2パック,白菜キムチ:80g,小ねぎ:適量,卵黄:1個,のり:適量|ごま油:小さじ1,しょうゆ:小さじ1/2,砂糖:ひとつまみ,いりごま:少々|納豆はよく混ぜて粘りを出し、付属のたれを加える。^キムチは粗く刻み、ごま油・砂糖（キムチの酸味をまろやかに）で和える。^納豆とキムチ・しょうゆを混ぜる。^器に盛り、中央に卵黄をのせ、小ねぎ・いりごま・刻みのりを散らす（卵黄で辛さがまろやかに）。^ご飯にのせたり、のりで巻いたり、冷奴にかけても。|味の決め手は「キムチにごま油と砂糖」と「卵黄」。^のりで巻いて食べると、韓国の居酒屋の味。
チーズ春巻き|春巻きの皮:6枚,スライスチーズ:6枚,大葉:6枚,ハム:3枚,明太子:1/2腹|薄力粉:大さじ1,水:大さじ1,揚げ油:適量,黒こしょう:少々|ハムは半分に切る。明太子（あれば）は薄皮を除いてほぐす。^春巻きの皮の手前に大葉を敷き、スライスチーズを2つ折りにしてのせ、ハム（または明太子）をのせる（大葉の香り＋チーズ＋ハムは鉄板の組み合わせ）。^手前からひと巻きし、左右を折り込んできつめに巻き、巻き終わりに水溶き薄力粉を塗ってしっかり留める（しっかり閉じないとチーズが流れ出る）。^揚げ油を170℃に熱し、2分、返しながらきつね色になるまで揚げる（チーズは溶ければOKなので短時間で）。^油を切り、斜め半分に切る。黒こしょうをふる。|味の決め手は「大葉＋チーズ＋ハム（明太子）」の組み合わせ。^揚げ時間は短く。皮がパリッとすればOK。
餃子の皮ピザ|餃子の皮:12枚,ウインナー:2本,ピーマン:1/2個,玉ねぎ:1/8個,ミニトマト:3個,ピザ用チーズ:50g|ケチャップ:大さじ2,オレガノ:少々,にんにく:少々,オリーブオイル:小さじ1,マヨネーズ:小さじ1,タバスコ:少々|ウインナーは薄い輪切り、ピーマンは薄い輪切り、玉ねぎは薄切り、ミニトマトは薄い輪切り。^ソース：ケチャップ・オレガノ・すりおろしにんにく少々を混ぜる（オレガノとにんにくで、本格的なピザの香り）。^天板にアルミホイルを敷いてオリーブオイルを薄く塗り、餃子の皮を並べる。^ソースを薄く塗り、マヨネーズを少し絞り、具とチーズをのせる。^トースターで3〜4分、チーズが溶けて皮の縁がパリッと色づくまで焼く（焦げやすいので様子を見ながら）。^タバスコをかけて。|味の決め手は「オレガノ＋にんにくのソース」。パリパリのクリスピーピザに。^皮の縁がパリッとするまで焼くのがポイント。
ささみの梅しそ巻き|ささみ:5本,大葉:10枚,スライスチーズ:2枚|塩:少々,梅干し:3個,みりん:小さじ1,かつお節:少々,薄力粉:少々,酒:大さじ1,サラダ油:小さじ2,しょうゆ:小さじ1|ささみは筋を取り、縦に切り込みを入れて観音開きにし、ラップをかぶせてめん棒で薄くのばす。塩を軽くふる。^梅干しは種を除いて叩き、みりん（梅の酸味がまろやかに）・かつお節を混ぜてペーストにする。^ささみに梅肉を塗り、大葉を2枚、半分に切ったチーズ（コクがプラスされる）をのせて手前からくるくる巻き、つまようじで留める。薄力粉を薄くまぶす（しっとり、焼き色がきれいに）。^フライパンにサラダ油を中火で熱し、ささみの巻き終わりを下にして入れ、転がしながら2分焼く。^酒をふってふたをし、弱火で4〜5分蒸し焼きにする（ふっくらしっとり）。最後にしょうゆを回して香りをつける。^つまようじを抜き、斜め半分に切る。|味の決め手は「梅にみりんとかつお節」と「チーズ」。ささみがしっとり、ごちそうに。^蒸し焼きにすると、パサつかない。

きしめん|きしめん:2玉,油揚げ:1枚,かまぼこ:4切れ,小松菜:1/4束,かつお節:1パック|水:750ml,かつお節:20g,昆布:1枚,たまりしょうゆ:小さじ2,薄口しょうゆ:大さじ1.5,みりん:大さじ2,砂糖:小さじ1,塩:少々,しょうゆ:小さじ1,砂糖:小さじ1,みりん:小さじ1|だし：水に昆布を30分浸し、弱火で10分。かつお節20gを加えて3分煮出してこす（かつお節をたっぷり使った濃いだしが、名古屋きしめんの味）。^つゆ：だしにたまりしょうゆ・薄口しょうゆ・みりん・砂糖・塩を加えて温める。^油揚げは油抜きして短冊に切り、しょうゆ・砂糖・みりん・水大さじ2で2分煮て甘辛く煮る（甘い油揚げがつゆにうまみを足す）。小松菜は3分ゆでて4cm長さ。^きしめんは表示時間通りゆでて湯を切る。^丼に麺を入れ、熱いつゆを注ぎ、油揚げ・かまぼこ・小松菜をのせる。^たっぷりの花かつおを、食べる直前にのせる（かつお節が踊る香りもごちそう）。|味の決め手は「かつお節たっぷりのだし」と「たまりしょうゆ」。^花かつおは食べる直前に、たっぷりと。
ジンギスカン|ラム肉:300g,もやし:1袋,玉ねぎ:1個,ピーマン:2個,キャベツ:1/4個,かぼちゃ:100g|しょうゆ:大さじ4,砂糖:大さじ1.5,みりん:大さじ1,酒:大さじ1,りんご:1/4個,玉ねぎ:1/4個,にんにく:2片,しょうが:1かけ,ごま油:小さじ1,一味唐辛子:少々,牛脂:1個,レモン:1/4個|たれ：りんご・玉ねぎ1/4個・にんにく・しょうがをすりおろし、しょうゆ・砂糖・みりん・酒・ごま油・一味と混ぜる（すりおろしりんごと玉ねぎで、北海道の老舗のフルーティーなたれ）。^ラム肉（ロール肉ならそのまま、肩ロースはひと口大）をたれの半量に30分漬ける（たれの酵素でやわらか、ラム特有のくせも和らぐ）。^玉ねぎは1cm幅のくし形、ピーマンは乱切り、キャベツはざく切り、かぼちゃは5mm厚に切る。^ジンギスカン鍋（またはホットプレート、フライパン）に牛脂（またはラードや羊脂）を塗り、強めの中火で熱する。周りに野菜を敷き、中央で肉を焼く（肉汁が野菜に流れて、野菜がおいしくなる）。^肉は色が変わったら食べごろ（焼きすぎると固くなる）。^残りのたれにつけて食べる。レモンを絞っても。|味の決め手は「りんごと玉ねぎのすりおろしだれ」。^肉汁を吸った野菜が、ジンギスカンの一番おいしいところ。
スープカレー|骨付き鶏もも肉:2本,玉ねぎ:1個,じゃがいも:1個,にんじん:1/2本,なす:1本,かぼちゃ:100g,ピーマン:1個,ゆで卵:2個,ご飯:300g|塩:小さじ1/3,黒こしょう:少々,カレー粉:小さじ1,サラダ油:大さじ2,バター:15g,にんにく:2片,しょうが:1かけ,クミン:小さじ1,カレー粉:大さじ2,ガラムマサラ:小さじ1,トマト缶:1/2缶,水:900ml,鶏がらスープの素:小さじ2,和風だしの素:小さじ1,かつお節:5g,ナンプラー:小さじ1,しょうゆ:小さじ2,オイスターソース:小さじ1,砂糖:小さじ1,塩:少々|鶏肉は骨に沿って切り込みを入れ、塩・黒こしょう・カレー粉小さじ1をすり込んで15分おく。^鍋にサラダ油・バター・クミン（ホールなら）を入れて弱火で1分。薄切りの玉ねぎを中火で15分、濃いあめ色になるまで炒める（ここがスープの深い甘みとコク）。にんにく・しょうがのすりおろしを加えて1分。^カレー粉・ガラムマサラを加えて1分炒め、トマト缶を加えて3分煮詰める。^別のフライパンで鶏肉を皮目からこんがり焼き、鍋に移す。水・鶏がらスープの素・和風だしの素・お茶パックに入れたかつお節（和風だしのうまみが札幌スープカレーの隠し味）を加え、弱火で30分煮込む。ナンプラー・しょうゆ・オイスターソース・砂糖・塩で調える。^野菜：じゃがいも・にんじんはレンジで火を通し、なす・かぼちゃ・ピーマン・じゃがいも・にんじんを多めの油で素揚げ（または焼き）にして焼き色をつける（素揚げ野菜の香ばしさが札幌流）。^器にスープと鶏肉を盛り、野菜とゆで卵をのせる。ご飯は別皿で、スプーンですくってスープに浸して。|味の決め手は「濃いあめ色玉ねぎ」と「かつお節＋ナンプラーのうまみ」。札幌の人気店の深い味。^野菜は素揚げで香ばしく。
ザンギ|鶏もも肉:2枚,卵:1/2個,レモン:1/4個|しょうゆ:大さじ2,酒:大さじ1,オイスターソース:小さじ2,砂糖:小さじ1,鶏がらスープの素:小さじ1/2,ごま油:小さじ1,にんにく:2片,しょうが:1かけ,黒こしょう:少々,片栗粉:大さじ4,薄力粉:大さじ2,揚げ油:適量,酢:大さじ2,しょうゆ:大さじ1,砂糖:小さじ2|鶏肉は大きめの4cm角に切る（ザンギは唐揚げより大きめ。ジューシー）。^しょうゆ・酒・オイスターソース・砂糖・鶏がらスープの素・ごま油・すりおろしにんにく・しょうが・黒こしょうをもみ込み、30分〜一晩漬ける（唐揚げより濃いめの下味が北海道のザンギの特徴）。^溶き卵を加えてもみ込み（卵で衣がふんわり、肉がやわらか）、片栗粉と薄力粉を混ぜたものをまぶす。^揚げ油を170℃に熱し、3分半揚げて取り出し、4分休ませる。^180℃に上げて1分、カリッと二度揚げする。^ザンギだれ：酢・しょうゆ・砂糖を混ぜる。たれにつけたり、レモンを絞って。|味の決め手は「濃いめの下味」と「ザンギだれ（甘酢じょうゆ）」。北海道の本場の味。^大きめに切って、二度揚げでジューシーに。
きりたんぽ鍋|きりたんぽ:4本,鶏もも肉:250g,ごぼう:1/2本,まいたけ:1パック,長ねぎ:1本,せり:1/2束,しらたき:1/2袋|水:1000ml,昆布:1枚,かつお節:10g,しょうゆ:大さじ3,みりん:大さじ2,酒:大さじ2,砂糖:小さじ1,塩:小さじ1/3|スープ：水に昆布を30分浸し、鶏肉（骨付きならなおよい）を入れて中火で煮立て、アクを取って弱火で15分煮る（鶏から出るだしが、比内地鶏のきりたんぽ鍋の命）。かつお節を加えて2分で引き上げる。^ごぼうはささがきにして水にさらす（ささがきごぼうの香りが、きりたんぽ鍋の決め手）。まいたけはほぐし、長ねぎは斜め切り、しらたきは下ゆでして切る。せり（なければ春菊）は5cm長さ。^スープにしょうゆ・みりん・酒・砂糖・塩を加え、ごぼう・しらたきを入れて5分煮る。^まいたけ・長ねぎを加えて3分。^きりたんぽを斜め半分に切って加え、2〜3分煮る（煮すぎると崩れる。スープを吸ってやわらかくなったら食べごろ）。^最後にせりをのせ、さっと火を通す。|味の決め手は「鶏だし」と「ごぼう・まいたけ・せり」の香り。秋田の本場の味。^せりは根まで入れると香りがいい。
いも煮|里芋:8個,牛こま切れ肉:250g,こんにゃく:1枚,長ねぎ:1本,まいたけ:1/2パック|水:1000ml,昆布:1枚,しょうゆ:大さじ4,砂糖:大さじ2.5,酒:大さじ3,みりん:大さじ1|里芋は皮をむき、大きければ半分に切る。塩（分量外）でもんでぬめりを洗い流す（煮汁が濁らず、味がしみやすい）。^こんにゃくはスプーンでちぎって下ゆでする（ちぎると断面がでこぼこで味がしみる）。長ねぎは斜め切り、まいたけはほぐす。^鍋に水・昆布・里芋・こんにゃくを入れて中火にかけ、煮立ったら昆布を取り、弱火で15分、里芋に竹串がすっと通るまで煮る。^砂糖・酒・しょうゆの半量を加えて5分。^牛肉をほぐしながら加え、アクを取って5分（牛肉を後から入れると、固くならず、うまみたっぷり）。残りのしょうゆ・みりん・まいたけを加えて3分。^長ねぎを加えてさっと煮て、ねぎがしんなりしたら完成。七味をふっても。|味の決め手は「牛肉は後入れ」と「しょうゆは2回に分けて」。山形の芋煮会の本場の味。^翌日はカレーうどんにするのが山形流。
せんべい汁|南部せんべい:2枚,鶏もも肉:150g,ごぼう:1/3本,にんじん:1/3本,しいたけ:2個,長ねぎ:1/2本,キャベツ:2枚,しめじ:1/2パック|水:900ml,昆布:1枚,かつお節:10g,しょうゆ:大さじ3,みりん:大さじ1,酒:大さじ1,塩:少々|だし：水に昆布を30分浸し、弱火で10分。かつお節を加えて2分煮出してこす。^鶏肉はひと口大、ごぼうはささがき（水にさらす）、にんじんは短冊、しいたけは薄切り、キャベツはざく切り、しめじはほぐし、長ねぎは斜め切り。^だしに鶏肉・ごぼう・にんじんを入れて煮立て、アクを取って中火で8分（鶏とごぼうから、深いうまみが出る）。^しいたけ・しめじ・キャベツ・しょうゆ・みりん・酒・塩を加えて5分。^南部せんべい（汁用）を手で割って加え、2〜3分煮る（煮すぎず、もちもち＋少し歯ごたえが残るくらいがおいしい）。^長ねぎを加えてさっと煮る。|味の決め手は「鶏とごぼうのだし」と「せんべいのもちもち食感」。青森・八戸の郷土の味。^せんべいは煮すぎないのがポイント。
牛タン焼き|牛タン:250g,長ねぎ:1/2本,レモン:1/4個,キャベツ:2枚|塩:小さじ1/2,黒こしょう:少々,にんにく:少々,ごま油:大さじ1,サラダ油:小さじ1,鶏がらスープの素:小さじ1/2,塩:少々,レモン汁:小さじ1,南蛮みそ:適量|牛タン（厚切りなら、表面に細かく格子状の切り込みを入れる。やわらかく、味がなじむ）に塩・黒こしょう・すりおろしにんにく少々をまぶし、冷蔵庫で30分おく（仙台の名店は塩で熟成させる）。焼く10分前に室温に戻す。^ねぎ塩だれ：長ねぎはみじん切りにし、ごま油・鶏がらスープの素・塩・レモン汁と混ぜる。^フライパン（できれば網焼き・鉄）を強火でしっかり熱し、サラダ油を薄くひく。^牛タンを並べ、片面1分、焼き色がついたら返して30秒〜1分（焼きすぎると固くなる）。^器にせん切りキャベツと盛り、ねぎ塩だれをのせ、レモンを添える。南蛮みそ（青唐辛子の味噌漬け）があれば本場仙台風。|味の決め手は「塩で寝かせる」ことと「強火で短時間」。仙台の名店の味。^厚切りは格子状の切り込みで、さくっとやわらか。
はらこ飯|米:2合,生鮭:2切れ,いくら:100g,三つ葉:適量|水:200ml,昆布:1枚,しょうゆ:大さじ3,みりん:大さじ2,酒:大さじ3,砂糖:大さじ1,塩:少々,しょうが:1かけ|米は洗って30分浸水し、ざるに上げる。^鮭は皮と骨を取ってひと口大に切り、塩少々をふって10分おき、水気を拭く。^煮汁：鍋に水・昆布・しょうゆ・みりん・酒・砂糖・せん切りしょうがを入れて煮立て、鮭を入れて弱めの中火で4分煮る（鮭を煮た汁でご飯を炊くのが、宮城・亘理の本場のはらこ飯）。鮭を取り出す。^煮汁を冷まし、水（分量外）を足して2合の目盛りまで入れる。米を加えて炊く。^炊きあがったら10分蒸らし、さっくり混ぜて器に盛る。^鮭をのせ、いくらをたっぷり散らし、三つ葉を添える（鮭の煮汁にいくらを10秒くぐらせると、本場の味。ただし白くならないように一瞬で）。|味の決め手は「鮭を煮た汁でご飯を炊く」こと。^いくらは煮汁に一瞬くぐらせると、本場の味に。

もんじゃ焼き|キャベツ:1/4個,たらこ:1腹,もち:1個,ピザ用チーズ:40g,天かす:大さじ4,桜えび:大さじ2,ベビースターラーメン:20g|薄力粉:25g,水:350ml,和風だしの素:小さじ1,ウスターソース:大さじ2,中濃ソース:大さじ1,しょうゆ:小さじ1,サラダ油:小さじ2,青のり:少々|生地：薄力粉・和風だしの素・ウスターソース・中濃ソース・しょうゆを混ぜ、水を少しずつ加えてのばす（ウスターソースがもんじゃの本場の味の決め手）。^キャベツは細かいみじん切り（粗いと土手が作れない）。たらこはほぐし、もちは小さい角切り。^ホットプレート（または鉄板）を強めに熱して油をひき、キャベツ・天かす・桜えびを具だけ先に炒める。^キャベツがしんなりしたら、ヘラで刻みながらドーナツ状の土手を作る。^中央に生地の半量を流し入れ、ふつふつしてとろみがついたら残りを流し、たらこ・もち・チーズ・ベビースターを加えて、全体を刻みながら混ぜ合わせる。^薄く広げ、青のりをふり、小さいヘラで鉄板に押し付けて、焦げたところをこそげて食べる（おこげが一番おいしい）。|味の決め手は「ウスターソース」と「桜えび・ベビースター」のうまみ。月島の本場の味。^鉄板に押し付けたおこげが一番おいしい。

タレカツ丼|豚ヒレ肉:300g,ご飯:360g,卵:1個|塩:少々,黒こしょう:少々,薄力粉:大さじ2,水:大さじ2,パン粉(細目):40g,揚げ油:適量,しょうゆ:大さじ3,みりん:大さじ3,砂糖:大さじ2,酒:大さじ1,水:大さじ2,かつお節:2g|豚ヒレ肉は1cm厚に切って、軽く叩いて薄くのばし、塩・黒こしょうをふる（新潟のタレカツは薄いカツ）。^たれ：小鍋にしょうゆ・みりん・砂糖・酒・水・かつお節を入れて弱火で3分煮詰めてこす（かつおの効いた甘辛だれが、新潟の老舗の味）。^溶き卵に薄力粉・水を混ぜたバッター液にくぐらせ、細かいパン粉をつける（細かいパン粉で、たれがよくしみる薄い衣に）。^揚げ油を170℃に熱し、1分半〜2分揚げる。^揚げたてのカツを、熱いたれにくぐらせる（揚げたてをたれにジュッと浸すのが新潟流）。^丼のご飯にたれを少しかけ、カツを並べる（卵とじにせず、カツとご飯だけがタレカツ丼の流儀）。|味の決め手は「揚げたてを甘辛だれにくぐらせる」こと。新潟の名物の味。^薄いカツを細かいパン粉で。たれがしみて最高。
富山ブラック|中華麺:2玉,焼き豚:6枚,長ねぎ:1本,メンマ:60g|水:600ml,鶏がらスープの素:小さじ2,かつお節:5g,煮干し:5g,たまりしょうゆ:大さじ2,しょうゆ:大さじ2,オイスターソース:小さじ2,みりん:小さじ1,焼き豚のたれ:大さじ1,ラード:大さじ1,黒こしょう:小さじ1.5|スープ：鍋に水・煮干しを入れて弱火で10分煮出し、かつお節を加えて2分でこす。鶏がらスープの素を加える（魚介と鶏のスープ）。^たれ：たまりしょうゆ・しょうゆ・オイスターソース・みりん・焼き豚のたれ（あれば）を混ぜる（濃い醤油だれが真っ黒なスープの正体。塩気強めが本場流）。^長ねぎは斜め切りにして、たっぷり用意する。焼き豚は厚めに切る。^温めた丼にたれとラードを入れ、熱いスープを注ぐ。^太めの中華麺をゆでて丼に入れ、焼き豚・メンマ・長ねぎをたっぷりのせる。^粗びき黒こしょうを、驚くほどたっぷりふる（これがブラックの名の由来の一つ）。よく混ぜて食べる。ご飯と一緒に。|味の決め手は「濃いたまりしょうゆだれ」と「黒こしょうたっぷり」。^元々はご飯のおかずとして生まれたラーメン。ご飯と一緒に。
治部煮|鶏もも肉:1枚,しいたけ:4個,ほうれん草:1/2束,すだれ麩:4枚,にんじん:1/3本|塩:少々,片栗粉:大さじ2,だし:350ml,薄口しょうゆ:大さじ1,しょうゆ:大さじ1,みりん:大さじ2.5,砂糖:大さじ1,酒:大さじ2,わさび:少々|鶏肉は大きめのそぎ切りにし、薄く塩をふって片栗粉をしっかりまぶす（片栗粉が煮汁にとろみをつけ、肉はつるんとやわらか。治部煮の名前の由来）。^すだれ麩（または車麩）は水でもどして絞り、ひと口大に切る。しいたけは飾り切り、にんじんは梅型に（あれば）。ほうれん草は塩ゆでして4cm長さ。^鍋にだし・薄口しょうゆ・しょうゆ・みりん・砂糖・酒を入れて煮立て、にんじん・しいたけを入れて5分、麩を入れて3分煮る（麩にだしをたっぷり吸わせる）。^鶏肉を1枚ずつ入れ、弱めの中火で4分、片栗粉が透き通るまで煮る（とろみがつく）。^椀に鶏肉・麩・しいたけ・にんじん・ほうれん草を盛り、とろりとした煮汁をかける。^わさびを添える（わさびが金沢の治部煮の定番）。|味の決め手は「片栗粉をまぶした鶏肉」でつるんととろとろに。金沢の郷土料理。^わさびを溶かしながら食べると、甘めの煮汁が引き締まる。
ソースカツ丼|豚ロース肉:2枚,ご飯:360g,卵:1個,キャベツ:3枚|塩:少々,黒こしょう:少々,薄力粉:大さじ2,パン粉(細目):40g,揚げ油:適量,ウスターソース:大さじ3,中濃ソース:大さじ2,ケチャップ:小さじ2,砂糖:大さじ1,みりん:大さじ1,だし:大さじ2,はちみつ:小さじ1|豚肉は筋切りして軽く叩き、塩・黒こしょうをふる。^ソース：小鍋にウスターソース・中濃ソース・ケチャップ・砂糖・みりん・だし・はちみつを入れて弱火で2分煮詰める（ウスターと中濃の2種のソースを煮詰めると、福井・ヨーロッパ軒のような深いソースに）。^豚肉に薄力粉→溶き卵→細かいパン粉をつけ、170℃で4分、返しながら揚げる。^揚げたてのカツを熱いソースにくぐらせる（衣にソースをじゅわっとしみこませる）。^キャベツはせん切りにする。^丼のご飯にソースを少しかけ、キャベツを敷いてカツをのせる。|味の決め手は「2種のソースを煮詰める」ことと「揚げたてをくぐらせる」こと。^細かいパン粉で、ソースがよくしみる。
串カツ|豚ロース肉:150g,むきえび:6尾,玉ねぎ:1/2個,れんこん:100g,うずら卵:6個,しいたけ:3個,卵:1個,キャベツ:1/4個|塩:少々,黒こしょう:少々,薄力粉:60g,山芋:30g,水:80ml,パン粉(細目):60g,揚げ油:適量,ウスターソース:大さじ4,中濃ソース:大さじ2,だし:大さじ3,しょうゆ:小さじ1,みりん:小さじ1|具：豚肉はひと口大、えびは背わたを取る、玉ねぎはくし形、れんこんは1cm厚の輪切り、しいたけは軸を取る。それぞれ竹串に刺し、塩・黒こしょうをふる。^バッター液：薄力粉・溶き卵・すりおろした山芋・水を混ぜる（山芋入りで、衣がふわっと軽く、新世界の名店のような薄衣に）。^パン粉は細かく砕く（細かいほど軽く、油っぽくない）。^具をバッター液にくぐらせ、パン粉をまぶす。^揚げ油を180℃に熱し、1分半〜2分揚げる（具によって時間を調整。えびは1分）。^二度づけ禁止ソース：ウスターソース・中濃ソース・だし・しょうゆ・みりんを混ぜ、ひと煮立ちさせて冷ます（だしでさらっと。大阪の本場のソース）。^せん切りではなく、ざく切りのキャベツを添える（キャベツでソースをすくうのが大阪流）。|味の決め手は「山芋入りの衣」と「だし入りのさらさらソース」。大阪・新世界の味。^ソースの二度づけは禁止。キャベツですくって。
肉吸い|牛こま切れ肉:150g,絹ごし豆腐:1/2丁,卵:2個,小ねぎ:適量,ご飯:300g|水:700ml,昆布:1枚,かつお節:20g,さば節:5g,薄口しょうゆ:大さじ2,みりん:大さじ1,砂糖:小さじ1,酒:大さじ1,塩:少々,七味唐辛子:少々|だし：水に昆布を30分浸し、弱火で10分。かつお節・さば節（あれば。大阪のうどん店のだしの深み）を加えて3分煮出してこす。^だしに薄口しょうゆ・みりん・砂糖・酒・塩を加えて煮立てる。^牛肉を1枚ずつ広げながら入れ、アクを取る（牛肉のうまみがだしに溶け出す。これが肉吸いの醍醐味）。^豆腐を大きめに切って加え、弱めの中火で5分煮る。^別に、ご飯に溶き卵をかけたTKG（卵かけご飯）を用意する（大阪・千とせの名物の食べ方）。^椀に盛り、小ねぎをたっぷりのせ、七味をふる。小玉（卵かけご飯）と一緒に。|味の決め手は「かつお＋さば節の濃いだし」と「牛肉のうまみ」。肉うどんのうどん抜きが発祥。^卵かけご飯と一緒に食べるのが本場流。
ねぎ焼き|九条ねぎ:150g,豚バラ肉:80g,こんにゃく:1/4枚,卵:1個,薄力粉:80g,レモン:1/4個,牛すじ煮込み:50g|水:120ml,山芋:30g,和風だしの素:小さじ1,しょうゆ:小さじ1,サラダ油:大さじ1,しょうゆ:大さじ1,みりん:小さじ1,ゆず果汁:小さじ1,天かす:大さじ2|ねぎ（九条ねぎ、なければ小ねぎ）は小口切りにする。こんにゃくは細かく刻んで甘辛く煮る（牛すじ煮込みがあれば加える。大阪・やまもとの名物）。^生地：薄力粉・水・すりおろした山芋・和風だしの素・しょうゆ小さじ1を混ぜる（山芋入りでふわっと）。^たれ：しょうゆ・みりん・ゆず果汁を混ぜる（ソースではなく、しょうゆとレモンで食べるのが大阪のねぎ焼き）。^フライパンにサラダ油を中火で熱し、生地の半量を薄く広げ、ねぎをこんもりのせる。天かす・牛すじ・こんにゃくを散らし、豚バラ肉を広げてのせ、残りの生地をかける。^溶き卵を上からかけ、返して4分、もう一度返して3分、こんがり焼く。^たれを塗り、レモンを絞って。|味の決め手は「ねぎたっぷり」と「しょうゆ＋レモン（ゆず）」。大阪の本場の味。^牛すじを入れると、うまみと甘みが格段に増す。
明石焼き|ゆでだこ:100g,卵:4個,三つ葉:適量|薄力粉:30g,浮き粉:20g,だし:250ml,塩:少々,薄口しょうゆ:小さじ1,だし:500ml,かつお節:5g,薄口しょうゆ:大さじ1.5,みりん:大さじ1,塩:少々,サラダ油:適量|つけだし：だし500mlにかつお節を加えて2分煮出してこし、薄口しょうゆ・みりん・塩で調えて温めておく（明石焼きはだしが主役。濃いめに取る）。^生地：薄力粉と浮き粉（なければ片栗粉。ふわふわ、とろとろの食感の秘訣）を混ぜ、冷ましただし250ml・塩・薄口しょうゆを加えて混ぜる。卵4個をよく溶いて加え、ざるでこす（卵たっぷりの生地。なめらかに）。^たこは小さめの1cm角に切る。^たこ焼き器をよく熱し、油をたっぷりひいて生地を縁いっぱいまで流し、たこを1つずつ入れる。^1分半焼いて縁が固まったら、竹串で90度ずつ回して丸くし、全体が固まるまで計5分ほど焼く（焼き色はつけず、黄色く、ふわふわに）。^温かいつけだしに浸し、三つ葉を浮かべて食べる。|味の決め手は「卵たっぷりの生地」と「濃いめのつけだし」。兵庫・明石の本場の味。^焼き色はつけず、ふわっと黄色く仕上げる。
そばめし|焼きそば麺:1玉,ご飯:250g,豚こま切れ肉:100g,キャベツ:2枚,牛すじ煮込み:50g,こんにゃく:1/4枚,卵:1個,紅しょうが:適量|サラダ油:大さじ1,ウスターソース:大さじ1,お好み焼きソース:大さじ3,しょうゆ:小さじ1,和風だしの素:小さじ1/2,青のり:少々,かつお節:少々,マヨネーズ:適量|焼きそば麺は袋のまま軽くレンジで温めてほぐし、包丁で細かく1cmに刻む（ご飯と同じくらいの長さにするのが神戸・長田の本場流）。キャベツは粗みじん、こんにゃくは細かく刻む。^フライパン（またはホットプレート）にサラダ油を中火で熱し、豚肉・こんにゃく・牛すじ（あれば。長田の名物「ぼっかけ」）を2分炒める。^キャベツを加えて1分、刻んだ麺とご飯を加え、ヘラで切るように3分、少し焼き色がつくまで炒める（鉄板に押し付けて焼き付けると香ばしい）。^和風だしの素・ウスターソース・お好み焼きソース・しょうゆを加えて全体を炒め合わせる（2種のソースで、甘さとスパイシーさを両立）。^中央をあけて目玉焼きを作るか、溶き卵を絡めても。^器に盛り、青のり・かつお節・紅しょうが・マヨネーズを。|味の決め手は「麺を細かく刻む」ことと「2種のソース」。神戸・長田の本場の味。^鉄板に押し付けた焦げが最高においしい。
さば寿司|しめさば:1枚,ご飯:450g,白板昆布:1枚|酢:大さじ3,砂糖:大さじ1.5,塩:小さじ1/2,昆布:1枚,しょうが:1かけ,いりごま:大さじ1,酢:大さじ2,砂糖:大さじ1,水:大さじ2|すし酢：酢・砂糖・塩を混ぜ、小さく切った昆布を入れて30分おく（昆布を浸したすし酢で、うまみのある寿司飯に）。^炊きたてのご飯にすし酢を回しかけ、しゃもじで切るように混ぜ、うちわであおいで人肌に冷ます。せん切りにしたしょうがの甘酢漬けといりごまを混ぜる（しょうがとごまが京都の鯖寿司の名店の味）。^白板昆布（あれば。バッテラ昆布）は、酢・砂糖・水を煮立てた甘酢で3分煮て冷ます。^しめさばは薄皮をはがし、厚い部分をそいで厚さを均一にする（そいだ身は薄い部分にのせる）。^巻きすにラップを広げ、さばを皮目を下にして置き、寿司飯を棒状にしてのせ、ラップごとしっかり巻いて締める。上に白板昆布をのせて形を整える。^冷蔵庫で1時間以上なじませ、ラップごと濡らした包丁で切る。|味の決め手は「昆布を浸したすし酢」と「しょうが＋ごま入りの寿司飯」。京都の老舗の鯖寿司の味。^一晩おくと、さばと寿司飯がなじんでさらにおいしい。
にしんそば|そば(乾):200g,にしんの甘露煮:2枚,長ねぎ:1/3本|水:800ml,昆布:1枚,かつお節:15g,さば節:5g,薄口しょうゆ:大さじ2,しょうゆ:小さじ1,みりん:大さじ2,砂糖:小さじ1,塩:少々,七味唐辛子:少々|だし：水に昆布を30分浸し、弱火で10分。かつお節・さば節を加えて3分煮出してこす（京都の老舗のそば屋の、香り高いだし）。^つゆ：だしに薄口しょうゆ・しょうゆ・みりん・砂糖・塩を加えて温める（京都風の、色の薄い上品なつゆ）。^にしんの甘露煮は、つゆを少し取った小鍋で2分温める（にしんを温めてから、甘辛い煮汁がつゆに溶け出すのを楽しむ）。^そばを表示時間通りゆで、冷水で洗ってぬめりを取り、熱湯にくぐらせて温める。^丼にそばを入れ、熱いつゆを注ぎ、にしんをのせる。^斜め切りの長ねぎを添え、七味をふる（にしんの甘さがつゆに溶け出して、食べ進めるほど味が変わる）。|味の決め手は「かつお＋さば節の上品なだし」と「にしんの甘露煮の甘み」。京都の名物そば。^にしんの甘みがつゆに溶けて、だんだん味が深まる。
広島風お好み焼き|薄力粉:50g,キャベツ:1/4個,もやし:1/2袋,豚バラ肉:100g,焼きそば麺:2玉,卵:2個,天かす:大さじ3,いか天:10g,青ねぎ:適量|水:100ml,和風だしの素:小さじ1/2,牛乳:大さじ1,サラダ油:大さじ1,魚粉:小さじ2,ウスターソース:小さじ2,お好み焼きソース:大さじ5,青のり:少々,かつお節:少々,マヨネーズ:適量|生地：薄力粉・水・牛乳・和風だしの素を混ぜ、30分休ませる（休ませると薄くきれいに広がる）。キャベツは細切り。^フライパンにサラダ油を中火で熱し、生地を直径20cmの薄いクレープ状に広げる。魚粉（またはかつお粉。広島の本場の隠し味）をふる。^キャベツをこんもり、もやし・天かす・いか天（あれば）をのせ、豚バラ肉を広げてのせ、生地少量を回しかける。^返して、ヘラで押さえず、ふたをして弱めの中火で8分、キャベツを蒸し焼きにする（押さえないとキャベツがふっくら甘くなる）。^横で焼きそば麺を炒め、ウスターソースで味をつけて丸く広げ、お好み焼きをのせる。^横で卵を割って丸く広げ、黄身を崩し、お好み焼きをのせて返す。お好み焼きソースをたっぷり塗り、青のり・かつお節・青ねぎをのせる。|味の決め手は「魚粉」と「キャベツを押さえずに蒸し焼き」。広島の本場の味。^お好み焼きソースはたっぷり。マヨネーズは好みで。
牡蠣の土手鍋|牡蠣:12個,白菜:1/8個,長ねぎ:1本,春菊:1/2束,焼き豆腐:1/2丁,しいたけ:4個,えのき:1袋|片栗粉:大さじ2,白味噌:大さじ5,赤味噌:大さじ2,砂糖:大さじ2,みりん:大さじ2,酒:大さじ2,卵黄:1個,昆布:1枚,水:600ml,かつお節:10g,ゆずの皮:少々|牡蠣は片栗粉と水少々をまぶしてもみ、黒い汚れが出たら水で洗い、水気を拭く。^土手みそ：白味噌・赤味噌・砂糖・みりん・酒を小鍋で弱火で3分練り、火を止めて卵黄を混ぜる（卵黄でコクとつや。広島の本場の土手みそ）。^だし：水に昆布を30分浸し、弱火で10分。かつお節を加えて2分煮出してこす。^土鍋の内側の縁に、土手みそをぐるりと塗りつける（みそを「土手」のように塗るのが名前の由来）。^だしを注ぎ、白菜・焼き豆腐・しいたけ・えのき・長ねぎを入れて中火で煮る。縁のみそを少しずつ溶かしながら味を調える。^牡蠣を入れて2分、ふっくらしたら食べごろ（煮すぎない）。春菊を加え、ゆずの皮を散らす。|味の決め手は「白味噌＋赤味噌＋卵黄」の土手みそ。^みそを少しずつ溶かして、自分好みの濃さで楽しむ。
かけうどん|ゆでうどん:2玉,小ねぎ:適量,天かす:大さじ2,かまぼこ:4切れ|水:800ml,いりこ:20g,昆布:1枚,かつお節:10g,薄口しょうゆ:大さじ2,みりん:大さじ1,塩:小さじ1/3,しょうが:1かけ|だし：水にいりこ（頭とわたを取る）・昆布を一晩（最低30分）浸す。弱火にかけて10分、かつお節を加えて2分煮出してこす（いりこだしが讃岐うどんの命。黄金色の澄んだだし）。^つゆ：だしに薄口しょうゆ・みりん・塩を加えて温める（薄口しょうゆで、色は薄くうまみは濃い）。^うどん（できれば冷凍の讃岐うどん）を熱湯で表示時間通りゆでる。^ゆでたら一度冷水で洗って締め、熱湯にくぐらせて温める（一度締めると、コシが格段に増す。讃岐の「ひやあつ」の手法）。^丼にうどんを入れ、熱いつゆを注ぐ。^小ねぎ・天かす・かまぼこ・おろししょうがをのせる。|味の決め手は「いりこだし」と「一度冷水で締める」こと。香川の本場の味。^いりこは頭とわたを取ると、苦みのない上品なだしに。

とり天|鶏もも肉:1枚,鶏むね肉:1/2枚,卵:1個|しょうゆ:大さじ1,酒:大さじ1,ごま油:小さじ1,にんにく:少々,しょうが:少々,塩:少々,黒こしょう:少々,薄力粉:60g,片栗粉:大さじ1,冷水:70ml,揚げ油:適量,ポン酢しょうゆ:大さじ3,かぼす果汁:小さじ1,からし:少々|鶏肉はそぎ切りにし（もも肉＋むね肉で、食感の違いを楽しむ）、しょうゆ・酒・ごま油・すりおろしにんにく・しょうが・塩・黒こしょうをもみ込み、20分おく（下味をしっかりつけるのが大分の本場のとり天）。^衣：溶き卵・冷水を混ぜ、薄力粉・片栗粉を加えてさっくり混ぜる（混ぜすぎない。ダマが残るくらいでサクッと軽く）。^揚げ油を170℃に熱し、鶏肉に衣をつけて3分半揚げる。^一度引き上げて1分休ませ、180℃で30秒、カラッと揚げる。^たれ：ポン酢にかぼす果汁（なければすだち・レモン）を加える。^からしを溶いたポン酢につけて食べる（からしポン酢が大分の定番）。|味の決め手は「しっかり下味」と「からしポン酢」。大分の本場の味。^天ぷら衣なので、唐揚げより軽く、ふんわり。
鶏飯|ささみ:3本,鶏もも肉:1枚,卵:2個,しいたけ:4個,小ねぎ:適量,のり:1枚,パパイヤ漬け:適量,たくあん:30g,ご飯:400g,みかんの皮:少々|水:1000ml,昆布:1枚,しょうが:1かけ,長ねぎの青い部分:1本分,酒:大さじ2,鶏がらスープの素:小さじ2,薄口しょうゆ:大さじ1,塩:小さじ1/2,しょうゆ:大さじ1,砂糖:大さじ1,みりん:大さじ1,砂糖:小さじ1|スープ：鍋に水・昆布・鶏もも肉・しょうがの薄切り・長ねぎの青い部分・酒を入れて中火にかけ、沸騰したらアクを取って弱火で30分煮る（鶏から丁寧にとったスープが、奄美の鶏飯の主役。黄金色に澄んだスープに）。^ささみは途中で入れて5分ゆでる。鶏肉・ささみを取り出して細かく裂く。スープはこして鶏がらスープの素・薄口しょうゆ・塩で調える。^しいたけは薄切りにしてしょうゆ・砂糖・みりん・水大さじ3で汁気がなくなるまで甘辛く煮る（甘辛しいたけが味のアクセント）。^錦糸卵：卵を溶いて砂糖を加え、薄焼き卵にして細切り。たくあん・パパイヤ漬けは細切り、のりは刻み、小ねぎは小口切り。^茶碗にご飯を盛り、鶏肉・錦糸卵・しいたけ・たくあん・のり・小ねぎ・みかんの皮（あれば。奄美ではたんかん）を彩りよくのせる。^熱々のスープをたっぷりかける。|味の決め手は「鶏から丁寧にとったスープ」と「甘辛しいたけ」。奄美大島の本場の味。^柑橘の皮で、爽やかな香りがアクセントに。
高菜チャーハン|ご飯:400g,高菜漬け:80g,豚バラ肉:100g,卵:3個,長ねぎ:1/3本|ラード:大さじ2,ごま油:小さじ1,鶏がらスープの素:小さじ1,しょうゆ:小さじ2,オイスターソース:小さじ1/2,塩:少々,黒こしょう:少々,一味唐辛子:少々,いりごま:小さじ1|高菜漬けは細かく刻み、軽く絞る（辛子高菜なら、ピリ辛で福岡流）。豚バラ肉は細切り、長ねぎはみじん切り。^フライパンに少量のごま油を中火で熱し、高菜を2分炒めて取り出す（高菜を先に炒めると、香りと酸味が立つ）。^フライパンにラード（香ばしさの決め手。なければサラダ油）を強火で熱し、豚肉を2分、カリッとするまで炒める。^溶き卵を流し入れ、すぐにご飯を加え、ヘラで切るように1分半炒める（卵がご飯をコーティングしてパラパラに）。^鶏がらスープの素・高菜・長ねぎを加えて1分、鍋肌からしょうゆ・オイスターソースを回し入れて焦がす（焦がししょうゆの香り）。^塩・黒こしょう・一味で調え、いりごまを混ぜる。|味の決め手は「高菜を先に炒める」ことと「ラード＋焦がししょうゆ」。博多のラーメン屋の味。^高菜の酸味とうまみで、調味料は控えめで十分。

シシリアンライス|ご飯:360g,牛こま切れ肉:180g,玉ねぎ:1/4個,レタス:3枚,トマト:1個,きゅうり:1/2本,紫玉ねぎ:1/8個|サラダ油:小さじ1,にんにく:1片,しょうゆ:大さじ1.5,砂糖:大さじ1,みりん:大さじ1,酒:大さじ1,オイスターソース:小さじ1,黒こしょう:少々,マヨネーズ:大さじ3,練乳:小さじ1,レモン汁:小さじ1|甘辛牛肉：フライパンにサラダ油とにんにくのみじん切りを入れて弱火で1分、中火にして牛肉と薄切りの玉ねぎを炒める。しょうゆ・砂糖・みりん・酒・オイスターソース（隠し味のコク）・黒こしょうを加えて汁気が少し残る程度まで炒める。^レタスはせん切り、トマトは角切り、きゅうりは薄切り、紫玉ねぎは薄切りにして水にさらす。^マヨネーズソース：マヨネーズ・練乳（佐賀の本場の甘めのマヨネーズ。なければ砂糖少々）・レモン汁を混ぜる。^皿にご飯を盛り、甘辛牛肉を汁ごとのせる（ご飯に汁がしみるとおいしい）。^レタス・トマト・きゅうり・紫玉ねぎをこんもりのせる。^マヨネーズソースを細く絞る。|味の決め手は「甘辛牛肉」と「練乳入りの甘めマヨ」。佐賀の名物の味。^熱々の牛肉と冷たい野菜の温度差がおいしい。

ラフテー|豚バラ肉:500g,大根:200g,からし:少々|水:800ml,泡盛:150ml,黒砂糖:大さじ4,しょうゆ:大さじ3.5,みりん:大さじ1,しょうが:1かけ,かつお節:10g,昆布:1枚|豚バラ肉はかたまりのまま、フライパンで脂身の面から中火で5分、全面に焼き色をつける（余分な脂を出し、香ばしさをプラス）。^たっぷりの水から豚肉を強火で煮立て、弱火で1時間ゆでる（下ゆでで余分な脂を落とし、とろとろに）。水にとって洗い、5cm角に切る。^だし：水800mlに昆布を30分浸し、弱火で10分、かつお節を加えて2分煮出してこす。^鍋にだし・泡盛（必須。なければ酒＋焼酎。沖縄の本場の香りと、肉をやわらかくする効果）・しょうがの薄切りを入れて豚肉を加え、落としぶたをして弱火で30分煮る。^黒砂糖を加えて20分、しょうゆ・みりんを加えて30分、汁気がとろりとするまで煮込む（黒砂糖は先に、しょうゆは後から。やわらかく、深いつやに）。途中で大根を加えても。^からしを添えて。|味の決め手は「泡盛」と「黒砂糖」と「かつおだし」。沖縄の本場のとろける角煮。^冷ますと脂が固まるので、取り除いてから温め直すとさっぱり。
ポーク卵おにぎり|ご飯:300g,ランチョンミート:2枚,卵:2個,のり:2枚,大葉:2枚|サラダ油:小さじ1,塩:少々,砂糖:小さじ1,みりん:小さじ1,和風だしの素:少々,マヨネーズ:小さじ2,しょうゆ:少々,油味噌:適量|ランチョンミート（スパム）は1cm厚に切り、フライパン（油なし）で中火で片面1分半ずつ、カリッと焼き色をつける（焼き目の香ばしさが大事）。仕上げにしょうゆを数滴。^卵焼き：卵に砂糖・みりん・和風だしの素・塩少々を加えて溶き（甘めのだし入り卵焼きが沖縄の本場のポーたま）、サラダ油で四角く焼いて、ランチョンミートと同じ大きさに切る。^ご飯に塩少々を混ぜる。^のりを広げ、中央にご飯の1/4を四角く置き、大葉・ランチョンミート・マヨネーズ・油味噌（あれば。沖縄の甘い肉味噌）・卵焼きを重ね、上にご飯の1/4をのせる。^のりの四隅を折りたたんで包み、ラップで包んで5分なじませる。^半分に切る。|味の決め手は「カリッと焼いたスパム」と「甘めのだし卵」。沖縄のコンビニ・専門店の味。^マヨネーズと油味噌（または甘味噌）で、本場の味に。
白ご飯（鍋炊き）|米:2合|水:420ml,昆布:3cm角1枚,酒:小さじ1|米は計量し、たっぷりの水を注いで手早く2〜3回混ぜてすぐ捨てる（最初の水は米がよく吸うので、ぬか臭さを吸わせないよう素早く）。^水を替えて、指を立てて20回やさしく混ぜ、水を捨てる。これを水がうっすら透けるまで3回ほど繰り返す（力を入れすぎると米が割れる）。^ざるに上げて水を切り、鍋に入れて分量の水を加え、夏は30分、冬は1時間浸水させる（芯までしっかり吸水させるのが、ふっくら炊く最大のポイント）。^昆布と酒（ご飯にうまみとつやが出る、料亭の小技）を加え、ふたをして中火にかける。^沸騰したら（ふたがカタカタ鳴ったら）、ごく弱火にして12分。最後に強火で10秒加熱して余分な水分を飛ばす（おこげが少しできる）。^火を止めて、ふたを開けずに10分蒸らす。昆布を取り、しゃもじで底から十字に切って、空気を入れるようにほぐす。|味の決め手は「浸水をしっかり」と「昆布＋酒」。料亭のようなつやつや、甘いご飯に。^最後の10秒強火で、香ばしいおこげと粒立ちのよいご飯に。
ゆで卵|卵:4個|塩:少々,酢:小さじ1,塩:小さじ1/2,ごま油:小さじ1,黒こしょう:少々|卵は冷蔵庫から出したてを使う。お尻（丸いほう）に画鋲やスプーンの先で小さな穴をあける（殻がむきやすく、黄身が中央に寄る）。^鍋に湯を沸騰させ、酢を入れ（ひびが入っても白身が流れ出ない）、お玉で卵をそっと入れる。^中火で、好みの時間ゆでる：6分半→とろとろ半熟、8分→しっとり半熟、10分→固ゆでだが黄身がしっとり、12分→完全な固ゆで（最初の1分は菜箸で転がすと黄身が中央に）。^すぐに氷水にとって5分冷やす（急冷で殻がむきやすく、余熱で火が入りすぎず、黄身が緑にならない）。^殻に全体にひびを入れ、水の中でお尻のほうからむく。^ごま塩だれ：塩・ごま油・黒こしょうを混ぜて添える（ごま油塩で、居酒屋の一品に）。|味の決め手は「沸騰した湯から」と「氷水で急冷」。^好みの固さを見つけて。8分のしっとり半熟が万能。
目玉焼き|卵:2個,ベーコン:2枚|サラダ油:小さじ1,バター:5g,塩:少々,黒こしょう:少々,しょうゆ:少々,水:大さじ1|卵は室温に戻しておく（白身と黄身の火の通りが均一に）。小さな器に割っておく（黄身が崩れず、きれいな形に）。^フライパンにサラダ油とベーコンを入れて弱めの中火で2分、ベーコンをカリッと焼いて端に寄せる（ベーコンの脂で卵を焼くとうまみがのる）。^バターを加えて溶かし、卵を低い位置からそっと入れる。^弱火で3分、白身の縁がカリッと色づくまで焼く（弱火でじっくり。白身がふっくら、縁はカリッ）。^【半熟が好きなら】そのまま、【黄身に膜を張りたいなら】水大さじ1を入れてふたをし30秒蒸らす。^塩・黒こしょうをふり、ベーコンと一緒に盛る。しょうゆを数滴でも。|味の決め手は「ベーコンの脂＋バターで焼く」ことと「弱火でじっくり」。ホテルの朝食の目玉焼き。^白身の縁のカリカリが、一番おいしい。
チャーシュー|豚肩ロース肉:600g,長ねぎ:1本|塩:小さじ1/2,サラダ油:小さじ1,しょうが:1かけ,にんにく:3片,しょうゆ:120ml,みりん:60ml,酒:120ml,紹興酒:50ml,砂糖:大さじ2,はちみつ:大さじ1,オイスターソース:大さじ1,八角:1個,水:400ml|豚肉はたこ糸で縛って形を整え（煮崩れ防止、均一に火が通る）、塩をすり込んで30分おく。^フライパンにサラダ油を強めの中火で熱し、豚肉の全面を各1分、計5分、しっかり焼き色をつける（香ばしさを加え、肉汁を閉じ込める）。^鍋にしょうゆ・みりん・酒・紹興酒（なければ酒）・砂糖・はちみつ・オイスターソース・八角（中華料理店の香り）・水・つぶしたにんにく・薄切りのしょうが・長ねぎの青い部分を入れて煮立て、豚肉を入れる。^落としぶたをして弱火で1時間、途中で数回返しながら煮る（沸騰させず、ぐつぐつしない火加減でしっとり）。^火を止めて、煮汁ごと冷ます（冷める間に味がしみ、しっとりする）。保存袋に煮汁ごと入れ、冷蔵庫で一晩おくと最高。^薄切りにして、煮汁を煮詰めたたれをかける。たれは煮卵やチャーハンにも。|味の決め手は「焼き色をつける」「八角＋紹興酒」「煮汁ごと一晩」。ラーメン屋の本格チャーシュー。^煮汁は煮卵の漬けだれやチャーハンに使い回せる。
中華風肉団子|豚ひき肉:300g,玉ねぎ:1/4個,卵:1個,れんこん:50g,干ししいたけ:2枚|しょうが:1かけ,しょうゆ:小さじ2,酒:大さじ1,オイスターソース:小さじ1,塩:少々,片栗粉:大さじ2,ごま油:小さじ1,揚げ油:適量,水:100ml,黒酢:大さじ3,砂糖:大さじ3.5,ケチャップ:大さじ1,しょうゆ:大さじ1.5,紹興酒:大さじ1,鶏がらスープの素:小さじ1/4,片栗粉:小さじ2,ごま油:少々|干ししいたけは水でもどして細かく刻む（うまみの素）。れんこんは粗みじん（シャキッとした食感のアクセント）、玉ねぎはみじん切り、しょうがはすりおろす。^ボウルにひき肉・塩を入れて粘りが出るまで練り、しょうゆ・酒・オイスターソースを加えてさらに練る（先に塩で練ると、ふんわりジューシー）。卵・野菜・しいたけ・片栗粉・ごま油を混ぜる。^手に油を塗り、直径3cmに丸める。^揚げ油を160℃に熱し、肉団子を入れて4分、ころがしながら揚げる。180℃に上げて1分、表面をカリッとさせる。^甘酢あん：フライパンに水・黒酢（中華料理店の深いコクの黒酢あん）・砂糖・ケチャップ・しょうゆ・紹興酒・鶏がらスープの素を入れて煮立て、水溶き片栗粉でとろみをつける。^肉団子を加えて絡め、ごま油で照りを出す。|味の決め手は「黒酢あん」と「干ししいたけとれんこん」。中華料理店の肉団子に。^160℃→180℃の二段揚げで、中はふっくら、外はカリッ。
なす味噌炒め|なす:3本,豚バラ肉:150g,ピーマン:2個|サラダ油:大さじ3,ごま油:小さじ1,しょうが:1かけ,にんにく:1片,赤唐辛子:1本,味噌:大さじ2,甜麺醤:大さじ1,砂糖:大さじ1,みりん:大さじ1,酒:大さじ2,しょうゆ:小さじ1,オイスターソース:小さじ1,豆板醤:小さじ1/2|合わせ味噌：味噌・甜麺醤（中華料理店のコク）・砂糖・みりん・酒・しょうゆ・オイスターソースを混ぜる（先に混ぜておくと、ダマにならず均一に絡む）。^なすは乱切りにして水にさらさず、すぐにサラダ油大さじ2をまぶす（油を先にまぶすと、少ない油でとろりと仕上がる）。ピーマンは乱切り、豚肉は4cm幅、しょうが・にんにくはみじん切り。^フライパンに油なしでなすを入れ、中火で4分、ふたをして時々混ぜながら焼く。皮がつややかで、とろりとしたら取り出す。^同じフライパンにサラダ油大さじ1・しょうが・にんにく・唐辛子・豆板醤を入れて弱火で1分、香りを出す。^豚肉を加えて中火で2分、カリッとするまで炒め、ピーマンを加えて1分。^なすを戻し、合わせ味噌を加えて強火で30秒、照りよく炒め絡める。ごま油で香りづけ。|味の決め手は「味噌＋甜麺醤」と「なすに先に油をまぶす」こと。中華料理店の味。^豆板醤少々で、味がぐっと締まる。
れんこんのはさみ焼き|れんこん:200g,鶏ひき肉:150g,長ねぎ:1/4本,大葉:4枚|しょうが:1かけ,塩:少々,酒:小さじ1,しょうゆ:小さじ1,片栗粉:大さじ1,片栗粉:適量,ごま油:小さじ2,しょうゆ:大さじ1.5,みりん:大さじ1.5,砂糖:小さじ2,酒:大さじ1,酢:小さじ1,からし:少々|れんこんは皮をむいて5mm厚の輪切りを16枚切り、酢水に5分さらして水気を拭く。^肉だね：ひき肉・塩を粘りが出るまで練り、刻んだ長ねぎ・大葉・すりおろししょうが・酒・しょうゆ・片栗粉大さじ1を混ぜる（大葉の香りで、ひと味違うはさみ焼きに）。^れんこんの片面に片栗粉を薄くまぶし（肉だねがはがれない接着剤）、肉だねを挟んで縁を整える。表面にも片栗粉を薄くまぶす。^フライパンにごま油を中火で熱し、れんこんを並べて3分、焼き色がついたら返して、ふたをして弱火で4分蒸し焼き。^たれ：しょうゆ・みりん・砂糖・酒・酢（照り焼きに酢少々で味が締まる）を加え、中火で煮詰めながら照りよく絡める。^からしを添えて。|味の決め手は「大葉入りの肉だね」と「酢少々の照り焼きだれ」。^れんこんのシャキシャキと肉のジューシーさ。

冷やしたぬきうどん|ゆでうどん:2玉,天かす:大さじ5,きゅうり:1/2本,乾燥わかめ:3g,卵:2個,かに風味かまぼこ:2本,小ねぎ:適量|めんつゆ(3倍):大さじ5,水:250ml,かつお節:3g,みりん:小さじ1,しょうが:少々,わさび:少々,いりごま:小さじ1,レモン:1/4個|つゆ：めんつゆ・水・みりんを小鍋でひと煮立ちさせ、かつお節を加えて火を止め、3分おいてこす。冷蔵庫でキンキンに冷やす（めんつゆにかつお節を足すと、香りが立ってそば屋の味に）。^卵は6分半ゆでて半熟卵にする。^わかめはもどして水気を切る。きゅうりはせん切り、かにかまはほぐす。^天かすにつゆ大さじ1をまぶしておく（天かすにつゆを少し吸わせると、味が全体になじむ。かけるものは別でサクサクのまま）。^うどんを熱湯でゆでて流水でもみ洗いし、氷水で締めて水気を切る。^器に盛り、具を彩りよくのせ、天かすをたっぷり、冷たいつゆをかける。おろししょうが・わさび・いりごま・レモンを添えて。|味の決め手は「かつお節を足したつゆ」と「天かすたっぷり」。^レモンを絞ると、さっぱり。
卯の花|おから:150g,にんじん:1/4本,油揚げ:1枚,干ししいたけ:2個,長ねぎ:1/3本,こんにゃく:1/4枚,ちくわ:1本|サラダ油:大さじ1.5,ごま油:小さじ1,だし:300ml,もどし汁:50ml,砂糖:大さじ2,みりん:大さじ1.5,薄口しょうゆ:大さじ1.5,酒:大さじ1,塩:少々|おからはフライパン（油なし）で弱めの中火で5分、さらさらになるまでからいりする（からいりで、おからの青臭さが抜け、だしをよく吸う）。取り出す。^干ししいたけはもどして（もどし汁は取っておく）薄切り。にんじん・こんにゃくは細切り、油揚げは油抜きして細切り、ちくわは薄切り、長ねぎは小口切り。^フライパンにサラダ油を中火で熱し、にんじん・しいたけ・こんにゃく・油揚げ・ちくわを3分炒める。^おからを加えて混ぜ、だし・もどし汁（しいたけのうまみ）・砂糖・みりん・薄口しょうゆ・酒・塩を加えて、弱めの中火で8分、混ぜながら煮る。^しっとり、少し汁気が残る程度で長ねぎを加え、ごま油を回しかける（パサパサにしない。しっとりがおいしい）。^冷めると汁を吸うので、少しゆるめで火を止める。|味の決め手は「からいり」と「しいたけのもどし汁」。しっとりした、料亭の卯の花。^ゆるめで火を止めると、冷めてもしっとり。
五目豆|大豆(水煮):250g,にんじん:1/3本,れんこん:80g,ごぼう:1/3本,こんにゃく:1/3枚,昆布:10cm,干ししいたけ:2個|だし:300ml,もどし汁:100ml,砂糖:大さじ2.5,みりん:大さじ1,しょうゆ:大さじ2,酒:大さじ1|昆布は水につけてやわらかくし、1cm角に切る。干ししいたけはもどして1cm角（もどし汁は取っておく）。^にんじん・れんこん・ごぼう・こんにゃくは1cm角に切りそろえる（大豆と大きさを揃えると、味のなじみと見た目がよい）。ごぼう・れんこんは水にさらし、こんにゃくは下ゆでする。^鍋にだし・もどし汁・昆布の浸し水少々・大豆・野菜・昆布・しいたけを入れて中火で煮立て、アクを取る。^砂糖・酒・みりんを加え、落としぶたをして弱火で15分（甘みを先に入れて、具に含ませる）。^しょうゆを加え、さらに15分、煮汁が少なくなるまで煮る。^火を止めてそのまま冷ます（冷める間に味がしみる）。|味の決め手は「昆布＋しいたけのうまみ」と「甘み→しょうゆの順」。^作り置きで、日に日においしくなる。
がんもどきの煮物|がんもどき:4個,小松菜:1/2束,にんじん:1/4本|だし:350ml,砂糖:大さじ1,みりん:大さじ2,薄口しょうゆ:大さじ1.5,酒:大さじ1,塩:少々,しょうが:少々|がんもどきはざるにのせて熱湯を回しかけて油抜きする（油抜きで、だしがしみやすく、上品な味に）。^にんじんは5mm厚の輪切り（あれば梅型に抜く）、小松菜は4cm長さ。^鍋にだし・砂糖・みりん・酒を入れて煮立て、がんもどき・にんじんを入れる。^落としぶたをして弱火で10分。薄口しょうゆ・塩を加えてさらに5分煮る（がんもどきがだしをたっぷり吸い込む）。^小松菜を加えて2分煮て、火を止める。^そのまま冷まして味を含ませる（含め煮。冷める間にさらにしみる）。器に盛り、おろししょうがをのせる。|味の決め手は「油抜き」と「冷まして含ませる」こと。噛むとじゅわっとだしがあふれる。^薄口しょうゆで、上品な色と味に。
鯛しゃぶ|鯛(刺身用):250g,水菜:1束,長ねぎ:1本,えのき:1袋,絹ごし豆腐:1/2丁,昆布:1枚,せり:1/2束|水:1200ml,酒:大さじ3,塩:小さじ1/2,薄口しょうゆ:小さじ1,ポン酢しょうゆ:大さじ5,ゆず果汁:大さじ1,だし:大さじ2,もみじおろし:適量,小ねぎ:適量|鯛は薄いそぎ切りにする（3mm厚。さっとくぐらせてちょうどいい厚さ）。皿に花びらのように並べる。^土鍋に水・昆布を入れて30分おき（昆布だしをしっかり出す。鯛しゃぶの命）、中火にかけて沸騰直前に昆布を取り出す。酒・塩・薄口しょうゆを加える。^ゆずポン酢：ポン酢にゆず果汁・だしを混ぜる（だしで割ると、鯛の繊細な味を消さない）。^水菜・せりは5cm長さ、長ねぎは斜め薄切り、えのきはほぐし、豆腐は切る。^だしに野菜・豆腐を入れて煮る。鯛は1枚ずつ、だしにさっと2〜3回くぐらせ（半生のうちに。身が白っぽくなったら）、ゆずポン酢にもみじおろし・小ねぎを入れてつけて食べる。^〆は、鯛のうまみが出ただしで雑炊かにゅうめんに。|味の決め手は「昆布だし」と「ゆず＋だしのポン酢」。料亭の鯛しゃぶ。^〆の雑炊は、鯛のだしで格別。
鴨鍋|鴨肉:300g,長ねぎ:2本,せり:1束,しいたけ:4個,焼き豆腐:1/2丁,ごぼう:1/2本,つくね用鶏ひき肉:100g|塩:少々,だし:900ml,しょうゆ:大さじ4,みりん:大さじ3,酒:大さじ3,砂糖:小さじ2,しょうが:1かけ,片栗粉:小さじ1,七味唐辛子:少々,ゆずの皮:少々,そば(乾):100g|鴨肉は皮目に切り込みを入れ、塩をふる。フライパン（油なし）で皮目を弱めの中火で5分焼いて脂を出し、取り出して3mm厚の薄切りにする。出た鴨の脂は取っておく。^長ねぎは4cm長さに切り、鴨の脂で焼き色をつける（焼きねぎで甘さと香ばしさ）。ごぼうはささがき、せりは5cm長さ、しいたけは飾り切り。^つくね：鶏ひき肉・すりおろししょうが・片栗粉・塩少々を練る。^土鍋にだし・しょうゆ・みりん・酒・砂糖を入れて煮立て、鴨の脂大さじ1を加える（鴨の脂のコクが鍋全体に）。ごぼう・しいたけ・焼き豆腐・つくね（スプーンで落とす）を入れて5分煮る。^焼きねぎを加え、鴨肉をしゃぶしゃぶするように入れ、ピンク色が残るくらいで食べる（煮すぎると固くなる）。最後にせりを加える。七味・ゆずの皮で。^〆はそばを入れて鴨南蛮風に。|味の決め手は「鴨の脂」と「焼きねぎ」「せり」。京都の冬の鍋。^〆はそば。鴨のうまみが出たつゆで最高の鴨南蛮に。
あんかけチャーハン|ご飯:400g,卵:3個,焼き豚:60g,長ねぎ:1/2本,かに風味かまぼこ:4本,チンゲン菜:1株,むきえび:6尾,しいたけ:2個|ラード:大さじ2,鶏がらスープの素:小さじ1,塩:少々,白こしょう:少々,しょうゆ:小さじ1,水:300ml,鶏がらスープの素:小さじ2,オイスターソース:小さじ2,しょうゆ:小さじ1,酒:大さじ1,砂糖:小さじ1/2,片栗粉:大さじ1.5,ごま油:小さじ1,しょうが:少々|チャーハン：ご飯は温かいものを使う。焼き豚・長ねぎはみじん切り。フライパンにラード大さじ1.5を強火で熱し、溶き卵2個を流してすぐご飯を加え、ヘラで切るように1分半炒める。焼き豚・長ねぎ・鶏がらスープの素・塩・白こしょうを加えて1分、鍋肌からしょうゆを回して香りをつける。お椀で型取って皿に盛る。^あんの具：えびは背わたを取り、しいたけは薄切り、チンゲン菜はざく切り、かにかまはほぐす。^フライパンに残りのラード・しょうがのせん切りを入れて中火で30秒、えび・しいたけ・チンゲン菜の茎を1分炒める。^水・鶏がらスープの素・オイスターソース・しょうゆ・酒・砂糖を加えて煮立て、チンゲン菜の葉・かにかまを加えて1分。^水溶き片栗粉でしっかりとろみをつけ、残りの溶き卵1個を細く回し入れてかき玉にする（卵でふんわり、町中華のあんに）。ごま油で香りづけ。^チャーハンにあんをたっぷりかける。|味の決め手は「ラードのパラパラチャーハン」と「オイスター＋かき玉のあん」。町中華の名物の味。^あんはしっかりめのとろみで、チャーハンに絡めて。
レタスチャーハン|ご飯:400g,レタス:4枚,卵:3個,ベーコン:3枚,長ねぎ:1/3本,しらす:20g|ラード:大さじ1.5,鶏がらスープの素:小さじ1.5,オイスターソース:小さじ1,しょうゆ:小さじ1,塩:少々,黒こしょう:少々,ごま油:小さじ1|レタスは手で大きめにちぎる（包丁で切るより、断面から水が出にくい）。ベーコンは1cm幅、長ねぎはみじん切り。^溶き卵に温かいご飯を混ぜておく（卵かけご飯にしてから炒めると、失敗なくパラパラに）。^フライパンにラード（またはサラダ油）を強火で熱し、ベーコンを1分、カリッと炒める。^卵ご飯を加えてヘラで切るように2分、パラパラになるまで炒める。^長ねぎ・しらす・鶏がらスープの素・オイスターソースを加えて30秒、鍋肌からしょうゆを回し入れ、塩・黒こしょうで調える。^火を止める直前にレタスを加え、10秒だけさっと混ぜてごま油を回す（レタスはシャキシャキ感を残すため、余熱でしんなりする程度に）。|味の決め手は「卵かけご飯にしてから炒める」ことと「レタスは最後に10秒」。^しらすを加えると、うまみと塩気がアップ。
鮭チャーハン|ご飯:400g,甘塩鮭:2切れ,卵:2個,小ねぎ:5本,大葉:4枚,いりごま:小さじ1|酒:大さじ1,サラダ油:大さじ1,バター:10g,しょうゆ:小さじ2,和風だしの素:小さじ1/2,塩:少々,黒こしょう:少々|鮭は酒をふってグリルで7分焼き、皮と骨を取って粗くほぐす（皮はカリカリに焼いて刻んで加えると、香ばしさがアップ）。^小ねぎは小口切り、大葉はせん切り。^フライパンにサラダ油を強火で熱し、溶き卵を流してすぐご飯を加え、ヘラで切るように2分、パラパラに炒める。^鮭・和風だしの素（和風チャーハンのうまみ）を加えて1分炒める。^鍋肌からしょうゆを回し入れ、バターを加えて香りを立てる（しょうゆ＋バターの組み合わせは鮭と最高の相性）。塩・黒こしょうで調える。^小ねぎ・いりごまを混ぜ、器に盛り、大葉をのせる。|味の決め手は「焦がししょうゆ＋バター」と「和風だし」。^大葉の香りで、さっぱりと仕上がる。
デミグラスオムライス|鶏もも肉:100g,玉ねぎ:1/2個,マッシュルーム:6個,卵:4個,ご飯:360g|バター:35g,ケチャップ:大さじ5,中濃ソース:小さじ1,塩:少々,黒こしょう:少々,牛乳:大さじ2,生クリーム:大さじ1,薄力粉:大さじ1,水:150ml,デミグラスソース缶:1/2缶,中濃ソース:大さじ1,赤ワイン:大さじ3,ケチャップ:大さじ1,コンソメ:小さじ1/2,砂糖:小さじ1,しょうゆ:小さじ1/2,生クリーム:適量|デミソース：小鍋にバター10gを溶かし、薄切りのマッシュルームと玉ねぎ1/4個分を4分炒める。赤ワインを加えて2分煮詰め、デミグラスソース缶（なければバター10gで薄力粉を茶色く炒め、ケチャップ・中濃ソースを増やす）・水・中濃ソース・ケチャップ・コンソメ・砂糖・しょうゆを加えて弱火で10分煮詰める（赤ワインを煮詰めると、洋食屋の深いデミソースに）。^チキンライス：鶏肉は1cm角、残りの玉ねぎはみじん切り。バター10gで玉ねぎを3分、鶏肉を2分炒め、ケチャップを加えて1分炒めて酸味を飛ばし、ご飯・中濃ソースを加えて炒める。塩・黒こしょうで調える。^卵2個・牛乳大さじ1・生クリーム少々を混ぜる（1人分）。^フライパンにバター7gを強めの中火で熱し、卵液を流して菜箸で大きくかき混ぜ、半熟になったら火を止める。^チキンライスをのせ、卵で包み、皿に移す（またはライスの上にのせて切り開く）。^デミソースをたっぷりかけ、生クリームを細くたらす。|味の決め手は「赤ワインで煮詰めたデミソース」と「ケチャップを炒めたチキンライス」。洋食屋の本格オムライス。^生クリームをたらすと、見た目もお店の仕上がりに。
ふわとろオムライス|鶏もも肉:100g,玉ねぎ:1/4個,マッシュルーム:3個,卵:6個,ご飯:360g|バター:30g,ケチャップ:大さじ5,中濃ソース:小さじ1,コンソメ:小さじ1/2,塩:少々,黒こしょう:少々,生クリーム:大さじ3,塩:少々,ケチャップ:大さじ3,バター:5g,砂糖:小さじ1/2|チキンライス：鶏肉は1cm角、玉ねぎ・マッシュルームはみじん切り。フライパンにバター10gを溶かし、玉ねぎ・マッシュルームを3分、鶏肉を2分炒める。ケチャップを加えて中火で1分半、ふつふつと炒めて酸味を飛ばし（ここで甘みとコクが出る）、ご飯・中濃ソース・コンソメを加えて炒め合わせる。塩・黒こしょうで調える。皿にラグビーボール形に盛る。^卵3個・生クリーム大さじ1.5・塩少々をよく溶いてこす（こすとなめらかな仕上がりに）。^フライパン（20cm）にバター10gを強めの中火で熱し、泡が小さくなったら卵液を一気に流す。^菜箸で大きく素早くかき混ぜながら（フライパンを前後にゆすりながら）20秒、半熟のスクランブル状にする。^火から外して、フライパンの奥に卵を寄せ、柄を叩いて返しながらオムレツ形に整える（中がとろとろのまま）。^チキンライスの上にのせ、ナイフで縦に切れ目を入れてとろりと開く。ケチャップソース（ケチャップ・バター・砂糖を温めたもの）をかける。|味の決め手は「生クリーム入り卵を20秒で仕上げる」ことと「ケチャップを炒めたライス」。^ケチャップソースは温めてバターを入れると、つやとコクが出る。
オムハヤシ|牛こま切れ肉:150g,玉ねぎ:1個,マッシュルーム:6個,卵:4個,ご飯:360g|塩:少々,黒こしょう:少々,薄力粉:小さじ2,バター:30g,赤ワイン:80ml,水:250ml,ハヤシルウ:2かけ,ケチャップ:大さじ1,中濃ソース:小さじ2,はちみつ:小さじ1,インスタントコーヒー:少々,しょうゆ:小さじ1/2,牛乳:大さじ2,生クリーム:大さじ1|牛肉は塩・黒こしょうをして薄力粉をまぶす（やわらか、ソースにとろみ）。玉ねぎは薄切り、マッシュルームは薄切り。^鍋にバター10gを熱し、玉ねぎを中火で10分、あめ色に近い茶色まで炒める（あめ色玉ねぎがハヤシの深い甘みのもと）。^牛肉を加えて2分、マッシュルームを加えて1分炒め、赤ワインを加えて強火で2分、アルコールを飛ばしながら煮詰める（赤ワインで洋食屋の深いコク）。^水を加えて5分煮て、火を止めてルウを溶かす。ケチャップ・中濃ソース・はちみつ・インスタントコーヒー（隠し味のほろ苦さと深み）・しょうゆを加え、弱火で5分煮込む。^卵2個・牛乳大さじ1・生クリーム少々を溶き、バター10gで半熟のオムレツにする（1人分ずつ）。^皿にご飯を盛り、オムレツをのせ、ハヤシソースをたっぷりかける。|味の決め手は「あめ色玉ねぎ」と「赤ワイン＋隠し味のコーヒー」。洋食屋の本格オムハヤシ。^コーヒー少々で、ルウとは思えない深い味に。
和風きのこオムライス|鶏もも肉:100g,しめじ:1/2パック,まいたけ:1/2パック,エリンギ:1本,卵:4個,ご飯:360g,小ねぎ:適量,三つ葉:適量|バター:25g,しょうゆ:大さじ1,和風だしの素:小さじ1/2,塩:少々,黒こしょう:少々,だし:250ml,しょうゆ:大さじ1,みりん:大さじ1,酒:大さじ1,砂糖:小さじ1/2,片栗粉:小さじ2,牛乳:大さじ2,しょうが:少々|和風バターライス：鶏肉は1cm角。フライパンにバター10gを熱し、鶏肉を2分、ご飯・和風だしの素を加えて炒め、鍋肌からしょうゆ大さじ1を回して焦がし、塩・黒こしょうで調える（焦がしバターしょうゆの香ばしさ）。皿に盛る。^きのこあん：きのこはほぐしてバター5gで中火で3分、焼き色がつくまで焼き付ける（焼き付けるとうまみが凝縮する）。^だし・しょうゆ・みりん・酒・砂糖・おろししょうがを加えて煮立て、水溶き片栗粉でとろみをつける。^卵2個・牛乳大さじ1を溶き、バター5gで半熟のオムレツにする（1人分ずつ）。^ライスにオムレツをのせ、きのこあんをたっぷりかける。小ねぎ・三つ葉を散らす。|味の決め手は「焦がしバターしょうゆのライス」と「焼き付けたきのこのだしあん」。^しょうがを効かせたあんで、優しい和風の味に。
チーズインハンバーグ|合いびき肉:300g,玉ねぎ:1/2個,卵:1個,ピザ用チーズ:40g,モッツァレラチーズ:50g,ブロッコリー:1/3株,にんじん:1/3本|パン粉:大さじ4,牛乳:大さじ3,塩:小さじ1/2,黒こしょう:少々,ナツメグ:少々,バター:10g,牛脂:1個,サラダ油:小さじ2,赤ワイン:80ml,ケチャップ:大さじ3,中濃ソース:大さじ2,水:大さじ3,砂糖:小さじ1,しょうゆ:小さじ1/2,バター:10g|玉ねぎはみじん切りにしてバター10gで中火で6分、あめ色に近い茶色まで炒めて冷ます（甘みとうまみ）。パン粉は牛乳に浸す。^冷えたひき肉に塩を加え、粘りが出るまで1分練る。刻んだ牛脂（肉汁アップ）・卵・パン粉・炒め玉ねぎ・黒こしょう・ナツメグを加えて混ぜ、冷蔵庫で15分冷やす。^チーズ（ピザ用とモッツァレラを混ぜて丸める。2種でとろ〜りとよくのびる）を中心に入れ、肉だねでしっかり包む。空気を抜いて小判形にし、中央をくぼませる（チーズが漏れないよう、肉だねで厚く包むのがコツ）。^フライパンにサラダ油を中火で熱し、ハンバーグを3分焼いて返し、水大さじ3（分量外）を加えてふたをし、弱火で9分蒸し焼きにする。取り出す。^ソース：同じフライパンに赤ワインを入れて強火で1分半、半量に煮詰める。ケチャップ・中濃ソース・水・砂糖・しょうゆを加えて1分、バターを溶かし込む。^ハンバーグにソースをかけ、ゆでたブロッコリー・グラッセしたにんじんを添える。|味の決め手は「2種のチーズ」と「赤ワインソース」。切ると、チーズがとろ〜り。^肉だねで厚く包むと、チーズが漏れない。
照り焼きハンバーグ|合いびき肉:300g,玉ねぎ:1/2個,卵:1個,レタス:2枚,大葉:4枚|パン粉:大さじ4,牛乳:大さじ3,塩:小さじ1/3,黒こしょう:少々,ナツメグ:少々,サラダ油:小さじ2,しょうゆ:大さじ2,みりん:大さじ2,砂糖:大さじ1,酒:大さじ2,はちみつ:小さじ1,しょうが:少々,片栗粉:小さじ1/2,マヨネーズ:適量,七味唐辛子:少々|玉ねぎはみじん切りにしてサラダ油少々で4分炒めて冷ます。パン粉は牛乳に浸す。^冷えたひき肉に塩を加えて粘りが出るまで練り、卵・パン粉・玉ねぎ・黒こしょう・ナツメグを混ぜる。2等分して空気を抜き、小判形にして中央をくぼませる。^フライパンにサラダ油を中火で熱し、ハンバーグを3分焼いて返し、水大さじ3を加えてふたをし、弱火で8分蒸し焼きにする。^余分な脂をペーパーで拭き取る（拭き取ると、たれがよく絡み、照りが出る）。^しょうゆ・みりん・砂糖・酒・はちみつ・おろししょうが・片栗粉を混ぜたたれを加え、中火でスプーンでかけながら1分半、照りよく煮詰める（片栗粉少々でたれがしっかり絡む）。^器にレタスと大葉を敷いて盛り、たれをかけ、マヨネーズを絞って七味をふる。|味の決め手は「はちみつ＋しょうが入りの照りだれ」と「マヨネーズ＋七味」。^脂を拭き取ってからたれを入れると、照り照りに。
塩唐揚げ|鶏もも肉:2枚,レモン:1/2個|塩:小さじ2/3,砂糖:小さじ1/2,酒:大さじ1,鶏がらスープの素:小さじ1,オイスターソース:小さじ1/2,にんにく:2片,しょうが:1かけ,ごま油:小さじ1,黒こしょう:小さじ1/4,卵:1/2個,片栗粉:大さじ4,薄力粉:大さじ2,揚げ油:適量|鶏肉は余分な脂と筋を取り、大きめのひと口大に切る。^塩・砂糖（保水でジューシー）・酒・鶏がらスープの素・オイスターソース（隠し味のうまみ）・すりおろしにんにく・しょうが・ごま油・黒こしょうをもみ込み、冷蔵庫で30分〜一晩漬ける。^溶き卵を加えてもみ込み（ふんわりやわらか）、片栗粉と薄力粉を混ぜたものをまぶす。^揚げ油を170℃に熱し、3分揚げて取り出し、4分休ませる（余熱で中まで火を通す）。^180℃に上げて1分、カリッと二度揚げする。^レモンを添える。黒こしょうをもう一度ふっても。|味の決め手は「鶏がら＋オイスターのうまみ」と「黒こしょう」。唐揚げ専門店の塩唐揚げ。^二度揚げで、塩味でもカリッとジューシー。
唐揚げの甘酢あんかけ|鶏もも肉:2枚,玉ねぎ:1/2個,ピーマン:2個,にんじん:1/3本,パプリカ:1/2個|しょうゆ:大さじ1,酒:大さじ1,しょうが:1かけ,にんにく:少々,卵:1/2個,片栗粉:大さじ5,揚げ油:適量,水:120ml,黒酢:大さじ3,酢:大さじ1,砂糖:大さじ3.5,ケチャップ:大さじ2,しょうゆ:大さじ1,オイスターソース:小さじ1,鶏がらスープの素:小さじ1/4,片栗粉:小さじ2,ごま油:小さじ1|鶏肉はひと口大に切り、しょうゆ・酒・すりおろししょうが・にんにくをもみ込んで15分。溶き卵をもみ込み、片栗粉をまぶす。^揚げ油を170℃に熱し、3分揚げて取り出し、4分休ませ、180℃で1分二度揚げする（衣がカリッとしていると、あんを絡めてもべちゃっとしない）。^野菜は乱切りにし、にんじんはレンジで2分加熱。野菜を170℃の油で30秒、さっと素揚げする（素揚げで色鮮やか、甘みが増す。中華料理店の技）。^甘酢あん：フライパンに水・黒酢・酢・砂糖・ケチャップ・しょうゆ・オイスターソース・鶏がらスープの素を入れて煮立てる（黒酢と米酢の2種でコクとキレを両立）。^水溶き片栗粉でとろみをつけ、唐揚げ・野菜を加えて強火で手早く絡める。^ごま油で香りづけする。|味の決め手は「黒酢＋米酢」の甘酢あんと「野菜の素揚げ」。中華料理店の味。^唐揚げは二度揚げでカリッと。あんに絡めてもサクッ。
おろしポン酢唐揚げ|鶏もも肉:2枚,大根:300g,小ねぎ:適量,大葉:5枚|しょうゆ:大さじ1.5,酒:大さじ1,砂糖:小さじ1/2,しょうが:1かけ,にんにく:1片,ごま油:小さじ1,卵:1/2個,片栗粉:大さじ4,薄力粉:大さじ1,揚げ油:適量,ポン酢しょうゆ:大さじ4,だし:大さじ2,みりん:小さじ1,ゆず果汁:小さじ1,一味唐辛子:少々|鶏肉はひと口大に切り、しょうゆ・酒・砂糖・すりおろししょうが・にんにく・ごま油をもみ込んで20分漬ける。溶き卵をもみ込み、片栗粉と薄力粉をまぶす。^揚げ油を170℃に熱し、3分揚げて4分休ませ、180℃で1分二度揚げする。^大根はすりおろして、ざるで軽く水気を切る（絞りすぎない。汁気が少し残るくらいがジューシー）。^おろしポン酢：ポン酢・だし（だしで割ると角が取れ、まろやか）・みりん・ゆず果汁を混ぜる。^器に唐揚げを盛り、大根おろしをたっぷりのせる。^おろしポン酢をかけ、小ねぎ・せん切りの大葉・一味を散らす。|味の決め手は「だしとゆずで割ったポン酢」。揚げたてにかけて、さっぱりジューシー。^大根おろしは絞りすぎないのがポイント。
カツ煮|豚ロース肉:2枚,玉ねぎ:1/2個,卵:3個,三つ葉:適量|塩:少々,黒こしょう:少々,薄力粉:大さじ2,生パン粉:40g,揚げ油:適量,だし:220ml,しょうゆ:大さじ2,みりん:大さじ2.5,砂糖:大さじ1,酒:大さじ1,七味唐辛子:少々|豚肉は筋切りして塩・黒こしょうをふり、薄力粉→溶き卵（分量外少々）→生パン粉をつけて170℃で4分揚げる。食べやすく切る（揚げたてでなくても、市販のとんかつでも）。^玉ねぎは5mm幅の薄切り。^フライパン（または浅い鍋）にだし・しょうゆ・みりん・砂糖・酒を入れて煮立て、玉ねぎを入れて3分、しんなりして甘みが出るまで煮る。^とんかつを並べ入れ、煮汁をかけて30秒煮る（煮汁を衣に吸わせる）。^溶き卵（溶きすぎず、白身と黄身が少し残る程度）の2/3を回し入れ、ふたをして弱めの中火で40秒。^残りの卵を回し入れ、三つ葉をのせてふたをし、10秒で火を止める（2回に分けて入れると、ふわとろの半熟に）。器に盛り、七味をふる。|味の決め手は「卵を2回に分ける」ことと「だし多めの割下」。ご飯が止まらない、定食屋のカツ煮。^ご飯にのせればカツ丼に。
チーズかつ|豚ロース薄切り肉:240g,スライスチーズ:4枚,大葉:8枚,キャベツ:3枚,卵:1個|塩:少々,黒こしょう:少々,梅干し:1個,薄力粉:大さじ3,牛乳:大さじ1,生パン粉:60g,揚げ油:適量,中濃ソース:大さじ2,ウスターソース:小さじ1,ケチャップ:小さじ1,からし:少々|豚肉は薄切り（しゃぶしゃぶ用より少し厚めのもの）を2枚ずつ少し重ねて広げ、塩・黒こしょうをふる。^片側に大葉2枚・スライスチーズ1枚（2つ折り）をのせ、好みで叩いた梅肉を少し塗る（大葉＋チーズ＋梅で、さっぱり濃厚）。^豚肉を折りたたんで包み、手で押さえて端をしっかり閉じる（ミルフィーユ状に重ねると、やわらかく、チーズが流れ出にくい）。^薄力粉→牛乳入り溶き卵→生パン粉の順につけ、もう一度溶き卵→パン粉をつける（二度づけで、チーズが漏れない）。^揚げ油を170℃に熱し、4分、きつね色になるまで揚げる。^ソース（中濃・ウスター・ケチャップを混ぜる）とせん切りキャベツ・からしを添える。|味の決め手は「薄切り肉で包む」ことと「大葉＋梅」。切ると、チーズがとろ〜り。^衣の二度づけで、チーズの流出を防ぐ。
おろしとんかつ|豚ロース肉:2枚,大根:300g,大葉:5枚,キャベツ:3枚,卵:1個,小ねぎ:適量|塩:少々,黒こしょう:少々,薄力粉:大さじ2,牛乳:大さじ1,生パン粉:50g,揚げ油:適量,ポン酢しょうゆ:大さじ4,だし:大さじ2,ゆず果汁:小さじ1,しょうゆ:小さじ1,一味唐辛子:少々|豚肉は筋切りして叩き、塩・黒こしょうをふる。^薄力粉→牛乳入り溶き卵→生パン粉をつける。^揚げ油を170℃に熱し、3分揚げて返し2分、取り出して2分休ませ、180℃で30秒二度揚げする（衣がカリッとしていると、おろしをのせてもサクサク）。^大根はすりおろして軽く水気を切る。^おろしポン酢：ポン酢・だし・ゆず果汁・しょうゆを混ぜる（だしで割ってまろやかに）。^とんかつを切って盛り、大根おろしと大葉のせん切りをのせ、おろしポン酢をかけ、小ねぎ・一味を散らす。せん切りキャベツを添えて。|味の決め手は「だし＋ゆずのポン酢」と「二度揚げのカリカリ衣」。^大葉の香りで、とんかつがさっぱり。
カツサンド|豚ロース肉:2枚,食パン(8枚切り):4枚,キャベツ:2枚,卵:1個|塩:少々,黒こしょう:少々,薄力粉:大さじ2,牛乳:大さじ1,生パン粉:40g,揚げ油:適量,中濃ソース:大さじ3,ウスターソース:小さじ1,ケチャップ:大さじ1,はちみつ:小さじ1,からし:小さじ1/2,バター:15g,マヨネーズ:小さじ2|豚肉は筋切りし、パンの大きさに合わせて叩いてのばす。塩・黒こしょうをふる。^薄力粉→牛乳入り溶き卵→生パン粉をつけ、170℃で4分揚げる。^カツソース：中濃ソース・ウスターソース・ケチャップ・はちみつを小鍋で30秒温めて煮詰める（煮詰めると、パンにしみすぎず、とろりと絡む。老舗のカツサンドの味）。^揚げたてのカツを、ソースにくぐらせる（両面にソースをしみ込ませる）。^食パンの内側にバターとからしを塗る（バターでパンがべちゃっとせず、からしで味が締まる）。キャベツはせん切りにしてマヨネーズで和える。^パンにキャベツ・カツをのせて挟み、ラップで包んで5分なじませる。耳を切り落とし、3等分に切る。|味の決め手は「煮詰めたカツソース」と「バター＋からし」。老舗の洋食屋のカツサンド。^ラップで包んで5分おくと、切ってもきれいな断面に。
羽根つき餃子|豚ひき肉:200g,キャベツ:200g,にら:1/2束,長ねぎ:1/4本,餃子の皮:24枚|塩:小さじ1/4,しょうゆ:小さじ2,オイスターソース:小さじ2,酒:小さじ2,砂糖:小さじ1/2,鶏がらスープの素:小さじ1/2,水:大さじ3,ごま油:大さじ1,ラード:小さじ2,しょうが:1かけ,にんにく:1片,白こしょう:少々,サラダ油:大さじ1,薄力粉:小さじ2,水:100ml,ごま油:小さじ1,酢:適量,ラー油:適量,黒こしょう:少々|キャベツはみじん切りにして塩少々（分量外）でもみ、10分おいてしっかり絞る（水分を抜くと、焼いても水っぽくならない）。にら・長ねぎもみじん切り。^ひき肉に塩を加えて粘りが出るまで1分練り、しょうゆ・オイスターソース・酒・砂糖・鶏がらスープの素・白こしょうを加え、水大さじ3を少しずつ加えて肉に吸わせる（水を吸わせると、肉汁じゅわっと）。^野菜・すりおろししょうが・にんにく・ごま油・ラード（ジューシーさとコク）を混ぜ、冷蔵庫で30分休ませる。^皮で包み、ひだを寄せてしっかり閉じる。^フライパンにサラダ油を中火で熱し、餃子を並べて1分焼く。薄力粉を水100mlで溶いた「羽根液」を回し入れ、ふたをして中火で5分蒸し焼きにする。^ふたを取って水分を飛ばし、ごま油を鍋肌から回し入れて2分、羽根がパリッときつね色になるまで焼く。皿をかぶせて返す。酢＋黒こしょう（さっぱり人気の食べ方）か、酢じょうゆラー油で。|味の決め手は「肉に水を吸わせる」ことと「ラード」。肉汁あふれる羽根つき餃子。^酢＋黒こしょうで食べると、肉のうまみが際立つ。
揚げ餃子|豚ひき肉:150g,キャベツ:150g,にら:1/3束,ピザ用チーズ:30g,大葉:5枚,餃子の皮:20枚|塩:少々,しょうゆ:小さじ2,オイスターソース:小さじ1,酒:小さじ1,鶏がらスープの素:小さじ1/4,水:大さじ2,ごま油:小さじ1,しょうが:1かけ,白こしょう:少々,揚げ油:適量,ポン酢しょうゆ:大さじ3,ゆず果汁:小さじ1,からし:少々,スイートチリソース:大さじ2|キャベツはみじん切りにして塩もみし、しっかり絞る。にらはみじん切り。^ひき肉に塩を加えて練り、しょうゆ・オイスターソース・酒・鶏がらスープの素・白こしょう・水を加えて吸わせ、野菜・すりおろししょうが・ごま油を混ぜる。^皮に大葉（ちぎって）・肉だね・チーズ少々をのせて包む（大葉とチーズで、揚げ餃子が居酒屋の人気メニューに）。縁はしっかり閉じる（油はねと破裂防止）。^揚げ油を160℃に熱し、餃子を入れて4分、ときどき返しながらじっくり揚げる（低温でじっくり揚げると、中まで火が通り、皮がパリッ）。^180℃に上げて30秒、カラッと仕上げる。^ゆずポン酢＋からし、またはスイートチリソースで。|味の決め手は「大葉＋チーズ」と「低温でじっくり」。パリパリの居酒屋の揚げ餃子。^2種のたれで、味変を楽しんで。
スープ餃子|豚ひき肉:150g,白菜:3枚,にら:1/3束,餃子の皮(厚め):16枚,長ねぎ:1/3本,チンゲン菜:1株,しいたけ:2個|塩:少々,しょうゆ:小さじ2,酒:小さじ1,オイスターソース:小さじ1,ごま油:小さじ2,しょうが:1かけ,水:大さじ2,水:800ml,鶏がらスープの素:大さじ1,干しえび:5g,しょうゆ:小さじ2,酒:大さじ1,塩:小さじ1/4,白こしょう:少々,黒酢:小さじ2,ラー油:少々|白菜の半量はみじん切りにして塩もみし、絞る。にらはみじん切り。^ひき肉に塩を加えて練り、しょうゆ・酒・オイスターソース・水大さじ2を吸わせ、白菜・にら・すりおろししょうが・ごま油を混ぜる。皮（厚めの水餃子用）で包む（ひだを寄せて、しっかり閉じる）。^スープ：鍋に水・干しえび（うまみの深い中華スープのもと）・鶏がらスープの素・酒を入れて5分煮出す。しょうゆ・塩・白こしょうで調える。^残りの白菜（ざく切り）・しいたけ（薄切り）を入れて5分煮る。^餃子を入れて中火で5分、浮き上がってからさらに1分煮る（ぐらぐら煮立てると皮が破れるので中火で）。チンゲン菜を加えて1分。^器に盛り、斜め切りの長ねぎをのせ、黒酢・ラー油をたらす（黒酢を少し入れると、味が締まる）。|味の決め手は「干しえびのスープ」と「黒酢少々」。中華料理店のスープ餃子。^ぐらぐら煮立てないのが、皮を破らないコツ。
他人丼|牛こま切れ肉:180g,玉ねぎ:1/2個,卵:3個,ご飯:400g,三つ葉:適量|だし:160ml,しょうゆ:大さじ2,みりん:大さじ2.5,砂糖:大さじ1,酒:大さじ1,しょうが:少々,七味唐辛子:少々|玉ねぎは5mm幅の薄切り、牛肉は大きければ食べやすく切る。三つ葉は3cm長さ。^卵は白身を切る程度に軽く溶く（溶きすぎないと、白身と黄身のコントラストがきれいで、ふわとろに）。^親子鍋（または小さいフライパン）に1人分ずつ、だし・しょうゆ・みりん・砂糖・酒・おろししょうが少々を入れて煮立て、玉ねぎを入れて2分煮る。^牛肉を広げて加え、色が変わるまで1分煮る（牛肉は煮すぎないとやわらか）。^溶き卵の2/3を回し入れ、ふたをして30秒、残りの卵を回し入れて三つ葉をのせ、10秒で火を止める（2回に分けて入れると、ふわとろ）。^丼のご飯の上に滑らせるようにのせる。七味をふって。|味の決め手は「卵を2回に分ける」ことと「牛肉は煮すぎない」こと。大阪の定食屋の他人丼。^しょうが少々で、牛肉の甘辛さがすっきり。
ねぎ玉牛丼|牛こま切れ肉:250g,玉ねぎ:1/2個,ご飯:400g,卵:2個,小ねぎ:1/2束|だし:200ml,しょうゆ:大さじ3,みりん:大さじ2,砂糖:大さじ1.5,酒:大さじ3,白ワイン:大さじ1,しょうが:1かけ,ごま油:小さじ1,しょうゆ:小さじ1,鶏がらスープの素:少々,紅しょうが:適量,七味唐辛子:少々|牛丼の具：鍋にだし・しょうゆ・みりん・砂糖・酒・白ワイン（チェーン店の隠し味。すっきりした風味に）・しょうがのすりおろしを入れて煮立て、玉ねぎ（5mm幅）を入れて5分煮る。^牛肉を加えてほぐし、アクを取りながら中火で5分煮る（煮すぎず、汁気を残す）。^ねぎだれ：小ねぎを小口切りにし、ごま油・しょうゆ・鶏がらスープの素少々で和える（ねぎに味をつけると、牛丼チェーンの味に）。^丼にご飯を盛り、つゆだくで牛丼の具をのせる。^ねぎだれをたっぷりのせ、中央にくぼみを作って生卵（または温泉卵）を落とす。^紅しょうが・七味を添えて。|味の決め手は「白ワインの隠し味」と「味つきのねぎだれ」。牛丼チェーンの人気メニューの味。^卵の黄身でまろやかに。
チーズ牛丼|牛こま切れ肉:250g,玉ねぎ:1/2個,ご飯:400g,ピザ用チーズ:60g,チェダーチーズ:20g|だし:200ml,しょうゆ:大さじ3,みりん:大さじ2,砂糖:大さじ1.5,酒:大さじ3,白ワイン:大さじ1,しょうが:1かけ,ケチャップ:小さじ1,タバスコ:少々,黒こしょう:少々|牛丼の具：鍋にだし・しょうゆ・みりん・砂糖・酒・白ワイン・すりおろししょうがを入れて煮立て、玉ねぎを入れて5分。牛肉を加えてアクを取りながら5分煮る。^ピザ用チーズとチェダーチーズを混ぜる（2種のチーズで、とろけるのびとコクを両立）。^丼にご飯を盛り、つゆを少しかけ、牛丼の具をのせる。^熱々のうちにチーズをたっぷりのせ、ふたをして1分、またはレンジで30秒、チーズを溶かす（またはバーナーで炙ると香ばしい）。^黒こしょう・タバスコをかける。^サルサ風にしたいなら、ケチャップ・タバスコ・刻んだ玉ねぎを混ぜてのせても。|味の決め手は「2種のチーズ」と「黒こしょう＋タバスコ」。^チーズを溶かしてから食べるのがおいしい。
牛すき丼|牛こま切れ肉:250g,長ねぎ:1本,焼き豆腐:1/2丁,しらたき:1/2袋,ご飯:400g,卵:2個,春菊:1/4束|牛脂:1個,しょうゆ:大さじ3,みりん:大さじ3,砂糖:大さじ2.5,酒:大さじ2,水:50ml,だし:50ml|しらたきは下ゆでして食べやすく切る。長ねぎは斜め切り、焼き豆腐は食べやすく切る、春菊は4cm長さ。^割下：しょうゆ・みりん・砂糖・酒・水・だしを混ぜる。^フライパンに牛脂を中火で溶かし、長ねぎを焼き色がつくまで2分焼く（焼きねぎで香ばしく甘く）。^牛肉を広げて加え、砂糖少々（分量外）をふって焼き付ける（すき焼きの関西流。砂糖で焼くと香ばしいカラメルの香り）。^割下・焼き豆腐・しらたきを加えて5分煮て、春菊を加えて30秒。^丼にご飯を盛り、具と割下をかける。卵黄（または溶き卵）をのせて。|味の決め手は「牛脂で焼く」ことと「砂糖をふって焼き付ける」こと。すき焼き屋の味。^卵黄を絡めて、すき焼きの醍醐味を。
天津麺|中華麺:2玉,卵:4個,かに缶:1缶,かに風味かまぼこ:4本,長ねぎ:1/3本,干ししいたけ:2個,グリンピース:20g|ラード:大さじ2,塩:少々,酒:小さじ1,白こしょう:少々,水:600ml,鶏がらスープの素:大さじ1,しょうゆ:大さじ1.5,オイスターソース:小さじ1,塩:小さじ1/3,ごま油:小さじ1,水:150ml,酢:大さじ1,砂糖:大さじ1,ケチャップ:大さじ1,しょうゆ:小さじ2,鶏がらスープの素:小さじ1/4,片栗粉:大さじ1|スープ：鍋に水・鶏がらスープの素・しょうゆ・オイスターソース・塩を入れて温め、ごま油を加える。^干ししいたけはもどして薄切り。かに缶は汁ごと、かにかまはほぐす、長ねぎはみじん切り。^卵液：卵2個（1人分）・かにの半量・しいたけ・長ねぎ・酒・塩・白こしょうを混ぜる。^甘酢あん：水・酢・砂糖・ケチャップ・しょうゆ・鶏がらスープの素を煮立て、水溶き片栗粉でとろみをつける（醤油ベースの甘酢で町中華の味）。^フライパンにラード大さじ1を強火で熱し、卵液を一気に流して大きく混ぜ、半熟になったら丸く整えて裏返す（ラードで焼くとふんわり、香ばしい）。^ゆでた麺を丼に入れ、スープを注ぎ、かに玉をのせ、甘酢あんをかけてグリンピースを散らす。|味の決め手は「ラードで焼くかに玉」と「かに缶を汁ごと」。町中華の本格天津麺。^かに缶の汁も入れると、うまみが格段に増す。
白麻婆豆腐|木綿豆腐:1丁,豚ひき肉:120g,長ねぎ:1/2本|ごま油:大さじ1,ラード:小さじ1,にんにく:1片,しょうが:1かけ,花椒:小さじ1/2,水:200ml,鶏がらスープの素:小さじ2,酒:大さじ1,オイスターソース:小さじ1,塩:小さじ1/3,砂糖:ひとつまみ,牛乳:50ml,練りごま:小さじ2,片栗粉:大さじ1,黒こしょう:少々,ラー油:適量|豆腐は2cm角に切り、塩少々を入れた湯で2分ゆでる（崩れにくく、余分な水分が抜けて味がのる）。^フライパンにごま油・ラードを中火で熱し、ひき肉を4分、カリッとするまでしっかり炒める（肉のうまみと香ばしさ）。^にんにく・しょうが・長ねぎの白い部分のみじん切りを加えて1分炒める。^水・鶏がらスープの素・酒・オイスターソース・塩・砂糖を加えて煮立て、豆腐を加えて3分煮る。^牛乳・練りごま（白麻婆のコクの決め手。クリーミーで、担々風の深みに）を加えて1分、水溶き片栗粉を3回に分けて加え、しっかりとろみをつける。^強火にして30秒、鍋肌を焦がすように煮立て、ラー油を回し入れる。挽いた花椒・黒こしょう・長ねぎの青い部分をふる。|味の決め手は「練りごま＋牛乳」と「花椒」。辛くないけど、痺れる大人の白麻婆。^花椒は挽きたてをかけると、香りが段違い。
麻婆丼|木綿豆腐:1丁,豚ひき肉:150g,長ねぎ:1/2本,にら:1/4束,ご飯:400g|ごま油:大さじ1,ラード:小さじ2,にんにく:1片,しょうが:1かけ,豆板醤:大さじ1,豆鼓:小さじ1,甜麺醤:大さじ1,一味唐辛子:小さじ1/2,酒:大さじ1,しょうゆ:大さじ1,水:220ml,鶏がらスープの素:小さじ1,砂糖:小さじ1/2,片栗粉:大さじ1.5,ラー油:大さじ1,花椒:小さじ1|豆腐は2cm角に切り、塩少々を入れた湯で2分ゆでる。^フライパンにラードとごま油を中火で熱し、ひき肉を5分、脂が透き通ってカリカリになるまで炒める（ここで肉のうまみが凝縮。本格麻婆の要）。^弱火にして豆板醤・刻んだ豆鼓（本場四川の深いコク）・一味を加えて1分、油が赤くなるまで炒め、甜麺醤・にんにく・しょうがのみじん切りを加えて30秒。^酒・しょうゆ・水・鶏がらスープの素・砂糖を加えて煮立て、豆腐を加えて3分煮る。^にら・長ねぎを加え、水溶き片栗粉を3回に分けて加えてしっかりとろみをつける。強火で30秒、ラー油を回し入れる。^丼にご飯を盛って麻婆豆腐をかけ、挽いた花椒をたっぷりふる。|味の決め手は「ひき肉をカリカリに」と「豆鼓＋花椒」。四川料理店の本格麻婆丼。^とろみをしっかりつけると、ご飯にのせても水っぽくならない。
しらすと大葉のペペロンチーノ|スパゲッティ:180g,しらす:50g,大葉:10枚,のり:適量|塩(ゆで用):大さじ1,オリーブオイル:大さじ3,にんにく:2片,赤唐辛子:1本,バター:5g,しょうゆ:小さじ1.5,レモン汁:小さじ1,いりごま:小さじ1|にんにくは薄切り、唐辛子は種を取る。大葉はせん切り。^湯2Lに塩大さじ1を入れ、スパゲッティを表示時間より1分短くゆでる。^フライパンにオリーブオイル・にんにく・唐辛子を入れて弱火で3分、にんにくがきつね色になるまで香りを出す。^しらすの半量を加えて1分、カリッとさせる（カリカリしらすと、ふわふわしらすの2つの食感を楽しむ）。^ゆで汁大さじ4を加えて揺すって乳化させ、パスタを加えて絡める。しょうゆ・バター（和風パスタの香りの決め手）を加えて混ぜる。^火を止めてレモン汁・残りのしらす・大葉の半量を混ぜる。器に盛り、残りの大葉・刻みのり・いりごまをのせる。|味の決め手は「しらすの二段使い」と「しょうゆ＋バター」。和風パスタ専門店の味。^大葉は火を止めてから加えると、香りが飛ばない。
キャベツとアンチョビのペペロンチーノ|スパゲッティ:180g,キャベツ:1/4個|塩(ゆで用):大さじ1,オリーブオイル:大さじ4,にんにく:3片,赤唐辛子:1本,アンチョビ:4枚,パン粉:大さじ3,粉チーズ:大さじ2,黒こしょう:少々,レモンの皮:少々|キャベツはひと口大にちぎり、芯は薄切り。にんにくは薄切り、唐辛子は種を取る。^パン粉：フライパンにオリーブオイル大さじ1とパン粉を入れて弱めの中火で3分、きつね色になるまでからいりし、取り出す（カリカリパン粉＝「貧乏人のチーズ」。南イタリアの定番のトッピング）。^湯2Lに塩大さじ1を入れ、スパゲッティをゆでる。ゆで上がり2分前にキャベツを加えて一緒にゆでる（キャベツが甘く、パスタになじむ）。^フライパンに残りのオリーブオイル・にんにく・唐辛子を入れて弱火で3分、香りを出す。アンチョビを加えてヘラでつぶしながら溶かす（アンチョビがうまみと塩気の源）。^ゆで汁大さじ4を加えて揺すって乳化させ、パスタとキャベツを加えて30秒絡める。^器に盛り、カリカリパン粉・粉チーズ・黒こしょう・すりおろしたレモンの皮を散らす。|味の決め手は「アンチョビを溶かす」ことと「カリカリパン粉」。イタリアの家庭の味。^キャベツは麺と一緒にゆでると、甘くとろり。
きのこカルボナーラ|スパゲッティ:180g,パンチェッタ:70g,しめじ:1/2パック,マッシュルーム:5個,まいたけ:1/2パック,卵:2個,卵黄:1個|塩(ゆで用):大さじ1,オリーブオイル:大さじ1,にんにく:1片,白ワイン:大さじ2,粉チーズ:大さじ5,生クリーム:50ml,黒こしょう:小さじ1/2,しょうゆ:少々|卵液：ボウルに卵・卵黄・粉チーズ・生クリーム・黒こしょうを混ぜる（全卵＋卵黄で濃厚に）。^きのこはほぐす（マッシュルームは薄切り）。パンチェッタは棒状に切る。^フライパンにオリーブオイル・つぶしたにんにく・パンチェッタを入れて弱めの中火で4分、脂を出してカリッとさせる。^きのこを加えて強めの中火で3分、あまり触らずに焼き付ける（焼き色をつけるときのこのうまみが凝縮）。白ワインを加えて30秒。しょうゆ少々（きのこのうまみを引き立てる隠し味）。^スパゲッティを表示時間より1分短くゆで、ゆで汁大さじ3とともにフライパンに加えて絡め、火を止めて1分おく（少し冷ますと、卵が固まらない）。^卵液を加えて手早く混ぜ、とろりとしたクリーム状にする（固まりそうなら、ゆで汁を足す）。黒こしょうをたっぷりふる。|味の決め手は「きのこを焼き付ける」ことと「火を止めて卵液」。濃厚クリーミーなカルボナーラ。^しょうゆ少々で、きのこのうまみが際立つ。
カルボナーラうどん|冷凍うどん:2玉,ベーコン:60g,卵:2個,卵黄:1個,小ねぎ:適量|オリーブオイル:小さじ2,にんにく:少々,粉チーズ:大さじ4,牛乳:大さじ3,めんつゆ(3倍):大さじ1,バター:10g,黒こしょう:適量|卵液：卵・卵黄・粉チーズ・牛乳・めんつゆ（和風のうまみ。うどんとの相性抜群）を混ぜる。^ベーコンは1cm幅。フライパンにオリーブオイル・すりおろしにんにく少々・ベーコンを入れて中火で3分、カリッとさせる。^冷凍うどんをレンジで表示時間通り加熱する（またはゆでる）。^フライパンにうどん・バターを加えて絡め、火を止めて1分おく（少し冷ますと、卵がだまにならない）。^卵液を加えて手早く混ぜ、とろりとからめる（固まりそうなら弱火にかけながら、ゆるければ再び弱火で数秒）。^器に盛り、黒こしょうをたっぷり、小ねぎを散らす。|味の決め手は「めんつゆ＋バター」の和洋折衷。うどん屋の人気メニューの味。^火を止めてから卵液を加えると、なめらかに。
ミートドリア|合いびき肉:150g,玉ねぎ:1/2個,にんじん:1/4本,マッシュルーム:4個,ご飯:360g,ピザ用チーズ:60g|オリーブオイル:小さじ2,にんにく:1片,赤ワイン:大さじ3,トマト缶:1/2缶,トマトペースト:小さじ2,ケチャップ:大さじ3,中濃ソース:大さじ1,コンソメ:小さじ1,砂糖:小さじ1,ナツメグ:少々,塩:少々,黒こしょう:少々,バター:15g,牛乳:200ml,薄力粉:大さじ1.5,粉チーズ:大さじ2,パセリ:少々|ミートソース：玉ねぎ・にんじん・にんにく・マッシュルームはみじん切り。フライパンにオリーブオイルを熱し、香味野菜を5分炒め、ひき肉を加えて焼き付けるように4分炒める。赤ワインを加えて1分、トマト缶・トマトペースト・ケチャップ・中濃ソース・コンソメ・砂糖・ナツメグを加えて弱火で10分煮詰める。塩・黒こしょうで調える。^簡単ベシャメル：小鍋にバター10gを溶かし、薄力粉を1分炒め、牛乳を少しずつ加えて混ぜながら3分、とろりとさせる（ホワイトソースを重ねると、ファミレスの人気ドリアのまろやかさに）。^バターライス：ご飯に残りのバターと塩少々を混ぜる。^耐熱皿にバターライスを敷き、ベシャメルを薄く広げ、ミートソースをのせる。^ピザ用チーズと粉チーズを散らす。^トースター（または230℃のオーブン）で8〜10分、こんがり焼き色がつくまで焼く。パセリを散らす。|味の決め手は「赤ワインで煮詰めたミートソース」と「ホワイトソースを重ねる」こと。^ミートとホワイトの二層で、まろやかで深い味に。
シーフードドリア|シーフードミックス:200g,玉ねぎ:1/2個,マッシュルーム:5個,ほうれん草:1/4束,ご飯:360g,ピザ用チーズ:60g|塩:少々,白ワイン:大さじ2,バター:35g,薄力粉:大さじ3,牛乳:400ml,生クリーム:50ml,コンソメ:小さじ1,塩:少々,白こしょう:少々,ナツメグ:少々,ケチャップ:大さじ2,パン粉:大さじ2,粉チーズ:大さじ2|シーフードミックスは塩水（3%）で解凍し、水気を拭く（臭みが抜け、プリッとする）。^フライパンにバター10gを熱し、シーフードを強火で1分炒め、白ワインを加えて30秒。取り出す（汁は取っておく。シーフードのうまみがたっぷり）。^同じフライパンにバター20gを溶かし、薄切りの玉ねぎ・マッシュルームを4分炒める。薄力粉を加えて2分、焦がさないように炒める。^冷たい牛乳・シーフードの汁を少しずつ加え、混ぜながら4分、とろりとするまで煮る。生クリーム・コンソメ・塩・白こしょう・ナツメグで調え、シーフード・ほうれん草を戻す。^ケチャップライス：ご飯に残りのバター・ケチャップを混ぜる（ほんのりケチャップライスにすると、洋食屋の味に）。^耐熱皿にライスを敷き、ソースをかけ、チーズ・パン粉・粉チーズをのせてトースターで10分、こんがり焼く。|味の決め手は「シーフードの汁をソースに使う」ことと「ケチャップライス」。^シーフードは先に炒めて取り出すと、プリッとした食感に。
モダン焼き|キャベツ:1/4個,豚バラ肉:100g,焼きそば麺:2玉,卵:2個,天かす:大さじ3,かつお節:1パック,紅しょうが:適量|薄力粉:100g,山芋:50g,水:100ml,和風だしの素:小さじ1,しょうゆ:小さじ1,サラダ油:大さじ1.5,ウスターソース:小さじ2,お好み焼きソース:大さじ4,マヨネーズ:大さじ2,青のり:少々|生地：薄力粉・すりおろした山芋（ふわふわの秘訣）・水・和風だしの素・しょうゆを混ぜる。キャベツは粗みじん切り、紅しょうがは刻む。^生地に卵・キャベツ・天かす・紅しょうがを加えて、空気を含ませるようにさっくり混ぜる（混ぜすぎないとふんわり）。^フライパンにサラダ油大さじ1/2を中火で熱し、焼きそば麺を広げて2分炒め、ウスターソースで下味をつけて取り出す。^フライパンにサラダ油を足して生地を丸く流し、豚バラ肉を並べ、その上に焼きそばをのせる。^返して5分、もう一度返して3分焼く（押さえつけない）。焼きそばの面を上にして、もう一度返し、麺の面をカリッとさせる。^お好み焼きソース・マヨネーズ・かつお節・青のりをかける。|味の決め手は「山芋入りの生地」と「麺にウスターで下味」。大阪のお好み焼き屋の味。^押さえつけないと、ふんわり。
とん平焼き|豚バラ肉:120g,キャベツ:3枚,もやし:1/4袋,卵:3個,かつお節:1パック,小ねぎ:適量|サラダ油:小さじ2,塩:少々,黒こしょう:少々,ウスターソース:小さじ1,和風だしの素:少々,牛乳:大さじ1,お好み焼きソース:大さじ2,マヨネーズ:大さじ1,からし:少々,青のり:少々|豚バラ肉は5cm長さ、キャベツはせん切り。^フライパンにサラダ油小さじ1を中火で熱し、豚バラ肉を2分、カリッとするまで焼く。キャベツ・もやしを加えて1分炒め、塩・黒こしょう・ウスターソースで味をつける（具に下味をつけると、ぼやけない）。取り出す。^卵・牛乳・和風だしの素を混ぜる（だし入りでふんわり、うまみのある卵に）。^フライパンに残りのサラダ油を中火で熱し、卵液を流して大きく広げる。^半熟になったら、具を中央にのせ、両側から卵で包む。皿に返して盛る。^お好み焼きソース・からしマヨネーズ（マヨネーズにからしを混ぜる。大阪の鉄板焼き店の定番）・かつお節・青のり・小ねぎをかける。|味の決め手は「だし入りの卵」と「からしマヨネーズ」。大阪の鉄板焼き屋の味。^豚バラをカリカリに焼くと、香ばしさが格段にアップ。
キムチチヂミ|白菜キムチ:150g,豚バラ肉:80g,にら:1/2束,玉ねぎ:1/4個|薄力粉:60g,片栗粉:大さじ3,米粉:大さじ1,キムチの汁:大さじ3,水:60ml,卵:1個,鶏がらスープの素:小さじ1/2,コチュジャン:小さじ1,ごま油:大さじ3,しょうゆ:大さじ1,酢:大さじ1,砂糖:小さじ1/2,粉唐辛子:少々,いりごま:少々,小ねぎ:少々|キムチは細かく刻む（汁も取っておく。キムチの汁が生地に深い味と色をつける）。豚バラ肉は2cm幅、にらは3cm長さ、玉ねぎは薄切り。^生地：薄力粉・片栗粉・米粉（あれば。カリッと仕上がる）・キムチの汁・冷水・卵・鶏がらスープの素・コチュジャンを混ぜる（冷たい水で混ぜると、グルテンが出ずパリッと）。^キムチ・にら・玉ねぎを加えて混ぜる。^フライパンにごま油大さじ2を中火で熱し、豚バラ肉を並べて焼き、上から生地を流し広げる（薄く広げるのがパリッとさせるコツ）。^3分焼いて返し、フライ返しで押さえながら残りのごま油を鍋肌から加えて3分、カリッとするまで焼く（多めのごま油で揚げ焼きにするのが本場流）。^たれ：しょうゆ・酢・砂糖・粉唐辛子・いりごま・小ねぎを混ぜて添える。|味の決め手は「キムチの汁」と「多めのごま油で揚げ焼き」。韓国料理店のカリカリチヂミ。^生地は薄く広げて、押さえながら焼くとパリッ。
ねぎ入り卵焼き|卵:3個,小ねぎ:6本,しらす:15g|だし:大さじ3,薄口しょうゆ:小さじ1,みりん:小さじ1,砂糖:小さじ1,塩:少々,サラダ油:適量,大根:50g|卵はボウルに割り入れ、白身を切るように溶く（泡立てない。なめらかな仕上がりに）。^だし・薄口しょうゆ・みりん・砂糖・塩を加えて混ぜ、小口切りの小ねぎ・しらす（うまみと塩気のアクセント）を加える。^卵焼き器を中火で熱し、油をペーパーで薄く塗る。卵液の1/4を流し、気泡を菜箸でつぶしながら、半熟のうちに奥から手前に巻く。^巻いた卵を奥に移し、油を塗って卵液を流し、巻いた卵の下にも流し入れて巻く。これを繰り返す（半熟のうちに巻くと、層がくっついてふっくら）。^巻きすで包んで5分おき、形を整える。^切り分けて、大根おろしを添える。|味の決め手は「だしたっぷり」と「しらす」。ふわっとジューシーなだし巻き。^大根おろしにしょうゆをたらして添えて。
明太卵焼き|卵:3個,辛子明太子:1/2腹,大葉:4枚,スライスチーズ:1枚|だし:大さじ3,みりん:小さじ1,砂糖:小さじ1,薄口しょうゆ:少々,サラダ油:適量,マヨネーズ:少々|卵・だし・みりん・砂糖・薄口しょうゆを混ぜる（明太子に塩気があるので、しょうゆは控えめ）。^明太子は薄皮を除いて棒状に整える（ほぐさずに丸ごと巻くと、断面がきれい）。^卵焼き器を中火で熱し、油を塗って卵液の1/3を流す。^半熟になったら、手前に大葉を並べ、チーズ（コクがプラス）・明太子をのせて、芯にして手前から巻く。^奥に移して油を塗り、残りの卵液を2回に分けて流しては巻く。^巻きすで形を整え、切り分ける。明太マヨ（明太子少々＋マヨネーズ）を添えて。|味の決め手は「明太子を芯にして巻く」ことと「大葉＋チーズ」。断面も美しい居酒屋の一品。^明太子は火が入りすぎないよう、芯にして巻く。
明太ポテトサラダ|じゃがいも:3個,辛子明太子:1腹,きゅうり:1/2本,玉ねぎ:1/8個,ゆで卵:1個|塩:小さじ1/4,酢:小さじ2,砂糖:小さじ1/2,マヨネーズ:大さじ3,クリームチーズ:20g,レモン汁:小さじ1,黒こしょう:少々,小ねぎ:適量|じゃがいもは皮をむいて4等分にし、水から15分ゆでる。湯を捨てて弱火で水分を飛ばし、粉ふきにする。^熱いうちに粗くつぶし、塩・酢・砂糖をふって混ぜ、下味をつける（熱いうちの下味で、ぼやけないポテサラに）。^きゅうりは薄い輪切りにして塩もみし、絞る。玉ねぎは薄切りにして水にさらし、絞る。ゆで卵は粗く刻む。^明太子は薄皮を除いてほぐし、マヨネーズ・やわらかくしたクリームチーズ（コクとなめらかさ）・レモン汁と混ぜる。^じゃがいもが冷めたら、明太マヨ・きゅうり・玉ねぎ・ゆで卵を加えてさっくり混ぜ、黒こしょうで調える。^器に盛り、飾り用の明太子・小ねぎをのせる。|味の決め手は「熱いうちに酢で下味」と「クリームチーズ」。居酒屋の人気ポテサラ。^レモン汁で、明太子の生臭さが消えて味が締まる。
ごまだれ冷やし中華|中華麺:2玉,ハム:4枚,蒸し鶏:80g,きゅうり:1本,卵:2個,トマト:1個,もやし:1/2袋,紅しょうが:適量|練りごま:大さじ3,すりごま:大さじ1,しょうゆ:大さじ2.5,酢:大さじ2,黒酢:小さじ1,砂糖:大さじ1.5,鶏がらスープの素:小さじ1/2,水:大さじ3,ごま油:小さじ1,ラー油:少々,しょうが:少々,にんにく:少々,砂糖:小さじ1,塩:少々,サラダ油:少々,からし:少々|ごまだれ：練りごま・すりごまに、しょうゆ・酢・黒酢・砂糖・鶏がらスープの素（少量の湯で溶く）・水を少しずつ加えて混ぜる（少しずつ加えると分離しない）。ごま油・ラー油・すりおろしにんにく・しょうがを加え、冷蔵庫で冷やす（中華料理店の、コクのある濃厚ごまだれ）。^錦糸卵：卵に砂糖・塩を加え、薄焼きにしてせん切り。^もやしは1分ゆでて冷まし、きゅうり・ハム・蒸し鶏はせん切り、トマトはくし形。^中華麺を表示時間通りゆで、冷水でもみ洗いしてぬめりを取り、氷水で締めて水気をしっかり切る（水気が残るとたれが薄まる）。^器に麺を盛り、具を放射状に彩りよく並べる。^ごまだれをたっぷりかけ、からし・紅しょうがを添える。|味の決め手は「練りごま＋すりごま」と「黒酢」。中華料理店の濃厚ごまだれ。^麺は氷水で締め、水気をしっかり切って。
カレードリア|ご飯:360g,ピザ用チーズ:70g,卵:2個,玉ねぎ:1/4個,ベーコン:2枚|バター:15g,カレールウ:2かけ,水:250ml,ケチャップ:小さじ2,中濃ソース:小さじ1,はちみつ:小さじ1,牛乳:大さじ2,カレー粉:小さじ1/2,コンソメ:小さじ1/2,パン粉:大さじ2,粉チーズ:大さじ1,パセリ:少々|カレーソース：鍋にバター5gを溶かし、みじん切りの玉ねぎ・細切りのベーコンを3分炒める。水を加えて煮立て、火を止めてルウを溶かし、ケチャップ・中濃ソース・はちみつ・牛乳を加えて弱火で5分煮込む（隠し味の調味料で、カレー専門店のコクに）。^カレーピラフ：ご飯に残りのバター・カレー粉・コンソメを混ぜてフライパンで2分炒める（ご飯にもカレー風味をつけると、ドリア全体に一体感）。^耐熱皿にピラフを敷き、カレーソースをかける。^中央に卵を割り落とし、周りにチーズ・パン粉・粉チーズを散らす。^トースター（または230℃のオーブン）で8〜10分、チーズがこんがり、卵が半熟になるまで焼く（卵は黄身が半熟がおいしい）。^パセリを散らす。|味の決め手は「カレーピラフ」と「隠し味入りのカレーソース」。^卵の半熟黄身を崩して、混ぜて食べて。
焼きカレー|ご飯:360g,合いびき肉:150g,玉ねぎ:1/2個,なす:1本,ピザ用チーズ:70g,卵:2個|サラダ油:小さじ2,バター:10g,にんにく:1片,しょうが:1かけ,カレー粉:小さじ1,カレールウ:2かけ,水:200ml,ケチャップ:大さじ1,中濃ソース:小さじ2,ウスターソース:小さじ1,はちみつ:小さじ1,インスタントコーヒー:少々,ガラムマサラ:少々,パン粉:大さじ1,粉チーズ:大さじ1|キーマカレー：玉ねぎ・にんにく・しょうがはみじん切り。フライパンにサラダ油とバターを中火で熱し、玉ねぎを8分、茶色く炒める（茶色い玉ねぎで、深い甘み）。^ひき肉を加えて焼き付けるように4分、カレー粉を加えて1分炒める（カレー粉を炒めて香りを立たせる）。^水を加えて煮立て、火を止めてルウを溶かし、ケチャップ・中濃ソース・ウスターソース・はちみつ・コーヒー（北九州・門司港の名店のような深いコク）を加えて弱火で5分。ガラムマサラで香りを立てる。^なすは1cm厚の輪切りにして焼き色をつける。^耐熱皿にご飯を敷き、キーマカレーをかけ、なすをのせる。中央に卵を割り落とし、チーズ・パン粉・粉チーズを散らす。^230℃のオーブン（またはトースター）で10分、チーズがこんがりするまで焼く。|味の決め手は「茶色い玉ねぎ」と「隠し味のコーヒー＋ガラムマサラ」。門司港の名物の味。^焦げたチーズとカレーの香ばしさが絶品。
ドライカレー|合いびき肉:250g,玉ねぎ:1個,にんじん:1/3本,ピーマン:1個,セロリ:1/4本,ご飯:400g,卵:2個|サラダ油:大さじ1,バター:10g,にんにく:2片,しょうが:1かけ,クミン:小さじ1/2,カレー粉:大さじ1.5,ガラムマサラ:小さじ1/2,トマト缶:1/4缶,ケチャップ:大さじ2,ウスターソース:大さじ1,しょうゆ:小さじ1,はちみつ:小さじ1,コンソメ:小さじ1,塩:少々,黒こしょう:少々,レーズン:大さじ2,パセリ:少々|玉ねぎ・にんじん・ピーマン・セロリ・にんにく・しょうがはすべてみじん切りにする（細かく揃えると、具とルウが一体になる）。^フライパンにサラダ油・バター・クミン（ホールなら）を入れて弱火で1分、香りを出す。^玉ねぎ・にんにく・しょうがを加えて中火で8分、茶色くなるまでじっくり炒める（ここが深い甘みとコクの源）。^ひき肉を加えて焼き付けるように4分炒め、にんじん・セロリ・ピーマンを加えて2分。カレー粉・ガラムマサラを加えて1分、香りが立つまで炒める。^トマト缶・ケチャップ・ウスターソース・しょうゆ・はちみつ・コンソメ・レーズン（甘みとアクセント）を加えて弱めの中火で8分、水分がなくなるまで炒め煮にする。塩・黒こしょうで調える。^ご飯に盛り、目玉焼き（半熟）をのせ、パセリを散らす。|味の決め手は「玉ねぎを茶色く炒める」ことと「トマト＋ウスター＋レーズン」。洋食屋の本格ドライカレー。^水分をしっかり飛ばすと、うまみが凝縮。
オムカレー|ご飯:360g,卵:5個,玉ねぎ:1/2個,合いびき肉:100g|サラダ油:小さじ1,バター:25g,カレールウ:2かけ,水:300ml,ケチャップ:小さじ2,中濃ソース:小さじ1,はちみつ:小さじ1,インスタントコーヒー:少々,牛乳:大さじ2,生クリーム:大さじ2,塩:少々,パセリ:少々|カレー：玉ねぎはみじん切り。鍋にサラダ油・バター5gを熱し、玉ねぎを8分、茶色く炒める。ひき肉を加えて3分炒める。^水を加えて5分煮て、火を止めてルウを溶かす。ケチャップ・中濃ソース・はちみつ・コーヒー（隠し味のコク）を加えて弱火で5分煮込む。^卵2.5個・牛乳大さじ1・生クリーム大さじ1・塩少々を混ぜてこす（1人分）。^フライパンにバター10gを強めの中火で熱し、卵液を一気に流して、菜箸で大きくかき混ぜながら20秒、半熟にする。^火から外して手前に寄せ、オムレツ形に整える（中はとろとろ）。^皿にご飯を盛ってオムレツをのせ、ナイフで切れ目を入れて開き、周りにカレーをたっぷりかける。パセリを散らす。|味の決め手は「生クリーム入りのとろとろオムレツ」と「隠し味入りのカレー」。^オムレツを開いて、カレーと絡めて食べて。

function typeOf(r){

  if(c==='手作り麺・皮') return /麺|うどん|そば|パスタ/.test(n)?'zaru':'disc';

    if(/かき氷|アイス|パフェ|フローズン/.test(n)) return 'ice';
    if(/プリン|ブリュレ|パンナコッタ|杏仁|ゼリー|ムース|寒天|ようかん|わらび/.test(n)) return /芋ようかん/.test(n)?'sweetpotato':'pudding';
    if(/芋|いも|ポテト/.test(n)) return 'sweetpotato';
    if(/タピオカ|ポンチ/.test(n)) return 'glass';
    if(/団子|みたらし|五平/.test(n)) return /五平/.test(n)?'onigiri':'skewer';
    if(/ごま団子|アンダギー/.test(n)) return 'balls';
    if(/大福|餅|もち|おはぎ|白玉|ぜんざい|しるこ|どら焼き|桜|ずんだ/.test(n)) return 'wagashi';
    if(/クレープ/.test(n)) return 'disc';
    return 'baked'; }
  if(/ガレット|モダン焼き/.test(n)) return 'disc';
  if(/とん平焼き|オムそば/.test(n)) return 'egg';
  if(/天津麺/.test(n)) return 'noodlebowl';
  if(/オムハヤシ/.test(n)) return 'rice';
  if(/カツ煮/.test(n)) return 'nimono';

  if(/ゆで卵|目玉焼き/.test(n)) return 'egg';

  if(/ラーメン|ちゃんぽん|担々麺|フォー|冷やし中華|冷麺|うどん|そば|きしめん|ほうとう|にゅうめん|太平燕|サンマーメン|富山ブラック|チャジャン麺/.test(n)) return /冷やし中華/.test(n)?'friednoodle':'noodlebowl';

  h+=Math.max(-8,Math.min(16,(fib-2)*4));
  h-=Math.max(0,Math.min(20,(salt-2)*10));
  const fr=kcal?F*9/kcal:0; h-=Math.max(0,Math.min(18,(fr-0.3)*60));

  if(cat==='おやつ') h-=15;
  return Math.round(Math.max(0,Math.min(100,h)));
}

function flavorsOf(names,dish){
  const sn=names.join(' '), f=new Set();
  if(/味噌/.test(sn)) f.add('miso');
  if(/ポン酢/.test(sn)) f.add('ponzu');
  if(/カレー/.test(dish)||/カレールウ|カレーペースト/.test(sn)) f.add('curry');
  if(/コチュジャン|キムチ/.test(sn)) f.add('gochu');
  if(/オイスター/.test(sn)) f.add('oyster');
  if(/練りごま|すりごま/.test(sn)) f.add('goma');
  if(/ナンプラー/.test(sn)) f.add('ethnic');
  if(/バター/.test(sn)&&/しょうゆ/.test(sn)) f.add('butter');
  if(/トマト缶|ケチャップ/.test(sn)) f.add('tomato');
  if(/生クリーム|シチュールウ/.test(sn)||(/牛乳/.test(sn)&&/薄力粉|バター/.test(sn))) f.add('cream');
  if((/にんにく/.test(sn)&&/オリーブ/.test(sn))||/ガーリック|ペペロンチーノ/.test(dish)) f.add('garlic');
  if(/梅干し|大葉/.test(sn)) f.add('umeshiso');
  if(/柚子こしょう/.test(sn)) f.add('yuzu');
  if(/レモン/.test(sn)) f.add('shiolemon');
  if(/しょうゆ/.test(sn)&&/砂糖|みりん/.test(sn)) f.add('amakara');
  if(/しょうゆ|だし/.test(sn)) f.add('wa');
  return f;
}
