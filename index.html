  const ms=new Set(); for(const [re,m] of MS_RULES) if(re.test(d.name)) ms.add(m);
  if(d.cat==='ご飯もの') ms.add('don'); if(d.cat==='麺'&&!ms.has('pasta')) ms.add('udon'); if(d.cat==='鍋') ms.add('nabe');
  const seas=new Set([...d.flags].filter(x=>SEA[x]));
  const seasonIng=ings.find(n=>{const e=dbGet(n); return e&&e.sea&&inSeason(e.sea);});
  ings.forEach(n=>{const e=dbGet(n); if(e&&e.sea) seas.add(e.sea);});
  const sn=all.map(x=>x[0]).join(' ');
  const kcal=Math.round(K);
  let tg=T.classic;
  const SAUCE=d.cat==='タレ・調味料'||d.cat==='手作り麺・皮';
  if(kcal<=400&&d.cat!=='おやつ') tg|=T.diet;
  if(P>=25) tg|=T.protein;
  if(C<=15&&d.cat!=='おやつ') tg|=T.lowcarb;
  if(d.t<=15) tg|=T.quick;
  const SWEET=d.cat==='おやつ';
  if(fib>=3&&vegG>=100&&!SWEET&&!SAUCE) tg|=T.veg;
  if(salt<=1.5&&!SWEET&&!SAUCE) tg|=T.salt;
  if([...d.flags].includes(SEASON)||seasonIng) tg|=T.season;
  if(d.flags.has('warm')||ms.has('soup')||ms.has('nabe')||d.cat==='汁物'||d.cat==='鍋') tg|=T.warm;
  if(d.flags.has('fresh')||ms.has('salad')) tg|=T.fresh;
  if(kcal>=650) tg|=T.rich;
  if(d.flags.has('spicy')||SPICY_RE.test(sn)) tg|=T.spicy;
  if(d.flags.has('bento')) tg|=T.bento;
  if(d.cat==='ご飯もの'||d.cat==='麺') tg|=T.one;
  if(d.flags.has('kids')) tg|=T.kids;
  if(d.flags.has('party')) tg|=T.party;
  if(SAUCE) tg=d.flags.has('spicy')?T.spicy:0;
  const main=ings.find(n=>{const e=dbGet(n); return e&&/meat|fish|egg|soy/.test(e.cat);});
  const firstVeg=ings.find(n=>{const e=dbGet(n); return e&&e.col;});
  const glyph=d.g||CAT_GLYPH[d.cat]||(main?((PR.find(p=>p.n===main)||{}).s||main.slice(0,1)):'菜');
  const nameH=hira([d.name,d.read,...d.alias].join('|')).toLowerCase(), nameOnly=hira([d.name,...d.alias].join('|')).toLowerCase();
  const region=d.region||'';
  return {id,named:true,d,baseName:d.base||'',name:d.name,region,area:region?AREA_OF[region]:'',cu:d.cu,cat:d.cat,t:d.t,kcal,P:R1(P),F:R1(F),C:R1(C),fib:R1(fib),salt:R1(salt),
    h:healthScore(kcal,P,F,fib,salt,d.cat),tg,ings,all:allN,fls,ms,seas:[...seas],seasonIng,
    label:CAT_LABEL[d.cat]||d.cat,glyph,sub:main?(dbGet(main)?.n||main).replace(/\(.+?\)/,''):(firstVeg||d.cat),
    col:firstVeg?dbGet(firstVeg).col:'var(--yolk)',k1:main||ings[0],k2:firstVeg||ings[1]||'',mk:'n'+d.cat,fl1:[...fls][0]||'',
    nameH,nameOnly,textH:nameH+'|'+hira(allN.join(' '))+'|'+d.cu+'|'+d.cat+'|'+region};
}

/* ===================== 組み合わせレシピ ===================== */
function makeCombo(id,m,p,v,f){
  const pg=p.g*(m.pM||1), vg=120*(m.vM||1);
  const oil=m.oil+(v.n==='なす'&&m.oil>=5?4:0);
  const cb=m.carb?CARB[m.carb]:null;
  const soupy=!!m.soupy&&!(m.id==='udon'&&f.id==='butter');
  const kcal=p.k*pg/100+v.k*vg/100+oil*9+f.k+(cb?cb.k:0);
  const P=p.p*pg/100+v.p*vg/100+(cb?cb.p:0);
  const F=p.f*pg/100+v.f*vg/100+oil+f.fat+(cb?cb.f:0);
  const C=p.c*pg/100+v.c*vg/100+f.c+(cb?cb.c:0);
  const fib=p.fib*pg/100+v.fib*vg/100+(cb?cb.fib:0);
  const salt=f.s+(soupy?0.6:0)+(cb?cb.s:0)+p.salt;
  let t=m.t+(v.hard&&/ni|soup|nabe|mushi|itame|yaki|udon/.test(m.id)?5:0);
  if(m.id==='age'&&p.cat==='soy') t-=5;
  let pat=(m.ov&&m.ov[f.id])||m.nm;
  if(p.n==='卵'&&EGG[m.id]&&EGG[m.id][f.id]) pat=EGG[m.id][f.id];
  const name=pat.replace('{p}',p.nm).replace('{v}',v.nm).replace('{w}',f.w);
  const K=Math.round(kcal);
  let tg=0;
  if(K<=400) tg|=T.diet; if(P>=25) tg|=T.protein; if(C<=15) tg|=T.lowcarb; if(t<=15) tg|=T.quick; if(fib>=4) tg|=T.veg; if(salt<=1.5) tg|=T.salt;
  const seasonIng=inSeason(v.sea)?v.n:inSeason(p.sea)?p.nm:null;
  if(seasonIng) tg|=T.season;
  if(m.warm||soupy) tg|=T.warm; if(f.fresh||m.fresh) tg|=T.fresh;
  if(K>=650||(f.rich&&K>=480)||p.n==='豚バラ肉') tg|=T.rich; if(f.spicy) tg|=T.spicy;
  if(/itame|yaki|age/.test(m.id)) tg|=T.bento; if(m.one) tg|=T.one;
  if(CLASSIC.has(p.n+'|'+v.n)) tg|=T.classic;
  const allN=[p.n,v.n,...f.ing.map(x=>canon(x[0].replace(/\(.+?\)/,''))),...m.ex.map(x=>x[0]),...(cb?cb.ing.map(x=>x[0].replace(/\(.+?\)/,'')):[])];
  const nameH=hira(name).toLowerCase();
  return {id,named:false,m,p,v,f,name,cu:f.cu,cat:m.cat,t,kcal:K,P:R1(P),F:R1(F),C:R1(C),fib:R1(fib),salt:R1(salt),soupy,
    h:healthScore(K,P,F,fib,salt,m.cat),tg,ings:[p.n,v.n],all:allN,fls:new Set([f.id]),ms:new Set([m.id]),seas:[p.sea,v.sea].filter(Boolean),seasonIng,
    label:m.l,glyph:p.s,sub:v.nm,col:v.col,k1:p.n,k2:v.n,mk:m.id,fl1:f.id,
    nameH,nameOnly:nameH,textH:nameH+'|'+hira(p.n+' '+v.n+' '+f.w)+'|'+f.cu+'|'+m.l};
}

/* かんたん／本格 の切り替え */
let MODE=(()=>{try{return JSON.parse(localStorage.getItem('rcp4-mode'))||'pro';}catch(e){return 'pro';}})();
function applyMode(d){ if(d.V){ const v=d.V[MODE]; d.ings=v.ings; d.seas=v.seas; d.steps=v.steps; d.tips=v.tips; } }
NAMED.forEach(applyMode);
const ALL=[];
NAMED.forEach(d=>ALL.push(makeNamed(ALL.length,d)));
function setMode(m){ if(m===MODE) return; MODE=m; try{localStorage.setItem('rcp4-mode',JSON.stringify(m));}catch(e){}
  for(let i=0;i<NAMED_N;i++){ const r=ALL[i]; if(!r.d.V) continue; applyMode(r.d); Object.assign(r,makeNamed(i,r.d)); } }
const modeInfo=d=>{ const f=v=>({n:v.ings.length+v.seas.length,st:v.steps.length}); return {easy:f(d.V.easy),pro:f(d.V.pro)}; };
const NAMED_N=ALL.length;
for(const m of M) for(const p of PR){ if(m.noP.has(p.n)) continue;
  for(const v of VG){ if(m.noV.has(v.n)) continue;
    for(const fid of m.fls){ const f=FL[fid];
      if(dropped(p,v,f)) continue;
      if(p.n==='卵'&&m.id==='ni'&&!EGG.ni[fid]) continue;
      ALL.push(makeCombo(ALL.length,m,p,v,f)); } } }

/* ===================== 作り方（組み合わせ） ===================== */
function seasoningText(f){return f.ing.map(x=>x[0].replace(/\(.+?\)/,'')).join('・');}
function comboSteps(r){
  const {m,p,v,f}=r, S=seasoningText(f);
  const cutV=`${v.n}は${v.cut}`, cutP=`${p.n}は${p.prep}`, cuts=`${cutV}。${cutP}。`;
  const vSt=v.hard?`ふたをして弱めの中火で3〜4分蒸し焼きにし、竹串がすっと通るまで火を通す`:`強火にして1〜2分、シャキッと感が残るように手早く炒め合わせる`;
  const miso=f.id==='miso'?'（味噌は火を弱めてから溶き入れ、煮立てない）':'';
  const lateAdd=p.n==='卵'?'溶き卵を細く回し入れ、10秒待ってふんわり浮いたら火を止める':p.n==='あさり(殻つき)'?'あさりを加えてふたをし、2〜3分、口が開くまで煮る（開いたらすぐ火を止める）':p.n==='木綿豆腐'?'豆腐を加えて2分、中まで温める':'ツナを加えて1分ひと煮する';
  switch(m.id){
  case 'itame': return [cuts,`${S}をよく混ぜ合わせておく（炒め始めたら手を止めないよう、先に準備しておくのが炒め物の基本）。`,`フライパンにサラダ油を中火で1分しっかり熱し、${p.n}を${p.cook}。`,`${v.n}を加え、${vSt}。`,`合わせ調味料をもう一度混ぜてから鍋肌に回し入れ、強火で30秒、全体に絡めて照りが出たらすぐ器に盛る。`];
  case 'ni':
    if(p.n==='卵') return [`${cutV}。卵は溶きほぐす。`,`鍋に水150mlと${S}を入れて中火で煮立て、${v.n}を入れて${v.hard?'落としぶたをして弱めの中火で10':'4'}分、やわらかくなるまで煮る。`,`溶き卵を回し入れてふたをし、弱火で1分、卵が半熟になったら火を止める（余熱で固まりすぎないよう、すぐに器へ）。`];
    if(p.late) return [cuts,`鍋に水200mlと${S}を入れて中火で煮立てる。`,`${v.n}を入れ、落としぶた（アルミホイルでも可）をして弱めの中火で${v.hard?'12〜15':'5〜6'}分、竹串がすっと通るまで煮る。`,`${lateAdd}。`,`火を止めて10分ほどおき、味を含ませる（煮物は冷めるときに味がしみる）。`];
    return [cuts,`鍋に水200mlと${S}を入れて中火で煮立てる。`,`${p.n}を入れ、再び煮立ったらアクを丁寧にすくい、3分煮る（アクを取ると煮汁が澄み、雑味がなくなる）。`,`${v.n}を加え、落としぶたをして弱めの中火で${v.hard?'12〜15':'5〜6'}分、竹串がすっと通るまで煮る。`,`落としぶたを取って中火で2分、煮汁を回しかけながら少し煮詰める。火を止めて10分おくと味がしみる。`];
  case 'mushi': return [cuts,`フライパンに${v.n}を敷き、${p.n}を重ならないようにのせて酒大さじ2・水大さじ2をふる。`,`ふたをして中火にかけ、蒸気が出てきたら弱火にして${v.hard?10:7}分蒸す（耐熱皿にのせ、ふんわりラップをして600Wで${v.hard?7:5}分加熱してもよい）。${p.cat==='meat'?'肉に竹串を刺して透明な汁が出ればOK。':''}`,`${S}を合わせ、${f.id==='butter'?'熱いうちにのせ、溶かしながら全体に絡める':'食べる直前にかける'}。`];
  case 'yaki': return [`${cutP}。`,`${cutV}。`,`フライパンにサラダ油を中火で熱し、${p.n}を${p.cook}。空いたところに${v.n}を並べ、${v.hard?'ふたをして3〜4分、両面に焼き色がつき竹串が通るまで':'1〜2分、焼き色がつくまで'}焼く。`,`余分な脂をペーパーで拭き取り（たれが薄まらず、きれいに絡む）、${S}を加えて中火で1分、煮詰めるように全体に絡める。`];
  case 'age': return [`${p.n}は${p.prep.replace(/して塩少々・酒小さじ1をもみ込み、片栗粉を薄くまぶす（[^）]*）/,'する')}。${S}の半量を${p.cat==='soy'?'からめ':'もみ込み'}、10分おく。`,`${cutV}。ペーパーで水気をしっかり拭く（油はね防止）。`,`${p.n}の汁気を軽く拭き、片栗粉を全体にまぶして2分おき、粉をなじませる。`,`フライパンに油を1cm深さに入れて170℃（菜箸を入れると細かい泡が出る）に熱し、${v.n}を${v.hard?'2〜3':'1'}分素揚げにして取り出す。続けて${p.n}を入れ、${p.cat==='meat'?'途中で返しながら4〜5分':'途中で返しながら2〜3分'}、カリッときつね色になるまで揚げ焼きにする。`,f.id==='ponzu'?`油を切り、熱いうちにポン酢しょうゆにひたして5分おき、味をしみ込ませる。`:`油を切り、熱いうちに残りの調味料と和えて器に盛る。`];
  case 'soup':
    if(p.late) return [`${cutV}（スープ用に1cm角程度に小さめに）。${cutP}。`,`鍋に少量の油を中火で熱し、${v.n}を1〜2分炒める（炒めると野菜の甘みが出る）。`,`水500mlを加えて煮立て、アクを取って弱めの中火で${v.hard?12:6}分煮る。`,`${S}を加えて味を調え${miso}、${lateAdd}。`];
    return [`${cutV}（スープ用に1cm角程度に小さめに）。${cutP}。`,`鍋に少量の油を中火で熱し、${p.n}を2分炒めてうまみを出し、${v.n}を加えて1分炒める。`,`水500mlを加えて強火で煮立て、アクを丁寧にすくって弱めの中火で${v.hard?12:6}分煮る。`,`${S}を加えて味を調える${miso}。味を見て、薄ければ塩少々で。`];
  case 'nabe': return [cuts,`土鍋に水600mlと${S}を入れて中火で煮立てる${miso}。`,`${v.hard?v.n+'を先に入れて5分煮て、':''}${p.n}${v.hard?'':'と'+v.n}を加えてふたをし、中火で${p.cat==='fish'?'4〜5':'5〜6'}分煮る。アクが出たらすくう。`,`${p.n}に火が通ったら食べごろ。残ったスープにご飯を入れて3分煮て溶き卵を回し入れれば雑炊に。`];
  case 'salad': {
    const pb={'卵':'卵は沸騰した湯に入れて9分ゆで、冷水にとって殻をむき、食べやすく切る。','ツナ缶(水煮)':'ツナ缶は缶汁を軽く切る。','大豆(水煮)':'大豆(水煮)は水気を切る。','木綿豆腐':'木綿豆腐はキッチンペーパーで包んで15分水切りし、一口大に切る。','厚揚げ':'厚揚げはトースターで5分、こんがり焼き、一口大に切る。'}[p.n]
      ||(p.fish?`${p.n}は塩少々をふって魚焼きグリルの中火で7〜8分焼き、皮と骨を除いて身を大きめにほぐす。`:`${p.n}は食べやすく切り、沸騰した湯に入れて火を止め、ふたをして${p.cat==='meat'?'8〜10':'2〜3'}分おいて余熱で火を通す（しっとりやわらかく仕上がる）。ざるに上げて冷ます。`);
    return [pb,v.raw?`${cutV}。冷水に5分さらしてシャキッとさせ、ざるに上げて水気をしっかり切る（水気が残るとドレッシングが薄まる）。`:`${cutV}。沸騰した湯で${v.hard?'3〜4':'1〜2'}分ゆでるか、レンジ600Wで${v.hard?3:2}分加熱し、広げて冷まして水気を切る。`,`ボウルに${S}を入れ、オリーブオイル大さじ1を少しずつ加えながら混ぜてドレッシングを作る。`,`食べる直前に${p.n}と${v.n}を加えてさっくり和え、器に盛る。`];}
  case 'don': return [cuts,`フライパンにサラダ油を中火で熱し、${p.n}を${p.cook}。`,`${v.n}を加え、${vSt}。`,`${S}を加えて中火で1〜2分、汁気が少し残るくらいまで煮絡める（ご飯にしみるたれを少し残すのが丼のコツ）。`,`器に温かいご飯を盛り、具をたれごとのせる。`];
  case 'pasta': return [`鍋に湯2Lを沸かして塩大さじ1を入れ、スパゲッティを表示時間より1分短くゆでる（1.6mmなら約6分）。`,cuts,`フライパンにオリーブオイル大さじ1を中火で熱し、${p.n}を${p.cook}。${v.n}を加えて${v.hard?'ふたをして3分蒸し焼きにする':'1〜2分炒める'}。`,`${S}とゆで汁大さじ3を加えて揺すり、ソースをとろりと乳化させる。`,`ゆで上がったパスタを加え、中火で30秒〜1分、手早く和えて味を絡める。`];
  case 'gratin': return [cuts,`マカロニは塩を入れた湯で表示時間通りゆでる。オーブントースターを温めておく。`,`フライパンにバター10gを中火で溶かし、${p.n}を${p.cook}。${v.n}を加えて2分炒める。`,`薄力粉大さじ1をふり入れて1分炒め、牛乳200mlを少しずつ加えて混ぜ、${S}を加える。中火で3〜4分、混ぜながらとろみがつくまで煮てマカロニを混ぜる。`,`耐熱皿に入れてピザ用チーズをのせ、オーブントースターで8〜10分、こんがり焼き色がつくまで焼く。`];
  case 'takikomi': return [`米は洗ってざるに上げ、30分おく。`,`${cutV}（ご飯になじむよう1cm角程度に小さめに）。${cutP}。`,`炊飯器に米と${S}を入れ、1合の目盛りまで水を注いでひと混ぜする（調味料を入れてから水加減するのがポイント）。`,`${p.n}と${v.n}を米の上にのせ（混ぜないと炊きムラが出ない）、普通に炊く。`,`炊き上がったら10分蒸らし、しゃもじで底から大きく混ぜる。`];
  case 'udon':
    if(f.id==='butter') return [cuts,`うどんは袋のまま電子レンジ600Wで1分温めてほぐしやすくする。`,`フライパンにサラダ油少々を中火で熱し、${p.n}を${p.cook}。${v.n}を加えて${v.hard?'ふたをして3分':'1分'}炒める。`,`うどんを加えてほぐしながら2分炒め、${S}を加えて30秒、全体に絡める。`];
    if(p.late) return [cuts,`鍋に水600mlと${S}を入れて中火で煮立て、${v.n}を入れて${v.hard?8:4}分煮る。`,`うどんを加えて2分温め、${lateAdd}。`,`汁ごと温めた器に盛る。`];
    return [cuts,`鍋に水600mlと${S}を入れて中火で煮立てる。`,`${p.n}を入れてアクを取り、${v.n}を加えて${v.hard?8:5}分、火が通るまで煮る。`,`うどんを加えて2分温め、汁ごと温めた器に盛る。`];
  }
  return [];
}
const steps=r=>r.named?r.d.steps:comboSteps(r);


/* ===================== 手順の強調とタイマー ===================== */
function stepHTML(t){
  let h=esc(t);
  h=h.replace(/【([^】]+)】/g,'<b class="lab">$1</b>');
  h=h.replace(/（[^（）]*(?:（[^（）]*）[^（）]*)*）/g,m=>m.length>=6?`<span class="note">${m}</span>`:m);
  h=h.replace(/(ごく弱火|弱めの中火|強めの中火|弱火|中火|強火)/g,m=>`<b class="heat ${/強/.test(m)?'h3':/中火/.test(m)?'h2':'h1'}">${m}</b>`);
  h=h.replace(/(\d+)℃/g,'<b class="temp">$1℃</b>');
  h=h.replace(/(\d+(?:\.\d+)?)(?:〜(\d+(?:\.\d+)?))?(時間|分半|分|秒)(?![立目の量])/g,(m,a,b,u)=>{
    const mul=u==='時間'?3600:u==='秒'?1:60; let sec=Math.round(+a*mul)+(u==='分半'?30:0);
    if(sec<5||sec>6*3600) return m; return `<button type="button" class="tmr" data-sec="${sec}" aria-label="${m}のタイマーを開始">${m}</button>`;});
  return h;
}

function splitSent(t){ const out=[]; let c='',d=0; for(const ch of t){ c+=ch; if(ch==='（'||ch==='(') d++; else if(ch==='）'||ch===')') d=Math.max(0,d-1); else if(ch==='。'&&d===0){ out.push(c); c=''; } } if(c.trim()) out.push(c); return out.map(x=>x.trim()).filter(Boolean); }
const HEAT_RE=/(ごく弱火|弱めの中火|強めの中火|弱火|中火|強火)/g;
function stepPhase(t0,i,n){
  const t=t0.replace(/（[^（）]*）/g,'');
  const heat=/(火で|火にかけ|火を弱め|熱し|℃|オーブン|レンジ|トースター|グリル|蒸し器|炊飯器|ゆでる|ゆで、|ゆでて|揚げる|揚げ、|揚げて|焼く|焼き、|焼いて|炒め|煮る|煮て|煮立|煮詰|沸騰|蒸す|蒸し焼き|温め|炊く|焼き色)/.test(t);
  const fin=/(器に盛|皿に盛|盛り付|盛る|添える|をのせる|をかける|をふる。?$|切り分け|完成)/.test(t);
  if(/(室温に戻|冷蔵庫から出|砂抜き|水切り|浸水|もどす|戻す)/.test(t)&&!/(火にかけ|熱し|ゆで|揚げ|炒め)/.test(t)) return '下ごしらえ';
  if(i===n-1&&(fin||/火を止め/.test(t)||!heat)) return '仕上げ';
  if(heat&&!/^火を止め/.test(t)) return '加熱';
  if(fin&&i>=n-2) return '仕上げ';
  if(/(冷蔵庫|冷やし固|おく。|漬ける|休ませ|寝かせ|冷ます|発酵)/.test(t)) return '待つ';
  return '下ごしらえ';
}

function nice(g,ug,u){
  if(!ug) return `${Math.round(g/5)*5}g`;
  const q=g/ug;
  if(ug<=60) return `${Math.max(1,Math.round(q))}${u}`;
  if(q>=1) return `${Math.round(q*2)/2}${u}`;
  const fr=[[1/8,'1/8'],[1/6,'1/6'],[1/4,'1/4'],[1/3,'1/3'],[1/2,'1/2'],[2/3,'2/3'],[3/4,'3/4']];
  let best=fr[0]; for(const x of fr) if(Math.abs(x[0]-q)<Math.abs(best[0]-q)) best=x;
  return `${best[1]}${u}`;
}
function scaleQty(s,k){
  if(Math.abs(k-1)<1e-9||/適量|少々|適宜/.test(s)) return s;
  return s.replace(/(\d+)\/(\d+)|(\d+(?:\.\d+)?)/,(m0,a,b,c)=>{
    const v=(a?a/b:+c)*k; const r=Math.round(v*4)/4;
    if(r<1&&r>0){const map={0.25:'1/4',0.5:'1/2',0.75:'3/4'}; return map[r]||String(R1(v));}
    return String(r||R1(v));
  });
}
function ingredients(r,serv){
  if(r.named){ const k=serv/r.d.s; return {main:r.d.ings.map(([n,q])=>[n,scaleQty(q,k)]),base:[],sea:r.d.seas.map(([n,q])=>[n,scaleQty(q,k)])}; }
  const {m,p,v,f}=r, k=serv/2;
  const pg=p.g*(m.pM||1)*serv, vg=120*(m.vM||1)*serv;
  const main=[[p.n,(p.ug?`${nice(pg,p.ug,p.u)}（${Math.round(pg/10)*10}g）`:`${Math.round(pg/10)*10}g`)],[v.n,`${Math.round(vg/10)*10}g`+(v.ug?`（約${nice(vg,v.ug,v.u)}）`:'')]];
  const base=[...(m.carb?CARB[m.carb].ing:[]),...m.ex].map(([n,q])=>[n,scaleQty(q,k)]);
  const sea=f.ing.map(([n,q])=>[n,scaleQty(q,k)]);
  return {main,base,sea};
}

const NAMEKEYS=(()=>{ const s=new Set(); for(let i=0;i<NAMED_N;i++){ const r=ALL[i]; [r.d.name,r.d.read,...r.d.alias].forEach(k=>{const h=hira(k).toLowerCase(); if(h.length>=2) s.add(h);}); } return [...s].sort((a,b)=>b.length-a.length); })();

const NEG=/^(の)?(は|が|を)?(抜き|ぬき|なし|無し|以外|嫌い|きらい|苦手|NG|ng|除く|いらない|不使用|抜いて|入れない)/;
const STOP=/(喜ぶ|よろこぶ|好き|人気|大好き|できる|作れる|レシピ|料理|作り方|つくり方|食べたい|たべたい|作りたい|つくりたい|したい|おすすめ|オススメ|教えて|ください|今日|きょう|今夜|晩ごはん|晩御飯|晩ご飯|夕飯|夕食|昼ごはん|お昼|ランチ|夜ごはん|ごはん|ご飯|メニュー|献立|使った|使う|使って|以下|以内|くらい|程度|ような|みたいな|とか|なもの|もの|やつ|感じ|向け|向き|系|な|の|を|が|で|に|と|は|も|や|へ|、|。|!|\?|！|？|・|,|\s)+/g;

function parse(qs){
  let s=qs.normalize('NFKC').trim();
  const R={regs:null,areas:null,anyReg:false,ing:[],exIng:[],tags:0,exTags:0,m:null,exM:new Set(),fl:null,exFl:new Set(),cu:new Set(),exCu:new Set(),cats:null,nm:[],names:[],sea:null,maxK:null,maxT:null,sort:null,health:false,meal:false,chips:[],free:[],ignored:[]};
  s=s.replace(/(\d+)\s*(kcal|キロカロリー|カロリー|cal)/gi,(_,n)=>{R.maxK=+n;R.chips.push([`${n}kcal以下`]);return ' ';});
  s=s.replace(/(\d+)\s*分/g,(_,n)=>{R.maxT=+n;R.chips.push([`${n}分以内`]);return ' ';});
  // 料理名
  for(const k of NAMEKEYS){
    let i;
    while((i=hira(s).toLowerCase().indexOf(k))!==-1){
      const nm=s.slice(i+k.length).match(NEG);
      if(nm){ R.exNames=(R.exNames||[]); R.exNames.push(k); R.chips.push([s.slice(i,i+k.length)+' 以外',true]); }
      else { R.names.push(k); R.chips.push([s.slice(i,i+k.length)]); }
      s=s.slice(0,i)+' '+s.slice(i+k.length+(nm?nm[0].length:0));
    }
  }
  for(const e of KW){
    let i;
    while((i=s.indexOf(e.a))!==-1){
      const nm=s.slice(i+e.a.length).match(NEG);
      apply(R,e,!!nm);
      s=s.slice(0,i)+' '+s.slice(i+e.a.length+(nm?nm[0].length:0));
    }
  }
  const toks=s.replace(STOP,' ').split(/\s+/).filter(x=>x.length>=2);
  for(const tk of toks){ const h=hira(tk).toLowerCase(); if(ALL.some(r=>r.textH.includes(h))){R.free.push(h);R.chips.push([`「${tk}」`]);} else R.ignored.push(tk); }
  return R;
}
function apply(R,e,neg){
  const ch=(l)=>{ if(!R.chips.some(c=>c[0]===l)) R.chips.push([l,neg]); };
  switch(e.t){
    case 'ing': (neg?R.exIng:R.ing).push(e); ch(e.label+(neg?' 抜き':'')); break;
    case 'tag': if(neg) R.exTags|=T[e.tag]; else {R.tags|=T[e.tag]; if(e.sort&&!R.sort) R.sort=e.sort;} ch(TL[e.tag]+(neg?' 以外':'')); break;
    case 'health': R.health=true; if(!R.sort) R.sort='health'; ch('ヘルシー'); break;
    case 'sea': R.sea=e.sea; ch(`${e.sea}が旬`); break;
    case 'meal': R.meal=true; ch('朝ごはん向き'); break;
    case 'm': if(neg) e.ids.forEach(x=>R.exM.add(x)); else { R.m=R.m||new Set(); e.ids.forEach(x=>R.m.add(x)); if(e.fl){R.fl=R.fl||new Set();R.fl.add(e.fl);} } ch(e.label+(neg?' 以外':'')); break;
    case 'nm': if(!neg) R.nm.push(e.keys); else (R.exNames=(R.exNames||[])).push(...e.keys); ch(e.label+(neg?' 以外':'')); break;
    case 'cat': if(!neg){ R.cats=R.cats||new Set(); e.cats.forEach(c=>R.cats.add(c)); if(e.cu) R.cu.add(e.cu); } ch(e.label+(neg?' 以外':'')); break;
    case 'fl': if(neg) e.ids.forEach(x=>R.exFl.add(x)); else { R.fl=R.fl||new Set(); e.ids.forEach(x=>R.fl.add(x)); } ch(e.label+(neg?' 以外':'')); break;
    case 'cu': if(neg) R.exCu.add(e.cu); else R.cu.add(e.cu); ch(e.cu+(neg?' 以外':'')); break;
    case 'arr': R.arr=true; ch('アレンジ料理'); break;
    case 'reg': if(!neg){ if(e.area){ R.areas=R.areas||new Set(); R.areas.add(e.area); } else if(e.regs){ R.regs=R.regs||new Set(); e.regs.forEach(x=>R.regs.add(x)); } else R.anyReg=true; } ch(e.label); break;
  }
}
const matchG=(g,r)=>r.ings.some(n=>g.s.has(n)||(g.sub&&g.sub.some(k=>n.includes(k)))||(g.cat&&(dbGet(n)||{}).cat===g.cat))||(!!g.fl&&r.fls.has(g.fl));
function runFilter(R,uiTags,uiCu){
  const mask=R.tags|uiTags, ex=R.exTags;
  const cuSet=new Set(R.cu); if(uiCu) cuSet.add(uiCu);
  return POOL.filter(r=>{
    if((r.tg&mask)!==mask||(r.tg&ex)) return false;
    if(R.names.length&&!R.names.some(k=>r.nameH.includes(k))) return false;
    if(R.exNames&&R.exNames.some(k=>r.nameH.includes(k))) return false;
    for(const keys of R.nm) if(!keys.some(k=>r.nameOnly.includes(k))) return false;
    for(const g of R.exIng) if(matchG(g,r)) return false;
    for(const g of R.ing) if(!matchG(g,r)) return false;
    if(R.m&&![...R.m].some(x=>r.ms.has(x))) return false;
    if([...R.exM].some(x=>r.ms.has(x))) return false;
    if(R.fl&&![...R.fl].some(x=>r.fls.has(x))) return false;
    if([...R.exFl].some(x=>r.fls.has(x))) return false;
    if(R.cats&&!R.cats.has(r.cat)) return false;
    if((r.cat==='タレ・調味料'||r.cat==='手作り麺・皮')&&!(R.cats&&R.cats.has(r.cat))&&!R.names.length&&!R.free.length&&!R.nm.length) return false;
    if(R.arr&&!(r.baseName||r.relBase)) return false;
    if(R.anyReg&&!r.region) return false;
    if((R.regs||R.areas)&&!((R.regs&&R.regs.has(r.region))||(R.areas&&R.areas.has(r.area)))) return false;
    if(cuSet.size&&!cuSet.has(r.cu)) return false;
    if(R.exCu.has(r.cu)) return false;
    if(R.sea&&!r.seas.includes(R.sea)) return false;
    if(R.maxK&&r.kcal>R.maxK) return false;
    if(R.maxT&&r.t>R.maxT) return false;
    if(R.health&&r.h<60) return false;
    if(R.meal&&(r.t>20||r.kcal>600||r.ms.has('age')||r.ms.has('takikomi')||r.cat==='鍋'||r.cat==='おやつ')) return false;
    for(const f of R.free) if(!r.textH.includes(f)) return false;
    return true;
  });
}

function spreadPairs(list){
  const seen=new Set(),first=[],rest=[];
  for(const r of list){const k=r.named?'n'+r.id:r.k1+'|'+r.k2+'|'+r.mk; (seen.has(k)?rest:first).push(r); seen.add(k);}
  return first.concat(rest);
}

  let list=(R.ignored.length&&!R.chips.length&&!S.tags&&!S.cu&&!S.cat)?[]:runFilter(R,S.tags,S.cu);
  const sortKey=S.sort!=='auto'?S.sort:(R.sort||'auto');
  if(sortKey==='auto') list.sort(byRS); else list.sort(SORTS[sortKey].fn);
  if(sortKey==='auto'||sortKey==='health'){ list=spreadPairs(list); list=list.filter(r=>r.named).concat(list.filter(r=>!r.named)); }

/* ===================== 冷蔵庫から探す ===================== */
const FR_GARN=new Set(['小ねぎ','大葉','のり','パクチー','三つ葉','紅しょうが','かつお節','バジル','パセリ','レモン','天かす','いりごま','黒ごま','白ごま','すりごま','せり','えごまの葉','桜でんぶ','乾燥わかめ']);
const FR_ASSUME=/^(水|湯|冷水|氷|ぬるま湯|塩|砂糖|しょうゆ|酢|みそ|味噌|サラダ油|ごま油|オリーブオイル|揚げ油|酒|みりん|片栗粉|薄力粉|小麦粉|パン粉|こしょう|塩・こしょう|黒こしょう|だし|ご飯|米)$/;
const FR_SUBS=[
 ['豚バラ肉','豚こま切れ肉'],['豚ロース肉','豚肩ロース肉','豚ヒレ肉'],['豚こま切れ肉','豚肩ロース肉'],
 ['牛こま切れ肉','牛ロース肉','牛もも肉','牛もも肉ブロック'],
 ['鶏もも肉','鶏むね肉','骨付き鶏もも肉'],
 ['手羽元','手羽先'],
 ['合いびき肉','豚ひき肉','鶏ひき肉'],
 ['木綿豆腐','絹ごし豆腐'],
 ['むきえび','えび'],
 ['生鮭','サーモン'],
 ['たら','鯛'],
 ['ピザ用チーズ','スライスチーズ'],
 ['ベーコン','ハム','ウインナー'],
 ['トマト','ミニトマト'],
];
const FR_SUBMAP={}; FR_SUBS.forEach(g=>g.forEach(n=>FR_SUBMAP[n]=[...new Set([...(FR_SUBMAP[n]||[]),...g])]));
const FR_KINOKO=/しいたけ|しめじ|まいたけ|えのき|エリンギ|マッシュルーム|なめこ/;
const FR_GROUPS=[['meat','肉・加工肉'],['fish','魚介'],['eggsoy','卵・豆腐・大豆'],['veg','野菜'],['kinoko','きのこ'],['grain','ご飯・麺・パン・粉'],['dairy','乳製品'],['etc','果物・その他']];
function frGroupOf(n){ const e=dbGet(n); const c=e?e.cat:''; if(FR_KINOKO.test(n)) return 'kinoko'; if(c==='egg'||c==='soy') return 'eggsoy'; if(c==='meat'||c==='fish'||c==='veg'||c==='grain'||c==='dairy') return c; if(c==='fruit'||c==='sweet'||c==='other') return 'etc'; return null; }
const frAssumed=n=>{ if(FR_ASSUME.test(n)) return true; const e=dbGet(n); return !e||e.cat==='season'; };
function frReq(r){
  if(r._fr) return r._fr;
  const out=[], seen=new Set();
  const src=r.named?r.d.ings:r.ings.map(n=>[n,'']);
  for(const [n0,q] of src){ const n=canon(n0); if(seen.has(n)||frAssumed(n)) continue; seen.add(n); out.push({n,opt:/適量|少々|適宜|お好み/.test(q)||(FR_GARN.has(n)&&!/(\d{2,}\s*g|束)/.test(q))}); }
  return r._fr=out;
}
// 食材の一覧（よく使う順）
const FR_ITEMS=(()=>{ const cnt={}; ALL.forEach(r=>{ if(!r.named) return; frReq(r).forEach(x=>{ cnt[x.n]=(cnt[x.n]||0)+(x.opt?.3:1); }); });
  PR.forEach(p=>cnt[p.n]=(cnt[p.n]||0)+3); VG.forEach(v=>cnt[v.n]=(cnt[v.n]||0)+3);
  const g={}; Object.keys(cnt).forEach(n=>{ const k=frGroupOf(n); if(!k) return; (g[k]=g[k]||[]).push(n); });
  for(const k in g) g[k].sort((a,b)=>cnt[b]-cnt[a]);
  return g; })();
let pantry=(()=>{ const v=store.get(SK+'pantry',{have:[],must:[]}); return {have:new Set(v.have||[]),must:new Set(v.must||[])}; })();
const FR={q:'',cat:'',more:{}};
function savePantry(){ store.set(SK+'pantry',{have:[...pantry.have],must:[...pantry.must]}); badges(); }
function frHas(n){ if(pantry.have.has(n)) return 1; const g=FR_SUBMAP[n]; if(g&&g.some(x=>pantry.have.has(x))) return 2; return 0; }
function frSubName(n){ const g=FR_SUBMAP[n]; return g?g.find(x=>pantry.have.has(x)):null; }
const FR_CATS=[['','すべて'],['主菜','主菜'],['副菜','副菜'],['汁物','汁物'],['鍋','鍋'],['ご飯もの','ご飯もの'],['麺','麺'],['パン・朝食','パン・朝食'],['おやつ','おやつ'],['一品','おつまみ']];
function frMatch(){
  if(!pantry.have.size) return null;
  const must=[...pantry.must].filter(n=>pantry.have.has(n));
  const B=[[],[],[]], combos=[];
  for(const r of POOL){
    if(r.cat==='タレ・調味料'||r.cat==='手作り麺・皮') continue;
    if(FR.cat&&r.cat!==FR.cat) continue;
    const req=frReq(r); const need=req.filter(x=>!x.opt); if(!need.length) continue;
    if(must.length&&!must.every(m=>req.some(x=>x.n===m||(FR_SUBMAP[x.n]||[]).includes(m)))) continue;
    let hit=0, sub=[], miss=[];
    for(const x of need){ const h=frHas(x.n); if(h===1) hit++; else if(h===2){ hit++; sub.push([x.n,frSubName(x.n)]); } else miss.push(x.n); }
    if(!hit) continue;
    if(!r.named){ if(!miss.length&&!sub.length) combos.push({r,hit,sub,miss}); continue; }
    if(miss.length>2) continue;
    if(miss.length&&hit<Math.min(2,need.length-0)&&need.length>2) continue;
    const opt=req.filter(x=>x.opt&&!frHas(x.n)).map(x=>x.n);
    B[miss.length].push({r,hit,sub,miss,opt,rate:hit/need.length});
  }
  const sc=m=>m.hit-m.sub.length*.6-(m.r.cat==='おやつ'&&!FR.cat?1.2:0)+m.rate*.5;
  const srt=(a,b)=>(sc(b)-sc(a))||byRS(a.r,b.r);
  B.forEach(b=>b.sort(srt)); combos.sort((a,b)=>byRS(a.r,b.r));
  return {B,combos:diverse(combos.map(x=>x.r),12)};
}
function frCard(m){
  const extra=[m.miss.length?`<span class="fm-miss">あと <b>${m.miss.map(esc).join('・')}</b></span>`:`<span class="fm-ok">✓ 家にある食材で作れる</span>`,
    m.sub.length?`<span class="fm-sub">${m.sub.map(([a,b])=>`${esc(a)}→${esc(b)}で代用`).join('、')}</span>`:'',
    m.opt&&m.opt.length?`<span class="fm-opt">あれば：${m.opt.slice(0,3).map(esc).join('・')}</span>`:''].join('');
  return card(m.r).replace('<div class="tags">',`<p class="fm">${extra}</p><div class="tags">`);
}

  const M=frMatch();

    return `<section class="block"><div class="bh"><h2>${title} <span class="note">${list.length}品</span></h2>${note?`<span class="note">${note}</span>`:''}</div><div class="grid">${list.slice(0,lim).map(frCard).join('')}</div>${list.length>lim?`<button class="btn wide" type="button" data-frmore="r${key}">もっと見る（残り${list.length-lim}品）</button>`:''}</section>`; };
  const total=M?M.B[0].length+M.B[1].length+M.B[2].length+M.combos.length:0;
  $('#view').innerHTML=`<section class="block fr-top">
      <div class="bh"><h2>冷蔵庫から探す</h2><span class="note">家にある食材をタップしてください</span></div>
      <div class="fsel">${sel.length?`<div class="fsel-h"><b>選んだ食材 ${sel.length}品</b><button type="button" class="linkish" id="frClear">すべて外す</button></div>
        <div class="fchips">${sel.map(n=>`<span class="ftag${pantry.must.has(n)?' must':''}"><button type="button" data-frmust="${esc(n)}" aria-pressed="${pantry.must.has(n)}" title="必ず使う">${pantry.must.has(n)?'★':'☆'}</button>${esc(n.replace(/\(.+?\)/,''))}<button type="button" data-fr="${esc(n)}" aria-label="${esc(n)}を外す">×</button></span>`).join('')}</div>
        <p class="hint">☆をタップすると「必ず使いたい食材」になります（使い切りたい食材に）。ご飯（お米）と、しょうゆ・塩・砂糖・油などの基本調味料は家にある前提で探します。</p>`

      ${groups||`<p class="hint">「${esc(FR.q)}」に合う食材が見つかりません。</p>`}
    </section>
    <div id="fr-res"></div>
    ${M?`<section class="block"><div class="fcats">${FR_CATS.map(([c,l])=>`<button type="button" class="chip" data-frcat="${c}" aria-pressed="${FR.cat===c}">${l}</button>`).join('')}</div></section>
      ${total?'':`<section class="block"><div class="empty"><h3>ぴったりの料理が見つかりませんでした</h3><p>食材をもう少し追加するか、★（必ず使う）や料理の種類のしぼり込みを外してみてください。</p></div></section>`}
      ${sec('今ある食材だけで作れる','',M.B[0],0)}
      ${sec('あと1品あれば作れる','買い足すのは1つだけ',M.B[1],1)}
      ${sec('あと2品あれば作れる','',M.B[2],2)}
      ${M.combos.length?`<section class="block"><div class="bh"><h2>家の食材でできるアレンジ</h2><span class="note">選んだ肉・魚と野菜の組み合わせ</span></div><div class="grid">${M.combos.map(card).join('')}</div></section>`:''}`:''}`;
}
